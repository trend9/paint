<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="background_elements" stroke="black" stroke-width="5" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Meadow ground line -->
    <path d="M0 650 Q150 600 400 650 T800 650" fill="white" stroke="black" stroke-width="5"/>

    <!-- Clouds -->
    <path d="M100 150 C70 150 50 180 60 210 S100 250 140 250 H260 C300 250 320 220 310 190 S280 150 240 150 H100 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M550 100 C520 100 500 130 510 160 S550 200 590 200 H710 C750 200 770 170 760 140 S730 100 690 100 H550 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M300 250 C270 250 250 280 260 310 S300 350 340 350 H460 C500 350 520 320 510 290 S480 250 440 250 H300 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Trees -->
    <g id="tree_left">
      <rect x="50" y="450" width="70" height="250" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
      <path d="M30 460 C10 400 40 350 70 340 S130 310 150 350 C170 390 140 440 120 460 Z" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="100" cy="400" rx="80" ry="100" fill="white" stroke="black" stroke-width="5"/>
    </g>
    <g id="tree_right">
      <rect x="680" y="400" width="70" height="300" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
      <path d="M660 410 C640 350 670 300 700 290 S760 260 780 300 C800 340 770 390 750 410 Z" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="710" cy="350" rx="80" ry="100" fill="white" stroke="black" stroke-width="5"/>
    </g>
  </g>

  <g id="picnic_items" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Picnic blanket -->
    <rect x="250" y="680" width="350" height="180" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <!-- Simple folds for blanket -->
    <path d="M250 780 Q300 760 350 780" fill="none" stroke="black" stroke-width="3"/>
    <path d="M600 750 Q550 730 500 750" fill="none" stroke="black" stroke-width="3"/>
  </g>

  <g id="dinosaurs" stroke="black" stroke-width="5" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- T-Rex -->
    <g id="t-rex">
      <path d="M220 850 C200 800 200 700 250 650 C300 600 350 600 400 650 L400 750 C400 800 350 850 300 850 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M300 650 Q320 600 350 600 C400 600 450 650 450 700 S400 750 350 750 C300 750 250 700 250 650 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Back/hip -->
      <path d="M320 650 Q420 500 450 500 C480 500 500 530 500 560 C500 600 470 650 420 650 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
      <path d="M470 560 Q480 570 470 580 Q460 570 470 560 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Nose tip -->
      <ellipse cx="450" cy="530" rx="10" ry="15" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="450" cy="530" r="3" fill="black" stroke="none"/> <!-- Pupil -->
      <path d="M410 600 Q450 610 490 600" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth smile -->

      <!-- Small arms -->
      <path d="M400 680 Q420 670 430 690 Q440 710 420 720 Q400 710 400 680 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M410 695 Q420 690 425 695 Q430 700 420 705 Q410 700 410 695 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Hand holding sandwich -->
      <rect x="420" y="690" width="30" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/> <!-- Sandwich -->
      <path d="M420 695 L450 695 L450 705 L420 705 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Sandwich fillings -->

      <!-- Legs -->
      <path d="M290 850 Q280 900 300 920 H350 Q370 900 360 850 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M300 920 L310 930 L340 930 L350 920" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->
      <path d="M360 850 Q350 900 370 920 H420 Q440 900 430 850 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M370 920 L380 930 L410 930 L420 920" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

      <!-- Tail -->
      <path d="M220 850 Q180 880 150 850 Q120 820 150 780 Q180 750 220 750 Z" fill="white" stroke="black" stroke-width="5"/>
    </g>

    <!-- Triceratops -->
    <g id="triceratops">
      <path d="M500 800 Q480 750 500 700 Q520 650 570 650 C620 650 650 700 650 750 S620 800 570 800 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M570 800 Q550 850 570 870 H630 Q650 850 630 800 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Back leg -->
      <path d="M570 870 L580 880 L620 880 L630 870" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->
      <path d="M520 800 Q500 850 520 870 H580 Q600 850 580 800 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Front leg -->
      <path d="M520 870 L530 880 L570 880 L580 870" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

      <path d="M570 650 Q630 600 680 600 C730 600 750 650 700 700 C650 750 570 700 570 650 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
      <ellipse cx="680" cy="650" rx="10" ry="15" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="680" cy="650" r="3" fill="black" stroke="none"/> <!-- Pupil -->
      <path d="M640 690 Q680 700 720 690" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth smile -->

      <!-- Frill -->
      <path d="M680 600 Q750 550 770 590 C790 630 750 670 680 670 C610 670 600 630 630 600 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Horns -->
      <path d="M700 590 Q720 570 700 550" fill="white" stroke="black" stroke-width="4"/>
      <path d="M740 600 Q760 580 740 560" fill="white" stroke="black" stroke-width="4"/>
      <path d="M680 670 Q690 660 680 650" fill="white" stroke="black" stroke-width="4"/> <!-- Nose horn -->

      <!-- Fruit basket -->
      <ellipse cx="600" cy="740" rx="50" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <rect x="550" y="720" width="100" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <path d="M570 730 C560 720 555 710 560 700" fill="white" stroke="black" stroke-width="3"/> <!-- Handle part 1 -->
      <path d="M630 730 C640 720 645 710 640 700" fill="white" stroke="black" stroke-width="3"/> <!-- Handle part 2 -->
      <path d="M570 700 Q600 680 630 700" fill="white" stroke="black" stroke-width="3"/> <!-- Handle top -->
      <circle cx="580" cy="725" r="5" fill="white" stroke="black" stroke-width="2"/> <!-- Fruit 1 -->
      <circle cx="620" cy="730" r="5" fill="white" stroke="black" stroke-width="2"/> <!-- Fruit 2 -->
      <ellipse cx="600" cy="720" rx="8" ry="6" fill="white" stroke="black" stroke-width="2"/> <!-- Fruit 3 -->
    </g>

    <!-- Brontosaurus -->
    <g id="brontosaurus">
      <path d="M120 700 C100 600 150 550 200 550 S280 600 280 700 Q280 750 230 780 S170 750 120 700 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M150 780 Q130 830 150 850 H200 Q220 830 200 780 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Front leg -->
      <path d="M150 850 L160 860 L190 860 L200 850" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->
      <path d="M180 780 Q160 830 180 850 H230 Q250 830 230 780 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Back leg -->
      <path d="M180 850 L190 860 L220 860 L230 850" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

      <!-- Neck and Head -->
      <path d="M200 550 C250 500 280 400 270 300 Q260 250 200 200 Q140 150 100 200 Q60 250 70 300 C80 350 100 450 150 500 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Neck -->
      <path d="M70 300 Q50 350 80 380 Q110 410 130 380 Q150 350 120 300 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
      <ellipse cx="110" cy="340" rx="8" ry="12" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="110" cy="340" r="3" fill="black" stroke="none"/> <!-- Pupil -->
      <path d="M80 370 Q100 380 120 370" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth smile -->

      <!-- Juice box -->
      <rect x="180" y="380" width="30" height="40" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/> <!-- Box -->
      <path d="M195 380 V360 M190 365 Q195 355 200 365" fill="none" stroke="black" stroke-width="3"/> <!-- Straw -->
      <path d="M180 390 H210 M180 400 H210 M180 410 H210" fill="none" stroke="black" stroke-width="2"/> <!-- Design on box -->
    </g>

    <!-- Pterodactyl -->
    <g id="pterodactyl">
      <path d="M400 300 Q450 250 500 250 Q550 250 550 300 Q550 350 500 350 Q450 350 400 300 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M450 250 Q480 200 450 180 Q420 160 390 180 Q360 200 390 230 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
      <ellipse cx="400" cy="200" rx="7" ry="10" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="400" cy="200" r="2" fill="black" stroke="none"/> <!-- Pupil -->
      <path d="M420 220 Q440 230 460 220" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth smile -->

      <!-- Wings -->
      <path d="M400 300 Q300 200 250 250 C200 300 250 350 300 350 Q350 350 400 300 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M400 300 Q500 200 550 250 C600 300 550 350 500 350 Q450 350 400 300 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M280 280 Q250 290 280 300" fill="none" stroke="black" stroke-width="3"/> <!-- Wing detail -->
      <path d="M520 280 Q550 290 520 300" fill="none" stroke="black" stroke-width="3"/> <!-- Wing detail -->

      <!-- Picnic blanket held by Pterodactyl -->
      <path d="M470 350 Q450 400 400 400 Q350 400 330 350" fill="white" stroke="black" stroke-width="4"/> <!-- Holding part -->
      <rect x="350" y="380" width="100" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/> <!-- Rolled blanket -->
      <path d="M360 390 L440 390 M360 410 L440 410" fill="none" stroke="black" stroke-width="3"/> <!-- Blanket pattern -->
    </g>
  </g>
</svg>