<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Common styling for outlines -->
  <defs>
    <style>
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .thin-outline {
        stroke: black;
        stroke-width: 3;
        fill: white;
      }
      .no-fill-thin-outline {
        stroke: black;
        stroke-width: 3;
        fill: none;
      }
    </style>
  </defs>

  <!-- Ground / Forest Floor -->
  <g id="ground">
    <path class="outline" d="M0 900 Q 200 880, 400 900 Q 600 920, 800 900 L 800 1000 L 0 1000 Z"/>
  </g>

  <!-- Whimsical Mushroom House Group -->
  <g id="mushroom-house">
    <!-- Mushroom Stem -->
    <rect x="325" y="650" width="150" height="250" rx="25" ry="25" class="outline"/>
    <!-- Mushroom Cap -->
    <path class="outline" d="M275 650 C200 550, 250 400, 400 350 C550 400, 600 550, 525 650 Z"/>
    <!-- Door -->
    <rect x="365" y="770" width="70" height="100" rx="15" ry="15" class="outline"/>
    <!-- Door handle (small circle) -->
    <circle cx="420" cy="820" r="5" class="thin-outline"/>
    <!-- Windows on cap -->
    <circle cx="330" cy="480" r="30" class="outline"/>
    <circle cx="470" cy="480" r="30" class="outline"/>
  </g>

  <!-- Cute Tiny Fairy Group -->
  <g id="fairy">
    <!-- Body - sitting -->
    <path class="outline" d="M240 790 C220 760, 280 760, 260 790 Q 250 820, 240 790 Z"/>
    <!-- Head -->
    <circle cx="250" cy="710" r="45" class="outline"/>
    <!-- Eyes - big round eyes -->
    <circle cx="230" cy="700" r="15" class="thin-outline"/>
    <circle cx="270" cy="700" r="15" class="thin-outline"/>
    <!-- Pupils (inner part of eye) -->
    <circle cx="230" cy="705" r="6" class="thin-outline"/>
    <circle cx="270" cy="705" r="6" class="thin-outline"/>
    <!-- Mouth - happy and friendly expression -->
    <path d="M230 725 Q 250 740, 270 725" class="no-fill-thin-outline"/>
    <!-- Cheeks -->
    <circle cx="220" cy="720" r="8" class="thin-outline"/>
    <circle cx="280" cy="720" r="8" class="thin-outline"/>
    <!-- Arms -->
    <path class="thin-outline" d="M220 750 Q 180 770, 170 800"/>
    <path class="thin-outline" d="M280 750 Q 320 770, 330 800"/>
    <!-- Hands -->
    <circle cx="170" cy="800" r="10" class="thin-outline"/>
    <circle cx="330" cy="800" r="10" class="thin-outline"/>
    <!-- Legs -->
    <path class="thin-outline" d="M245 800 Q 220 840, 210 870"/>
    <path class="thin-outline" d="M255 800 Q 280 840, 290 870"/>
    <!-- Feet -->
    <circle cx="210" cy="870" r="10" class="thin-outline"/>
    <circle cx="290" cy="870" r="10" class="thin-outline"/>
    <!-- Wings -->
    <path class="outline" d="M200 700 C150 600, 150 750, 200 800 Z"/>
    <path class="outline" d="M300 700 C350 600, 350 750, 300 800 Z"/>
  </g>

  <!-- Simple Flowers, Leaves, and Berries -->
  <g id="forest-decorations">
    <!-- Flower 1 (left) -->
    <g transform="translate(100 830)">
      <circle cx="0" cy="0" r="15" class="outline"/> <!-- Center -->
      <circle cx="0" cy="-25" r="10" class="outline"/>
      <circle cx="-20" cy="-10" r="10" class="outline"/>
      <circle cx="-20" cy="10" r="10" class="outline"/>
      <circle cx="20" cy="-10" r="10" class="outline"/>
      <circle cx="20" cy="10" r="10" class="outline"/>
      <path d="M0 15 L0 60" class="no-fill-thin-outline"/> <!-- Stem -->
      <ellipse cx="-10" cy="45" rx="15" ry="8" transform="rotate(-20 -10 45)" class="outline"/> <!-- Leaf -->
    </g>

    <!-- Flower 2 (right) -->
    <g transform="translate(680 840)">
      <circle cx="0" cy="0" r="15" class="outline"/> <!-- Center -->
      <path d="M0 -15 Q -10 -25, -20 -15 Q -10 -5, 0 -15 Z" class="outline"/>
      <path d="M0 -15 Q 10 -25, 20 -15 Q 10 -5, 0 -15 Z" class="outline"/>
      <path d="M-15 0 Q -25 -10, -15 -20 Q -5 -10, -15 0 Z" class="outline"/>
      <path d="M15 0 Q 25 -10, 15 -20 Q 5 -10, 15 0 Z" class="outline"/>
      <path d="M0 15 Q -10 25, -20 15 Q -10 5, 0 15 Z" class="outline"/>
      <path d="M0 15 Q 10 25, 20 15 Q 10 5, 0 15 Z" class="outline"/>
      <path d="M0 15 L0 50" class="no-fill-thin-outline"/> <!-- Stem -->
      <ellipse cx="10" cy="35" rx="15" ry="8" transform="rotate(20 10 35)" class="outline"/> <!-- Leaf -->
    </g>

    <!-- Leaves (scattered) -->
    <ellipse cx="50" cy="920" rx="30" ry="15" transform="rotate(20 50 920)" class="outline"/>
    <ellipse cx="750" cy="930" rx="30" ry="15" transform="rotate(-25 750 930)" class="outline"/>
    <ellipse cx="200" cy="910" rx="25" ry="12" transform="rotate(-5 200 910)" class="outline"/>

    <!-- Berries (cluster) -->
    <g transform="translate(720 860)">
      <path d="M0 0 Q -10 -15, 10 -15" class="no-fill-thin-outline"/> <!-- Branch -->
      <circle cx="-10" cy="-20" r="8" class="outline"/>
      <circle cx="10" cy="-20" r="8" class="outline"/>
      <circle cx="0" cy="-30" r="8" class="outline"/>
    </g>
    <g transform="translate(80 880)">
      <path d="M0 0 Q -10 -15, 10 -15" class="no-fill-thin-outline"/> <!-- Branch -->
      <circle cx="-10" cy="-20" r="8" class="outline"/>
      <circle cx="10" cy="-20" r="8" class="outline"/>
      <circle cx="0" cy="-30" r="8" class="outline"/>
    </g>
  </g>
</svg>