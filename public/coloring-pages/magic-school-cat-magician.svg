<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Blackboard -->
  <g id="blackboard">
    <rect x="100" y="150" width="600" height="700" rx="40" ry="40" fill="white" stroke="black" stroke-width="5"/>
    <!-- Blackboard elements -->
    <g id="blackboard-decorations">
      <!-- Star 1 (rounded points) -->
      <path d="M250 250 L260 280 L290 285 L270 305 L275 335 L250 320 L225 335 L230 305 L210 285 L240 280 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
      <!-- Star 2 (rounded points) -->
      <path d="M600 300 L610 330 L640 335 L620 355 L625 385 L600 370 L575 385 L580 355 L560 335 L590 330 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
      <!-- Potion Bottle -->
      <g id="potion-bottle">
        <rect x="250" y="550" width="100" height="180" rx="30" ry="30" fill="white" stroke="black" stroke-width="4"/>
        <path d="M280 550 C280 530 320 530 320 550 L320 560 L280 560 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Neck of bottle -->
        <circle cx="300" cy="510" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Bubble 1 -->
        <circle cx="320" cy="500" r="12" fill="white" stroke="black" stroke-width="3"/> <!-- Bubble 2 -->
        <circle cx="280" cy="505" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Bubble 3 -->
      </g>
    </g>
  </g>

  <!-- Cat Magician -->
  <g id="cat-magician">
    <!-- Body -->
    <ellipse cx="400" cy="700" rx="150" ry="120" fill="white" stroke="black" stroke-width="5"/>
    <!-- Head -->
    <circle cx="400" cy="500" r="100" fill="white" stroke="black" stroke-width="5"/>
    <!-- Ears -->
    <path d="M330 460 Q340 400 380 410 Q370 450 330 460 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Left ear -->
    <path d="M470 460 Q460 400 420 410 Q430 450 470 460 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Right ear -->

    <!-- Face Features -->
    <!-- Eyes -->
    <circle cx="360" cy="480" r="20" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="440" cy="480" r="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <path d="M400 510 L390 530 L410 530 Z" fill="white" stroke="black" stroke-width="3"/>
    <!-- Mouth (bright smile) -->
    <path d="M350 540 Q400 580 450 540" fill="none" stroke="black" stroke-width="4"/>
    <!-- Whiskers -->
    <line x1="330" y1="530" x2="300" y2="520" stroke="black" stroke-width="3"/>
    <line x1="330" y1="540" x2="300" y2="540" stroke="black" stroke-width="3"/>
    <line x1="330" y1="550" x2="300" y2="560" stroke="black" stroke-width="3"/>
    <line x1="470" y1="530" x2="500" y2="520" stroke="black" stroke-width="3"/>
    <line x1="470" y1="540" x2="500" y2="540" stroke="black" stroke-width="3"/>
    <line x1="470" y1="550" x2="500" y2="560" stroke="black" stroke-width="3"/>

    <!-- Left Arm/Paw (holding wand) -->
    <path d="M320 620 Q280 650 300 700 Q320 720 350 710 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Right Arm/Paw -->
    <path d="M480 620 Q520 650 500 700 Q480 720 450 710 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Legs/Feet -->
    <path d="M350 780 Q330 820 370 830 L430 830 Q470 820 450 780 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Combined simplified legs -->

    <!-- Tail -->
    <path d="M540 650 C600 600 600 750 540 780" fill="none" stroke="black" stroke-width="5"/>

    <!-- Magician Hat -->
    <g id="magician-hat">
      <ellipse cx="400" cy="420" rx="100" ry="30" fill="white" stroke="black" stroke-width="5"/> <!-- Brim -->
      <path d="M320 420 L350 300 Q400 250 450 300 L480 420 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Pointy part -->
    </g>

    <!-- Cape -->
    <path d="M300 600 C250 650 250 750 300 780 L500 780 C550 750 550 650 500 600 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Magic Wand (held by left paw) -->
    <g id="magic-wand" transform="rotate(-20 300 680)"> <!-- Rotate around the lower part of the wand where the paw would hold it -->
      <rect x="295" y="590" width="10" height="90" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="300" cy="580" r="15" fill="white" stroke="black" stroke-width="4"/> <!-- Simple star at the tip of the wand, using a circle -->
    </g>
  </g>
</svg>