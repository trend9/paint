<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" stroke-linecap="round" stroke-linejoin="round">
  <!-- Magical School Background -->
  <g id="magical_school_background">
    <!-- Main school building -->
    <rect x="100" y="550" width="600" height="300" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <!-- Left tower -->
    <path d="M150 550 L180 400 L250 400 L280 550 Z" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="215" cy="380" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Tower top -->
    <!-- Right tower -->
    <path d="M520 550 L550 400 L620 400 L650 550 Z" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="585" cy="380" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Tower top -->
    <!-- Door -->
    <rect x="350" y="700" width="100" height="150" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Windows (simplified) -->
    <circle cx="200" cy="650" r="30" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="600" cy="650" r="30" fill="white" stroke="black" stroke-width="4"/>
    <rect x="300" y="590" width="50" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <rect x="450" y="590" width="50" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>

    <!-- Stars around the school -->
    <path d="M300,150 L320,200 L370,210 L330,240 L340,290 L300,260 L260,290 L270,240 L230,210 L280,200 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M650,100 L670,150 L720,160 L680,190 L690,240 L650,210 L610,240 L620,190 L580,160 L630,150 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M100,250 L120,300 L170,310 L130,340 L140,390 L100,360 L60,390 L70,340 L30,310 L80,300 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M450,50 L470,100 L520,110 L480,140 L490,190 L450,160 L410,190 L420,140 L380,110 L430,100 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M700,400 L720,450 L770,460 L730,490 L740,540 L700,510 L660,540 L670,490 L630,460 L680,450 Z" fill="white" stroke="black" stroke-width="3"/>

    <!-- Sparkles (simplified as small crosses) -->
    <g stroke="black" stroke-width="3" fill="white">
      <line x1="100" y1="50" x2="120" y2="70"/>
      <line x1="100" y1="70" x2="120" y2="50"/>
      <line x1="500" y1="200" x2="520" y2="220"/>
      <line x1="500" y1="220" x2="520" y2="200"/>
      <line x1="250" y1="450" x2="270" y2="470"/>
      <line x1="250" y1="470" x2="270" y2="450"/>
      <line x1="700" y1="150" x2="720" y2="170"/>
      <line x1="700" y1="170" x2="720" y2="150"/>
    </g>

  </g>

  <!-- Cat Magician -->
  <g id="cat_magician">
    <!-- Body -->
    <ellipse cx="400" cy="700" rx="150" ry="100" fill="white" stroke="black" stroke-width="5"/>
    <!-- Head -->
    <circle cx="400" cy="500" r="100" fill="white" stroke="black" stroke-width="5"/>
    <!-- Ears -->
    <path d="M330 420 L360 380 L390 420 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M470 420 L440 380 L410 420 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Eyes -->
    <circle cx="360" cy="480" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="440" cy="480" r="15" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <path d="M400 510 L395 520 L405 520 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth -->
    <path d="M380 530 Q400 545 420 530" fill="none" stroke="black" stroke-width="4"/>
    <!-- Whiskers -->
    <line x1="320" y1="500" x2="360" y2="505" stroke="black" stroke-width="3"/>
    <line x1="320" y1="510" x2="360" y2="510" stroke="black" stroke-width="3"/>
    <line x1="320" y1="520" x2="360" y2="515" stroke="black" stroke-width="3"/>
    <line x1="480" y1="500" x2="440" y2="505" stroke="black" stroke-width="3"/>
    <line x1="480" y1="510" x2="440" y2="510" stroke="black" stroke-width="3"/>
    <line x1="480" y1="520" x2="440" y2="515" stroke="black" stroke-width="3"/>

    <!-- Pointy Hat -->
    <path d="M350 400 L400 250 L450 400 A50 30 0 0 1 350 400 Z" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="400" cy="270" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Simplified star on hat as a circle -->
    
    <!-- Cape -->
    <path d="M300 550 Q250 650 300 750 Q350 780 400 750 Q450 780 500 750 Q550 650 500 550 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M300 550 C280 580 280 620 300 650" fill="none" stroke="black" stroke-width="4"/> <!-- Left Cape fold -->
    <path d="M500 550 C520 580 520 620 500 650" fill="none" stroke="black" stroke-width="4"/> <!-- Right Cape fold -->

    <!-- Arms/Paws -->
    <ellipse cx="280" cy="650" rx="40" ry="30" transform="rotate(-30 280 650)" fill="white" stroke="black" stroke-width="5"/> <!-- Left arm -->
    <ellipse cx="520" cy="650" rx="40" ry="30" transform="rotate(30 520 650)" fill="white" stroke="black" stroke-width="5"/> <!-- Right arm -->

    <!-- Magic Wand -->
    <g id="magic_wand">
      <line x1="470" y1="630" x2="550" y2="550" stroke="black" stroke-width="5"/>
      <!-- Star on wand -->
      <path d="M550,550 L560,535 L580,530 L565,545 L570,565 L550,555 L530,565 L535,545 L520,530 L540,535 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

  </g>
</svg>