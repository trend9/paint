<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the Magic School Backdrop -->
  <g id="magic-school-backdrop" stroke="black" stroke-width="4" fill="white">
    <!-- Main building body (simplified rounded rectangle) -->
    <rect x="550" y="400" width="200" height="400" rx="20" ry="20"/>
    <!-- Roof (simplified triangle) -->
    <path d="M530 400 L650 250 L770 400 Z" stroke-linejoin="round"/>
    <!-- Door (simplified rounded rectangle) -->
    <rect x="620" y="650" width="60" height="150" rx="10" ry="10"/>
    <!-- Windows (simplified rounded rectangles) -->
    <rect x="575" y="470" width="40" height="60" rx="5" ry="5"/>
    <rect x="685" y="470" width="40" height="60" rx="5" ry="5"/>
    <rect x="630" y="300" width="40" height="60" rx="5" ry="5"/>
    <!-- Simple stars in the sky (circles) -->
    <g stroke-width="3" fill="white">
      <circle cx="700" cy="100" r="15"/>
      <circle cx="600" cy="180" r="10"/>
      <circle cx="750" cy="220" r="12"/>
      <circle cx="560" cy="90" r="8"/>
    </g>
    <!-- Simple Moon (circle) -->
    <circle cx="700" cy="150" r="40"/>
  </g>

  <!-- Group for the Cute Cat Character -->
  <g id="magician-cat-character" stroke="black" stroke-width="4" fill="white">
    <!-- Cat body (large ellipse) -->
    <ellipse cx="400" cy="650" rx="100" ry="150"/>
    <!-- Cat head (circle) -->
    <circle cx="400" cy="450" r="80"/>
    <!-- Ears (simple curved paths) -->
    <path d="M340 420 C350 380 370 380 380 420 Z" stroke-linejoin="round"/>
    <path d="M420 420 C430 380 450 380 460 420 Z" stroke-linejoin="round"/>

    <!-- Cat face details -->
    <circle cx="370" cy="430" r="10" stroke-width="3"/> <!-- Left eye -->
    <circle cx="430" cy="430" r="10" stroke-width="3"/> <!-- Right eye -->
    <path d="M400 450 L395 460 L405 460 Z" stroke-width="3" stroke-linejoin="round"/> <!-- Nose -->
    <path d="M380 480 Q400 500 420 480" stroke-width="3" fill="none"/> <!-- Mouth -->
    <!-- Whiskers (simple lines) -->
    <line x1="320" y1="460" x2="360" y2="450" stroke-width="2"/>
    <line x1="320" y1="470" x2="360" y2="470" stroke-width="2"/>
    <line x1="320" y1="480" x2="360" y2="490" stroke-width="2"/>
    <line x1="440" y1="450" x2="480" y2="460" stroke-width="2"/>
    <line x1="440" y1="470" x2="480" y2="470" stroke-width="2"/>
    <line x1="440" y1="490" x2="480" y2="480" stroke-width="2"/>

    <!-- Paws (simple ellipses) -->
    <ellipse cx="340" cy="780" rx="40" ry="30" transform="rotate(-15 340 780)"/> <!-- Left front paw -->
    <ellipse cx="460" cy="780" rx="40" ry="30" transform="rotate(15 460 780)"/> <!-- Right front paw -->
    <!-- Hint of back paws behind body -->
    <ellipse cx="300" cy="700" rx="30" ry="20" transform="rotate(-25 300 700)" fill="none"/>
    <ellipse cx="500" cy="700" rx="30" ry="20" transform="rotate(25 500 700)" fill="none"/>

    <!-- Tail (simple curved path) -->
    <path d="M280 750 Q230 650 280 550 C330 570 320 670 280 750 Z" stroke-linejoin="round"/>

    <!-- Magician's Hat -->
    <g id="magician-hat">
      <ellipse cx="400" cy="390" rx="70" ry="20"/> <!-- Brim -->
      <path d="M330 390 L330 320 C330 300 350 280 400 280 C450 280 470 300 470 320 L470 390 Z"/> <!-- Top part of hat -->
      <ellipse cx="400" cy="280" rx="45" ry="15"/> <!-- Top ellipse for hat -->
    </g>

    <!-- Cape (simple curved path around the body) -->
    <path d="M300 550 C280 540 250 560 250 600 C250 700 280 750 350 750 L450 750 C520 750 550 700 550 600 C550 560 520 540 500 550 Z" stroke-linejoin="round"/>

    <!-- Magic Wand -->
    <g id="magic-wand">
      <!-- Wand stick (rounded rectangle, rotated to be held by left paw) -->
      <rect x="320" y="600" width="15" height="100" rx="5" ry="5" transform="rotate(-20 327.5 650)"/>
      <!-- Wand star tip (simple 8-point star path) -->
      <path d="M327.5 580 L332.5 595 L345 600 L332.5 605 L327.5 620 L322.5 605 L310 600 L322.5 595 Z" fill="white" stroke="black" stroke-width="3" transform="rotate(-20 327.5 650)"/>
    </g>

    <!-- Spell Effects around the wand tip (simple circles and stars) -->
    <g id="spell-effects" stroke-width="3" fill="white" transform="rotate(-20 327.5 650)">
      <circle cx="360" cy="570" r="10"/>
      <circle cx="375" cy="590" r="8"/>
      <path d="M360 560 L365 570 L375 575 L365 580 L360 590 L355 580 L345 575 L355 570 Z"/> <!-- Small star -->
      <path d="M390 560 L395 570 L405 575 L395 580 L390 590 L385 580 L375 575 L385 570 Z"/> <!-- Small star -->
    </g>
  </g>
</svg>