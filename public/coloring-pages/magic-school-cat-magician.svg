<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the entire scene -->
  <g id="magic_scene">

    <!-- Elevated Platform -->
    <rect x="150" y="700" width="500" height="80" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <path d="M 200 700 V 780 M 600 700 V 780" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 180 780 Q 200 850 400 850 Q 600 850 620 780" fill="white" stroke="black" stroke-width="5"/>

    <!-- Cat Magician -->
    <g id="cat_magician">
      <!-- Cloak -->
      <path d="M 330 450 C 250 500 200 650 250 690 H 550 C 600 650 550 500 470 450 L 400 440 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M 350 480 C 300 520 280 600 300 650 M 450 480 C 500 520 520 600 500 650" fill="none" stroke="black" stroke-width="4"/>

      <!-- Body (hidden mostly by cloak) -->
      <path d="M 370 650 A 50 30 0 0 1 430 650" fill="white" stroke="black" stroke-width="5"/> <!-- Paws -->

      <!-- Head -->
      <ellipse cx="400" cy="350" rx="100" ry="90" fill="white" stroke="black" stroke-width="5"/>

      <!-- Ears -->
      <path d="M 320 280 Q 340 200 380 280 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M 420 280 Q 460 200 480 280 Z" fill="white" stroke="black" stroke-width="5"/>

      <!-- Facial Features -->
      <!-- Eyes -->
      <circle cx="360" cy="340" r="15" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="440" cy="340" r="15" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="360" cy="340" r="4" fill="black" stroke="none"/>
      <circle cx="440" cy="340" r="4" fill="black" stroke="none"/>
      <path d="M 350 325 Q 360 310 370 325" fill="none" stroke="black" stroke-width="3"/> <!-- Mischievous eyelids -->
      <path d="M 430 325 Q 440 310 450 325" fill="none" stroke="black" stroke-width="3"/>

      <!-- Nose -->
      <path d="M 400 365 L 395 375 L 405 375 Z" fill="black" stroke="none"/>

      <!-- Mouth (mischievous smile) -->
      <path d="M 370 385 Q 400 400 430 385" fill="none" stroke="black" stroke-width="4"/>

      <!-- Whiskers -->
      <path d="M 300 350 Q 320 340 330 350 M 300 360 Q 320 360 330 360 M 300 370 Q 320 380 330 370" fill="none" stroke="black" stroke-width="3"/>
      <path d="M 500 350 Q 480 340 470 350 M 500 360 Q 480 360 470 360 M 500 370 Q 480 380 470 370" fill="none" stroke="black" stroke-width="3"/>

      <!-- Pointed Wizard Hat -->
      <path d="M 320 280 Q 350 150 400 100 Q 450 150 480 280 Z" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="400" cy="280" rx="80" ry="20" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="400" cy="180" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Star decoration on hat -->
      <path d="M 400 160 L 405 175 L 420 175 L 410 185 L 415 200 L 400 190 L 385 200 L 390 185 L 380 175 L 395 175 Z" fill="white" stroke="black" stroke-width="3"/>

      <!-- Sparkling Magic Wand -->
      <g id="magic_wand">
        <path d="M 470 450 L 580 300 L 600 320 L 490 470 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Wand stick -->
        <circle cx="580" cy="300" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Star base -->
        <path d="M 580 275 L 590 290 L 605 290 L 595 305 L 600 320 L 580 310 L 560 320 L 565 305 L 555 290 L 570 290 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Sparkling star -->
        <circle cx="580" cy="300" r="5" fill="black" stroke="none"/>
      </g>
    </g>

    <!-- Simple Floating Stars -->
    <g id="floating_stars">
      <!-- Star 1 -->
      <path d="M 100 200 L 115 220 L 140 220 L 120 235 L 130 255 L 100 240 L 70 255 L 80 235 L 60 220 L 85 220 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Star 2 -->
      <path d="M 700 150 L 715 170 L 740 170 L 720 185 L 730 205 L 700 190 L 670 205 L 680 185 L 660 170 L 685 170 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Star 3 -->
      <path d="M 200 100 L 210 115 L 225 115 L 215 125 L 220 140 L 200 130 L 180 140 L 185 125 L 175 115 L 190 115 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Star 4 -->
      <path d="M 600 600 L 610 615 L 625 615 L 615 625 L 620 640 L 600 630 L 580 640 L 585 625 L 575 615 L 590 615 Z" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Open Magic Spellbooks -->
    <g id="spellbooks">
      <!-- Book 1 (left) -->
      <path d="M 120 680 L 250 650 L 250 700 L 120 730 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Left page -->
      <path d="M 250 650 L 280 670 L 280 720 L 250 700 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Spine -->
      <path d="M 280 670 L 410 640 L 410 690 L 280 720 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Right page -->
      <path d="M 150 695 L 220 675 M 150 710 L 220 690 M 310 685 L 380 665 M 310 700 L 380 680" fill="none" stroke="black" stroke-width="3"/>

      <!-- Book 2 (right) -->
      <path d="M 500 640 L 630 610 L 630 660 L 500 690 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Left page -->
      <path d="M 630 610 L 660 630 L 660 680 L 630 660 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Spine -->
      <path d="M 660 630 L 790 600 L 790 650 L 660 680 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Right page -->
      <path d="M 530 655 L 600 635 M 530 670 L 600 650 M 690 645 L 760 625 M 690 660 L 760 640" fill="none" stroke="black" stroke-width="3"/>
    </g>

    <!-- Simple Magic School Setting elements (background hints) -->
    <g id="magic_school_background">
      <path d="M 0 800 Q 400 700 800 800" fill="none" stroke="black" stroke-width="5"/> <!-- Ground line -->

      <!-- Arched Window 1 -->
      <ellipse cx="150" cy="500" rx="50" ry="80" fill="white" stroke="black" stroke-width="4"/>
      <path d="M 150 420 V 580" fill="none" stroke="black" stroke-width="3"/>

      <!-- Arched Window 2 -->
      <ellipse cx="650" cy="500" rx="50" ry="80" fill="white" stroke="black" stroke-width="4"/>
      <path d="M 650 420 V 580" fill="none" stroke="black" stroke-width="3"/>

      <!-- Large archway in the distance -->
      <path d="M 300 800 L 300 500 A 100 100 0 0 1 500 500 L 500 800 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M 320 800 L 320 520 A 80 80 0 0 1 480 520 L 480 800 Z" fill="white" stroke="black" stroke-width="4"/>

    </g>
  </g>
</svg>