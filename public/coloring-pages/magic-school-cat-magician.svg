<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">

  <!-- Flowing Cape - placed early so it's behind the cat -->
  <g id="cape">
    <path d="M 200 600 C 100 500, 50 750, 100 900 L 700 900 C 750 750, 700 500, 600 600 C 600 700, 650 750, 600 850 C 550 880, 250 880, 200 850 C 150 750, 200 700, 200 600 Z" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Main Cat Magician -->
  <g id="cat-magician">
    <!-- Body -->
    <path d="M 400 600 C 280 550, 250 750, 350 850 L 450 850 C 550 750, 520 550, 400 600 Z" stroke="black" stroke-width="4" fill="white"/>
    
    <!-- Paws (Arms) - left paw -->
    <rect x="250" y="580" width="80" height="150" rx="40" ry="40" stroke="black" stroke-width="4" fill="white"/>
    
    <!-- Feet -->
    <rect x="300" y="830" width="80" height="80" rx="40" ry="40" stroke="black" stroke-width="4" fill="white"/>
    <rect x="420" y="830" width="80" height="80" rx="40" ry="40" stroke="black" stroke-width="4" fill="white"/>

    <!-- Head -->
    <circle cx="400" cy="450" r="150" stroke="black" stroke-width="5" fill="white"/>
    <!-- Ears -->
    <path d="M 320 320 Q 350 250, 380 320 Q 350 350, 320 320 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 420 320 Q 450 250, 480 320 Q 450 350, 420 320 Z" stroke="black" stroke-width="4" fill="white"/>
    <!-- Eyes -->
    <circle cx="350" cy="420" r="30" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="450" cy="420" r="30" stroke="black" stroke-width="3" fill="white"/>
    <!-- Nose -->
    <circle cx="400" cy="480" r="15" stroke="black" stroke-width="3" fill="white"/>
    <!-- Mouth -->
    <path d="M 370 510 Q 400 540, 430 510" stroke="black" stroke-width="3" fill="none"/>
  </g>

  <!-- Wizard Hat -->
  <g id="wizard-hat">
    <!-- Hat Brim -->
    <ellipse cx="400" cy="380" rx="130" ry="50" stroke="black" stroke-width="5" fill="white"/>
    <!-- Hat Cone -->
    <path d="M 290 380 L 400 150 L 510 380 Z" stroke="black" stroke-width="5" fill="white"/>
    <!-- Star on Hat -->
    <path d="M 400 180 L 415 210 L 450 215 L 425 240 L 430 270 L 400 255 L 370 270 L 375 240 L 350 215 L 385 210 Z" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Magic Wand - positioned before right paw so paw can overlap it slightly -->
  <g id="magic-wand">
    <!-- Wand Stick -->
    <rect x="520" y="450" width="30" height="180" rx="15" ry="15" transform="rotate(20 520 450)" stroke="black" stroke-width="4" fill="white"/>
    <!-- Star on Wand -->
    <g transform="translate(560 410) rotate(20)">
      <path d="M 0 0 L 15 30 L 50 35 L 25 60 L 30 90 L 0 75 L -30 90 L -25 60 L -50 35 L -15 30 Z" stroke="black" stroke-width="4" fill="white"/>
    </g>
  </g>

  <!-- Cat's right paw - placed after wand so it overlaps -->
  <rect x="470" y="550" width="80" height="150" rx="40" ry="40" stroke="black" stroke-width="4" fill="white" transform="rotate(10 510 625)"/>

  <!-- Friendly Owl on shoulder -->
  <g id="owl">
    <!-- Body -->
    <ellipse cx="280" cy="530" rx="60" ry="70" stroke="black" stroke-width="4" fill="white"/>
    <!-- Head (overlaps body) -->
    <circle cx="280" cy="480" r="50" stroke="black" stroke-width="4" fill="white"/>
    <!-- Eyes -->
    <circle cx="260" cy="470" r="15" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="300" cy="470" r="15" stroke="black" stroke-width="3" fill="white"/>
    <!-- Beak -->
    <path d="M 280 490 L 270 505 L 290 505 Z" stroke="black" stroke-width="3" fill="white"/>
    <!-- Wings -->
    <path d="M 220 530 Q 200 500, 220 560" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 340 530 Q 360 500, 340 560" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Floating Open Spellbook -->
  <g id="spellbook">
    <!-- Left Page -->
    <rect x="70" y="100" width="200" height="150" rx="10" ry="10" transform="rotate(-10 70 100)" stroke="black" stroke-width="4" fill="white"/>
    <!-- Right Page -->
    <rect x="250" y="80" width="200" height="150" rx="10" ry="10" transform="rotate(10 250 80)" stroke="black" stroke-width="4" fill="white"/>
    <!-- Spine -->
    <rect x="260" y="120" width="20" height="120" rx="5" ry="5" stroke="black" stroke-width="4" fill="white"/>

    <!-- Simple Symbols Floating Nearby -->
    <g id="spellbook-symbols">
      <!-- Star -->
      <path d="M 500 150 L 515 180 L 550 185 L 525 210 L 530 240 L 500 225 L 470 240 L 475 210 L 450 185 L 485 180 Z" stroke="black" stroke-width="4" fill="white"/>
      <!-- Circle -->
      <circle cx="600" cy="100" r="40" stroke="black" stroke-width="4" fill="white"/>
      <!-- Triangle -->
      <path d="M 680 180 L 720 120 L 760 180 Z" stroke="black" stroke-width="4" fill="white"/>
      <!-- Swirl -->
      <path d="M 600 250 Q 650 200, 700 250 S 650 300, 600 250" stroke="black" stroke-width="4" fill="none"/>
      <path d="M 600 250 Q 630 220, 660 250 S 630 280, 600 250" stroke="black" stroke-width="4" fill="none"/>
    </g>
  </g>

</svg>