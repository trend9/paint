<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Bear Astronaut -->
  <g id="bear_astronaut">
    <!-- Helmet Outer Shell -->
    <circle cx="400" cy="300" r="120" fill="white" stroke="black" stroke-width="4"/>
    <!-- Helmet Visor Opening -->
    <path d="M350 270 C340 250, 360 230, 400 230 C440 230, 460 250, 450 270 C440 310, 400 330, 350 270 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Bear Head (inside visor) -->
    <circle cx="400" cy="285" r="50" fill="white" stroke="black" stroke-width="4"/>
    <!-- Bear Ears -->
    <circle cx="350" cy="210" r="30" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="450" cy="210" r="30" fill="white" stroke="black" stroke-width="4"/>
    <!-- Bear Face details -->
    <!-- Eyes -->
    <circle cx="380" cy="280" r="8" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="420" cy="280" r="8" fill="white" stroke="black" stroke-width="3"/>
    <!-- Nose -->
    <ellipse cx="400" cy="295" rx="10" ry="7" fill="white" stroke="black" stroke-width="3"/>
    <!-- Mouth -->
    <path d="M390 305 Q400 315, 410 305" fill="none" stroke="black" stroke-width="3"/>

    <!-- Spacesuit Body -->
    <rect x="300" y="380" width="200" height="250" rx="70" ry="70" fill="white" stroke="black" stroke-width="4"/>
    <!-- Backpack (behind body, for context) -->
    <rect x="330" y="390" width="140" height="180" rx="50" ry="50" fill="white" stroke="black" stroke-width="4"/>
    <!-- Suit Details on body (chest panel and buttons) -->
    <circle cx="400" cy="450" r="25" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="360" cy="460" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="440" cy="460" r="10" fill="white" stroke="black" stroke-width="3"/>

    <!-- Arms -->
    <g id="arms">
      <!-- Left Arm and Glove (rotated for floating pose) -->
      <g transform="translate(290, 420) rotate(-45)">
        <rect x="0" y="0" width="80" height="150" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="40" cy="150" r="40" fill="white" stroke="black" stroke-width="4"/>
      </g>
      <!-- Right Arm and Glove (rotated for floating pose) -->
      <g transform="translate(510, 420) rotate(45)">
        <rect x="-80" y="0" width="80" height="150" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="-40" cy="150" r="40" fill="white" stroke="black" stroke-width="4"/>
      </g>
    </g>

    <!-- Legs -->
    <g id="legs">
      <!-- Left Leg and Boot (rotated for floating pose) -->
      <g transform="translate(340, 620) rotate(20)">
        <rect x="0" y="0" width="70" height="120" rx="35" ry="35" fill="white" stroke="black" stroke-width="4"/>
        <ellipse cx="35" cy="120" rx="45" ry="30" fill="white" stroke="black" stroke-width="4"/>
      </g>
      <!-- Right Leg and Boot (rotated for floating pose) -->
      <g transform="translate(460, 620) rotate(-20)">
        <rect x="-70" y="0" width="70" height="120" rx="35" ry="35" fill="white" stroke="black" stroke-width="4"/>
        <ellipse cx="-35" cy="120" rx="45" ry="30" fill="white" stroke="black" stroke-width="4"/>
      </g>
    </g>
  </g>

  <!-- Space Elements -->
  <g id="space_elements">
    <!-- Planet Ring (drawn first, as a stroke only, to appear behind the planet) -->
    <ellipse cx="150" cy="850" rx="140" ry="40" transform="rotate(-20 150 850)" fill="none" stroke="black" stroke-width="4"/>
    <!-- Planet (drawn second, covers part of the ring) -->
    <circle cx="150" cy="850" r="100" fill="white" stroke="black" stroke-width="4"/>

    <!-- Stars (simple circles of varying sizes) -->
    <circle cx="700" cy="100" r="20" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="100" cy="150" r="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="200" cy="70" r="25" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="600" cy="800" r="18" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="750" cy="500" r="22" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="50" cy="500" r="12" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="650" cy="250" r="16" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="250" cy="800" r="14" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="120" cy="30" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="720" cy="900" r="12" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="300" cy="150" r="18" fill="white" stroke="black" stroke-width="3"/>
  </g>
</svg>