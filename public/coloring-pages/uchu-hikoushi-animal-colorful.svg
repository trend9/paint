<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Dog Astronaut -->
  <g id="dog-astronaut" transform="translate(0, -30) rotate(-5 380 400)">
    <!-- Body -->
    <rect x="280" y="400" width="200" height="250" rx="50" ry="50" fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <circle cx="380" cy="320" r="80" fill="white" stroke="black" stroke-width="4"/>
    <!-- Ears -->
    <path d="M330,270 Q310,240 340,230 Q370,240 350,270 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M430,270 Q450,240 420,230 Q390,240 410,270 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snout -->
    <ellipse cx="380" cy="340" rx="35" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <circle cx="380" cy="330" r="12" fill="white" stroke="black" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="350" cy="305" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="410" cy="305" r="15" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth -->
    <path d="M360,355 Q380,370 400,355" fill="none" stroke="black" stroke-width="4"/>

    <!-- Helmet -->
    <circle cx="380" cy="320" r="110" fill="none" stroke="black" stroke-width="4"/>
    <rect x="290" y="270" width="180" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Visor -->

    <!-- Arms -->
    <rect x="230" y="420" width="60" height="120" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <rect x="470" y="420" width="60" height="120" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Legs -->
    <rect x="300" y="620" width="60" height="100" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <rect x="400" y="620" width="60" height="100" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Suit details -->
    <circle cx="380" cy="520" r="30" fill="white" stroke="black" stroke-width="4"/>
    <rect x="350" y="500" width="60" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Cat Astronaut -->
  <g id="cat-astronaut" transform="translate(0, 50) rotate(10 600 300)">
    <!-- Body -->
    <rect x="550" y="250" width="150" height="200" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <circle cx="625" cy="200" r="70" fill="white" stroke="black" stroke-width="4"/>
    <!-- Ears -->
    <path d="M590,160 L610,120 L630,160 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M640,160 L660,120 L680,160 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="605" cy="180" r="12" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="645" cy="180" r="12" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <path d="M625,200 L620,210 L630,210 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth -->
    <path d="M615,215 Q625,225 635,215" fill="none" stroke="black" stroke-width="4"/>
    <!-- Whiskers -->
    <line x1="595" y1="200" x2="575" y2="195" stroke="black" stroke-width="3"/>
    <line x1="595" y1="205" x2="575" y2="210" stroke="black" stroke-width="3"/>
    <line x1="655" y1="200" x2="675" y2="195" stroke="black" stroke-width="3"/>
    <line x1="655" y1="205" x2="675" y2="210" stroke="black" stroke-width="3"/>

    <!-- Helmet -->
    <circle cx="625" cy="200" r="100" fill="none" stroke="black" stroke-width="4"/>
    <rect x="565" y="160" width="120" height="80" rx="15" ry="15" fill="white" stroke="black" stroke-width="4"/> <!-- Visor -->

    <!-- Arms (waving arm) -->
    <rect x="510" y="270" width="50" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <rect x="670" y="220" width="50" height="100" rx="20" ry="20" transform="rotate(-30 695 270)" fill="white" stroke="black" stroke-width="4"/> <!-- Waving arm -->
    <!-- Legs -->
    <rect x="565" y="420" width="50" height="80" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <rect x="635" y="420" width="50" height="80" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Tail -->
    <path d="M700,380 Q730,400 720,430 Q710,460 690,450" fill="white" stroke="black" stroke-width="4"/>
    <!-- Suit details -->
    <circle cx="625" cy="350" r="25" fill="white" stroke="black" stroke-width="4"/>
    <rect x="605" y="340" width="40" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Background Elements -->
  <g id="background-planets">
    <circle cx="150" cy="150" r="70" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="700" cy="850" r="90" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="100" cy="750" r="50" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="500" cy="950" r="60" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="250" cy="900" r="40" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="background-stars">
    <!-- Simple cross stars -->
    <path d="M50,50 L70,50 M60,40 L60,60" stroke="black" stroke-width="3" fill="none"/>
    <path d="M750,100 L770,100 M760,90 L760,110" stroke="black" stroke-width="3" fill="none"/>
    <path d="M100,450 L120,450 M110,440 L110,460" stroke="black" stroke-width="3" fill="none"/>
    <path d="M250,750 L270,750 M260,740 L260,760" stroke="black" stroke-width="3" fill="none"/>
    <path d="M550,100 L570,100 M560,90 L560,110" stroke="black" stroke-width="3" fill="none"/>
    <path d="M40,900 L60,900 M50,890 L50,910" stroke="black" stroke-width="3" fill="none"/>
    <path d="M720,550 L740,550 M730,540 L730,560" stroke="black" stroke-width="3" fill="none"/>
    <path d="M300,50 L320,50 M310,40 L310,60" stroke="black" stroke-width="3" fill="none"/>
    <path d="M150,600 L170,600 M160,590 L160,610" stroke="black" stroke-width="3" fill="none"/>
    <path d="M600,600 L620,600 M610,590 L610,610" stroke="black" stroke-width="3" fill="none"/>
    <path d="M450,700 L470,700 M460,690 L460,710" stroke="black" stroke-width="3" fill="none"/>
    <path d="M200,200 L220,200 M210,190 L210,210" stroke="black" stroke-width="3" fill="none"/>
    <path d="M700,30 L720,30 M710,20 L710,40" stroke="black" stroke-width="3" fill="none"/>
    <path d="M50,800 L70,800 M60,790 L60,810" stroke="black" stroke-width="3" fill="none"/>
    <path d="M750,450 L770,450 M760,440 L760,460" stroke="black" stroke-width="3" fill="none"/>
  </g>
</svg>