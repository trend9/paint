<svg viewBox="0 0 800 1000">
  <g stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Snow Ground -->
    <path d="M0 750 C200 700 600 700 800 750 L800 1000 L0 1000 Z" fill="white"/>

    <!-- Hot Spring Water -->
    <ellipse cx="400" cy="700" rx="300" ry="120" fill="white"/>

    <!-- Rocks -->
    <g id="rocks">
      <path d="M100 720 C120 680 180 670 200 700 L200 740 C180 750 120 750 100 740 Z" fill="white"/>
      <path d="M100 690 C110 660 140 650 150 670 C140 680 110 680 100 690 Z" fill="white"/> <!-- Snow on rock 1 -->

      <path d="M600 720 C620 680 680 670 700 700 L700 740 C680 750 620 750 600 740 Z" fill="white"/>
      <path d="M600 690 C610 660 640 650 650 670 C640 680 610 680 600 690 Z" fill="white"/> <!-- Snow on rock 2 -->
    </g>

    <!-- Penguins -->
    <g id="penguins">
      <!-- Penguin 1 -->
      <g transform="translate(250, 600)">
        <ellipse cx="0" cy="0" rx="60" ry="80"/> <!-- Body -->
        <ellipse cx="0" cy="-70" rx="40" ry="45"/> <!-- Head -->
        <circle cx="-15" cy="-75" r="5" fill="black"/> <!-- Left Eye -->
        <circle cx="15" cy="-75" r="5" fill="black"/> <!-- Right Eye -->
        <path d="M-10 -55 Q0 -40 10 -55" fill="white"/> <!-- Beak -->
        <path d="M-50 -30 Q-60 -10 -50 10" fill="white"/> <!-- Left Flipper -->
        <path d="M50 -30 Q60 -10 50 10" fill="white"/> <!-- Right Flipper -->
        <path d="M-25 30 Q0 50 25 30" fill="white"/> <!-- Smile -->
      </g>

      <!-- Penguin 2 -->
      <g transform="translate(550, 620)">
        <ellipse cx="0" cy="0" rx="60" ry="80"/> <!-- Body -->
        <ellipse cx="0" cy="-70" rx="40" ry="45"/> <!-- Head -->
        <circle cx="-15" cy="-75" r="5" fill="black"/> <!-- Left Eye -->
        <circle cx="15" cy="-75" r="5" fill="black"/> <!-- Right Eye -->
        <path d="M-10 -55 Q0 -40 10 -55" fill="white"/> <!-- Beak -->
        <path d="M-50 -30 Q-60 -10 -50 10" fill="white"/> <!-- Left Flipper -->
        <path d="M50 -30 Q60 -10 50 10" fill="white"/> <!-- Right Flipper -->
        <path d="M-25 30 Q0 50 25 30" fill="white"/> <!-- Smile -->
      </g>
    </g>

    <!-- Steam -->
    <g id="steam" fill="none" stroke-width="3">
      <path d="M300 580 Q320 560 340 580 Q360 600 380 580" />
      <path d="M400 590 Q420 570 440 590 Q460 610 480 590" />
      <path d="M500 580 Q520 560 540 580 Q560 600 580 580" />
      
      <path d="M350 540 Q370 520 390 540 Q410 560 430 540" />
      <path d="M450 550 Q470 530 490 550 Q510 570 530 550" />
    </g>

    <!-- Snowflakes -->
    <g id="snowflakes" fill="white" stroke-width="3">
      <circle cx="100" cy="150" r="10"/>
      <circle cx="300" cy="100" r="10"/>
      <circle cx="500" cy="150" r="10"/>
      <circle cx="700" cy="100" r="10"/>
      <circle cx="200" cy="250" r="10"/>
      <circle cx="600" cy="250" r="10"/>
      <circle cx="400" cy="50" r="10"/>
      <circle cx="150" cy="400" r="10"/>
      <circle cx="650" cy="400" r="10"/>
    </g>

  </g>
</svg>