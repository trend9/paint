<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Landscape elements (background) -->
  <g id="landscape">
    <!-- Chocolate River -->
    <path d="M0 750 Q200 700 400 750 T800 750 V1000 H0 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M0 800 Q200 770 400 800 T800 800 V1000 H0 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Giant Cupcake 1 (left) -->
    <g id="cupcake1">
      <!-- Frosting top -->
      <path d="M100 650 Q120 600 150 600 Q180 600 200 650 L200 690 L100 690 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Wrapper bottom -->
      <path d="M100 690 L120 730 H180 L200 690 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Cherry on top -->
      <circle cx="150" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Giant Cupcake 2 (right) -->
    <g id="cupcake2">
      <!-- Frosting top -->
      <path d="M550 600 Q570 550 600 550 Q630 550 650 600 L650 640 L550 640 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Wrapper bottom -->
      <path d="M550 640 L570 680 H630 L650 640 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Cherry on top -->
      <circle cx="600" cy="530" r="20" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Candy Tree 1 (left) -->
    <g id="candyTree1">
      <!-- Trunk -->
      <rect x="50" y="550" width="50" height="150" rx="15" ry="15" fill="white" stroke="black" stroke-width="5"/>
      <!-- Canopy (lumpy cloud shape) -->
      <path d="M20 500 C50 450 50 400 100 400 C150 400 150 450 180 450 C210 450 210 500 180 500 C150 500 150 550 100 550 C50 550 50 500 20 500 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Candies on tree -->
      <circle cx="80" cy="450" r="15" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="140" cy="430" r="15" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="100" cy="400" r="15" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Candy Tree 2 (right) -->
    <g id="candyTree2">
      <!-- Trunk -->
      <rect x="700" y="480" width="50" height="170" rx="15" ry="15" fill="white" stroke="black" stroke-width="5"/>
      <!-- Canopy (lumpy cloud shape) -->
      <path d="M680 450 C710 400 710 350 760 350 C810 350 810 400 840 400 C870 400 870 450 840 450 C810 450 810 500 760 500 C710 500 710 450 680 450 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Candies on tree -->
      <circle cx="730" cy="400" r="15" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="770" cy="380" r="15" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="720" cy="350" r="15" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Generic Lollipops in background -->
    <g id="bgLollipops">
      <!-- Lollipop 1 -->
      <circle cx="280" cy="700" r="30" fill="white" stroke="black" stroke-width="4"/>
      <path d="M0 0 C10 -10 10 -20 0 -20 C-10 -20 -10 -10 0 0" transform="translate(280, 700)" fill="none" stroke="black" stroke-width="3"/> <!-- Swirl -->
      <rect x="275" y="730" width="10" height="50" fill="white" stroke="black" stroke-width="4"/> <!-- Stick -->
      <!-- Lollipop 2 -->
      <circle cx="450" cy="650" r="35" fill="white" stroke="black" stroke-width="4"/>
      <path d="M0 0 C10 -10 10 -25 0 -25 C-10 -25 -10 -10 0 0" transform="translate(450, 650)" fill="none" stroke="black" stroke-width="3"/> <!-- Swirl -->
      <rect x="445" y="685" width="10" height="60" fill="white" stroke="black" stroke-width="4"/> <!-- Stick -->
    </g>

  </g>

  <!-- Candy Train -->
  <g id="candyTrain">
    <!-- Locomotive body -->
    <rect x="100" y="550" width="250" height="100" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <rect x="120" y="500" width="80" height="70" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/> <!-- Cabin -->
    <rect x="280" y="470" width="50" height="80" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/> <!-- Smokestack base -->
    <circle cx="305" cy="460" r="30" fill="white" stroke="black" stroke-width="5"/> <!-- Smokestack top -->

    <!-- Locomotive face -->
    <circle cx="350" cy="600" r="40" fill="white" stroke="black" stroke-width="5"/> <!-- Front face plate -->
    <circle cx="335" cy="590" r="10" fill="white" stroke="black" stroke-width="4"/> <!-- Left eye -->
    <circle cx="365" cy="590" r="10" fill="white" stroke="black" stroke-width="4"/> <!-- Right eye -->
    <path d="M340 620 Q350 630 360 620" fill="none" stroke="black" stroke-width="4"/> <!-- Smile -->

    <!-- Lollipop wheels for locomotive -->
    <g id="locoWheel1" transform="translate(180, 650)">
      <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="5"/>
      <path d="M0 0 C10 -10 10 -25 0 -25 C-10 -25 -10 -10 0 0" fill="none" stroke="black" stroke-width="4"/> <!-- Swirl -->
      <rect x="-5" y="40" width="10" height="30" fill="white" stroke="black" stroke-width="4"/> <!-- Stick -->
    </g>
    <g id="locoWheel2" transform="translate(300, 650)">
      <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="5"/>
      <path d="M0 0 C10 -10 10 -25 0 -25 C-10 -25 -10 -10 0 0" fill="none" stroke="black" stroke-width="4"/> <!-- Swirl -->
      <rect x="-5" y="40" width="10" height="30" fill="white" stroke="black" stroke-width="4"/> <!-- Stick -->
    </g>

    <!-- Connector between locomotive and car -->
    <rect x="350" y="600" width="20" height="10" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/>

    <!-- Candy Car 1 -->
    <g id="candyCar1">
      <rect x="370" y="560" width="200" height="90" rx="25" ry="25" fill="white" stroke="black" stroke-width="5"/>
      <!-- Content for candy car (a giant candy) -->
      <circle cx="470" cy="590" r="30" fill="white" stroke="black" stroke-width="4"/>
      <path d="M0 0 C8 -8 8 -20 0 -20 C-8 -20 -8 -8 0 0" transform="translate(470, 590)" fill="none" stroke="black" stroke-width="3"/> <!-- Small swirl -->

      <!-- Lollipop wheels for car 1 -->
      <g id="car1Wheel1" transform="translate(420, 650)">
        <circle cx="0" cy="0" r="35" fill="white" stroke="black" stroke-width="5"/>
        <path d="M0 0 C8 -8 8 -20 0 -20 C-8 -20 -8 -8 0 0" fill="none" stroke="black" stroke-width="4"/> <!-- Swirl -->
        <rect x="-5" y="35" width="10" height="25" fill="white" stroke="black" stroke-width="4"/> <!-- Stick -->
      </g>
      <g id="car1Wheel2" transform="translate(520, 650)">
        <circle cx="0" cy="0" r="35" fill="white" stroke="black" stroke-width="5"/>
        <path d="M0 0 C8 -8 8 -20 0 -20 C-8 -20 -8 -8 0 0" fill="none" stroke="black" stroke-width="4"/> <!-- Swirl -->
        <rect x="-5" y="35" width="10" height="25" fill="white" stroke="black" stroke-width="4"/> <!-- Stick -->
      </g>
    </g>
  </g>

  <!-- Sky elements -->
  <g id="skyElements">
    <!-- Candy Cloud 1 -->
    <path d="M100 200 C50 150 50 250 100 300 C150 350 250 350 300 300 C350 250 350 150 300 100 C250 50 150 50 100 100 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Candy Cloud 2 -->
    <path d="M500 150 C450 100 450 200 500 250 C550 300 650 300 700 250 C750 200 750 100 700 50 C650 0 550 0 500 50 Z" fill="white" stroke="black" stroke-width="5"/>
    
    <!-- Candy Sun -->
    <circle cx="700" cy="100" r="60" fill="white" stroke="black" stroke-width="5"/>
    <path d="M0 0 C15 -15 15 -40 0 -40 C-15 -40 -15 -15 0 0" transform="translate(700, 100)" fill="none" stroke="black" stroke-width="4"/> <!-- Swirl inside sun -->
  </g>
</svg>