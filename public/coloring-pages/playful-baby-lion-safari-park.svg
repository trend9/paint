<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="1000" fill="white"/>

  <!-- Sun -->
  <g id="sun">
    <circle cx="680" cy="120" r="70" fill="white" stroke="black" stroke-width="4"/>
    <line x1="680" y1="50" x2="680" y2="190" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="610" y1="120" x2="750" y2="120" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="635" y1="65" x2="725" y2="175" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="635" y1="175" x2="725" y2="65" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="650" y1="55" x2="710" y2="185" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <line x1="650" y1="185" x2="710" y2="55" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Grass -->
  <g id="grass">
    <!-- Main ground line, filled with white and bold outline -->
    <path d="M 0 750 Q 150 720 300 750 T 600 760 T 800 750 L 800 1000 L 0 1000 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Simple grass tufts (no fill, just outlines) -->
    <path d="M 100 750 Q 110 735 120 750" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 250 755 Q 260 740 270 755" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 400 760 Q 410 745 420 760" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 550 750 Q 560 735 570 750" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 700 755 Q 710 740 720 755" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Baby Lion -->
  <g id="baby-lion" transform="translate(200, 400)">
    <!-- Body -->
    <ellipse cx="200" cy="200" rx="160" ry="110" fill="white" stroke="black" stroke-width="5"/>

    <!-- Head -->
    <circle cx="150" cy="110" r="90" fill="white" stroke="black" stroke-width="5"/>

    <!-- Ears -->
    <ellipse cx="100" cy="60" rx="30" ry="40" transform="rotate(-20 100 60)" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="200" cy="60" rx="30" ry="40" transform="rotate(20 200 60)" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Inner ears for coloring -->
    <ellipse cx="100" cy="65" rx="15" ry="20" transform="rotate(-20 100 65)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="200" cy="65" rx="15" ry="20" transform="rotate(20 200 65)" fill="white" stroke="black" stroke-width="3"/>

    <!-- Mane tufts (simple, playful lines) -->
    <path d="M 90 20 Q 120 -10 150 20 Q 180 -10 210 20" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="150" cy="150" rx="50" ry="30" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <path d="M 150 135 L 135 160 A 15 15 0 0 0 165 160 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <!-- Mouth -->
    <path d="M 130 170 C 140 185 160 185 170 170" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="120" cy="100" r="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="180" cy="100" r="15" fill="white" stroke="black" stroke-width="3"/>

    <!-- Front Legs -->
    <!-- Left front leg (on ground) -->
    <path d="M 180 270 C 160 310 180 340 210 340 C 240 340 260 310 240 270 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right front leg (lifted/playing) -->
    <path d="M 270 200 C 290 170 330 170 340 200 C 350 230 310 260 290 260 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>

    <!-- Back Legs -->
    <!-- Left back leg -->
    <path d="M 90 270 C 70 310 90 340 120 340 C 150 340 170 310 150 270 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right back leg -->
    <path d="M 330 270 C 310 310 330 340 360 340 C 390 340 410 310 390 270 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>

    <!-- Tail -->
    <path d="M 370 230 C 420 190 450 230 440 270 C 430 290 410 290 390 270" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <path d="M 390 270 Q 400 280 410 270 Q 400 260 390 270 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>