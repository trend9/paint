      <path d="M170 650 Q185 640 200 650 Q215 640 230 650" class="detail-fill"/>
      <circle cx="185" cy="600" r="10" class="eye-fill"/>
      <circle cx="215" cy="600" r="10" class="eye-fill"/>
      <path d="M200 615 L190 625 L210 625 Z" class="detail-fill"/>
      <path d="M120 680 Q140 650 160 680 L140 700 Z" class="penguin-fill"/>
      <path d="M240 680 Q260 650 280 680 L260 700 Z" class="penguin-fill"/>
      <rect x="180" y="550" width="40" height="20" rx="8" ry="8" class="detail-fill"/>
    </g>

    <g id="penguin-2">
      <ellipse cx="400" cy="720" rx="80" ry="110" class="penguin-fill"/>
      <circle cx="400" cy="640" r="60" class="penguin-fill"/>
      <path d="M360 670 Q380 650 400 670 Q420 650 440 670" class="detail-fill"/>
      <circle cx="380" cy="620" r="12" class="eye-fill"/>
      <circle cx="420" cy="620" r="12" class="eye-fill"/>
      <path d="M400 635 L390 645 L410 645 Z" class="detail-fill"/>
      <path d="M310 700 Q340 670 370 700 L340 720 Z" class="penguin-fill"/>
      <path d="M430 700 Q460 670 490 700 L460 720 Z" class="penguin-fill"/>
      <rect x="380" y="570" width="40" height="20" rx="8" ry="8" class="detail-fill"/>
    </g>

    <g id="penguin-3">
      <ellipse cx="600" cy="710" rx="65" ry="95" class="penguin-fill"/>
      <circle cx="600" cy="630" r="45" class="penguin-fill"/>
      <path d="M570 660 Q585 650 600 660 Q615 650 630 660" class="detail-fill"/>
      <circle cx="585" cy="610" r="9" class="eye-fill"/>
      <circle cx="615" cy="610" r="9" class="eye-fill"/>
      <path d="M600 625 L590 635 L610 635 Z" class="detail-fill"/>
      <path d="M530 690 Q550 660 570 690 L550 710 Z" class="penguin-fill"/>
    </g>
