<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="white"/>

  <!-- BACKGROUND: MOUNTAIN AND CLOUDS -->
  <g id="mountains" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Distant Mountain -->
    <path d="M 150 480 L 400 180 L 650 480 Z" fill="white"/>
    <!-- Snow Cap on Mountain -->
    <path d="M 400 180 L 330 265 L 365 285 L 400 260 L 435 285 L 470 265 Z" fill="white"/>
    
    <!-- Fluffy Clouds -->
    <path d="M 120 180 
             a 35 35 0 0 1 50 -20 
             a 45 45 0 0 1 70 0 
             a 35 35 0 0 1 50 20 
             a 30 30 0 0 1 -20 40 
             l -130 0 
             a 25 25 0 0 1 -20 -40 z" fill="white"/>

    <path d="M 540 150 
             a 30 30 0 0 1 45 -15 
             a 40 40 0 0 1 60 0 
             a 30 30 0 0 1 45 15 
             a 25 25 0 0 1 -15 35 
             l -120 0 
             a 20 20 0 0 1 -15 -35 z" fill="white"/>
  </g>

  <!-- FALLING SNOWFLAKES -->
  <g id="snowflakes" stroke="black" stroke-width="3" stroke-linecap="round">
    <!-- Top Left -->
    <g transform="translate(100, 270)">
      <circle cx="0" cy="0" r="8" fill="white"/>
      <line x1="-15" y1="0" x2="15" y2="0"/>
      <line x1="0" y1="-15" x2="0" y2="15"/>
    </g>
    <!-- Top Mid-Right -->
    <g transform="translate(500, 230)">
      <circle cx="0" cy="0" r="7" fill="white"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
    </g>
    <!-- Far Right -->
    <g transform="translate(710, 310)">
      <circle cx="0" cy="0" r="9" fill="white"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <line x1="0" y1="-16" x2="0" y2="16"/>
    </g>
    <!-- Mid Left -->
    <g transform="translate(230, 350)">
      <circle cx="0" cy="0" r="7" fill="white"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
    </g>
    <!-- Lower Right -->
    <g transform="translate(730, 560)">
      <circle cx="0" cy="0" r="8" fill="white"/>
      <line x1="-15" y1="0" x2="15" y2="0"/>
      <line x1="0" y1="-15" x2="0" y2="15"/>
    </g>
    <!-- Simple Round Snow Dots -->
    <circle cx="280" cy="220" r="6" fill="white"/>
    <circle cx="640" cy="260" r="7" fill="white"/>
    <circle cx="80" cy="400" r="6" fill="white"/>
  </g>

  <!-- BACKGROUND PINE TREES -->
  <g id="trees" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Left Pine Tree -->
    <path d="M 80 430 L 110 370 L 140 430 L 125 430 L 155 490 L 65 490 L 95 430 Z"/>
    <!-- Right Pine Tree -->
    <path d="M 680 440 L 710 380 L 740 440 L 725 440 L 755 500 L 665 500 L 695 440 Z"/>
  </g>

  <!-- STEAM SWIRLS -->
  <g id="steam" stroke="black" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 260 480 Q 240 440 260 410 Q 280 380 260 340"/>
    <path d="M 390 440 Q 410 400 390 360 Q 370 320 400 280"/>
    <path d="M 520 460 Q 500 420 530 380 Q 560 340 530 300"/>
  </g>

  <!-- HOT SPRING POOL RIM (BACK ROCKS) -->
  <g id="back-rocks" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <ellipse cx="210" cy="530" rx="45" ry="30"/>
    <ellipse cx="285" cy="515" rx="45" ry="25"/>
    <ellipse cx="370" cy="505" rx="55" ry="25"/>
    <ellipse cx="465" cy="505" rx="50" ry="25"/>
    <ellipse cx="550" cy="515" rx="45" ry="28"/>
    <ellipse cx="625" cy="535" rx="45" ry="30"/>
  </g>

  <!-- HOT SPRING WATER -->
  <g id="water" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Outer Water Basin -->
    <path d="M 170 540 C 130 650 120 730 200 810 C 290 850 510 850 620 800 C 680 730 670 650 630 540 Z"/>
    <!-- Gentle Water Ripple Lines -->
    <path d="M 210 680 Q 260 690 310 680" fill="none"/>
    <path d="M 470 700 Q 520 710 570 700" fill="none"/>
    <path d="M 360 760 Q 400 770 440 760" fill="none"/>
  </g>

  <!-- PENGUIN 1 (LEFT - RELAXING WITH TOWEL ON HEAD) -->
  <g id="penguin-left" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Body -->
    <ellipse cx="300" cy="640" rx="80" ry="75"/>
    <!-- White Belly -->
    <ellipse cx="300" cy="650" rx="55" ry="55"/>
    
    <!-- Left Flipper Resting on Water -->
    <path d="M 225 640 C 190 645 180 670 210 675 C 230 675 240 660 235 645"/>
    <!-- Right Flipper Resting -->
    <path d="M 375 640 C 400 645 405 665 385 675 C 365 675 360 660 365 645"/>

    <!-- Happy Eyes (Sleeping / Blissful Arches) -->
    <path d="M 265 605 Q 280 595 295 605" fill="none" stroke-width="5"/>
    <path d="M 320 605 Q 335 595 350 605" fill="none" stroke-width="5"/>

    <!-- Cute Triangle Beak -->
    <path d="M 300 610 Q 307 625 315 625 Q 323 625 330 610 Z"/>

    <!-- Rosy Cheek Circles -->
    <circle cx="255" cy="620" r="10"/>
    <circle cx="355" cy="620" r="10"/>

    <!-- Small Towel Folded on Head -->
    <rect x="270" y="525" width="65" height="30" rx="10"/>
    <line x1="270" y1="540" x2="335" y2="540"/>
  </g>

  <!-- PENGUIN 2 (RIGHT - HAPPY & SOAKING) -->
  <g id="penguin-right" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Body -->
    <ellipse cx="500" cy="630" rx="75" ry="70"/>
    <!-- White Belly -->
    <ellipse cx="500" cy="640" rx="50" ry="50"/>

    <!-- Big Cheerful Eyes -->
    <ellipse cx="480" cy="595" rx="12" ry="16"/>
    <ellipse cx="525" cy="595" rx="12" ry="16"/>
    <circle cx="482" cy="595" r="5" fill="black"/>
    <circle cx="523" cy="595" r="5" fill="black"/>

    <!-- Wide Happy Beak -->
    <path d="M 490 612 Q 503 605 515 612 Q 503 630 490 612 Z"/>

    <!-- Happy Open Wings / Flippers -->
    <!-- Left Wing Raised -->
    <path d="M 430 625 C 410 600 405 580 420 575 C 435 570 445 600 445 615"/>
    <!-- Right Wing Splashing Water -->
    <path d="M 570 625 C 600 610 615 625 600 640 C 585 650 565 640 565 630"/>

    <!-- Rosy Cheek Circles -->
    <circle cx="460" cy="615" r="8"/>
    <circle cx="545" cy="615" r="8"/>
  </g>

  <!-- RUBBER DUCK TOY FLOATING IN WATER -->
  <g id="rubber-duck" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Duck Body -->
    <path d="M 390 675 C 370 675 365 695 380 705 C 400 710 420 705 425 690 C 430 675 410 675 390 675 Z"/>
    <!-- Duck Head -->
    <circle cx="410" cy="670" r="14"/>
    <!-- Duck Beak -->
    <path d="M 422 668 Q 435 670 422 676 Z"/>
    <!-- Duck Eye -->
    <circle cx="412" cy="666" r="2" fill="black"/>
  </g>

  <!-- HOT SPRING POOL RIM (FRONT ROCKS) -->
  <g id="front-rocks" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <ellipse cx="145" cy="630" rx="35" ry="40"/>
    <ellipse cx="130" cy="710" rx="40" ry="45"/>
    <ellipse cx="170" cy="790" rx="50" ry="40"/>
    <ellipse cx="255" cy="835" rx="55" ry="35"/>
    <ellipse cx="360" cy="845" rx="60" ry="35"/>
    <ellipse cx="475" cy="845" rx="65" ry="35"/>
    <ellipse cx="585" cy="830" rx="55" ry="38"/>
    <ellipse cx="665" cy="775" rx="45" ry="40"/>
    <ellipse cx="685" cy="695" rx="40" ry="45"/>
    <ellipse cx="660" cy="615" rx="35" ry="40"/>
  </g>

  <!-- FOREGROUND: SNOWY BANKS AND A BABY PENGUIN -->
  <!-- Cute Baby Penguin Sitting on Snow Bank -->
  <g id="baby-penguin" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Baby Body -->
    <ellipse cx="670" cy="870" rx="45" ry="45"/>
    <!-- Baby Belly -->
    <ellipse cx="665" cy="875" rx="30" ry="32"/>

    <!-- Baby Eyes (Curved happy lines) -->
    <path d="M 645 855 Q 652 848 660 855" fill="none" stroke-width="4"/>
    <path d="M 672 855 Q 680 848 688 855" fill="none" stroke-width="4"/>

    <!-- Baby Beak -->
    <path d="M 662 862 Q 667 870 672 862 Z"/>

    <!-- Flippers -->
    <path d="M 625 870 C 615 880 620 895 630 890 C 635 885 635 875 630 870"/>
    <path d="M 705 870 C 720 875 720 890 710 895 C 700 895 700 885 705 870"/>

    <!-- Cute Winter Bobble Beanie Hat -->
    <path d="M 640 840 C 640 815 695 815 695 840 Z"/>
    <line x1="638" y1="840" x2="697" y2="840"/>
    <!-- Pompom on hat -->
    <circle cx="668" cy="810" r="12"/>

    <!-- Little Feet Peeking Out -->
    <ellipse cx="645" cy="915" rx="14" ry="8"/>
    <ellipse cx="680" cy="915" rx="14" ry="8"/>
  </g>

  <!-- SOFT FOREGROUND SNOWDRIFTS -->
  <g id="foreground-snow" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Fluffy Snow Mounds at Bottom -->
    <path d="M -20 920 Q 90 870 200 910 Q 310 950 430 900 Q 560 860 670 920 Q 740 890 820 910 L 820 1020 L -20 1020 Z"/>
    
    <!-- Little Snowballs for Fun Detail -->
    <circle cx="100" cy="950" r="18"/>
    <circle cx="130" cy="960" r="14"/>
    <circle cx="115" cy="935" r="12"/>

    <circle cx="530" cy="940" r="16"/>
    <circle cx="555" cy="950" r="12"/>
  </g>
</svg>