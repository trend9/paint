    <circle cx="550" cy="120" r="9" class="snowflake-outline"/>
    <circle cx="700" cy="80" r="11" class="snowflake-outline"/>
    <circle cx="150" cy="280" r="9" class="snowflake-outline"/>
    <circle cx="300" cy="220" r="11" class="snowflake-outline"/>
    <circle cx="450" cy="180" r="10" class="snowflake-outline"/>
    <circle cx="600" cy="250" r="8" class="snowflake-outline"/>
    <circle cx="750" cy="200" r="12" class="snowflake-outline"/>
    <circle cx="50" cy="400" r="10" class="snowflake-outline"/>
    <circle cx="200" cy="350" r="8" class="snowflake-outline"/>
    <circle cx="350" cy="300" r="12" class="snowflake-outline"/>
    <circle cx="500" cy="370" r="9" class="snowflake-outline"/>
