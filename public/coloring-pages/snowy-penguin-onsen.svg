<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline { stroke: black; stroke-width: 4; fill: white; }
      .hot-spring-fill { stroke: black; stroke-width: 5; fill: white; }
      .penguin-fill { fill: white; stroke: black; stroke-width: 4; }
      .detail-fill { fill: white; stroke: black; stroke-width: 3; }
      .eye-fill { fill: white; stroke: black; stroke-width: 3; }
      .steam-line { stroke: black; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .snowflake-outline { stroke: black; stroke-width: 3; fill: white; }
    </style>
  </defs>

  <g id="landscape">
    <path class="outline" d="M0 700 Q150 650 400 700 T800 650 L800 1000 L0 1000 Z"/>
    <path class="outline" d="M0 600 Q200 550 400 580 Q600 610 800 550 L800 700 L0 700 Z"/>
    <path class="outline" d="M0 450 Q100 400 250 430 Q400 460 550 420 Q700 390 800 400 L800 500 L0 500 Z"/>
  </g>

  <g id="hot-spring">
    <ellipse cx="400" cy="800" rx="350" ry="150" class="hot-spring-fill"/>
    <path class="steam-line" d="M100 680 Q150 650 200 680 M250 670 Q300 640 350 670 M400 685 Q450 655 500 685 M550 675 Q600 645 650 675 M700 690 Q750 660 800 690"/>
    <path class="steam-line" d="M120 710 Q170 680 220 710 M270 700 Q320 670 370 700 M420 715 Q470 685 520 715 M570 705 Q620 675 670 705 M720 720 Q770 690 800 720"/>
  </g>

  <g id="penguins">
