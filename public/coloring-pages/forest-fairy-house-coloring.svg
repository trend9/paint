<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="coloring_scene">

    <!-- Magical Mushroom House -->
    <g id="mushroom_house">
      <!-- Mushroom Stem -->
      <path d="M360 900 C340 800, 340 700, 400 680 C460 700, 460 800, 440 900 Z" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="400" cy="900" rx="60" ry="25" fill="white" stroke="black" stroke-width="4"/>

      <!-- Mushroom Cap -->
      <path d="M220 680 C180 500, 620 500, 580 680 Z" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="300" cy="580" r="30" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="500" cy="600" r="35" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="380" cy="530" r="25" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="250" cy="630" r="20" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="550" cy="630" r="20" fill="white" stroke="black" stroke-width="4"/>

      <!-- Door -->
      <path d="M380 870 L380 780 C380 750, 420 750, 420 780 L420 870 Z" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="410" cy="820" r="8" fill="white" stroke="black" stroke-width="3"/>

      <!-- Windows -->
      <circle cx="300" cy="780" r="25" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="500" cy="780" r="25" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Ground / Simple Grass -->
    <path d="M0 900 Q200 850, 400 900 T800 900 L800 1000 L0 1000 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Fairy -->
    <g id="fairy">
      <!-- Dress/Body -->
      <path d="M360 770 C330 800, 340 860, 400 870 C460 860, 470 800, 440 770 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Legs (implied by dress, simple lines below) -->
      <path d="M380 870 Q370 880, 370 890" fill="none" stroke="black" stroke-width="3"/>
      <path d="M420 870 Q430 880, 430 890" fill="none" stroke="black" stroke-width="3"/>

      <!-- Head -->
      <circle cx="400" cy="720" r="45" fill="white" stroke="black" stroke-width="4"/>
      <!-- Hair/Bangs -->
      <path d="M365 700 Q390 690, 435 700" fill="none" stroke="black" stroke-width="3"/>

      <!-- Face -->
      <circle cx="385" cy="725" r="5" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="415" cy="725" r="5" fill="white" stroke="black" stroke-width="3"/>
      <path d="M385 745 Q400 755, 415 745" fill="none" stroke="black" stroke-width="3"/> <!-- Smiling mouth -->

      <!-- Arms and Hands holding flower -->
      <g id="glowing_flower" transform="translate(400 820) scale(0.7)">
        <circle cx="0" cy="0" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Center -->
        <path d="M0 -20 Q15 -10, 20 0 Q15 10, 0 20 Q-15 10, -20 0 Q-15 -10, 0 -20 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Petals -->
      </g>
      <!-- Left Arm and hand -->
      <path d="M365 775 Q350 790, 370 820 C380 810, 380 830, 370 840 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Right Arm and hand -->
      <path d="M435 775 Q450 790, 430 820 C420 810, 420 830, 430 840 Z" fill="white" stroke="black" stroke-width="4"/>

      <!-- Fairy Wings -->
      <g id="fairy_wings">
        <!-- Left Wing -->
        <path d="M300 700 C250 600, 350 550, 380 650 Z" fill="white" stroke="black" stroke-width="4"/>
        <path d="M300 700 C280 620, 330 580, 360 630 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Inner detail -->
        <!-- Right Wing -->
        <path d="M500 700 C550 600, 450 550, 420 650 Z" fill="white" stroke="black" stroke-width="4"/>
        <path d="M500 700 C520 620, 470 580, 440 630 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Inner detail -->
      </g>
    </g>

    <!-- Whimsical Forest Elements -->
    <g id="forest_elements">
      <!-- Simple Leaves -->
      <ellipse cx="150" cy="890" rx="30" ry="15" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="650" cy="890" rx="30" ry="15" fill="white" stroke="black" stroke-width="4"/>

      <!-- Small Whimsical Flowers -->
      <g id="flower1" transform="translate(100 900) scale(0.8)">
        <circle cx="0" cy="0" r="10" fill="white" stroke="black" stroke-width="3"/>
        <path d="M0 -10 L5 -5 L10 0 L5 5 L0 10 L-5 5 L-10 0 L-5 -5 Z" fill="white" stroke="black" stroke-width="3"/>
      </g>
      <g id="flower2" transform="translate(700 900) scale(0.9)">
        <circle cx="0" cy="0" r="12" fill="white" stroke="black" stroke-width="3"/>
        <path d="M0 -12 L6 -6 L12 0 L6 6 L0 12 L-6 6 L-12 0 L-6 -6 Z" fill="white" stroke="black" stroke-width="3"/>
      </g>
      <g id="flower3" transform="translate(200 870) scale(0.7)">
        <circle cx="0" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
        <path d="M0 -8 Q5 -4, 8 0 Q5 4, 0 8 Q-5 4, -8 0 Q-5 -4, 0 -8 Z" fill="white" stroke="black" stroke-width="3"/>
      </g>
      <g id="flower4" transform="translate(600 870) scale(0.7)">
        <circle cx="0" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
        <path d="M0 -8 Q5 -4, 8 0 Q5 4, 0 8 Q-5 4, -8 0 Q-5 -4, 0 -8 Z" fill="white" stroke="black" stroke-width="3"/>
      </g>

      <!-- Friendly Tiny Butterfly -->
      <g id="butterfly" transform="translate(600 500) scale(0.8)">
        <ellipse cx="0" cy="0" rx="15" ry="30" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
        <circle cx="0" cy="-35" r="10" fill="white" stroke="black" stroke-width="4"/> <!-- Head -->
        <path d="M-10 -35 Q-20 -55, -30 -45" fill="none" stroke="black" stroke-width="3"/> <!-- Antenna left -->
        <path d="M10 -35 Q20 -55, 30 -45" fill="none" stroke="black" stroke-width="3"/> <!-- Antenna right -->

        <!-- Wings -->
        <path d="M-15 -10 Q-60 -50, -80 0 Q-60 50, -15 10 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left upper wing -->
        <path d="M15 -10 Q60 -50, 80 0 Q60 50, 15 10 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right upper wing -->
        <path d="M-15 10 Q-50 40, -40 70 Q-10 60, -15 10 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left lower wing -->
        <path d="M15 10 Q50 40, 40 70 Q10 60, 15 10 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right lower wing -->
        <!-- Simple wing patterns -->
        <circle cx="-50" cy="-20" r="10" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="50" cy="-20" r="10" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="-30" cy="40" r="8" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="30" cy="40" r="8" fill="white" stroke="black" stroke-width="3"/>
      </g>
    </g>

  </g>
</svg>