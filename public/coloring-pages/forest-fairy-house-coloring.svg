<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-outline {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail-outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line-art {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Group for the magical forest elements (chunky trees, ground line) -->
  <g id="forest-background">
    <!-- Ground line -->
    <path d="M0 800 Q 200 750 400 800 T 800 800" class="line-art" stroke-width="5"/>

    <!-- Chunky Trees -->
    <g id="tree-left">
      <rect x="50" y="550" width="100" height="300" rx="30" ry="30" class="main-outline"/>
      <ellipse cx="100" cy="550" rx="120" ry="100" class="main-outline"/>
    </g>
    <g id="tree-right">
      <rect x="650" y="600" width="100" height="250" rx="30" ry="30" class="main-outline"/>
      <ellipse cx="700" cy="600" rx="120" ry="100" class="main-outline"/>
    </g>
    <g id="tree-far-left">
      <rect x="0" y="650" width="70" height="200" rx="20" ry="20" class="main-outline"/>
      <ellipse cx="35" cy="650" rx="90" ry="80" class="main-outline"/>
    </g>
    <g id="tree-far-right">
      <rect x="730" y="680" width="70" height="200" rx="20" ry="20" class="main-outline"/>
      <ellipse cx="765" cy="680" rx="90" ry="80" class="main-outline"/>
    </g>
  </g>

  <!-- Group for the whimsical mushroom house -->
  <g id="mushroom-house">
    <!-- Mushroom Stem -->
    <rect x="400" y="550" width="200" height="350" rx="80" ry="80" class="main-outline"/>
    <!-- Mushroom Cap -->
    <path d="M300 550 C 300 350 400 250 500 250 C 600 250 700 350 700 550 Z" class="main-outline"/>
    <!-- Round Door -->
    <circle cx="500" cy="750" r="80" class="main-outline"/>
    <!-- Door handle -->
    <circle cx="560" cy="750" r="10" class="detail-outline"/>
    <!-- Windows -->
    <circle cx="460" cy="600" r="30" class="detail-outline"/>
    <circle cx="540" cy="600" r="30" class="detail-outline"/>
  </g>

  <!-- Group for the cute happy little fairy -->
  <g id="fairy">
    <!-- Body -->
    <ellipse cx="300" cy="680" rx="40" ry="60" class="main-outline"/>
    <!-- Head -->
    <circle cx="300" cy="590" r="50" class="main-outline"/>
    <!-- Hair (simple, chunky shapes) -->
    <path d="M250 540 Q 300 510 350 540 C 350 560 300 570 250 560 Z" class="main-outline"/> <!-- Bangs -->
    <path d="M250 570 Q200 590 200 630 Q250 650 250 600 Z" class="main-outline"/> <!-- Left side hair -->
    <path d="M350 570 Q400 590 400 630 Q350 650 350 600 Z" class="main-outline"/> <!-- Right side hair -->
    <!-- Big Eyes -->
    <circle cx="280" cy="580" r="15" class="detail-outline"/>
    <circle cx="320" cy="580" r="15" class="detail-outline"/>
    <!-- Pupils -->
    <circle cx="280" cy="585" r="5" class="detail-outline"/>
    <circle cx="320" cy="585" r="5" class="detail-outline"/>
    <!-- Happy Smile -->
    <path d="M280 610 Q 300 625 320 610" class="line-art"/>
    <!-- Simple Dress -->
    <path d="M260 700 L240 780 C240 820 360 820 360 780 L340 700 Z" class="main-outline"/>
    <!-- Arms -->
    <path d="M260 670 Q230 680 220 710" class="line-art"/>
    <path d="M340 670 Q370 680 380 710" class="line-art"/>
    <!-- Legs/Feet (simple) -->
    <path d="M290 790 V820 C290 830 270 830 270 820 V790 Z" class="main-outline"/>
    <path d="M310 790 V820 C310 830 330 830 330 820 V790 Z" class="main-outline"/>
    <!-- Wings (fill="none" for transparency effect for coloring) -->
    <path d="M340 600 Q380 550 400 600 Q380 650 340 600 Z" class="line-art" stroke-width="5"/>
    <path d="M260 600 Q220 550 200 600 Q220 650 260 600 Z" class="line-art" stroke-width="5"/>
  </g>

  <!-- Group for simple, large flowers -->
  <g id="flowers">
    <!-- Flower 1 (bottom left) -->
    <circle cx="150" cy="880" r="30" class="detail-outline"/> <!-- Center -->
    <circle cx="150" cy="840" r="25" class="detail-outline"/> <!-- Petal -->
    <circle cx="180" cy="860" r="25" class="detail-outline"/> <!-- Petal -->
    <circle cx="180" cy="900" r="25" class="detail-outline"/> <!-- Petal -->
    <circle cx="150" cy="920" r="25" class="detail-outline"/> <!-- Petal -->
    <circle cx="120" cy="900" r="25" class="detail-outline"/> <!-- Petal -->
    <circle cx="120" cy="860" r="25" class="detail-outline"/> <!-- Petal -->
    <!-- Flower 2 (bottom right) -->
    <circle cx="650" cy="890" r="35" class="detail-outline"/> <!-- Center -->
    <ellipse cx="650" cy="840" rx="30" ry="20" class="detail-outline"/>
    <ellipse cx="690" cy="860" rx="30" ry="20" class="detail-outline"/>
    <ellipse cx="690" cy="920" rx="30" ry="20" class="detail-outline"/>
    <ellipse cx="650" cy="940" rx="30" ry="20" class="detail-outline"/>
    <ellipse cx="610" cy="920" rx="30" ry="20" class="detail-outline"/>
    <ellipse cx="610" cy="860" rx="30" ry="20" class="detail-outline"/>
    <!-- Flower 3 (front center) -->
    <circle cx="400" cy="950" r="25" class="detail-outline"/>
    <circle cx="400" cy="920" r="20" class="detail-outline"/>
    <circle cx="420" cy="930" r="20" class="detail-outline"/>
    <circle cx="420" cy="970" r="20" class="detail-outline"/>
    <circle cx="400" cy="980" r="20" class="detail-outline"/>
    <circle cx="380" cy="970" r="20" class="detail-outline"/>
    <circle cx="380" cy="930" r="20" class="detail-outline"/>
  </g>

  <!-- Group for happy butterflies -->
  <g id="butterflies">
    <!-- Butterfly 1 (left) -->
    <ellipse cx="200" cy="500" rx="15" ry="30" class="detail-outline"/> <!-- Body -->
    <circle cx="200" cy="460" r="15" class="detail-outline"/> <!-- Head -->
    <path d="M190 460 Q170 430 180 410" class="line-art" stroke-width="3"/> <!-- Antenna -->
    <path d="M210 460 Q230 430 220 410" class="line-art" stroke-width="3"/> <!-- Antenna -->
    <path d="M180 480 Q150 450 150 500 Q150 550 180 520 Z" class="detail-outline"/> <!-- Wing L -->
    <path d="M220 480 Q250 450 250 500 Q250 550 220 520 Z" class="detail-outline"/> <!-- Wing R -->
    <!-- Butterfly 2 (right) -->
    <ellipse cx="600" cy="400" rx="15" ry="30" class="detail-outline"/> <!-- Body -->
    <circle cx="600" cy="360" r="15" class="detail-outline"/> <!-- Head -->
    <path d="M590 360 Q570 330 580 310" class="line-art" stroke-width="3"/> <!-- Antenna -->
    <path d="M610 360 Q630 330 620 310" class="line-art" stroke-width="3"/> <!-- Antenna -->
    <path d="M580 380 Q550 350 550 400 Q550 450 580 420 Z" class="detail-outline"/> <!-- Wing L -->
    <path d="M620 380 Q650 350 650 400 Q650 450 620 420 Z" class="detail-outline"/> <!-- Wing R -->
  </g>

</svg>