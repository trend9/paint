<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground line -->
  <path d="M0 750 Q200 700 400 750 T800 750" fill="white" stroke="black" stroke-width="4"/>

  <!-- Background Giraffe -->
  <g id="giraffe" stroke="black" stroke-width="4" fill="white">
    <!-- Body -->
    <ellipse cx="650" cy="700" rx="100" ry="70"/>
    <!-- Neck -->
    <path d="M600 650 Q580 400 630 350 L670 350 Q720 400 700 650 Z"/>
    <!-- Head -->
    <circle cx="650" cy="320" r="45"/>
    <!-- Snout -->
    <ellipse cx="650" cy="335" rx="30" ry="20"/>
    <!-- Ears -->
    <ellipse cx="615" cy="295" rx="12" ry="20"/>
    <ellipse cx="685" cy="295" rx="12" ry="20"/>
    <!-- Ossicones (horns) -->
    <path d="M630 275 C630 260 635 255 645 255 L655 255 C665 255 670 260 670 275 Z" fill="white"/>
    <circle cx="645" cy="255" r="8"/>
    <circle cx="655" cy="255" r="8"/>
    <!-- Eyes -->
    <circle cx="635" cy="310" r="5"/>
    <circle cx="665" cy="310" r="5"/>
    <!-- Spots (outline only, no fill) -->
    <circle cx="600" cy="550" r="25" fill="none"/>
    <circle cx="680" cy="580" r="30" fill="none"/>
    <circle cx="630" cy="620" r="20" fill="none"/>
    <circle cx="690" cy="670" r="25" fill="none"/>
    <circle cx="580" cy="680" r="20" fill="none"/>
    <circle cx="650" cy="400" r="20" fill="none"/>
    <circle cx="620" cy="450" r="25" fill="none"/>
    <circle cx="670" cy="480" r="20" fill="none"/>
  </g>

  <!-- Simplified Bushes -->
  <g id="bushes" stroke="black" stroke-width="4" fill="white">
    <path d="M100 750 Q120 680 180 670 T260 690 T300 750 Z"/>
    <path d="M400 750 Q430 650 500 660 T570 700 T600 750 Z"/>
    <path d="M700 750 Q730 690 780 700 V750 Z"/>
    <path d="M0 750 L0 700 Q50 650 100 680 Q150 710 200 700 Q250 690 300 720 Q350 750 0 750 Z" fill="white"/>
  </g>

  <!-- Cute Happy Baby Lion -->
  <g id="baby-lion" stroke="black" stroke-width="4" fill="white">
    <!-- Body -->
    <ellipse cx="400" cy="800" rx="180" ry="120"/>
    <!-- Head -->
    <circle cx="400" cy="600" r="100"/>
    <!-- Mane - outer layer -->
    <path d="M300 560 Q250 500 280 470 C300 440 350 430 400 430 C450 430 500 440 520 470 C550 500 500 560 500 560 L480 520 C460 490 430 480 400 480 C370 480 340 490 320 520 Z" fill="white"/>
    <!-- Mane - inner lines -->
    <path d="M320 520 C300 500 320 470 340 480" fill="none"/>
    <path d="M480 520 C500 500 480 470 460 480" fill="none"/>
    <path d="M350 480 C330 460 360 440 380 450" fill="none"/>
    <path d="M450 480 C470 460 440 440 420 450" fill="none"/>
    <path d="M400 480 V450" fill="none"/>

    <!-- Ears -->
    <ellipse cx="320" cy="520" rx="30" ry="40" transform="rotate(-20 320 520)"/>
    <ellipse cx="480" cy="520" rx="30" ry="40" transform="rotate(20 480 520)"/>
    <!-- Inner ears -->
    <ellipse cx="320" cy="520" rx="15" ry="25" transform="rotate(-20 320 520)" fill="white"/>
    <ellipse cx="480" cy="520" rx="15" ry="25" transform="rotate(20 480 520)" fill="white"/>

    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="360" cy="580" r="15"/>
    <circle cx="440" cy="580" r="15"/>
    <!-- Eyebrows -->
    <path d="M350 560 Q360 550 370 560" fill="none"/>
    <path d="M430 560 Q440 550 450 560" fill="none"/>
    <!-- Nose -->
    <path d="M390 610 Q400 600 410 610 C410 620 400 625 390 610 Z" fill="white"/>
    <!-- Mouth -->
    <path d="M360 630 Q380 650 400 650 Q420 650 440 630" fill="none"/>
    <path d="M400 625 V650" fill="none"/>
    <!-- Whiskers -->
    <path d="M340 620 L300 610" fill="none"/>
    <path d="M340 630 L300 640" fill="none"/>
    <path d="M460 620 L500 610" fill="none"/>
    <path d="M460 630 L500 640" fill="none"/>

    <!-- Front Legs -->
    <rect x="290" y="850" width="80" height="100" rx="40" ry="40"/>
    <rect x="430" y="850" width="80" height="100" rx="40" ry="40"/>
    <!-- Back legs (partially hidden) -->
    <rect x="230" y="850" width="80" height="100" rx="40" ry="40"/>
    <rect x="490" y="850" width="80" height="100" rx="40" ry="40"/>

    <!-- Tail -->
    <path d="M540 800 Q600 700 650 780" fill="none"/>
    <!-- Tail tuft -->
    <path d="M640 760 C630 790 660 800 680 780 C680 760 660 750 640 760 Z" fill="white"/>
  </g>
</svg>