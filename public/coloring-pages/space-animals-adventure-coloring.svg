<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Definitions for reusable elements -->
  <defs>
    <!-- Cute, chunky 4-point star perfect for toddlers to color -->
    <path id="star" d="M 0,-25 Q 0,0 25,0 Q 0,0 0,25 Q 0,0 -25,0 Q 0,0 0,-25 Z" />
  </defs>

  <!-- Solid white background for the coloring page -->
  <rect width="800" height="1000" fill="white" />

  <!-- Whimsical Space Background Elements -->
  <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Saturn-like Planet (Top Left) -->
    <g transform="translate(110, 120) rotate(-20)">
      <!-- Back of the ring -->
      <path d="M -75,0 C -75,-25 75,-25 75,0" fill="none" stroke-width="5" />
      <!-- Planet body -->
      <circle cx="0" cy="0" r="45" fill="white" stroke-width="5" />
      <!-- Front of the ring -->
      <path d="M -75,0 C -75,25 75,25 75,0" fill="none" stroke-width="5" />
      <!-- Cute planet decorative stripes -->
      <path d="M -39,-15 C -15,-5 15,-5 39,-15" fill="none" stroke-width="4" />
      <path d="M -41,15 C -15,25 15,25 41,15" fill="none" stroke-width="4" />
      <!-- Friendly face on planet -->
      <path d="M -15,-5 Q -10,-10 -5,-5" fill="none" stroke-width="4" />
      <path d="M 5,-5 Q 10,-10 15,-5" fill="none" stroke-width="4" />
      <path d="M -4,5 Q 0,10 4,5" fill="none" stroke-width="4" />
    </g>

    <!-- Big Smiling Moon (Top Right) -->
    <g transform="translate(650, 160)">
      <circle cx="0" cy="0" r="90" fill="white" stroke-width="5" />
      <!-- Craters -->
      <circle cx="-45" cy="-35" r="15" fill="white" stroke-width="5" />
      <circle cx="-25" cy="45" r="12" fill="white" stroke-width="5" />
      <circle cx="35" cy="-55" r="10" fill="white" stroke-width="5" />
      <circle cx="50" cy="20" r="18" fill="white" stroke-width="5" />
      <!-- Happy Face -->
      <path d="M -15,-10 Q -5,-18 5,-10" fill="none" stroke-width="5" />
      <path d="M 15,-10 Q 25,-18 35,-10" fill="none" stroke-width="5" />
      <path d="M -5,15 Q 5,25 15,15" fill="none" stroke-width="5" />
      <circle cx="35" cy="10" r="8" fill="white" stroke-width="4" />
    </g>

    <!-- Friendly Rocket Ship -->
    <g transform="translate(580, 420) rotate(25) scale(1.25)">
      <!-- Flame -->
      <path d="M -25,95 C -35,135 0,170 0,170 C 0,170 35,135 25,95 Z" fill="white" stroke-width="5" />
      <path d="M -12,95 C -18,115 0,135 0,135 C 0,135 18,115 12,95 Z" fill="white" stroke-width="4" />
      <!-- Left Fin -->
      <path d="M -45,30 C -80,50 -80,95 -45,95 Z" fill="white" stroke-width="5" />
      <!-- Right Fin -->
      <path d="M 45,30 C 80,50 80,95 45,95 Z" fill="white" stroke-width="5" />
      <!-- Rocket Body -->
      <path d="M -45,80 L -45,-40 C -45,-100 45,-100 45,-40 L 45,80 Z" fill="white" stroke-width="5" />
      <!-- Nose Cone Line -->
      <path d="M -45,-40 C -20,-30 20,-30 45,-40" fill="none" stroke-width="5" />
      <!-- Center Bottom Fin -->
      <path d="M -12,80 L -12,95 C -12,100 12,100 12,95 L 12,80 Z" fill="white" stroke-width="5" />
      <!-- Window -->
      <circle cx="0" cy="10" r="24" fill="white" stroke-width="5" />
      <circle cx="0" cy="10" r="18" fill="white" stroke-width="4" />
      <!-- Rocket Happy Eyes -->
      <circle cx="-15" cy="-55" r="5" fill="black" stroke="none" />
      <circle cx="15" cy="-55" r="5" fill="black" stroke="none" />
      <path d="M -8,-45 Q 0,-40 8,-45" fill="none" stroke-width="4" />
    </g>
  </g>

  <!-- Stars and Sparkles Scattered Around -->
  <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <use href="#star" transform="translate(380, 120) scale(1.2)" />
    <use href="#star" transform="translate(80, 350) scale(0.8)" />
    <use href="#star" transform="translate(350, 530) scale(1)" />
    <use href="#star" transform="translate(715, 550) scale(1.1)" />
    <use href="#star" transform="translate(320, 850) scale(0.9)" />
    <use href="#star" transform="translate(680, 880) scale(1.3)" />
    <use href="#star" transform="translate(540, 480) scale(0.7)" />
  </g>

  <!-- Floating background bubbles/dots -->
  <g fill="white" stroke="black" stroke-width="4">
    <circle cx="250" cy="80" r="7" />
    <circle cx="480" cy="220" r="9" />
    <circle cx="50" cy="500" r="6" />
    <circle cx="310" cy="680" r="8" />
    <circle cx="700" cy="720" r="10" />
    <circle cx="100" cy="880" r="7" />
  </g>

  <!-- Motion Swoosh Lines -->
  <g fill="none" stroke="black" stroke-width="4" stroke-linecap="round">
    <path d="M 80,270 Q 60,290 80,310" />
    <path d="M 350,260 Q 370,280 350,300" />
    <path d="M 370,610 Q 390,590 410,610" />
    <path d="M 640,680 Q 660,700 640,720" />
  </g>

  <!-- CHARACTER 1: ASTRONAUT BEAR (Top Left/Center) -->
  <g transform="translate(230, 320)">
    <!-- Suit Body & Arms -->
    <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Waving Arm -->
      <path d="M -40,110 C -80,100 -90,60 -75,50 C -60,40 -45,80 -40,90" />
      <!-- Right Arm -->
      <path d="M 40,110 C 80,120 90,150 75,160 C 60,170 45,130 40,120" />
      <!-- Suit Torso -->
      <path d="M -40,95 C -60,130 -60,180 0,180 C 60,180 60,130 40,95 Z" />
      <!-- Star on Chest -->
      <path d="M 0,120 L 4,128 L 13,129 L 6,135 L 8,144 L 0,139 L -8,144 L -6,135 L -13,129 L -4,128 Z" />
      <!-- Collar -->
      <ellipse cx="0" cy="85" rx="55" ry="14" />
    </g>

    <!-- Head & Ears (Drawn inside the helmet area) -->
    <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Ear -->
      <circle cx="-45" cy="-35" r="18" />
      <circle cx="-45" cy="-35" r="10" />
      <!-- Right Ear -->
      <circle cx="45" cy="-35" r="18" />
      <circle cx="45" cy="-35" r="10" />
      <!-- Bear Head -->
      <circle cx="0" cy="5" r="58" />
      <!-- Cute Face Details -->
      <path d="M -25,5 Q -18,13 -10,5" fill="none" stroke-width="4" />
      <path d="M 10,5 Q 17,13 25,5" fill="none" stroke-width="4" />
      <!-- Muzzle -->
      <ellipse cx="0" cy="25" rx="16" ry="11" />
      <!-- Nose -->
      <path d="M -6,22 Q 0,16 6,22 Q 0,28 -6,22 Z" fill="white" />
      <!-- Smile -->
      <path d="M -6,29 Q 0,35 6,29" fill="none" stroke-width="4" />
    </g>

    <!-- Glass Helmet & Antenna -->
    <g stroke="black" stroke-linecap="round" stroke-linejoin="round">
      <!-- Antenna -->
      <line x1="0" y1="-85" x2="0" y2="-110" stroke-width="5" />
      <circle cx="0" cy="-118" r="9" fill="white" stroke-width="5" />
      <!-- Helmet Outer Ring -->
      <circle cx="0" cy="0" r="85" fill="none" stroke-width="5" />
      <!-- Helmet Highlight/Glare -->
      <path d="M -60,-40 A 75,75 0 0 1 30,-65" fill="none" stroke-width="4" />
    </g>
  </g>

  <!-- CHARACTER 2: ASTRONAUT DOG (Bottom Left) -->
  <g transform="translate(190, 670)">
    <!-- Suit Body & Arms -->
    <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Arm -->
      <path d="M -40,110 C -80,115 -90,145 -75,160 C -60,175 -45,135 -40,125" />
      <!-- Right Waving Arm -->
      <path d="M 40,110 C 80,95 90,65 75,55 C 60,45 45,85 40,95" />
      <!-- Suit Torso -->
      <path d="M -40,95 C -60,130 -60,190 0,190 C 60,190 60,130 40,95 Z" />
      <!-- Heart on Chest -->
      <path d="M 0,140 C 0,140 -7,130 -12,135 C -17,140 -12,150 0,157 C 12,150 17,140 12,135 C 7,130 0,140 0,140 Z" />
      <!-- Collar -->
      <ellipse cx="0" cy="85" rx="55" ry="14" />
    </g>

    <!-- Head & Ears (Drawn inside the helmet area) -->
    <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Floppy Ear -->
      <path d="M -45,-35 C -70,-35 -70,25 -45,25 C -35,25 -30,-5 -40,-25 Z" />
      <!-- Right Floppy Ear -->
      <path d="M 45,-35 C 70,-35 70,25 45,25 C 35,25 30,-5 40,-25 Z" />
      <!-- Dog Head -->
      <circle cx="0" cy="5" r="58" />
      <!-- Cute Eye Patch on the left eye -->
      <path d="M -30,-5 C -40,-5 -40,25 -25,25 C -15,25 -15,-5 -30,-5 Z" fill="white" />
      <!-- Happy Closed Eyes -->
      <path d="M -27,5 Q -20,13 -13,5" fill="none" stroke-width="4" />
      <path d="M 13,5 Q 20,13 27,5" fill="none" stroke-width="4" />
      <!-- Snout -->
      <ellipse cx="0" cy="25" rx="18" ry="12" />
      <!-- Nose -->
      <path d="M -8,22 Q 0,15 8,22 Q 0,29 -8,22 Z" fill="white" />
      <!-- Puppy Smile -->
      <path d="M -8,30 Q 0,37 0,30 Q 0,37 8,30" fill="none" stroke-width="4" />
    </g>

    <!-- Glass Helmet & Antenna -->
    <g stroke="black" stroke-linecap="round" stroke-linejoin="round">
      <!-- Antenna -->
      <line x1="0" y1="-90" x2="0" y2="-115" stroke-width="5" />
      <circle cx="0" cy="-123" r="9" fill="white" stroke-width="5" />
      <!-- Helmet Outer Ring -->
      <circle cx="0" cy="0" r="90" fill="none" stroke-width="5" />
      <!-- Helmet Highlight/Glare -->
      <path d="M -63,-43 A 80,80 0 0 1 32,-68" fill="none" stroke-width="4" />
    </g>
  </g>

  <!-- CHARACTER 3: ASTRONAUT CAT (Bottom Right) -->
  <g transform="translate(500, 750)">
    <!-- Suit Body & Arms -->
    <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Arm -->
      <path d="M -40,110 C -80,120 -90,150 -75,160 C -60,170 -45,130 -40,120" />
      <!-- Right Arm -->
      <path d="M 40,110 C 80,120 90,150 75,160 C 60,170 45,130 40,120" />
      <!-- Suit Torso -->
      <path d="M -40,95 C -70,120 -70,190 0,190 C 70,190 70,120 40,95 Z" />
      <!-- Cute Moon Patch on Chest -->
      <path d="M -7,125 A 12,12 0 0 0 7,137 A 9,9 0 1 1 -7,125 Z" />
      <!-- Collar -->
      <ellipse cx="0" cy="85" rx="55" ry="14" />
    </g>

    <!-- Head & Ears (Drawn inside the helmet area) -->
    <g fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Pointy Ear -->
      <path d="M -45,-25 L -35,-60 Q -30,-65 -25,-57 L -12,-30 Z" />
      <!-- Right Pointy Ear -->
      <path d="M 45,-25 L 35,-60 Q 30,-65 25,-57 L 12,-30 Z" />
      <!-- Cat Head -->
      <circle cx="0" cy="5" r="58" />
      <!-- Whiskers -->
      <line x1="-60" y1="15" x2="-80" y2="12" stroke-width="4" />
      <line x1="-60" y1="22" x2="-80" y2="25" stroke-width="4" />
      <line x1="60" y1="15" x2="80" y2="12" stroke-width="4" />
      <line x1="60" y1="22" x2="80" y2="25" stroke-width="4" />
      <!-- Happy Closed Eyes -->
      <path d="M -27,5 Q -20,-3 -13,5" fill="none" stroke-width="4" />
      <path d="M 13,5 Q 20,-3 27,5" fill="none" stroke-width="4" />
      <!-- Nose -->
      <polygon points="-4,12 4,12 0,16" />
      <!-- Cat Mouth -->
      <path d="M -8,22 Q 0,28 0,22 Q 0,28 8,22" fill="none" stroke-width="4" />
    </g>

    <!-- Glass Helmet & Antenna -->
    <g stroke="black" stroke-linecap="round" stroke-linejoin="round">
      <!-- Antenna -->
      <line x1="0" y1="-85" x2="0" y2="-110" stroke-width="5" />
      <circle cx="0" cy="-118" r="9" fill="white" stroke-width="5" />
      <!-- Helmet Outer Ring -->
      <circle cx="0" cy="0" r="85" fill="none" stroke-width="5" />
      <!-- Helmet Highlight/Glare -->
      <path d="M -60,-40 A 75,75 0 0 1 30,-65" fill="none" stroke-width="4" />
    </g>
  </g>

  <!-- Thick Outer Border for Coloring Book Style -->
  <rect x="15" y="15" width="770" height="970" fill="none" stroke="black" stroke-width="10" rx="25" />
</svg>