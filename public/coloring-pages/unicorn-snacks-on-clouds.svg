  <path d="M 500,200 Q 500,218 518,218 Q 500,218 500,236 Q 500,218 482,218 Q 500,218 500,200 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

