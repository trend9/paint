<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1000" fill="white"/>

  <!-- Page Border Frame -->
  <rect x="25" y="25" width="750" height="950" rx="30" ry="30" fill="none" stroke="black" stroke-width="6"/>

  <!-- FLOATING ELEMENTS (BACKGROUND) -->
  
  <!-- 5-Point Star (Top Left) -->
  <path d="M 180,140 L 187,158 L 206,159 L 191,170 L 196,188 L 180,177 L 164,188 L 169,170 L 154,159 L 173,158 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5-Point Star (Top Right) -->
  <path d="M 620,130 L 629,151 L 652,152 L 634,166 L 640,188 L 620,175 L 600,188 L 606,166 L 588,152 L 611,151 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5-Point Star (Mid Left) -->
  <path d="M 110,480 L 116,494 L 131,495 L 119,504 L 123,518 L 110,509 L 97,518 L 101,504 L 89,495 L 104,494 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5-Point Star (Bottom Right) -->
  <path d="M 690,650 L 696,664 L 711,665 L 699,674 L 703,688 L 690,679 L 677,688 L 681,674 L 669,665 L 684,664 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Point Sparkle (Top Center Left) -->
  <path d="M 300,130 Q 300,148 318,148 Q 300,148 300,166 Q 300,148 282,148 Q 300,148 300,130 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

