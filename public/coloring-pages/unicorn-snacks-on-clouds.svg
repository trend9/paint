  <path d="M 230,240 C 230,225 212,215 198,228 C 184,215 166,225 166,240 C 166,260 198,278 198,282 C 198,278 230,260 230,240 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cute Heart (Right) -->
  <path d="M 550,310 C 550,298 535,290 523,300 C 511,290 496,298 496,310 C 496,326 523,340 523,343 C 523,340 550,326 550,310 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Wrapped Candy (Left) -->
  <g transform="translate(150, 340) rotate(-15)">
    <path d="M -25,0 L -45,-20 L -45,20 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 25,0 L 45,-20 L 45,20 Z" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-25" y="-18" width="50" height="36" rx="12" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -8,-17 L -16,17" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 12,-17 L 4,17" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Cookie (Top Right) -->
  <g transform="translate(630, 270) rotate(20)">
    <circle cx="0" cy="0" r="38" fill="white" stroke="black" stroke-width="5"/>
    <!-- Chocolate Chips -->
    <circle cx="-14" cy="-14" r="6" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="12" cy="-18" r="7" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="18" cy="8" r="5" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="-6" cy="18" r="7" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="-20" cy="6" r="5" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="0" cy="-2" r="6" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Floating Wrapped Candy (Right) -->
  <g transform="translate(660, 480) rotate(30)">
    <path d="M -20,0 L -38,-16 L -38,16 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20,0 L 38,-16 L 38,16 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="22" fill="white" stroke="black" stroke-width="5"/>
    <path d="M -6,-21 C -2,-7 -2,7 -6,21" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 6,-21 C 10,-7 10,7 6,21" fill="none" stroke="black" stroke-width="4"/>
  </g>

