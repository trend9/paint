<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">

  <!-- Rainbow Arc in the background -->
  <g id="rainbow">
    <path d="M 100 250 Q 400 50 700 250" fill="none" />
    <path d="M 120 270 Q 400 80 680 270" fill="none" />
    <path d="M 140 290 Q 400 110 660 290" fill="none" />
  </g>

  <!-- Fluffy Clouds -->
  <g id="clouds">
    <!-- Cloud 1 (left) -->
    <path d="M 100 450 Q 50 400 150 350 Q 200 320 280 380 Q 300 430 220 480 Q 180 500 100 450 Z" />
    <!-- Cloud 2 (right) -->
    <path d="M 700 380 Q 750 330 650 280 Q 600 250 520 310 Q 500 360 580 410 Q 620 430 700 380 Z" />
    <!-- Cloud 3 (bottom left, slightly under locomotive) -->
    <path d="M 180 850 Q 130 800 230 750 Q 280 720 360 780 Q 380 830 300 880 Q 260 900 180 850 Z" />
  </g>

  <!-- Happy Cute Steam Locomotive -->
  <g id="locomotive">
    <!-- Main Boiler Body -->
    <rect x="150" y="400" width="450" height="200" rx="100" />

    <!-- Cab -->
    <rect x="580" y="350" width="180" height="250" rx="20" />
    <rect x="600" y="380" width="120" height="80" rx="10" /> <!-- Window -->

    <!-- Chimney -->
    <rect x="250" y="300" width="80" height="100" rx="20" />
    <ellipse cx="290" cy="300" rx="50" ry="20" /> <!-- Chimney top -->

    <!-- Front Buffer -->
    <rect x="100" y="550" width="80" height="80" rx="20" />

    <!-- Front Lamp -->
    <circle cx="140" cy="480" r="30" />

    <!-- Wheels (large drive wheels) -->
    <circle cx="300" cy="680" r="70" />
    <circle cx="550" cy="680" r="70" />

    <!-- Connecting Rods (simplified) -->
    <path d="M 300 680 L 550 680" fill="none" />
    <circle cx="300" cy="680" r="15" />
    <circle cx="550" cy="680" r="15" />

    <!-- Steam Puffs from chimney -->
    <g id="steam">
      <path d="M 300 250 Q 280 200 350 170 Q 380 150 440 220 Q 460 270 300 250 Z" />
      <path d="M 350 230 Q 330 180 400 150 Q 430 130 490 200 Q 510 250 350 230 Z" />
    </g>

    <!-- Friendly Face on the front of the boiler -->
    <g id="face">
      <!-- Eyes -->
      <circle cx="270" cy="480" r="25" />
      <circle cx="380" cy="480" r="25" />
      <!-- Mouth -->
      <path d="M 290 520 Q 325 550 360 520" fill="none" />
    </g>

  </g>

</svg>