<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Marshmallow Clouds in the background -->
  <g id="clouds" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cloud 1 -->
    <path d="M100 200 Q150 150 200 200 Q250 150 300 200 Q250 250 200 220 Q150 250 100 200Z" />
    <!-- Cloud 2 -->
    <path d="M500 150 Q550 100 600 150 Q650 100 700 150 Q650 200 600 170 Q550 200 500 150Z" />
    <!-- Cloud 3 (smaller) -->
    <path d="M70 350 Q100 320 130 350 Q160 320 190 350 Q160 380 130 360 Q100 380 70 350Z" />
    <!-- Cloud 4 (smaller) -->
    <path d="M600 300 Q630 270 660 300 Q690 270 720 300 Q690 330 660 310 Q630 330 600 300Z" />
  </g>

  <!-- Candy Train -->
  <g id="candy-train" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Locomotive -->
    <g id="locomotive">
      <!-- Main Body -->
      <rect x="50" y="550" width="300" height="150" rx="30" ry="30"/>
      <!-- Cab -->
      <rect x="250" y="480" width="100" height="70" rx="20" ry="20"/>
      <!-- Front Engine Part -->
      <ellipse cx="65" cy="625" rx="30" ry="40"/>
      <!-- Chimney Base -->
      <rect x="120" y="470" width="60" height="40" rx="10" ry="10"/>
      <!-- Chimney Top -->
      <path d="M110 470 C110 450 170 450 190 470 L190 490 L110 490 Z" fill="white"/>
      <line x1="110" y1="470" x2="190" y2="470" stroke="black" stroke-width="4"/>
      <!-- Headlight -->
      <circle cx="50" cy="625" r="20"/>
      <!-- Front Grin (simplified) -->
      <path d="M55 650 Q75 670 95 650" fill="none"/>
      <!-- Front Eyes -->
      <circle cx="70" cy="610" r="5" stroke-width="2"/>
      <circle cx="85" cy="610" r="5" stroke-width="2"/>

      <!-- Locomotive Lollipop Wheels -->
      <g id="loco-wheels">
        <!-- Wheel 1 -->
        <circle cx="150" cy="720" r="40"/>
        <path d="M150 720 L150 680 M150 720 L184 699 M150 720 L184 741 M150 720 L150 760 M150 720 L116 741 M150 720 L116 699" stroke="black" stroke-width="3" fill="none"/>
        
        <!-- Wheel 2 -->
        <circle cx="280" cy="720" r="40"/>
        <path d="M280 720 L280 680 M280 720 L314 699 M280 720 L314 741 M280 720 L280 760 M280 720 L246 741 M280 720 L246 699" stroke="black" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- Wagon 1 (Chocolate Bar) -->
    <g id="wagon1" transform="translate(320 0)">
      <rect x="50" y="580" width="200" height="120" rx="20" ry="20"/>
      <!-- Chocolate bar segments -->
      <line x1="80" y1="580" x2="80" y2="700" stroke-width="3" fill="none"/>
      <line x1="110" y1="580" x2="110" y2="700" stroke-width="3" fill="none"/>
      <line x1="140" y1="580" x2="140" y2="700" stroke-width="3" fill="none"/>
      <line x1="170" y1="580" x2="170" y2="700" stroke-width="3" fill="none"/>
      <line x1="200" y1="580" x2="200" y2="700" stroke-width="3" fill="none"/>
      <line x1="230" y1="580" x2="230" y2="700" stroke-width="3" fill="none"/>

      <!-- Gummy Bear 1 -->
      <g id="gummy-bear-1" transform="translate(70 590)">
        <path d="M20 0 A20 20 0 0 1 40 20 A10 10 0 0 1 30 30 Q30 50 20 50 Q10 50 10 30 A10 10 0 0 1 0 20 A20 20 0 0 1 20 0 Z"/>
        <circle cx="15" cy="20" r="3" stroke-width="2"/>
        <circle cx="25" cy="20" r="3" stroke-width="2"/>
        <path d="M18 35 Q20 38 22 35" stroke="black" stroke-width="3" fill="none"/>
      </g>
      <!-- Gummy Bear 2 -->
      <g id="gummy-bear-2" transform="translate(160 590)">
        <path d="M20 0 A20 20 0 0 1 40 20 A10 10 0 0 1 30 30 Q30 50 20 50 Q10 50 10 30 A10 10 0 0 1 0 20 A20 20 0 0 1 20 0 Z"/>
        <circle cx="15" cy="20" r="3" stroke-width="2"/>
        <circle cx="25" cy="20" r="3" stroke-width="2"/>
        <path d="M18 35 Q20 38 22 35" stroke="black" stroke-width="3" fill="none"/>
      </g>

      <!-- Wagon Lollipop Wheels -->
      <g id="wagon1-wheels">
        <circle cx="100" cy="720" r="35"/>
        <path d="M100 720 L100 685 M100 720 L130 705 M100 720 L130 735 M100 720 L100 755 M100 720 L70 735 M100 720 L70 705" stroke="black" stroke-width="3" fill="none"/>

        <circle cx="200" cy="720" r="35"/>
        <path d="M200 720 L200 685 M200 720 L230 705 M200 720 L230 735 M200 720 L200 755 M200 720 L170 735 M200 720 L170 705" stroke="black" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- Wagon 2 (Chocolate Bar) -->
    <g id="wagon2" transform="translate(520 0)">
      <rect x="50" y="580" width="200" height="120" rx="20" ry="20"/>
      <!-- Chocolate bar segments -->
      <line x1="80" y1="580" x2="80" y2="700" stroke-width="3" fill="none"/>
      <line x1="110" y1="580" x2="110" y2="700" stroke-width="3" fill="none"/>
      <line x1="140" y1="580" x2="140" y2="700" stroke-width="3" fill="none"/>
      <line x1="170" y1="580" x2="170" y2="700" stroke-width="3" fill="none"/>
      <line x1="200" y1="580" x2="200" y2="700" stroke-width="3" fill="none"/>
      <line x1="230" y1="580" x2="230" y2="700" stroke-width="3" fill="none"/>

      <!-- Gummy Bear 3 -->
      <g id="gummy-bear-3" transform="translate(70 590)">
        <path d="M20 0 A20 20 0 0 1 40 20 A10 10 0 0 1 30 30 Q30 50 20 50 Q10 50 10 30 A10 10 0 0 1 0 20 A20 20 0 0 1 20 0 Z"/>
        <circle cx="15" cy="20" r="3" stroke-width="2"/>
        <circle cx="25" cy="20" r="3" stroke-width="2"/>
        <path d="M18 35 Q20 38 22 35" stroke="black" stroke-width="3" fill="none"/>
      </g>
      <!-- Gummy Bear 4 -->
      <g id="gummy-bear-4" transform="translate(160 590)">
        <path d="M20 0 A20 20 0 0 1 40 20 A10 10 0 0 1 30 30 Q30 50 20 50 Q10 50 10 30 A10 10 0 0 1 0 20 A20 20 0 0 1 20 0 Z"/>
        <circle cx="15" cy="20" r="3" stroke-width="2"/>
        <circle cx="25" cy="20" r="3" stroke-width="2"/>
        <path d="M18 35 Q20 38 22 35" stroke="black" stroke-width="3" fill="none"/>
      </g>

      <!-- Wagon Lollipop Wheels -->
      <g id="wagon2-wheels">
        <circle cx="100" cy="720" r="35"/>
        <path d="M100 720 L100 685 M100 720 L130 705 M100 720 L130 735 M100 720 L100 755 M100 720 L70 735 M100 720 L70 705" stroke="black" stroke-width="3" fill="none"/>

        <circle cx="200" cy="720" r="35"/>
        <path d="M200 720 L200 685 M200 720 L230 705 M200 720 L230 735 M200 720 L200 755 M200 720 L170 735 M200 720 L170 705" stroke="black" stroke-width="3" fill="none"/>
      </g>
    </g>

    <!-- Connectors between train parts -->
    <rect x="345" y="650" width="25" height="15" rx="5" ry="5"/>
    <rect x="545" y="650" width="25" height="15" rx="5" ry="5"/>

  </g>

</svg>