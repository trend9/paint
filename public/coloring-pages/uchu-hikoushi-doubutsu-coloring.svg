      <circle cx="130" cy="820" r="50" />
      <path d="M 85 810 Q 130 835 175 810" fill="none" />
      <circle cx="125" cy="845" r="9" />
    </g>

    <!-- Bottom-Right Shooting Star -->
    <g id="shooting-star">
      <!-- Tail Stripes -->
      <path d="M 660 770 Q 690 730 730 710" fill="none" />
      <path d="M 675 785 Q 710 750 750 730" fill="none" />
      <path d="M 690 800 Q 730 770 770 750" fill="none" />
      <!-- Star Head -->
      <polygon points="650,750 658,768 678,770 663,784 667,804 650,793 633,804 637,784 622,770 642,768" />
    </g>

    <!-- Large 5-Point Stars -->
    <!-- Star 1: Top Center -->
    <polygon points="390,40 397,58 417,58 401,70 407,89 390,77 373,89 379,70 363,58 383,58" />
    <!-- Star 2: Top Left -->
    <polygon points="260,110 266,124 282,124 269,134 274,149 260,139 246,149 251,134 238,124 254,124" />
    <!-- Star 3: Top Right -->
    <polygon points="530,90 537,107 555,107 540,118 546,135 530,124 514,135 520,118 505,107 523,107" />
    <!-- Star 4: Middle Left -->
    <polygon points="210,330 216,345 232,345 219,355 224,370 210,360 196,370 201,355 188,345 204,345" />
    <!-- Star 5: Middle Right -->
    <polygon points="580,310 587,326 605,326 591,337 596,354 580,343 564,354 569,337 555,326 573,326" />
    <!-- Star 6: Lower Right -->
    <polygon points="570,620 577,635 593,635 580,645 585,660 570,650 555,660 560,645 547,635 563,635" />
    <!-- Star 7: Lower Left -->
    <polygon points="220,650 226,664 242,664 229,674 234,689 220,679 206,689 211,674 198,664 214,664" />

    <!-- Cute 4-Point Sparkle Stars -->
    <path d="M 280 230 Q 280 245 295 245 Q 280 245 280 260 Q 280 245 265 245 Q 280 245 280 230" />
    <path d="M 520 220 Q 520 235 535 235 Q 520 235 520 250 Q 520 235 505 235 Q 520 235 520 220" />
    <path d="M 100 310 Q 100 322 112 322 Q 100 322 100 334 Q 100 322 88 322 Q 100 322 100 310" />
    <path d="M 710 320 Q 710 332 722 332 Q 710 332 710 344 Q 710 332 698 332 Q 710 332 710 320" />
    <path d="M 700 580 Q 700 595 715 595 Q 700 595 700 610 Q 700 595 685 595 Q 700 595 700 580" />
    <path d="M 90 640 Q 90 652 102 652 Q 90 652 90 664 Q 90 652 78 652 Q 90 652 90 640" />
    <path d="M 230 780 Q 230 792 242 792 Q 230 792 230 804 Q 230 792 218 792 Q 230 792 230 780" />

    <!-- Space Dots / Little Bubbles -->
    <circle cx="340" cy="100" r="5" fill="black" />
    <circle cx="470" cy="90" r="6" fill="black" />
    <circle cx="610" cy="230" r="5" fill="black" />
    <circle cx="180" cy="240" r="6" fill="black" />
    <circle cx="60" cy="400" r="5" fill="black" />
    <circle cx="735" cy="245" r="5" fill="black" />
    <circle cx="740" cy="400" r="6" fill="black" />
    <circle cx="640" cy="540" r="5" fill="black" />
    <circle cx="150" cy="570" r="6" fill="black" />
    <circle cx="70" cy="730" r="5" fill="black" />
    <circle cx="730" cy="670" r="6" fill="black" />
    <circle cx="735" cy="850" r="5" fill="black" />
