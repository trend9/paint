    <circle cx="455" cy="465" r="52" />
    <!-- Bolts -->
    <circle cx="455" cy="408" r="3" fill="black" />
    <circle cx="495" cy="420" r="3" fill="black" />
    <circle cx="512" cy="465" r="3" fill="black" />
    <circle cx="495" cy="510" r="3" fill="black" />
    <circle cx="455" cy="522" r="3" fill="black" />
    <circle cx="415" cy="510" r="3" fill="black" />
    <circle cx="398" cy="465" r="3" fill="black" />
    <circle cx="415" cy="420" r="3" fill="black" />

