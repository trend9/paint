    <circle cx="402" cy="465" r="3" fill="black" />
    <circle cx="385" cy="510" r="3" fill="black" />
    <circle cx="345" cy="522" r="3" fill="black" />
    <circle cx="305" cy="510" r="3" fill="black" />
    <circle cx="288" cy="465" r="3" fill="black" />
    <circle cx="305" cy="420" r="3" fill="black" />

