    <path d="M 451 474 Q 455 478 459 474" fill="none" />

    <!-- Fox Happy Eyes (Arched or Open) -->
    <ellipse cx="444" cy="458" rx="4" ry="5" fill="black" />
    <circle cx="442" cy="456" r="1.5" fill="white" stroke="none" />
    <ellipse cx="466" cy="458" rx="4" ry="5" fill="black" />
    <circle cx="464" cy="456" r="1.5" fill="white" stroke="none" />

    <!-- Spacesuit Shoulders -->
    <path d="M 425 510 Q 455 495 485 510" />
    <path d="M 440 493 Q 455 500 470 493" fill="none" />

    <!-- Fox Waving Right Paw -->
    <path d="M 500 475 C 512 465 508 445 496 450 C 488 455 488 470 494 480 Z" />
    <!-- Fox Paw Details -->
