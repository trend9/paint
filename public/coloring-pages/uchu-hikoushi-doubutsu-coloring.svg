  <!-- ==================== ROCKET EXHAUST & FLAMES ==================== -->
  <g id="rocket-exhaust" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Big Outer Flame -->
    <path d="M 330 730 C 310 800 320 850 400 930 C 480 850 490 800 470 730 Z" />
    <!-- Middle Flame -->
    <path d="M 350 730 C 340 780 350 820 400 870 C 450 820 460 780 450 730 Z" />
    <!-- Inner Flame -->
    <path d="M 375 730 C 370 760 380 785 400 815 C 420 785 430 760 425 730 Z" />
    <!-- Cute Smoke Puffs beside flames -->
    <path d="M 300 750 C 270 760 260 790 280 810 C 260 825 270 855 300 855 C 315 855 330 845 335 830" />
    <path d="M 500 750 C 530 760 540 790 520 810 C 540 825 530 855 500 855 C 485 855 470 845 465 830" />
  </g>

  <!-- ==================== ROCKET FINS & BASE ==================== -->
  <g id="rocket-fins" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Left Large Fin -->
    <path d="M 275 560 C 230 580 185 640 180 700 C 210 710 245 695 275 665 Z" />
    <path d="M 220 670 C 240 655 260 635 270 610" fill="none" />

    <!-- Right Large Fin -->
    <path d="M 525 560 C 570 580 615 640 620 700 C 590 710 555 695 525 665 Z" />
    <path d="M 580 670 C 560 655 540 635 530 610" fill="none" />

    <!-- Rocket Engine Nozzle -->
    <path d="M 340 700 L 325 735 C 325 742 475 742 475 735 L 460 700 Z" />
    <line x1="365" y1="735" x2="370" y2="700" />
    <line x1="400" y1="735" x2="400" y2="700" />
    <line x1="435" y1="735" x2="430" y2="700" />
  </g>

  <!-- ==================== MAIN ROCKET BODY ==================== -->
  <g id="rocket-body" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Rocket Main Shell -->
    <path d="M 400 130 C 330 200 270 330 270 510 C 270 610 280 675 285 705 L 515 705 C 520 675 530 610 530 510 C 530 330 470 200 400 130 Z" />

    <!-- Nose Cone Tip Antenna -->
    <circle cx="400" cy="90" r="14" />
    <path d="M 400 104 L 400 130" />
    <!-- Nose Cone Divider Line -->
    <path d="M 335 210 Q 400 240 465 210" />

    <!-- Decorative Body Bands -->
    <path d="M 271 520 Q 400 560 529 520" fill="none" />
    <path d="M 275 670 Q 400 705 525 670" fill="none" />
    <circle cx="305" cy="685" r="5" fill="black" />
    <circle cx="340" cy="690" r="5" fill="black" />
    <circle cx="400" cy="692" r="5" fill="black" />
    <circle cx="460" cy="690" r="5" fill="black" />
    <circle cx="495" cy="685" r="5" fill="black" />
  </g>

  <!-- ==================== CHARACTERS IN PORTHOLES ==================== -->

  <!-- ================= TOP PORTHOLE: RABBIT ASTRONAUT ================= -->
  <g id="rabbit-astronaut" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Rabbit Porthole Frame Outer -->
    <circle cx="400" cy="305" r="75" />
    <!-- Rabbit Porthole Inner Opening -->
    <circle cx="400" cy="305" r="64" />
    <!-- Bolts on Porthole -->
