<svg viewBox="0 0 800 1000">
  <g id="background-elements">
    <!-- Crescent Moon (large, simple shape) -->
    <path d="M 150 150 A 90 90 0 0 1 150 330 A 75 75 0 0 0 135 170 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Simplified Stars (various sizes) -->
    <circle cx="650" cy="100" r="20" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="720" cy="200" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="580" cy="50" r="25" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="250" cy="50" r="18" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="100" cy="400" r="12" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="700" cy="300" r="22" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="50" cy="700" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="750" cy="850" r="18" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="400" cy="900" r="20" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="150" cy="900" r="10" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="rocket" transform="translate(500, 300)">
    <!-- Rocket Body (rounded rectangle) -->
    <rect x="-60" y="0" width="120" height="250" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose Cone (rounded top path) -->
    <path d="M -60 40 Q -60 -20 0 -50 Q 60 -20 60 40 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Fins (simple triangular shapes) -->
    <path d="M 60 200 L 100 250 L 60 250 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M -60 200 L -100 250 L -60 250 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Engine/Flame outline (simple wavy path) -->
    <path d="M -40 250 Q -70 300 0 320 Q 70 300 40 250 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="dog-astronaut" transform="translate(350, 550)">
    <!-- Spacesuit Helmet Base (circle) -->
    <circle cx="0" cy="-50" r="100" fill="white" stroke="black" stroke-width="4"/>
    <!-- Helmet Visor (inner circle outline) -->
    <circle cx="0" cy="-50" r="70" fill="none" stroke="black" stroke-width="4"/>
    <!-- Dog Head (inside helmet, large circle) -->
    <circle cx="0" cy="-50" r="60" fill="white" stroke="black" stroke-width="4"/>
    <!-- Dog Ears (simplified ellipses) -->
    <ellipse cx="-45" cy="-115" rx="20" ry="30" transform="rotate(-10 -45 -115)" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="45" cy="-115" rx="20" ry="30" transform="rotate(10 45 -115)" fill="white" stroke="black" stroke-width="4"/>
    <!-- Dog Snout (ellipse) -->
    <ellipse cx="0" cy="-20" rx="35" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Dog Nose (small circle on snout) -->
    <circle cx="0" cy="-20" r="10" fill="white" stroke="black" stroke-width="4"/>
    <!-- Dog Mouth (simple happy curve) -->
    <path d="M -20 0 Q 0 15 20 0" fill="none" stroke="black" stroke-width="4"/>
    <!-- Dog Eyes (simple circles) -->
    <circle cx="-25" cy="-70" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="25" cy="-70" r="10" fill="white" stroke="black" stroke-width="4"/>

    <!-- Spacesuit Body (large rounded rectangle) -->
    <rect x="-90" y="0" width="180" height="220" rx="70" ry="70" fill="white" stroke="black" stroke-width="4"/>
    <!-- Spacesuit Arms (rounded rectangles, floating) -->
    <rect x="-160" y="30" width="60" height="110" rx="30" ry="30" transform="rotate(-25 -160 30)" fill="white" stroke="black" stroke-width="4"/>
    <rect x="100" y="30" width="60" height="110" rx="30" ry="30" transform="rotate(25 100 30)" fill="white" stroke="black" stroke-width="4"/>
    <!-- Spacesuit Legs/Feet (rounded rectangles, floating) -->
    <rect x="-70" y="200" width="50" height="80" rx="25" ry="25" transform="rotate(10 -70 200)" fill="white" stroke="black" stroke-width="4"/>
    <rect x="20" y="200" width="50" height="80" rx="25" ry="25" transform="rotate(-10 20 200)" fill="white" stroke="black" stroke-width="4"/>
  </g>
</svg>