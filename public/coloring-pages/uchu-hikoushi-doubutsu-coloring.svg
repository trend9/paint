    <circle cx="450" cy="250" r="3.5" fill="black" />
    <circle cx="470" cy="305" r="3.5" fill="black" />
    <circle cx="450" cy="360" r="3.5" fill="black" />
    <circle cx="400" cy="375" r="3.5" fill="black" />
    <circle cx="350" cy="360" r="3.5" fill="black" />
    <circle cx="330" cy="305" r="3.5" fill="black" />
    <circle cx="350" cy="250" r="3.5" fill="black" />

    <!-- Rabbit Body/Spacesuit inside porthole -->
    <!-- Spacesuit Shoulders -->
    <path d="M 360 365 Q 400 345 440 365 L 440 370 Q 400 375 360 370 Z" />
    <path d="M 378 348 Q 400 356 422 348" fill="none" />

    <!-- Left Ear (Bent / Curved) -->
    <path d="M 370 255 C 350 205 370 190 382 205 C 392 218 385 245 385 255" />
    <path d="M 373 245 C 365 220 375 210 379 218 C 382 225 380 240 380 245" stroke-width="4" fill="none" />

    <!-- Right Ear (Tall) -->
    <path d="M 415 255 C 415 200 440 200 440 220 C 440 235 430 245 425 255" />
    <path d="M 423 245 C 423 218 433 218 433 228 C 433 236 428 242 425 245" stroke-width="4" fill="none" />

    <!-- Head & Cheeks -->
    <ellipse cx="400" cy="285" rx="34" ry="28" />

    <!-- Astronaut Helmet Bubble -->
    <circle cx="400" cy="275" r="48" stroke-dasharray="270 40" fill="none" stroke-width="4" />

    <!-- Eyes (Big Happy Eyes with Shine) -->
    <ellipse cx="388" cy="282" rx="5" ry="6" fill="black" />
    <circle cx="386" cy="280" r="2" fill="white" stroke="none" />
    <ellipse cx="412" cy="282" rx="5" ry="6" fill="black" />
    <circle cx="410" cy="280" r="2" fill="white" stroke="none" />

    <!-- Cute Nose & Mouth -->
    <polygon points="397,292 403,292 400,296" fill="black" />
    <path d="M 395 297 Q 400 302 405 297" fill="none" />

    <!-- Whiskers -->
    <line x1="373" y1="288" x2="360" y2="286" stroke-width="3" />
    <line x1="373" y1="293" x2="360" y2="296" stroke-width="3" />
    <line x1="427" y1="288" x2="440" y2="286" stroke-width="3" />
    <line x1="427" y1="293" x2="440" y2="296" stroke-width="3" />

    <!-- Waving Left Paw -->
    <path d="M 350 315 C 335 305 340 285 352 290 C 360 295 360 310 355 320" />
    <path d="M 345 300 C 347 296 352 296 354 300" fill="none" stroke-width="3" />

    <!-- Helmet Glare Reflection -->
    <path d="M 432 250 A 42 42 0 0 1 442 275" fill="none" stroke-width="4" />
  </g>


  <!-- ================= MIDDLE-LEFT PORTHOLE: BEAR ASTRONAUT ================= -->
  <g id="bear-astronaut" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
