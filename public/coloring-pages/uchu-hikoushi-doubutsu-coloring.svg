<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <style>
      .outline {
        stroke: #000000;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .outline-thin {
        stroke: #000000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .no-fill {
        fill: none;
      }
      .detail-line {
        stroke: #000000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="#FFFFFF" />

  <!-- ================= BACKGROUND ELEMENTS ================= -->
  <g id="background-space">
    <!-- Moon / Crater Planet (Top Center) -->
    <g transform="translate(420, 80)">
      <circle cx="0" cy="0" r="55" class="outline" />
      <circle cx="-20" cy="-15" r="14" class="detail-line" />
      <circle cx="15" cy="15" r="18" class="detail-line" />
      <circle cx="-10" cy="25" r="10" class="detail-line" />
      <circle cx="22" cy="-20" r="8" class="detail-line" />
    </g>

    <!-- Ringed Planet (Middle Right) -->
    <g transform="translate(660, 620) rotate(-15)">
      <!-- Back of Ring -->
      <path d="M -110 0 A 110 35 0 0 1 110 0" class="detail-line" />
      <!-- Planet Body -->
      <circle cx="0" cy="0" r="70" class="outline" />
      <!-- Front of Ring -->
      <path d="M 110 0 A 110 35 0 0 1 -110 0" class="outline" />
    </g>

    <!-- Small Striped Planet (Middle Left) -->
    <g transform="translate(90, 480)">
      <circle cx="0" cy="0" r="40" class="outline" />
      <path d="M -38 -10 Q 0 -20 38 -10" class="detail-line" />
      <path d="M -40 10 Q 0 0 40 10" class="detail-line" />
    </g>

    <!-- 5-Point Stars -->
    <!-- Star 1 (Top Left) -->
    <path d="M 90 130 L 97 150 L 118 150 L 101 163 L 107 183 L 90 170 L 73 183 L 79 163 L 62 150 L 83 150 Z" class="outline" />
    <!-- Star 2 (Top Right) -->
    <path d="M 720 100 L 725 115 L 740 115 L 728 125 L 732 140 L 720 130 L 708 140 L 712 125 L 700 115 L 715 115 Z" class="outline" />
    <!-- Star 3 (Center) -->
    <path d="M 400 450 L 407 470 L 428 470 L 411 483 L 417 503 L 400 490 L 383 503 L 389 483 L 372 470 L 393 470 Z" class="outline" />
    <!-- Star 4 (Bottom Left) -->
    <path d="M 100 880 L 105 895 L 120 895 L 108 905 L 112 920 L 100 910 L 88 920 L 92 905 L 80 895 L 95 895 Z" class="outline" />
    <!-- Star 5 (Bottom Right) -->
    <path d="M 700 850 L 707 870 L 728 870 L 711 883 L 717 903 L 700 890 L 683 903 L 689 883 L 672 870 L 693 870 Z" class="outline" />

    <!-- 4-Point Sparkle Stars -->
    <path d="M 280 80 Q 280 100 300 100 Q 280 100 280 120 Q 280 100 260 100 Q 280 100 280 80 Z" class="outline" />
    <path d="M 520 300 Q 520 315 535 315 Q 520 315 520 330 Q 520 315 505 315 Q 520 315 520 300 Z" class="outline" />
    <path d="M 70 310 Q 70 325 85 325 Q 70 325 70 340 Q 70 325 55 325 Q 70 325 70 310 Z" class="outline" />
    <path d="M 500 780 Q 500 800 520 800 Q 500 800 500 820 Q 500 800 480 800 Q 500 800 500 780 Z" class="outline" />

    <!-- Floating Space Dots/Bubbles -->
    <circle cx="230" cy="180" r="8" class="outline" />
    <circle cx="600" cy="140" r="10" class="outline" />
    <circle cx="340" cy="380" r="7" class="outline" />
    <circle cx="450" cy="620" r="9" class="outline" />
    <circle cx="600" cy="500" r="6" class="outline" />
    <circle cx="280" cy="880" r="10" class="outline" />
  </g>

  <!-- ================= CHARACTER 1: RABBIT ASTRONAUT (Top Left) ================= -->
  <g id="rabbit-astronaut" transform="translate(200, 260)">
    <!-- Helmet Back Base -->
    <path d="M -70 -20 C -70 -120, 70 -120, 70 -20 C 70 50, -70 50, -70 -20 Z" class="outline" />

    <!-- Rabbit Ears (inside helmet) -->
    <!-- Left Ear -->
    <path d="M -45 -30 C -50 -110, -15 -110, -15 -30 Z" class="outline" />
    <path d="M -38 -35 C -42 -90, -22 -90, -22 -35" class="detail-line" />
    <!-- Right Ear -->
    <path d="M 15 -30 C 15 -110, 50 -110, 45 -30 Z" class="outline" />
    <path d="M 22 -35 C 22 -90, 42 -90, 38 -35" class="detail-line" />

    <!-- Rabbit Head -->
    <ellipse cx="0" cy="0" rx="45" ry="38" class="outline" />
    
    <!-- Rabbit Face Details -->
    <!-- Eyes -->
    <ellipse cx="-18" cy="-5" rx="6" ry="8" fill="#000000" />
    <circle cx="-20" cy="-8" r="2.5" fill="#FFFFFF" />
    <ellipse cx="18" cy="-5" rx="6" ry="8" fill="#000000" />
    <circle cx="16" cy="-8" r="2.5" fill="#FFFFFF" />
    <!-- Cheeks -->
    <path d="M -32 8 A 8 5 0 0 0 -20 12" class="detail-line" />
    <path d="M 20 12 A 8 5 0 0 0 32 8" class="detail-line" />
    <!-- Nose & Mouth -->
    <polygon points="-4,3 4,3 0,8" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 8 Q -6 16 -12 10" class="detail-line" />
    <path d="M 0 8 Q 6 16 12 10" class="detail-line" />

    <!-- Helmet Glass Visor Outline & Reflection -->
    <path d="M -60 -10 A 62 55 0 0 1 60 -10" class="detail-line" />
    <path d="M -45 -60 A 50 50 0 0 1 -20 -75" class="detail-line" />

    <!-- Suit Collar -->
    <path d="M -40 32 L 40 32 L 35 45 L -35 45 Z" class="outline" />

    <!-- Space Suit Body -->
    <path d="M -35 45 C -45 60, -45 110, -30 130 L 30 130 C 45 110, 45 60, 35 45 Z" class="outline" />
    
    <!-- Chest Control Panel -->
    <rect x="-18" y="60" width="36" height="30" rx="8" class="outline-thin" />
    <circle cx="-8" cy="75" r="5" class="outline-thin" />
    <circle cx="8" cy="75" r="5" class="outline-thin" />

    <!-- Left Arm (Resting) -->
    <path d="M -38 52 C -60 65, -60 90, -48 105" class="outline" />
    <!-- Left Mitten -->
    <circle cx="-52" cy="112" r="14" class="outline" />

    <!-- Right Arm (Waving) -->
    <path d="M 38 52 C 60 40, 70 20, 75 -5" class="outline" />
    <!-- Right Mitten (Waving Paw) -->
    <path d="M 65 -22 C 60 -35, 85 -45, 92 -28 C 98 -32, 102 -20, 95 -12 Z" class="outline" />

    <!-- Legs & Boots -->
    <!-- Left Leg & Boot -->
    <path d="M -25 130 L -28 150 L -45 150 C -52 150, -52 168, -35 168 L -10 168 L -10 130 Z" class="outline" />
    <!-- Right Leg & Boot -->
    <path d="M 25 130 L 28 150 L 45 150 C 52 150, 52 168, 35 168 L 10 168 L 10 130 Z" class="outline" />
  </g>


  <!-- ================= CHARACTER 2: CAT ASTRONAUT (Top Right, Floating) ================= -->
  <g id="cat-astronaut" transform="translate(560, 260) rotate(12)">
    <!-- Air Hose / Tether -->
    <path d="M -60 120 C -100 150, -80 220, -140 200 C -180 190, -180 130, -220 150" class="detail-line" stroke-dasharray="12 8" />

    <!-- Oxygen Tank Backpack -->
    <rect x="-65" y="40" width="25" height="70" rx="10" class="outline" />

    <!-- Helmet Back -->
    <circle cx="0" cy="0" r="75" class="outline" />

    <!-- Cat Ears (Inside Helmet) -->
    <path d="M -50 -25 L -25 -60 L -10 -25 Z" class="outline" />
    <path d="M -40 -28 L -25 -50 L -17 -28" class="detail-line" />
    <path d="M 10 -25 L 25 -60 L 50 -25 Z" class="outline" />
    <path d="M 17 -28 L 25 -50 L 40 -28" class="detail-line" />

    <!-- Cat Head -->
    <ellipse cx="0" cy="5" rx="46" ry="38" class="outline" />

    <!-- Cat Face Details -->
    <!-- Eyes (Happy Arcs) -->
    <path d="M -25 -2 Q -15 -12 -5 -2" class="detail-line" stroke-width="5" />
    <path d="M 5 -2 Q 15 -12 25 -2" class="detail-line" stroke-width="5" />
    <!-- Nose & Whiskers -->
    <polygon points="-4,6 4,6 0,11" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
    <path d="M 0 11 Q -5 18 -10 14" class="detail-line" />
    <path d="M 0 11 Q 5 18 10 14" class="detail-line" />
    <!-- Whiskers Left -->
    <path d="M -28 10 L -48 6" class="detail-line" />
    <path d="M -28 14 L -46 18" class="detail-line" />
    <!-- Whiskers Right -->
    <path d="M 28 10 L 48 6" class="detail-line" />
    <path d="M 28 14 L 46 18" class="detail-line" />

    <!-- Helmet Reflection Arc -->
    <path d="M -55 -35 A 65 65 0 0 1 35 -55" class="detail-line" />

    <!-- Suit Neck Ring -->
    <path d="M -35 42 L 35 42 L 30 54 L -30 54 Z" class="outline" />

    <!-- Suit Body -->
    <path d="M -30 54 C -40 70, -35 110, -25 125 L 25 125 C 35 110, 40 70, 30 54 Z" class="outline" />
    <path d="M -15 70 L 15 70 L 15 95 L -15 95 Z" class="outline-thin" />
    <circle cx="0" cy="82" r="4" class="outline-thin" />

    <!-- Tail in Sleeve -->
    <path d="M 25 115 C 55 120, 70 90, 65 70 C 62 60, 50 65, 52 75 C 55 88, 42 105, 20 102" class="outline" />

    <!-- Left Arm (Floating Up) -->
    <path d="M -30 60 C -55 50, -65 30, -70 10" class="outline" />
    <circle cx="-72" cy="0" r="13" class="outline" />

    <!-- Right Arm (Floating Out) -->
    <path d="M 30 60 C 55 60, 70 45, 80 30" class="outline" />
    <circle cx="86" cy="22" r="13" class="outline" />

    <!-- Left Leg & Boot -->
    <path d="M -20 125 L -25 155 C -40 155, -45 175, -20 175 L -5 175 L -5 125 Z" class="outline" />
    <!-- Right Leg & Boot -->
    <path d="M 5 125 L 10 155 L 25 155 C 45 155, 40 175, 20 175 L 2 175 L 5 125 Z" class="outline" />
  </g>

  <!-- Cute Floating Fish Treat for Cat -->
  <g transform="translate(710, 180) rotate(-20)">
    <path d="M -15 0 C -30 -15, -30 15, -15 0 Z" class="outline" />
    <ellipse cx="5" cy="0" rx="15" ry="10" class="outline" />
    <circle cx="12" cy="-3" r="2" fill="#000000" />
  </g>


  <!-- ================= CHARACTER 3: DOG IN SPACESHIP (Bottom Left) ================= -->
  <g id="dog-spaceship" transform="translate(260, 700)">

    <!-- Rocket Thruster Flame -->
    <path d="M -40 180 C -50 230, -20 250, 0 260 C 20 250, 50 230, 40 180 Z" class="outline" />
    <path d="M -20 180 C -25 210, 0 225, 0 225 C 0 225, 25 210, 20 180 Z" class="outline-thin" />

    <!-- Left Rocket Fin -->
    <path d="M -90 120 C -140 130, -150 180, -130 200 C -100 190, -80 170, -75 150 Z" class="outline" />
    <!-- Right Rocket Fin -->
    <path d="M 90 120 C 140 130, 150 180, 130 200 C 100 190, 80 170, 75 150 Z" class="outline" />

    <!-- Main Rocket Body -->
    <path d="M 0 -180 C 90 -100, 100 60, 80 180 L -80 180 C -100 60, -90 -100, 0 -180 Z" class="outline" />

    <!-- Rocket Nose Cone Line -->
    <path d="M -52 -80 C -20 -95, 20 -95, 52 -80" class="detail-line" />
    <!-- Rocket Body Decorative Stripe -->
    <path d="M -78 140 C -30 155, 30 155, 78 140" class="detail-line" />

    <!-- Large Porthole Window Outer Ring -->
    <circle cx="0" cy="15" r="70" class="outline" />
    <!-- Porthole Inner Frame -->
    <circle cx="0" cy="15" r="58" class="outline-thin" />

    <!-- DOG INSIDE PORTOLE -->
    <g id="space-dog">
      <!-- Dog Head -->
      <ellipse cx="0" cy="10" rx="38" ry="32" class="outline" />

      <!-- Left Floppy Ear -->
      <path d="M -30 -5 C -55 -10, -60 25, -40 35 C -30 40, -25 20, -28 10 Z" class="outline" />
      <!-- Right Floppy Ear -->
      <path d="M 30 -5 C 55 -10, 60 25, 40 35 C 30 40, 25 20, 28 10 Z" class="outline" />

      <!-- Dog Snout -->
      <ellipse cx="0" cy="18" rx="16" ry="12" class="outline-thin" />
      <!-- Dog Nose -->
      <ellipse cx="0" cy="12" rx="7" ry="5" fill="#000000" />
      <!-- Mouth & Tongue -->
      <path d="M 0 17 L 0 23 C -5 23, -8 20, -10 18" class="detail-line" />
      <path d="M 0 23 C 5 23, 8 20, 10 18" class="detail-line" />
      <path d="M -4 23 C -4 28, 4 28, 4 23 Z" fill="#FFFFFF" class="outline-thin" />

      <!-- Dog Eyes (Big Happy Circles) -->
      <circle cx="-15" cy="2" r="7" class="outline" />
      <circle cx="-13" cy="0" r="2.5" fill="#000000" />
      <circle cx="15" cy="2" r="7" class="outline" />
      <circle cx="13" cy="0" r="2.5" fill="#000000" />

      <!-- Paws Resting on Window Rim -->
      <!-- Left Paw -->
      <path d="M -35 50 C -35 38, -15 38, -15 52 Z" class="outline" />
      <path d="M -28 44 L -28 50" class="detail-line" />
      <path d="M -22 44 L -22 50" class="detail-line" />
      <!-- Right Paw -->
      <path d="M 15 52 C 15 38, 35 38, 35 50 Z" class="outline" />
      <path d="M 22 44 L 22 50" class="detail-line" />
      <path d="M 28 44 L 28 50" class="detail-line" />
    </g>

    <!-- Glass Shine Line on Porthole -->
    <path d="M -38 -25 A 50 50 0 0 1 25 -38" class="detail-line" />
  </g>

  <!-- Cute Space Bone Floating Near Dog -->
  <g transform="translate(420, 710) rotate(25)">
    <path d="M -20 -5 C -28 -15, -35 -5, -25 0 C -35 5, -28 15, -20 5 L 20 5 C 28 15, 35 5, 25 0 C 35 -5, 28 -15, 20 -5 Z" class="outline" />
  </g>

</svg>