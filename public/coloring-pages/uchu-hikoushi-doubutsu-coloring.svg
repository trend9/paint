    <path d="M 320 431 A 5 5 0 0 1 320 439" fill="none" stroke-width="3" />
    <circle cx="370" cy="435" r="12" />
    <path d="M 370 431 A 5 5 0 0 1 370 439" fill="none" stroke-width="3" />

    <!-- Bear Head -->
    <circle cx="345" cy="460" r="30" />

    <!-- Bear Muzzle -->
    <ellipse cx="345" cy="470" rx="14" ry="10" />
    <ellipse cx="345" cy="466" rx="6" ry="4" fill="black" />
    <path d="M 345 470 L 345 474" />
    <path d="M 340 474 Q 345 478 350 474" fill="none" />

    <!-- Bear Eyes -->
    <ellipse cx="334" cy="455" rx="4" ry="5" fill="black" />
    <circle cx="332" cy="453" r="1.5" fill="white" stroke="none" />
    <ellipse cx="356" cy="455" rx="4" ry="5" fill="black" />
    <circle cx="354" cy="453" r="1.5" fill="white" stroke="none" />

    <!-- Spacesuit Collar / Shoulders -->
    <path d="M 315 510 Q 345 495 375 510" />
    <path d="M 330 493 Q 345 500 360 493" fill="none" />

    <!-- Bear Waving Left Paw -->
    <path d="M 300 475 C 288 465 292 445 304 450 C 312 455 312 470 306 480 Z" />
