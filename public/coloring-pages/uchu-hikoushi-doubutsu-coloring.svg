  <!-- ==================== FRONT CENTER FIN ==================== -->
  <g id="center-fin" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <path d="M 388 610 L 400 560 L 412 610 L 408 705 L 392 705 Z" />
  </g>

</svg>