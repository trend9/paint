<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1000" fill="white"/>

  <!-- ==================== SPACE BACKGROUND ==================== -->
  <g id="space-background" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Top-Left Ringed Planet -->
    <g id="planet-ringed">
      <ellipse cx="140" cy="150" rx="90" ry="25" transform="rotate(-20 140 150)" />
      <circle cx="140" cy="150" r="55" />
      <!-- Re-draw front part of ring for overlap -->
      <path d="M 55 160 A 90 25 0 0 0 215 125" fill="none" />
      <circle cx="120" cy="135" r="10" />
      <circle cx="155" cy="165" r="7" />
    </g>

    <!-- Top-Right Moon with Craters -->
    <g id="moon">
      <circle cx="670" cy="160" r="60" />
      <circle cx="650" cy="140" r="14" />
      <circle cx="685" cy="175" r="10" />
      <circle cx="645" cy="180" r="8" />
      <circle cx="690" cy="135" r="6" />
    </g>

    <!-- Middle-Right Striped Planet -->
    <g id="planet-striped">
      <circle cx="690" cy="460" r="50" />
      <path d="M 645 440 Q 690 465 735 440" fill="none" />
      <path d="M 642 470 Q 690 495 738 470" fill="none" />
    </g>

    <!-- Middle-Left Small Planet -->
    <g id="planet-crater">
      <circle cx="110" cy="480" r="40" />
      <circle cx="100" cy="470" r="8" />
      <circle cx="125" cy="490" r="6" />
