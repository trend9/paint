<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="coloring_book_scene">

    <!-- Sea Floor Base -->
    <path d="M 0 850 Q 100 890 200 870 Q 300 840 400 860 Q 500 880 600 850 Q 700 820 800 840 L 800 1000 L 0 1000 Z"
          fill="white" stroke="black" stroke-width="5"/>

    <!-- Coral Reef Group -->
    <g id="coral_reef">
      <!-- Brain Coral 1 (large, center) -->
      <path d="M 400 850 A 150 100 0 1 1 400 850 Z"
            fill="white" stroke="black" stroke-width="5"/>
      <path d="M 300 820 Q 350 790 400 820 Q 450 850 500 820 Q 450 790 400 820"
            fill="none" stroke="black" stroke-width="3"/>
      <path d="M 330 840 Q 380 810 430 840 Q 380 870 330 840"
            fill="none" stroke="black" stroke-width="3"/>

      <!-- Branching Coral 1 (left) -->
      <path d="M 150 850 C 150 750 180 700 200 680 C 220 700 250 750 250 850 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 180 780 C 180 730 200 700 220 710 C 240 700 260 730 260 780"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 170 820 C 170 790 190 770 210 780 C 230 770 250 790 250 820"
            fill="white" stroke="black" stroke-width="4"/>

      <!-- Plate Coral 1 (right) -->
      <path d="M 550 820 C 580 790 620 790 650 820 C 650 840 600 870 550 820 Z"
            fill="white" stroke="black" stroke-width="5"/>
      <path d="M 570 810 C 590 795 610 795 630 810 C 630 820 600 835 570 810 Z"
            fill="white" stroke="black" stroke-width="3"/>

      <!-- Branching Coral 2 (back-right) -->
      <path d="M 680 850 C 680 780 700 750 720 730 C 740 750 760 780 760 850 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 700 800 C 700 760 720 740 730 750 C 740 740 760 760 760 800"
            fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Sea Turtle -->
    <g id="sea_turtle">
      <!-- Shell -->
      <path d="M 280 400 C 220 350 220 500 280 550 C 380 600 520 600 620 550 C 680 500 680 350 620 300 C 520 250 380 250 280 300 Z"
            fill="white" stroke="black" stroke-width="5"/>
      <!-- Shell patterns -->
      <path d="M 330 330 Q 300 370 330 410 Q 380 440 430 410 Q 460 370 430 330 Z"
            fill="white" stroke="black" stroke-width="3"/>
      <path d="M 470 330 Q 500 370 470 410 Q 420 440 370 410 Q 340 370 370 330 Z"
            fill="white" stroke="black" stroke-width="3"/>
      <path d="M 350 450 Q 300 480 350 510 Q 400 530 450 510 Q 500 480 450 450 Z"
            fill="white" stroke="black" stroke-width="3"/>

      <!-- Head -->
      <path d="M 280 370 C 200 350 180 420 230 460 C 260 480 290 480 310 460 C 330 440 330 390 280 370 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <!-- Eye -->
      <circle cx="230" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="230" cy="400" r="5" fill="black" stroke="none"/>
      <!-- Smile -->
      <path d="M 230 430 Q 250 445 270 430"
            fill="none" stroke="black" stroke-width="3"/>

      <!-- Flippers -->
      <path d="M 290 290 C 200 250 180 320 200 360 C 220 390 280 380 290 290 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Top-left -->
      <path d="M 600 290 C 680 250 700 320 680 360 C 660 390 600 380 600 290 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Top-right -->
      <path d="M 290 560 C 200 600 180 530 200 490 C 220 460 280 470 290 560 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Bottom-left -->
      <path d="M 600 560 C 680 600 700 530 680 490 C 660 460 600 470 600 560 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Bottom-right -->
    </g>

    <!-- Fish Group -->
    <g id="fish">
      <!-- Fish 1 (large, left) -->
      <path d="M 150 200 C 100 150 100 250 150 300 C 250 350 350 250 300 200 C 350 150 250 50 150 100 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 300 200 Q 320 180 300 160 C 350 160 350 220 300 200 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Tail -->
      <path d="M 200 150 Q 220 120 240 150 Q 220 170 200 150 Z"
            fill="white" stroke="black" stroke-width="3"/> <!-- Dorsal fin -->
      <circle cx="170" cy="180" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="170" cy="180" r="3" fill="black" stroke="none"/>
      <path d="M 190 200 Q 210 210 230 200"
            fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->

      <!-- Fish 2 (medium, right) -->
      <path d="M 650 180 C 600 130 600 230 650 280 C 750 330 800 230 750 180 C 800 130 700 30 650 80 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 750 180 Q 770 160 750 140 C 800 140 800 200 750 180 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Tail -->
      <path d="M 700 130 Q 720 100 740 130 Q 720 150 700 130 Z"
            fill="white" stroke="black" stroke-width="3"/> <!-- Dorsal fin -->
      <circle cx="670" cy="160" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="670" cy="160" r="2" fill="black" stroke="none"/>
      <path d="M 690 180 Q 710 190 730 180"
            fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->

      <!-- Fish 3 (small, top-center) -->
      <path d="M 400 100 C 370 70 370 130 400 160 C 450 200 480 130 450 100 C 480 70 430 20 400 50 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 450 100 Q 460 90 450 80 C 470 80 470 110 450 100 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Tail -->
      <circle cx="415" cy="90" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="415" cy="90" r="2" fill="black" stroke="none"/>
      <path d="M 425 105 Q 435 110 445 105"
            fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->

      <!-- Fish 4 (medium, bottom-left) -->
      <path d="M 200 600 C 150 550 150 650 200 700 C 300 750 350 650 300 600 C 350 550 250 500 200 550 Z"
            fill="white" stroke="black" stroke-width="4"/>
      <path d="M 300 600 Q 320 580 300 560 C 350 560 350 620 300 600 Z"
            fill="white" stroke="black" stroke-width="4"/> <!-- Tail -->
      <circle cx="220" cy="580" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Eye -->
      <circle cx="220" cy="580" r="2" fill="black" stroke="none"/>
      <path d="M 240 600 Q 260 610 280 600"
            fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->

    </g>

  </g>
</svg>