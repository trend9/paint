<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="5" fill="white" stroke-linecap="round" stroke-linejoin="round">
  <!-- Fluffy Cloud -->
  <g id="cloud">
    <path d="M150 750 C150 750 100 700 150 650 C200 600 250 630 300 600 C350 570 400 600 450 570 C500 540 550 570 600 600 C650 630 700 600 750 650 C800 700 750 750 750 750 L150 750 Z"/>
  </g>

  <!-- Cute Happy Unicorn -->
  <g id="unicorn">
    <!-- Body and Head in one simplified path for "sitting" posture -->
    <path d="M300 680 C230 600 250 450 350 350 C450 280 550 280 650 350 C700 400 700 550 630 680 C600 700 500 720 400 720 C350 710 300 680 300 680 Z"/>
    <!-- Muzzle (slightly overlapping main body path) -->
    <path d="M600 400 C630 400 640 430 620 450 C600 470 570 450 570 430 C570 410 590 390 600 400 Z"/>
    <!-- Gentle Smile -->
    <path d="M585 440 Q600 450 615 440" fill="none"/>
    <!-- Eyes -->
    <circle cx="580" cy="380" r="10"/>
    <circle cx="530" cy="385" r="10"/>
    <!-- Ears -->
    <path d="M510 350 Q520 300 530 350 Z"/>
    <path d="M550 350 Q560 300 570 350 Z"/>
    <!-- Horn -->
    <path d="M540 330 L550 260 L560 330 Z"/>
    <path d="M545 310 L555 270" fill="none"/>
    <path d="M547 320 L557 280" fill="none"/>

    <!-- Mane - simple arcs for fluffiness -->
    <path d="M430 340 Q400 300 450 300 Q500 300 470 340"/>
    <path d="M400 400 Q370 360 420 360 Q470 360 440 400"/>

    <!-- Front Leg -->
    <path d="M430 650 Q410 690 440 700 Q470 690 450 650 Z"/>
    <!-- Back legs - suggested, mostly hidden -->
    <path d="M300 680 Q280 700 310 710 Q340 700 320 680 Z"/>
    <path d="M580 680 Q560 700 590 710 Q620 700 600 680 Z"/>

    <!-- Tail - fluffy blob -->
    <path d="M270 580 Q230 500 280 450 Q330 500 290 580 Z"/>
  </g>

  <!-- Small Cupcake held by one hoof -->
  <g id="cupcake">
    <!-- Unicorn's "holding" leg -->
    <path d="M550 650 C570 670 570 690 550 700 C530 710 510 700 510 680 C510 660 530 640 550 650 Z"/>
    <!-- Cupcake base/wrapper -->
    <path d="M550 640 C530 660 530 680 550 700 C570 720 590 700 610 700 C630 700 630 680 610 660 C590 640 570 640 550 640 Z"/>
    <path d="M545 670 L615 670" fill="none"/> <!-- Wrapper line -->
    <!-- Frosting -->
    <path d="M550 640 Q530 600 580 580 Q630 600 610 640 Z"/>
    <!-- Cherry/topper -->
    <circle cx="580" cy="580" r="8"/>
  </g>

  <!-- Floating Star-shaped Cookies and Candies -->
  <g id="floating-treats">
    <!-- Star Cookies -->
    <path d="M100 200 L120 250 L180 250 L130 280 L150 330 L100 300 L50 330 L70 280 L20 250 L80 250 Z"/>
    <path d="M650 150 L670 200 L730 200 L680 230 L700 280 L650 250 L600 280 L620 230 L570 200 L630 200 Z"/>
    <path d="M200 850 L220 900 L280 900 L230 930 L250 980 L200 950 L150 980 L170 930 L120 900 L180 900 Z"/>
    <!-- Candies (circles and ellipses) -->
    <circle cx="150" cy="400" r="30"/>
    <ellipse cx="700" cy="400" rx="40" ry="20"/>
    <circle cx="100" cy="600" r="25"/>
    <ellipse cx="700" cy="800" rx="30" ry="40"/>
    <circle cx="50" cy="100" r="20"/>
    <ellipse cx="750" cy="900" rx="25" ry="35"/>
    <circle cx="250" cy="100" r="15"/>
    <ellipse cx="500" cy="100" rx="20" ry="10"/>
  </g>
</svg>