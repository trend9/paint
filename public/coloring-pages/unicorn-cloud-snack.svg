<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .no-fill {
        fill: none;
      }
    </style>
  </defs>

  <!-- Fluffy Cloud -->
  <g id="cloud">
    <path class="outline" d="M100,800 Q150,750 200,750 Q250,700 300,750 Q350,700 400,750 Q450,700 500,750 Q550,700 600,750 Q650,750 700,800 L700,900 Q650,950 600,950 Q550,1000 500,950 Q450,1000 400,950 Q350,1000 300,950 Q250,1000 200,950 Q150,950 100,900 Z" />
  </g>

  <!-- Cute Happy Unicorn -->
  <g id="unicorn">
    <!-- Body -->
    <ellipse class="outline" cx="400" cy="650" rx="150" ry="100" />
    
    <!-- Legs -->
    <rect class="outline" x="290" y="700" width="40" height="90" rx="20" ry="20" />
    <rect class="outline" x="470" y="700" width="40" height="90" rx="20" ry="20" />
    <rect class="outline" x="330" y="600" width="40" height="80" rx="20" ry="20" transform="rotate(-15 350 640)" />
    <rect class="outline" x="430" y="600" width="40" height="80" rx="20" ry="20" transform="rotate(15 450 640)" />

    <!-- Head -->
    <ellipse class="outline" cx="480" cy="450" rx="100" ry="80" />
    
    <!-- Muzzle -->
    <ellipse class="outline" cx="530" cy="480" rx="50" ry="30" />

    <!-- Eyes -->
    <circle class="outline" cx="450" cy="420" r="15" />
    <circle class="outline" cx="500" cy="420" r="15" />

    <!-- Smile -->
    <path class="outline no-fill" stroke-width="3" d="M490,490 Q515,510 540,490" />
    
    <!-- Ears -->
    <path class="outline" d="M440,380 L460,320 L480,380 Z" />
    <path class="outline" d="M500,380 L520,320 L540,380 Z" />
    
    <!-- Horn -->
    <path class="outline" d="M490,300 L500,220 L510,300 Z" />
    <line class="outline no-fill" stroke-width="3" x1="495" y1="280" x2="505" y2="280" />
    <line class="outline no-fill" stroke-width="3" x1="495" y1="260" x2="505" y2="260" />
    <line class="outline no-fill" stroke-width="3" x1="495" y1="240" x2="505" y2="240" />
    
    <!-- Mane -->
    <path class="outline" d="M400,370 C410,300 460,300 470,370 C480,320 520,320 530,370" />
    
    <!-- Tail -->
    <path class="outline" d="M260,630 C200,650 200,750 260,770 C280,700 280,680 260,630 Z" />
  </g>

  <!-- Snacks -->
  <g id="snacks">
    <!-- Cupcake (in unicorn's hand/mouth area) -->
    <g id="cupcake">
        <rect class="outline" x="520" y="490" width="50" height="40" rx="10" ry="10" />
        <path class="outline" d="M510,490 C515,470 530,460 545,460 C560,460 575,470 580,490 Z" />
        <circle class="outline" cx="545" cy="450" r="10" />
        <path class="outline no-fill" stroke-width="3" d="M525,500 L565,500" />
        <path class="outline no-fill" stroke-width="3" d="M525,510 L565,510" />
    </g>

    <!-- Star-shaped cookie (on cloud) -->
    <g id="star-cookie">
      <path class="outline" transform="translate(250, 850) scale(0.6)" d="M 0,-100 L 26,-40 L 95,-35 L 40,15 L 60,80 L 0,40 L -60,80 L -40,15 L -95,-35 L -26,-40 Z" />
    </g>

    <!-- Donut (on cloud) -->
    <g id="donut">
      <circle class="outline" cx="600" cy="850" r="40" />
      <circle class="outline" cx="600" cy="850" r="15" />
    </g>
  </g>
</svg>