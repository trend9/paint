<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg"
     stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
     fill="white">

  <!-- Fluffy Cloud -->
  <g id="cloud">
    <path d="M100 880 Q100 800 150 750 C180 720 250 700 350 700 C450 700 520 720 550 750 Q600 800 550 880 C520 910 450 930 350 930 C250 930 180 910 150 880 Z"/>
  </g>

  <!-- Cute Happy Unicorn -->
  <g id="unicorn">
    <!-- Body -->
    <ellipse cx="400" cy="570" rx="180" ry="120"/>
    <!-- Head -->
    <ellipse cx="480" cy="350" rx="100" ry="90"/>

    <!-- Front Legs -->
    <rect x="350" y="620" width="70" height="90" rx="30" ry="30"/>
    <rect x="440" y="620" width="70" height="90" rx="30" ry="30"/>
    <!-- Back Leg -->
    <rect x="280" y="630" width="70" height="90" rx="30" ry="30"/>

    <!-- Ears -->
    <path d="M450 280 L470 210 L490 280 Z"/>
    <path d="M500 280 L520 210 L540 280 Z"/>

    <!-- Horn -->
    <path d="M495 200 L485 160 L475 200 L485 230 Z" stroke-width="4"/>

    <!-- Mane -->
    <path d="M410 300 C400 220 450 200 500 280" fill="none" stroke-width="5"/>
    <path d="M420 320 C410 240 460 220 510 300" fill="none" stroke-width="5"/>

    <!-- Tail -->
    <path d="M220 580 C180 500 150 600 200 680 C250 760 300 650 250 580" fill="none" stroke-width="5"/>

    <!-- Face Details -->
    <!-- Eyes -->
    <circle cx="450" cy="340" r="15" stroke-width="3"/>
    <circle cx="510" cy="340" r="15" stroke-width="3"/>
    <!-- Smile -->
    <path d="M460 380 Q480 395 500 380" fill="none" stroke-width="3"/>
  </g>

  <!-- Simple Snacks -->
  <g id="snacks" stroke-width="4">
    <!-- Cookie -->
    <circle cx="580" cy="650" r="40"/>
    <circle cx="560" cy="640" r="5" fill="none"/>
    <circle cx="590" cy="630" r="5" fill="none"/>
    <circle cx="600" cy="660" r="5" fill="none"/>
    <circle cx="570" cy="670" r="5" fill="none"/>

    <!-- Cupcake -->
    <path d="M330 730 L320 750 Q370 760 420 750 L410 730 Z"/> <!-- Cupcake liner -->
    <path d="M330 730 C320 700 320 670 350 650 C380 630 420 670 410 700 C400 710 340 710 330 730 Z"/> <!-- Frosting base -->
    <path d="M350 650 Q340 630 350 610 Q360 630 350 650 Z"/> <!-- Top frosting swirl -->
  </g>

  <!-- Floating Stars and Hearts -->
  <g id="decorations" stroke-width="4">
    <!-- Stars -->
    <path d="M150 200 L170 250 L230 250 L180 280 L200 330 L150 300 L100 330 L120 280 L70 250 L130 250 Z"/>
    <path d="M600 150 L620 200 L680 200 L630 230 L650 280 L600 250 L550 280 L570 230 L520 200 L580 200 Z"/>
    <path d="M700 400 L720 450 L780 450 L730 480 L750 530 L700 500 L650 530 L670 480 L620 450 L680 450 Z"/>

    <!-- Hearts -->
    <path d="M100 400 C120 350 180 350 200 400 C220 450 150 500 100 400 Z"/>
    <path d="M200 500 C220 450 280 450 300 500 C320 550 250 600 200 500 Z"/>
    <path d="M50 600 C70 550 130 550 150 600 C170 650 100 700 50 600 Z"/>
  </g>
</svg>