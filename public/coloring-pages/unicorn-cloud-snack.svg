<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the main fluffy cloud -->
  <g id="cloud">
    <path d="M100,680
             Q50,580 150,530
             C150,530 200,500 250,530
             C250,530 300,500 350,520
             C350,520 400,490 450,520
             C450,520 500,500 550,530
             C550,530 600,500 650,530
             Q700,580 700,680
             Q750,730 650,780
             Q600,830 500,810
             Q400,830 300,810
             Q200,830 150,780
             Q50,730 100,680 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Group for the cute happy unicorn -->
  <g id="unicorn">
    <!-- Body -->
    <ellipse cx="400" cy="570" rx="150" ry="100" fill="white" stroke="black" stroke-width="4"/>

    <!-- Head -->
    <path d="M300,420 Q250,340 350,320 Q450,320 400,420 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Muzzle -->
    <path d="M340,400 Q360,415 380,400 Q360,385 340,400 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Smile (friendly expression) -->
    <path d="M345,405 Q360,415 375,405" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="330" cy="360" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="390" cy="360" r="15" fill="white" stroke="black" stroke-width="4"/>

    <!-- Ears -->
    <path d="M300,320 Q280,290 310,280 Q340,290 320,320 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M390,320 Q370,290 400,280 Q430,290 410,320 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mane (simple tufts) -->
    <path d="M360,320 Q340,270 380,260 Q420,270 400,320 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M390,320 Q370,270 410,260 Q450,270 430,320 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Swirly Horn -->
    <g id="horn">
      <path d="M370,310 Q385,240 400,310 Q415,240 420,310 L370,310 Z"
            fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Swirl lines -->
      <path d="M380,290 Q395,285 410,290" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <path d="M385,270 Q395,265 405,270" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <path d="M390,250 Q395,245 400,250" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Legs (simplified, front legs slightly overlapping cloud) -->
    <rect x="300" y="620" width="40" height="70" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <rect x="450" y="620" width="40" height="70" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Back legs, slightly hidden -->
    <rect x="250" y="630" width="40" height="60" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <rect x="500" y="630" width="40" height="60" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>

    <!-- Tail -->
    <path d="M520,570 Q580,540 600,590 Q620,640 550,640 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Group for colorful snacks -->
  <g id="snacks">
    <!-- Star snack being eaten by unicorn (overlapping front leg) -->
    <polygon points="330,600 340,620 360,620 345,635 350,655 330,640 310,655 315,635 300,620 320,620"
             fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating snacks -->
    <!-- Heart 1 -->
    <path d="M200,490 C210,470 230,470 240,490 C250,510 220,530 200,510 C180,530 150,510 160,490 C170,470 190,470 200,490 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Star 1 -->
    <polygon points="120,440 130,460 150,460 135,475 140,495 120,480 100,495 105,475 85,460 100,460"
             fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Heart 2 -->
    <path d="M580,460 C590,440 610,440 620,460 C630,480 600,500 580,480 C560,500 530,480 540,460 C550,440 570,440 580,460 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Star 2 -->
    <polygon points="650,510 660,530 680,530 665,545 670,565 650,550 630,565 635,545 615,530 630,530"
             fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Heart 3 (smaller) -->
    <path d="M480,390 C485,380 495,380 500,390 C505,400 490,410 480,400 C470,410 455,400 460,390 C465,380 475,380 480,390 Z"
          fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Star 3 (smaller) -->
    <polygon points="520,340 528,355 545,355 532,370 537,385 520,370 503,385 508,370 495,355 512,355"
             fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>