<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline-main {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-detail {
        stroke: black;
        stroke-width: 3;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-detail-nofill {
        stroke: black;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Large fluffy cloud -->
  <g id="cloud">
    <path class="outline-main" d="M100 800 Q50 750 100 700 Q120 660 180 650 Q230 620 280 630 Q300 590 350 600 Q400 570 450 590 Q500 560 550 580 Q600 550 650 590 Q700 630 700 680 Q730 720 700 770 Q670 820 600 840 Q550 860 480 850 Q420 870 350 840 Q280 860 200 840 Q150 820 100 800 Z"/>
  </g>

  <!-- Cute happy unicorn -->
  <g id="unicorn">
    <!-- Body -->
    <ellipse class="outline-main" cx="450" cy="550" rx="150" ry="100"/>
    <!-- Neck -->
    <path class="outline-main" d="M380 470 C350 400 380 360 420 350 L480 350 C520 360 550 400 520 470 Z"/>
    <!-- Head -->
    <ellipse class="outline-main" cx="450" cy="300" rx="120" ry="90"/>
    <!-- Snout (mouth area) -->
    <ellipse class="outline-main" cx="490" cy="330" rx="60" ry="40"/>
    <!-- Horn -->
    <path class="outline-main" d="M440 220 Q470 140 500 220 Z"/>
    <path class="outline-detail-nofill" d="M450 200 Q470 160 490 200 M460 210 Q470 180 480 210"/> <!-- Horn details -->
    <!-- Mane -->
    <path class="outline-main" d="M370 250 C300 200 280 280 320 350 C350 400 400 380 370 300 Z"/>
    <!-- Tail -->
    <path class="outline-main" d="M300 550 C250 600 200 550 220 620 C240 680 280 650 300 600 Z"/>
    <!-- Front Legs -->
    <rect class="outline-main" x="380" y="600" width="60" height="100" rx="30" ry="30"/>
    <rect class="outline-main" x="500" y="600" width="60" height="100" rx="30" ry="30"/>
    <!-- Hooves (simple lines at the bottom of legs) -->
    <path class="outline-detail-nofill" d="M380 700 H440 M500 700 H560"/>

    <!-- Face details -->
    <g id="unicorn-face">
      <!-- Eyes -->
      <circle class="outline-detail" cx="410" cy="280" r="20"/>
      <circle class="outline-detail" cx="500" cy="280" r="20"/>
      <!-- Smile -->
      <path class="outline-detail-nofill" d="M460 350 Q490 380 520 350"/>
      <!-- Cheek blush marks -->
      <ellipse class="outline-detail-nofill" cx="400" cy="340" rx="20" ry="10"/>
      <ellipse class="outline-detail-nofill" cx="540" cy="340" rx="20" ry="10"/>
    </g>
  </g>

  <!-- Simple cookie -->
  <g id="cookie">
    <circle class="outline-main" cx="420" cy="400" r="70"/>
    <!-- Chocolate chips -->
    <circle class="outline-detail-nofill" cx="390" cy="370" r="15"/>
    <circle class="outline-detail-nofill" cx="450" cy="380" r="15"/>
    <circle class="outline-detail-nofill" cx="420" cy="430" r="15"/>
  </g>

  <!-- Small cake -->
  <g id="cake">
    <!-- Cake body -->
    <rect class="outline-main" x="500" y="380" width="100" height="80" rx="10" ry="10"/>
    <!-- Frosting top -->
    <path class="outline-main" d="M500 380 Q550 360 600 380"/>
    <!-- Frosting drips -->
    <path class="outline-detail-nofill" d="M510 380 V400 M530 380 V400 M550 380 V400 M570 380 V400 M590 380 V400"/>
    <!-- Cherry on top -->
    <circle class="outline-detail-nofill" cx="550" cy="360" r="15"/>
  </g>
</svg>