<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Style Definitions for Sharp, Bold Coloring Book Lines -->
  <style>
    .border-line {
      stroke: #000000;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .thick-line {
      stroke: #000000;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: #FFFFFF;
    }
    .medium-line {
      stroke: #000000;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: #FFFFFF;
    }
    .thin-line {
      stroke: #000000;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .solid-black {
      fill: #000000;
      stroke: #000000;
      stroke-width: 2;
    }
    .bg-white {
      fill: #FFFFFF;
    }
  </style>

  <!-- Page Background -->
  <rect width="800" height="1000" class="bg-white" />

  <!-- BACKGROUND ELEMENTS (Sky, Moon, Stars, Clouds) -->
  <g id="sky-background">
    <!-- Cute Crescent Moon with Sleeping Face -->
    <path d="M 630,110 C 690,110 730,160 730,220 C 730,280 680,320 620,320 C 665,300 690,260 690,215 C 690,170 665,130 620,110 Z" class="thick-line" />
    <path d="M 670,205 Q 677,211 684,205" class="thin-line" />
    <path d="M 665,225 Q 670,229 675,225" class="thin-line" />

    <!-- 5-Point Stars -->
    <!-- Star Top Left -->
    <polygon points="150,130 154,142 167,142 157,150 161,162 150,154 139,162 143,150 133,142 146,142" class="thick-line" />
    <!-- Star Mid Left -->
    <polygon points="90,440 95,455 110,455 98,465 102,480 90,470 78,480 82,465 70,455 85,455" class="thick-line" />
    <!-- Star Top Mid -->
    <polygon points="400,70 404,82 417,82 407,90 411,102 400,94 389,102 393,90 383,82 396,82" class="thick-line" />
    <!-- Star Low Right -->
    <polygon points="710,460 714,472 727,472 717,480 721,492 710,484 699,492 703,480 693,472 706,472" class="thick-line" />

    <!-- Cute Sparkles (4-Point Stars) -->
    <path d="M 280,100 Q 280,115 295,115 Q 280,115 280,130 Q 280,115 265,115 Q 280,115 280,100 Z" class="thick-line" />
    <path d="M 680,560 Q 680,575 695,575 Q 680,575 680,590 Q 680,575 665,575 Q 680,575 680,560 Z" class="thick-line" />
    <path d="M 120,680 Q 120,695 135,695 Q 120,695 120,710 Q 120,695 105,695 Q 120,695 120,680 Z" class="thick-line" />

    <!-- Happy Floating Cloud Left -->
    <g id="cloud-left">
      <path d="M 120,280 C 120,250 150,230 180,240 C 200,220 240,220 260,240 C 290,230 320,250 320,280 C 340,310 320,350 290,350 C 270,370 210,370 180,350 C 140,350 120,310 120,280 Z" class="thick-line" />
      <!-- Cloud Face -->
      <path d="M 195,295 Q 201,301 207,295" class="thin-line" />
      <path d="M 223,295 Q 229,301 235,295" class="thin-line" />
      <path d="M 211,310 Q 215,314 219,310" class="thin-line" />
    </g>

    <!-- Happy Floating Cloud Right -->
    <g id="cloud-right">
      <path d="M 500,360 C 500,330 530,310 560,320 C 580,300 620,300 640,320 C 670,310 700,330 700,360 C 720,390 700,430 670,430 C 650,450 590,450 560,430 C 520,430 500,390 500,360 Z" class="thick-line" />
      <!-- Cloud Face -->
      <path d="M 575,375 Q 581,381 587,375" class="thin-line" />
      <path d="M 603,375 Q 609,381 615,375" class="thin-line" />
      <path d="M 591,390 Q 595,394 599,390" class="thin-line" />
    </g>
  </g>

  <!-- THE STEAM TRAIN (Main Character) -->
  <!-- Positioned and rotated to look like it is happily soaring up into the sky -->
  <g id="steam-train" transform="translate(390, 510) scale(1.25) rotate(-12)">
    
    <!-- Steam Puffs from Chimney (Rendered behind the train) -->
    <g id="steam-puffs">
      <circle cx="-60" cy="-240" r="38" class="thick-line" />
      <circle cx="-10" cy="-200" r="28" class="thick-line" />
      <circle cx="25" cy="-165" r="18" class="thick-line" />
    </g>

    <!-- Train Cabin / Cab -->
    <rect x="-170" y="-150" width="110" height="200" rx="15" class="thick-line" />
    <!-- Cabin Roof -->
    <path d="M -190,-150 L -190,-165 C -190,-185 -40,-185 -40,-165 L -40,-150 Z" class="thick-line" />
    <!-- Cabin Window -->
    <rect x="-140" y="-105" width="50" height="65" rx="10" class="thick-line" />

    <!-- Train Boiler (Body) -->
    <rect x="-65" y="-70" width="175" height="120" rx="12" class="thick-line" />
    
    <!-- Dome on Boiler -->
    <path d="M -20,-70 C -20,-105 15,-105 15,-70 Z" class="thick-line" />

    <!-- Smokestack / Chimney -->
    <path d="M 35,-70 L 25,-130 L 65,-130 L 55,-70 Z" class="thick-line" />
    <!-- Smokestack Rim -->
    <rect x="18" y="-142" width="49" height="14" rx="7" class="thick-line" />

    <!-- Whimsical Wing (Flying element) -->
    <path d="M -35,-15 C -60,-65 -130,-75 -155,-35 C -140,-5 -80,5 -35,-15 Z" class="thick-line" />
    <path d="M -75,-35 Q -105,-45 -125,-30" class="medium-line" />
    <path d="M -65,-20 Q -95,-25 -115,-15" class="medium-line" />

    <!-- Front Face Plate (3/4 view cute face) -->
    <ellipse cx="110" cy="-10" rx="35" ry="60" class="thick-line" />
    
    <!-- Face Details -->
    <!-- Happy Eyes with White Highlights -->
    <g id="eyes">
      <circle cx="96" cy="-20" r="8" class="solid-black" />
      <circle cx="94" cy="-22" r="2.5" fill="#FFFFFF" stroke="none" />
      
      <circle cx="118" cy="-20" r="8" class="solid-black" />
      <circle cx="116" cy="-22" r="2.5" fill="#FFFFFF" stroke="none" />
    </g>
    <!-- Cute Little Nose -->
    <path d="M 104,-6 Q 107,-2 110,-6" class="medium-line" />
    <!-- Joyful Open Smile -->
    <path d="M 94,6 A 12,12 0 0,0 120,6 Z" class="thick-line" />
    <!-- Rosy Cheek Outlines -->
    <circle cx="85" cy="-2" r="6" class="thin-line" />
    <circle cx="127" cy="-2" r="6" class="thin-line" />

    <!-- Cowcatcher / Grill (Front bottom) -->
    <path d="M 85,50 L 135,85 L 65,85 Z" class="thick-line" />
    <line x1="93" y1="56" x2="88" y2="85" class="medium-line" />
    <line x1="108" y1="62" x2="108" y2="85" class="medium-line" />
    <line x1="123" y1="71" x2="128" y2="85" class="medium-line" />

    <!-- Wheel-base / Chassis Plate -->
    <rect x="-195" y="45" width="315" height="25" rx="8" class="thick-line" />

    <!-- Large Train Wheels (Perfect for toddler coloring) -->
    <!-- Wheel 1 (Back) -->
    <g id="wheel-1">
      <circle cx="-135" cy="90" r="40" class="thick-line" />
      <circle cx="-135" cy="90" r="26" class="medium-line" />
      <circle cx="-135" cy="90" r="9" class="thick-line" />
    </g>
    <!-- Wheel 2 (Middle) -->
    <g id="wheel-2">
      <circle cx="-40" cy="90" r="40" class="thick-line" />
      <circle cx="-40" cy="90" r="26" class="medium-line" />
      <circle cx="-40" cy="90" r="9" class="thick-line" />
    </g>
    <!-- Wheel 3 (Front) -->
    <g id="wheel-3">
      <circle cx="55" cy="90" r="40" class="thick-line" />
      <circle cx="55" cy="90" r="26" class="medium-line" />
      <circle cx="55" cy="90" r="9" class="thick-line" />
    </g>

    <!-- Connecting Rod -->
    <rect x="-145" y="83" width="210" height="14" rx="7" class="thick-line" />
  </g>

  <!-- FOREGROUND LARGE CLOUDS (At the bottom of the page) -->
  <g id="foreground-clouds">
    <!-- Giant Fluffy Cloud Landscape at Bottom -->
    <path d="M -50,830 C 50,760, 150,760, 250,820 C 350,740, 500,740, 600,810 C 700,750, 800,780, 900,850 L 900,1050 L -50,1050 Z" class="thick-line" />
    
    <!-- Additional Floating Cloud Front Left -->
    <path d="M -20,680 C -20,640 20,610 60,630 C 90,600 150,600 180,630 C 210,610 250,630 250,670 C 270,710 240,750 200,750 C 170,770 100,770 60,740 C 10,740 -20,710 -20,680 Z" class="thick-line" />
    
    <!-- Additional Floating Cloud Front Right -->
    <path d="M 560,720 C 560,680 600,650 640,670 C 670,640 730,640 760,670 C 790,650 830,670 830,710 C 850,750 820,790 780,790 C 750,810 680,810 640,780 C 590,780 560,750 560,720 Z" class="thick-line" />
  </g>

  <!-- Beautiful Thick Outer Frame/Border -->
  <rect x="20" y="20" width="760" height="960" rx="18" class="border-line" />
</svg>