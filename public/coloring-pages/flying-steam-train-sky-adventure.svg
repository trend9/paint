<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-nofill {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Gentle Rainbow -->
  <g id="rainbow">
    <path class="outline-nofill" d="M100 300 Q400 50 700 300" />
    <path class="outline-nofill" d="M110 320 Q400 70 690 320" />
    <path class="outline-nofill" d="M120 340 Q400 90 680 340" />
    <path class="outline-nofill" d="M130 360 Q400 110 670 360" />
  </g>

  <!-- Fluffy Clouds -->
  <g id="clouds">
    <!-- Cloud 1 -->
    <path class="outline" d="M100 400 C80 370 120 350 150 350 C180 340 220 370 200 400 C220 430 180 450 150 450 C120 460 80 430 100 400 Z"/>
    <!-- Cloud 2 -->
    <path class="outline" d="M600 450 C580 420 620 400 650 400 C680 390 720 420 700 450 C720 480 680 500 650 500 C620 510 580 480 600 450 Z"/>
    <!-- Cloud 3 (below train) -->
    <path class="outline" d="M150 750 C130 720 170 700 200 700 C230 690 270 720 250 750 C270 780 230 800 200 800 C170 810 130 780 150 750 Z"/>
    <!-- Cloud 4 (below train) -->
    <path class="outline" d="M500 780 C480 750 520 730 550 730 C580 720 620 750 600 780 C620 810 580 830 550 830 C520 840 480 810 500 780 Z"/>
  </g>

  <!-- Cute Happy Steam Train -->
  <g id="steam-train">
    <!-- Main carriage body -->
    <rect class="outline" x="150" y="550" width="400" height="150" rx="30" ry="30"/>
    <!-- Front engine section -->
    <rect class="outline" x="530" y="520" width="100" height="180" rx="40" ry="40"/>
    <!-- Chimney base -->
    <rect class="outline" x="550" y="470" width="60" height="50" rx="20" ry="20"/>
    <!-- Chimney top -->
    <ellipse class="outline" cx="580" cy="460" rx="40" ry="20"/>
    <!-- Front light/bumper -->
    <ellipse class="outline" cx="630" cy="620" rx="25" ry="35"/>
    <!-- Simple Wing (left side) -->
    <path class="outline" d="M130 600 Q100 580 130 560 Q180 570 130 600 Z"/>
    <!-- Simple Wing (right side) -->
    <path class="outline" d="M650 600 Q680 580 650 560 Q600 570 650 600 Z"/>

    <!-- Train Windows -->
    <rect class="outline" x="200" y="580" width="80" height="90" rx="15" ry="15"/>
    <rect class="outline" x="320" y="580" width="80" height="90" rx="15" ry="15"/>
    <rect class="outline" x="440" y="580" width="80" height="90" rx="15" ry="15"/>

    <!-- Friendly Animals peeking from windows -->
    <g id="animals-in-windows">
      <!-- Bear in left window -->
      <g id="bear">
        <ellipse class="outline" cx="240" cy="620" rx="35" ry="40"/> <!-- Head -->
        <circle class="outline" cx="220" cy="595" r="15"/> <!-- Left ear -->
        <circle class="outline" cx="260" cy="595" r="15"/> <!-- Right ear -->
        <circle class="outline" cx="230" cy="615" r="5"/> <!-- Left eye -->
        <circle class="outline" cx="250" cy="615" r="5"/> <!-- Right eye -->
        <path class="outline-nofill" d="M240 625 L240 635 M235 630 Q240 638 245 630"/> <!-- Nose and mouth -->
      </g>

      <!-- Bunny in middle window -->
      <g id="bunny">
        <ellipse class="outline" cx="360" cy="620" rx="35" ry="40"/> <!-- Head -->
        <ellipse class="outline" cx="345" cy="590" rx="10" ry="25" transform="rotate(-15 345 590)"/> <!-- Left ear -->
        <ellipse class="outline" cx="375" cy="590" rx="10" ry="25" transform="rotate(15 375 590)"/> <!-- Right ear -->
        <circle class="outline" cx="350" cy="615" r="5"/> <!-- Left eye -->
        <circle class="outline" cx="370" cy="615" r="5"/> <!-- Right eye -->
        <path class="outline-nofill" d="M360 625 L360 635 M355 630 Q360 638 365 630"/> <!-- Nose and mouth -->
      </g>

      <!-- Cat in right window -->
      <g id="cat">
        <ellipse class="outline" cx="480" cy="620" rx="35" ry="40"/> <!-- Head -->
        <path class="outline" d="M465 595 L460 580 L475 590 Z"/> <!-- Left ear (simplified triangle with rounded feel) -->
        <path class="outline" d="M495 595 L500 580 L485 590 Z"/> <!-- Right ear -->
        <circle class="outline" cx="470" cy="615" r="5"/> <!-- Left eye -->
        <circle class="outline" cx="490" cy="615" r="5"/> <!-- Right eye -->
        <path class="outline-nofill" d="M480 625 L480 635 M475 630 Q480 638 485 630"/> <!-- Nose and mouth -->
      </g>
    </g>

    <!-- Puffs of Steam/Smoke from chimney -->
    <g id="smoke">
      <path class="outline" d="M580 430 C560 400 600 380 630 380 C660 370 700 400 680 430 C700 460 660 480 630 480 C600 490 560 460 580 430 Z"/>
      <path class="outline" d="M550 400 C530 370 570 350 600 350 C630 340 670 370 650 400 C670 430 630 450 600 450 C570 460 530 430 550 400 Z"/>
    </g>
  </g>

</svg>