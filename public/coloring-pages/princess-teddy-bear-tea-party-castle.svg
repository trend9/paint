    <!-- Heart above teddy -->
    <path d="M 685,340 C 685,330 670,325 670,336 C 670,345 685,355 685,355 C 685,355 700,345 700,336 C 700,325 685,330 685,340 Z"/>

    <!-- Sparkles -->
    <!-- Sparkle 1 -->
    <path d="M 120,670 L 123,680 L 133,683 L 123,686 L 120,696 L 117,686 L 107,683 L 117,680 Z"/>
    <!-- Sparkle 2 -->
    <path d="M 690,660 L 693,670 L 703,673 L 693,676 L 690,686 L 687,676 L 677,673 L 687,670 Z"/>
    <!-- Sparkle 3 -->
    <path d="M 450,475 L 452,482 L 460,484 L 452,486 L 450,493 L 448,486 L 440,484 L 448,482 Z"/>
  </g>

  <!-- Foreground Floor Rug Curve (adds depth) -->
  <g id="floor-rug" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 160,930 Q 400,970 650,930" fill="none"/>
    <path d="M 130,950 Q 400,995 680,950" fill="none"/>
