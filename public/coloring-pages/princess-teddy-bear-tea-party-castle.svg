<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pure white background as per requirements -->
  <rect x="0" y="0" width="800" height="1000" fill="white" stroke="none"/>

  <!-- Background Castle Room and Windows -->
  <g id="castle_background">
    <!-- Main wall/floor area, simple base for the scene -->
    <path d="M0 200 H800 V1000 H0 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Castle Windows - Simplified and rounded -->
    <rect x="100" y="250" width="150" height="250" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <line x1="175" y1="250" x2="175" y2="500" stroke="black" stroke-width="4"/>
    <line x1="100" y1="375" x2="250" y2="375" stroke="black" stroke-width="4"/>

    <rect x="550" y="250" width="150" height="250" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <line x1="625" y1="250" x2="625" y2="500" stroke="black" stroke-width="4"/>
    <line x1="550" y1="375" x2="700" y2="375" stroke="black" stroke-width="4"/>
  </g>

  <!-- Table -->
  <g id="table">
    <ellipse cx="400" cy="650" rx="200" ry="70" fill="white" stroke="black" stroke-width="5"/> <!-- Tabletop -->
    <path d="M300 680 L280 850 A120 40 0 0 0 520 850 L500 680 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Table leg/stand -->
  </g>

  <!-- Princess -->
  <g id="princess">
    <!-- Body and Dress - Highly simplified for toddlers -->
    <path d="M400 620 C300 600 250 800 280 900 A150 50 0 0 0 520 900 C550 800 500 600 400 620 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Arms - Simple, rounded sleeves -->
    <path d="M340 600 C300 580 300 530 320 520 C340 530 340 570 340 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left Arm -->
    <path d="M460 600 C500 580 500 530 480 520 C460 530 460 570 460 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right Arm -->

    <!-- Head -->
    <circle cx="400" cy="450" r="70" fill="white" stroke="black" stroke-width="5"/>
    <!-- Hair - Simplified sections -->
    <path d="M350 380 C300 350 280 450 350 480 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left Hair -->
    <path d="M450 380 C500 350 520 450 450 480 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right Hair -->
    <ellipse cx="400" cy="390" rx="80" ry="40" fill="white" stroke="black" stroke-width="4"/> <!-- Top Hairline -->
    
    <!-- Crown - Simple shape with a jewel -->
    <path d="M360 380 L370 360 L390 370 L400 350 L410 370 L430 360 L440 380 Z" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="400" cy="350" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Crown Jewel -->

    <!-- Face - Large, friendly features -->
    <circle cx="370" cy="440" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
    <circle cx="430" cy="440" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
    <path d="M380 470 Q400 490 420 470" fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->

    <!-- Hand holding teacup - Simple blob overlapping handle -->
    <path d="M465 535 Q470 525 480 530 Q475 540 465 535 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Teacup and Saucer -->
  <g id="teacup_saucer">
    <!-- Saucer - Rounded ellipses -->
    <ellipse cx="460" cy="600" rx="45" ry="15" fill="white" stroke="black" stroke-width="4"/> <!-- Saucer bottom -->
    <ellipse cx="460" cy="590" rx="60" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Saucer top -->
    <!-- Teacup body - Simplified path -->
    <path d="M440 545 C430 515 490 515 480 545 L490 555 Q500 575 430 575 Z" fill="white" stroke="black" stroke-width="4"/> 
    <!-- Teacup Handle - Open path, partly obscured by hand -->
    <path d="M475 530 C485 525 485 540 475 535" fill="none" stroke="black" stroke-width="3"/>
  </g>

  <!-- Teddy Bear -->
  <g id="teddy_bear">
    <!-- Body - Rounded, friendly shape -->
    <path d="M280 670 C250 630 200 750 230 850 A100 40 0 0 0 370 850 C400 750 350 630 320 670 Z" fill="white" stroke="black" stroke-width="5"/>
    
    <!-- Head - Simple circle -->
    <circle cx="300" cy="600" r="50" fill="white" stroke="black" stroke-width="5"/>
    <!-- Ears - Small circles -->
    <circle cx="260" cy="570" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="340" cy="570" r="15" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snout - Ellipse with a small nose -->
    <ellipse cx="300" cy="610" rx="20" ry="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="300" cy="605" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Nose -->
    <!-- Eyes - Large, simple circles -->
    <circle cx="285" cy="590" r="8" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="315" cy="590" r="8" fill="white" stroke="black" stroke-width="3"/>
    <!-- Smile - Simple arc -->
    <path d="M290 620 Q300 630 310 620" fill="none" stroke="black" stroke-width="3"/>

    <!-- Arms - Very simplified, rounded shapes -->
    <path d="M250 670 Q220 650 230 680 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M350 670 Q380 650 370 680 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Teapot -->
  <g id="teapot">
    <!-- Body - Rounded path -->
    <path d="M560 600 C540 550 640 550 620 600 L600 650 A70 30 0 0 1 580 650 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Lid - Simple ellipse -->
    <path d="M600 550 A20 15 0 1 0 580 550 Z" fill="white" stroke="black" stroke-width="4"/> 
    <!-- Spout and Handle - Simple paths -->
    <path d="M570 590 C550 570 540 600 550 610 L560 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Spout -->
    <path d="M630 580 C650 570 650 610 630 620 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Handle -->
  </g>

  <!-- Pastries on the table -->
  <g id="pastries">
    <!-- Pastry 1 - Circle with simple swirl -->
    <circle cx="500" cy="640" r="25" fill="white" stroke="black" stroke-width="4"/>
    <path d="M490 635 L500 645 L510 635" fill="none" stroke="black" stroke-width="2"/>

    <!-- Pastry 2 - Another circle with swirl -->
    <circle cx="680" cy="640" r="25" fill="white" stroke="black" stroke-width="4"/>
    <path d="M670 635 L680 645 L690 635" fill="none" stroke="black" stroke-width="2"/>

    <!-- Pastry 3 - Rounded shape with a dot -->
    <path d="M720 620 C710 600 730 590 740 600 S750 620 740 630 S720 640 720 620 Z" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="730" cy="610" r="5" fill="white" stroke="black" stroke-width="2"/>
  </g>

</svg>