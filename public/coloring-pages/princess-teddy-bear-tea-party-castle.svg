    <!-- Right Arm (Holding/reaching to teacup) -->
    <path d="M 265,545 Q 290,590 325,585"/>
    <circle cx="330" cy="585" r="9"/>

    <!-- Princess Head -->
    <ellipse cx="210" cy="425" rx="50" ry="55"/>

    <!-- Princess Ears -->
    <path d="M 160,425 C 155,415 155,440 162,440"/>
    <circle cx="158" cy="442" r="3"/>
    <path d="M 260,425 C 265,415 265,440 258,440"/>
    <circle cx="262" cy="442" r="3"/>

    <!-- Cute Smiling Face -->
    <!-- Eyes -->
