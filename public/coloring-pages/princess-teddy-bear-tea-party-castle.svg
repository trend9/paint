<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ballroom Background - Clean and simple castle ballroom elements -->
  <g id="ballroom-background">
    <!-- Floor line to define the ground -->
    <path d="M 0 750 L 800 750" stroke="black" stroke-width="4" fill="none"/>

    <!-- Large central rounded window -->
    <rect x="250" y="150" width="300" height="400" rx="30" ry="30" stroke="black" stroke-width="4" fill="white"/>
    <!-- Simple window panes (cross shape) -->
    <path d="M 250 350 L 550 350" stroke="black" stroke-width="3" fill="none"/>
    <path d="M 400 150 L 400 550" stroke="black" stroke-width="3" fill="none"/>

    <!-- Simple drapes/curtains on either side of the window -->
    <path d="M 240 150 C 200 250, 200 450, 240 550 L 250 550 L 250 150 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 560 150 C 600 250, 600 450, 560 550 L 550 550 L 550 150 Z" stroke="black" stroke-width="4" fill="white"/>

    <!-- Wainscoting / lower wall detail -->
    <rect x="0" y="650" width="800" height="100" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Tea Party Table - Large and prominent in the foreground -->
  <g id="tea-party-table">
    <!-- Tabletop - large oval shape -->
    <ellipse cx="400" cy="650" rx="250" ry="100" stroke="black" stroke-width="4" fill="white"/>
    <!-- Table legs - rounded rectangles -->
    <rect x="280" y="680" width="40" height="100" rx="20" ry="20" stroke="black" stroke-width="4" fill="white"/>
    <rect x="480" y="680" width="40" height="100" rx="20" ry="20" stroke="black" stroke-width="4" fill="white"/>
    <!-- Connecting path for the table skirt -->
    <path d="M 280 780 C 320 800, 480 800, 520 780 L 520 650 L 280 650 Z" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Tea Party Items - Cakes and Teacups on the table -->
  <g id="tea-party-items">
    <!-- Cake - multi-layered with frosting lines and cherries -->
    <ellipse cx="400" cy="550" rx="70" ry="25" stroke="black" stroke-width="3" fill="white"/> <!-- Top layer -->
    <path d="M 330 550 V 620 A 70 25 0 0 0 470 620 V 550 Z" stroke="black" stroke-width="3" fill="white"/> <!-- Bottom layer -->
    <path d="M 330 570 C 350 565, 450 565, 470 570" stroke="black" stroke-width="3" fill="none"/> <!-- Frosting line 1 -->
    <path d="M 330 590 C 350 585, 450 585, 470 590" stroke="black" stroke-width="3" fill="none"/> <!-- Frosting line 2 -->
    <circle cx="360" cy="540" r="7" stroke="black" stroke-width="3" fill="white"/> <!-- Cherry 1 -->
    <circle cx="440" cy="540" r="7" stroke="black" stroke-width="3" fill="white"/> <!-- Cherry 2 -->

    <!-- Teacup 1 with saucer and handle -->
    <ellipse cx="280" cy="590" rx="50" ry="20" stroke="black" stroke-width="3" fill="white"/> <!-- Saucer -->
    <path d="M 260 580 C 250 560, 250 540, 270 530 C 280 520, 300 520, 310 530 C 330 540, 330 560, 320 580 Z" stroke="black" stroke-width="3" fill="white"/> <!-- Cup body -->
    <path d="M 320 550 C 335 540, 335 560, 320 570" stroke="black" stroke-width="3" fill="none"/> <!-- Handle -->
    <ellipse cx="290" cy="530" rx="25" ry="10" stroke="black" stroke-width="3" fill="white"/> <!-- Cup opening -->

    <!-- Teacup 2 with saucer and handle -->
    <ellipse cx="520" cy="590" rx="50" ry="20" stroke="black" stroke-width="3" fill="white"/> <!-- Saucer -->
    <path d="M 500 580 C 490 560, 490 540, 510 530 C 520 520, 540 520, 550 530 C 570 540, 570 560, 560 580 Z" stroke="black" stroke-width="3" fill="white"/> <!-- Cup body -->
    <path d="M 560 550 C 575 540, 575 560, 560 570" stroke="black" stroke-width="3" fill="none"/> <!-- Handle -->
    <ellipse cx="530" cy="530" rx="25" ry="10" stroke="black" stroke-width="3" fill="white"/> <!-- Cup opening -->
  </g>

  <!-- Cute Happy Princess - Main character on the left -->
  <g id="princess">
    <!-- Ball Gown - large and flowing -->
    <path d="M 400 620 C 250 680, 150 850, 200 950 C 300 1000, 500 1000, 600 950 C 650 850, 550 680, 400 620 Z" stroke="black" stroke-width="5" fill="white"/>
    <!-- Torso -->
    <path d="M 390 580 C 370 570, 370 550, 390 540 C 410 530, 430 530, 450 540 C 470 550, 470 570, 450 580 Z" stroke="black" stroke-width="5" fill="white"/>
    <!-- Arms - simple rounded shapes -->
    <path d="M 380 570 Q 340 600, 320 600 Q 300 600, 290 580 Q 280 560, 300 550 Z" stroke="black" stroke-width="5" fill="white"/> <!-- Left arm -->
    <path d="M 460 570 Q 500 600, 520 600 Q 540 600, 550 580 Q 560 560, 540 550 Z" stroke="black" stroke-width="5" fill="white"/> <!-- Right arm -->
    <!-- Head - simple circle for face -->
    <circle cx="420" cy="480" r="50" stroke="black" stroke-width="5" fill="white"/>
    <!-- Hair - flowing rounded path -->
    <path d="M 370 450 C 350 430, 340 450, 320 460 C 310 480, 320 500, 340 510 C 360 520, 390 520, 420 510 C 450 520, 480 520, 500 510 C 520 500, 530 480, 520 460 C 500 450, 490 430, 470 450 Z" stroke="black" stroke-width="5" fill="white"/>
    <!-- Eyes - simple circles -->
    <circle cx="400" cy="475" r="7" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="440" cy="475" r="7" stroke="black" stroke-width="3" fill="white"/>
    <!-- Happy mouth - curved line -->
    <path d="M 405 495 Q 420 505, 435 495" stroke="black" stroke-width="3" fill="none"/>
    <!-- Crown - simple angular shape -->
    <path d="M 390 440 L 400 420 L 420 430 L 440 420 L 450 440 Z" stroke="black" stroke-width="3" fill="white"/>
  </g>

  <!-- Cuddly Teddy Bear - Main character on the right -->
  <g id="teddy-bear">
    <!-- Body - large rounded oval -->
    <ellipse cx="650" cy="700" rx="70" ry="90" stroke="black" stroke-width="5" fill="white"/>
    <!-- Arms - rounded rectangles, slightly rotated -->
    <rect x="580" y="640" width="35" height="80" rx="17" ry="17" transform="rotate(-15 580 640)" stroke="black" stroke-width="5" fill="white"/>
    <rect x="710" y="640" width="35" height="80" rx="17" ry="17" transform="rotate(15 745 640)" stroke="black" stroke-width="5" fill="white"/>
    <!-- Legs - rounded rectangles, slightly rotated -->
    <rect x="600" y="770" width="40" height="70" rx="20" ry="20" transform="rotate(-5 600 770)" stroke="black" stroke-width="5" fill="white"/>
    <rect x="680" y="770" width="40" height="70" rx="20" ry="20" transform="rotate(5 720 770)" stroke="black" stroke-width="5" fill="white"/>
    <!-- Head - simple circle -->
    <circle cx="650" cy="600" r="55" stroke="black" stroke-width="5" fill="white"/>
    <!-- Ears - small circles -->
    <circle cx="610" cy="560" r="18" stroke="black" stroke-width="5" fill="white"/>
    <circle cx="690" cy="560" r="18" stroke="black" stroke-width="5" fill="white"/>
    <!-- Snout - oval shape -->
    <ellipse cx="650" cy="615" rx="22" ry="13" stroke="black" stroke-width="5" fill="white"/>
    <!-- Eyes - small circles -->
    <circle cx="635" cy="585" r="5" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="665" cy="585" r="5" stroke="black" stroke-width="3" fill="white"/>
    <!-- Nose - simple inverted triangle path -->
    <path d="M 650 605 C 645 600, 655 600, 650 605 Z" stroke="black" stroke-width="3" fill="white"/>
    <!-- Happy mouth - curved line -->
    <path d="M 640 620 Q 650 625, 660 620" stroke="black" stroke-width="3" fill="none"/>
  </g>
</svg>