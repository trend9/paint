    <path d="M 595,504 Q 605,498 615,504 Q 618,515 605,518 Q 592,515 595,504 Z"/>
    <!-- Classic Bear Smile -->
    <path d="M 605,518 V 527"/>
    <path d="M 592,525 Q 605,535 605,527 Q 605,535 618,525" fill="none"/>

    <!-- Bear Eyes -->
