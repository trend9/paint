    <path d="M 460,150 L 464,162 L 476,166 L 464,170 L 460,182 L 456,170 L 444,166 L 456,162 Z"/>

    <!-- Party Bunting Banner -->
    <path d="M 40,80 Q 220,160 400,120 Q 580,160 760,80" fill="none" stroke-width="4"/>
    <!-- Pennant Flags -->
    <polygon points="90,105 130,116 110,165"/>
    <polygon points="170,126 210,133 190,180"/>
    <polygon points="250,136 290,137 270,185"/>
    <polygon points="330,132 370,127 350,175"/>
    <polygon points="430,127 470,132 450,175"/>
    <polygon points="510,137 550,136 530,185"/>
    <polygon points="590,133 630,126 610,180"/>
    <polygon points="670,116 710,105 690,165"/>

