    <path d="M 535,300 V 280 A 15,15 0 0,1 565,280 V 300 Z"/>

    <!-- Central Connecting Castle Wall with Battlements -->
    <path d="M 290,360 H 330 V 340 H 360 V 360 H 440 V 340 H 470 V 360 H 510 V 460 H 290 Z"/>

