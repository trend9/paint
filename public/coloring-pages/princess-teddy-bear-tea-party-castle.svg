    <path d="M 140,580 H 660" stroke-width="4"/>

    <!-- Castle Turrets visible through window -->
    <!-- Left Turret -->
    <rect x="210" y="260" width="80" height="200"/>
    <path d="M 195,260 L 250,130 L 305,260 Z"/>
    <!-- Turret Flag -->
    <path d="M 250,130 V 80 L 290,105 L 250,120"/>
    <!-- Turret Window -->
    <path d="M 235,320 V 300 A 15,15 0 0,1 265,300 V 320 Z"/>

    <!-- Right Turret -->
    <rect x="510" y="240" width="80" height="220"/>
    <path d="M 495,240 L 550,110 L 605,240 Z"/>
    <!-- Turret Flag -->
    <path d="M 550,110 V 60 L 590,85 L 550,100"/>
