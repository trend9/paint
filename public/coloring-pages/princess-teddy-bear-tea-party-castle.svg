  <!-- Delightful Floating Magic Hearts & Sparkles -->
  <g id="magical-details" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart above princess -->
    <path d="M 265,300 C 265,290 250,285 250,296 C 250,305 265,315 265,315 C 265,315 280,305 280,296 C 280,285 265,290 265,300 Z"/>
    
    <!-- Heart between them -->
