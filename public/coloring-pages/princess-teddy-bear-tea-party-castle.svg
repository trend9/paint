    <rect x="120" y="360" width="40" height="25" rx="5"/>
    <rect x="70" y="400" width="55" height="25" rx="5"/>
    <rect x="670" y="320" width="50" height="25" rx="5"/>
    <rect x="635" y="360" width="45" height="25" rx="5"/>
    <rect x="680" y="400" width="50" height="25" rx="5"/>

