      <path d="M 475,652 Q 475,640 485,640 Q 495,640 495,652 Z"/>
      <path d="M 493,643 Q 501,645 493,650" fill="none"/>
      <!-- Tiny Steam -->
      <path d="M 485,635 Q 490,625 483,615" fill="none" stroke-width="2"/>
    </g>

    <!-- Plate of Treats (Cookies/Macarons) -->
    <g id="treats-plate">
      <ellipse cx="460" cy="635" rx="22" ry="8"/>
      <!-- Cookie 1 -->
      <ellipse cx="453" cy="632" rx="7" ry="4"/>
      <!-- Cookie 2 -->
      <ellipse cx="467" cy="633" rx="7" ry="4"/>
    </g>
