      <ellipse cx="192" cy="412" rx="4" ry="6"/>
      <circle cx="188" cy="421" r="2"/>
      <path d="M 180,405 Q 190,398 200,403" fill="none" stroke-width="3"/>
      <!-- Eye lashes -->
      <line x1="182" y1="407" x2="175" y2="402" stroke-width="3"/>
      <line x1="198" y1="406" x2="204" y2="402" stroke-width="3"/>

      <!-- Right Eye -->
      <ellipse cx="230" cy="415" rx="10" ry="13"/>
      <ellipse cx="232" cy="412" rx="4" ry="6"/>
      <circle cx="228" cy="421" r="2"/>
      <path d="M 220,403 Q 230,398 240,405" fill="none" stroke-width="3"/>
      <!-- Eye lashes -->
      <line x1="222" y1="406" x2="216" y2="402" stroke-width="3"/>
      <line x1="238" y1="407" x2="245" y2="402" stroke-width="3"/>
    </g>

    <!-- Rosy Cheek Circles -->
