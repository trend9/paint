<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="coral_reef">
    <!-- Main coral structures - simplified blob-like shapes -->
    <path d="M100 850 C150 900, 250 950, 300 900 C350 850, 280 800, 200 820 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M400 900 C450 950, 550 980, 600 930 C650 880, 580 830, 500 850 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M650 800 C700 850, 780 880, 750 820 C720 760, 680 750, 650 800 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Smaller coral bits / texture with rounded shapes -->
    <circle cx="200" cy="880" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="220" cy="850" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="500" cy="900" r="20" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="540" cy="870" r="12" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <g id="sea_plants">
    <!-- Tall wavy plant 1 -->
    <path d="M150 850 Q160 700, 180 750 Q200 600, 220 650 Q240 500, 260 550" fill="none" stroke="black" stroke-width="5"/>
    <path d="M170 850 Q180 700, 200 750 Q220 600, 240 650 Q260 500, 280 550" fill="none" stroke="black" stroke-width="5"/>
    <!-- Shorter wavy plant 2 -->
    <path d="M350 880 Q360 800, 380 830 Q400 750, 420 780" fill="none" stroke="black" stroke-width="4"/>
    <path d="M370 880 Q380 800, 400 830 Q420 750, 440 780" fill="none" stroke="black" stroke-width="4"/>
    <!-- Bulbous plant -->
    <path d="M600 800 C620 700, 680 700, 700 800 C680 850, 620 850, 600 800 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M630 760 Q650 720, 670 760" fill="none" stroke="black" stroke-width="3"/>
    <path d="M630 780 Q650 740, 670 780" fill="none" stroke="black" stroke-width="3"/>
  </g>

  <g id="fish_group">
    <!-- Fish 1 (main) -->
    <g id="fish1">
      <ellipse cx="400" cy="300" rx="100" ry="70" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M500 300 Q560 270, 560 300 Q560 330, 500 300 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Tail -->
      <path d="M400 230 Q430 180, 460 230 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Top fin -->
      <path d="M400 370 Q430 420, 460 370 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Bottom fin -->
      <path d="M360 330 C380 350, 400 350, 420 330 C400 310, 380 310, 360 330 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Side fin -->
      <circle cx="340" cy="280" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Eye outer -->
      <circle cx="345" cy="278" r="5" fill="white" stroke="black" stroke-width="2"/> <!-- Eye pupil -->
      <path d="M300 300 Q310 320, 320 300" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
    </g>

    <!-- Fish 2 (smaller) -->
    <g id="fish2">
      <ellipse cx="650" cy="180" rx="70" ry="50" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <path d="M720 180 Q760 160, 760 180 Q760 200, 720 180 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Tail -->
      <path d="M650 130 Q670 100, 690 130 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Top fin -->
      <circle cx="620" cy="165" r="10" fill="white" stroke="black" stroke-width="2"/> <!-- Eye outer -->
      <circle cx="623" cy="163" r="3" fill="white" stroke="black" stroke-width="1.5"/> <!-- Eye pupil -->
      <path d="M590 180 Q600 195, 610 180" fill="none" stroke="black" stroke-width="2"/> <!-- Mouth -->
    </g>

    <!-- Fish 3 (even smaller) -->
    <g id="fish3">
      <ellipse cx="180" cy="450" rx="60" ry="40" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <path d="M240 450 Q270 435, 270 450 Q270 465, 240 450 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Tail -->
      <path d="M180 410 Q200 390, 220 410 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Top fin -->
      <circle cx="150" cy="435" r="8" fill="white" stroke="black" stroke-width="2"/> <!-- Eye outer -->
      <circle cx="152" cy="434" r="2" fill="white" stroke="black" stroke-width="1"/> <!-- Eye pupil -->
      <path d="M130 450 Q140 460, 150 450" fill="none" stroke="black" stroke-width="2"/> <!-- Mouth -->
    </g>
  </g>

  <g id="friendly_crab">
    <ellipse cx="600" cy="700" rx="80" ry="60" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
    <!-- Legs -->
    <path d="M530 730 Q510 760, 520 790" fill="none" stroke="black" stroke-width="4"/>
    <path d="M550 740 Q540 780, 560 800" fill="none" stroke="black" stroke-width="4"/>
    <path d="M670 730 Q690 760, 680 790" fill="none" stroke="black" stroke-width="4"/>
    <path d="M650 740 Q660 780, 640 800" fill="none" stroke="black" stroke-width="4"/>
    <!-- Claws -->
    <path d="M520 670 Q480 650, 480 620 C490 610, 500 620, 500 630 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left claw arm and pincer -->
    <path d="M500 630 L500 600 L480 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left pincer detail -->
    <path d="M680 670 Q720 650, 720 620 C710 610, 700 620, 700 630 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right claw arm and pincer -->
    <path d="M700 630 L700 600 L720 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right pincer detail -->
    <!-- Eyes -->
    <path d="M560 660 Q570 630, 580 660" fill="none" stroke="black" stroke-width="3"/> <!-- Left eyestalk -->
    <path d="M620 660 Q630 630, 640 660" fill="none" stroke="black" stroke-width="3"/> <!-- Right eyestalk -->
    <circle cx="580" cy="650" r="12" fill="white" stroke="black" stroke-width="3"/> <!-- Left eye outer -->
    <circle cx="583" cy="648" r="4" fill="white" stroke="black" stroke-width="2"/> <!-- Left eye pupil -->
    <circle cx="620" cy="650" r="12" fill="white" stroke="black" stroke-width="3"/> <!-- Right eye outer -->
    <circle cx="623" cy="648" r="4" fill="white" stroke="black" stroke-width="2"/> <!-- Right eye pupil -->
    <!-- Mouth -->
    <path d="M580 710 Q600 730, 620 710" fill="none" stroke="black" stroke-width="3"/>
  </g>

  <g id="starfish">
    <!-- Simplified, rounded starfish shape -->
    <path d="M180 500 C220 520, 250 550, 260 600 C270 650, 220 680, 180 700 C140 680, 90 650, 100 600 C110 550, 140 520, 180 500 Z"
          fill="white" stroke="black" stroke-width="5"/>
    <!-- Internal details - simplified dots for texture -->
    <circle cx="180" cy="600" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="140" cy="580" r="7" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="220" cy="580" r="7" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="140" cy="620" r="7" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="220" cy="620" r="7" fill="white" stroke="black" stroke-width="2"/>
  </g>

  <g id="bubbles">
    <circle cx="100" cy="200" r="20" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="130" cy="150" r="15" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="80" cy="120" r="10" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="500" cy="100" r="25" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="530" cy="70" r="18" fill="none" stroke="black" stroke-width="2"/>
  </g>

</svg>