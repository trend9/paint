<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      /* Common styles for all outlines */
      .outline {
        stroke: black;
        stroke-width: 4; /* Standard thickness, within 3-5 */
        fill: white; /* All fills must be white for coloring */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Slightly thinner for internal details like wing veins or small facial features */
      .outline-thin {
        stroke: black;
        stroke-width: 3; /* Within 3-5 range */
        fill: none; /* Internal lines often have no fill */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Forest Ground - A simple wavy line for the ground -->
  <g id="forest-ground">
    <path class="outline" d="M0 900 Q200 870 400 900 T800 900 L800 1000 L0 1000 Z"/>
  </g>

  <!-- Mushroom House -->
  <g id="mushroom-house">
    <!-- Mushroom Stem -->
    <path class="outline" d="M350 580 C320 500 320 380 350 300 H450 C480 380 480 500 450 580 Z" />
    <!-- Mushroom Cap -->
    <path class="outline" d="M280 300 C200 180 200 80 400 50 C600 80 600 180 520 300 Z" />
    <!-- Round Door -->
    <ellipse class="outline" cx="400" cy="470" rx="45" ry="70" />
    <!-- Chimney -->
    <rect class="outline" x="480" y="80" width="45" height="80" rx="10" ry="10" />
    <ellipse class="outline" cx="502.5" cy="80" rx="35" ry="18" /> <!-- Top of chimney -->
  </g>

  <!-- Fairy -->
  <g id="fairy" transform="translate(100 150) scale(0.5)">
    <!-- Body -->
    <ellipse class="outline" cx="500" cy="550" rx="40" ry="70" />
    <!-- Head -->
    <circle class="outline" cx="500" cy="460" r="40" />
    <!-- Face -->
    <circle class="outline" cx="485" cy="450" r="4" /> <!-- Eyes -->
    <circle class="outline" cx="515" cy="450" r="4" />
    <path class="outline-thin" fill="none" d="M485 475 Q500 485 515 475" /> <!-- Smile -->
    <!-- Arms -->
    <path class="outline" fill="none" d="M470 510 Q450 520 440 540" />
    <path class="outline" fill="none" d="M530 510 Q550 520 560 540" />
    <!-- Legs -->
    <path class="outline" fill="none" d="M480 600 Q470 620 460 630" />
    <path class="outline" fill="none" d="M520 600 Q530 620 540 630" />

    <!-- Wings (Big detailed butterfly wings, simplified) -->
    <g id="fairy-wings">
      <!-- Left Upper Wing -->
      <path class="outline" d="M460 500 C400 400 350 380 380 480 C390 530 430 550 460 500 Z" />
      <path class="outline-thin" fill="none" d="M410 440 L380 440 M420 460 L390 470" /> <!-- Simple veins -->
      <!-- Left Lower Wing -->
      <path class="outline" d="M460 530 C400 600 360 610 380 560 C400 520 440 500 460 530 Z" />
      <path class="outline-thin" fill="none" d="M410 570 L380 560 M420 550 L390 560" />

      <!-- Right Upper Wing -->
      <path class="outline" d="M540 500 C600 400 650 380 620 480 C610 530 570 550 540 500 Z" />
      <path class="outline-thin" fill="none" d="M590 440 L620 440 M580 460 L610 470" /> <!-- Simple veins -->
      <!-- Right Lower Wing -->
      <path class="outline" d="M540 530 C600 600 640 610 620 560 C600 520 560 500 540 530 Z" />
      <path class="outline-thin" fill="none" d="M590 570 L620 560 M580 550 L610 560" />
    </g>

    <!-- Tiny Magic Wand -->
    <path class="outline" fill="none" d="M550 530 L600 500" />
    <circle class="outline" cx="600" cy="500" r="7" /> <!-- Wand tip -->
  </g>

  <!-- Whimsical Forest Elements -->
  <g id="forest-elements">
    <!-- Large Simple Flower 1 -->
    <g transform="translate(100 700)">
      <circle class="outline" cx="0" cy="0" r="30" /> <!-- Center -->
      <ellipse class="outline" cx="0" cy="-50" rx="25" ry="40" />
      <ellipse class="outline" cx="40" cy="-30" rx="25" ry="40" transform="rotate(30 0 0)" />
      <ellipse class="outline" cx="50" cy="10" rx="25" ry="40" transform="rotate(60 0 0)" />
      <ellipse class="outline" cx="40" cy="50" rx="25" ry="40" transform="rotate(90 0 0)" />
      <ellipse class="outline" cx="0" cy="60" rx="25" ry="40" transform="rotate(120 0 0)" />
      <ellipse class="outline" cx="-40" cy="50" rx="25" ry="40" transform="rotate(150 0 0)" />
      <ellipse class="outline" cx="-50" cy="10" rx="25" ry="40" transform="rotate(180 0 0)" />
      <ellipse class="outline" cx="-40" cy="-30" rx="25" ry="40" transform="rotate(210 0 0)" />
    </g>

    <!-- Large Simple Flower 2 -->
    <g transform="translate(680 800) scale(0.9)">
      <circle class="outline" cx="0" cy="0" r="35" /> <!-- Center -->
      <ellipse class="outline" cx="0" cy="-60" rx="30" ry="45" />
      <ellipse class="outline" cx="45" cy="-35" rx="30" ry="45" transform="rotate(30 0 0)" />
      <ellipse class="outline" cx="55" cy="15" rx="30" ry="45" transform="rotate(60 0 0)" />
      <ellipse class="outline" cx="45" cy="65" rx="30" ry="45" transform="rotate(90 0 0)" />
      <ellipse class="outline" cx="0" cy="70" rx="30" ry="45" transform="rotate(120 0 0)" />
      <ellipse class="outline" cx="-45" cy="65" rx="30" ry="45" transform="rotate(150 0 0)" />
      <ellipse class="outline" cx="-55" cy="15" rx="30" ry="45" transform="rotate(180 0 0)" />
      <ellipse class="outline" cx="-45" cy="-35" rx="30" ry="45" transform="rotate(210 0 0)" />
    </g>

    <!-- Big Leaves -->
    <g id="leaves">
      <path class="outline" d="M150 650 C100 700 130 800 200 830 C230 800 200 700 150 650 Z" />
      <path class="outline" d="M700 700 C750 750 720 850 650 880 C620 850 650 750 700 700 Z" />
      <path class="outline" d="M300 880 C250 930 280 980 350 1010 C380 980 350 930 300 880 Z" />
      <path class="outline" d="M500 850 C450 900 480 950 550 980 C580 950 550 900 500 850 Z" />
    </g>

    <!-- Friendly Butterflies -->
    <g id="butterflies">
      <!-- Butterfly 1 (Top-Left) -->
      <g transform="translate(100 150) scale(0.7)">
        <ellipse class="outline" cx="0" cy="0" rx="15" ry="30" /> <!-- Body -->
        <path class="outline" d="M0 -30 Q-40 -50 -50 0 Q-40 50 0 30 Z" /> <!-- Left Wing -->
        <path class="outline" d="M0 -30 Q40 -50 50 0 Q40 50 0 30 Z" /> <!-- Right Wing -->
        <path class="outline-thin" fill="none" d="M-5 -20 Q-20 -40 -10 -55" /> <!-- Antenna left -->
        <path class="outline-thin" fill="none" d="M5 -20 Q20 -40 10 -55" /> <!-- Antenna right -->
        <circle class="outline" cx="-7" cy="-5" r="3" /> <!-- Eye left -->
        <circle class="outline" cx="7" cy="-5" r="3" /> <!-- Eye right -->
        <path class="outline-thin" fill="none" d="M-5 10 Q0 15 5 10" /> <!-- Smile -->
      </g>
      <!-- Butterfly 2 (Top-Right) -->
      <g transform="translate(700 150) scale(0.8)">
        <ellipse class="outline" cx="0" cy="0" rx="18" ry="35" /> <!-- Body -->
        <path class="outline" d="M0 -35 Q-50 -60 -60 0 Q-50 60 0 35 Z" /> <!-- Left Wing -->
        <path class="outline" d="M0 -35 Q50 -60 60 0 Q50 60 0 35 Z" /> <!-- Right Wing -->
        <path class="outline-thin" fill="none" d="M-7 -25 Q-25 -45 -12 -60" /> <!-- Antenna left -->
        <path class="outline-thin" fill="none" d="M7 -25 Q25 -45 12 -60" /> <!-- Antenna right -->
        <circle class="outline" cx="-8" cy="-8" r="4" /> <!-- Eye left -->
        <circle class="outline" cx="8" cy="-8" r="4" /> <!-- Eye right -->
        <path class="outline-thin" fill="none" d="M-7 12 Q0 18 7 12" /> <!-- Smile -->
      </g>
    </g>
  </g>

</svg>