<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground line -->
  <path d="M0 870 Q200 820 400 870 T800 870" fill="white" stroke="black" stroke-width="4"/>

  <!-- Mushroom House -->
  <g id="mushroom_house">
    <!-- Mushroom cap (roof) -->
    <path d="M250 450 C200 350 300 300 400 300 C500 300 600 350 550 450 L550 480 Q400 400 250 480 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Mushroom stem (house body) -->
    <rect x="300" y="450" width="200" height="350" rx="40" ry="40" fill="white" stroke="black" stroke-width="5"/>
    <!-- Door -->
    <rect x="360" y="650" width="80" height="150" rx="30" ry="30" fill="white" stroke="black" stroke-width="4"/>
    <!-- Door handle -->
    <circle cx="370" cy="720" r="8" fill="white" stroke="black" stroke-width="3"/>
    <!-- Window -->
    <circle cx="400" cy="550" r="40" fill="white" stroke="black" stroke-width="4"/>
    <line x1="400" y1="510" x2="400" y2="590" stroke="black" stroke-width="3"/>
    <line x1="360" y1="550" x2="440" y2="550" stroke="black" stroke-width="3"/>

    <!-- Flowers on house -->
    <g id="house_flowers">
      <!-- Left flower -->
      <circle cx="300" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="315" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="300" cy="415" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="285" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="300" cy="385" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="300" cy="400" r="8" fill="white" stroke="black" stroke-width="3"/>
      <!-- Right flower -->
      <circle cx="500" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="515" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="500" cy="415" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="485" cy="400" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="500" cy="385" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="500" cy="400" r="8" fill="white" stroke="black" stroke-width="3"/>
    </g>
  </g>

  <!-- Fairy -->
  <g id="fairy">
    <!-- Body -->
    <ellipse cx="400" cy="790" rx="30" ry="45" fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <circle cx="400" cy="735" r="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Hair bun -->
    <circle cx="400" cy="720" r="15" fill="white" stroke="black" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="390" cy="728" r="4" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="410" cy="728" r="4" fill="white" stroke="black" stroke-width="3"/>
    <!-- Smile -->
    <path d="M390 740 Q400 748 410 740" fill="none" stroke="black" stroke-width="3"/>
    <!-- Hair (bangs) -->
    <path d="M380 720 C380 710 420 710 420 720" fill="white" stroke="black" stroke-width="3"/>
    <!-- Hair (sides) -->
    <path d="M375 730 Q365 720 360 735 Q365 745 375 740 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M425 730 Q435 720 440 735 Q435 745 425 740 Z" fill="white" stroke="black" stroke-width="3"/>

    <!-- Leaf Dress -->
    <path d="M370 790 C360 820 440 820 430 790 L400 770 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Arms -->
    <path d="M375 770 Q365 775 360 785" fill="white" stroke="black" stroke-width="3"/> <!-- Left arm -->
    <path d="M425 770 Q435 775 440 785" fill="white" stroke="black" stroke-width="3"/> <!-- Right arm -->
    <!-- Legs (sitting) -->
    <path d="M380 810 Q375 830 390 840 Q405 830 390 810 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left leg/foot -->
    <path d="M420 810 Q425 830 410 840 Q395 830 410 810 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right leg/foot -->

    <!-- Delicate Wings -->
    <path d="M420 740 C460 690 480 710 440 770 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M425 750 C440 730 450 740 435 760" fill="none" stroke="black" stroke-width="3"/> <!-- Inner line for right wing -->
    <path d="M380 740 C340 690 320 710 360 770 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M375 750 C360 730 350 740 365 760" fill="none" stroke="black" stroke-width="3"/> <!-- Inner line for left wing -->
  </g>

  <!-- Forest Elements -->
  <g id="forest_elements">
    <!-- Large leaves -->
    <path d="M100 800 C50 700 150 650 200 750 C180 820 120 880 100 800 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M600 850 C550 750 650 700 700 800 C680 870 620 930 600 850 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Happy Snail -->
    <g id="snail">
      <!-- Shell -->
      <path d="M150 900 A30 30 0 1 0 150 840 A20 20 0 1 1 150 880 A10 10 0 1 0 150 860 A5 5 0 1 1 150 870 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Body -->
      <path d="M150 900 C130 920 170 940 210 920 C230 910 220 890 190 880 Q180 870 150 900 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Eyes/Antennae -->
      <line x1="190" y1="880" x2="205" y2="860" stroke="black" stroke-width="3"/>
      <circle cx="210" cy="855" r="5" fill="white" stroke="black" stroke-width="3"/>
      <line x1="190" y1="885" x2="200" y2="870" stroke="black" stroke-width="3"/>
      <circle cx="205" cy="865" r="5" fill="white" stroke="black" stroke-width="3"/>
      <!-- Smile -->
      <path d="M180 910 Q190 920 200 910" fill="none" stroke="black" stroke-width="3"/>
    </g>
  </g>
</svg>