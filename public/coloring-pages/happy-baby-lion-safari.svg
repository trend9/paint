<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Group for the entire coloring page content -->
    <g id="coloring_page">

        <!-- Simplified Safari Plants -->
        <g id="plants">
            <!-- Large Leaf -->
            <path d="M 100 700 C 50 600, 150 500, 250 550 C 350 600, 250 700, 200 750 C 150 800, 100 750, 100 700 Z"
                  fill="white" stroke="black" stroke-width="4"/>
            <path d="M 175 625 C 190 650, 200 680, 210 700"
                  fill="none" stroke="black" stroke-width="3"/> <!-- Leaf vein -->

            <!-- Tufts of Grass -->
            <path d="M 600 850 Q 620 800, 640 850 Q 660 800, 680 850"
                  fill="none" stroke="black" stroke-width="4"/>
            <path d="M 150 880 Q 170 830, 190 880 Q 210 830, 230 880"
                  fill="none" stroke="black" stroke-width="4"/>
            <path d="M 700 750 Q 720 700, 740 750 Q 760 700, 780 750"
                  fill="none" stroke="black" stroke-width="4"/>
        </g>

        <!-- Cute Happy Baby Lion Cub -->
        <g id="lion_cub">
            <!-- Body -->
            <ellipse cx="400" cy="700" rx="200" ry="150"
                     fill="white" stroke="black" stroke-width="5"/>

            <!-- Head -->
            <circle cx="400" cy="400" r="150"
                    fill="white" stroke="black" stroke-width="5"/>

            <!-- Mane (simplified bumps around head) -->
            <path d="M 250 400 C 200 300, 300 250, 400 250 C 500 250, 600 300, 550 400"
                  fill="none" stroke="black" stroke-width="5"/>
            <!-- Connectors for mane shape -->
            <path d="M 250 400 Q 220 350, 200 300" fill="none" stroke="black" stroke-width="5"/>
            <path d="M 550 400 Q 580 350, 600 300" fill="none" stroke="black" stroke-width="5"/>

            <!-- Ears -->
            <ellipse cx="300" cy="290" rx="60" ry="70" transform="rotate(-15 300 290)"
                     fill="white" stroke="black" stroke-width="4"/>
            <ellipse cx="500" cy="290" rx="60" ry="70" transform="rotate(15 500 290)"
                     fill="white" stroke="black" stroke-width="4"/>
            
            <!-- Muzzle -->
            <ellipse cx="400" cy="450" rx="100" ry="70"
                     fill="white" stroke="black" stroke-width="4"/>

            <!-- Nose -->
            <path d="M 400 420 L 380 440 A 20 20 0 0 0 420 440 L 400 420 Z"
                  fill="white" stroke="black" stroke-width="3"/>

            <!-- Mouth -->
            <path d="M 360 470 Q 400 490, 440 470"
                  fill="none" stroke="black" stroke-width="3"/>

            <!-- Eyes -->
            <circle cx="350" cy="380" r="35"
                    fill="white" stroke="black" stroke-width="3"/>
            <circle cx="450" cy="380" r="35"
                    fill="white" stroke="black" stroke-width="3"/>

            <!-- Front Paws (sitting posture) -->
            <ellipse cx="300" cy="800" rx="70" ry="50" transform="rotate(-10 300 800)"
                     fill="white" stroke="black" stroke-width="4"/>
            <ellipse cx="500" cy="800" rx="70" ry="50" transform="rotate(10 500 800)"
                     fill="white" stroke="black" stroke-width="4"/>

            <!-- Hind Legs / Sitting Base - Simplified as one path -->
            <path d="M 220 700 C 180 750, 180 850, 250 880 L 550 880 C 620 850, 620 750, 580 700"
                  fill="white" stroke="black" stroke-width="5"/>

            <!-- Tail (curled) -->
            <path d="M 600 600 C 680 550, 700 650, 650 750 C 600 850, 500 800, 550 700"
                  fill="none" stroke="black" stroke-width="4"/>
            <!-- Tail tuft -->
            <circle cx="550" cy="700" r="40"
                    fill="white" stroke="black" stroke-width="4"/>
        </g>

    </g>
</svg>