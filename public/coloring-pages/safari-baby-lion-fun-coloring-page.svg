<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Pure white background -->
  <rect x="0" y="0" width="800" height="1000" fill="white"/>

  <!-- Group for the entire safari scene -->
  <g id="safari_scene">

    <!-- Acacia Tree (simplified, in background) -->
    <g id="acacia_tree">
      <!-- Trunk -->
      <rect x="600" y="600" width="40" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <!-- Canopy (rounded, flat-topped) -->
      <path d="M550 600 C500 500, 700 500, 750 600 Q650 550, 550 600 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Grass Tufts (simplified, foreground) -->
    <g id="grass_tufts">
      <path d="M100 850 Q120 830, 140 850 Q160 830, 180 850 Q140 840, 100 850 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M250 880 Q270 860, 290 880 Q310 860, 330 880 Q290 870, 250 880 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Butterfly (colorful - indicated by outline for coloring) -->
    <g id="butterfly">
      <!-- Body -->
      <ellipse cx="650" cy="250" rx="8" ry="20" fill="white" stroke="black" stroke-width="3"/>
      <!-- Wings (simple, rounded) -->
      <path d="M650 230 C680 200, 700 220, 690 240 L650 250 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right top wing -->
      <path d="M650 230 C620 200, 600 220, 610 240 L650 250 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left top wing -->
      <path d="M650 270 C680 300, 700 280, 690 260 L650 250 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right bottom wing -->
      <path d="M650 270 C620 300, 600 280, 610 260 L650 250 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left bottom wing -->
      <!-- Antennae -->
      <path d="M650 230 L640 210 M650 230 L660 210" stroke="black" stroke-width="3" fill="none"/>
    </g>

    <!-- Cute Happy Baby Lion Cub -->
    <g id="lion_cub">
      <!-- Body (rounded, playful posture) -->
      <path d="M350 750 C300 650, 450 600, 500 700 C550 800, 350 850, 350 750 Z" fill="white" stroke="black" stroke-width="5"/>

      <!-- Head (main circle) -->
      <circle cx="450" cy="620" r="90" fill="white" stroke="black" stroke-width="5"/>

      <!-- Fluffy Mane (soft, cloud-like shape around head) -->
      <path d="M360 620 C340 570, 380 540, 430 530 C480 520, 520 540, 540 570 C560 620, 520 670, 480 690 C420 700, 380 670, 360 620 Z" fill="white" stroke="black" stroke-width="5"/>

      <!-- Ears (rounded) -->
      <circle cx="400" cy="550" r="30" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="500" cy="550" r="30" fill="white" stroke="black" stroke-width="4"/>
      <!-- Inner ears -->
      <circle cx="400" cy="550" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="500" cy="550" r="15" fill="white" stroke="black" stroke-width="3"/>

      <!-- Eyes (simple circles) -->
      <circle cx="420" cy="600" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="480" cy="600" r="15" fill="white" stroke="black" stroke-width="3"/>

      <!-- Nose (simple triangle) -->
      <path d="M450 635 L440 650 L460 650 Z" fill="white" stroke="black" stroke-width="3"/>

      <!-- Mouth (happy smile) -->
      <path d="M420 660 Q450 675, 480 660" fill="none" stroke="black" stroke-width="3"/>

      <!-- Paws/Legs (rounded, showing joyful movement) -->
      <!-- Front left leg -->
      <rect x="370" y="700" width="50" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Front right leg (reaching up for butterfly) -->
      <path d="M480 690 C500 650, 600 550, 630 580" fill="none" stroke="black" stroke-width="4"/>
      <ellipse cx="630" cy="580" rx="30" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Paw at the end of the arm -->

      <!-- Back legs (simplified) -->
      <rect x="300" y="780" width="60" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <rect x="420" y="790" width="60" height="90" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>

      <!-- Tail (curved with fluffy tip) -->
      <path d="M300 750 Q250 700, 280 650 Q310 600, 350 620" fill="none" stroke="black" stroke-width="4"/>
      <circle cx="350" cy="620" r="15" fill="white" stroke="black" stroke-width="4"/> <!-- Tail tip -->
    </g>

  </g>
</svg>