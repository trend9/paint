<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Licorice Track -->
  <g id="licorice-track" stroke="black" stroke-width="5" fill="none">
    <path d="M 0 880 Q 400 860 800 880" />
    <path d="M 0 920 Q 400 900 800 920" />
  </g>

  <!-- Background Elements -->
  <g id="whimsical-land">
    <!-- Swirly Candy Trees -->
    <g id="candy-trees" stroke="black" stroke-width="4" fill="white">
      <!-- Tree Left Background -->
      <rect x="100" y="450" width="30" height="100" rx="8" ry="8" />
      <circle cx="115" cy="400" r="50" />
      <path d="M 115 400 A 30 30 0 1 0 115 430" fill="none" stroke="black" stroke-width="3" />
      <path d="M 115 400 A 15 15 0 1 1 115 415" fill="none" stroke="black" stroke-width="3" />

      <!-- Tree Right Background -->
      <rect x="650" y="380" width="30" height="100" rx="8" ry="8" />
      <circle cx="665" cy="330" r="50" />
      <path d="M 665 330 A 30 30 0 1 0 665 360" fill="none" stroke="black" stroke-width="3" />
      <path d="M 665 330 A 15 15 0 1 1 665 345" fill="none" stroke="black" stroke-width="3" />
    </g>

    <!-- Giant Cookies -->
    <g id="giant-cookies" stroke="black" stroke-width="4" fill="white">
      <!-- Cookie Left Midground -->
      <circle cx="200" cy="580" r="70" />
      <circle cx="170" cy="560" r="15" stroke-width="3" />
      <circle cx="230" cy="570" r="15" stroke-width="3" />
      <circle cx="210" cy="610" r="15" stroke-width="3" />
      <circle cx="150" cy="600" r="15" stroke-width="3" />

      <!-- Cookie Right Midground -->
      <circle cx="700" cy="680" r="80" />
      <circle cx="670" cy="660" r="15" stroke-width="3" />
      <circle cx="730" cy="670" r="15" stroke-width="3" />
      <circle cx="710" cy="710" r="15" stroke-width="3" />
      <circle cx="650" cy="700" r="15" stroke-width="3" />
    </g>

    <!-- Colorful Cupcakes -->
    <g id="colorful-cupcakes" stroke="black" stroke-width="4" fill="white">
      <!-- Cupcake Left Far Background -->
      <path d="M30 350 L70 350 L80 300 L20 300 Z" />
      <path d="M20 300 Q50 270 80 300 Z" />
      <path d="M35 290 Q50 265 65 290" fill="none" stroke="black" stroke-width="3" />
      <circle cx="50" cy="270" r="10" />

      <!-- Cupcake Right Midground -->
      <path d="M580 500 L640 500 L660 450 L560 450 Z" />
      <path d="M560 450 Q610 400 660 450 Z" />
      <path d="M580 430 Q610 390 640 430" fill="none" stroke="black" stroke-width="3" />
      <path d="M590 420 Q610 380 630 420" fill="none" stroke="black" stroke-width="3" />
      <circle cx="610" cy="390" r="15" />
    </g>

    <!-- Gingerbread Houses -->
    <g id="gingerbread-houses" stroke="black" stroke-width="4" fill="white">
      <!-- House Left Far Background -->
      <rect x="250" y="250" width="100" height="70" rx="10" ry="10" />
      <path d="M250 250 L300 200 L350 250 Z" />
      <rect x="270" y="270" width="25" height="40" rx="5" ry="5" stroke-width="3" />
      <rect x="300" y="270" width="25" height="25" rx="5" ry="5" stroke-width="3" />
      <line x1="300" y1="282.5" x2="325" y2="282.5" stroke="black" stroke-width="3" />
      <line x1="312.5" y1="270" x2="312.5" y2="295" stroke="black" stroke-width="3" />

      <!-- House Right Midground -->
      <rect x="400" y="550" width="150" height="100" rx="15" ry="15" />
      <path d="M400 550 L475 480 L550 550 Z" />
      <rect x="420" y="580" width="40" height="60" rx="10" ry="10" stroke-width="3" />
      <rect x="490" y="580" width="40" height="40" rx="10" ry="10" stroke-width="3" />
      <line x1="490" y1="600" x2="530" y2="600" stroke="black" stroke-width="3" />
      <line x1="510" y1="580" x2="510" y2="620" stroke="black" stroke-width="3" />
    </g>
  </g>

  <!-- Candy Train -->
  <g id="candy-train">
    <!-- Main locomotive body -->
    <rect x="100" y="600" width="450" height="150" rx="40" ry="40" fill="white" stroke="black" stroke-width="5" />
    <!-- Cab -->
    <rect x="400" y="500" width="150" height="100" rx="30" ry="30" fill="white" stroke="black" stroke-width="5" />
    <!-- Cab window -->
    <rect x="420" y="520" width="110" height="60" rx="15" ry="15" fill="white" stroke="black" stroke-width="4" />
    
    <!-- Front Face Area -->
    <circle cx="100" cy="675" r="50" fill="white" stroke="black" stroke-width="5" />

    <!-- Candy wheels -->
    <circle cx="250" cy="750" r="60" fill="white" stroke="black" stroke-width="5" />
    <circle cx="250" cy="750" r="20" fill="white" stroke="black" stroke-width="4" /> <!-- Hub -->
    <circle cx="450" cy="750" r="60" fill="white" stroke="black" stroke-width="5" />
    <circle cx="450" cy="750" r="20" fill="white" stroke="black" stroke-width="4" /> <!-- Hub -->

    <!-- Lollipop smokestack -->
    <rect x="250" y="450" width="30" height="100" fill="white" stroke="black" stroke-width="5" /> <!-- Stick -->
    <circle cx="265" cy="400" r="60" fill="white" stroke="black" stroke-width="5" /> <!-- Lollipop head -->
    <path d="M 265 400 A 40 40 0 1 0 265 440" fill="none" stroke="black" stroke-width="3" />
    <path d="M 265 400 A 20 20 0 1 1 265 420" fill="none" stroke="black" stroke-width="3" />

    <!-- Train Face (on the circle front) -->
    <g id="train-face" stroke="black" stroke-width="3" fill="white">
      <circle cx="85" cy="655" r="10" /> <!-- Left eye -->
      <circle cx="115" cy="655" r="10" /> <!-- Right eye -->
      <path d="M 85 690 Q 100 705 115 690" fill="none" /> <!-- Smile -->
    </g>
  </g>

  <!-- Cotton Candy Steam -->
  <g id="cotton-candy-steam" stroke="black" stroke-width="4" fill="white">
    <!-- Main cloud puff -->
    <path d="M265 380 Q220 340 180 360 Q150 390 190 420 Q230 440 265 420 Q300 440 340 420 Q370 390 340 360 Q300 340 265 380 Z"/>
    <!-- Smaller puff 1 -->
    <path d="M190 370 Q170 340 140 350 Q120 370 150 390 Q180 400 190 370 Z" transform="translate(-30, -20)"/>
    <!-- Smaller puff 2 -->
    <path d="M340 370 Q360 340 390 350 Q410 370 380 390 Q350 400 340 370 Z" transform="translate(30, -20)"/>
  </g>
</svg>