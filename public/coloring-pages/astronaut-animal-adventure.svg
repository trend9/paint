<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style type="text/css"><![CDATA[
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .outline-none {
        stroke: black;
        stroke-width: 4;
        fill: none;
      }
    ]]></style>
  </defs>

  <!-- Group for the main anthropomorphic animal in astronaut suit -->
  <g id="astronaut-animal">
    <!-- Helmet -->
    <circle class="outline" cx="400" cy="350" r="150"/>
    <!-- Visor opening -->
    <rect class="outline" x="300" y="270" width="200" height="130" rx="40" ry="40"/>
    
    <!-- Animal's face inside the visor (e.g., a bear) -->
    <g id="animal-face">
      <!-- Head shape -->
      <circle class="outline" cx="400" cy="350" r="70"/>
      <!-- Ears -->
      <circle class="outline" cx="330" cy="290" r="30"/>
      <circle class="outline" cx="470" cy="290" r="30"/>
      <!-- Inner ears -->
      <circle class="outline" cx="330" cy="290" r="15"/>
      <circle class="outline" cx="470" cy="290" r="15"/>
      
      <!-- Eyes -->
      <circle class="outline" cx="365" cy="350" r="15"/>
      <circle class="outline" cx="435" cy="350" r="15"/>
      <!-- Nose -->
      <ellipse class="outline" cx="400" cy="380" rx="15" ry="10"/>
      <!-- Mouth -->
      <path class="outline-none" d="M370 400 Q400 415 430 400"/>
    </g>

    <!-- Suit Body -->
    <rect class="outline" x="250" y="450" width="300" height="250" rx="60" ry="60"/>
    <!-- Backpack -->
    <rect class="outline" x="280" y="400" width="240" height="100" rx="30" ry="30"/>
    <!-- Suit Details (simple panel) -->
    <line class="outline-none" x1="400" y1="450" x2="400" y2="700" stroke-width="3"/>
    <circle class="outline" cx="400" cy="575" r="20"/>

    <!-- Arms -->
    <rect class="outline" x="180" y="480" width="100" height="150" rx="40" ry="40" transform="rotate(-30 230 555)"/>
    <rect class="outline" x="520" y="480" width="100" height="150" rx="40" ry="40" transform="rotate(30 570 555)"/>
    
    <!-- Gloves -->
    <circle class="outline" cx="190" cy="620" r="45"/>
    <circle class="outline" cx="610" cy="620" r="45"/>

    <!-- Legs -->
    <rect class="outline" x="300" y="680" width="80" height="150" rx="30" ry="30"/>
    <rect class="outline" x="420" y="680" width="80" height="150" rx="30" ry="30"/>
    
    <!-- Boots -->
    <ellipse class="outline" cx="340" cy="850" rx="50" ry="30"/>
    <ellipse class="outline" cx="460" cy="850" rx="50" ry="30"/>
  </g>

  <!-- Group for friendly stars -->
  <g id="stars">
    <circle class="outline" cx="100" cy="150" r="20"/>
    <circle class="outline" cx="700" cy="100" r="25"/>
    <circle class="outline" cx="150" cy="850" r="15"/>
    <circle class="outline" cx="650" cy="880" r="20"/>
    <circle class="outline" cx="50" cy="400" r="18"/>
    <circle class="outline" cx="750" cy="500" r="22"/>
    <circle class="outline" cx="250" cy="20" r="17"/>
    <circle class="outline" cx="550" cy="950" r="19"/>
    <circle class="outline" cx="100" cy="650" r="20"/>
    <circle class="outline" cx="720" cy="700" r="15"/>
  </g>

  <!-- Group for simple planets -->
  <g id="planets">
    <!-- Planet 1 (simple circle) -->
    <circle class="outline" cx="120" cy="280" r="70"/>
    <!-- Planet 2 (with ring) -->
    <circle class="outline" cx="680" cy="200" r="90"/>
    <ellipse class="outline-none" cx="680" cy="200" rx="130" ry="30" transform="rotate(-15 680 200)"/>
    <!-- Planet 3 (simple circle) -->
    <circle class="outline" cx="180" cy="750" r="80"/>
    <!-- Planet 4 (simple circle) -->
    <circle class="outline" cx="600" cy="780" r="60"/>
  </g>
</svg>