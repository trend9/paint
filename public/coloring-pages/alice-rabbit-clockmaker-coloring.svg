<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style>
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-nofill {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-bold {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Rabbit Character -->
  <g id="rabbit">
    <!-- Body -->
    <path d="M400,450 Q300,350 350,250 C370,200 430,200 450,250 Q500,350 400,450 Z" class="outline-bold"/>
    <!-- Head -->
    <circle cx="400" cy="220" r="100" class="outline-bold"/>
    <!-- Ears -->
    <path d="M340,120 Q320,50 360,30 Q400,50 380,120 Z" class="outline-bold"/>
    <path d="M460,120 Q480,50 440,30 Q400,50 420,120 Z" class="outline-bold"/>
    <!-- Inner ears -->
    <path d="M350,110 Q335,65 365,55 Q390,70 370,110 Z" class="outline"/>
    <path d="M450,110 Q465,65 435,55 Q410,70 430,110 Z" class="outline"/>
    <!-- Face features -->
    <circle cx="360" cy="200" r="15" class="outline"/> <!-- Left Eye White -->
    <circle cx="440" cy="200" r="15" class="outline"/> <!-- Right Eye White -->
    <circle cx="365" cy="205" r="5" class="outline-nofill" stroke-width="3"/> <!-- Left Pupil (smaller stroke for detail) -->
    <circle cx="435" cy="205" r="5" class="outline-nofill" stroke-width="3"/> <!-- Right Pupil (smaller stroke for detail) -->
    <path d="M400,230 L390,250 L410,250 L400,230 Z" class="outline" stroke-width="3" /> <!-- Nose -->
    <path d="M380,260 Q400,280 420,260" class="outline-nofill" stroke-width="3"/> <!-- Mouth -->

    <!-- Waistcoat -->
    <path d="M380,260 Q340,300 340,350 C340,400 380,430 400,430 C420,430 460,400 460,350 C460,300 420,260 400,260 Z" class="outline" fill="white" stroke-width="3"/>
    <circle cx="390" cy="320" r="8" class="outline" stroke-width="2"/>
    <circle cx="410" cy="320" r="8" class="outline" stroke-width="2"/>
    <circle cx="390" cy="360" r="8" class="outline" stroke-width="2"/>
    <circle cx="410" cy="360" r="8" class="outline" stroke-width="2"/>

    <!-- Arms -->
    <path d="M350,300 Q280,350 300,450 C320,470 340,460 350,440 Z" class="outline"/> <!-- Left Arm -->
    <path d="M450,300 Q520,350 500,450 C480,470 460,460 450,440 Z" class="outline"/> <!-- Right Arm -->
    <!-- Hands -->
    <circle cx="300" cy="450" r="30" class="outline"/> <!-- Left Hand holding magnifying glass -->
    <circle cx="500" cy="450" r="30" class="outline"/> <!-- Right Hand holding pocket watch -->

    <!-- Legs/Feet (simplified to be behind props) -->
    <path d="M360,450 Q350,550 380,570 C400,580 420,550 410,450 Z" class="outline"/>
    <path d="M440,450 Q450,550 420,570 C400,580 380,550 390,450 Z" class="outline"/>
  </g>

  <!-- Magnifying Glass -->
  <g id="magnifying-glass">
    <circle cx="280" cy="420" r="40" class="outline"/> <!-- Lens Frame -->
    <circle cx="280" cy="420" r="35" class="outline" stroke-width="2"/> <!-- Lens (inner circle, slightly thinner stroke) -->
    <path d="M310,450 Q330,480 300,520 Q270,550 250,520 Q230,490 260,460 Z" class="outline"/> <!-- Handle -->
  </g>

  <!-- Pocket Watch -->
  <g id="pocket-watch">
    <circle cx="520" cy="420" r="40" class="outline"/> <!-- Watch body -->
    <circle cx="520" cy="420" r="30" class="outline" stroke-width="2"/> <!-- Watch face -->
    <path d="M520,390 L520,420" class="outline-nofill" stroke-width="2"/> <!-- Hour Hand -->
    <path d="M520,420 L540,420" class="outline-nofill" stroke-width="2"/> <!-- Minute Hand -->
    <circle cx="520" cy="420" r="3" class="outline" stroke-width="2"/> <!-- Hand pivot -->
    <path d="M520,380 Q510,360 530,360 Q540,380 520,380 Z" class="outline" stroke-width="3"/> <!-- Crown -->
    <path d="M520,360 Q550,330 500,300 Q450,270 480,240" class="outline-nofill"/> <!-- Chain -->
  </g>

  <!-- Clocks (simplified, various shapes) -->
  <g id="clocks">
    <!-- Tall Grandfather-like clock on left -->
    <rect x="100" y="600" width="100" height="300" rx="20" ry="20" class="outline-bold"/>
    <rect x="110" y="610" width="80" height="80" rx="15" ry="15" class="outline"/> <!-- Clock face frame -->
    <circle cx="150" cy="650" r="30" class="outline" stroke-width="2"/> <!-- Clock face -->
    <path d="M150,630 L150,650" class="outline-nofill" stroke-width="2"/>
    <path d="M150,650 L165,650" class="outline-nofill" stroke-width="2"/>
    <rect x="130" y="700" width="40" height="150" rx="10" ry="10" class="outline"/> <!-- Pendulum body -->
    <circle cx="150" cy="860" r="20" class="outline"/> <!-- Pendulum bob -->

    <!-- Round clock on right -->
    <circle cx="700" cy="650" r="80" class="outline-bold"/>
    <circle cx="700" cy="650" r="60" class="outline"/>
    <path d="M700,610 L700,650" class="outline-nofill" stroke-width="2"/>
    <path d="M700,650 L730,650" class="outline-nofill" stroke-width="2"/>

    <!-- Small square clock near rabbit's feet -->
    <rect x="250" y="700" width="80" height="80" rx="10" ry="10" class="outline"/>
    <circle cx="290" cy="740" r="30" class="outline" stroke-width="2"/>
    <path d="M290,725 L290,740" class="outline-nofill" stroke-width="2"/>
    <path d="M290,740 L305,740" class="outline-nofill" stroke-width="2"/>

    <!-- Oval clock hanging on the right -->
    <ellipse cx="600" cy="150" rx="70" ry="50" class="outline-bold"/>
    <ellipse cx="600" cy="150" rx="50" ry="30" class="outline"/>
    <path d="M600,130 L600,150" class="outline-nofill" stroke-width="2"/>
    <path d="M600,150 L620,150" class="outline-nofill" stroke-width="2"/>
  </g>

  <!-- Cogs (various sizes) -->
  <g id="cogs">
    <!-- Large cog behind rabbit -->
    <circle cx="400" cy="750" r="70" class="outline-bold"/>
    <path d="M400,680 L400,670" class="outline-nofill"/>
    <path d="M420,685 L430,675" class="outline-nofill"/>
    <path d="M449,700 L459,690" class="outline-nofill"/>
    <path d="M465,725 L475,715" class="outline-nofill"/>
    <path d="M470,750 L480,750" class="outline-nofill"/>
    <path d="M465,775 L475,785" class="outline-nofill"/>
    <path d="M449,800 L459,810" class="outline-nofill"/>
    <path d="M420,815 L430,825" class="outline-nofill"/>
    <path d="M400,820 L400,830" class="outline-nofill"/>
    <path d="M380,815 L370,825" class="outline-nofill"/>
    <path d="M351,800 L341,810" class="outline-nofill"/>
    <path d="M335,775 L325,785" class="outline-nofill"/>
    <path d="M330,750 L320,750" class="outline-nofill"/>
    <path d="M335,725 L325,715" class="outline-nofill"/>
    <path d="M351,700 L341,690" class="outline-nofill"/>
    <path d="M380,685 L370,675" class="outline-nofill"/>
    <circle cx="400" cy="750" r="20" class="outline"/> <!-- Inner cog circle -->

    <!-- Smaller cog on left -->
    <circle cx="200" cy="550" r="40" class="outline"/>
    <path d="M200,510 L200,505" class="outline-nofill"/>
    <path d="M219,515 L224,510" class="outline-nofill"/>
    <path d="M234,530 L239,525" class="outline-nofill"/>
    <path d="M240,550 L245,550" class="outline-nofill"/>
    <path d="M234,570 L239,575" class="outline-nofill"/>
    <path d="M219,585 L224,590" class="outline-nofill"/>
    <path d="M200,590 L200,595" class="outline-nofill"/>
    <path d="M181,585 L176,590" class="outline-nofill"/>
    <path d="M166,570 L161,575" class="outline-nofill"/>
    <path d="M160,550 L155,550" class="outline-nofill"/>
    <path d="M166,530 L161,525" class="outline-nofill"/>
    <path d="M181,515 L176,510" class="outline-nofill"/>
    <circle cx="200" cy="550" r="10" class="outline"/>

    <!-- Smaller cog on right -->
    <circle cx="650" cy="500" r="40" class="outline"/>
    <path d="M650,460 L650,455" class="outline-nofill"/>
    <path d="M669,465 L674,460" class="outline-nofill"/>
    <path d="M684,480 L689,475" class="outline-nofill"/>
    <path d="M690,500 L695,500" class="outline-nofill"/>
    <path d="M684,520 L689,525" class="outline-nofill"/>
    <path d="M669,535 L674,540" class="outline-nofill"/>
    <path d="M650,540 L650,545" class="outline-nofill"/>
    <path d="M631,535 L626,540" class="outline-nofill"/>
    <path d="M616,520 L611,525" class="outline-nofill"/>
    <path d="M610,500 L605,500" class="outline-nofill"/>
    <path d="M616,480 L611,475" class="outline-nofill"/>
    <path d="M631,465 L626,460" class="outline-nofill"/>
    <circle cx="650" cy="500" r="10" class="outline"/>
  </g>

  <!-- Tiny clockmaking tools -->
  <g id="tools">
    <!-- Hammer -->
    <path d="M70,850 Q60,830 80,820 L120,820 Q140,830 130,850 Z" class="outline"/> <!-- Hammer head -->
    <rect x="90" y="850" width="20" height="80" rx="5" ry="5" class="outline"/> <!-- Handle -->
    <!-- Screwdriver -->
    <rect x="550" y="880" width="20" height="80" rx="10" ry="10" class="outline"/> <!-- Handle -->
    <path d="M560,880 L560,860 L565,850 L555,850 L560,860 Z" class="outline" fill="white" stroke-width="3"/> <!-- Tip -->
    <!-- Wrench -->
    <path d="M700,890 Q690,870 710,870 L730,890 Q740,910 720,910 L700,890 M730,890 L760,920 L750,930 L720,900 Z" class="outline"/>
    <!-- Spring (simplified) -->
    <path d="M50,150 Q70,130 90,150 Q110,170 130,150 Q150,130 170,150" class="outline-nofill" stroke-width="3"/>
    <!-- Small Gear on the floor -->
    <circle cx="380" cy="920" r="25" class="outline"/>
    <path d="M380,895 L380,890" class="outline-nofill"/>
    <path d="M392,900 L397,895" class="outline-nofill"/>
    <path d="M400,920 L405,920" class="outline-nofill"/>
    <path d="M392,940 L397,945" class="outline-nofill"/>
    <path d="M380,945 L380,950" class="outline-nofill"/>
    <path d="M368,940 L363,945" class="outline-nofill"/>
    <path d="M360,920 L355,920" class="outline-nofill"/>
    <path d="M368,900 L363,895" class="outline-nofill"/>
    <circle cx="380" cy="920" r="10" class="outline"/>
  </g>
</svg>