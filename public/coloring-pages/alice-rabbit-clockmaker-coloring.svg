<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Define styles for consistent thick black outlines and white/no fills -->
  <defs>
    <style type="text/css">
      .outline { stroke: black; stroke-width: 4; fill: white; }
      .outline-no-fill { stroke: black; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <!-- Main scene group for the clock repair shop -->
  <g id="clock-repair-shop">

    <!-- Workbench where the rabbit is working -->
    <rect x="100" y="700" width="600" height="150" rx="30" ry="30" class="outline"/>
    <rect x="150" y="680" width="500" height="40" rx="20" ry="20" class="outline"/> <!-- Tabletop surface -->

    <!-- Cute Anthropomorphic Rabbit Character -->
    <g id="rabbit" transform="translate(400, 600)"> <!-- Positioned above the workbench -->
      <!-- Body -->
      <path d="M -100 0 C -120 100 -100 200 0 200 C 100 200 120 100 100 0 C 80 -100 0 -120 -100 0 Z" class="outline"/>

      <!-- Head -->
      <circle cx="0" cy="-100" r="80" class="outline"/>

      <!-- Ears -->
      <path d="M -40 -160 Q -60 -250 -20 -270 Q 20 -250 40 -160 Z" class="outline"/>
      <path d="M 40 -160 Q 60 -250 20 -270 Q -20 -250 -40 -160 Z" class="outline"/>

      <!-- Face Details: Eyes, Nose, Mouth (Friendly, Focused Expression) -->
      <circle cx="-30" cy="-120" r="10" class="outline"/> <!-- Left Eye -->
      <circle cx="30" cy="-120" r="10" class="outline"/> <!-- Right Eye -->
      <path d="M 0 -90 L -10 -80 L 10 -80 Z" class="outline"/> <!-- Nose -->
      <path d="M -20 -70 Q 0 -60 20 -70" class="outline-no-fill"/> <!-- Mouth -->

      <!-- Spectacles -->
      <circle cx="-30" cy="-120" r="25" class="outline-no-fill"/> <!-- Left lens -->
      <circle cx="30" cy="-120" r="25" class="outline-no-fill"/> <!-- Right lens -->
      <line x1="-5" y1="-120" x2="5" y2="-120" class="outline-no-fill"/> <!-- Bridge -->

      <!-- Waistcoat -->
      <path d="M -70 0 L -70 100 A 70 70 0 0 0 0 150 A 70 70 0 0 0 70 100 L 70 0 Z" class="outline"/>
      <line x1="0" y1="0" x2="0" y2="150" class="outline-no-fill"/> <!-- Waistcoat opening -->
      <circle cx="0" cy="50" r="5" class="outline"/> <!-- Waistcoat button -->

      <!-- Arms and Hands (holding simple gears) -->
      <g id="rabbit-arms">
        <!-- Left Arm -->
        <path d="M -80 50 Q -120 0 -150 20 L -150 70 Q -120 100 -80 50 Z" class="outline"/>
        <!-- Gear in Left Hand -->
        <g transform="translate(-130, 70) rotate(15)">
          <circle cx="0" cy="0" r="15" class="outline"/>
          <circle cx="0" cy="0" r="5" class="outline"/>
          <rect x="-15" y="-3" width="30" height="6" rx="2" ry="2" class="outline"/>
          <rect x="-3" y="-15" width="6" height="30" rx="2" ry="2" class="outline"/>
        </g>
        <!-- Right Arm -->
        <path d="M 80 50 Q 120 0 150 20 L 150 70 Q 120 100 80 50 Z" class="outline"/>
        <!-- Gear in Right Hand -->
        <g transform="translate(130, 70) rotate(-15)">
          <circle cx="0" cy="0" r="15" class="outline"/>
          <circle cx="0" cy="0" r="5" class="outline"/>
          <rect x="-15" y="-3" width="30" height="6" rx="2" ry="2" class="outline"/>
          <rect x="-3" y="-15" width="6" height="30" rx="2" ry="2" class="outline"/>
        </g>
      </g>

      <!-- Feet (partially hidden by the workbench) -->
      <ellipse cx="-40" cy="180" rx="30" ry="20" class="outline"/>
      <ellipse cx="40" cy="180" rx="30" ry="20" class="outline"/>
    </g>

    <!-- Prominent Large Pocket Watch on the workbench -->
    <g id="large-pocket-watch" transform="translate(250, 780)">
      <circle cx="0" cy="0" r="80" class="outline"/> <!-- Outer casing -->
      <circle cx="0" cy="0" r="70" class="outline"/> <!-- Watch face -->
      <circle cx="0" cy="0" r="10" class="outline"/> <!-- Center pivot -->
      <line x1="0" y1="0" x2="0" y2="-50" class="outline-no-fill"/> <!-- Minute hand -->
      <line x1="0" y1="0" x2="40" y2="0" class="outline-no-fill"/> <!-- Hour hand -->
      <circle cx="0" cy="-90" r="15" class="outline"/> <!-- Winder -->
      <path d="M 0 -90 A 20 20 0 1 0 0 -110 L 0 -90 Z" class="outline"/> <!-- Chain loop -->
    </g>

    <!-- Various Clocks, Gears, and Springs for the whimsical shop environment -->

    <!-- Wall clock (left side) -->
    <g id="wall-clock-left" transform="translate(150, 200)">
      <rect x="-70" y="-70" width="140" height="140" rx="20" ry="20" class="outline"/> <!-- Clock frame -->
      <circle cx="0" cy="0" r="50" class="outline"/> <!-- Clock face -->
      <circle cx="0" cy="0" r="5" class="outline"/> <!-- Center pivot -->
      <line x1="0" y1="0" x2="0" y2="-40" class="outline-no-fill"/> <!-- Hand 1 -->
      <line x1="0" y1="0" x2="30" y2="30" class="outline-no-fill"/> <!-- Hand 2 -->
    </g>

    <!-- Grandfather clock silhouette (left background) -->
    <g id="grandfather-clock" transform="translate(100, 450)">
      <rect x="-50" y="-200" width="100" height="400" rx="10" ry="10" class="outline"/> <!-- Body -->
      <path d="M -50 -200 L 0 -250 L 50 -200" class="outline"/> <!-- Top hat -->
      <rect x="-30" y="-150" width="60" height="80" rx="10" ry="10" class="outline"/> <!-- Face window -->
      <circle cx="0" cy="-110" r="25" class="outline"/> <!-- Clock face -->
      <circle cx="0" cy="-110" r="5" class="outline"/> <!-- Center pivot -->
      <line x1="0" y1="-110" x2="0" y2="-90" class="outline-no-fill"/> <!-- Hand 1 -->
      <line x1="0" y1="-110" x2="20" y2="-110" class="outline-no-fill"/> <!-- Hand 2 -->
      <rect x="-20" y="100" width="40" height="100" class="outline"/> <!-- Pendulum case -->
      <circle cx="0" cy="150" r="15" class="outline"/> <!-- Pendulum bob -->
    </g>

    <!-- Cuckoo clock (right side) -->
    <g id="cuckoo-clock" transform="translate(650, 250)">
      <rect x="-80" y="-100" width="160" height="160" rx="10" ry="10" class="outline"/> <!-- House body -->
      <path d="M -80 -100 L 0 -180 L 80 -100 Z" class="outline"/> <!-- Roof -->
      <rect x="-40" y="-60" width="80" height="80" rx="5" ry="5" class="outline"/> <!-- Clock face area -->
      <circle cx="0" cy="-20" r="30" class="outline"/> <!-- Clock face -->
      <circle cx="0" cy="-20" r="5" class="outline"/> <!-- Center pivot -->
      <line x1="0" y1="-20" x2="0" y2="-40" class="outline-no-fill"/> <!-- Hand 1 -->
      <line x1="0" y1="-20" x2="20" y2="-10" class="outline-no-fill"/> <!-- Hand 2 -->
      <rect x="-20" y="-90" width="40" height="30" class="outline"/> <!-- Cuckoo door -->
      <circle cx="-30" cy="120" r="15" class="outline"/> <!-- Left weight -->
      <line x1="-30" y1="60" x2="-30" y2="105" class="outline-no-fill"/>
      <circle cx="30" cy="120" r="15" class="outline"/> <!-- Right weight -->
      <line x1="30" y1="60" x2="30" y2="105" class="outline-no-fill"/>
    </g>

    <!-- Various Gears and Springs (scattered) -->
    <g id="mechanical-parts">
      <!-- Large gear on table left -->
      <g transform="translate(180, 780)">
        <circle cx="0" cy="0" r="40" class="outline"/>
        <circle cx="0" cy="0" r="15" class="outline"/>
        <rect x="-40" y="-10" width="80" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-10" y="-40" width="20" height="80" rx="5" ry="5" class="outline"/>
        <rect x="-30" y="-30" width="60" height="60" rx="5" ry="5" transform="rotate(45 0 0)" class="outline"/>
      </g>

      <!-- Small gear on table right -->
      <g transform="translate(600, 750)">
        <circle cx="0" cy="0" r="30" class="outline"/>
        <circle cx="0" cy="0" r="10" class="outline"/>
        <rect x="-30" y="-5" width="60" height="10" rx="2" ry="2" class="outline"/>
        <rect x="-5" y="-30" width="10" height="60" rx="2" ry="2" class="outline"/>
      </g>

      <!-- Spring on table -->
      <path d="M 450 780 Q 460 760 470 780 Q 480 800 490 780 Q 500 760 510 780" class="outline-no-fill"/>

      <!-- Top left large gear -->
      <g transform="translate(100, 50)">
        <circle cx="0" cy="0" r="60" class="outline"/>
        <circle cx="0" cy="0" r="20" class="outline"/>
        <rect x="-60" y="-15" width="120" height="30" rx="5" ry="5" class="outline"/>
        <rect x="-15" y="-60" width="30" height="120" rx="5" ry="5" class="outline"/>
      </g>

      <!-- Top right small gear -->
      <g transform="translate(700, 100)">
        <circle cx="0" cy="0" r="35" class="outline"/>
        <circle cx="0" cy="0" r="10" class="outline"/>
        <rect x="-35" y="-7" width="70" height="14" rx="3" ry="3" class="outline"/>
        <rect x="-7" y="-35" width="14" height="70" rx="3" ry="3" class="outline"/>
      </g>

      <!-- Middle left small spring -->
      <path d="M 120 350 Q 130 330 140 350 Q 150 370 160 350" class="outline-no-fill"/>

      <!-- Middle right gear -->
      <g transform="translate(680, 480)">
        <circle cx="0" cy="0" r="40" class="outline"/>
        <circle cx="0" cy="0" r="15" class="outline"/>
        <rect x="-40" y="-10" width="80" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-10" y="-40" width="20" height="80" rx="5" ry="5" class="outline"/>
      </g>

      <!-- Bottom right spring -->
      <path d="M 600 900 Q 610 880 620 900 Q 630 920 640 900 Q 650 880 660 900" class="outline-no-fill"/>

      <!-- Other small gear above rabbit -->
      <g transform="translate(400, 400)">
        <circle cx="0" cy="0" r="25" class="outline"/>
        <circle cx="0" cy="0" r="8" class="outline"/>
        <rect x="-25" y="-5" width="50" height="10" rx="2" ry="2" class="outline"/>
        <rect x="-5" y="-25" width="10" height="50" rx="2" ry="2" class="outline"/>
      </g>
    </g>

  </g>
</svg>