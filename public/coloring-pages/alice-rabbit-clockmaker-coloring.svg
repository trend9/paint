<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background/Card Border -->
  <rect x="15" y="15" width="770" height="970" fill="white" stroke="black" stroke-width="10" rx="20" />

  <!-- Master Group for Coloring Book Style -->
  <g stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    
    <!-- BACKGROUND WHIMSICAL ELEMENTS -->
    <!-- Hanging Star (Top Left) -->
    <line x1="280" y1="15" x2="280" y2="120" stroke-width="4" fill="none" />
    <path d="M 280,110 L 283,117 L 290,117 L 285,121 L 287,128 L 280,124 L 273,128 L 275,121 L 270,117 L 277,117 Z" />

    <!-- Hanging Gear (Top Right) -->
    <line x1="520" y1="15" x2="520" y2="100" stroke-width="4" fill="none" />
    <path d="M 510,95 C 515,90 525,90 530,95 C 535,90 545,95 545,100 C 550,100 555,110 550,115 C 555,120 550,130 545,130 C 545,135 535,140 530,135 C 525,140 515,140 510,135 C 505,140 495,135 495,130 C 490,130 485,120 490,115 C 485,110 490,100 495,100 C 495,95 505,90 510,95 Z" />
    <circle cx="520" cy="115" r="8" />

    <!-- Left Shelf & Items -->
    <rect x="60" y="440" width="160" height="15" rx="5" />
    <!-- Hourglass -->
    <path d="M 90,370 L 120,370 Q 105,395 120,420 L 90,420 Q 105,395 90,370 Z" />
    <line x1="95" y1="395" x2="115" y2="395" stroke-width="3" />
    <!-- Winding Key -->
    <path d="M 150,420 L 180,420 M 180,420 C 180,410 195,410 195,420 C 195,430 180,430 180,420" fill="none" />
    <line x1="160" y1="420" x2="160" y2="428" />
    <line x1="167" y1="420" x2="167" y2="428" />

    <!-- Right Shelf & Dome Clock -->
    <rect x="580" y="460" width="160" height="15" rx="5" />
    <rect x="620" y="445" width="80" height="15" rx="3" />
    <path d="M 630,445 L 630,400 A 30,30 0 0,1 690,400 L 690,445 Z" />
    <circle cx="660" cy="415" r="15" />

    <!-- WORKBENCH & ROOM STRUCTURE -->
    <!-- Table Surface -->
    <rect x="100" y="740" width="600" height="30" rx="10" />
    <!-- Table Legs -->
    <rect x="150" y="770" width="45" height="180" rx="8" />
    <rect x="605" y="770" width="45" height="180" rx="8" />
    <line x1="195" y1="870" x2="605" y2="870" />
    <!-- Floor Line -->
    <line x1="50" y1="950" x2="750" y2="950" stroke-width="6" />
    <!-- Cozy Rug Under Table -->
    <path d="M 180,950 A 220,70 0 0,0 620,950" fill="none" stroke-dasharray="15,12" />


    <!-- WALL CLOCKS -->
    <!-- Giant Gear Wall Clock (Left) -->
    <path d="M 170,180 C 180,170 195,170 205,180 C 215,170 230,175 235,185 C 245,185 250,200 245,210 C 255,215 255,230 245,240 C 250,250 245,265 235,265 C 230,275 215,280 205,270 C 195,280 180,275 170,270 C 160,275 145,265 145,255 C 135,250 135,235 145,225 C 135,215 140,200 150,195 C 150,185 160,180 170,180 Z" />
    <circle cx="195" cy="225" r="45" />
    <!-- Clock Ticks -->
    <line x1="195" y1="185" x2="195" y2="192" stroke-width="3" />
    <line x1="195" y1="265" x2="195" y2="258" stroke-width="3" />
    <line x1="155" y1="225" x2="162" y2="225" stroke-width="3" />
    <line x1="235" y1="225" x2="228" y2="225" stroke-width="3" />
    <!-- Hands -->
    <path d="M 195,225 L 195,205" stroke-width="4" />
    <path d="M 195,225 L 215,225" stroke-width="4" />
    <circle cx="195" cy="225" r="5" fill="black" />

    <!-- Whimsical Sun Wall Clock (Right) -->
    <path d="M 630,170 Q 650,160 660,180 Q 680,175 680,195 Q 700,200 695,220 Q 710,235 700,255 Q 700,275 685,280 Q 675,300 655,295 Q 635,310 620,295 Q 600,300 595,280 Q 580,275 585,255 Q 570,240 580,220 Q 575,200 595,195 Q 600,175 620,180 Z" />
    <circle cx="640" cy="240" r="55" />
    <!-- Simplified Roman Ticks -->
    <!-- XII -->
    <line x1="637" y1="192" x2="637" y2="200" stroke-width="3" />
    <line x1="643" y1="192" x2="643" y2="200" stroke-width="3" />
    <!-- III -->
    <line x1="680" y1="237" x2="688" y2="237" stroke-width="3" />
    <line x1="680" y1="240" x2="688" y2="240" stroke-width="3" />
    <line x1="680" y1="243" x2="688" y2="243" stroke-width="3" />
    <!-- VI -->
    <path d="M 634,278 L 637,284 L 640,278" fill="none" stroke-width="3" />
    <line x1="644" y1="278" x2="644" y2="284" stroke-width="3" />
    <!-- IX -->
    <line x1="592" y1="237" x2="592" y2="243" stroke-width="3" />
    <path d="M 596,237 L 602,243 M 602,237 L 596,243" fill="none" stroke-width="3" />
    <!-- Hands -->
    <path d="M 640,240 L 620,220" stroke-width="4" />
    <path d="M 640,240 L 665,240" stroke-width="4" />
    <circle cx="640" cy="240" r="6" fill="black" />

    <!-- Heart Clock (Hanging Center) -->
    <line x1="400" y1="15" x2="400" y2="45" stroke-width="3" fill="none" />
    <path d="M 400,55 C 392,40 375,40 375,55 C 375,70 400,85 400,85 C 400,85 425,70 425,55 C 425,40 408,40 400,55 Z" />
    <circle cx="400" cy="62" r="10" />


    <!-- MAIN CHARACTER: THE HAPPY RABBIT -->
    <!-- Ears -->
    <path d="M 330,380 C 290,200 360,160 370,365" />
    <path d="M 470,380 C 510,200 440,160 430,365" />
    <path d="M 340,370 C 310,220 350,190 360,360" /> <!-- Inner Ear L -->
    <path d="M 460,370 C 490,220 450,190 440,360" /> <!-- Inner Ear R -->

    <!-- Head -->
    <circle cx="400" cy="460" r="100" />

    <!-- Spectacles (Glasses) -->
    <circle cx="360" cy="460" r="32" />
    <circle cx="440" cy="460" r="32" />
    <path d="M 392,460 Q 400,453 408,460" fill="none" />
    <path d="M 328,460 L 315,465" />
    <path d="M 472,460 L 485,465" />

    <!-- Eyes (Big Cute Pupils) -->
    <circle cx="360" cy="460" r="14" fill="black" />
    <circle cx="355" cy="455" r="5" fill="white" />
    <circle cx="440" cy="460" r="14" fill="black" />
    <circle cx="435" cy="455" r="5" fill="white" />

    <!-- Cute Face Details -->
    <ellipse cx="400" cy="482" rx="10" ry="6" /> <!-- Nose -->
    <path d="M 388,495 Q 400,507 400,495 Q 400,507 412,495" fill="none" /> <!-- Mouth -->
    <ellipse cx="315" cy="495" rx="18" ry="12" /> <!-- Left Cheek -->
    <ellipse cx="485" cy="495" rx="18" ry="12" /> <!-- Right Cheek -->

    <!-- Bowtie -->
    <path d="M 391,542 L 365,525 L 365,559 Z" />
    <path d="M 409,542 L 435,525 L 435,559 Z" />
    <rect x="391" y="535" width="18" height="14" rx="4" />

    <!-- Fancy Vest -->
    <path d="M 330,560 C 290,630 310,740 400,740 C 490,740 510,630 470,560 Z" />
    <path d="M 360,560 L 400,625 L 440,560" fill="none" /> <!-- Vest Lapel -->
    <!-- Buttons -->
    <circle cx="400" cy="650" r="7" />
    <circle cx="400" cy="685" r="7" />
    <circle cx="400" cy="720" r="7" />
    <!-- Vest Pockets -->
    <rect x="335" y="650" width="30" height="20" rx="3" />
    <rect x="435" y="650" width="30" height="20" rx="3" />
    <!-- Pocket Watch Chain -->
    <path d="M 450,660 Q 425,690 400,685" fill="none" />

    <!-- Arms -->
    <path d="M 320,580 Q 270,610 280,650 Q 290,680 320,650" /> <!-- Left Arm -->
    <path d="M 480,580 Q 530,610 520,650 Q 510,680 480,650" /> <!-- Right Arm -->

    <!-- Handheld Tool: Screwdriver -->
    <rect x="525" y="620" width="12" height="30" rx="4" transform="rotate(20 525 620)" />
    <rect x="529" y="650" width="4" height="25" transform="rotate(20 529 650)" />

    <!-- Handheld Tool: Pocket Watch -->
    <circle cx="270" cy="660" r="22" />
    <circle cx="270" cy="635" r="6" />
    <line x1="270" y1="660" x2="270" y2="648" stroke-width="3" />
    <line x1="270" y1="660" x2="280" y2="665" stroke-width="3" />


    <!-- WORKBENCH PLACED OBJECTS -->
    <!-- Magnifying Glass -->
    <rect x="280" y="725" width="40" height="12" rx="4" transform="rotate(30 280 725)" />
    <circle cx="330" cy="740" r="20" />
    <path d="M 318,730 A 15,15 0 0,1 338,750" fill="none" stroke-width="3" />

    <!-- Table Alarm Clock -->
    <circle cx="610" cy="700" r="40" />
    <!-- Bells -->
    <path d="M 572,668 C 572,653 592,653 592,668 Z" />
    <path d="M 628,668 C 628,653 648,653 648,668 Z" />
    <!-- Hammer -->
    <line x1="610" y1="668" x2="610" y2="658" stroke-width="4" />
    <circle cx="610" cy="655" r="4" />
    <!-- Feet -->
    <line x1="585" y1="738" x2="575" y2="750" stroke-width="5" />
    <line x1="635" y1="738" x2="645" y2="750" stroke-width="5" />
    <!-- Hands -->
    <line x1="610" y1="700" x2="610" y2="680" stroke-width="3" />
    <line x1="610" y1="700" x2="625" y2="710" stroke-width="3" />

    <!-- Tiny Table Gear -->
    <path d="M 480,725 C 485,720 495,720 500,725 C 505,720 515,725 515,730 C 520,730 525,740 520,745 L 480,745 Z" />
    <circle cx="500" cy="738" r="5" />


    <!-- FLOOR DETAILS & MOUSE FRIEND -->
    <!-- Tiny Mouse Helper -->
    <ellipse cx="120" cy="930" rx="25" ry="18" />
    <ellipse cx="145" cy="920" rx="15" ry="12" />
    <circle cx="138" cy="905" r="10" /> <!-- Ear L -->
    <circle cx="148" cy="905" r="8" />  <!-- Ear R -->
    <path d="M 95,935 Q 75,930 85,915" fill="none" /> <!-- Tail -->
    <circle cx="160" cy="920" r="3" fill="black" /> <!-- Nose -->
    <circle cx="148" cy="916" r="2" fill="black" /> <!-- Eye -->
    <ellipse cx="115" cy="946" rx="6" ry="4" /> <!-- Foot L -->
    <ellipse cx="130" cy="946" rx="6" ry="4" /> <!-- Foot R -->

    <!-- Floor Gear -->
    <path d="M 210,915 C 215,910 225,910 230,915 C 235,910 245,915 245,920 C 250,920 255,930 250,935 C 255,940 250,950 245,950 C 245,955 235,960 230,955 C 225,960 215,960 210,955 C 205,960 195,955 195,950 C 190,950 185,940 190,935 C 185,930 190,920 195,920 C 195,915 205,910 210,915 Z" />
    <circle cx="220" cy="935" r="8" />


    <!-- WHIMSICAL MAGIC SPARKLES -->
    <!-- Sparkle 1 (Left) -->
    <path d="M 280,240 Q 285,235 290,240 Q 285,245 280,240 Z" />
    <circle cx="260" cy="255" r="5" />
    <!-- Sparkle 2 (Right) -->
    <path d="M 520,340 Q 525,335 530,340 Q 525,345 520,340 Z" />
    <circle cx="545" cy="355" r="6" />
    <!-- Sparkle 3 (Center) -->
    <path d="M 400,320 Q 405,315 410,320 Q 405,325 400,320 Z" />

  </g>
</svg>