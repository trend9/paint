<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shelves -->
  <g id="background_shelves" stroke="black" stroke-width="4">
    <!-- Top Shelf -->
    <rect x="50" y="200" width="700" height="20" rx="10" ry="10" fill="white"/>
    <!-- Middle Shelf -->
    <rect x="50" y="400" width="700" height="20" rx="10" ry="10" fill="white"/>

    <!-- Items on Top Shelf -->
    <g id="top_shelf_items">
      <!-- Ornate Clock 1 (left) -->
      <circle cx="150" cy="150" r="40" fill="white"/>
      <line x1="150" y1="150" x2="165" y2="135" fill="none"/>
      <line x1="150" y1="150" x2="150" y2="110" fill="none"/>
      <path d="M120 110 L180 110 L150 70 Z" fill="white"/> <!-- Simple finial -->

      <!-- Whimsical Clock 2 (middle) -->
      <ellipse cx="400" cy="160" rx="45" ry="55" fill="white"/>
      <circle cx="400" cy="160" r="5" fill="black" stroke-width="0"/> <!-- Center dot -->
      <line x1="400" y1="160" x2="425" y2="170" fill="none"/>
      <line x1="400" y1="160" x2="380" y2="130" fill="none"/>
      <path d="M370 210 Q400 230 430 210" fill="white"/> <!-- Bottom decoration -->

      <!-- Small Gear -->
      <circle cx="650" cy="160" r="30" fill="white"/>
      <path d="M635 135 L640 125 L645 135 Z" fill="white"/>
      <path d="M665 135 L670 125 L675 135 Z" fill="white"/>
      <path d="M675 160 L685 160 L675 170 Z" fill="white"/>
      <path d="M665 185 L670 195 L675 185 Z" fill="white"/>
      <path d="M635 185 L640 195 L645 185 Z" fill="white"/>
      <path d="M625 160 L615 160 L625 170 Z" fill="white"/>
      <circle cx="650" cy="160" r="10" fill="white"/> <!-- Inner circle for gear -->
    </g>

    <!-- Items on Middle Shelf -->
    <g id="middle_shelf_items">
      <!-- Tall Alice-style Clock 3 (left) -->
      <rect x="100" y="340" width="60" height="100" rx="10" ry="10" fill="white"/>
      <circle cx="130" cy="370" r="20" fill="white"/>
      <line x1="130" y1="370" x2="140" y2="360" fill="none"/>
      <line x1="130" y1="370" x2="120" y2="385" fill="none"/>
      <path d="M110 330 Q130 310 150 330" fill="white"/> <!-- Curved top -->

      <!-- Stack of Books/Tools (right) -->
      <rect x="600" y="360" width="80" height="80" rx="5" ry="5" fill="white"/>
      <rect x="610" y="350" width="60" height="70" rx="5" ry="5" fill="white"/>
      <line x1="600" y1="380" x2="680" y2="380" fill="none"/> <!-- Book lines -->
      <line x1="600" y1="400" x2="680" y2="400" fill="none"/>
      <line x1="610" y1="370" x2="670" y2="370" fill="none"/>
    </g>
  </g>

  <!-- Workbench -->
  <g id="workbench" stroke="black" stroke-width="4">
    <!-- Table Top -->
    <rect x="0" y="650" width="800" height="50" rx="20" ry="20" fill="white"/>
    <!-- Legs -->
    <rect x="100" y="700" width="50" height="200" rx="10" ry="10" fill="white"/>
    <rect x="650" y="700" width="50" height="200" rx="10" ry="10" fill="white"/>
    <!-- Wood grain on top -->
    <line x1="50" y1="665" x2="750" y2="665" fill="none"/>
    <line x1="50" y1="680" x2="750" y2="680" fill="none"/>
  </g>

  <!-- Workbench Items - larger and more detailed -->
  <g id="workbench_items" stroke="black" stroke-width="4">
    <!-- Large Gear 1 (left) -->
    <circle cx="200" cy="780" r="60" fill="white"/>
    <circle cx="200" cy="780" r="20" fill="white"/>
    <!-- Teeth -->
    <path d="M170 730 L180 720 L190 730 Z" fill="white"/>
    <path d="M220 730 L230 720 L240 730 Z" fill="white"/>
    <path d="M250 750 L260 760 L250 770 Z" fill="white"/>
    <path d="M250 800 L260 810 L250 820 Z" fill="white"/>
    <path d="M220 830 L230 840 L240 830 Z" fill="white"/>
    <path d="M170 830 L180 840 L190 830 Z" fill="white"/>
    <path d="M150 800 L140 810 L150 820 Z" fill="white"/>
    <path d="M150 750 L140 760 L150 770 Z" fill="white"/>

    <!-- Large Gear 2 (right, partially hidden) -->
    <circle cx="600" cy="780" r="70" fill="white"/>
    <circle cx="600" cy="780" r="25" fill="white"/>
    <!-- Teeth -->
    <path d="M560 725 L570 715 L580 725 Z" fill="white"/>
    <path d="M620 725 L630 715 L640 725 Z" fill="white"/>
    <path d="M650 755 L660 765 L650 775 Z" fill="white"/>
    <path d="M650 805 L660 815 L650 825 Z" fill="white"/>
    <path d="M620 835 L630 845 L640 835 Z" fill="white"/>
    <path d="M560 835 L570 845 L580 835 Z" fill="white"/>
    <path d="M530 805 L520 815 L530 825 Z" fill="white"/>
    <path d="M530 755 L520 765 L530 775 Z" fill="white"/>

    <!-- Whimsical Clock (middle-left) -->
    <path d="M300 700 A30 30 0 0 1 330 670 L330 600 A30 30 0 0 1 300 570 A30 30 0 0 1 270 600 L270 670 A30 30 0 0 1 300 700 Z" fill="white"/> <!-- Bell shape -->
    <circle cx="300" cy="620" r="25" fill="white"/>
    <line x1="300" y1="620" x2="315" y2="610" fill="none"/>
    <line x1="300" y1="620" x2="290" y2="635" fill="none"/>
    <circle cx="300" cy="570" r="10" fill="white"/> <!-- Bell top -->

    <!-- Cuckoo Clock Style (middle-right) -->
    <rect x="450" y="580" width="80" height="100" rx="10" ry="10" fill="white"/>
    <path d="M450 580 L490 540 L530 580 Z" fill="white"/> <!-- Roof -->
    <circle cx="490" cy="630" r="30" fill="white"/>
    <line x1="490" y1="630" x2="505" y2="620" fill="none"/>
    <line x1="490" y1="630" x2="480" y2="645" fill="none"/>
    <rect x="480" y="680" width="20" height="15" rx="5" ry="5" fill="white"/> <!-- Door for cuckoo -->
  </g>

  <!-- Rabbit Character -->
  <g id="rabbit_character" stroke="black" stroke-width="4">
    <!-- Body -->
    <path d="M400 600 Q300 650 300 750 Q400 800 500 750 Q500 650 400 600 Z" fill="white"/> <!-- Simplified body behind workbench -->
    <path d="M400 600 Q350 550 400 500 Q450 550 400 600 Z" fill="white"/> <!-- Upper body/chest visible above workbench -->

    <!-- Head -->
    <ellipse cx="400" cy="450" rx="90" ry="100" fill="white"/>

    <!-- Ears -->
    <path d="M350 360 Q340 280 380 260 Q420 280 410 360 Z" fill="white"/>
    <path d="M450 360 Q460 280 420 260 Q380 280 390 360 Z" fill="white"/>

    <!-- Face details -->
    <!-- Eyes (simple dots) -->
    <circle cx="365" cy="430" r="8" fill="black" stroke-width="0"/>
    <circle cx="435" cy="430" r="8" fill="black" stroke-width="0"/>
    <!-- Nose -->
    <path d="M400 455 Q395 460 400 465 Q405 460 400 455 Z" fill="black" stroke-width="0"/>
    <!-- Mouth -->
    <path d="M380 470 Q400 490 420 470" fill="none"/>

    <!-- Spectacles -->
    <circle cx="365" cy="430" r="18" fill="none"/>
    <circle cx="435" cy="430" r="18" fill="none"/>
    <rect x="380" y="425" width="40" height="10" rx="5" ry="5" fill="none"/> <!-- Bridge -->

    <!-- Waistcoat -->
    <path d="M400 500 L340 540 L340 600 Q400 580 460 600 L460 540 Z" fill="white"/>
    <!-- Buttons -->
    <circle cx="400" cy="540" r="5" fill="black" stroke-width="0"/>
    <circle cx="400" cy="565" r="5" fill="black" stroke-width="0"/>

    <!-- Paws (front paws holding items) -->
    <!-- Left Paw holding pocket watch -->
    <path d="M340 570 Q320 600 320 650 Q340 670 360 640 Q350 600 340 570 Z" fill="white"/>
    <circle cx="330" cy="620" r="25" fill="white"/> <!-- Pocket watch face -->
    <line x1="330" y1="620" x2="340" y2="610" fill="none"/> <!-- Clock hand 1 -->
    <line x1="330" y1="620" x2="320" y2="635" fill="none"/> <!-- Clock hand 2 -->

    <!-- Right Paw holding magnifying glass -->
    <path d="M460 570 Q480 600 480 650 Q460 670 440 640 Q450 600 460 570 Z" fill="white"/>
    <circle cx="470" cy="620" r="35" fill="white"/> <!-- Magnifying glass lens -->
    <rect x="470" y="655" width="10" height="30" rx="5" ry="5" fill="white"/> <!-- Magnifying glass handle -->

    <!-- Back paws -->
    <ellipse cx="330" cy="740" rx="40" ry="25" fill="white"/>
    <ellipse cx="470" cy="740" rx="40" ry="25" fill="white"/>
  </g>

</svg>