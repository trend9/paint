<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Explicit white background fill for the entire canvas -->
    <rect x="0" y="0" width="800" height="1000" fill="white" stroke="none" />

    <!-- Simple background elements (like a shelf and wall clock) -->
    <g id="background-elements">
      <!-- A simple shelf -->
      <rect x="80" y="100" width="640" height="40" rx="10" ry="10" fill="white" stroke="black" />
      <!-- Some simple items on the shelf -->
      <circle cx="150" cy="80" r="25" fill="white" stroke="black" />
      <rect x="250" y="70" width="40" height="60" rx="10" ry="10" fill="white" stroke="black" />
      <path d="M350 110 Q340 90 350 70 Q360 90 350 110" fill="none" stroke="black" stroke-width="4" /> <!-- A spring, simplified -->

      <!-- A simple large clock on the wall (behind the rabbit) -->
      <g transform="translate(400 180)">
        <circle cx="0" cy="0" r="80" fill="white" stroke="black" />
        <line x1="0" y1="0" x2="40" y2="-30" stroke="black" stroke-width="4" />
        <line x1="0" y1="0" x2="-20" y2="50" stroke="black" stroke-width="4" />
        <circle cx="0" cy="0" r="8" fill="white" stroke="black" />
      </g>
    </g>

    <!-- Workbench -->
    <g id="workbench">
      <rect x="100" y="600" width="600" height="100" rx="30" ry="30" fill="white" stroke="black" />
      <rect x="150" y="700" width="80" height="200" rx="20" ry="20" fill="white" stroke="black" />
      <rect x="570" y="700" width="80" height="200" rx="20" ry="20" fill="white" stroke="black" />
    </g>

    <!-- Rabbit -->
    <g id="rabbit">
      <!-- Body -->
      <ellipse cx="400" cy="480" rx="150" ry="180" fill="white" stroke="black" />
      <!-- Head -->
      <circle cx="400" cy="280" r="100" fill="white" stroke="black" />
      <!-- Ears -->
      <ellipse cx="340" cy="130" rx="30" ry="100" transform="rotate(-20 340 130)" fill="white" stroke="black" />
      <ellipse cx="460" cy="130" rx="30" ry="100" transform="rotate(20 460 130)" fill="white" stroke="black" />
      <!-- Face details -->
      <circle cx="370" cy="260" r="15" fill="white" stroke="black" />
      <circle cx="430" cy="260" r="15" fill="white" stroke="black" />
      <path d="M400 290 Q390 305 400 310 Q410 305 400 290" fill="white" stroke="black" /> <!-- Nose -->
      <path d="M370 320 Q400 340 430 320" fill="none" stroke="black" /> <!-- Mouth -->
      <!-- Waistcoat -->
      <path d="M300 380 C280 430 300 530 400 530 C500 530 520 430 500 380 Z" fill="white" stroke="black" />
      <circle cx="400" cy="430" r="10" fill="white" stroke="black" />
      <circle cx="400" cy="460" r="10" fill="white" stroke="black" />
      <!-- Arms -->
      <path d="M280 450 C250 430 200 460 250 500 C300 540 350 510 360 470" fill="white" stroke="black" /> <!-- Left arm -->
      <path d="M520 450 C550 430 600 460 550 500 C500 540 450 510 440 470" fill="white" stroke="black" /> <!-- Right arm -->
      <!-- Pocket watch held by right paw -->
      <g id="pocket-watch">
        <circle cx="500" cy="460" r="40" fill="white" stroke="black" />
        <path d="M500 420 L500 410 C505 405 505 400 500 395" fill="none" stroke="black" />
        <line x1="500" y1="460" x2="520" y2="450" stroke="black" stroke-width="3" />
        <line x1="500" y1="460" x2="490" y2="435" stroke="black" stroke-width="3" />
      </g>
    </g>

    <!-- Items on Workbench -->
    <g id="workbench-items">
      <!-- Large clock 1 (left) -->
      <g transform="translate(180 500)">
        <circle cx="0" cy="0" r="60" fill="white" stroke="black" />
        <line x1="0" y1="0" x2="30" y2="-20" stroke="black" stroke-width="3" />
        <line x1="0" y1="0" x2="-10" y2="25" stroke="black" stroke-width="3" />
        <circle cx="0" cy="0" r="5" fill="white" stroke="black" />
        <rect x="-30" y="60" width="60" height="20" rx="10" ry="10" fill="white" stroke="black" /> <!-- base -->
      </g>

      <!-- Tall clock (center-left) -->
      <g transform="translate(300 480)">
        <rect x="-30" y="-70" width="60" height="120" rx="15" ry="15" fill="white" stroke="black" />
        <circle cx="0" cy="-40" r="25" fill="white" stroke="black" />
        <line x1="0" y1="-40" x2="15" y2="-55" stroke="black" stroke-width="3" /> <!-- Hands from center of clock face -->
        <line x1="0" y1="-40" x2="-10" y2="-25" stroke="black" stroke-width="3" />
        <circle cx="0" cy="-40" r="3" fill="white" stroke="black" /> <!-- Center dot -->
      </g>

      <!-- Gear cluster (center) -->
      <g transform="translate(400 550)">
        <circle cx="0" cy="0" r="30" fill="white" stroke="black" />
        <!-- Simplified gear teeth -->
        <path d="M25 0 H35 M-25 0 H-35 M0 25 V35 M0 -25 V-35 M17.5 17.5 L25 25 M-17.5 17.5 L-25 25 M17.5 -17.5 L25 -25 M-17.5 -17.5 L-25 -25" fill="none" stroke="black" stroke-width="3" />
        <circle cx="40" cy="0" r="20" fill="white" stroke="black" />
        <path d="M30 0 H38 M50 0 H58 M40 10 V18 M40 -10 V-18" fill="none" stroke="black" stroke-width="3" />
        <circle cx="-30" cy="20" r="25" fill="white" stroke="black" />
        <path d="M-10 20 H-18 M-40 20 H-48 M-30 0 V-8 M-30 40 V48" fill="none" stroke="black" stroke-width="3" />
      </g>
      
      <!-- Spring (right) -->
      <g transform="translate(500 560)">
        <path d="M-30 0 Q-10 25 10 0 Q30 -25 50 0 Q70 25 90 0" fill="none" stroke="black" stroke-width="4" />
      </g>
      
      <!-- Star clock (right) -->
      <g transform="translate(600 520)">
        <path d="M0 -50 L14.6 -15.4 L47.6 -15.4 L20.8 7.7 L31.8 40.5 L0 20.7 L-31.8 40.5 L-20.8 7.7 L-47.6 -15.4 L-14.6 -15.4 Z" fill="white" stroke="black" />
        <circle cx="0" cy="0" r="10" fill="white" stroke="black" />
        <line x1="0" y1="0" x2="10" y2="-10" stroke="black" stroke-width="3" />
        <line x1="0" y1="0" x2="-5" y2="10" stroke="black" stroke-width="3" />
      </g>

      <!-- Small gear (far right) -->
      <g transform="translate(680 570)">
        <circle cx="0" cy="0" r="20" fill="white" stroke="black" />
        <path d="M15 0 H22 M-15 0 H-22 M0 15 V22 M0 -15 V-22" fill="none" stroke="black" stroke-width="3" />
      </g>

    </g>
    
  </g>
</svg>