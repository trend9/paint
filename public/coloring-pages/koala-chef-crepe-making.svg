<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
    <!-- Main Group for all content, slightly shifted down for better vertical centering -->
    <g transform="translate(0, 50)">

        <!-- Koala Chef -->
        <g id="koala_chef">
            <!-- Body -->
            <ellipse cx="400" cy="650" rx="150" ry="180" fill="white" stroke="black" stroke-width="4"/>
            
            <!-- Head -->
            <circle cx="400" cy="400" r="140" fill="white" stroke="black" stroke-width="4"/>
            
            <!-- Ears -->
            <ellipse cx="300" cy="300" rx="60" ry="80" fill="white" stroke="black" stroke-width="4"/>
            <ellipse cx="500" cy="300" rx="60" ry="80" fill="white" stroke="black" stroke-width="4"/>
            <!-- Inner ear detail -->
            <ellipse cx="300" cy="300" rx="30" ry="40" fill="white" stroke="black" stroke-width="3"/>
            <ellipse cx="500" cy="300" rx="30" ry="40" fill="white" stroke="black" stroke-width="3"/>

            <!-- Chef Hat -->
            <path d="M 320 280 Q 300 180 400 150 Q 500 180 480 280 Z" fill="white" stroke="black" stroke-width="4"/>
            <ellipse cx="400" cy="280" rx="90" ry="25" fill="white" stroke="black" stroke-width="4"/>
            
            <!-- Face features -->
            <!-- Eyes -->
            <circle cx="350" cy="380" r="20" fill="white" stroke="black" stroke-width="3"/>
            <circle cx="450" cy="380" r="20" fill="white" stroke="black" stroke-width="3"/>
            <!-- Nose (white fill as per coloring book requirement) -->
            <ellipse cx="400" cy="420" rx="30" ry="25" fill="white" stroke="black" stroke-width="4"/>
            <!-- Mouth -->
            <path d="M 370 450 Q 400 480 430 450" fill="none" stroke="black" stroke-width="3"/>

            <!-- Arms -->
            <!-- Left arm (viewer's left, holding spatula) -->
            <path d="M 300 500 C 250 550 200 650 250 700 C 300 750 350 600 340 520 Z" fill="white" stroke="black" stroke-width="4"/>
            <!-- Right arm (viewer's right) -->
            <path d="M 500 500 C 550 550 600 650 550 700 C 500 750 450 600 460 520 Z" fill="white" stroke="black" stroke-width="4"/>

            <!-- Legs/Feet (partially hidden by griddle) -->
            <ellipse cx="350" cy="790" rx="70" ry="40" fill="white" stroke="black" stroke-width="4"/>
            <ellipse cx="450" cy="790" rx="70" ry="40" fill="white" stroke="black" stroke-width="4"/>
        </g>

        <!-- Griddle, Crepe, and Spatula -->
        <g id="griddle_crepe_spatula">
            <!-- Griddle base -->
            <rect x="250" y="700" width="300" height="30" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
            <rect x="240" y="730" width="320" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/>
            <!-- Griddle Handle -->
            <rect x="550" y="710" width="50" height="15" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/>
            
            <!-- Crepe (fluffy, irregular path) -->
            <path d="M 300 650 C 320 630 480 630 500 650 C 520 670 520 750 500 770 C 480 790 320 790 300 770 C 280 750 280 670 300 650 Z" fill="white" stroke="black" stroke-width="4"/>

            <!-- Spatula in koala's hand -->
            <!-- Spatula handle -->
            <path d="M 280 680 C 290 640 330 620 350 640 C 360 660 320 690 280 680 Z" fill="white" stroke="black" stroke-width="3"/>
            <!-- Spatula head (slightly under the crepe) -->
            <rect x="300" y="660" width="80" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="3" transform="rotate(-5 340 670)"/>
        </g>

        <!-- Surrounding Elements: Fruits, Whipped Cream, Chocolate Sauce -->
        <g id="surroundings">
            <!-- Strawberries -->
            <g id="strawberry_left" transform="translate(100, 700)">
                <path d="M 0 0 Q 30 -50 60 0 Q 70 30 50 60 Q 30 70 10 60 Q -10 30 0 0 Z" fill="white" stroke="black" stroke-width="3"/>
                <circle cx="20" cy="20" r="3" fill="white" stroke="black" stroke-width="2"/>
                <circle cx="40" cy="30" r="3" fill="white" stroke="black" stroke-width="2"/>
                <circle cx="30" cy="45" r="3" fill="white" stroke="black" stroke-width="2"/>
                <path d="M 30 -5 L 20 -20 L 40 -20 L 30 -5 Z" fill="white" stroke="black" stroke-width="2"/> <!-- Green top -->
            </g>
            <g id="strawberry_right" transform="translate(600, 700)">
                <path d="M 0 0 Q 30 -50 60 0 Q 70 30 50 60 Q 30 70 10 60 Q -10 30 0 0 Z" fill="white" stroke="black" stroke-width="3"/>
                <circle cx="20" cy="20" r="3" fill="white" stroke="black" stroke-width="2"/>
                <circle cx="40" cy="30" r="3" fill="white" stroke="black" stroke-width="2"/>
                <circle cx="30" cy="45" r="3" fill="white" stroke="black" stroke-width="2"/>
                <path d="M 30 -5 L 20 -20 L 40 -20 L 30 -5 Z" fill="white" stroke="black" stroke-width="2"/> <!-- Green top -->
            </g>

            <!-- Bananas -->
            <g id="banana_left" transform="translate(80, 850)">
                <path d="M 0 0 Q 100 -50 150 50 L 140 70 Q 50 120 0 70 Z" fill="white" stroke="black" stroke-width="3"/>
                <path d="M 10 10 Q 90 -40 140 40 L 130 60 Q 40 100 10 60 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Inner line for banana segments -->
            </g>
            <g id="banana_right" transform="translate(570, 850) scale(-1, 1)"> <!-- Flip horizontally for second banana -->
                <path d="M 0 0 Q 100 -50 150 50 L 140 70 Q 50 120 0 70 Z" fill="white" stroke="black" stroke-width="3"/>
                <path d="M 10 10 Q 90 -40 140 40 L 130 60 Q 40 100 10 60 Z" fill="white" stroke="black" stroke-width="3"/>
            </g>

            <!-- Whipped Cream Dollop -->
            <g id="whipped_cream" transform="translate(650, 450)">
                <path d="M 0 50 C 20 20 50 0 80 10 C 110 20 120 50 100 80 C 80 110 50 120 20 100 Z" fill="white" stroke="black" stroke-width="4"/>
                <path d="M 20 60 C 30 40 50 30 70 40 C 90 50 90 70 70 80 C 50 90 30 80 20 60 Z" fill="white" stroke="black" stroke-width="3"/>
            </g>

            <!-- Chocolate Sauce Bottles -->
            <g id="chocolate_sauce_left" transform="translate(100, 300)">
                <rect x="0" y="50" width="60" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
                <path d="M 10 50 L 50 50 L 40 10 L 20 10 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Neck -->
                <rect x="25" y="0" width="10" height="15" rx="3" ry="3" fill="white" stroke="black" stroke-width="2"/> <!-- Nozzle -->
            </g>
            <g id="chocolate_sauce_right" transform="translate(650, 300)">
                <rect x="0" y="50" width="60" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
                <path d="M 10 50 L 50 50 L 40 10 L 20 10 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Neck -->
                <rect x="25" y="0" width="10" height="15" rx="3" ry="3" fill="white" stroke="black" stroke-width="2"/> <!-- Nozzle -->
            </g>

        </g>
    </g>
</svg>