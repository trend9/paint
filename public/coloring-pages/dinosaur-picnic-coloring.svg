<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">

  <!-- Environment elements -->
  <g id="environment">
    <!-- Sun -->
    <g id="sun">
      <circle cx="650" cy="150" r="70" />
      <!-- Sun rays - simple lines -->
      <line x1="650" y1="80" x2="650" y2="30" /> <!-- Top -->
      <line x1="700" y1="100" x2="740" y2="60" /> <!-- Top-right -->
      <line x1="720" y1="150" x2="770" y2="150" /> <!-- Right -->
      <line x1="700" y1="200" x2="740" y2="240" /> <!-- Bottom-right -->
      <line x1="650" y1="220" x2="650" y2="270" /> <!-- Bottom -->
      <line x1="600" y1="200" x2="560" y2="240" /> <!-- Bottom-left -->
      <line x1="580" y1="150" x2="530" y2="150" /> <!-- Left -->
      <line x1="600" y1="100" x2="560" y2="60" /> <!-- Top-left -->
    </g>

    <!-- Clouds -->
    <path d="M 120 180 Q 70 130 120 80 Q 170 30 220 80 Q 270 130 220 180 Q 170 230 120 180 Z" />
    <path d="M 300 130 Q 250 80 300 30 Q 350 -20 400 30 Q 450 80 400 130 Q 350 180 300 130 Z" />
  </g>

  <!-- Happy Dinosaur Group -->
  <g id="dinosaur">
    <!-- Body -->
    <path d="M 200 700 Q 100 650 150 500 C 200 400 400 380 500 450 Q 550 420 580 450 Q 600 550 550 700 Q 450 780 300 750 Z" />
    <!-- Head -->
    <path d="M 500 450 Q 450 350 520 300 Q 620 280 650 380 Q 650 450 580 450 Z" />

    <!-- Legs (two visible, rounded rectangles) -->
    <rect x="260" y="700" width="70" height="90" rx="30" ry="30" /> <!-- Front Left Leg -->
    <rect x="420" y="700" width="70" height="90" rx="30" ry="30" /> <!-- Back Left Leg -->

    <!-- Tail -->
    <path d="M 200 700 Q 80 780 50 700 Q 30 600 80 550 Q 130 500 180 550 Z" />

    <!-- Spikes on back (simple rounded bumps) -->
    <path d="M 300 450 Q 310 420 320 450 Z" />
    <path d="M 340 450 Q 350 420 360 450 Z" />
    <path d="M 380 450 Q 390 420 400 450 Z" />

    <!-- Facial features -->
    <!-- Eyes -->
    <circle cx="570" cy="380" r="18" />
    <circle cx="570" cy="380" r="8" /> <!-- Inner pupil area (fill white, stroke black) -->

    <!-- Mouth (big friendly smile) -->
    <path d="M 560 430 Q 590 450 620 430" fill="none" />
    <!-- Nostril -->
    <circle cx="625" cy="360" r="5" />
  </g>

  <!-- Ground / Horizon line - placed after dinosaur so dino stands on it -->
  <g id="ground">
    <path d="M 0 800 Q 200 780 400 800 Q 600 820 800 800 L 800 1000 L 0 1000 Z" fill="white" />
    <!-- Simple grass tufts -->
    <path d="M 150 800 L 160 780 L 170 800" fill="none" />
    <path d="M 600 800 L 610 780 L 620 800" fill="none" />
  </g>
</svg>