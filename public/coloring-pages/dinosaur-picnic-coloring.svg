<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style type="text/css">
      .outline { stroke: black; stroke-width: 4; fill: white; }
      .outline-no-fill { stroke: black; stroke-width: 4; fill: none; }
      .eye { fill: white; stroke: black; stroke-width: 3; }
      .mouth { fill: none; stroke: black; stroke-width: 3; }
    </style>
  </defs>

  <!-- Sun -->
  <g id="sun">
    <circle cx="700" cy="100" r="60" class="outline" />
    <line x1="700" y1="30" x2="700" y2="170" class="outline-no-fill" />
    <line x1="630" y1="100" x2="770" y2="100" class="outline-no-fill" />
    <line x1="660" y1="45" x2="740" y2="155" class="outline-no-fill" />
    <line x1="660" y1="155" x2="740" y2="45" class="outline-no-fill" />
  </g>

  <!-- Ground -->
  <path d="M0 700 Q150 650 400 700 T800 700 L800 1000 L0 1000 Z" class="outline" />

  <!-- Picnic Blanket -->
  <rect x="150" y="550" width="500" height="200" rx="40" ry="40" class="outline" />

  <!-- Dinosaurs -->
  <g id="dino1_brontosaurus" transform="translate(100, -50)">
    <!-- Body -->
    <ellipse cx="200" cy="650" rx="100" ry="60" class="outline" />
    <!-- Neck -->
    <path d="M250 590 Q280 480 250 400 Q220 320 200 380 Q170 480 200 590 Z" class="outline" />
    <!-- Head -->
    <ellipse cx="200" cy="350" rx="40" ry="30" class="outline" />
    <!-- Legs -->
    <rect x="150" y="700" width="40" height="50" rx="10" ry="10" class="outline" />
    <rect x="250" y="700" width="40" height="50" rx="10" ry="10" class="outline" />
    <!-- Eyes -->
    <circle cx="185" cy="340" r="5" class="eye" />
    <circle cx="215" cy="340" r="5" class="eye" />
    <!-- Mouth -->
    <path d="M185 360 Q200 375 215 360" class="mouth" />
  </g>

  <g id="dino2_triceratops" transform="translate(450, -50)">
    <!-- Body -->
    <ellipse cx="200" cy="650" rx="90" ry="65" class="outline" />
    <!-- Head -->
    <path d="M200 580 Q250 500 300 540 Q250 590 200 580 Z" class="outline" />
    <!-- Frill -->
    <path d="M220 540 Q250 480 300 480 Q350 480 360 540 Q300 580 220 540 Z" class="outline" />
    <!-- Horns (simplified) -->
    <line x1="280" y1="490" x2="290" y2="470" class="outline-no-fill"/>
    <line x1="320" y1="490" x2="330" y2="470" class="outline-no-fill"/>
    <!-- Legs -->
    <rect x="150" y="700" width="40" height="50" rx="10" ry="10" class="outline" />
    <rect x="250" y="700" width="40" height="50" rx="10" ry="10" class="outline" />
    <!-- Eyes -->
    <circle cx="260" cy="510" r="5" class="eye" />
    <circle cx="290" cy="510" r="5" class="eye" />
    <!-- Mouth -->
    <path d="M265 540 Q280 550 295 540" class="mouth" />
  </g>
  
  <g id="dino3_baby_t-rex" transform="translate(150, 0)">
    <!-- Body -->
    <ellipse cx="500" cy="700" rx="70" ry="50" class="outline" />
    <!-- Head -->
    <path d="M470 650 Q500 600 540 650 L530 680 L480 680 Z" class="outline" />
    <!-- Arms -->
    <rect x="440" y="690" width="15" height="30" rx="5" ry="5" class="outline" />
    <rect x="520" y="690" width="15" height="30" rx="5" ry="5" class="outline" />
    <!-- Legs -->
    <rect x="460" y="730" width="30" height="50" rx="10" ry="10" class="outline" />
    <rect x="500" y="730" width="30" height="50" rx="10" ry="10" class="outline" />
    <!-- Eyes -->
    <circle cx="485" cy="635" r="4" class="eye" />
    <circle cx="510" cy="635" r="4" class="eye" />
    <!-- Mouth -->
    <path d="M490 660 Q500 670 515 660" class="mouth" />
  </g>

  <!-- Picnic Basket -->
  <g id="picnic_basket">
    <rect x="600" y="600" width="100" height="60" rx="15" ry="15" class="outline" />
    <path d="M590 600 L710 600 L710 570 L590 570 Z" class="outline" />
    <path d="M650 570 Q620 520 650 500 Q680 520 650 570 Z" class="outline-no-fill"/>
  </g>

  <!-- Food items -->
  <g id="food_items">
    <!-- Sandwich 1 -->
    <rect x="300" y="580" width="50" height="30" rx="8" ry="8" class="outline" />
    <rect x="300" y="570" width="50" height="30" rx="8" ry="8" class="outline" />
    <!-- Sandwich 2 -->
    <rect x="360" y="620" width="50" height="30" rx="8" ry="8" class="outline" />
    <rect x="360" y="610" width="50" height="30" rx="8" ry="8" class="outline" />
    <!-- Apple -->
    <circle cx="430" cy="590" r="20" class="outline" />
    <path d="M425 570 Q430 560 435 570" class="outline-no-fill"/> <!-- stem -->
    <!-- Banana -->
    <path d="M480 600 Q490 570 510 580 Q520 610 500 620 Z" class="outline" />
  </g>

</svg>