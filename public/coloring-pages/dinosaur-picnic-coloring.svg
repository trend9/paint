<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .outline-none {
        stroke: black;
        stroke-width: 4;
        fill: none;
      }
    ]]></style>
  </defs>

  <!-- Pure white background rectangle -->
  <rect x="0" y="0" width="800" height="1000" fill="white"/>

  <!-- Sky and Fluffy Clouds -->
  <g id="sky-and-clouds">
    <path class="outline" d="M100,200 Q80,150 150,130 T250,150 T300,200 Z" />
    <path class="outline" d="M500,180 Q480,130 550,110 T650,130 T700,180 Z" />
    <path class="outline" d="M300,100 Q280,50 350,30 T450,50 T500,100 Z" />
  </g>

  <!-- Ground / Sunny Field -->
  <g id="ground">
    <rect x="0" y="500" width="800" height="500" class="outline" />
    <!-- Simple grass texture lines -->
    <path class="outline-none" d="M50,550 Q70,530 90,550 Q110,570 130,550" />
    <path class="outline-none" d="M150,580 Q170,560 190,580 Q210,600 230,580" />
    <path class="outline-none" d="M600,600 Q620,580 640,600 Q660,620 680,600" />
  </g>

  <!-- Checkered Blanket -->
  <g id="blanket">
    <path class="outline" d="M200,680 C180,660 250,630 550,630 C580,650 600,680 580,710 C550,730 230,730 200,680 Z" />
    <!-- Simple grid lines for checkered pattern (fill="none") -->
    <line x1="250" y1="650" x2="230" y2="710" class="outline-none" />
    <line x1="350" y1="640" x2="330" y2="720" class="outline-none" />
    <line x1="450" y1="635" x2="430" y2="725" class="outline-none" />
    <line x1="550" y1="630" x2="530" y2="720" class="outline-none" />

    <line x1="200" y1="680" x2="580" y2="710" class="outline-none" />
    <line x1="210" y1="660" x2="570" y2="690" class="outline-none" />
    <line x1="220" y1="640" x2="560" y2="670" class="outline-none" />
  </g>

  <!-- Picnic Items -->
  <g id="picnic-items">
    <!-- Picnic basket -->
    <path class="outline" d="M450,630 Q430,610 470,610 Q490,590 530,610 Q510,630 450,630 Z" />
    <rect x="440" y="620" width="100" height="80" rx="10" ry="10" class="outline" />
    <path class="outline-none" d="M470,610 Q480,590 500,610" /> <!-- Handle -->

    <!-- Apple for Brachiosaurus to reach -->
    <circle cx="360" cy="630" r="25" class="outline" />
    <path class="outline-none" d="M360,605 Q365,600 370,605" /> <!-- Apple stem -->
  </g>

  <!-- Dinosaurs -->
  <g id="dinosaurs">

    <!-- Gentle Triceratops eating a sandwich -->
    <g id="triceratops">
      <!-- Body -->
      <ellipse cx="250" cy="810" rx="100" ry="70" class="outline" />
      <!-- Legs -->
      <rect x="200" y="840" width="30" height="80" rx="15" ry="15" class="outline" />
      <rect x="270" y="840" width="30" height="80" rx="15" ry="15" class="outline" />
      <!-- Head -->
      <path class="outline" d="M280,730 Q350,680 380,730 Q390,760 350,780 Q300,770 280,730 Z" />
      <!-- Frill -->
      <path class="outline" d="M300,710 Q320,660 380,680 L350,730 Z" />
      <!-- Horns -->
      <path class="outline" d="M330,690 L340,670 L350,690 Z" />
      <path class="outline" d="M360,690 L370,670 L380,690 Z" />
      <!-- Nose horn -->
      <path class="outline" d="M390,740 L400,730 L410,740 Z" />
      <!-- Eye -->
      <circle cx="340" cy="740" r="8" class="outline" />
      <!-- Mouth -->
      <path class="outline-none" d="M350,760 Q370,770 380,760" />
      <!-- Sandwich in mouth -->
      <rect x="370" y="750" width="30" height="20" rx="3" ry="3" class="outline" transform="rotate(10 385 760)"/>
    </g>

    <!-- Playful T-Rex sharing cookies -->
    <g id="t-rex">
      <!-- Body -->
      <ellipse cx="600" cy="780" rx="80" ry="90" class="outline" transform="rotate(-15 600 780)"/>
      <!-- Legs -->
      <rect x="580" y="830" width="40" height="100" rx="20" ry="20" class="outline" transform="rotate(-10 600 880)"/>
      <rect x="650" y="830" width="40" height="100" rx="20" ry="20" class="outline" transform="rotate(5 670 880)"/>
      <!-- Tail -->
      <path class="outline" d="M520,770 Q450,780 480,880 Q550,830 520,770 Z" />
      <!-- Head -->
      <path class="outline" d="M650,710 Q700,680 750,710 Q760,750 700,780 Q660,760 650,710 Z" />
      <!-- Arms, positioned near picnic basket -->
      <rect x="550" y="710" width="40" height="20" rx="10" ry="10" class="outline" transform="rotate(20 570 720)" />
      <rect x="590" y="710" width="40" height="20" rx="10" ry="10" class="outline" transform="rotate(-10 610 720)" />
      <!-- Eye -->
      <circle cx="690" cy="720" r="8" class="outline" />
      <!-- Mouth -->
      <path class="outline-none" d="M680,750 Q720,770 740,750" />
      <!-- Cookies being shared, near the basket -->
      <circle cx="530" cy="660" r="15" class="outline" />
      <circle cx="510" cy="670" r="15" class="outline" />
    </g>

    <!-- Small Brachiosaurus reaching for an apple -->
    <g id="brachiosaurus">
      <!-- Body -->
      <ellipse cx="400" cy="880" rx="120" ry="60" class="outline" />
      <!-- Legs -->
      <rect x="350" y="910" width="40" height="80" rx="20" ry="20" class="outline" />
      <rect x="450" y="910" width="40" height="80" rx="20" ry="20" class="outline" />
      <!-- Neck reaching towards the apple (at 360,630) -->
      <path class="outline" d="M400,830 Q300,730 350,630 Q360,610 380,650 Q450,780 450,830 Q430,830 400,830 Z" />
      <!-- Head -->
      <path class="outline" d="M370,640 Q390,610 410,640 Q420,670 390,680 Q370,670 370,640 Z" />
      <!-- Eye -->
      <circle cx="395" cy="655" r="8" class="outline" />
      <!-- Mouth -->
      <path class="outline-none" d="M380,675 Q400,685 410,675" />
    </g>

  </g>
</svg>