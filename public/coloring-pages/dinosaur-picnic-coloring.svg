<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Main ground line -->
  <path d="M 0 750 Q 200 700 400 750 Q 600 800 800 750" fill="white" stroke="black" stroke-width="4"/>

  <!-- Simple Trees in background -->
  <g id="trees">
    <path d="M 650 650 L 630 500 C 600 400 700 400 670 500 L 650 650 Z" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="650" cy="450" rx="90" ry="100" fill="white" stroke="black" stroke-width="4"/>

    <path d="M 150 700 L 130 550 C 100 450 200 450 170 550 L 150 700 Z" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="150" cy="500" rx="90" ry="100" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Cheerful Flowers -->
  <g id="flowers">
    <circle cx="700" cy="700" r="15" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="685" cy="690" rx="10" ry="20" transform="rotate(-30 685 690)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="715" cy="690" rx="10" ry="20" transform="rotate(30 715 690)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="690" cy="710" rx="10" ry="20" transform="rotate(-90 690 710)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="710" cy="710" rx="10" ry="20" transform="rotate(90 710 710)" fill="white" stroke="black" stroke-width="3"/>

    <circle cx="100" cy="730" r="15" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="85" cy="720" rx="10" ry="20" transform="rotate(-30 85 720)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="115" cy="720" rx="10" ry="20" transform="rotate(30 115 720)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="90" cy="740" rx="10" ry="20" transform="rotate(-90 90 740)" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="110" cy="740" rx="10" ry="20" transform="rotate(90 110 740)" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Picnic Blanket -->
  <g id="picnic_blanket">
    <rect x="200" y="650" width="400" height="200" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <!-- Checkered pattern -->
    <g stroke="black" stroke-width="3">
      <line x1="250" y1="650" x2="250" y2="850"/>
      <line x1="300" y1="650" x2="300" y2="850"/>
      <line x1="350" y1="650" x2="350" y2="850"/>
      <line x1="400" y1="650" x2="400" y2="850"/>
      <line x1="450" y1="650" x2="450" y2="850"/>
      <line x1="500" y1="650" x2="500" y2="850"/>
      <line x1="550" y1="650" x2="550" y2="850"/>

      <line x1="200" y1="700" x2="600" y2="700"/>
      <line x1="200" y1="750" x2="600" y2="750"/>
      <line x1="200" y1="800" x2="600" y2="800"/>
    </g>
  </g>

  <!-- Brontosaurus -->
  <g id="brontosaurus">
    <path d="M 270 650 Q 250 550 300 450 Q 350 350 380 380 Q 400 400 410 450 Q 420 500 400 550 Q 380 650 300 650 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
    <path d="M 380 380 Q 400 300 370 250 Q 320 200 300 250 Q 280 300 300 380 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Neck -->
    <path d="M 300 250 Q 280 200 250 200 Q 230 220 250 260 Q 270 290 300 250 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
    <circle cx="265" cy="225" r="5" fill="black"/> <!-- Eye -->
    <path d="M 270 245 Q 260 250 270 255" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
  </g>

  <!-- Triceratops -->
  <g id="triceratops">
    <path d="M 150 780 Q 130 700 180 650 Q 230 600 270 650 Q 290 700 250 780 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
    <path d="M 270 650 Q 290 600 270 550 Q 240 500 200 550 Q 180 600 200 650 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
    <path d="M 200 550 Q 180 500 200 480 Q 220 500 200 550 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Frill -->
    <path d="M 210 520 L 220 500 L 230 520 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Horn 1 -->
    <path d="M 190 520 L 180 500 L 170 520 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Horn 2 -->
    <circle cx="200" cy="510" r="3" fill="black"/> <!-- Nose Horn -->
    <circle cx="200" cy="560" r="5" fill="black"/> <!-- Eye -->
    <path d="M 200 575 Q 190 580 200 585" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
  </g>

  <!-- Playful Stegosaurus -->
  <g id="stegosaurus">
    <path d="M 580 780 Q 560 700 510 650 Q 460 600 420 650 Q 400 700 450 780 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
    <path d="M 420 650 Q 400 600 420 550 Q 450 500 490 550 Q 510 600 490 650 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
    <path d="M 450 600 Q 460 580 470 600 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Plate 1 -->
    <path d="M 480 620 Q 490 600 500 620 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Plate 2 -->
    <path d="M 510 640 Q 520 620 530 640 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Plate 3 -->
    <path d="M 540 660 Q 550 640 560 660 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Plate 4 -->
    <circle cx="490" cy="560" r="5" fill="black"/> <!-- Eye -->
    <path d="M 490 575 Q 480 580 490 585" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
  </g>

  <!-- Picnic Basket -->
  <g id="picnic_basket">
    <rect x="520" y="600" width="100" height="70" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 530 600 Q 520 560 570 550 Q 620 560 610 600" fill="white" stroke="black" stroke-width="4"/> <!-- Lid -->
    <path d="M 540 575 Q 570 530 600 575" fill="none" stroke="black" stroke-width="4"/> <!-- Handle -->
  </g>

  <!-- Picnic Food -->
  <g id="picnic_food">
    <!-- Apple -->
    <circle cx="550" cy="620" r="15" fill="white" stroke="black" stroke-width="3"/>
    <line x1="550" y1="605" x2="550" y2="600" stroke="black" stroke-width="2"/>
    <!-- Banana -->
    <path d="M 570 620 C 580 610 590 610 600 620 C 590 630 580 630 570 620 Z" fill="white" stroke="black" stroke-width="3"/>
    <!-- Sandwich -->
    <rect x="530" y="640" width="30" height="25" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/>
    <line x1="530" y1="655" x2="560" y2="655" stroke="black" stroke-width="2"/> <!-- filling line -->
  </g>

</svg>