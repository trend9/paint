<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .outline {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-nofill {
        stroke: black;
        stroke-width: 5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    ]]></style>
  </defs>

  <!-- Ground -->
  <path d="M0 750 C200 700 600 700 800 750 L800 1000 L0 1000 Z" class="outline"/>

  <!-- Sun -->
  <g class="outline">
    <circle cx="700" cy="100" r="50"/>
    <line x1="700" y1="160" x2="700" y2="190" class="outline-nofill"/>
    <line x1="750" y1="100" x2="780" y2="100" class="outline-nofill"/>
    <line x1="735" y1="135" x2="755" y2="155" class="outline-nofill"/>
    <line x1="665" y1="135" x2="645" y2="155" class="outline-nofill"/>
    <line x1="650" y1="100" x2="620" y2="100" class="outline-nofill"/>
    <line x1="735" y1="65" x2="755" y2="45" class="outline-nofill"/>
    <line x1="665" y1="65" x2="645" y2="45" class="outline-nofill"/>
  </g>

  <!-- Clouds -->
  <g class="outline">
    <path d="M100 80 Q130 50 160 80 Q190 50 220 80 Q190 110 160 80 Q130 110 100 80 Z"/>
    <path d="M350 120 Q380 90 410 120 Q440 90 470 120 Q440 150 410 120 Q380 150 350 120 Z"/>
  </g>

  <!-- Picnic Blanket -->
  <rect x="180" y="680" width="480" height="200" rx="30" ry="30" class="outline"/>

  <!-- Picnic Basket -->
  <g class="outline">
    <rect x="560" y="600" width="100" height="60" rx="10" ry="10"/>
    <path d="M560 610 Q610 590 660 610 L660 660 Q610 680 560 660 Z"/>
    <path d="M580 600 Q610 570 640 600" class="outline-nofill"/> <!-- Handle -->
  </g>

  <!-- Sandwiches on blanket -->
  <g class="outline">
    <rect x="300" y="690" width="50" height="40" rx="8" ry="8"/>
    <rect x="360" y="700" width="50" height="40" rx="8" ry="8"/>
    <rect x="420" y="690" width="50" height="40" rx="8" ry="8"/>
  </g>

  <!-- Dinosaurs -->
  <g id="dinosaurs">
    <!-- Brontosaurus -->
    <g id="brontosaurus" class="outline" transform="translate(-100 0)">
      <!-- Body -->
      <path d="M150 800 C200 700 300 650 400 650 C500 650 550 700 600 800 L550 850 L200 850 Z"/>
      <!-- Neck -->
      <path d="M370 650 C430 500 500 350 500 280 C500 200 450 200 400 280 C350 350 400 500 370 650 Z"/>
      <!-- Head -->
      <ellipse cx="420" cy="270" rx="40" ry="30"/>
      <!-- Eye -->
      <circle cx="435" cy="260" r="8"/>
      <!-- Smile -->
      <path d="M420 280 Q430 295 440 280" class="outline-nofill"/>
      <!-- Front Leg -->
      <rect x="250" y="780" width="60" height="70" rx="20" ry="20"/>
      <!-- Back Leg -->
      <rect x="350" y="780" width="60" height="70" rx="20" ry="20"/>
      <!-- Sandwich held -->
      <rect x="440" y="310" width="40" height="40" rx="8" ry="8"/>
    </g>

    <!-- Triceratops -->
    <g id="triceratops" class="outline" transform="translate(480 0) scale(0.8)">
      <!-- Body -->
      <path d="M50 750 C100 680 200 680 250 750 C220 820 80 820 50 750 Z"/>
      <!-- Head -->
      <path d="M180 680 Q220 600 260 680 L250 730 L190 730 Z"/>
      <!-- Frill -->
      <path d="M190 680 Q220 640 250 680" class="outline"/>
      <!-- Horns -->
      <path d="M235 650 L245 620 L255 650 Z" class="outline"/>
      <path d="M205 650 L215 620 L225 650 Z" class="outline"/>
      <path d="M220 670 L230 650 L240 670 Z" class="outline"/> <!-- Nose horn -->
      <!-- Eye -->
      <circle cx="215" cy="690" r="8"/>
      <!-- Smile -->
      <path d="M205 700 Q215 710 225 700" class="outline-nofill"/>
      <!-- Front Leg -->
      <rect x="100" y="790" width="50" height="60" rx="15" ry="15"/>
      <!-- Back Leg -->
      <rect x="170" y="790" width="50" height="60" rx="15" ry="15"/>
    </g>

    <!-- Stegosaurus -->
    <g id="stegosaurus" class="outline" transform="translate(170 352) scale(0.6)">
      <!-- Body -->
      <path d="M50 750 C100 700 200 700 250 750 C200 800 100 800 50 750 Z"/>
      <!-- Head -->
      <ellipse cx="30" cy="720" rx="25" ry="20"/>
      <!-- Eye -->
      <circle cx="35" cy="715" r="5"/>
      <!-- Smile -->
      <path d="M30 725 Q35 730 40 725" class="outline-nofill"/>
      <!-- Front Leg -->
      <rect x="70" y="780" width="40" height="50" rx="10" ry="10"/>
      <!-- Back Leg -->
      <rect x="150" y="780" width="40" height="50" rx="10" ry="10"/>
      <!-- Spikes (Plates) -->
      <path d="M90 700 L100 670 L110 700 Z"/>
      <path d="M130 700 L140 670 L150 700 Z"/>
      <path d="M170 700 L180 670 L190 700 Z"/>
    </g>
  </g>
</svg>