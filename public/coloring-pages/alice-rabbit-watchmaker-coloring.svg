<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Workbench / Floor -->
  <rect x="0" y="800" width="800" height="200" rx="40" ry="40" stroke="black" stroke-width="4" fill="white"/>

  <!-- Workshop background elements (simplified clocks, gears, springs) -->
  <g id="workshop_background">
    <!-- Large Wall Clock 1 (left) -->
    <circle cx="150" cy="200" r="80" stroke="black" stroke-width="4" fill="white"/>
    <line x1="150" y1="200" x2="150" y2="140" stroke="black" stroke-width="4"/>
    <line x1="150" y1="200" x2="200" y2="200" stroke="black" stroke-width="4"/>
    <!-- Large Wall Clock 2 (right) -->
    <circle cx="650" cy="250" r="90" stroke="black" stroke-width="4" fill="white"/>
    <line x1="650" y1="250" x2="650" y2="190" stroke="black" stroke-width="4"/>
    <line x1="650" y1="250" x2="710" y2="280" stroke="black" stroke-width="4"/>
    <!-- Gear 1 (top left) -->
    <circle cx="80" cy="400" r="50" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="80" cy="400" r="20" stroke="black" stroke-width="4" fill="white"/>
    <line x1="80" y1="350" x2="80" y2="450" stroke="black" stroke-width="4"/>
    <line x1="30" y1="400" x2="130" y2="400" stroke="black" stroke-width="4"/>
    <!-- Gear 2 (mid right) -->
    <circle cx="720" cy="500" r="60" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="720" cy="500" r="25" stroke="black" stroke-width="4" fill="white"/>
    <line x1="720" y1="440" x2="720" y2="560" stroke="black" stroke-width="4"/>
    <line x1="660" y1="500" x2="780" y2="500" stroke="black" stroke-width="4"/>
    <!-- Spring 1 (bottom left, on floor) -->
    <path d="M 50 850 Q 80 820 110 850 Q 140 880 170 850" stroke="black" stroke-width="4" fill="none"/>
    <!-- Spring 2 (bottom right, on floor) -->
    <path d="M 750 880 Q 720 850 690 880 Q 660 910 630 880" stroke="black" stroke-width="4" fill="none"/>
  </g>

  <!-- Rabbit character -->
  <g id="rabbit_watchmaker">
    <!-- Body -->
    <ellipse cx="400" cy="700" rx="150" ry="180" stroke="black" stroke-width="4" fill="white"/>
    <!-- Head -->
    <circle cx="400" cy="400" r="120" stroke="black" stroke-width="4" fill="white"/>
    <!-- Ears -->
    <ellipse cx="350" cy="220" rx="40" ry="120" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="450" cy="220" rx="40" ry="120" stroke="black" stroke-width="4" fill="white"/>
    <!-- Vest (simplified path) -->
    <path d="M 280 550 L 300 750 C 400 800 500 800 500 750 L 520 550 L 400 500 Z" stroke="black" stroke-width="4" fill="white"/>
    <!-- Arms -->
    <path d="M 300 550 Q 250 650 320 720" stroke="black" stroke-width="4" fill="white"/> <!-- Left Arm -->
    <path d="M 500 550 Q 550 650 480 720" stroke="black" stroke-width="4" fill="white"/> <!-- Right Arm -->
    <!-- Hands holding watch (watch will be drawn over these) -->
    <circle cx="340" cy="740" r="35" stroke="black" stroke-width="4" fill="white"/> <!-- Left Hand -->
    <circle cx="460" cy="740" r="35" stroke="black" stroke-width="4" fill="white"/> <!-- Right Hand -->

    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="360" cy="380" r="20" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="440" cy="380" r="20" stroke="black" stroke-width="4" fill="white"/>
    <!-- Spectacles -->
    <circle cx="360" cy="380" r="30" stroke="black" stroke-width="4" fill="none"/>
    <circle cx="440" cy="380" r="30" stroke="black" stroke-width="4" fill="none"/>
    <line x1="390" y1="380" x2="410" y2="380" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <ellipse cx="400" cy="425" rx="20" ry="15" stroke="black" stroke-width="4" fill="white"/>
    <!-- Mouth -->
    <path d="M 370 450 Q 400 480 430 450" stroke="black" stroke-width="4" fill="none"/>
    <!-- Whiskers -->
    <line x1="320" y1="430" x2="360" y2="435" stroke="black" stroke-width="4"/>
    <line x1="320" y1="445" x2="360" y2="450" stroke="black" stroke-width="4"/>
    <line x1="480" y1="430" x2="440" y2="435" stroke="black" stroke-width="4"/>
    <line x1="480" y1="445" x2="440" y2="450" stroke="black" stroke-width="4"/>
    <!-- Bow tie -->
    <path d="M 380 490 Q 360 480 380 470 Q 400 480 380 490 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 420 490 Q 440 480 420 470 Q 400 480 420 490 Z" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="400" cy="480" r="10" stroke="black" stroke-width="4" fill="white"/>

    <!-- Feet -->
    <ellipse cx="320" cy="880" rx="60" ry="40" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="480" cy="880" rx="60" ry="40" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Pocket watch (placed over the rabbit's hands) -->
  <g id="pocket_watch">
    <circle cx="400" cy="740" r="70" stroke="black" stroke-width="5" fill="white"/> <!-- Outer watch body -->
    <circle cx="400" cy="740" r="50" stroke="black" stroke-width="4" fill="white"/> <!-- Inner face -->
    <line x1="400" y1="740" x2="400" y2="695" stroke="black" stroke-width="4"/> <!-- Hour hand -->
    <line x1="400" y1="740" x2="440" y2="740" stroke="black" stroke-width="4"/> <!-- Minute hand -->
    <rect x="390" y="660" width="20" height="20" rx="5" ry="5" stroke="black" stroke-width="4" fill="white"/> <!-- Crown -->
    <path d="M 400 680 L 400 650 Q 380 620 350 620" stroke="black" stroke-width="4" fill="none"/> <!-- Chain -->
  </g>

  <!-- More workshop elements (foreground, smaller and around the rabbit) -->
  <g id="workshop_foreground">
    <!-- Small clock on workbench left -->
    <circle cx="100" cy="900" r="40" stroke="black" stroke-width="3" fill="white"/>
    <line x1="100" y1="900" x2="100" y2="870" stroke="black" stroke-width="3"/>
    <line x1="100" y1="900" x2="130" y2="910" stroke="black" stroke-width="3"/>
    <!-- Small gear on workbench right -->
    <circle cx="700" cy="920" r="35" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="700" cy="920" r="15" stroke="black" stroke-width="3" fill="white"/>
    <line x1="700" y1="885" x2="700" y2="955" stroke="black" stroke-width="3"/>
    <line x1="665" y1="920" x2="735" y2="920" stroke="black" stroke-width="3"/>
    <!-- Small spring near rabbit's foot -->
    <path d="M 550 850 Q 570 830 590 850" stroke="black" stroke-width="3" fill="none"/>
  </g>
</svg>