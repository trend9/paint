<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Global style for coloring book: thick black outlines, white fill -->
  <style>
    .main-outline {
      stroke: black;
      stroke-width: 5;
      fill: white;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .detail-outline {
      stroke: black;
      stroke-width: 4;
      fill: white;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .thin-detail {
      stroke: black;
      stroke-width: 3;
      fill: white;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>

  <!-- Background elements: Whimsical Clocks and Gears -->
  <g id="whimsical_elements">
    <!-- Shelves and Tables -->
    <!-- Shelf 1 (top left) -->
    <rect x="50" y="250" width="200" height="20" rx="10" ry="10" class="detail-outline"/>
    <rect x="60" y="270" width="10" height="40" rx="5" ry="5" class="detail-outline"/>
    <rect x="240" y="270" width="10" height="40" rx="5" ry="5" class="detail-outline"/>

    <!-- Shelf 2 (top right) -->
    <rect x="550" y="180" width="200" height="20" rx="10" ry="10" class="detail-outline"/>
    <rect x="560" y="200" width="10" height="40" rx="5" ry="5" class="detail-outline"/>
    <rect x="740" y="200" width="10" height="40" rx="5" ry="5" class="detail-outline"/>

    <!-- Long Shelf (mid-left) -->
    <rect x="50" y="550" width="250" height="25" rx="12" ry="12" class="detail-outline"/>
    <rect x="60" y="575" width="10" height="50" rx="5" ry="5" class="detail-outline"/>
    <rect x="290" y="575" width="10" height="50" rx="5" ry="5" class="detail-outline"/>

    <!-- Table (bottom right) -->
    <rect x="500" y="800" width="250" height="40" rx="15" ry="15" class="detail-outline"/>
    <rect x="520" y="840" width="20" height="80" rx="10" ry="10" class="detail-outline"/>
    <rect x="710" y="840" width="20" height="80" rx="10" ry="10" class="detail-outline"/>

    <!-- Floating Gear 1 (top left) -->
    <g class="detail-outline">
      <circle cx="150" cy="150" r="50"/>
      <ellipse cx="150" cy="90" rx="15" ry="10"/> <!-- Tooth 1 -->
      <ellipse cx="150" cy="210" rx="15" ry="10"/> <!-- Tooth 2 -->
      <ellipse cx="90" cy="150" rx="10" ry="15"/> <!-- Tooth 3 -->
      <ellipse cx="210" cy="150" rx="10" ry="15"/> <!-- Tooth 4 -->
      <circle cx="150" cy="150" r="15" class="thin-detail"/>
    </g>

    <!-- Clock 1 (on shelf 1) -->
    <circle cx="150" cy="220" r="40" class="detail-outline"/>
    <line x1="150" y1="220" x2="150" y2="195" class="thin-detail" fill="none"/>
    <line x1="150" y1="220" x2="175" y2="220" class="thin-detail" fill="none"/>

    <!-- Gear 2 (floating mid-right) -->
    <g class="detail-outline">
      <circle cx="650" cy="400" r="45"/>
      <ellipse cx="650" cy="345" rx="12" ry="8"/> <!-- Tooth 1 -->
      <ellipse cx="650" cy="455" rx="12" ry="8"/> <!-- Tooth 2 -->
      <ellipse cx="595" cy="400" rx="8" ry="12"/> <!-- Tooth 3 -->
      <ellipse cx="705" cy="400" rx="8" ry="12"/> <!-- Tooth 4 -->
      <circle cx="650" cy="400" r="12" class="thin-detail"/>
    </g>

    <!-- Clock 2 (on shelf 2) -->
    <rect x="600" y="100" width="100" height="100" rx="15" ry="15" class="detail-outline"/>
    <circle cx="650" cy="150" r="30" class="detail-outline"/>
    <line x1="650" y1="150" x2="650" y2="130" class="thin-detail" fill="none"/>
    <line x1="650" y1="150" x2="670" y2="150" class="thin-detail" fill="none"/>

    <!-- Wavy Clock (on long shelf) -->
    <path d="M175 480 C200 450 250 450 275 480 C300 510 300 540 275 570 C250 600 200 600 175 570 C150 540 150 510 175 480 Z" class="detail-outline"/>
    <circle cx="225" cy="525" r="30" class="detail-outline"/>
    <line x1="225" y1="525" x2="225" y2="505" class="thin-detail" fill="none"/>
    <line x1="225" y1="525" x2="245" y2="525" class="thin-detail" fill="none"/>

    <!-- Cuckoo Clock (floating mid-left) -->
    <rect x="80" y="350" width="100" height="150" rx="15" ry="15" class="detail-outline"/>
    <path d="M80 350 L130 310 L180 350 Z" class="detail-outline" fill="white"/> <!-- Roof -->
    <rect x="115" y="360" width="30" height="30" rx="5" ry="5" class="detail-outline"/> <!-- Cuckoo door -->
    <circle cx="130" cy="430" r="30" class="detail-outline"/>
    <line x1="130" y1="430" x2="130" y2="410" class="thin-detail" fill="none"/>
    <line x1="130" y1="430" x2="150" y2="430" class="thin-detail" fill="none"/>

    <!-- Gear 3 (bottom left) -->
    <g class="detail-outline">
      <circle cx="100" cy="850" r="40"/>
      <ellipse cx="100" cy="800" rx="10" ry="8"/> <!-- Tooth 1 -->
      <ellipse cx="100" cy="900" rx="10" ry="8"/> <!-- Tooth 2 -->
      <ellipse cx="50" cy="850" rx="8" ry="10"/> <!-- Tooth 3 -->
      <ellipse cx="150" cy="850" rx="8" ry="10"/> <!-- Tooth 4 -->
      <circle cx="100" cy="850" r="10" class="thin-detail"/>
    </g>

    <!-- Clock 3 (on table) -->
    <ellipse cx="625" cy="750" rx="60" ry="80" class="detail-outline"/>
    <circle cx="625" cy="750" r="35" class="detail-outline"/>
    <line x1="625" y1="750" x2="625" y2="725" class="thin-detail" fill="none"/>
    <line x1="625" y1="750" x2="645" y2="750" class="thin-detail" fill="none"/>

    <!-- Small gear 4 (floating right) -->
    <g class="detail-outline">
      <circle cx="700" cy="600" r="30"/>
      <ellipse cx="700" cy="565" rx="8" ry="6"/> <!-- Tooth 1 -->
      <ellipse cx="700" cy="635" rx="8" ry="6"/> <!-- Tooth 2 -->
      <ellipse cx="665" cy="600" rx="6" ry="8"/> <!-- Tooth 3 -->
      <ellipse cx="735" cy="600" rx="6" ry="8"/> <!-- Tooth 4 -->
      <circle cx="700" cy="600" r="8" class="thin-detail"/>
    </g>
  </g>

  <!-- Rabbit Watchmaker -->
  <g id="rabbit_watchmaker" class="main-outline">
    <!-- Body -->
    <ellipse cx="400" cy="700" rx="150" ry="200"/>

    <!-- Head -->
    <ellipse cx="400" cy="450" rx="100" ry="120"/>

    <!-- Ears -->
    <g transform="translate(330, 270) rotate(-15)">
      <ellipse cx="0" cy="0" rx="40" ry="100"/>
      <path d="M0 -70 Q-10 -30 -10 30 Q-5 60 0 70 Q5 60 10 30 Q10 -30 0 -70 Z" class="thin-detail"/> <!-- Inner ear -->
    </g>
    <g transform="translate(470, 270) rotate(15)">
      <ellipse cx="0" cy="0" rx="40" ry="100"/>
      <path d="M0 -70 Q10 -30 10 30 Q5 60 0 70 Q-5 60 -10 30 Q-10 -30 0 -70 Z" class="thin-detail"/> <!-- Inner ear -->
    </g>

    <!-- Face features -->
    <circle cx="360" cy="430" r="15" class="detail-outline"/> <!-- Eye 1 -->
    <circle cx="440" cy="430" r="15" class="detail-outline"/> <!-- Eye 2 -->
    <path d="M400 450 C395 460 405 460 400 470 Z" class="thin-detail"/> <!-- Nose -->
    <path d="M370 490 Q400 510 430 490" fill="none" class="main-outline" stroke-width="4"/> <!-- Mouth -->

    <!-- Waistcoat (simplified) -->
    <path d="M300 550 C330 570 370 570 400 550 C430 570 470 570 500 550 L500 750 C500 800 450 830 400 830 C350 830 300 800 300 750 Z" class="main-outline"/>
    <path d="M300 550 L400 600 L500 550" class="thin-detail" fill="none"/> <!-- V-neck opening -->
    <circle cx="400" cy="650" r="10" class="detail-outline"/> <!-- Button 1 -->
    <circle cx="400" cy="700" r="10" class="detail-outline"/> <!-- Button 2 -->
    <circle cx="400" cy="750" r="10" class="detail-outline"/> <!-- Button 3 -->

    <!-- Arms (holding watch) -->
    <!-- Left arm -->
    <path d="M280 600 Q250 670 300 740 C350 780 400 780 400 780" class="main-outline"/>
    <!-- Right arm -->
    <path d="M520 600 Q550 670 500 740 C450 780 400 780 400 780" class="main-outline"/>

    <!-- Pocket Watch (held by rabbit) -->
    <g id="pocket_watch" transform="translate(400 780)">
      <circle cx="0" cy="0" r="80" class="main-outline"/>
      <circle cx="0" cy="-80" r="15" class="detail-outline"/> <!-- Loop -->
      <line x1="0" y1="0" x2="0" y2="-50" class="thin-detail" fill="none"/> <!-- Hour hand -->
      <line x1="0" y1="0" x2="40" y2="0" class="thin-detail" fill="none"/> <!-- Minute hand -->
      <!-- Simple tick marks (small lines) -->
      <g class="thin-detail" fill="none">
        <line x1="0" y1="-75" x2="0" y2="-80"/> <!-- 12 o'clock -->
        <g transform="rotate(30)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 1 o'clock -->
        <g transform="rotate(60)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 2 o'clock -->
        <g transform="rotate(90)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 3 o'clock -->
        <g transform="rotate(120)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 4 o'clock -->
        <g transform="rotate(150)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 5 o'clock -->
        <g transform="rotate(180)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 6 o'clock -->
        <g transform="rotate(210)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 7 o'clock -->
        <g transform="rotate(240)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 8 o'clock -->
        <g transform="rotate(270)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 9 o'clock -->
        <g transform="rotate(300)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 10 o'clock -->
        <g transform="rotate(330)"> <line x1="0" y1="-75" x2="0" y2="-80"/> </g> <!-- 11 o'clock -->
      </g>
    </g>

    <!-- Feet/Paws (lower body, implied) -->
    <ellipse cx="320" cy="880" rx="70" ry="40"/>
    <ellipse cx="480" cy="880" rx="70" ry="40"/>
  </g>
</svg>