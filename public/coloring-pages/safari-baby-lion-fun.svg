<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the main lion cub -->
  <g id="lion-cub" stroke="black" stroke-width="4" fill="white">
    <!-- Body -->
    <path d="M250 800 Q150 700 200 550 C250 400 550 400 600 550 Q650 700 550 800 Z" />

    <!-- Head -->
    <path d="M350 550 C300 450 400 350 500 400 C550 450 500 550 450 550 Z" />

    <!-- Left Ear -->
    <ellipse cx="380" cy="380" rx="35" ry="40" />
    <!-- Right Ear -->
    <ellipse cx="480" cy="380" rx="35" ry="40" />

    <!-- Muzzle -->
    <ellipse cx="430" cy="500" rx="60" ry="35" />

    <!-- Nose -->
    <path d="M430 485 Q420 475 410 485 L430 495 L450 485 Q440 475 430 485 Z" />

    <!-- Mouth (smile) -->
    <path d="M400 515 Q430 530 460 515" fill="none" stroke-width="3"/>

    <!-- Left Eye -->
    <circle cx="390" cy="455" r="25" />
    <!-- Right Eye -->
    <circle cx="470" cy="455" r="25" />

    <!-- Left Front Paw (raised, chasing) -->
    <path d="M280 650 C260 600 300 570 340 590 L330 630 L290 660 Z" />
    <!-- Right Front Paw -->
    <path d="M480 650 C460 600 500 570 540 590 L530 630 L490 660 Z" />
    <!-- Left Back Paw -->
    <path d="M280 770 C250 740 270 700 310 700 L320 740 L290 780 Z" />
    <!-- Right Back Paw -->
    <path d="M500 770 C470 740 490 700 530 700 L540 740 L510 780 Z" />

    <!-- Tail -->
    <path d="M600 700 Q650 650 680 700 Q700 750 650 780" fill="none"/>
    <!-- Tail Tuft -->
    <path d="M640 760 Q650 790 670 780 Q680 750 640 760 Z" />

    <!-- Fur texture lines -->
    <path d="M300 580 Q320 570 340 590" fill="none" stroke-width="3"/>
    <path d="M400 580 Q420 570 440 590" fill="none" stroke-width="3"/>
    <path d="M500 580 Q520 570 540 590" fill="none" stroke-width="3"/>
    <path d="M250 700 Q270 680 290 700" fill="none" stroke-width="3"/>
    <path d="M550 700 Q530 680 510 700" fill="none" stroke-width="3"/>
    <path d="M600 750 Q620 730 640 750" fill="none" stroke-width="3"/>
  </g>

  <!-- Group for the butterfly -->
  <g id="butterfly" stroke="black" stroke-width="3" fill="white">
    <!-- Body -->
    <ellipse cx="650" cy="300" rx="10" ry="30" />
    <!-- Top Left Wing -->
    <path d="M640 270 Q600 220 600 250 Q600 300 640 310 Q640 270 640 270 Z" />
    <!-- Top Right Wing -->
    <path d="M660 270 Q700 220 700 250 Q700 300 660 310 Q660 270 660 270 Z" />
    <!-- Bottom Left Wing -->
    <path d="M640 310 Q610 330 620 350 Q630 360 640 310 Z" />
    <!-- Bottom Right Wing -->
    <path d="M660 310 Q690 330 680 350 Q670 360 660 310 Z" />
    <!-- Left Antenna -->
    <path d="M645 270 Q630 240 625 230" fill="none" stroke-width="3"/>
    <circle cx="625" cy="230" r="3" fill="white" stroke="black" stroke-width="2"/>
    <!-- Right Antenna -->
    <path d="M655 270 Q670 240 675 230" fill="none" stroke-width="3"/>
    <circle cx="675" cy="230" r="3" fill="white" stroke="black" stroke-width="2"/>
  </g>

  <!-- Group for background elements (bushes) -->
  <g id="background-elements" stroke="black" stroke-width="4" fill="white">
    <!-- Bush 1 -->
    <path d="M50 850 Q100 750 200 780 Q300 800 280 900 Q200 950 80 900 Z" />
    <!-- Bush 2 -->
    <path d="M750 850 Q700 750 600 780 Q500 800 520 900 Q600 950 720 900 Z" />
  </g>
</svg>