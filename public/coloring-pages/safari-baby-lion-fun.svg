<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1000" fill="white" />

  <!-- SKY ELEMENTS -->
  <g id="sky">
    <!-- Sun -->
    <g id="sun">
      <circle cx="680" cy="160" r="50" fill="white" stroke="black" stroke-width="5" />
      <!-- Sun Rays -->
      <line x1="680" y1="90" x2="680" y2="70" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="680" y1="230" x2="680" y2="250" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="610" y1="160" x2="590" y2="160" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="750" y1="160" x2="770" y2="160" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="630" y1="110" x2="615" y2="95" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="730" y1="210" x2="745" y2="225" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="630" y1="210" x2="615" y2="225" stroke="black" stroke-width="5" stroke-linecap="round" />
      <line x1="730" y1="110" x2="745" y2="95" stroke="black" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Cloud 1 -->
    <path d="M 180 170 
             A 30 30 0 0 1 220 150 
             A 35 35 0 0 1 280 160 
             A 25 25 0 0 1 310 190 
             A 30 30 0 0 1 280 220 
             L 170 220 
             A 25 25 0 0 1 145 195 
             A 25 25 0 0 1 180 170 Z" 
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Cloud 2 -->
    <path d="M 450 210 
             A 25 25 0 0 1 485 195 
             A 30 30 0 0 1 535 205 
             A 20 20 0 0 1 560 230 
             A 25 25 0 0 1 535 255 
             L 445 255 
             A 20 20 0 0 1 425 235 
             A 22 22 0 0 1 450 210 Z" 
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- BACKGROUND LANDSCAPE -->
  <g id="landscape">
    <!-- Distant Hills -->
    <path d="M 0 760 Q 220 710 450 750 T 800 730" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />

    <!-- Acacia Tree -->
    <g id="acacia-tree">
      <!-- Trunk and Branches -->
      <path d="M 110 770 
               C 115 670 100 600 70 540 
               L 95 535 
               C 125 580 135 630 140 670 
               C 155 620 185 570 230 520 
               L 250 530 
               C 200 590 170 650 160 770 Z" 
            fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
      
      <!-- Flat Umbrella Canopy Layers -->
      <!-- Bottom Layer Left -->
      <ellipse cx="70" cy="530" rx="65" ry="22" fill="white" stroke="black" stroke-width="5" />
      <!-- Bottom Layer Right -->
      <ellipse cx="245" cy="520" rx="75" ry="24" fill="white" stroke="black" stroke-width="5" />
      <!-- Middle Main Canopy -->
      <ellipse cx="150" cy="490" rx="130" ry="35" fill="white" stroke="black" stroke-width="5" />
      <!-- Top Canopy Accent -->
      <ellipse cx="140" cy="465" rx="90" ry="25" fill="white" stroke="black" stroke-width="5" />
    </g>

    <!-- Ground Line -->
    <path d="M 0 810 Q 400 780 800 810" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- BABY LION (MAIN CHARACTER) -->
  <g id="baby-lion">

    <!-- TAIL -->
    <g id="tail">
      <!-- Tail Curve -->
      <path d="M 270 710 C 180 700 130 620 150 530" fill="none" stroke="black" stroke-width="16" stroke-linecap="round" />
      <path d="M 270 710 C 180 700 130 620 150 530" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" />
      <!-- Tail Tuft -->
      <path d="M 150 530 C 120 490 140 450 170 470 C 190 480 200 510 175 540 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- MANE (Puffy Flower / Cloud Shapes Behind Head) -->
    <g id="mane">
      <path d="M 400 170 
               A 55 55 0 0 1 485 195 
               A 55 55 0 0 1 555 250 
               A 55 55 0 0 1 590 335 
               A 55 55 0 0 1 580 425 
               A 55 55 0 0 1 530 500 
               A 55 55 0 0 1 450 545 
               A 55 55 0 0 1 350 545 
               A 55 55 0 0 1 270 500 
               A 55 55 0 0 1 220 425 
               A 55 55 0 0 1 210 335 
               A 55 55 0 0 1 245 250 
               A 55 55 0 0 1 315 195 
               A 55 55 0 0 1 400 170 Z" 
            fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />
    </g>

    <!-- BODY -->
    <g id="body">
      <!-- Main Chubby Body -->
      <path d="M 300 500 C 260 580 250 710 290 770 C 330 785 470 785 510 770 C 550 710 540 580 500 500 Z" 
            fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />
      
      <!-- Tummy Patch -->
      <path d="M 340 540 C 310 620 310 710 340 760 C 370 770 430 770 460 760 C 490 710 490 620 460 540 Z" 
            fill="white" stroke="black" stroke-width="4" />
    </g>

    <!-- BACK PAWS (Sitting Paws) -->
    <g id="back-paws">
      <!-- Left Back Paw -->
      <ellipse cx="260" cy="760" rx="50" ry="35" fill="white" stroke="black" stroke-width="5" />
      <path d="M 245 745 L 245 770" stroke="black" stroke-width="4" stroke-linecap="round" />
      <path d="M 270 745 L 270 770" stroke="black" stroke-width="4" stroke-linecap="round" />

      <!-- Right Back Paw -->
      <ellipse cx="540" cy="760" rx="50" ry="35" fill="white" stroke="black" stroke-width="5" />
      <path d="M 530 745 L 530 770" stroke="black" stroke-width="4" stroke-linecap="round" />
      <path d="M 555 745 L 555 770" stroke="black" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- FRONT LEGS AND PAWS -->
    <g id="front-legs">
      <!-- Left Front Leg -->
      <path d="M 335 570 L 330 750 C 330 775 380 775 380 750 L 375 570" 
            fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Toe dividers -->
      <line x1="348" y1="745" x2="348" y2="765" stroke="black" stroke-width="4" stroke-linecap="round" />
      <line x1="363" y1="745" x2="363" y2="765" stroke="black" stroke-width="4" stroke-linecap="round" />

      <!-- Right Front Leg -->
      <path d="M 425 570 L 420 750 C 420 775 470 775 470 750 L 465 570" 
            fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Toe dividers -->
      <line x1="437" y1="745" x2="437" y2="765" stroke="black" stroke-width="4" stroke-linecap="round" />
      <line x1="452" y1="745" x2="452" y2="765" stroke="black" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- HEAD -->
    <g id="head">
      <!-- Base Head Shape -->
      <circle cx="400" cy="360" r="135" fill="white" stroke="black" stroke-width="5" />

      <!-- EARS -->
      <!-- Left Ear -->
      <g id="left-ear">
        <path d="M 285 290 C 230 250 250 170 315 200 C 335 210 340 235 330 260" 
              fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />
        <path d="M 290 270 C 260 240 275 190 310 215" 
              fill="white" stroke="black" stroke-width="4" />
      </g>

      <!-- Right Ear -->
      <g id="right-ear">
        <path d="M 515 290 C 570 250 550 170 485 200 C 465 210 460 235 470 260" 
              fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />
        <path d="M 510 270 C 540 240 525 190 490 215" 
              fill="white" stroke="black" stroke-width="4" />
      </g>

      <!-- FACE FEATURES -->
      <!-- Snout / Muzzle Background Patch -->
      <rect x="325" y="380" width="150" height="70" rx="35" fill="white" stroke="black" stroke-width="4" />

      <!-- Nose -->
      <path d="M 375 390 C 375 375 425 375 425 390 C 425 415 400 425 400 425 C 400 425 375 415 375 390 Z" 
            fill="black" stroke="black" stroke-width="2" stroke-linejoin="round" />

      <!-- Mouth & Tongue -->
      <path d="M 370 425 Q 385 445 400 428 Q 415 445 430 425" 
            fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
      <!-- Cute Tongue -->
      <path d="M 390 434 C 390 455 410 455 410 434 Z" fill="white" stroke="black" stroke-width="3" />

      <!-- Big Cute Eyes -->
      <!-- Left Eye -->
      <g id="left-eye">
        <circle cx="325" cy="325" r="28" fill="black" />
        <!-- Highlights -->
        <circle cx="315" cy="315" r="10" fill="white" />
        <circle cx="335" cy="335" r="5" fill="white" />
      </g>

      <!-- Right Eye -->
      <g id="right-eye">
        <circle cx="475" cy="325" r="28" fill="black" />
        <!-- Highlights -->
        <circle cx="465" cy="315" r="10" fill="white" />
        <circle cx="485" cy="335" r="5" fill="white" />
      </g>

      <!-- Eyebrows -->
      <path d="M 305 285 Q 325 270 345 285" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
      <path d="M 455 285 Q 475 270 495 285" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />

      <!-- Cute Rosy Cheeks -->
      <circle cx="285" cy="365" r="16" fill="white" stroke="black" stroke-width="3" />
      <circle cx="515" cy="365" r="16" fill="white" stroke="black" stroke-width="3" />

      <!-- Freckles / Whiskers Dots -->
      <circle cx="350" cy="405" r="3" fill="black" />
      <circle cx="360" cy="415" r="3" fill="black" />
      <circle cx="348" cy="423" r="3" fill="black" />

      <circle cx="450" cy="405" r="3" fill="black" />
      <circle cx="440" cy="415" r="3" fill="black" />
      <circle cx="452" cy="423" r="3" fill="black" />
    </g>
  </g>

  <!-- FOREGROUND DETAILS (Grass Tufts) -->
  <g id="foreground-details">
    <!-- Grass Tuft Left -->
    <path d="M 60 810 
             C 50 760 20 740 10 730 
             C 30 750 45 770 50 810 
             C 60 750 85 735 100 725 
             C 90 750 80 775 80 810 Z" 
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Grass Tuft Right -->
    <path d="M 700 810 
             C 690 765 660 740 640 730 
             C 665 750 680 775 685 810 
             C 700 760 725 740 750 730 
             C 735 755 720 780 720 810 
             C 735 770 765 755 780 750 
             C 760 775 745 795 745 810 Z" 
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Little Pebbles -->
    <ellipse cx="610" cy="805" rx="14" ry="8" fill="white" stroke="black" stroke-width="3" />
    <ellipse cx="635" cy="812" rx="9" ry="5" fill="white" stroke="black" stroke-width="3" />
    <ellipse cx="180" cy="805" rx="12" ry="7" fill="white" stroke="black" stroke-width="3" />
  </g>
</svg>