<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the ground and distant elements -->
  <g id="safari-background">
    <!-- Simplified ground line -->
    <path d="M0 850 Q200 800 400 850 T800 850" fill="white" stroke="black" stroke-width="4"/>
    <!-- Sun -->
    <circle cx="700" cy="100" r="60" fill="white" stroke="black" stroke-width="4"/>
    <!-- Clouds -->
    <path d="M100 150 Q120 100 160 100 T220 120 T260 150 Q240 180 200 180 T140 160 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M500 80 Q520 40 560 40 T620 60 T660 90 Q640 120 600 120 T540 100 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Simple bushes -->
    <path d="M600 850 C650 780 700 780 750 850 L750 950 L600 950 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M50 850 C100 790 150 790 200 850 L200 950 L50 950 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Group for the baby lion cub -->
  <g id="lion-cub">
    <!-- Body - a rounded blob for a playful pose -->
    <path d="M350 900 C280 880 250 750 300 650 C380 580 500 600 520 750 C540 850 450 920 350 900 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <circle cx="420" cy="580" r="90" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mane tufts (simplified, as overlapping blobs) -->
    <ellipse cx="420" cy="490" rx="80" ry="60" fill="white" stroke="black" stroke-width="4"/> <!-- Top tuft -->
    <ellipse cx="330" cy="590" rx="60" ry="40" fill="white" stroke="black" stroke-width="4"/> <!-- Left tuft -->
    <ellipse cx="510" cy="590" rx="60" ry="40" fill="white" stroke="black" stroke-width="4"/> <!-- Right tuft -->
    <!-- Ears -->
    <circle cx="370" cy="520" r="30" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="470" cy="520" r="30" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snout -->
    <ellipse cx="420" cy="620" rx="40" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <path d="M420 610 L410 630 L430 630 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="390" cy="570" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="450" cy="570" r="15" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth (simple smile) -->
    <path d="M400 640 Q420 650 440 640" fill="none" stroke="black" stroke-width="4"/>
    <!-- Front Paw (playful reach, curved upwards) -->
    <path d="M460 700 C480 650 500 580 520 540 C540 500 520 480 480 490 C440 500 420 530 430 570 C440 620 450 670 460 700 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Other front paw (resting) -->
    <path d="M370 780 C350 760 360 730 390 730 C420 730 430 760 410 780 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Back paw -->
    <path d="M300 820 C280 800 290 770 320 770 C350 770 360 800 340 820 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Tail -->
    <path d="M300 870 Q250 820 280 780 Q320 740 350 750" fill="none" stroke="black" stroke-width="4"/>
    <circle cx="350" cy="750" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Tail tuft -->
  </g>

  <!-- Group for the butterfly -->
  <g id="butterfly">
    <!-- Body -->
    <ellipse cx="580" cy="420" rx="15" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <!-- Top Wings -->
    <path d="M590 380 Q650 320 710 380 C710 440 650 470 590 440 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M570 380 Q510 320 450 380 C450 440 510 470 570 440 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Bottom Wings -->
    <path d="M590 440 Q630 490 660 470 C690 450 650 410 610 420 C610 420 590 440 590 440 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M570 440 Q530 490 500 470 C470 450 510 410 550 420 C550 420 570 440 570 440 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Antennae -->
    <path d="M580 370 Q560 330 540 340" fill="none" stroke="black" stroke-width="4"/>
    <path d="M580 370 Q600 330 620 340" fill="none" stroke="black" stroke-width="4"/>
  </g>
</svg>