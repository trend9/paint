<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Solid white background for the entire canvas -->
  <rect width="800" height="1000" fill="white" />

  <!-- Global Style definitions for thick, child-friendly line art -->
  <g fill="white" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ==================== SKY & SCENERY BACKSTAGE ==================== -->
    <!-- Smiling Sun (Top Left) -->
    <g id="sun" stroke-width="12">
      <!-- Rays -->
      <path d="M 170 90 L 170 60" />
      <path d="M 170 250 L 170 280" />
      <path d="M 90 170 L 60 170" />
      <path d="M 250 170 L 280 170" />
      <path d="M 113 113 L 92 92" />
      <path d="M 227 113 L 248 92" />
      <path d="M 113 217 L 92 238" />
      <path d="M 227 217 L 248 238" />
      <!-- Sun Body -->
      <circle cx="170" cy="170" r="55" fill="white" />
      <!-- Sun Face (Thinner lines for cute expression) -->
      <path d="M 148 165 Q 155 172 162 165" stroke-width="8" fill="none" />
      <path d="M 178 165 Q 185 172 192 165" stroke-width="8" fill="none" />
      <path d="M 155 188 Q 170 202 185 188" stroke-width="8" fill="none" />
    </g>

    <!-- Fluffy Clouds (Top Right) -->
    <g id="cloud" stroke-width="12">
      <path d="M 520 180 C 500 160, 510 130, 535 140 C 555 110, 615 110, 635 140 C 665 130, 685 160, 665 180 Z" fill="white" />
    </g>

    <!-- Cute Butterfly (Floating near Sun) -->
    <g id="butterfly" stroke-width="8">
      <!-- Wings -->
      <path d="M 279 320 C 250 300, 240 330, 279 330 Z" fill="white" stroke-width="10" />
      <path d="M 281 320 C 310 300, 320 330, 281 330 Z" fill="white" stroke-width="10" />
      <path d="M 279 330 C 260 345, 260 355, 279 340 Z" fill="white" stroke-width="10" />
      <path d="M 281 330 C 300 345, 300 355, 281 340 Z" fill="white" stroke-width="10" />
      <!-- Body & Antennae -->
      <path d="M 280 310 Q 283 325 280 345" fill="none" stroke-width="12" />
      <path d="M 280 310 Q 275 300 268 302" fill="none" />
      <path d="M 280 310 Q 285 300 292 302" fill="none" />
    </g>

    <!-- Hanging Jungle Leaves (Top Right) -->
    <g id="hanging-leaves" stroke-width="12">
      <path d="M 770 50 Q 600 80, 500 200" fill="none" />
      <!-- Leaf 1 -->
      <path d="M 680 82 Q 650 140, 610 150 Q 660 110, 680 82 Z" fill="white" />
      <path d="M 680 82 Q 645 120, 610 150" fill="none" stroke-width="8" />
      <!-- Leaf 2 -->
      <path d="M 580 120 Q 530 180, 480 190 Q 540 150, 580 120 Z" fill="white" />
      <path d="M 580 120 Q 535 160, 480 190" fill="none" stroke-width="8" />
    </g>

    <!-- ==================== GROUND & HILLS ==================== -->
    <g id="hills" stroke-width="12">
      <!-- Back Hill -->
      <path d="M 30 850 Q 400 810 770 850 L 770 970 L 30 970 Z" fill="white" />
      <!-- Front Hill -->
      <path d="M 30 910 Q 300 870 770 920 L 770 970 L 30 970 Z" fill="white" />
    </g>

    <!-- Large Framing Jungle Leaves (Bottom Left & Right) -->
    <g id="bottom-leaves" stroke-width="12">
      <!-- Left Leaf -->
      <path d="M 30 830 Q 160 780, 210 670 Q 120 780, 30 830 Z" fill="white" />
      <path d="M 30 830 Q 130 770, 210 670" fill="none" stroke-width="8" />
      <!-- Right Leaf -->
      <path d="M 770 830 Q 640 780, 590 670 Q 680 780, 770 830 Z" fill="white" />
      <path d="M 770 830 Q 670 770, 590 670" fill="none" stroke-width="8" />
    </g>

    <!-- ==================== BABY LION CHARACTER ==================== -->
    <!-- Tail (Drawn behind body layers) -->
    <g id="lion-tail" stroke-width="12">
      <!-- Tail Curve (enclosed shape for coloring) -->
      <path d="M 470 780 C 530 785, 600 750, 600 680 C 600 660, 620 660, 620 680 C 620 770, 540 805, 470 800 Z" fill="white" />
      <!-- Fluffy Tail Tuft -->
      <path d="M 610 675 C 590 655, 590 615, 610 605 C 630 615, 630 655, 610 675 Z" fill="white" />
      <path d="M 610 615 Q 610 640, 610 665" fill="none" stroke-width="6" />
    </g>

    <!-- Hind Feet & Legs -->
    <g id="lion-hind-legs" stroke-width="12">
      <!-- Left Foot & Toes -->
      <circle cx="225" cy="785" r="15" fill="white" />
      <circle cx="260" cy="770" r="15" fill="white" />
      <circle cx="295" cy="785" r="15" fill="white" />
      <ellipse cx="260" cy="825" rx="42" ry="30" fill="white" />
      <!-- Left Paw Pads (Thinner outlines for internal details) -->
      <ellipse cx="260" cy="825" rx="25" ry="17" fill="white" stroke-width="8" />
      <circle cx="225" cy="785" r="7" fill="white" stroke-width="6" />
      <circle cx="260" cy="770" r="7" fill="white" stroke-width="6" />
      <circle cx="295" cy="785" r="7" fill="white" stroke-width="6" />

      <!-- Right Foot & Toes -->
      <circle cx="505" cy="785" r="15" fill="white" />
      <circle cx="540" cy="770" r="15" fill="white" />
      <circle cx="575" cy="785" r="15" fill="white" />
      <ellipse cx="540" cy="825" rx="42" ry="30" fill="white" />
      <!-- Right Paw Pads -->
      <ellipse cx="540" cy="825" rx="25" ry="17" fill="white" stroke-width="8" />
      <circle cx="505" cy="785" r="7" fill="white" stroke-width="6" />
      <circle cx="540" cy="770" r="7" fill="white" stroke-width="6" />
      <circle cx="575" cy="785" r="7" fill="white" stroke-width="6" />
    </g>

    <!-- Torso/Body (Behind front legs) -->
    <g id="lion-torso" stroke-width="12">
      <path d="M 330 680 C 290 740, 290 820, 400 845 C 510 820, 510 740, 470 680 Z" fill="white" />
    </g>

    <!-- Front Legs (In front of torso) -->
    <g id="lion-front-legs" stroke-width="12">
      <!-- Left Front Leg -->
      <path d="M 335 680 L 335 830 C 335 855, 375 855, 375 830 L 375 680 Z" fill="white" />
      <path d="M 348 835 L 348 850" stroke-width="8" fill="none" />
      <path d="M 362 835 L 362 850" stroke-width="8" fill="none" />

      <!-- Right Front Leg -->
      <path d="M 425 680 L 425 830 C 425 855, 465 855, 465 830 L 465 680 Z" fill="white" />
      <path d="M 438 835 L 438 850" stroke-width="8" fill="none" />
      <path d="M 452 835 L 452 850" stroke-width="8" fill="none" />
    </g>

    <!-- Beautiful Scalloped Mane -->
    <!-- Formed of mathematically perfect arcs looping around the head center (400, 520) -->
    <g id="lion-mane" stroke-width="12">
      <path d="M 400 370 
               A 55 55 0 0 1 475 390 
               A 55 55 0 0 1 530 445 
               A 55 55 0 0 1 550 520 
               A 55 55 0 0 1 530 595 
               A 55 55 0 0 1 475 650 
               A 55 55 0 0 1 400 670 
               A 55 55 0 0 1 325 650 
               A 55 55 0 0 1 270 595 
               A 55 55 0 0 1 250 520 
               A 55 55 0 0 1 270 445 
               A 55 55 0 0 1 325 390 
               A 55 55 0 0 1 400 370 Z" fill="white" />
    </g>

    <!-- Ears (Overlapping mane, behind face) -->
    <g id="lion-ears" stroke-width="12">
      <!-- Left Ear -->
      <circle cx="305" cy="405" r="50" fill="white" />
      <circle cx="305" cy="405" r="30" fill="white" stroke-width="8" />
      <!-- Right Ear -->
      <circle cx="495" cy="405" r="50" fill="white" />
      <circle cx="495" cy="405" r="30" fill="white" stroke-width="8" />
    </g>

    <!-- Head & Cute Face -->
    <g id="lion-head" stroke-width="12">
      <!-- Main Face Circle -->
      <circle cx="400" cy="530" r="125" fill="white" />

      <!-- Cute Eyebrows -->
      <path d="M 330 475 Q 350 465 370 475" fill="none" stroke-width="10" />
      <path d="M 430 475 Q 450 465 470 475" fill="none" stroke-width="10" />

      <!-- Big Adorable Eyes (Colorable Outer Ring + Shiny Pupil) -->
      <!-- Left Eye -->
      <circle cx="350" cy="515" r="22" fill="white" stroke-width="10" />
      <circle cx="350" cy="515" r="13" fill="black" />
      <circle cx="346" cy="510" r="5" fill="white" stroke="none" />
      <!-- Right Eye -->
      <circle cx="450" cy="515" r="22" fill="white" stroke-width="10" />
      <circle cx="450" cy="515" r="13" fill="black" />
      <circle cx="446" cy="510" r="5" fill="white" stroke="none" />

      <!-- Sweet Nose (Heart/Rounded Triangle Shape) -->
      <path d="M 385 555 Q 400 545 415 555 Q 415 570 400 580 Q 385 570 385 555 Z" fill="white" stroke-width="10" />

      <!-- Happy Puppy Smile -->
      <path d="M 400 580 L 400 590" fill="none" stroke-width="10" />
      <path d="M 400 590 Q 385 605 370 595" fill="none" stroke-width="10" />
      <path d="M 400 590 Q 415 605 430 595" fill="none" stroke-width="10" />
      <!-- Playful Tongue -->
      <path d="M 387 598 Q 400 622 413 598 Z" fill="white" stroke-width="8" />

      <!-- Cute Cheek Blush Circles -->
      <circle cx="305" cy="565" r="12" fill="white" stroke-width="6" />
      <circle cx="495" cy="565" r="12" fill="white" stroke-width="6" />

      <!-- Whiskers -->
      <path d="M 310 565 L 280 562" fill="none" stroke-width="8" />
      <path d="M 310 575 L 280 575" fill="none" stroke-width="8" />
      <path d="M 310 585 L 280 588" fill="none" stroke-width="8" />
      
      <path d="M 490 565 L 520 562" fill="none" stroke-width="8" />
      <path d="M 490 575 L 520 575" fill="none" stroke-width="8" />
      <path d="M 490 585 L 520 588" fill="none" stroke-width="8" />
    </g>

    <!-- ==================== FOREGROUND DETAILS ==================== -->
    <!-- Sweet Flowers and Grass on the ground -->
    <g id="foreground-details">
      <!-- Left Flower Group -->
      <g stroke-width="10">
        <!-- Stem & Leaf -->
        <path d="M 130 885 L 130 920" fill="none" stroke-width="12" />
        <path d="M 130 900 Q 110 900 115 890 Q 125 890 130 900" fill="white" />
        <!-- Petals -->
        <circle cx="130" cy="848" r="13" fill="white" />
        <circle cx="151" cy="860" r="13" fill="white" />
        <circle cx="143" cy="884" r="13" fill="white" />
        <circle cx="117" cy="884" r="13" fill="white" />
        <circle cx="109" cy="860" r="13" fill="white" />
        <!-- Center -->
        <circle cx="130" cy="867" r="13" fill="white" stroke-width="10" />
      </g>

      <!-- Right Flower Group -->
      <g stroke-width="10">
        <!-- Stem & Leaf -->
        <path d="M 670 895 L 670 930" fill="none" stroke-width="12" />
        <path d="M 670 910 Q 690 910 685 900 Q 675 900 670 910" fill="white" />
        <!-- Petals -->
        <circle cx="670" cy="858" r="13" fill="white" />
        <circle cx="691" cy="870" r="13" fill="white" />
        <circle cx="683" cy="894" r="13" fill="white" />
        <circle cx="657" cy="894" r="13" fill="white" />
        <circle cx="649" cy="870" r="13" fill="white" />
        <!-- Center -->
        <circle cx="670" cy="877" r="13" fill="white" stroke-width="10" />
      </g>

      <!-- Friendly Grass Tufts -->
      <g stroke-width="10" fill="none">
        <path d="M 200 840 Q 205 810 215 815 Q 205 825 208 842" />
        <path d="M 208 842 Q 215 820 225 825 Q 215 835 216 845" />
        
        <path d="M 590 840 Q 585 810 575 815 Q 585 825 582 842" />
        <path d="M 582 842 Q 575 820 565 825 Q 575 835 574 845" />
      </g>
    </g>

    <!-- ==================== PAGE BORDER ==================== -->
    <!-- Thick framing border with rounded corners for toddler coloring book aesthetic -->
    <rect x="30" y="30" width="740" height="940" rx="35" fill="none" stroke="black" stroke-width="18" />

  </g>
</svg>