<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Background Elements -->
  <g id="background">
    <!-- Ground Line -->
    <path d="M0 750 Q200 730 400 750 Q600 770 800 750 L800 1000 L0 1000 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Distant Acacia Tree -->
    <g id="acacia_tree">
      <path d="M650 750 L640 600 Q650 590 660 600 L650 750 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Trunk -->
      <path d="M600 620 C580 580 600 550 630 540 C660 530 690 550 710 580 C730 610 700 640 670 650 C640 660 620 640 600 620 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Canopy -->
    </g>

    <!-- Fluffy Clouds -->
    <path d="M100 150 C70 150 50 170 50 200 C50 230 70 250 100 250 C130 250 150 230 150 200 C150 170 130 150 100 150 Z M150 200 C130 200 120 220 120 240 C120 260 130 280 150 280 C170 280 180 260 180 240 C180 220 170 200 150 200 Z M200 200 C180 200 170 220 170 240 C170 260 180 280 200 280 C220 280 230 260 230 240 C230 220 220 200 200 200 Z M250 200 C230 200 220 220 220 240 C220 260 230 280 250 280 C270 280 280 260 280 240 C280 220 270 200 250 200 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M550 100 C520 100 500 120 500 150 C500 180 520 200 550 200 C580 200 600 180 600 150 C600 120 580 100 550 100 Z M600 150 C580 150 570 170 570 190 C570 210 580 230 600 230 C620 230 630 210 630 190 C630 170 620 150 600 150 Z M650 150 C630 150 620 170 620 190 C620 210 630 230 650 230 C670 230 680 210 680 190 C680 170 670 150 650 150 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Happy Baby Lion Cub -->
  <g id="lion_cub">
    <!-- Body -->
    <path d="M400 680 C300 680 280 550 350 500 C420 450 520 470 550 550 C580 630 500 680 400 680 Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Head -->
    <ellipse cx="400" cy="450" rx="140" ry="120" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Ears -->
    <ellipse cx="300" cy="360" rx="50" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="500" cy="360" rx="50" ry="40" fill="white" stroke="black" stroke-width="4"/>

    <!-- Snout -->
    <ellipse cx="400" cy="480" rx="70" ry="40" fill="white" stroke="black" stroke-width="4"/>

    <!-- Nose -->
    <path d="M400 460 C390 450 380 460 380 470 C380 480 390 490 400 490 C410 490 420 480 420 470 C420 460 410 450 400 460 Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Mouth -->
    <path d="M370 500 Q400 520 430 500" fill="none" stroke="black" stroke-width="4"/>
    
    <!-- Eyes -->
    <circle cx="360" cy="430" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="440" cy="430" r="15" fill="white" stroke="black" stroke-width="4"/>

    <!-- Front Paws (pouncing) -->
    <path d="M300 620 C280 600 270 560 290 540 C310 520 340 530 350 560 L360 620 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M480 600 C470 580 460 540 480 520 C500 500 530 510 540 540 L550 600 Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Back Legs -->
    <path d="M300 740 C280 720 280 680 300 660 C320 640 350 650 360 680 L360 740 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M490 740 C470 720 470 680 490 660 C510 640 540 650 550 680 L550 740 Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Tail -->
    <path d="M530 650 Q580 600 600 650 Q620 700 580 720" fill="none" stroke="black" stroke-width="4"/>
    <circle cx="580" cy="720" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Fluffy tip -->
  </g>

  <!-- Small Butterfly -->
  <g id="butterfly">
    <!-- Body -->
    <ellipse cx="460" cy="500" rx="10" ry="25" fill="white" stroke="black" stroke-width="3"/>
    
    <!-- Wings -->
    <path d="M460 475 Q420 450 400 470 C380 490 400 520 460 525 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left top wing -->
    <path d="M460 525 Q420 550 400 530 C380 510 400 480 460 475 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left bottom wing -->
    <path d="M460 475 Q500 450 520 470 C540 490 520 520 460 525 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right top wing -->
    <path d="M460 525 Q500 550 520 530 C540 510 520 480 460 475 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right bottom wing -->
    
    <!-- Antennae -->
    <path d="M455 470 Q445 440 435 445" fill="none" stroke="black" stroke-width="3"/>
    <path d="M465 470 Q475 440 485 445" fill="none" stroke="black" stroke-width="3"/>
  </g>
</svg>