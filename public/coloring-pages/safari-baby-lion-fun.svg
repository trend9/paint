<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Page Fill -->
  <rect width="800" height="1000" fill="white"/>

  <!-- ================= BACKGROUND ELEMENTS ================= -->
  <!-- Sun -->
  <g id="sun">
    <!-- Sun Rays -->
    <path d="M 650 60 L 650 30 M 650 270 L 650 300 M 545 165 L 515 165 M 755 165 L 785 165 M 575 90 L 553 68 M 725 240 L 747 262 M 575 240 L 553 262 M 725 90 L 747 68" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Sun Main Circle -->
    <circle cx="650" cy="165" r="65" fill="white" stroke="black" stroke-width="5"/>
    <!-- Sun Face -->
    <circle cx="628" cy="150" r="7" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="672" cy="150" r="7" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 625 178 Q 650 205 675 178" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Sun Cheeks -->
    <circle cx="612" cy="168" r="8" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="688" cy="168" r="8" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Clouds -->
  <g id="clouds">
    <!-- Top Left Cloud -->
    <path d="M 90 190 C 70 190 50 170 60 145 C 50 120 75 95 105 100 C 120 75 160 75 180 95 C 205 80 235 95 235 120 C 255 125 265 155 245 175 C 260 195 240 220 215 215 C 195 230 160 225 150 205 C 130 220 100 210 90 190 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Small Cloud Middle -->
    <path d="M 360 130 C 345 130 335 115 340 100 C 330 85 350 65 370 70 C 380 50 410 50 425 65 C 440 55 460 65 460 85 C 475 90 480 110 465 125 C 450 140 420 135 410 125 C 395 138 370 138 360 130 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Ground Lines -->
  <g id="ground">
    <path d="M -10 820 Q 200 780 400 810 T 810 790" fill="none" stroke="black" stroke-width="5"/>
    <path d="M -10 900 Q 250 860 500 890 T 810 870" fill="none" stroke="black" stroke-width="4"/>
  </g>

  <!-- Left Palm Tree -->
  <g id="left-palm">
    <!-- Trunk -->
    <path d="M 90 820 Q 130 620 110 430 L 155 430 Q 175 620 145 820 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Trunk Ridges -->
    <path d="M 112 730 Q 132 742 150 730" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 110 640 Q 133 652 153 640" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 111 540 Q 132 552 150 540" fill="none" stroke="black" stroke-width="4"/>
    <!-- Leaves -->
    <path d="M 130 430 Q 30 400 10 470 Q 70 490 130 430 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 130 430 Q 30 300 80 240 Q 120 310 130 430 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 130 430 Q 170 280 240 280 Q 200 360 130 430 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 130 430 Q 240 370 260 440 Q 190 460 130 430 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Coconuts -->
    <circle cx="115" cy="445" r="16" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="142" cy="448" r="16" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Right Palm Tree -->
  <g id="right-palm">
    <!-- Trunk -->
    <path d="M 670 800 Q 640 610 665 440 L 710 440 Q 685 610 720 800 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Trunk Ridges -->
    <path d="M 662 710 Q 685 722 708 710" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 652 610 Q 678 622 700 610" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 655 510 Q 678 522 698 510" fill="none" stroke="black" stroke-width="4"/>
    <!-- Leaves -->
    <path d="M 685 440 Q 780 420 800 490 Q 740 510 685 440 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 685 440 Q 750 310 700 260 Q 660 340 685 440 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 685 440 Q 590 300 520 330 Q 580 390 685 440 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 685 440 Q 570 420 550 490 Q 610 500 685 440 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Coconuts -->
    <circle cx="670" cy="455" r="16" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="698" cy="455" r="16" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Butterfly -->
  <g id="butterfly">
    <!-- Flight Trail -->
    <path d="M 220 320 Q 250 300 270 330 T 300 340" fill="none" stroke="black" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
    <!-- Antennae -->
    <path d="M 320 310 Q 310 290 295 295" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 324 310 Q 330 290 345 290" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <!-- Wings Left -->
    <path d="M 318 320 Q 260 280 270 330 Q 280 360 318 335 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 318 335 Q 270 355 285 385 Q 310 395 320 345 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <!-- Wings Right -->
    <path d="M 326 320 Q 384 280 374 330 Q 364 360 326 335 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 326 335 Q 374 355 359 385 Q 334 395 324 345 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <!-- Body -->
    <ellipse cx="322" cy="330" rx="7" ry="22" fill="white" stroke="black" stroke-width="4"/>
    <!-- Wing Spots -->
    <circle cx="295" cy="325" r="7" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="349" cy="325" r="7" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Decorative Ground Plants / Flowers -->
  <g id="flowers">
    <!-- Left Flower -->
    <path d="M 210 830 Q 200 800 210 770" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 800 Q 180 790 190 780 Z" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="210" cy="765" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="210" cy="745" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="228" cy="758" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="220" cy="777" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="198" cy="775" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="192" cy="758" r="10" fill="white" stroke="black" stroke-width="4"/>

    <!-- Right Grass Tuft -->
    <path d="M 570 820 Q 560 770 540 760 Q 570 780 580 815 Q 600 765 620 755 Q 600 785 595 820 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  </g>


  <!-- ================= MAIN BABY LION CUB ================= -->
  <g id="baby-lion">

    <!-- Lion Tail -->
    <g id="lion-tail">
      <path d="M 515 700 C 620 680 630 580 610 520 C 600 490 620 460 640 450 C 655 480 635 520 645 530 C 665 520 670 660 525 725 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <!-- Fluffy Tail Tip -->
      <path d="M 640 450 C 625 430 635 400 660 405 C 675 390 705 400 705 420 C 720 435 710 465 685 465 C 675 480 645 475 640 450 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- Fluffy Lion Mane (Behind Head) -->
    <path d="M 400 350 
             C 435 340 465 360 480 385 
             C 510 380 535 405 535 435 
             C 560 455 565 490 550 520 
             C 570 545 560 580 535 600 
             C 535 630 505 650 475 650 
             C 455 670 420 675 390 670 
             C 360 675 325 665 305 645 
             C 275 645 250 620 245 590 
             C 220 575 215 540 230 515 
             C 220 485 225 450 250 430 
             C 255 400 280 375 310 380 
             C 330 355 365 340 400 350 Z" 
          fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>

    <!-- Back Left Leg (Folded Sitting) -->
    <g id="back-left-leg">
      <path d="M 280 620 C 210 630 200 740 270 770 C 320 780 350 740 330 700 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <!-- Hind Paw Pad -->
      <ellipse cx="260" cy="720" rx="22" ry="16" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="240" cy="690" r="6" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="260" cy="685" r="6" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="280" cy="693" r="6" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Back Right Leg (Folded Sitting) -->
    <g id="back-right-leg">
      <path d="M 510 620 C 580 630 590 740 520 770 C 470 780 440 740 460 700 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <!-- Hind Paw Pad -->
      <ellipse cx="530" cy="720" rx="22" ry="16" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="510" cy="693" r="6" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="530" cy="685" r="6" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="550" cy="690" r="6" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Body / Torso & Tummy -->
    <g id="lion-body">
      <path d="M 320 570 L 320 720 C 320 760 470 760 470 720 L 470 570 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <!-- Cute Chubby Tummy Patch -->
      <path d="M 350 590 C 350 730 440 730 440 590 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Front Left Leg (Reaching / Playful) -->
    <g id="front-left-leg">
      <path d="M 335 600 L 315 740 C 315 765 365 765 375 740 L 380 600 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <!-- Toe Separatons -->
      <path d="M 335 745 L 335 760" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <path d="M 355 745 L 355 760" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Front Right Leg (Paws Up / Playful Pounce) -->
    <g id="front-right-leg">
      <path d="M 415 600 L 420 740 C 430 765 480 765 480 740 L 460 600 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <!-- Toe Separations -->
      <path d="M 440 745 L 440 760" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <path d="M 460 745 L 460 760" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Head Outline -->
    <g id="lion-head">
      <ellipse cx="395" cy="495" rx="95" ry="85" fill="white" stroke="black" stroke-width="5"/>

      <!-- Left Ear -->
      <path d="M 315 435 C 270 410 280 340 335 365 C 345 390 335 420 315 435 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 315 415 C 290 400 295 365 330 380" fill="white" stroke="black" stroke-width="4" stroke-linecap="round"/>

      <!-- Right Ear -->
      <path d="M 475 435 C 520 410 510 340 455 365 C 445 390 455 420 475 435 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 475 415 C 500 400 495 365 460 380" fill="white" stroke="black" stroke-width="4" stroke-linecap="round"/>

      <!-- Muzzle / Snout -->
      <ellipse cx="395" cy="520" rx="42" ry="28" fill="white" stroke="black" stroke-width="4"/>

      <!-- Nose -->
      <path d="M 380 500 C 390 495 400 495 410 500 C 418 510 405 525 395 525 C 385 525 372 510 380 500 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>

      <!-- Happy Mouth -->
      <path d="M 395 525 L 395 533 M 395 533 Q 375 545 365 533 M 395 533 Q 415 545 425 533" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <!-- Open Smile Drop (Tongue area) -->
      <path d="M 373 537 Q 395 565 417 537" fill="white" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <path d="M 383 548 Q 395 558 407 548" fill="none" stroke="black" stroke-width="3"/>

      <!-- Eyes (Big Toddler-Friendly Cartoon Eyes) -->
      <!-- Left Eye -->
      <ellipse cx="345" cy="475" rx="18" ry="24" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="350" cy="475" rx="10" ry="14" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="353" cy="470" r="4" fill="white" stroke="black" stroke-width="2"/>

      <!-- Right Eye -->
      <ellipse cx="445" cy="475" rx="18" ry="24" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="440" cy="475" rx="10" ry="14" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="443" cy="470" r="4" fill="white" stroke="black" stroke-width="2"/>

      <!-- Eyebrows -->
      <path d="M 330 440 Q 345 430 360 442" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <path d="M 430 442 Q 445 430 460 440" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

      <!-- Cute Cheek Circles -->
      <circle cx="322" cy="510" r="10" fill="white" stroke="black" stroke-width="3" stroke-dasharray="3 3"/>
      <circle cx="468" cy="510" r="10" fill="white" stroke="black" stroke-width="3" stroke-dasharray="3 3"/>

      <!-- Whiskers -->
      <path d="M 345 515 L 305 505 M 342 523 L 300 523 M 345 530 L 308 540" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <path d="M 445 515 L 485 505 M 448 523 L 490 523 M 445 530 L 482 540" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

      <!-- Hair Tuft on Forehead -->
      <path d="M 385 412 Q 395 390 405 412 Q 415 395 420 415" fill="white" stroke="black" stroke-width="4" stroke-linecap="round"/>
    </g>

  </g>

</svg>