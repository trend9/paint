<svg viewBox="0 0 800 1000">
  <!-- Global styling for outlines and fills -->
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .outline-thick {
        stroke: black;
        stroke-width: 5;
        fill: white;
      }
      .outline-thin {
        stroke: black;
        stroke-width: 3;
        fill: white;
      }
      .no-fill {
        fill: none;
      }
    </style>
  </defs>

  <!-- Landscape: Ice Cream Mountains and Cookie Trees -->
  <g id="landscape">
    <!-- Mountains -->
    <path d="M 0 750 Q 200 650 400 700 T 800 600 V 1000 H 0 Z" class="outline-thick"/>
    <path d="M 0 850 Q 150 780 300 800 T 600 750 T 800 820 V 1000 H 0 Z" class="outline-thick"/>

    <!-- Cookie Trees -->
    <g id="tree1" transform="translate(100, 550)">
      <rect x="0" y="200" width="40" height="100" rx="10" ry="10" class="outline"/>
      <circle cx="20" cy="150" r="70" class="outline-thick"/>
      <circle cx="0" cy="130" r="15" class="outline-thin"/>
      <circle cx="50" cy="160" r="12" class="outline-thin"/>
      <circle cx="20" cy="100" r="10" class="outline-thin"/>
    </g>
    <g id="tree2" transform="translate(600, 500)">
      <rect x="0" y="200" width="40" height="120" rx="10" ry="10" class="outline"/>
      <circle cx="20" cy="150" r="80" class="outline-thick"/>
      <circle cx="5" cy="110" r="18" class="outline-thin"/>
      <circle cx="55" cy="140" r="15" class="outline-thin"/>
      <circle cx="25" cy="90" r="13" class="outline-thin"/>
    </g>
  </g>

  <!-- Sky elements -->
  <g id="sky-elements">
    <!-- Sun -->
    <circle cx="700" cy="100" r="60" class="outline-thick"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" transform="rotate(30 700 100)" class="outline"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" transform="rotate(90 700 100)" class="outline"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" transform="rotate(150 700 100)" class="outline"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" transform="rotate(210 700 100)" class="outline"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" transform="rotate(270 700 100)" class="outline"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" transform="rotate(330 700 100)" class="outline"/>
    <rect x="630" y="85" width="20" height="10" rx="2" ry="2" class="outline"/>

    <!-- Clouds -->
    <path d="M 100 150 Q 130 100 180 120 T 250 100 T 320 150 T 200 180 Z" class="outline-thick"/>
    <path d="M 400 200 Q 430 150 480 170 T 550 150 T 620 200 T 500 230 Z" class="outline-thick"/>
  </g>

  <!-- Candy Train -->
  <g id="candy-train" transform="translate(50, 600)">
    <!-- Locomotive Body -->
    <rect x="0" y="0" width="200" height="100" rx="20" ry="20" class="outline-thick"/>
    <rect x="150" y="-50" width="50" height="50" rx="10" ry="10" class="outline"/> <!-- Cab -->
    <rect x="10" y="-80" width="40" height="70" rx="10" ry="10" class="outline"/> <!-- Chimney -->
    <ellipse cx="30" cy="-85" rx="25" ry="10" class="outline"/> <!-- Chimney top -->
    <path d="M 200 60 Q 220 50 220 80 L 200 100 Z" class="outline"/> <!-- Front bumper/cowcatcher -->

    <!-- Locomotive Window -->
    <rect x="160" y="-40" width="30" height="30" rx="5" ry="5" class="outline-thin"/>

    <!-- Lollipop Wheels for Locomotive -->
    <g transform="translate(50, 115)">
      <circle cx="0" cy="0" r="35" class="outline-thick"/>
      <path d="M 0 0 A 25 25 0 1 1 25 0 L 0 0 A 15 15 0 1 0 15 0 L 0 0" class="outline-thin no-fill"/>
      <path d="M 0 0 A 25 25 0 1 0 25 0 L 0 0 A 15 15 0 1 1 15 0 L 0 0" class="outline-thin no-fill"/>
      <circle cx="0" cy="0" r="10" class="outline-thin"/>
    </g>
    <g transform="translate(150, 115)">
      <circle cx="0" cy="0" r="35" class="outline-thick"/>
      <path d="M 0 0 A 25 25 0 1 1 25 0 L 0 0 A 15 15 0 1 0 15 0 L 0 0" class="outline-thin no-fill"/>
      <path d="M 0 0 A 25 25 0 1 0 25 0 L 0 0 A 15 15 0 1 1 15 0 L 0 0" class="outline-thin no-fill"/>
      <circle cx="0" cy="0" r="10" class="outline-thin"/>
    </g>

    <!-- Wagon 1 -->
    <g id="wagon1" transform="translate(230, 10)">
      <rect x="0" y="0" width="150" height="90" rx="20" ry="20" class="outline-thick"/>
      <rect x="30" y="20" width="90" height="50" rx="10" ry="10" class="outline"/> <!-- Window -->
      <!-- Gummy Bear 1 -->
      <g class="gummy-bear" transform="translate(75, 45)">
        <circle cx="0" cy="-20" r="25" class="outline-thin"/> <!-- Head -->
        <circle cx="-15" cy="-40" r="10" class="outline-thin"/> <!-- Ear 1 -->
        <circle cx="15" cy="-40" r="10" class="outline-thin"/> <!-- Ear 2 -->
        <circle cx="-8" cy="-25" r="3" class="outline-thin no-fill"/> <!-- Eye 1 -->
        <circle cx="8" cy="-25" r="3" class="outline-thin no-fill"/> <!-- Eye 2 -->
        <path d="M -10 -15 Q 0 -5 10 -15" class="outline-thin no-fill"/> <!-- Mouth -->
      </g>
      <!-- Lollipop Wheels -->
      <g transform="translate(40, 105)">
        <circle cx="0" cy="0" r="30" class="outline-thick"/>
        <path d="M 0 0 A 20 20 0 1 1 20 0 L 0 0 A 12 12 0 1 0 12 0 L 0 0" class="outline-thin no-fill"/>
        <path d="M 0 0 A 20 20 0 1 0 20 0 L 0 0 A 12 12 0 1 1 12 0 L 0 0" class="outline-thin no-fill"/>
        <circle cx="0" cy="0" r="8" class="outline-thin"/>
      </g>
      <g transform="translate(110, 105)">
        <circle cx="0" cy="0" r="30" class="outline-thick"/>
        <path d="M 0 0 A 20 20 0 1 1 20 0 L 0 0 A 12 12 0 1 0 12 0 L 0 0" class="outline-thin no-fill"/>
        <path d="M 0 0 A 20 20 0 1 0 20 0 L 0 0 A 12 12 0 1 1 12 0 L 0 0" class="outline-thin no-fill"/>
        <circle cx="0" cy="0" r="8" class="outline-thin"/>
      </g>
    </g>

    <!-- Connector 1-2 -->
    <rect x="195" y="60" width="35" height="15" rx="5" ry="5" class="outline"/>

    <!-- Wagon 2 -->
    <g id="wagon2" transform="translate(410, 10)">
      <rect x="0" y="0" width="150" height="90" rx="20" ry="20" class="outline-thick"/>
      <rect x="30" y="20" width="90" height="50" rx="10" ry="10" class="outline"/> <!-- Window -->
      <!-- Gummy Bear 2 -->
      <g class="gummy-bear" transform="translate(75, 45)">
        <circle cx="0" cy="-20" r="25" class="outline-thin"/> <!-- Head -->
        <circle cx="-15" cy="-40" r="10" class="outline-thin"/> <!-- Ear 1 -->
        <circle cx="15" cy="-40" r="10" class="outline-thin"/> <!-- Ear 2 -->
        <circle cx="-8" cy="-25" r="3" class="outline-thin no-fill"/> <!-- Eye 1 -->
        <circle cx="8" cy="-25" r="3" class="outline-thin no-fill"/> <!-- Eye 2 -->
        <path d="M -10 -15 Q 0 -5 10 -15" class="outline-thin no-fill"/> <!-- Mouth -->
      </g>
      <!-- Lollipop Wheels -->
      <g transform="translate(40, 105)">
        <circle cx="0" cy="0" r="30" class="outline-thick"/>
        <path d="M 0 0 A 20 20 0 1 1 20 0 L 0 0 A 12 12 0 1 0 12 0 L 0 0" class="outline-thin no-fill"/>
        <path d="M 0 0 A 20 20 0 1 0 20 0 L 0 0 A 12 12 0 1 1 12 0 L 0 0" class="outline-thin no-fill"/>
        <circle cx="0" cy="0" r="8" class="outline-thin"/>
      </g>
      <g transform="translate(110, 105)">
        <circle cx="0" cy="0" r="30" class="outline-thick"/>
        <path d="M 0 0 A 20 20 0 1 1 20 0 L 0 0 A 12 12 0 1 0 12 0 L 0 0" class="outline-thin no-fill"/>
        <path d="M 0 0 A 20 20 0 1 0 20 0 L 0 0 A 12 12 0 1 1 12 0 L 0 0" class="outline-thin no-fill"/>
        <circle cx="0" cy="0" r="8" class="outline-thin"/>
      </g>
    </g>

    <!-- Connector 2-3 -->
    <rect x="385" y="60" width="35" height="15" rx="5" ry="5" class="outline"/>

    <!-- Wagon 3 -->
    <g id="wagon3" transform="translate(590, 10)">
      <rect x="0" y="0" width="150" height="90" rx="20" ry="20" class="outline-thick"/>
      <rect x="30" y="20" width="90" height="50" rx="10" ry="10" class="outline"/> <!-- Window -->
      <!-- Gummy Bear 3 -->
      <g class="gummy-bear" transform="translate(75, 45)">
        <circle cx="0" cy="-20" r="25" class="outline-thin"/> <!-- Head -->
        <circle cx="-15" cy="-40" r="10" class="outline-thin"/> <!-- Ear 1 -->
        <circle cx="15" cy="-40" r="10" class="outline-thin"/> <!-- Ear 2 -->
        <circle cx="-8" cy="-25" r="3" class="outline-thin no-fill"/> <!-- Eye 1 -->
        <circle cx="8" cy="-25" r="3" class="outline-thin no-fill"/> <!-- Eye 2 -->
        <path d="M -10 -15 Q 0 -5 10 -15" class="outline-thin no-fill"/> <!-- Mouth -->
      </g>
      <!-- Lollipop Wheels -->
      <g transform="translate(40, 105)">
        <circle cx="0" cy="0" r="30" class="outline-thick"/>
        <path d="M 0 0 A 20 20 0 1 1 20 0 L 0 0 A 12 12 0 1 0 12 0 L 0 0" class="outline-thin no-fill"/>
        <path d="M 0 0 A 20 20 0 1 0 20 0 L 0 0 A 12 12 0 1 1 12 0 L 0 0" class="outline-thin no-fill"/>
        <circle cx="0" cy="0" r="8" class="outline-thin"/>
      </g>
      <g transform="translate(110, 105)">
        <circle cx="0" cy="0" r="30" class="outline-thick"/>
        <path d="M 0 0 A 20 20 0 1 1 20 0 L 0 0 A 12 12 0 1 0 12 0 L 0 0" class="outline-thin no-fill"/>
        <path d="M 0 0 A 20 20 0 1 0 20 0 L 0 0 A 12 12 0 1 1 12 0 L 0 0" class="outline-thin no-fill"/>
        <circle cx="0" cy="0" r="8" class="outline-thin"/>
      </g>
    </g>
  </g>

</svg>