<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Fairy -->
  <g id="fairy">
    <!-- Body -->
    <ellipse cx="400" cy="550" rx="40" ry="70" fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <circle cx="400" cy="460" r="50" fill="white" stroke="black" stroke-width="4"/>
    <!-- Dress -->
    <path d="M360 580 C340 650, 460 650, 440 580 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Arms -->
    <path d="M365 530 Q340 540, 320 500 Q310 490, 300 495" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="495" r="8" fill="white" stroke="black" stroke-width="4"/> <!-- Left Hand -->
    <path d="M435 530 Q460 540, 480 500 Q490 490, 500 495" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <circle cx="500" cy="495" r="8" fill="white" stroke="black" stroke-width="4"/> <!-- Right Hand -->
    <!-- Legs -->
    <path d="M380 640 Q370 680, 360 700" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <circle cx="360" cy="700" r="10" fill="white" stroke="black" stroke-width="4"/> <!-- Left Foot -->
    <path d="M420 640 Q430 680, 440 700" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <circle cx="440" cy="700" r="10" fill="white" stroke="black" stroke-width="4"/> <!-- Right Foot -->
    <!-- Wings - Butterfly-like -->
    <path d="M400 480 Q480 350, 550 400 Q480 450, 400 480 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Top Right Wing -->
    <path d="M400 480 Q480 550, 550 500 Q480 450, 400 480 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Bottom Right Wing -->
    <path d="M400 480 Q320 350, 250 400 Q320 450, 400 480 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Top Left Wing -->
    <path d="M400 480 Q320 550, 250 500 Q320 450, 400 480 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Bottom Left Wing -->
    <!-- Wing details -->
    <path d="M450 400 Q470 380, 480 400" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <path d="M450 500 Q470 520, 480 500" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <path d="M350 400 Q330 380, 320 400" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <path d="M350 500 Q330 520, 320 500" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="380" cy="450" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Left eye -->
    <circle cx="420" cy="450" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Right eye -->
    <path d="M390 470 Q400 485, 410 470" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Smile -->
  </g>

  <!-- Mushroom and Leaf House -->
  <g id="house">
    <!-- Mushroom Cap Roof -->
    <path d="M150 550 C200 400, 600 400, 650 550 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mushroom Cap underside line -->
    <path d="M150 550 C200 540, 600 540, 650 550" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <!-- Leaf Wall -->
    <path d="M300 550 C200 750, 350 850, 500 800 C600 700, 500 550, 300 550 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Leaf vein -->
    <path d="M400 550 C380 650, 420 750, 400 800" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <!-- Flower Window -->
    <g transform="translate(450, 650)">
      <circle cx="0" cy="0" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Center -->
      <path d="M-15 -35 C-5 -45, 5 -45, 15 -35 C25 -25, 15 -15, 5 -15 Q-5 -5, -15 -25 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M35 -15 C45 -5, 45 5, 35 15 C25 25, 15 15, 5 5 Q-5 -5, 25 -15 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M15 35 C5 45, -5 45, -15 35 C-25 25, -15 15, -5 5 Q5 -5, 15 25 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M-35 15 C-45 5, -45 -5, -35 -15 C-25 -25, -15 -15, -5 -5 Q5 5, -25 15 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M-20 -40 Q-30 -35, -25 -25 Q-10 -15, 0 -35 Z" fill="white" stroke="black" stroke-width="3" transform="rotate(45)"/>
      <path d="M-20 -40 Q-30 -35, -25 -25 Q-10 -15, 0 -35 Z" fill="white" stroke="black" stroke-width="3" transform="rotate(135)"/>
      <path d="M-20 -40 Q-30 -35, -25 -25 Q-10 -15, 0 -35 Z" fill="white" stroke="black" stroke-width="3" transform="rotate(225)"/>
      <path d="M-20 -40 Q-30 -35, -25 -25 Q-10 -15, 0 -35 Z" fill="white" stroke="black" stroke-width="3" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Simple Forest Elements -->
  <g id="forest_elements">
    <!-- Large foreground leaf 1 -->
    <path d="M100 800 C50 700, 150 600, 250 700 C300 800, 200 900, 100 800 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M175 750 Q160 700, 150 650" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <!-- Large foreground leaf 2 -->
    <path d="M600 850 C550 750, 650 650, 750 750 C800 850, 700 950, 600 850 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M675 800 Q660 750, 650 700" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <!-- Small flowers -->
    <g transform="translate(100, 900)">
      <circle cx="0" cy="0" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="-15" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="15" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="0" cy="-15" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="0" cy="15" r="8" fill="white" stroke="black" stroke-width="3"/>
    </g>
    <g transform="translate(700, 950)">
      <circle cx="0" cy="0" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="-15" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="15" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="0" cy="-15" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="0" cy="15" r="8" fill="white" stroke="black" stroke-width="3"/>
    </g>
    <g transform="translate(50, 600)">
      <circle cx="0" cy="0" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="-12" cy="0" r="7" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="12" cy="0" r="7" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="0" cy="-12" r="7" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="0" cy="12" r="7" fill="white" stroke="black" stroke-width="3"/>
    </g>
  </g>

  <!-- Friendly Critter (Ladybug) -->
  <g id="foreground_critter">
    <circle cx="200" cy="900" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
    <circle cx="175" cy="890" r="15" fill="white" stroke="black" stroke-width="4"/> <!-- Head -->
    <path d="M200 875 L200 925" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Wing divide -->
    <circle cx="190" cy="885" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Spot 1 -->
    <circle cx="210" cy="885" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Spot 2 -->
    <circle cx="190" cy="915" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Spot 3 -->
    <circle cx="210" cy="915" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Spot 4 -->
    <path d="M175 880 Q165 870, 155 875" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Antenna 1 -->
    <path d="M175 900 Q165 910, 155 905" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Antenna 2 -->
  </g>
</svg>