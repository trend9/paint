<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .outline {
        stroke: black;
        stroke-width: 4; /* Thick outlines */
        fill: white;    /* All fills are white for coloring */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-line {
        stroke: black;
        stroke-width: 4;
        fill: none;     /* For lines that don't need a fill, like mouths or seaweed stalks */
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    ]]></style>
  </defs>

  <!-- Coral Reef Base and formations -->
  <g id="coral-reef">
    <!-- Main reef base -->
    <path class="outline" d="M0 800 Q100 760 200 800 C300 840 500 840 600 800 Q700 760 800 800 L800 1000 L0 1000 Z"/>
    
    <!-- Individual coral formations -->
    <path class="outline" d="M150 780 C100 730 150 680 200 700 C250 720 280 780 250 800 Z"/>
    <path class="outline" d="M350 790 C320 740 380 690 420 710 C460 730 480 790 450 810 Z"/>
    <path class="outline" d="M600 790 C580 730 630 680 680 700 C730 720 750 780 720 800 Z"/>
    <path class="outline" d="M500 750 C480 700 520 650 560 670 C600 690 620 750 590 770 Z"/>
    <path class="outline" d="M250 720 C230 670 270 620 310 640 C350 660 370 720 340 740 Z"/>
  </g>

  <!-- Seaweed -->
  <g id="seaweed">
    <!-- Seaweed stems (lines) -->
    <path class="outline-line" d="M50 950 C70 850 100 750 120 700"/>
    <path class="outline-line" d="M100 970 C120 870 150 770 170 720"/>
    <path class="outline-line" d="M700 960 C680 860 650 760 630 710"/>
    <path class="outline-line" d="M750 980 C730 880 700 780 680 730"/>

    <!-- Seaweed leaves/fronds for first stem -->
    <ellipse class="outline" cx="100" cy="850" rx="20" ry="40" transform="rotate(15 100 850)"/>
    <ellipse class="outline" cx="110" cy="780" rx="18" ry="35" transform="rotate(20 110 780)"/>
    <ellipse class="outline" cx="125" cy="720" rx="15" ry="30" transform="rotate(25 125 720)"/>

    <!-- Seaweed leaves/fronds for second stem -->
    <ellipse class="outline" cx="140" cy="870" rx="20" ry="40" transform="rotate(-15 140 870)"/>
    <ellipse class="outline" cx="150" cy="800" rx="18" ry="35" transform="rotate(-20 150 800)"/>
    <ellipse class="outline" cx="165" cy="740" rx="15" ry="30" transform="rotate(-25 165 740)"/>
    
    <!-- Seaweed leaves/fronds for third stem -->
    <ellipse class="outline" cx="650" cy="860" rx="20" ry="40" transform="rotate(15 650 860)"/>
    <ellipse class="outline" cx="640" cy="790" rx="18" ry="35" transform="rotate(20 640 790)"/>
    <ellipse class="outline" cx="625" cy="730" rx="15" ry="30" transform="rotate(25 625 730)"/>

    <!-- Seaweed leaves/fronds for fourth stem -->
    <ellipse class="outline" cx="710" cy="880" rx="20" ry="40" transform="rotate(-15 710 880)"/>
    <ellipse class="outline" cx="700" cy="810" rx="18" ry="35" transform="rotate(-20 700 810)"/>
    <ellipse class="outline" cx="685" cy="750" rx="15" ry="30" transform="rotate(-25 685 750)"/>
  </g>

  <!-- Fish 1 (larger) -->
  <g id="fish1" transform="translate(100 200)">
    <!-- Body -->
    <ellipse class="outline" cx="200" cy="100" rx="100" ry="60" transform="rotate(5 200 100)"/>
    <!-- Tail -->
    <path class="outline" d="M300 100 L350 70 Q370 100 350 130 Z"/>
    <!-- Fins -->
    <path class="outline" d="M220 150 Q240 170 200 180 Q180 160 220 150 Z"/> <!-- Bottom fin -->
    <path class="outline" d="M160 60 Q180 40 140 30 Q120 50 160 60 Z"/> <!-- Top fin -->
    <!-- Eye -->
    <circle class="outline" cx="150" cy="90" r="20"/>
    <circle class="outline" cx="158" cy="85" r="8"/> <!-- Pupil area -->
    <!-- Mouth -->
    <path class="outline-line" d="M120 120 Q140 130 160 120"/>
  </g>

  <!-- Fish 2 (medium) -->
  <g id="fish2" transform="translate(450 300) scale(0.7) rotate(-15)">
    <!-- Body -->
    <ellipse class="outline" cx="200" cy="100" rx="100" ry="60" transform="rotate(5 200 100)"/>
    <!-- Tail -->
    <path class="outline" d="M300 100 L350 70 Q370 100 350 130 Z"/>
    <!-- Fins -->
    <path class="outline" d="M220 150 Q240 170 200 180 Q180 160 220 150 Z"/> <!-- Bottom fin -->
    <path class="outline" d="M160 60 Q180 40 140 30 Q120 50 160 60 Z"/> <!-- Top fin -->
    <!-- Eye -->
    <circle class="outline" cx="150" cy="90" r="20"/>
    <circle class="outline" cx="158" cy="85" r="8"/>
    <!-- Mouth -->
    <path class="outline-line" d="M120 120 Q140 130 160 120"/>
  </g>

  <!-- Fish 3 (smaller) -->
  <g id="fish3" transform="translate(50 500) scale(0.6) rotate(10)">
    <!-- Body -->
    <ellipse class="outline" cx="200" cy="100" rx="100" ry="60" transform="rotate(5 200 100)"/>
    <!-- Tail -->
    <path class="outline" d="M300 100 L350 70 Q370 100 350 130 Z"/>
    <!-- Fins -->
    <path class="outline" d="M220 150 Q240 170 200 180 Q180 160 220 150 Z"/> <!-- Bottom fin -->
    <path class="outline" d="M160 60 Q180 40 140 30 Q120 50 160 60 Z"/> <!-- Top fin -->
    <!-- Eye -->
    <circle class="outline" cx="150" cy="90" r="20"/>
    <circle class="outline" cx="158" cy="85" r="8"/>
    <!-- Mouth -->
    <path class="outline-line" d="M120 120 Q140 130 160 120"/>
  </g>

  <!-- Air Bubbles -->
  <g id="air-bubbles">
    <circle class="outline" cx="200" cy="100" r="15"/>
    <circle class="outline" cx="230" cy="70" r="10"/>
    <circle class="outline" cx="250" cy="40" r="8"/>
    <circle class="outline" cx="280" cy="20" r="5"/>

    <circle class="outline" cx="500" cy="200" r="18"/>
    <circle class="outline" cx="530" cy="170" r="12"/>
    <circle class="outline" cx="550" cy="140" r="9"/>
    <circle class="outline" cx="580" cy="120" r="6"/>

    <circle class="outline" cx="100" cy="400" r="12"/>
    <circle class="outline" cx="120" cy="370" r="8"/>
    <circle class="outline" cx="140" cy="340" r="6"/>

    <circle class="outline" cx="700" cy="450" r="10"/>
    <circle class="outline" cx="720" cy="420" r="7"/>
    <circle class="outline" cx="740" cy="390" r="5"/>
  </g>
</svg>