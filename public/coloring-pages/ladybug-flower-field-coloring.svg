<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun -->
  <g id="sun" stroke="black" stroke-width="4" fill="white">
    <circle cx="650" cy="150" r="80"/>
    <!-- Sun rays -->
    <path d="M650 70 L650 40" fill="none"/>
    <path d="M706.5 93.5 L729 65" fill="none"/>
    <path d="M730 150 L760 150" fill="none"/>
    <path d="M706.5 206.5 L729 235" fill="none"/>
    <path d="M650 230 L650 260" fill="none"/>
    <path d="M593.5 206.5 L571 235" fill="none"/>
    <path d="M570 150 L540 150" fill="none"/>
    <path d="M593.5 93.5 L571 65" fill="none"/>
  </g>

  <!-- Clouds -->
  <g id="clouds" stroke="black" stroke-width="4" fill="white">
    <!-- Cloud 1 -->
    <path d="M100 100 C70 100 50 130 60 160 C50 190 70 220 110 210 C150 220 190 190 190 160 C200 130 180 100 150 100 C130 90 110 90 100 100 Z"/>
    <!-- Cloud 2 -->
    <path d="M300 130 C270 130 250 160 260 190 C250 220 270 250 310 240 C350 250 390 220 390 190 C400 160 380 130 350 130 C330 120 310 120 300 130 Z"/>
  </g>

  <!-- Ground line - simple curve for the horizon -->
  <path d="M0 650 C200 680 600 680 800 650" stroke="black" stroke-width="4" fill="none"/>

  <!-- Ladybug -->
  <g id="ladybug" stroke="black" stroke-width="4">
    <!-- Body -->
    <ellipse cx="400" cy="550" rx="100" ry="120" fill="white"/>
    <!-- Head -->
    <circle cx="400" cy="400" r="60" fill="white"/>
    <!-- Wing separation line -->
    <path d="M400 430 L400 670" fill="none"/>
    <!-- Antennae -->
    <path d="M370 340 C360 310 370 290 390 300" fill="none"/>
    <path d="M430 340 C440 310 430 290 410 300" fill="none"/>
    <!-- Eyes -->
    <circle cx="370" cy="380" r="15" fill="white"/>
    <circle cx="430" cy="380" r="15" fill="white"/>
    <!-- Smile -->
    <path d="M380 415 Q400 435 420 415" fill="none"/>
    <!-- Legs (simplified) -->
    <path d="M300 500 L250 520 L240 540" fill="none"/>
    <path d="M300 580 L250 600 L240 620" fill="none"/>
    <path d="M330 650 L280 670 L270 690" fill="none"/>
    <path d="M500 500 L550 520 L560 540" fill="none"/>
    <path d="M500 580 L550 600 L560 620" fill="none"/>
    <path d="M470 650 L520 670 L530 690" fill="none"/>
    <!-- Polka dots -->
    <circle cx="350" cy="500" r="25" fill="white"/>
    <circle cx="450" cy="500" r="25" fill="white"/>
    <circle cx="360" cy="600" r="25" fill="white"/>
    <circle cx="440" cy="600" r="25" fill="white"/>
    <circle cx="400" cy="550" r="25" fill="white"/>
  </g>

  <!-- Flower Field -->
  <g id="flower-field" stroke="black" stroke-width="4">
    <!-- Flower 1 (Left) -->
    <g transform="translate(150, 700)">
      <circle cx="0" cy="0" r="30" fill="white"/> <!-- Center -->
      <ellipse cx="0" cy="-50" rx="25" ry="40" fill="white"/> <!-- Petal 1 -->
      <ellipse cx="45" cy="-25" rx="25" ry="40" transform="rotate(45,0,0)" fill="white"/> <!-- Petal 2 -->
      <ellipse cx="50" cy="0" rx="25" ry="40" transform="rotate(90,0,0)" fill="white"/> <!-- Petal 3 -->
      <ellipse cx="45" cy="25" rx="25" ry="40" transform="rotate(135,0,0)" fill="white"/> <!-- Petal 4 -->
      <ellipse cx="0" cy="50" rx="25" ry="40" transform="rotate(180,0,0)" fill="white"/> <!-- Petal 5 -->
      <ellipse cx="-45" cy="25" rx="25" ry="40" transform="rotate(225,0,0)" fill="white"/> <!-- Petal 6 -->
      <ellipse cx="-50" cy="0" rx="25" ry="40" transform="rotate(270,0,0)" fill="white"/> <!-- Petal 7 -->
      <ellipse cx="-45" cy="-25" rx="25" ry="40" transform="rotate(315,0,0)" fill="white"/> <!-- Petal 8 -->
      <path d="M0 60 L0 250" fill="none"/> <!-- Stem -->
      <path d="M-10 150 C-40 160 -40 180 -10 190" fill="white"/> <!-- Leaf 1 -->
      <path d="M10 170 C40 180 40 200 10 210" fill="white"/> <!-- Leaf 2 -->
    </g>

    <!-- Flower 2 (Right) -->
    <g transform="translate(650, 750)">
      <circle cx="0" cy="0" r="25" fill="white"/> <!-- Center -->
      <ellipse cx="0" cy="-40" rx="20" ry="35" fill="white"/>
      <ellipse cx="35" cy="-20" rx="20" ry="35" transform="rotate(45,0,0)" fill="white"/>
      <ellipse cx="40" cy="0" rx="20" ry="35" transform="rotate(90,0,0)" fill="white"/>
      <ellipse cx="35" cy="20" rx="20" ry="35" transform="rotate(135,0,0)" fill="white"/>
      <ellipse cx="0" cy="40" rx="20" ry="35" transform="rotate(180,0,0)" fill="white"/>
      <ellipse cx="-35" cy="20" rx="20" ry="35" transform="rotate(225,0,0)" fill="white"/>
      <ellipse cx="-40" cy="0" rx="20" ry="35" transform="rotate(270,0,0)" fill="white"/>
      <ellipse cx="-35" cy="-20" rx="20" ry="35" transform="rotate(315,0,0)" fill="white"/>
      <path d="M0 50 L0 200" fill="none"/> <!-- Stem -->
      <path d="M-8 120 C-30 130 -30 150 -8 160" fill="white"/> <!-- Leaf 1 -->
    </g>

    <!-- Flower 3 (Middle-left) -->
    <g transform="translate(300, 850)">
      <circle cx="0" cy="0" r="20" fill="white"/> <!-- Center -->
      <ellipse cx="0" cy="-35" rx="18" ry="30" fill="white"/>
      <ellipse cx="30" cy="-18" rx="18" ry="30" transform="rotate(45,0,0)" fill="white"/>
      <ellipse cx="35" cy="0" rx="18" ry="30" transform="rotate(90,0,0)" fill="white"/>
      <ellipse cx="30" cy="18" rx="18" ry="30" transform="rotate(135,0,0)" fill="white"/>
      <ellipse cx="0" cy="35" rx="18" ry="30" transform="rotate(180,0,0)" fill="white"/>
      <ellipse cx="-30" cy="18" rx="18" ry="30" transform="rotate(225,0,0)" fill="white"/>
      <ellipse cx="-35" cy="0" rx="18" ry="30" transform="rotate(270,0,0)" fill="white"/>
      <ellipse cx="-30" cy="-18" rx="18" ry="30" transform="rotate(315,0,0)" fill="white"/>
      <path d="M0 45 L0 120" fill="none"/> <!-- Stem -->
    </g>
  </g>

  <!-- Butterflies -->
  <g id="butterflies" stroke="black" stroke-width="4">
    <!-- Butterfly 1 (Upper left) -->
    <g transform="translate(180, 450)">
      <ellipse cx="0" cy="0" rx="15" ry="30" fill="white"/> <!-- Body -->
      <path d="M-10 -30 C-40 -50 -50 -80 -20 -90 C10 -100 40 -80 30 -50 Z" fill="white"/> <!-- Top left wing -->
      <path d="M10 -30 C40 -50 50 -80 20 -90 C-10 -100 -40 -80 -30 -50 Z" transform="scale(-1 1)" fill="white"/> <!-- Top right wing (mirrored) -->
      <path d="M-10 30 C-40 50 -50 80 -20 90 C10 100 40 80 30 50 Z" fill="white"/> <!-- Bottom left wing -->
      <path d="M10 30 C40 50 50 80 20 90 C-10 100 -40 80 -30 50 Z" transform="scale(-1 1)" fill="white"/> <!-- Bottom right wing (mirrored) -->
      <path d="M-5 -25 Q-15 -45 -10 -60" fill="none"/> <!-- Antenna 1 -->
      <path d="M5 -25 Q15 -45 10 -60" fill="none"/> <!-- Antenna 2 -->
    </g>

    <!-- Butterfly 2 (Upper right) -->
    <g transform="translate(620, 400)">
      <ellipse cx="0" cy="0" rx="12" ry="25" fill="white"/> <!-- Body -->
      <path d="M-8 -25 C-35 -40 -40 -70 -15 -80 C8 -85 35 -65 25 -40 Z" fill="white"/> <!-- Top left wing -->
      <path d="M8 -25 C35 -40 40 -70 15 -80 C-8 -85 -35 -65 -25 -40 Z" transform="scale(-1 1)" fill="white"/> <!-- Top right wing (mirrored) -->
      <path d="M-8 25 C-35 40 -40 70 -15 80 C8 85 35 65 25 40 Z" fill="white"/> <!-- Bottom left wing -->
      <path d="M8 25 C35 40 40 70 15 80 C-8 85 -35 65 -25 40 Z" transform="scale(-1 1)" fill="white"/> <!-- Bottom right wing (mirrored) -->
      <path d="M-4 -20 Q-12 -40 -8 -50" fill="none"/> <!-- Antenna 1 -->
      <path d="M4 -20 Q12 -40 8 -50" fill="none"/> <!-- Antenna 2 -->
    </g>
  </g>
</svg>