<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outline {
      stroke: black;
      stroke-width: 4; /* Thick outline */
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fill-white {
      fill: white;
      stroke: black;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .no-fill {
        fill: none;
        stroke: black;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
  </style>

  <!-- Ladybug Group -->
  <g id="ladybug">
    <!-- Body -->
    <ellipse cx="400" cy="450" rx="100" ry="120" class="fill-white"/>
    <!-- Head -->
    <circle cx="400" cy="350" r="50" class="fill-white"/>

    <!-- Spots -->
    <circle cx="350" cy="400" r="30" class="fill-white"/>
    <circle cx="450" cy="400" r="30" class="fill-white"/>
    <circle cx="370" cy="480" r="30" class="fill-white"/>
    <circle cx="430" cy="480" r="30" class="fill-white"/>
    <circle cx="400" cy="540" r="30" class="fill-white"/>

    <!-- Eyes -->
    <circle cx="375" cy="330" r="15" class="fill-white"/>
    <circle cx="425" cy="330" r="15" class="fill-white"/>

    <!-- Antennae -->
    <path d="M380 300 Q360 280 350 290" class="no-fill"/>
    <circle cx="350" cy="290" r="8" class="fill-white"/>
    <path d="M420 300 Q440 280 450 290" class="no-fill"/>
    <circle cx="450" cy="290" r="8" class="fill-white"/>
  </g>

  <!-- Flowers Group -->
  <g id="flowers">
    <!-- Daisy 1 (Bottom Left) -->
    <g id="daisy1">
      <circle cx="200" cy="780" r="40" class="fill-white"/> <!-- Center -->
      <g>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(0 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(45 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(90 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(135 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(180 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(225 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(270 200 780)" class="fill-white"/>
        <ellipse cx="200" cy="710" rx="30" ry="60" transform="rotate(315 200 780)" class="fill-white"/>
      </g>
      <path d="M200 820 V950" class="no-fill"/> <!-- Stem -->
      <ellipse cx="150" cy="880" rx="40" ry="25" transform="rotate(-30 150 880)" class="fill-white"/> <!-- Leaf -->
    </g>

    <!-- Tulip 1 (Top Left) -->
    <g id="tulip1">
      <path d="M150 200 C100 150, 100 50, 200 50 C300 50, 300 150, 250 200 C250 250, 200 270, 150 250 Z" class="fill-white"/> <!-- Petals -->
      <path d="M200 250 V350" class="no-fill"/> <!-- Stem -->
      <ellipse cx="250" cy="300" rx="40" ry="25" transform="rotate(45 250 300)" class="fill-white"/> <!-- Leaf -->
    </g>

    <!-- Sunflower 1 (Bottom Right) -->
    <g id="sunflower1">
      <circle cx="650" cy="750" r="60" class="fill-white"/> <!-- Center -->
      <g>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(0 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(30 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(60 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(90 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(120 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(150 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(180 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(210 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(240 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(270 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(300 650 750)" class="fill-white"/>
        <ellipse cx="650" cy="650" rx="40" ry="80" transform="rotate(330 650 750)" class="fill-white"/>
      </g>
      <path d="M650 810 V950" class="no-fill"/> <!-- Stem -->
      <ellipse cx="700" cy="850" rx="50" ry="30" transform="rotate(20 700 850)" class="fill-white"/> <!-- Leaf -->
    </g>

    <!-- Daisy 2 (Top Right, smaller) -->
    <g id="daisy2">
      <circle cx="680" cy="200" r="30" class="fill-white"/> <!-- Center -->
      <g>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(0 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(45 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(90 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(135 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(180 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(225 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(270 680 200)" class="fill-white"/>
        <ellipse cx="680" cy="150" rx="20" ry="40" transform="rotate(315 680 200)" class="fill-white"/>
      </g>
      <path d="M680 230 V300" class="no-fill"/> <!-- Stem -->
      <ellipse cx="650" cy="270" rx="30" ry="20" transform="rotate(-40 650 270)" class="fill-white"/> <!-- Leaf -->
    </g>

    <!-- Tulip 2 (Middle Left, smaller) -->
    <g id="tulip2">
      <path d="M100 550 C70 520, 70 470, 120 470 C170 470, 170 520, 140 550 C140 570, 120 580, 100 570 Z" class="fill-white"/> <!-- Petals -->
      <path d="M120 570 V650" class="no-fill"/> <!-- Stem -->
      <ellipse cx="160" cy="620" rx="30" ry="20" transform="rotate(50 160 620)" class="fill-white"/> <!-- Leaf -->
    </g>

    <!-- Sunflower 2 (Middle Right, smaller) -->
    <g id="sunflower2">
      <circle cx="700" cy="500" r="40" class="fill-white"/> <!-- Center -->
      <g>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(0 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(30 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(60 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(90 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(120 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(150 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(180 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(210 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(240 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(270 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(300 700 500)" class="fill-white"/>
        <ellipse cx="700" cy="440" rx="25" ry="50" transform="rotate(330 700 500)" class="fill-white"/>
      </g>
      <path d="M700 540 V620" class="no-fill"/> <!-- Stem -->
      <ellipse cx="650" cy="580" rx="40" ry="25" transform="rotate(-30 650 580)" class="fill-white"/> <!-- Leaf -->
    </g>

  </g>
</svg>