<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="ladybug" stroke="black" fill="white">
    <!-- Body -->
    <ellipse cx="400" cy="500" rx="100" ry="120" stroke-width="5"/>
    <!-- Head -->
    <circle cx="400" cy="360" r="60" stroke-width="5"/>
    <!-- Eyes -->
    <circle cx="375" cy="350" r="15" stroke-width="3"/>
    <circle cx="425" cy="350" r="15" stroke-width="3"/>
    <!-- Mouth -->
    <path d="M 380 380 Q 400 395 420 380" fill="none" stroke-width="4"/>
    <!-- Antennae -->
    <path d="M 380 300 Q 360 280 350 260" fill="none" stroke-width="3"/>
    <circle cx="350" cy="260" r="8" stroke-width="3"/>
    <path d="M 420 300 Q 440 280 450 260" fill="none" stroke-width="3"/>
    <circle cx="450" cy="260" r="8" stroke-width="3"/>
    <!-- Wings (flapping effect) -->
    <path d="M 360 400 C 300 350 250 450 360 550 C 350 480 360 400 360 400 Z" stroke-width="5"/>
    <path d="M 440 400 C 500 350 550 450 440 550 C 450 480 440 400 440 400 Z" stroke-width="5"/>
    <!-- Spots -->
    <circle cx="370" cy="450" r="25" stroke-width="4"/>
    <circle cx="430" cy="450" r="25" stroke-width="4"/>
    <circle cx="400" cy="520" r="25" stroke-width="4"/>
    <circle cx="370" cy="580" r="25" stroke-width="4"/>
    <circle cx="430" cy="580" r="25" stroke-width="4"/>
    <!-- Legs -->
    <g fill="none">
      <path d="M 320 400 Q 280 420 290 450" stroke-width="3"/>
      <path d="M 300 470 Q 260 490 270 520" stroke-width="3"/>
      <path d="M 320 540 Q 280 560 290 590" stroke-width="3"/>
      <path d="M 480 400 Q 520 420 510 450" stroke-width="3"/>
      <path d="M 500 470 Q 540 490 530 520" stroke-width="3"/>
      <path d="M 480 540 Q 520 560 510 590" stroke-width="3"/>
    </g>
  </g>

  <g id="flower-field" stroke="black" fill="white">
    <!-- Ground line to define the field base -->
    <path d="M 0 750 Q 200 700 400 750 T 800 750" fill="none" stroke-width="4"/>

    <!-- Daisies -->
    <!-- Daisy 1 (large foreground) -->
    <g transform="translate(150, 800)">
      <circle cx="0" cy="0" r="30" stroke-width="4"/>
      <g stroke-width="4">
        <ellipse cx="0" cy="-60" rx="20" ry="40"/>
        <ellipse cx="0" cy="60" rx="20" ry="40"/>
        <ellipse cx="-60" cy="0" rx="40" ry="20"/>
        <ellipse cx="60" cy="0" rx="40" ry="20"/>
        <ellipse cx="-45" cy="-45" rx="20" ry="40" transform="rotate(-45 0 0)"/>
        <ellipse cx="45" cy="-45" rx="20" ry="40" transform="rotate(45 0 0)"/>
        <ellipse cx="-45" cy="45" rx="20" ry="40" transform="rotate(-135 0 0)"/>
        <ellipse cx="45" cy="45" rx="20" ry="40" transform="rotate(135 0 0)"/>
      </g>
      <path d="M 0 30 L 0 150" fill="none" stroke-width="3"/>
      <path d="M -50 100 Q -30 110 -10 100 Q -30 90 -50 100 Z" stroke-width="3"/>
    </g>

    <!-- Daisy 2 (medium) -->
    <g transform="translate(650, 850)">
      <circle cx="0" cy="0" r="25" stroke-width="4"/>
      <g stroke-width="4">
        <ellipse cx="0" cy="-50" rx="15" ry="35"/>
        <ellipse cx="0" cy="50" rx="15" ry="35"/>
        <ellipse cx="-50" cy="0" rx="35" ry="15"/>
        <ellipse cx="50" cy="0" rx="35" ry="15"/>
        <ellipse cx="-37" cy="-37" rx="15" ry="35" transform="rotate(-45 0 0)"/>
        <ellipse cx="37" cy="-37" rx="15" ry="35" transform="rotate(45 0 0)"/>
        <ellipse cx="-37" cy="37" rx="15" ry="35" transform="rotate(-135 0 0)"/>
        <ellipse cx="37" cy="37" rx="15" ry="35" transform="rotate(135 0 0)"/>
      </g>
      <path d="M 0 25 L 0 120" fill="none" stroke-width="3"/>
      <path d="M 40 90 Q 20 100 0 90 Q 20 80 40 90 Z" stroke-width="3"/>
    </g>

    <!-- Daisy 3 (smaller, background) -->
    <g transform="translate(450, 720)">
      <circle cx="0" cy="0" r="18" stroke-width="3"/>
      <g stroke-width="3">
        <ellipse cx="0" cy="-35" rx="12" ry="25"/>
        <ellipse cx="0" cy="35" rx="12" ry="25"/>
        <ellipse cx="-35" cy="0" rx="25" ry="12"/>
        <ellipse cx="35" cy="0" rx="25" ry="12"/>
        <ellipse cx="-25" cy="-25" rx="12" ry="25" transform="rotate(-45 0 0)"/>
        <ellipse cx="25" cy="-25" rx="12" ry="25" transform="rotate(45 0 0)"/>
        <ellipse cx="-25" cy="25" rx="12" ry="25" transform="rotate(-135 0 0)"/>
        <ellipse cx="25" cy="25" rx="12" ry="25" transform="rotate(135 0 0)"/>
      </g>
      <path d="M 0 18 L 0 80" fill="none" stroke-width="3"/>
    </g>

    <!-- Daisy 4 (smaller, background) -->
    <g transform="translate(100, 680)">
      <circle cx="0" cy="0" r="15" stroke-width="3"/>
      <g stroke-width="3">
        <ellipse cx="0" cy="-30" rx="10" ry="20"/>
        <ellipse cx="0" cy="30" rx="10" ry="20"/>
        <ellipse cx="-30" cy="0" rx="20" ry="10"/>
        <ellipse cx="30" cy="0" rx="20" ry="10"/>
        <ellipse cx="-22" cy="-22" rx="10" ry="20" transform="rotate(-45 0 0)"/>
        <ellipse cx="22" cy="-22" rx="10" ry="20" transform="rotate(45 0 0)"/>
        <ellipse cx="-22" cy="22" rx="10" ry="20" transform="rotate(-135 0 0)"/>
        <ellipse cx="22" cy="22" rx="10" ry="20" transform="rotate(135 0 0)"/>
      </g>
      <path d="M 0 15 L 0 70" fill="none" stroke-width="3"/>
    </g>

    <!-- Tulips -->
    <!-- Tulip 1 (large foreground) -->
    <g transform="translate(500, 880)">
      <path d="M -40 -100 Q -50 -150 -10 -180 Q 30 -150 40 -100 C 40 -50 0 0 -40 -100 Z" stroke-width="5"/>
      <path d="M -40 -100 C -40 0 0 0 40 -100" fill="none" stroke-width="5"/>
      <path d="M 0 0 L 0 100" fill="none" stroke-width="4"/>
      <path d="M -40 50 Q -20 70 0 50 Q -20 30 -40 50 Z" stroke-width="3"/>
    </g>

    <!-- Tulip 2 (medium) -->
    <g transform="translate(300, 820)">
      <path d="M -30 -70 Q -35 -105 -10 -130 Q 20 -105 30 -70 C 30 -30 0 0 -30 -70 Z" stroke-width="4"/>
      <path d="M -30 -70 C -30 0 0 0 30 -70" fill="none" stroke-width="4"/>
      <path d="M 0 0 L 0 80" fill="none" stroke-width="3"/>
      <path d="M 30 40 Q 15 50 0 40 Q 15 30 30 40 Z" stroke-width="3"/>
    </g>

    <!-- Tulip 3 (small background) -->
    <g transform="translate(200, 740)">
      <path d="M -20 -50 Q -25 -75 -5 -90 Q 15 -75 20 -50 C 20 -20 0 0 -20 -50 Z" stroke-width="3"/>
      <path d="M -20 -50 C -20 0 0 0 20 -50" fill="none" stroke-width="3"/>
      <path d="M 0 0 L 0 60" fill="none" stroke-width="3"/>
    </g>

    <!-- Tulip 4 (small background) -->
    <g transform="translate(600, 700)">
      <path d="M -20 -50 Q -25 -75 -5 -90 Q 15 -75 20 -50 C 20 -20 0 0 -20 -50 Z" stroke-width="3"/>
      <path d="M -20 -50 C -20 0 0 0 20 -50" fill="none" stroke-width="3"/>
      <path d="M 0 0 L 0 60" fill="none" stroke-width="3"/>
    </g>

    <!-- More scattered smaller flowers to enhance the "vast field" effect -->
    <g transform="translate(50, 800)">
      <circle cx="0" cy="0" r="10" stroke-width="3"/>
      <g stroke-width="3">
        <ellipse cx="0" cy="-20" rx="8" ry="15"/>
        <ellipse cx="0" cy="20" rx="8" ry="15"/>
        <ellipse cx="-20" cy="0" rx="15" ry="8"/>
        <ellipse cx="20" cy="0" rx="15" ry="8"/>
      </g>
      <path d="M 0 10 L 0 50" fill="none" stroke-width="3"/>
    </g>

    <g transform="translate(750, 780)">
      <circle cx="0" cy="0" r="12" stroke-width="3"/>
      <g stroke-width="3">
        <ellipse cx="0" cy="-25" rx="10" ry="18"/>
        <ellipse cx="0" cy="25" rx="10" ry="18"/>
        <ellipse cx="-25" cy="0" rx="18" ry="10"/>
        <ellipse cx="25" cy="0" rx="18" ry="10"/>
      </g>
      <path d="M 0 12 L 0 60" fill="none" stroke-width="3"/>
    </g>

    <g transform="translate(350, 680)">
      <circle cx="0" cy="0" r="10" stroke-width="3"/>
      <g stroke-width="3">
        <ellipse cx="0" cy="-20" rx="8" ry="15"/>
        <ellipse cx="0" cy="20" rx="8" ry="15"/>
        <ellipse cx="-20" cy="0" rx="15" ry="8"/>
        <ellipse cx="20" cy="0" rx="15" ry="8"/>
      </g>
      <path d="M 0 10 L 0 40" fill="none" stroke-width="3"/>
    </g>

    <g transform="translate(70, 900)">
      <circle cx="0" cy="0" r="12" stroke-width="3"/>
      <g stroke-width="3">
        <ellipse cx="0" cy="-25" rx="10" ry="18"/>
        <ellipse cx="0" cy="25" rx="10" ry="18"/>
        <ellipse cx="-25" cy="0" rx="18" ry="10"/>
        <ellipse cx="25" cy="0" rx="18" ry="10"/>
      </g>
      <path d="M 0 12 L 0 65" fill="none" stroke-width="3"/>
    </g>
  </g>
</svg>