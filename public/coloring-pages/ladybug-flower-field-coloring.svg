<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the entire scene -->
  <g stroke="black" stroke-width="4" fill="white">

    <!-- Ladybug -->
    <g id="ladybug">
      <!-- Body -->
      <path d="M400 650 Q300 600 300 500 T400 350 T500 500 T400 650Z" stroke-width="5" fill="white"/>
      <!-- Head -->
      <circle cx="400" cy="340" r="80" stroke-width="5" fill="white"/>
      <!-- Eyes -->
      <circle cx="360" cy="320" r="30" stroke-width="4" fill="white"/>
      <circle cx="440" cy="320" r="30" stroke-width="4" fill="white"/>
      <!-- Smile -->
      <path d="M370 370 Q400 400 430 370" stroke-width="4" fill="none"/>
      <!-- Antennae -->
      <path d="M370 270 Q350 200 300 180" stroke-width="3" fill="none"/>
      <circle cx="300" cy="180" r="10" stroke-width="3" fill="white"/>
      <path d="M430 270 Q450 200 500 180" stroke-width="3" fill="none"/>
      <circle cx="500" cy="180" r="10" stroke-width="3" fill="white"/>
      <!-- Wings slightly open -->
      <path d="M400 400 C300 300 250 500 400 550" stroke-width="5" fill="white"/>
      <path d="M400 400 C500 300 550 500 400 550" stroke-width="5" fill="white"/>
      <!-- Spots on wings -->
      <circle cx="330" cy="450" r="25" stroke-width="4" fill="white"/>
      <circle cx="470" cy="450" r="25" stroke-width="4" fill="white"/>
      <circle cx="360" cy="510" r="25" stroke-width="4" fill="white"/>
      <circle cx="440" cy="510" r="25" stroke-width="4" fill="white"/>
      <!-- Legs -->
      <path d="M320 500 L250 550" stroke-width="3" fill="none"/>
      <path d="M320 580 L250 630" stroke-width="3" fill="none"/>
      <path d="M480 500 L550 550" stroke-width="3" fill="none"/>
      <path d="M480 580 L550 630" stroke-width="3" fill="none"/>
    </g>

    <!-- Flowers -->
    <g id="flowers">
      <!-- Daisy 1 -->
      <g transform="translate(150, 700) scale(1.2)">
        <circle cx="0" cy="0" r="30" stroke-width="4" fill="white"/> <!-- Center -->
        <ellipse cx="0" cy="-40" rx="20" ry="35" stroke-width="3" fill="white"/> <!-- Petals -->
        <ellipse cx="35" cy="-20" rx="35" ry="20" stroke-width="3" fill="white"/>
        <ellipse cx="35" cy="20" rx="35" ry="20" stroke-width="3" fill="white"/>
        <ellipse cx="0" cy="40" rx="20" ry="35" stroke-width="3" fill="white"/>
        <ellipse cx="-35" cy="20" rx="35" ry="20" stroke-width="3" fill="white"/>
        <ellipse cx="-35" cy="-20" rx="35" ry="20" stroke-width="3" fill="white"/>
        <path d="M0 30 L0 100" stroke-width="3" fill="none"/> <!-- Stem -->
        <ellipse cx="-30" cy="70" rx="20" ry="10" stroke-width="3" fill="white"/> <!-- Leaf -->
      </g>

      <!-- Tulip 1 -->
      <g transform="translate(650, 800) scale(1.0)">
        <path d="M60 0 Q80 30 60 60 Q40 30 60 0 Z" stroke-width="3" fill="white"/> <!-- Petal 1 -->
        <path d="M60 0 Q40 30 60 60 Q80 30 60 0 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(10 60 30)"/> <!-- Petal 2 -->
        <path d="M60 0 Q80 30 60 60 Q40 30 60 0 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(-10 60 30)"/> <!-- Petal 3 -->
        <path d="M60 60 L60 180" stroke-width="3" fill="none"/> <!-- Stem -->
        <ellipse cx="35" cy="120" rx="20" ry="10" transform="rotate(-30 35 120)" stroke-width="3" fill="white"/> <!-- Leaf -->
      </g>

      <!-- Clover 1 -->
      <g transform="translate(250, 900) scale(0.8)">
        <path d="M50 0 Q30 -30 0 -30 Q-30 -30 -50 0 Q-30 30 0 30 Q30 30 50 0 Z" stroke-width="3" fill="white"/> <!-- Leaf 1 -->
        <path d="M0 50 Q-30 30 -30 0 Q-30 -30 0 -50 Q30 -30 30 0 Q30 30 0 50 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(120 0 0)"/> <!-- Leaf 2 -->
        <path d="M0 50 Q-30 30 -30 0 Q-30 -30 0 -50 Q30 -30 30 0 Q30 30 0 50 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(240 0 0)"/> <!-- Leaf 3 -->
        <path d="M0 0 L0 80" stroke-width="3" fill="none"/> <!-- Stem -->
      </g>

      <!-- Daisy 2 (smaller) -->
      <g transform="translate(50, 500) scale(0.8)">
        <circle cx="0" cy="0" r="25" stroke-width="4" fill="white"/> <!-- Center -->
        <ellipse cx="0" cy="-30" rx="15" ry="25" stroke-width="3" fill="white"/> <!-- Petals -->
        <ellipse cx="25" cy="-15" rx="25" ry="15" stroke-width="3" fill="white"/>
        <ellipse cx="25" cy="15" rx="25" ry="15" stroke-width="3" fill="white"/>
        <ellipse cx="0" cy="30" rx="15" ry="25" stroke-width="3" fill="white"/>
        <ellipse cx="-25" cy="15" rx="25" ry="15" stroke-width="3" fill="white"/>
        <ellipse cx="-25" cy="-15" rx="25" ry="15" stroke-width="3" fill="white"/>
        <path d="M0 25 L0 80" stroke-width="3" fill="none"/> <!-- Stem -->
      </g>

      <!-- Tulip 2 (smaller) -->
      <g transform="translate(700, 600) scale(0.7)">
        <path d="M60 0 Q80 30 60 60 Q40 30 60 0 Z" stroke-width="3" fill="white"/> <!-- Petal 1 -->
        <path d="M60 0 Q40 30 60 60 Q80 30 60 0 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(10 60 30)"/> <!-- Petal 2 -->
        <path d="M60 0 Q80 30 60 60 Q40 30 60 0 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(-10 60 30)"/> <!-- Petal 3 -->
        <path d="M60 60 L60 150" stroke-width="3" fill="none"/> <!-- Stem -->
      </g>

      <!-- Clover 2 -->
      <g transform="translate(100, 850) scale(0.7)">
        <path d="M50 0 Q30 -30 0 -30 Q-30 -30 -50 0 Q-30 30 0 30 Q30 30 50 0 Z" stroke-width="3" fill="white"/> <!-- Leaf 1 -->
        <path d="M0 50 Q-30 30 -30 0 Q-30 -30 0 -50 Q30 -30 30 0 Q30 30 0 50 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(120 0 0)"/> <!-- Leaf 2 -->
        <path d="M0 50 Q-30 30 -30 0 Q-30 -30 0 -50 Q30 -30 30 0 Q30 30 0 50 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(240 0 0)"/> <!-- Leaf 3 -->
        <path d="M0 0 L0 60" stroke-width="3" fill="none"/> <!-- Stem -->
      </g>

      <!-- Clover 3 (top right) -->
      <g transform="translate(680, 200) scale(0.6)">
        <path d="M50 0 Q30 -30 0 -30 Q-30 -30 -50 0 Q-30 30 0 30 Q30 30 50 0 Z" stroke-width="3" fill="white"/> <!-- Leaf 1 -->
        <path d="M0 50 Q-30 30 -30 0 Q-30 -30 0 -50 Q30 -30 30 0 Q30 30 0 50 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(120 0 0)"/> <!-- Leaf 2 -->
        <path d="M0 50 Q-30 30 -30 0 Q-30 -30 0 -50 Q30 -30 30 0 Q30 30 0 50 Z" stroke-width="3" fill="white" transform="translate(0,0) rotate(240 0 0)"/> <!-- Leaf 3 -->
        <path d="M0 0 L0 50" stroke-width="3" fill="none"/> <!-- Stem -->
      </g>

      <!-- Daisy 3 (bottom left, partially hidden) -->
      <g transform="translate(30, 950) scale(0.9)">
        <circle cx="0" cy="0" r="28" stroke-width="4" fill="white"/> <!-- Center -->
        <ellipse cx="0" cy="-35" rx="18" ry="30" stroke-width="3" fill="white"/> <!-- Petals -->
        <ellipse cx="30" cy="-18" rx="30" ry="18" stroke-width="3" fill="white"/>
        <ellipse cx="30" cy="18" rx="30" ry="18" stroke-width="3" fill="white"/>
        <ellipse cx="0" cy="35" rx="18" ry="30" stroke-width="3" fill="white"/>
        <ellipse cx="-30" cy="18" rx="30" ry="18" stroke-width="3" fill="white"/>
        <ellipse cx="-30" cy="-18" rx="30" ry="18" stroke-width="3" fill="white"/>
        <path d="M0 30 L0 90" stroke-width="3" fill="none"/> <!-- Stem -->
      </g>
    </g>

  </g>
</svg>