<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <style>
      .bold-line {
        stroke: #000000;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .med-line {
        stroke: #000000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .thin-line {
        stroke: #000000;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .nofill {
        fill: none !important;
      }
      .dashed-line {
        stroke: #000000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 12 14;
        fill: none;
      }
    </style>
  </defs>

  <!-- Background Canvas (Pure White) -->
  <rect width="800" height="1000" fill="#FFFFFF"/>

  <!-- SKY ELEMENTS: Sun and Clouds -->
  <g id="sky-elements">
    <!-- Friendly Sun -->
    <g id="sun">
      <!-- Sun Rays -->
      <path class="med-line nofill" d="M 120 45 L 120 18" />
      <path class="med-line nofill" d="M 175 68 L 196 47" />
      <path class="med-line nofill" d="M 198 123 L 225 123" />
      <path class="med-line nofill" d="M 175 178 L 196 199" />
      <path class="med-line nofill" d="M 120 201 L 120 228" />
      <path class="med-line nofill" d="M 65 178 L 44 199" />
      <path class="med-line nofill" d="M 42 123 L 15 123" />
      <path class="med-line nofill" d="M 65 68 L 44 47" />

      <!-- Sun Body -->
      <circle class="bold-line" cx="120" cy="123" r="52" />

      <!-- Sun Face -->
      <circle class="med-line" cx="102" cy="115" r="5" />
      <circle class="med-line" cx="138" cy="115" r="5" />
      <path class="med-line nofill" d="M 107 133 Q 120 148 133 133" />
      <path class="thin-line nofill" d="M 92 127 Q 97 133 100 127" />
      <path class="thin-line nofill" d="M 140 127 Q 143 133 148 127" />
    </g>

    <!-- Cloud 1 (Top Right) -->
    <path class="bold-line" d="M 570 120 
      C 560 90, 600 70, 630 85 
      C 650 60, 710 65, 725 95 
      C 755 90, 780 120, 765 145 
      C 785 175, 745 205, 715 195 
      C 690 215, 630 210, 615 185 
      C 575 195, 550 155, 570 120 Z" />

    <!-- Cloud 2 (Top Left / Middle) -->
    <path class="med-line" d="M 60 290 
      C 50 270, 80 250, 105 260 
      C 120 240, 160 245, 170 265 
      C 195 260, 210 285, 200 305 
      C 215 325, 185 350, 160 340 
      C 140 355, 95 350, 85 330 
      C 55 335, 45 305, 60 290 Z" />
  </g>

  <!-- FLIGHT TRAIL OF LADYBUG -->
  <g id="flight-trail">
    <path class="dashed-line" d="M 190 540 C 260 620, 380 610, 370 510 C 360 410, 250 420, 260 330 C 270 250, 390 270, 420 330" />
  </g>

  <!-- CUTE FLYING LADYBUG -->
  <g id="ladybug">
    <!-- Under Wings / Flutter effect -->
    <ellipse class="med-line" cx="380" cy="335" rx="30" ry="60" transform="rotate(-40 380 335)" />
    <ellipse class="med-line" cx="540" cy="335" rx="30" ry="60" transform="rotate(40 540 335)" />

    <!-- Little Legs -->
    <!-- Left Legs -->
    <path class="med-line" d="M 410 390 C 370 400, 360 425, 375 435 C 385 440, 395 425, 415 410" />
    <path class="med-line" d="M 420 430 C 385 460, 380 485, 395 495 C 405 500, 415 480, 430 450" />
    <!-- Right Legs -->
    <path class="med-line" d="M 510 390 C 550 400, 560 425, 545 435 C 535 440, 525 425, 505 410" />
    <path class="med-line" d="M 500 430 C 535 460, 540 485, 525 495 C 515 500, 505 480, 490 450" />

    <!-- Main Body / Tummy -->
    <ellipse class="bold-line" cx="460" cy="395" rx="65" ry="75" />
    
    <!-- Body Stripes/Belly details -->
    <path class="med-line nofill" d="M 415 385 Q 460 410 505 385" />
    <path class="med-line nofill" d="M 420 425 Q 460 450 500 425" />

    <!-- Left Open Wing -->
    <path class="bold-line" d="M 435 340 
      C 370 280, 270 290, 245 350 
      C 220 410, 280 480, 360 470 
      C 410 465, 440 410, 435 340 Z" />

    <!-- Right Open Wing -->
    <path class="bold-line" d="M 485 340 
      C 550 280, 650 290, 675 350 
      C 700 410, 640 480, 560 470 
      C 510 465, 480 410, 485 340 Z" />

    <!-- SIX DISTINCT WING SPOTS (3 on Left Wing, 3 on Right Wing) -->
    <!-- Spot 1 (Left Top) -->
    <circle class="bold-line" cx="305" cy="345" r="18" />
    <!-- Spot 2 (Left Bottom Outer) -->
    <circle class="bold-line" cx="295" cy="415" r="16" />
    <!-- Spot 3 (Left Bottom Inner) -->
    <circle class="bold-line" cx="370" cy="425" r="20" />

    <!-- Spot 4 (Right Top) -->
    <circle class="bold-line" cx="615" cy="345" r="18" />
    <!-- Spot 5 (Right Bottom Outer) -->
    <circle class="bold-line" cx="625" cy="415" r="16" />
    <!-- Spot 6 (Right Bottom Inner) -->
    <circle class="bold-line" cx="550" cy="425" r="20" />

    <!-- Antennae -->
    <!-- Left Antenna -->
    <path class="bold-line nofill" d="M 435 245 C 415 195, 365 190, 360 220 C 355 245, 380 255, 385 240" />
    <circle class="bold-line" cx="375" cy="230" r="10" />
    <!-- Right Antenna -->
    <path class="bold-line nofill" d="M 485 245 C 505 195, 555 190, 560 220 C 565 245, 540 255, 535 240" />
    <circle class="bold-line" cx="545" cy="230" r="10" />

    <!-- Head -->
    <circle class="bold-line" cx="460" cy="275" r="50" />

    <!-- Big Cheerful Eyes -->
    <!-- Left Eye -->
    <g id="left-eye">
      <circle class="bold-line" cx="440" cy="265" r="16" />
      <circle class="bold-line" cx="443" cy="263" r="6" style="fill: #000000;" />
      <circle cx="445" cy="261" r="2.5" style="fill: #FFFFFF; stroke: none;" />
    </g>
    <!-- Right Eye -->
    <g id="right-eye">
      <circle class="bold-line" cx="480" cy="265" r="16" />
      <circle class="bold-line" cx="477" cy="263" r="6" style="fill: #000000;" />
      <circle cx="479" cy="261" r="2.5" style="fill: #FFFFFF; stroke: none;" />
    </g>

    <!-- Big Happy Smile & Cheeks -->
    <path class="bold-line nofill" d="M 442 292 Q 460 312 478 292" />
    <!-- Rosy Cheek Outlines -->
    <ellipse class="thin-line" cx="427" cy="288" rx="6" ry="4" />
    <ellipse class="thin-line" cx="493" cy="288" rx="6" ry="4" />
  </g>

  <!-- GROUND AND HILLS -->
  <g id="ground-hills">
    <!-- Back Hill -->
    <path class="bold-line" d="M -20 860 Q 220 780, 500 830 T 820 800 L 820 1020 L -20 1020 Z" />
    <!-- Front Hill -->
    <path class="bold-line" d="M -20 900 Q 280 870, 540 920 T 820 880 L 820 1020 L -20 1020 Z" />
  </g>

  <!-- FLOWER FIELD -->
  <g id="flower-field">

    <!-- FLOWER 1: Left Giant Friendly Daisy -->
    <g id="flower-left">
      <!-- Big Stem Leaf -->
      <path class="bold-line" d="M 165 770 C 80 750, 70 690, 110 670 C 155 650, 165 720, 165 770 Z" />
      <path class="med-line nofill" d="M 120 685 Q 145 715 165 770" />

      <path class="bold-line" d="M 175 800 C 240 780, 250 720, 215 700 C 180 680, 175 750, 175 800 Z" />
      <path class="med-line nofill" d="M 205 715 Q 185 745 175 800" />

      <!-- Stem -->
      <path class="bold-line" d="M 160 880 Q 180 770, 170 630" />

      <!-- Petals -->
      <!-- Top -->
      <circle class="bold-line" cx="170" cy="540" r="32" />
      <!-- Top-Right -->
      <circle class="bold-line" cx="225" cy="565" r="32" />
      <!-- Bottom-Right -->
      <circle class="bold-line" cx="235" cy="630" r="32" />
      <!-- Bottom -->
      <circle class="bold-line" cx="185" cy="680" r="32" />
      <!-- Bottom-Left -->
      <circle class="bold-line" cx="120" cy="665" r="32" />
      <!-- Top-Left -->
      <circle class="bold-line" cx="110" cy="600" r="32" />

      <!-- Center Flower Disc -->
      <circle class="bold-line" cx="170" cy="610" r="42" />
      <!-- Happy Flower Face -->
      <circle class="med-line" cx="155" cy="605" r="4.5" />
      <circle class="med-line" cx="185" cy="605" r="4.5" />
      <path class="med-line nofill" d="M 157 623 Q 170 635 183 623" />
    </g>


    <!-- FLOWER 2: Center Giant Cheerful Tulip / Bell Flower -->
    <g id="flower-center">
      <!-- Leaves -->
      <path class="bold-line" d="M 390 890 C 310 840, 290 730, 360 670 C 380 730, 395 810, 390 890 Z" />
      <path class="med-line nofill" d="M 345 700 Q 365 760 390 890" />

      <path class="bold-line" d="M 410 890 C 490 830, 500 710, 430 650 C 420 720, 410 800, 410 890 Z" />
      <path class="med-line nofill" d="M 445 685 Q 430 755 410 890" />

      <!-- Stem -->
      <path class="bold-line" d="M 400 910 Q 395 780, 400 660" />

      <!-- Tulip Head -->
      <path class="bold-line" d="M 340 570 
        C 330 670, 470 670, 460 570 
        C 450 510, 430 550, 400 490 
        C 370 550, 350 510, 340 570 Z" />

      <!-- Tulip Center details/petal curves -->
      <path class="bold-line nofill" d="M 365 555 C 365 630, 400 650, 400 650" />
      <path class="bold-line nofill" d="M 435 555 C 435 630, 400 650, 400 650" />

      <!-- Tulip Cute Face -->
      <circle class="med-line" cx="385" cy="590" r="4.5" />
      <circle class="med-line" cx="415" cy="590" r="4.5" />
      <path class="med-line nofill" d="M 390 608 Q 400 618 410 608" />
    </g>


    <!-- FLOWER 3: Right Cheerful Daisy -->
    <g id="flower-right">
      <!-- Leaves -->
      <path class="bold-line" d="M 640 820 C 570 790, 575 730, 615 715 C 645 705, 645 765, 640 820 Z" />
      <path class="med-line nofill" d="M 605 730 Q 625 765 640 820" />

      <path class="bold-line" d="M 655 835 C 730 820, 745 760, 705 735 C 675 715, 665 775, 655 835 Z" />
      <path class="med-line nofill" d="M 695 745 Q 675 780 655 835" />

      <!-- Stem -->
      <path class="bold-line" d="M 650 900 Q 640 780, 650 635" />

      <!-- Petals (5 Big Round Petals) -->
      <circle class="bold-line" cx="650" cy="535" r="35" />
      <circle class="bold-line" cx="720" cy="585" r="35" />
      <circle class="bold-line" cx="695" cy="665" r="35" />
      <circle class="bold-line" cx="605" cy="665" r="35" />
      <circle class="bold-line" cx="580" cy="585" r="35" />

      <!-- Center Disc -->
      <circle class="bold-line" cx="650" cy="610" r="45" />

      <!-- Cute Face -->
      <circle class="med-line" cx="635" cy="605" r="4.5" />
      <circle class="med-line" cx="665" cy="605" r="4.5" />
      <path class="med-line nofill" d="M 637 623 Q 650 635 663 623" />
    </g>


    <!-- SMALL GROUND FLOWERS & GRASS TUFTS -->
    <!-- Small Left Flower -->
    <g id="small-flower-1">
      <path class="med-line" d="M 50 910 Q 45 860, 50 820" />
      <circle class="med-line" cx="50" cy="795" r="14" />
      <circle class="med-line" cx="70" cy="815" r="14" />
      <circle class="med-line" cx="50" cy="835" r="14" />
      <circle class="med-line" cx="30" cy="815" r="14" />
      <circle class="med-line" cx="50" cy="815" r="16" />
    </g>

    <!-- Small Middle-Right Flower -->
    <g id="small-flower-2">
      <path class="med-line" d="M 525 930 Q 535 880, 530 840" />
      <circle class="med-line" cx="530" cy="820" r="13" />
      <circle class="med-line" cx="548" cy="835" r="13" />
      <circle class="med-line" cx="538" cy="855" r="13" />
      <circle class="med-line" cx="518" cy="850" r="13" />
      <circle class="med-line" cx="515" cy="830" r="13" />
      <circle class="med-line" cx="530" cy="838" r="14" />
    </g>

    <!-- Small Far-Right Flower -->
    <g id="small-flower-3">
      <path class="med-line" d="M 750 920 Q 745 880, 755 845" />
      <circle class="med-line" cx="755" cy="830" r="12" />
      <circle class="med-line" cx="770" cy="845" r="12" />
      <circle class="med-line" cx="755" cy="860" r="12" />
      <circle class="med-line" cx="740" cy="845" r="12" />
      <circle class="med-line" cx="755" cy="845" r="13" />
    </g>

    <!-- Grass Tufts -->
    <!-- Grass 1 -->
    <path class="med-line" d="M 100 895 Q 90 855 70 850 Q 95 865 105 895 Q 115 845 130 835 Q 120 865 115 895 Z" />
    <!-- Grass 2 -->
    <path class="med-line" d="M 260 915 Q 245 870 230 865 Q 255 880 265 915 Q 280 860 300 850 Q 285 880 275 915 Z" />
    <!-- Grass 3 -->
    <path class="med-line" d="M 465 930 Q 460 885 445 875 Q 470 890 475 930 Q 485 880 505 870 Q 490 900 485 930 Z" />
    <!-- Grass 4 -->
    <path class="med-line" d="M 700 895 Q 690 860 675 850 Q 695 865 705 895 Q 715 855 735 845 Q 720 870 715 895 Z" />
  </g>

  <!-- BORDER FRAME (Coloring book neat thick outline) -->
  <rect class="bold-line nofill" x="15" y="15" width="770" height="970" rx="25" ry="25" style="stroke-width: 6;" />

</svg>