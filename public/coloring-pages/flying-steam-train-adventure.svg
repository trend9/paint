<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="4" fill="white" stroke-linejoin="round" stroke-linecap="round">
  <!-- Background Elements: Moon and Stars -->
  <g id="background_elements">
    <!-- Moon -->
    <circle cx="700" cy="150" r="80" />
    <!-- Stars -->
    <circle cx="600" cy="80" r="20" />
    <circle cx="650" cy="250" r="15" />
    <circle cx="750" cy="300" r="25" />
    <circle cx="500" cy="120" r="18" />
  </g>

  <!-- Fluffy Clouds -->
  <g id="clouds">
    <!-- Main cloud near train -->
    <path d="M100 700 Q150 650 200 700 C250 750 300 700 350 700 Q400 650 450 700 Q500 750 450 800 C400 850 350 800 300 800 Q250 850 200 800 Q150 750 100 700 Z" />
    <!-- Other clouds -->
    <path d="M50 350 Q100 300 150 350 C200 400 250 350 300 350 Q350 300 400 350 Q450 400 400 450 C350 500 300 450 250 450 Q200 500 150 450 Q100 400 50 350 Z" />
    <path d="M550 100 Q600 50 650 100 C700 150 750 100 800 100 Q750 50 700 50 Q650 0 600 50 Q550 100 550 100 Z" />
    <path d="M500 800 Q550 750 600 800 C650 850 700 800 750 800 Q800 750 750 700 Q700 650 650 700 Q600 750 550 700 Q500 750 500 800 Z" />
  </g>

  <!-- Cute Steam Locomotive -->
  <g id="locomotive" transform="translate(100, 350)">
    <!-- Main chassis / running board -->
    <rect x="0" y="180" width="550" height="70" rx="20" ry="20" />

    <!-- Boiler body -->
    <rect x="50" y="50" width="300" height="130" rx="0" ry="0" />
    <!-- Front cap of boiler -->
    <ellipse cx="50" cy="115" rx="65" ry="65" />

    <!-- Cabin -->
    <rect x="350" y="70" width="180" height="180" rx="30" ry="30" />
    <!-- Cabin Window -->
    <rect x="390" y="100" width="100" height="100" rx="15" ry="15" />

    <!-- Chimney -->
    <rect x="150" y="-30" width="80" height="80" rx="25" ry="25" />
    <ellipse cx="190" cy="-30" rx="45" ry="25" /> <!-- Top of chimney -->

    <!-- Wheels -->
    <g id="locomotive_wheels">
      <circle cx="150" cy="280" r="70" />
      <circle cx="400" cy="280" r="70" />
      <!-- Connecting rod -->
      <rect x="140" y="270" width="270" height="20" rx="10" ry="10" />
      <!-- Axle connectors for wheels (smaller circles for detail) -->
      <circle cx="150" cy="280" r="20" stroke-width="3" />
      <circle cx="400" cy="280" r="20" stroke-width="3" />
    </g>

    <!-- Headlight -->
    <circle cx="20" cy="115" r="45" />

    <!-- Face (simplified) on the front of the boiler/headlight -->
    <g id="locomotive_face" transform="translate(20, 115)">
      <circle cx="-18" cy="-18" r="15" /> <!-- Left Eye -->
      <circle cx="18" cy="-18" r="15" /> <!-- Right Eye -->
      <path d="M-25 10 Q0 35 25 10" fill="none" stroke="black" stroke-width="4"/> <!-- Smile -->
    </g>

    <!-- Smoke coming from chimney -->
    <g id="locomotive_smoke" transform="translate(190, -30)">
      <circle cx="0" cy="-50" r="50" />
      <circle cx="-30" cy="-100" r="60" />
      <circle cx="30" cy="-100" r="60" />
      <circle cx="0" cy="-150" r="70" />
      <circle cx="-40" cy="-200" r="60" />
      <circle cx="40" cy="-200" r="60" />
      <circle cx="0" cy="-250" r="70" />
    </g>
  </g>
</svg>