<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline {
        stroke: black;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: white;
      }
      .thick-outline {
        stroke-width: 5;
      }
      .medium-outline {
        stroke-width: 4;
      }
      .thin-outline {
        stroke-width: 3;
      }
    </style>
  </defs>

  <!-- Background Hills -->
  <g id="hills">
    <path class="outline medium-outline" d="M0 800 Q200 750 400 800 T800 820 V1000 H0 Z" />
    <path class="outline medium-outline" d="M0 850 Q150 820 300 850 T600 840 T800 870 V1000 H0 Z" />
  </g>

  <!-- Forest Floor/Grass Tuft -->
  <g id="grass">
    <path class="outline medium-outline" d="M0 900 Q100 880 200 900 T400 890 T600 910 T800 900 V1000 H0 Z" />
    <path class="outline medium-outline" d="M100 905 Q120 895 140 905" fill="none"/>
    <path class="outline medium-outline" d="M600 905 Q620 895 640 905" fill="none"/>
  </g>

  <!-- Mushroom House -->
  <g id="mushroom_house">
    <!-- Mushroom Stem -->
    <path class="outline thick-outline" d="M450 600 C430 550 430 400 450 350 S550 350 570 400 C570 400 570 550 550 600 Z" />
    <path class="outline medium-outline" d="M470 590 C470 570 470 420 480 370 S520 370 530 420 C530 420 530 570 530 590 Z" />
    <!-- Mushroom Cap -->
    <path class="outline thick-outline" d="M350 350 C300 250 350 150 450 100 S650 150 700 250 S650 350 500 350 Z" />
    <!-- Cap Spots -->
    <circle class="outline thin-outline" cx="420" cy="180" r="30" />
    <circle class="outline thin-outline" cx="580" cy="200" r="35" />
    <circle class="outline thin-outline" cx="500" cy="150" r="25" />
    <!-- Door -->
    <rect class="outline thin-outline" x="480" y="500" width="70" height="90" rx="20" ry="20" />
    <circle class="outline thin-outline" cx="540" cy="545" r="5" fill="black"/>
    <!-- Windows -->
    <ellipse class="outline thin-outline" cx="490" cy="420" rx="20" ry="25" />
    <ellipse class="outline thin-outline" cx="540" cy="420" rx="20" ry="25" />
    <!-- Flower on house -->
    <g id="house_flower">
      <circle class="outline thin-outline" cx="420" cy="380" r="10"/>
      <path class="outline thin-outline" d="M420 380 L405 370 C400 360 410 350 420 360 C430 350 440 360 435 370 Z"/>
      <path class="outline thin-outline" d="M420 380 L435 390 C440 400 430 410 420 400 C410 410 400 400 405 390 Z"/>
      <path class="outline thin-outline" d="M420 380 L430 375 C435 365 445 365 440 375 C445 385 435 395 430 390 Z" transform="rotate(45 420 380)"/>
      <path class="outline thin-outline" d="M420 380 L410 385 C405 395 395 395 400 385 C395 375 405 365 410 370 Z" transform="rotate(45 420 380)"/>
    </g>
  </g>

  <!-- Fairy -->
  <g id="fairy">
    <!-- Body -->
    <path class="outline thin-outline" d="M490 600 C470 600 460 620 470 640 S510 660 530 640 S540 600 520 600 Z" />
    <!-- Head -->
    <ellipse class="outline thin-outline" cx="500" cy="580" rx="25" ry="30" />
    <!-- Hair -->
    <path class="outline thin-outline" d="M480 560 Q460 550 460 570 T480 600 Q500 590 520 600 T540 570 Q540 550 520 560 Z" />
    <!-- Face -->
    <circle class="outline thin-outline" cx="490" cy="575" r="3" fill="black"/>
    <circle class="outline thin-outline" cx="510" cy="575" r="3" fill="black"/>
    <path class="outline thin-outline" d="M495 585 Q500 590 505 585" fill="none" />
    <!-- Arms -->
    <path class="outline thin-outline" d="M480 610 Q470 600 460 610 T460 630 T480 640" />
    <path class="outline thin-outline" d="M520 610 Q530 600 540 610 T540 630 T520 640" />
    <!-- Legs (sitting) -->
    <path class="outline thin-outline" d="M490 650 Q480 660 490 670 T510 670 T520 660 T510 650" />
    <path class="outline thin-outline" d="M510 650 Q520 660 510 670 T490 670 T480 660 T490 650" />
    <!-- Wings -->
    <path class="outline thin-outline" d="M470 560 C450 530 460 500 480 500 S500 530 470 560 Z" />
    <path class="outline thin-outline" d="M530 560 C550 530 540 500 520 500 S500 530 530 560 Z" />
    <path class="outline thin-outline" d="M460 580 C440 550 450 520 470 520 S490 550 460 580 Z" />
    <path class="outline thin-outline" d="M540 580 C560 550 550 520 530 520 S510 550 540 580 Z" />
  </g>

  <!-- Friendly Forest Animals -->
  <g id="animals">
    <!-- Squirrel -->
    <g id="squirrel">
      <!-- Body -->
      <ellipse class="outline medium-outline" cx="150" cy="700" rx="40" ry="60" transform="rotate(-15 150 700)" />
      <!-- Head -->
      <ellipse class="outline thin-outline" cx="120" cy="650" rx="25" ry="30" transform="rotate(-10 120 650)" />
      <!-- Ears -->
      <ellipse class="outline thin-outline" cx="105" cy="630" rx="7" ry="10" transform="rotate(-20 105 630)" />
      <ellipse class="outline thin-outline" cx="130" cy="625" rx="7" ry="10" transform="rotate(10 130 625)" />
      <!-- Eyes -->
      <circle class="outline thin-outline" cx="110" cy="645" r="3" fill="black"/>
      <circle class="outline thin-outline" cx="125" cy="640" r="3" fill="black"/>
      <!-- Nose -->
      <circle class="outline thin-outline" cx="115" cy="655" r="2" fill="black"/>
      <!-- Mouth -->
      <path class="outline thin-outline" d="M110 660 Q115 665 120 660" fill="none" />
      <!-- Tail -->
      <path class="outline medium-outline" d="M180 670 Q250 600 280 650 T200 750 Q150 720 180 670 Z" />
      <!-- Paws -->
      <path class="outline thin-outline" d="M120 710 Q110 700 120 690 T140 690 T150 700" />
      <path class="outline thin-outline" d="M160 720 Q150 710 160 700 T180 700 T190 710" />
    </g>

    <!-- Bird -->
    <g id="bird">
      <!-- Body -->
      <ellipse class="outline medium-outline" cx="700" cy="720" rx="40" ry="30" transform="rotate(10 700 720)" />
      <!-- Head -->
      <circle class="outline thin-outline" cx="670" cy="700" r="20" />
      <!-- Eye -->
      <circle class="outline thin-outline" cx="660" cy="695" r="3" fill="black"/>
      <!-- Beak -->
      <path class="outline thin-outline" d="M655 700 L640 705 L655 710 Z" />
      <!-- Wing -->
      <path class="outline thin-outline" d="M700 710 Q730 690 740 710 T720 730 T700 710 Z" />
      <!-- Tail Feathers -->
      <path class="outline thin-outline" d="M730 730 L750 740 L740 750 L720 740 Z" />
      <!-- Legs -->
      <path class="outline thin-outline" d="M680 745 L670 760 M690 745 L700 760" fill="none"/>
      <path class="outline thin-outline" d="M670 760 L665 765 M670 760 L675 765" fill="none"/>
      <path class="outline thin-outline" d="M700 760 L695 765 M700 760 L705 765" fill="none"/>
    </g>
  </g>

  <!-- Large Simple Leaves and Flowers -->
  <g id="forest_elements">
    <!-- Big Flower 1 -->
    <g id="flower1">
      <circle class="outline medium-outline" cx="250" cy="850" r="25" />
      <path class="outline medium-outline" d="M250 850 L250 810 C270 800 280 820 250 830 Z"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(90 250 850)"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(180 250 850)"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(270 250 850)"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(45 250 850)"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(135 250 850)"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(225 250 850)"/>
      <path class="outline medium-outline" d="M250 850 L250 810 C230 800 220 820 250 830 Z" transform="rotate(315 250 850)"/>
      <path class="outline medium-outline" d="M250 880 V900" fill="none"/>
    </g>

    <!-- Big Flower 2 -->
    <g id="flower2">
      <circle class="outline medium-outline" cx="700" cy="850" r="20" />
      <path class="outline medium-outline" d="M700 850 L700 820 C710 810 720 830 700 830 Z"/>
      <path class="outline medium-outline" d="M700 850 L700 820 C690 810 680 830 700 830 Z" transform="rotate(90 700 850)"/>
      <path class="outline medium-outline" d="M700 850 L700 820 C690 810 680 830 700 830 Z" transform="rotate(180 700 850)"/>
      <path class="outline medium-outline" d="M700 850 L700 820 C690 810 680 830 700 830 Z" transform="rotate(270 700 850)"/>
      <path class="outline medium-outline" d="M700 880 V900" fill="none"/>
    </g>

    <!-- Large Simple Leaves -->
    <g id="leaves">
      <path class="outline medium-outline" d="M100 500 Q150 450 200 500 Q150 550 100 500 Z" />
      <path class="outline thin-outline" d="M150 470 L150 530" fill="none"/>
      <path class="outline thin-outline" d="M150 500 L120 485 M150 500 L120 515 M150 500 L180 485 M150 500 L180 515" fill="none"/>

      <path class="outline medium-outline" d="M600 550 Q650 500 700 550 Q650 600 600 550 Z" />
      <path class="outline thin-outline" d="M650 520 L650 580" fill="none"/>
      <path class="outline thin-outline" d="M650 550 L620 535 M650 550 L620 565 M650 550 L680 535 M650 550 L680 565" fill="none"/>

      <path class="outline medium-outline" d="M300 700 Q350 650 400 700 Q350 750 300 700 Z" />
      <path class="outline thin-outline" d="M350 670 L350 730" fill="none"/>
      <path class="outline thin-outline" d="M350 700 L320 685 M350 700 L320 715 M350 700 L380 685 M350 700 L380 715" fill="none"/>
    </g>
  </g>

</svg>