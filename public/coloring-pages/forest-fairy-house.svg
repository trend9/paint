<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Ground line -->
  <path d="M 0 950 H 800" stroke="black" stroke-width="5" fill="none"/>

  <!-- Mushroom House -->
  <g id="mushroom-house">
    <!-- Mushroom Stem -->
    <rect x="350" y="600" width="100" height="350" rx="30" ry="30" stroke="black" stroke-width="5" fill="white"/>
    <!-- Mushroom Cap -->
    <path d="M 300 600 C 300 400, 500 400, 500 600 L 300 600 Z" stroke="black" stroke-width="5" fill="white"/>
    
    <!-- Door -->
    <rect x="375" y="750" width="50" height="150" rx="20" ry="20" stroke="black" stroke-width="4" fill="white"/>
    <!-- Windows -->
    <circle cx="370" cy="670" r="20" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="430" cy="670" r="20" stroke="black" stroke-width="4" fill="white"/>
    <!-- Mushroom spots -->
    <circle cx="350" cy="480" r="30" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="450" cy="520" r="35" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="400" cy="450" r="25" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Fairy -->
  <g id="fairy">
    <!-- Body (sitting gently) -->
    <ellipse cx="250" cy="880" rx="60" ry="50" stroke="black" stroke-width="5" fill="white"/>
    <!-- Head -->
    <circle cx="250" cy="780" r="50" stroke="black" stroke-width="5" fill="white"/>
    <!-- Hair -->
    <path d="M 200 750 Q 200 700 250 720 Q 300 700 300 750 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 200 750 C 180 770, 180 810, 200 830 C 200 830, 220 840, 250 830 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 300 750 C 320 770, 320 810, 300 830 C 300 830, 280 840, 250 830 Z" stroke="black" stroke-width="4" fill="white"/>

    <!-- Face details -->
    <circle cx="230" cy="770" r="10" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="270" cy="770" r="10" stroke="black" stroke-width="3" fill="white"/>
    <path d="M 235 795 Q 250 810 265 795" stroke="black" stroke-width="3" fill="none"/> <!-- Smile -->

    <!-- Arms -->
    <path d="M 200 850 Q 180 830 150 870 Q 170 900 200 880 Z" stroke="black" stroke-width="4" fill="white"/> <!-- Left arm -->
    <path d="M 300 850 Q 320 830 350 870 Q 330 900 300 880 Z" stroke="black" stroke-width="4" fill="white"/> <!-- Right arm -->

    <!-- Wings -->
    <g id="wings">
      <!-- Left wing large -->
      <path d="M 250 780 Q 150 700 100 750 Q 150 800 250 800 Z" stroke="black" stroke-width="4" fill="white"/>
      <!-- Left wing small -->
      <path d="M 250 780 Q 180 680 150 700 Q 200 750 250 780 Z" stroke="black" stroke-width="4" fill="white"/>
      <!-- Right wing large -->
      <path d="M 250 780 Q 350 700 400 750 Q 350 800 250 800 Z" stroke="black" stroke-width="4" fill="white"/>
      <!-- Right wing small -->
      <path d="M 250 780 Q 320 680 350 700 Q 300 750 250 780 Z" stroke="black" stroke-width="4" fill="white"/>
    </g>
  </g>

  <!-- Flowers and Leaves -->
  <g id="foliage">
    <!-- Large Flower 1 (left bottom) -->
    <circle cx="100" cy="900" r="40" stroke="black" stroke-width="5" fill="white"/> <!-- Center -->
    <circle cx="100" cy="830" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal top -->
    <circle cx="150" cy="870" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal right-top -->
    <circle cx="150" cy="930" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal right-bottom -->
    <circle cx="50" cy="930" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal left-bottom -->
    <circle cx="50" cy="870" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal left-top -->
    <path d="M 100 940 V 970" stroke="black" stroke-width="4" fill="none"/> <!-- Stem -->

    <!-- Large Flower 2 (right bottom) -->
    <circle cx="700" cy="900" r="40" stroke="black" stroke-width="5" fill="white"/> <!-- Center -->
    <circle cx="700" cy="830" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal top -->
    <circle cx="750" cy="870" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal right-top -->
    <circle cx="750" cy="930" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal right-bottom -->
    <circle cx="650" cy="930" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal left-bottom -->
    <circle cx="650" cy="870" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Petal left-top -->
    <path d="M 700 940 V 970" stroke="black" stroke-width="4" fill="none"/> <!-- Stem -->
    
    <!-- Large Flower 3 (behind mushroom) -->
    <circle cx="600" cy="800" r="35" stroke="black" stroke-width="5" fill="white"/> <!-- Center -->
    <circle cx="600" cy="730" r="30" stroke="black" stroke-width="5" fill="white"/>
    <circle cx="640" cy="760" r="30" stroke="black" stroke-width="5" fill="white"/>
    <circle cx="640" cy="840" r="30" stroke="black" stroke-width="5" fill="white"/>
    <circle cx="560" cy="840" r="30" stroke="black" stroke-width="5" fill="white"/>
    <circle cx="560" cy="760" r="30" stroke="black" stroke-width="5" fill="white"/>
    <path d="M 600 835 V 900" stroke="black" stroke-width="4" fill="none"/>

    <!-- Simple Leaves -->
    <ellipse cx="50" cy="950" rx="40" ry="20" transform="rotate(20 50 950)" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="150" cy="960" rx="40" ry="20" transform="rotate(-20 150 960)" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="750" cy="950" rx="40" ry="20" transform="rotate(-20 750 950)" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="650" cy="960" rx="40" ry="20" transform="rotate(20 650 960)" stroke="black" stroke-width="4" fill="white"/>

    <!-- Leaves around mushroom -->
    <ellipse cx="300" cy="940" rx="50" ry="30" transform="rotate(-10 300 940)" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="500" cy="940" rx="50" ry="30" transform="rotate(10 500 940)" stroke="black" stroke-width="4" fill="white"/>
  </g>
</svg>