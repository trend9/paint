<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Ensure a pure white background for the coloring page -->
  <rect x="0" y="0" width="800" height="1000" fill="white" />

  <g id="cat-magician" stroke="black" stroke-width="4" fill="white">
    <!-- Cat Body -->
    <ellipse cx="400" cy="620" rx="150" ry="120" />

    <!-- Cat Head -->
    <circle cx="400" cy="400" r="120" />

    <!-- Cat Ears -->
    <path d="M 300 300 Q 320 250 380 280 Q 350 300 300 300 Z" /> <!-- Left ear -->
    <path d="M 500 300 Q 480 250 420 280 Q 450 300 500 300 Z" /> <!-- Right ear -->

    <!-- Cat Face -->
    <g id="cat-face">
      <!-- Eyes -->
      <circle cx="350" cy="380" r="30" />
      <circle cx="450" cy="380" r="30" />
      <!-- Pupils -->
      <circle cx="350" cy="380" r="10" />
      <circle cx="450" cy="380" r="10" />
      <!-- Nose -->
      <ellipse cx="400" cy="430" rx="20" ry="15" />
      <!-- Mouth -->
      <path d="M 370 450 Q 400 480 430 450" fill="none" />
      <!-- Whiskers -->
      <path d="M 300 420 L 250 400 M 300 440 L 250 440 M 300 460 L 250 480" fill="none" stroke-linecap="round"/>
      <path d="M 500 420 L 550 400 M 500 440 L 550 440 M 500 460 L 550 480" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Cat Paws (holding wand and other) -->
    <path d="M 320 580 Q 300 550 280 500 Q 290 490 320 500 Q 350 510 320 580 Z" /> <!-- Left arm stub for wand -->
    <circle cx="280" cy="500" r="40" /> <!-- Left hand/paw holding wand -->
    <path d="M 420 750 Q 480 750 500 700 Q 450 720 420 750 Z" /> <!-- Right paw -->
    <path d="M 300 700 Q 320 750 380 750 Q 350 720 300 700 Z" /> <!-- Left foot -->


    <!-- Cat Tail -->
    <path d="M 500 700 Q 550 750 600 650 Q 580 600 500 700 Z" />
  </g>

  <g id="wizard-hat" stroke="black" stroke-width="4" fill="white">
    <!-- Hat Brim -->
    <ellipse cx="400" cy="310" rx="140" ry="40" />
    <!-- Hat Cone -->
    <path d="M 270 310 A 130 30 0 0 1 530 310 L 400 150 Z" />
    <!-- Stars on hat (simplified) -->
    <g id="hat-stars" fill="white" stroke="black" stroke-width="3">
      <rect x="340" y="215" width="40" height="10" rx="2" ry="2" transform="rotate(15 360 220)" />
      <rect x="355" y="195" width="10" height="40" rx="2" ry="2" transform="rotate(15 360 220)" />
      <rect x="420" y="255" width="40" height="10" rx="2" ry="2" transform="rotate(-10 440 260)" />
      <rect x="435" y="235" width="10" height="40" rx="2" ry="2" transform="rotate(-10 440 260)" />
    </g>
  </g>

  <g id="magic-wand" stroke="black" stroke-width="4" fill="white">
    <!-- Wand Stick -->
    <rect x="250" y="280" width="20" height="250" rx="10" ry="10" transform="rotate(-30 280 500)" />
    <!-- Wand Star Top (simplified) -->
    <g transform="translate(195 240) rotate(-30 50 50)" fill="white" stroke="black" stroke-width="4">
      <rect x="30" y="45" width="40" height="10" rx="2" ry="2" />
      <rect x="45" y="30" width="10" height="40" rx="2" ry="2" />
    </g>
    <!-- Sparkles -->
    <g id="wand-sparkles" stroke="black" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="200" y1="200" x2="180" y2="180" />
      <line x1="220" y1="200" x2="240" y2="180" />
      <line x1="200" y1="180" x2="180" y2="200" />
      <line x1="220" y1="180" x2="240" y2="200" />
    </g>
  </g>

  <g id="spellbook-pedestal" stroke="black" stroke-width="4" fill="white">
    <!-- Pedestal -->
    <rect x="550" y="700" width="150" height="100" rx="20" ry="20" />
    <ellipse cx="625" cy="700" rx="90" ry="20" /> <!-- Top ledge -->

    <!-- Spellbook (open) -->
    <g transform="translate(625, 620) rotate(10)">
      <rect x="-60" y="-30" width="120" height="80" rx="10" ry="10" /> <!-- Right page -->
      <rect x="-140" y="-30" width="120" height="80" rx="10" ry="10" /> <!-- Left page -->
      <rect x="-20" y="-30" width="40" height="80" rx="5" ry="5" /> <!-- Spine (simplified) -->
      <!-- Simple decorative element on left page -->
      <circle cx="-90" cy="0" r="15" fill="white" stroke="black" stroke-width="3" />
    </g>
  </g>

  <g id="magical-elements" stroke="black" stroke-width="4" fill="white">
    <!-- Floating Stars (simplified) -->
    <g id="stars" stroke-width="3">
      <rect x="90" y="165" width="40" height="10" rx="2" ry="2" transform="rotate(20 110 170)" />
      <rect x="105" y="145" width="10" height="40" rx="2" ry="2" transform="rotate(20 110 170)" />
      <rect x="640" y="115" width="40" height="10" rx="2" ry="2" transform="rotate(-30 660 120)" />
      <rect x="655" y="95" width="10" height="40" rx="2" ry="2" transform="rotate(-30 660 120)" />
      <rect x="690" y="465" width="40" height="10" rx="2" ry="2" transform="rotate(5 710 470)" />
      <rect x="705" y="445" width="10" height="40" rx="2" ry="2" transform="rotate(5 710 470)" />
      <rect x="140" y="865" width="40" height="10" rx="2" ry="2" transform="rotate(25 160 870)" />
      <rect x="155" y="845" width="10" height="40" rx="2" ry="2" transform="rotate(25 160 870)" />
    </g>

    <!-- Crescent Moons -->
    <g id="moons">
      <!-- Moon 1 -->
      <path d="M 150 250 A 50 50 0 1 0 150 350 A 40 40 0 1 1 150 250 Z" />
      <!-- Moon 2 -->
      <path d="M 700 200 A 40 40 0 1 0 700 280 A 30 30 0 1 1 700 200 Z" />
      <!-- Moon 3 -->
      <path d="M 100 500 A 30 30 0 1 0 100 560 A 25 25 0 1 1 100 500 Z" />
    </g>

    <!-- Potion Bottles -->
    <g id="potion-bottles">
      <!-- Bottle 1 -->
      <path d="M 600 850 L 600 800 Q 600 780 610 770 L 620 770 Q 630 780 630 800 L 630 850 Q 630 870 615 870 Q 600 870 600 850 Z" />
      <rect x="605" y="760" width="20" height="15" rx="5" ry="5" /> <!-- Stopper -->
      <!-- Bottle 2 -->
      <path d="M 200 700 L 200 650 Q 200 630 210 620 L 220 620 Q 230 630 230 650 L 230 700 Q 230 720 215 720 Q 200 720 200 700 Z" />
      <rect x="205" y="610" width="20" height="15" rx="5" ry="5" /> <!-- Stopper -->
    </g>
  </g>
</svg>