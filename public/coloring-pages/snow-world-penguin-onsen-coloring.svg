<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .outline {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .steam-line {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail-stroke {
        stroke: black;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pupil-stroke {
        stroke: black;
        stroke-width: 2; /* Thinner stroke for small pupil outline */
        fill: white;
      }
    ]]></style>
  </defs>

  <!-- Background Mountains -->
  <g id="mountains">
    <path class="outline" d="M0 700 Q150 500 300 700 L300 1000 L0 1000 Z"/>
    <path class="outline" d="M250 650 Q400 450 550 650 L550 1000 L250 1000 Z"/>
    <path class="outline" d="M500 700 Q650 500 800 700 L800 1000 L500 1000 Z"/>
  </g>

  <!-- Hot Spring Water -->
  <g id="hot_spring_water">
    <path class="outline" d="M100 800 C150 700 300 650 400 650 S650 700 700 800 C650 900 400 950 100 800 Z"/>
  </g>

  <!-- Steam rising from the water -->
  <g id="steam">
    <path class="steam-line" d="M250 600 C270 550 250 500 280 480 C310 460 300 420 330 400"/>
    <path class="steam-line" d="M350 600 C370 550 350 500 380 480 C410 460 400 420 430 400"/>
    <path class="steam-line" d="M450 600 C470 550 450 500 480 480 C510 460 500 420 530 400"/>
  </g>

  <!-- Small Icebergs -->
  <g id="icebergs">
    <path class="outline" d="M150 850 Q180 820 200 850 Q180 880 150 850 Z"/>
    <path class="outline" d="M600 750 Q630 720 650 750 Q630 780 600 750 Z"/>
    <path class="outline" d="M300 900 Q330 870 350 900 Q330 930 300 900 Z"/>
  </g>

  <!-- Cute Happy Penguins -->
  <g id="penguins">
    <!-- Penguin 1 (Left) -->
    <g id="penguin_left">
      <ellipse class="outline" cx="350" cy="780" rx="50" ry="80"/> <!-- Body -->
      <circle class="outline" cx="350" cy="710" r="30"/> <!-- Head -->
      <circle class="outline" cx="335" cy="705" r="5"/> <!-- Eye White Left -->
      <circle class="pupil-stroke" cx="335" cy="705" r="2"/> <!-- Pupil Left -->
      <circle class="outline" cx="365" cy="705" r="5"/> <!-- Eye White Right -->
      <circle class="pupil-stroke" cx="365" cy="705" r="2"/> <!-- Pupil Right -->
      <path class="detail-stroke" d="M340 730 Q350 740 360 730"/> <!-- Smile -->
      <path class="outline" d="M300 760 Q305 740 320 730 Q310 750 300 760 Z"/> <!-- Left Wing -->
      <path class="outline" d="M400 760 Q395 740 380 730 Q390 750 400 760 Z"/> <!-- Right Wing -->
      <polygon class="outline" points="345,720 355,720 350,725"/> <!-- Beak -->
    </g>

    <!-- Penguin 2 (Center) -->
    <g id="penguin_center">
      <ellipse class="outline" cx="500" cy="850" rx="55" ry="85"/> <!-- Body -->
      <circle class="outline" cx="500" cy="770" r="35"/> <!-- Head -->
      <circle class="outline" cx="485" cy="765" r="6"/> <!-- Eye White Left -->
      <circle class="pupil-stroke" cx="485" cy="765" r="2.5"/> <!-- Pupil Left -->
      <circle class="outline" cx="515" cy="765" r="6"/> <!-- Eye White Right -->
      <circle class="pupil-stroke" cx="515" cy="765" r="2.5"/> <!-- Pupil Right -->
      <path class="detail-stroke" d="M490 790 Q500 800 510 790"/> <!-- Smile -->
      <path class="outline" d="M445 830 Q450 810 465 800 Q455 820 445 830 Z"/> <!-- Left Wing -->
      <path class="outline" d="M555 830 Q550 810 535 800 Q545 820 555 830 Z"/> <!-- Right Wing -->
      <polygon class="outline" points="495,780 505,780 500,787"/> <!-- Beak -->
    </g>

    <!-- Penguin 3 (Right) -->
    <g id="penguin_right">
      <ellipse class="outline" cx="200" cy="890" rx="45" ry="75"/> <!-- Body -->
      <circle class="outline" cx="200" cy="820" r="28"/> <!-- Head -->
      <circle class="outline" cx="185" cy="815" r="4.5"/> <!-- Eye White Left -->
      <circle class="pupil-stroke" cx="185" cy="815" r="1.8"/> <!-- Pupil Left -->
      <circle class="outline" cx="215" cy="815" r="4.5"/> <!-- Eye White Right -->
      <circle class="pupil-stroke" cx="215" cy="815" r="1.8"/> <!-- Pupil Right -->
      <path class="detail-stroke" d="M190 840 Q200 850 210 840"/> <!-- Smile -->
      <path class="outline" d="M155 870 Q160 850 175 840 Q165 860 155 870 Z"/> <!-- Left Wing -->
      <path class="outline" d="M245 870 Q240 850 225 840 Q235 860 245 870 Z"/> <!-- Right Wing -->
      <polygon class="outline" points="195,830 205,830 200,836"/> <!-- Beak -->
    </g>
  </g>
</svg>