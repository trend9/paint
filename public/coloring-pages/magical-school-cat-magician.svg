<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="background_castle">
    <!-- Main building body -->
    <rect x="100" y="450" width="600" height="450" rx="50" ry="50" fill="white" stroke="black" stroke-width="5"/>

    <!-- Left Tower -->
    <rect x="150" y="250" width="100" height="250" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <path d="M150 250 C175 190 225 190 250 250 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Turret top -->
    <circle cx="200" cy="350" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Window -->

    <!-- Right Tower -->
    <rect x="550" y="250" width="100" height="250" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <path d="M550 250 C575 190 625 190 650 250 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Turret top -->
    <circle cx="600" cy="350" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Window -->

    <!-- Central Tower -->
    <rect x="350" y="180" width="100" height="320" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <path d="M350 180 C375 120 425 120 450 180 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Turret top -->
    <circle cx="400" cy="280" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Window -->

    <!-- Main building windows -->
    <circle cx="250" cy="600" r="30" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="550" cy="600" r="30" fill="white" stroke="black" stroke-width="4"/>

    <!-- Main door -->
    <rect x="370" y="700" width="60" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <g id="cat_magician">
    <!-- Cat Body -->
    <ellipse cx="400" cy="680" rx="120" ry="160" fill="white" stroke="black" stroke-width="5"/>

    <!-- Cat Head -->
    <circle cx="400" cy="480" r="100" fill="white" stroke="black" stroke-width="5"/>

    <!-- Cat Ears -->
    <path d="M320 450 Q360 390 400 450 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M400 450 Q440 390 480 450 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Cat Arms (simplified) -->
    <ellipse cx="330" cy="630" rx="40" ry="70" fill="white" stroke="black" stroke-width="4"/> <!-- Left arm/paw -->
    <ellipse cx="470" cy="630" rx="40" ry="70" fill="white" stroke="black" stroke-width="4"/> <!-- Right arm/paw for wand -->
    
    <!-- Cat Tail -->
    <path d="M500 720 C580 670 580 770 500 870" fill="none" stroke="black" stroke-width="5"/>

    <!-- Cat Face -->
    <g id="cat_face_details">
      <circle cx="360" cy="460" r="18" fill="white" stroke="black" stroke-width="4"/> <!-- Left Eye -->
      <circle cx="440" cy="460" r="18" fill="white" stroke="black" stroke-width="4"/> <!-- Right Eye -->
      <path d="M400 490 L390 510 L410 510 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Nose (rounded triangle) -->
      <path d="M380 520 Q400 535 420 520" fill="none" stroke="black" stroke-width="4"/> <!-- Mouth (smile) -->
    </g>

    <!-- Pointed Hat -->
    <g id="cat_hat">
      <ellipse cx="400" cy="410" rx="90" ry="25" fill="white" stroke="black" stroke-width="5"/> <!-- Hat brim -->
      <path d="M310 410 C330 280 470 280 490 410 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Hat cone -->
      <circle cx="400" cy="280" r="15" fill="white" stroke="black" stroke-width="4"/> <!-- Hat tip ball -->
    </g>

    <!-- Cape -->
    <path d="M250 580 Q180 730 250 880 L550 880 Q620 730 550 580 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Magic Wand -->
    <g id="magic_wand_details">
      <line x1="510" y1="600" x2="680" y2="400" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <!-- Star at wand tip (simplified polygon) -->
      <polygon points="680,380 690,400 710,405 690,410 680,430 670,410 650,405 670,400" fill="white" stroke="black" stroke-width="4"/>
      <!-- Sparkles around the wand tip -->
      <circle cx="630" cy="370" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="680" cy="390" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="670" cy="430" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="615" cy="410" r="10" fill="white" stroke="black" stroke-width="3"/>
    </g>

  </g>
</svg>