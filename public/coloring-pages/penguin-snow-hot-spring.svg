<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Base -->
  <rect width="800" height="1000" fill="white" />

  <!-- Outer Decorative Border -->
  <rect x="20" y="20" width="760" height="960" rx="30" ry="30" fill="none" stroke="black" stroke-width="5" />

  <!-- Background Hills & Snow Drifts -->
  <g id="background-hills">
    <!-- Distant Mountain / Hill 1 -->
    <path d="M 20 380 Q 180 260 380 320 T 780 280" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" />
    <path d="M 230 295 Q 260 320 290 290 Q 320 330 350 310" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
    
    <!-- Distant Mountain / Hill 2 -->
    <path d="M 20 280 Q 220 160 450 230 Q 620 170 780 220" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" />
    <path d="M 320 195 Q 350 225 380 195 Q 410 230 440 225" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />

    <!-- Pine Trees on Hills (Simplified) -->
    <g id="trees">
      <!-- Tree 1 -->
      <path d="M 100 290 L 80 330 L 90 330 L 70 360 L 130 360 L 110 330 L 120 330 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
      <!-- Tree 2 -->
      <path d="M 680 230 L 665 260 L 673 260 L 655 290 L 705 290 L 687 260 L 695 260 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Clouds and Snowflakes in Sky -->
  <g id="sky-elements">
    <!-- Cloud 1 -->
    <path d="M 80 120 Q 60 100 80 80 Q 110 60 140 80 Q 170 60 200 80 Q 220 100 200 120 Q 220 140 190 150 Q 160 160 130 150 Q 90 160 80 120 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Cloud 2 -->
    <path d="M 560 110 Q 540 90 560 70 Q 590 50 620 70 Q 650 50 680 70 Q 700 90 680 110 Q 700 130 670 140 Q 640 150 610 140 Q 570 150 560 110 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />

    <!-- Simple Snowflakes (Circles and Stars) -->
    <circle cx="280" cy="100" r="10" fill="white" stroke="black" stroke-width="4" />
    <circle cx="480" cy="90" r="12" fill="white" stroke="black" stroke-width="4" />
    <circle cx="380" cy="150" r="8" fill="white" stroke="black" stroke-width="4" />
    <circle cx="230" cy="210" r="9" fill="white" stroke="black" stroke-width="4" />
    <circle cx="540" cy="190" r="11" fill="white" stroke="black" stroke-width="4" />
    <circle cx="120" cy="220" r="8" fill="white" stroke="black" stroke-width="4" />
    <circle cx="710" cy="160" r="10" fill="white" stroke="black" stroke-width="4" />
    
    <!-- Star Snowflakes -->
    <g stroke="black" stroke-width="4" stroke-linecap="round">
      <line x1="330" y1="200" x2="330" y2="230" />
      <line x1="315" y1="215" x2="345" y2="215" />
      
      <line x1="600" y1="240" x2="600" y2="270" />
      <line x1="585" y1="255" x2="615" y2="255" />

      <line x1="450" y1="290" x2="450" y2="310" />
      <line x1="440" y1="300" x2="460" y2="300" />
    </g>
  </g>

  <!-- Hot Spring Pool Surroundings (Smooth Rounded Rocks) -->
  <g id="hot-spring-rocks">
    <!-- Back Rocks -->
    <ellipse cx="120" cy="520" rx="50" ry="35" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="190" cy="500" rx="45" ry="30" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="260" cy="485" rx="55" ry="35" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="350" cy="475" rx="60" ry="35" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="450" cy="475" rx="60" ry="35" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="540" cy="485" rx="55" ry="35" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="610" cy="500" rx="45" ry="30" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="680" cy="520" rx="50" ry="35" fill="white" stroke="black" stroke-width="4" />

    <!-- Snow Caps on Back Rocks -->
    <path d="M 80 505 Q 120 480 160 510 Q 120 495 80 505 Z" fill="white" stroke="black" stroke-width="3" />
    <path d="M 215 465 Q 260 445 305 470 Q 260 458 215 465 Z" fill="white" stroke="black" stroke-width="3" />
    <path d="M 495 465 Q 540 445 585 470 Q 540 458 495 465 Z" fill="white" stroke="black" stroke-width="3" />
    <path d="M 640 505 Q 680 480 720 510 Q 680 495 640 505 Z" fill="white" stroke="black" stroke-width="3" />

    <!-- Front & Side Pool Edge Rocks -->
    <ellipse cx="70" cy="600" rx="45" ry="55" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="60" cy="700" rx="40" ry="60" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="80" cy="800" rx="50" ry="50" fill="white" stroke="black" stroke-width="4" />
    
    <ellipse cx="730" cy="600" rx="45" ry="55" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="740" cy="700" rx="40" ry="60" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="720" cy="800" rx="50" ry="50" fill="white" stroke="black" stroke-width="4" />

    <!-- Bottom Rocks -->
    <ellipse cx="160" cy="870" rx="60" ry="40" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="260" cy="890" rx="65" ry="42" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="370" cy="900" rx="70" ry="45" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="480" cy="900" rx="70" ry="45" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="580" cy="890" rx="65" ry="42" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="670" cy="870" rx="60" ry="40" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Water Surface Line (Pool Interior) -->
  <path d="M 100 580 C 200 530, 600 530, 700 580 C 760 750, 680 870, 400 870 C 120 870, 40 750, 100 580 Z" fill="white" stroke="black" stroke-width="5" />

  <!-- Water Ripple Lines -->
  <g id="water-ripples" stroke="black" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 140 640 Q 200 620 260 640" />
    <path d="M 540 640 Q 600 620 660 640" />
    <path d="M 200 780 Q 280 760 360 780" />
    <path d="M 440 780 Q 520 760 600 780" />
    <path d="M 320 830 Q 400 815 480 830" />
  </g>

  <!-- PENGUIN 1 (Left - Parent Penguin, Relaxing with towel on head) -->
  <g id="penguin-1">
    <!-- Body in water -->
    <path d="M 210 610 C 190 530, 230 430, 310 430 C 390 430, 430 530, 410 610" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" />
    
    <!-- White Belly Contour -->
    <path d="M 245 540 C 240 470, 380 470, 375 540 C 370 600, 250 600, 245 540 Z" fill="white" stroke="black" stroke-width="4" />

    <!-- Eyes (Happy Curved Arcs) -->
    <path d="M 270 490 Q 285 475 300 490" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
    <path d="M 320 490 Q 335 475 350 490" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />

    <!-- Cute Beak -->
    <path d="M 300 500 Q 310 495 320 500 Q 310 525 300 500 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />

    <!-- Cute Rosy Cheeks -->
    <circle cx="260" cy="505" r="10" fill="white" stroke="black" stroke-width="3" />
    <circle cx="360" cy="505" r="10" fill="white" stroke="black" stroke-width="3" />

    <!-- Flippers Resting on Water Edge -->
    <path d="M 215 570 C 180 570, 170 610, 210 615 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    <path d="M 405 570 C 440 570, 450 610, 410 615 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />

    <!-- Small Folded Towel on Head -->
    <path d="M 270 430 Q 310 415 350 430 Q 360 445 350 450 Q 310 440 270 450 Q 260 445 270 430 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    <path d="M 290 430 Q 310 422 330 430" fill="none" stroke="black" stroke-width="3" />

    <!-- Water Line Covering Bottom Body -->
    <path d="M 190 610 Q 310 630 430 610" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
    <path d="M 200 620 Q 310 645 420 620" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- PENGUIN 2 (Right - Baby Penguin, Super Happy / Joyful) -->
  <g id="penguin-2">
    <!-- Body in water -->
    <path d="M 470 650 C 450 580, 490 500, 560 500 C 630 500, 670 580, 650 650" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" />

    <!-- White Face/Belly Contour -->
    <path d="M 495 580 C 490 530, 630 530, 625 580 C 620 630, 500 630, 495 580 Z" fill="white" stroke="black" stroke-width="4" />

    <!-- Big Happy Round Eyes with Shine -->
    <g id="baby-eyes">
      <circle cx="530" cy="550" r="14" fill="white" stroke="black" stroke-width="4" />
      <circle cx="533" cy="546" r="4" fill="white" stroke="black" stroke-width="3" />
      
      <circle cx="590" cy="550" r="14" fill="white" stroke="black" stroke-width="4" />
      <circle cx="593" cy="546" r="4" fill="white" stroke="black" stroke-width="3" />
    </g>

    <!-- Beak (Open Happy Smile) -->
    <path d="M 550 560 Q 560 550 570 560 Q 560 585 550 560 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />

    <!-- Cheeks -->
    <circle cx="505" cy="565" r="8" fill="white" stroke="black" stroke-width="3" />
    <circle cx="615" cy="565" r="8" fill="white" stroke="black" stroke-width="3" />

    <!-- Flippers Up in the Air (Joyful) -->
    <path d="M 470 560 C 440 530, 435 500, 460 510 C 480 520, 480 540, 475 565" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    <path d="M 650 560 C 680 530, 685 500, 660 510 C 640 520, 640 540, 645 565" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />

    <!-- Water Line Covering Baby Penguin -->
    <path d="M 450 645 Q 560 665 670 645" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
    <path d="M 460 655 Q 560 680 660 655" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- FLOATING RUBBER DUCKY -->
  <g id="rubber-ducky">
    <!-- Main Body -->
    <path d="M 390 700 C 360 700, 350 730, 380 735 C 410 740, 430 735, 430 715 C 420 715, 400 715, 390 700 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    <!-- Duck Head -->
    <circle cx="415" cy="695" r="12" fill="white" stroke="black" stroke-width="4" />
    <!-- Beak -->
    <path d="M 425 693 Q 435 695 425 700 Z" fill="white" stroke="black" stroke-width="3" stroke-linejoin="round" />
    <!-- Eye -->
    <circle cx="418" cy="692" r="2" fill="white" stroke="black" stroke-width="2" />
    <!-- Water Ripples Around Duck -->
    <path d="M 350 735 Q 390 745 440 735" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- FLOATING WOODEN TUB -->
  <g id="floating-tub">
    <ellipse cx="230" cy="730" rx="40" ry="15" fill="white" stroke="black" stroke-width="4" />
    <path d="M 190 730 L 200 755 Q 230 765 260 755 L 270 730" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    <!-- Tub Vertical Lines for Wood Staves -->
    <path d="M 210 738 L 215 759" fill="none" stroke="black" stroke-width="3" />
    <path d="M 230 740 L 230 762" fill="none" stroke="black" stroke-width="3" />
    <path d="M 250 738 L 245 759" fill="none" stroke="black" stroke-width="3" />
    <!-- Ripples around Tub -->
    <path d="M 180 750 Q 230 770 280 750" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- GENTLE STEAM BUBBLES & STEAM CLOUDS (Rising from Hot Spring) -->
  <g id="steam-effects">
    <!-- Steam Swirl 1 -->
    <path d="M 280 400 Q 260 350 290 310 T 270 230" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
    <!-- Steam Swirl 2 -->
    <path d="M 340 390 Q 370 330 330 280 T 360 190" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
    <!-- Steam Swirl 3 -->
    <path d="M 520 470 Q 500 420 530 370 T 500 290" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />
    <!-- Steam Swirl 4 -->
    <path d="M 580 480 Q 610 430 570 380 T 600 300" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" />

    <!-- Soft Floating Steam Bubbles -->
    <circle cx="300" cy="360" r="14" fill="white" stroke="black" stroke-width="4" />
    <circle cx="350" cy="310" r="10" fill="white" stroke="black" stroke-width="3" />
    <circle cx="270" cy="270" r="16" fill="white" stroke="black" stroke-width="4" />
    <circle cx="320" cy="230" r="12" fill="white" stroke="black" stroke-width="3" />
    
    <circle cx="510" cy="430" r="12" fill="white" stroke="black" stroke-width="3" />
    <circle cx="550" cy="360" r="18" fill="white" stroke="black" stroke-width="4" />
    <circle cx="490" cy="330" r="10" fill="white" stroke="black" stroke-width="3" />
    <circle cx="560" cy="270" r="15" fill="white" stroke="black" stroke-width="4" />

    <!-- Steam Cloud Shapes -->
    <path d="M 150 470 Q 130 450 150 430 Q 180 420 200 440 Q 220 430 230 450 Q 220 470 190 475 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
    <path d="M 600 450 Q 580 430 600 410 Q 630 400 650 420 Q 670 410 680 430 Q 670 450 640 455 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- SNOW ON ROCKS (Foreground Details) -->
  <g id="foreground-snow">
    <!-- Snow drifts on left rocks -->
    <path d="M 30 600 Q 70 570 110 610 Q 70 590 30 600 Z" fill="white" stroke="black" stroke-width="3" />
    <path d="M 35 790 Q 80 760 120 795 Q 75 780 35 790 Z" fill="white" stroke="black" stroke-width="3" />
    <!-- Snow drifts on right rocks -->
    <path d="M 680 610 Q 720 570 760 600 Q 720 590 680 610 Z" fill="white" stroke="black" stroke-width="3" />
    <path d="M 670 795 Q 715 760 760 790 Q 715 780 670 795 Z" fill="white" stroke="black" stroke-width="3" />
    <!-- Snow drifts on bottom rocks -->
    <path d="M 315 905 Q 370 870 425 905 Q 370 890 315 905 Z" fill="white" stroke="black" stroke-width="3" />
    <path d="M 425 905 Q 480 870 535 905 Q 480 890 425 905 Z" fill="white" stroke="black" stroke-width="3" />
  </g>
</svg>