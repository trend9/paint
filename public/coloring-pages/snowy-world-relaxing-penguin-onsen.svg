<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Color -->
  <rect width="800" height="1000" fill="white"/>

  <!-- Background Mountains -->
  <g id="mountains">
    <!-- Mountain Left -->
    <polygon points="50,520 250,220 450,520" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="183,320 250,220 317,320 285,335 250,310 215,335" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>

    <!-- Mountain Right -->
    <polygon points="350,520 580,160 780,520" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="505,280 580,160 655,280 625,295 580,270 535,295" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- Happy Sun -->
  <g id="sun" transform="translate(150, 150)">
    <circle cx="0" cy="0" r="45" fill="white" stroke="black" stroke-width="7"/>
    <!-- Rays -->
    <line x1="0" y1="-58" x2="0" y2="-78" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="58" x2="0" y2="78" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="-58" y1="0" x2="-78" y2="0" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="58" y1="0" x2="78" y2="0" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="-41" y1="-41" x2="-55" y2="-55" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="41" y1="41" x2="55" y2="55" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="41" y1="-41" x2="55" y2="-55" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="-41" y1="41" x2="-55" y2="55" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <!-- Face -->
    <circle cx="-12" cy="-5" r="5" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="12" cy="-5" r="5" fill="white" stroke="black" stroke-width="4"/>
    <path d="M -10 12 Q 0 22 10 12" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Cute Cloud -->
  <g id="cloud" transform="translate(540, 100)">
    <path d="M 50 120 C 20 120, 20 90, 40 80 C 30 50, 70 40, 90 60 C 110 40, 150 50, 140 80 C 160 90, 160 120, 130 120 Z" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
    <!-- Face -->
    <path d="M 70 90 Q 75 95 80 90" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 100 90 Q 105 95 110 90" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 85 102 Q 90 106 95 102" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Falling Snowflakes -->
  <g id="snow">
    <circle cx="340" cy="120" r="9" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="450" cy="160" r="11" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="300" cy="240" r="8" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="390" cy="220" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="490" cy="250" r="9" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="90" cy="280" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="710" cy="260" r="9" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Pine Trees (Left & Right) -->
  <g id="pine-trees">
    <!-- Left Tree -->
    <g id="pine-left">
      <path d="M 135 480 L 135 530 A 10 10 0 0 0 155 530 L 155 480 Z" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round" />
      <path d="M 90 480 C 90 440, 120 430, 145 430 C 170 430, 200 440, 200 480 C 200 500, 90 500, 90 480 Z" fill="white" stroke="black" stroke-width="7"/>
      <path d="M 105 430 C 105 395, 125 385, 145 385 C 165 385, 185 395, 185 430 Z" fill="white" stroke="black" stroke-width="7"/>
      <path d="M 120 385 C 120 355, 132 345, 145 345 C 158 345, 170 355, 170 385 Z" fill="white" stroke="black" stroke-width="7"/>
    </g>
    <!-- Right Tree -->
    <g id="pine-right">
      <path d="M 645 480 L 645 530 A 10 10 0 0 0 665 530 L 665 480 Z" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round" />
      <path d="M 600 480 C 600 440, 630 430, 655 430 C 680 430, 710 440, 710 480 C 710 500, 600 500, 600 480 Z" fill="white" stroke="black" stroke-width="7"/>
      <path d="M 615 430 C 615 395, 635 385, 655 385 C 675 385, 695 395, 695 430 Z" fill="white" stroke="black" stroke-width="7"/>
      <path d="M 630 385 C 630 355, 642 345, 655 345 C 668 345, 680 355, 680 385 Z" fill="white" stroke="black" stroke-width="7"/>
    </g>
  </g>

  <!-- Background Rocks (Behind Pool) -->
  <g id="background-rocks">
    <ellipse cx="140" cy="600" rx="60" ry="40" fill="white" stroke="black" stroke-width="7" transform="rotate(-10 140 600)" />
    <ellipse cx="230" cy="565" rx="70" ry="45" fill="white" stroke="black" stroke-width="7" transform="rotate(-5 230 565)" />
    <ellipse cx="340" cy="545" rx="80" ry="50" fill="white" stroke="black" stroke-width="7" />
    <ellipse cx="460" cy="545" rx="80" ry="50" fill="white" stroke="black" stroke-width="7" />
    <ellipse cx="570" cy="565" rx="70" ry="45" fill="white" stroke="black" stroke-width="7" transform="rotate(5 570 565)" />
    <ellipse cx="660" cy="600" rx="60" ry="40" fill="white" stroke="black" stroke-width="7" transform="rotate(10 660 600)" />
  </g>

  <!-- The Hot Spring Water Area -->
  <path id="pool-water" d="M 110 610 C 200 570, 600 570, 690 610 C 760 880, 40 880, 110 610 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round"/>

  <!-- Gentle Steam Rising -->
  <g id="steam">
    <path d="M 220 530 C 190 460, 250 400, 220 320" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 380 500 C 350 420, 410 350, 380 270" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 540 520 C 510 450, 570 390, 540 310" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 290 540 C 270 490, 310 450, 290 400" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 470 540 C 450 490, 490 450, 470 400" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Penguin Left (Relaxing with towel on head) -->
  <g id="penguin-left">
    <!-- Body -->
    <path d="M 210 740 C 200 590, 340 590, 330 740" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
    <!-- Belly/Face Border -->
    <path d="M 230 740 C 225 625, 315 625, 310 740" fill="white" stroke="black" stroke-width="4"/>
    <!-- Closed Happy Eyes -->
    <path d="M 250 650 Q 262 638 274 650" fill="none" stroke="black" stroke-width="6" stroke-linecap="round"/>
    <path d="M 286 650 Q 298 638 310 650" fill="none" stroke="black" stroke-width="6" stroke-linecap="round"/>
    <!-- Cute Beak -->
    <path d="M 273 660 Q 280 678 287 660 Q 280 657 273 660" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="242" cy="670" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="318" cy="670" r="10" fill="white" stroke="black" stroke-width="4"/>
    <!-- Towel Folded on Head -->
    <path d="M 250 575 C 250 560, 290 560, 290 575 Z" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="270" cy="572" rx="25" ry="10" fill="white" stroke="black" stroke-width="6"/>
    <!-- Flippers resting on water -->
    <path d="M 215 690 Q 185 700 195 720 Q 220 715 220 700" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 325 690 Q 355 700 345 720 Q 320 715 320 700" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Penguin Right (Leaning back happily) -->
  <g id="penguin-right" transform="rotate(6 480 680)">
    <!-- Body -->
    <path d="M 410 750 C 400 600, 540 600, 530 750" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round"/>
    <!-- Belly/Face Border -->
    <path d="M 430 750 C 425 635, 515 635, 510 750" fill="white" stroke="black" stroke-width="4"/>
    <!-- Closed Happy Eyes -->
    <path d="M 450 660 Q 462 648 474 660" fill="none" stroke="black" stroke-width="6" stroke-linecap="round"/>
    <path d="M 486 660 Q 498 648 510 660" fill="none" stroke="black" stroke-width="6" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M 473 670 Q 480 688 487 670 Q 480 667 473 670" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <!-- Rosy Cheeks -->
    <circle cx="442" cy="680" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="518" cy="680" r="10" fill="white" stroke="black" stroke-width="4"/>
    <!-- Left Flipper Waving -->
    <path d="M 415 670 Q 385 640 395 625 Q 415 635 420 660" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right Flipper Resting -->
    <path d="M 525 690 Q 555 700 545 720 Q 520 715 520 700" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Baby Penguin in Inner Tube (Center Front) -->
  <g id="baby-penguin-tube" transform="translate(370, 730)">
    <!-- Baby Penguin Body -->
    <path d="M -30 30 C -35 -30, 35 -30, 30 30" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -20 30 C -22 -15, 22 -15, 20 30" fill="white" stroke="black" stroke-width="4"/>
    <!-- Closed Happy Eyes -->
    <path d="M -16 -5 Q -10 -12 -4 -5" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 4 -5 Q 10 -12 16 -5" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M -4 5 L 4 5 L 0 11 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <!-- Flippers -->
    <path d="M -32 5 Q -45 12 -35 22" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 32 5 Q 45 12 35 22" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Swim Ring (Inner Tube) -->
    <ellipse cx="0" cy="28" rx="48" ry="18" fill="white" stroke="black" stroke-width="8"/>
    <!-- Ring Pattern Lines -->
    <path d="M -32 20 Q 0 10 32 20" fill="none" stroke="black" stroke-width="4"/>
    <path d="M -36 28 Q 0 18 36 28" fill="none" stroke="black" stroke-width="4"/>
  </g>

  <!-- Water Ripples & Bubbles -->
  <g id="water-details">
    <path d="M 150 670 Q 180 660 210 670" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 570 690 Q 600 680 630 690" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 280 810 Q 380 790 480 810" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M 200 780 Q 240 775 280 780" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Bubbles -->
    <circle cx="170" cy="730" r="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="185" cy="715" r="6" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="590" cy="750" r="12" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="608" cy="735" r="7" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Foreground Rocks (Front Border of Pool) -->
  <g id="foreground-rocks">
    <ellipse cx="90" cy="830" rx="75" ry="50" fill="white" stroke="black" stroke-width="7" transform="rotate(-15 90 830)"/>
    <ellipse cx="210" cy="880" rx="90" ry="55" fill="white" stroke="black" stroke-width="7" transform="rotate(-5 210 880)"/>
    <ellipse cx="360" cy="905" rx="100" ry="60" fill="white" stroke="black" stroke-width="7"/>
    <ellipse cx="510" cy="900" rx="100" ry="60" fill="white" stroke="black" stroke-width="7" transform="rotate(5 510 900)"/>
    <ellipse cx="650" cy="865" rx="90" ry="55" fill="white" stroke="black" stroke-width="7" transform="rotate(12 650 865)"/>
    <ellipse cx="740" cy="810" rx="70" ry="45" fill="white" stroke="black" stroke-width="7" transform="rotate(20 740 810)"/>
  </g>

  <!-- Thick Outer Border / Frame -->
  <rect x="20" y="20" width="760" height="960" rx="30" fill="none" stroke="black" stroke-width="12"/>
</svg>