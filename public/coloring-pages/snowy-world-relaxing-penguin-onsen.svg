<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for Background Hills -->
  <g id="background-hills">
    <!-- Main backdrop hill, large and gentle -->
    <path d="M-10 650 C 150 500 450 550 810 480 V 1000 H -10 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Another gentle hill line to define mid-ground -->
    <path d="M-10 750 C 200 680 600 720 810 690 V 1000 H -10 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Group for Pine Trees -->
  <g id="pine-trees">
    <!-- Tree 1 -->
    <rect x="120" y="480" width="20" height="70" fill="white" stroke="black" stroke-width="4"/>
    <path d="M100 500 L130 430 L160 500 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M100 450 L130 380 L160 450 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M110 400 L130 350 L150 400 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snow dusting on Tree 1 (simplified paths) -->
    <path d="M100 500 Q 115 490 130 490 Q 145 490 160 500" fill="white" stroke="black" stroke-width="3"/>
    <path d="M100 450 Q 115 440 130 440 Q 145 440 160 450" fill="white" stroke="black" stroke-width="3"/>
    <path d="M110 400 Q 120 390 130 390 Q 140 390 150 400" fill="white" stroke="black" stroke-width="3"/>

    <!-- Tree 2 -->
    <rect x="650" y="420" width="20" height="80" fill="white" stroke="black" stroke-width="4"/>
    <path d="M630 440 L660 370 L690 440 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M630 390 L660 320 L690 390 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M640 340 L660 290 L680 340 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snow dusting on Tree 2 (simplified paths) -->
    <path d="M630 440 Q 645 430 660 430 Q 675 430 690 440" fill="white" stroke="black" stroke-width="3"/>
    <path d="M630 390 Q 645 380 660 380 Q 675 380 690 390" fill="white" stroke="black" stroke-width="3"/>
    <path d="M640 340 Q 650 330 660 330 Q 670 330 680 340" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Group for Hot Spring (Onsen) -->
  <g id="hot-spring">
    <path d="M180 780 C 120 700 250 650 400 650 S 700 700 620 780 C 580 840 220 840 180 780 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Group for Snowdrifts (around the hot spring) -->
  <g id="snowdrifts">
    <!-- Front snow drift line, forming the lower foreground -->
    <path d="M0 830 Q 150 800 300 830 Q 450 860 600 830 Q 750 800 800 830 L 800 1000 L 0 1000 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Back snow drift line, defining snow behind the hot spring -->
    <path d="M100 700 Q 250 670 400 700 Q 550 730 700 700 L 700 750 Q 550 720 400 720 Q 250 720 100 750 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>
  
  <!-- Group for Penguins -->
  <g id="penguins">
    <!-- Penguin 1 (Left, blissful and relaxed) -->
    <g id="penguin-1">
      <path d="M260 700 C 230 620 280 590 310 600 C 340 590 380 620 350 700 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Body outline -->
      <path d="M285 640 C 275 650 295 650 285 640 C 270 660 270 680 285 690 C 300 680 300 660 285 640 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Inner belly -->
      <path d="M285 625 C 275 620 295 620 285 625 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Beak -->
      <path d="M275 615 Q 280 610 285 615" fill="none" stroke="black" stroke-width="3"/> <!-- Left Eye (blissful curve) -->
      <path d="M295 615 Q 300 610 305 615" fill="none" stroke="black" stroke-width="3"/> <!-- Right Eye (blissful curve) -->
      <path d="M230 660 C 220 640 230 630 240 650 S 250 670 230 660 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left Flipper -->
      <path d="M370 660 C 380 640 370 630 360 650 S 350 670 370 660 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right Flipper -->
    </g>

    <!-- Penguin 2 (Middle, cheerful with wide eyes) -->
    <g id="penguin-2">
      <path d="M450 700 C 420 610 470 580 500 590 C 530 580 570 610 540 700 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Body outline -->
      <path d="M475 630 C 465 640 485 640 475 630 C 460 650 460 670 475 680 C 490 670 490 650 475 630 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Inner belly -->
      <path d="M485 615 C 475 610 495 610 485 615 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Beak -->
      <circle cx="475" cy="600" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="495" cy="600" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M420 650 C 410 630 420 620 430 640 S 440 660 420 650 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left Flipper -->
      <path d="M580 650 C 590 630 580 620 570 640 S 560 660 580 650 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right Flipper -->
    </g>
    
    <!-- Penguin 3 (Right, happy and slightly goofy with a curved eye) -->
    <g id="penguin-3">
      <path d="M600 730 C 570 640 620 610 650 620 C 680 610 720 640 690 730 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Body outline -->
      <path d="M625 660 C 615 670 635 670 625 660 C 610 680 610 700 625 710 C 640 700 640 680 625 660 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Inner belly -->
      <path d="M635 645 C 625 640 645 640 635 645 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Beak -->
      <circle cx="625" cy="630" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <path d="M645 630 C 650 625 655 630" fill="none" stroke="black" stroke-width="3"/> <!-- Right Eye (simple curved happy line) -->
      <path d="M570 690 C 560 670 570 660 580 680 S 590 700 570 690 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left Flipper -->
      <path d="M730 690 C 740 670 730 660 720 680 S 710 700 730 690 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right Flipper -->
    </g>
  </g>

  <!-- Group for Steam -->
  <g id="steam">
    <!-- Wavy lines indicating steam rising from the hot spring -->
    <path d="M220 680 C 240 650 260 660 280 630 C 300 600 320 610 340 580" fill="none" stroke="black" stroke-width="3"/>
    <path d="M300 670 C 320 640 340 650 360 620 C 380 590 400 600 420 570" fill="none" stroke="black" stroke-width="3"/>
    <path d="M400 680 C 420 650 440 660 460 630 C 480 600 500 610 520 580" fill="none" stroke="black" stroke-width="3"/>
    <path d="M480 670 C 500 640 520 650 540 620 C 560 590 580 600 600 570" fill="none" stroke="black" stroke-width="3"/>
    <path d="M580 690 C 600 660 620 670 640 640 C 660 610 680 620 700 590" fill="none" stroke="black" stroke-width="3"/>
  </g>
</svg>