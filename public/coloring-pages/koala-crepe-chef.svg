<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements - simple counter -->
  <g id="background_elements">
    <rect x="0" y="750" width="800" height="250" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Koala Chef -->
  <g id="koala_chef">
    <!-- Body -->
    <ellipse cx="400" cy="680" rx="160" ry="170" fill="white" stroke="black" stroke-width="4"/>

    <!-- Head -->
    <ellipse cx="400" cy="400" rx="120" ry="110" fill="white" stroke="black" stroke-width="4"/>
    <!-- Left Ear -->
    <ellipse cx="300" cy="280" rx="65" ry="85" fill="white" stroke="black" stroke-width="4"/>
    <!-- Right Ear -->
    <ellipse cx="500" cy="280" rx="65" ry="85" fill="white" stroke="black" stroke-width="4"/>
    <!-- Inner Left Ear -->
    <ellipse cx="300" cy="280" rx="45" ry="55" fill="white" stroke="black" stroke-width="3"/>
    <!-- Inner Right Ear -->
    <ellipse cx="500" cy="280" rx="45" ry="55" fill="white" stroke="black" stroke-width="3"/>

    <!-- Eyes -->
    <circle cx="360" cy="380" r="18" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="440" cy="380" r="18" fill="white" stroke="black" stroke-width="3"/>
    <!-- Nose -->
    <ellipse cx="400" cy="430" rx="35" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth - simple smile -->
    <path d="M 370 460 Q 400 480 430 460" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

    <!-- Chef Hat -->
    <path d="M300 310 A100 20 0 0 1 500 310 L500 270 C550 160, 450 80, 400 80 C350 80, 250 160, 300 270 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Apron -->
    <rect x="250" y="600" width="300" height="200" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <!-- Apron bib -->
    <rect x="320" y="530" width="160" height="90" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Apron straps -->
    <path d="M320 530 L340 450" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M480 530 L460 450" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

    <!-- Arms -->
    <!-- Left arm (holding pan handle) -->
    <path d="M300 660 C270 630, 250 580, 250 560 L280 560 C310 580, 330 630, 300 660 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Right arm (in gesture) -->
    <path d="M500 660 C530 630, 550 580, 550 560 L520 560 C490 580, 470 630, 500 660 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Crepe and Pan - placed in front of koala, held by left arm -->
  <g id="crepe_pan">
    <!-- Pan handle - adjusted to align with koala's left hand -->
    <path d="M250 560 Q220 550, 200 570 L200 600 Q220 620, 250 610 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Pan body -->
    <ellipse cx="400" cy="590" rx="140" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <path d="M260 590 L260 540 A140 35 0 0 1 540 540 L540 590 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Crepe inside the pan -->
    <ellipse cx="400" cy="550" rx="120" ry="25" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Ingredients -->
  <g id="ingredients">
    <!-- Bowl of fruit - left side on counter -->
    <path d="M100 900 Q120 840, 200 840 Q220 900, 200 910 Q160 930, 100 910 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Strawberries -->
    <path d="M140 870 C145 855, 155 855, 160 870 Q150 880, 140 870 Z" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="145" cy="870" r="2" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="155" cy="865" r="2" fill="white" stroke="black" stroke-width="2"/>
    <path d="M170 875 C175 860, 185 860, 190 875 Q180 885, 170 875 Z" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="175" cy="875" r="2" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="185" cy="870" r="2" fill="white" stroke="black" stroke-width="2"/>
    <!-- Banana slices -->
    <circle cx="120" cy="890" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="180" cy="895" r="10" fill="white" stroke="black" stroke-width="3"/>
    <!-- Blueberries -->
    <circle cx="140" cy="895" r="8" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="165" cy="890" r="8" fill="white" stroke="black" stroke-width="3"/>

    <!-- Whipped cream dispenser with a dollop -->
    <g id="whipped_cream_dispenser">
      <rect x="650" y="790" width="60" height="120" rx="15" ry="15" fill="white" stroke="black" stroke-width="4"/>
      <rect x="660" y="770" width="40" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <path d="M680 770 Q690 750, 680 740 Q670 750, 680 770 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Dollop of whipped cream on counter -->
      <path d="M600 890 C580 860, 620 850, 640 870 C660 890, 650 920, 620 920 C590 920, 580 900, 600 890 Z" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="620" cy="920" rx="40" ry="10" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Chocolate sauce bottle -->
    <g id="chocolate_sauce">
      <rect x="550" y="820" width="50" height="100" rx="15" ry="15" fill="white" stroke="black" stroke-width="4"/>
      <rect x="565" y="800" width="20" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/>
      <path d="M565 800 L565 780 Q575 770, 585 780 L585 800 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>
  </g>
</svg>