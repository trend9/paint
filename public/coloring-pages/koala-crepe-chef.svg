<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <style>
      .line {
        stroke: #000000;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .line-thick {
        stroke: #000000;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: #FFFFFF;
      }
      .open-line {
        stroke: #000000;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .open-line-thick {
        stroke: #000000;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <!-- Pure White Background -->
  <rect width="800" height="1000" fill="#FFFFFF" />

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="750" height="950" rx="30" class="line-thick" />

  <!-- BACKGROUND DECORATIONS (Bunting / Garland) -->
  <g id="garland">
    <path d="M 30 90 Q 400 150 770 90" class="open-line" />
    <!-- Pennant Flags -->
    <polygon points="90,100 130,105 110,160" class="line" />
    <polygon points="180,112 220,116 200,172" class="line" />
    <polygon points="270,121 310,123 290,180" class="line" />
    <polygon points="360,124 400,124 380,183" class="line" />
    <polygon points="450,123 490,121 470,180" class="line" />
    <polygon points="540,116 580,112 560,172" class="line" />
    <polygon points="630,105 670,100 650,160" class="line" />
  </g>

  <!-- Little Magical Stars/Sparkles in Background -->
  <g id="sparkles">
    <!-- Left Sparkle -->
    <path d="M 140 270 L 145 285 L 160 290 L 145 295 L 140 310 L 135 295 L 120 290 L 135 285 Z" class="line" />
    <!-- Right Sparkle -->
    <path d="M 660 250 L 665 265 L 680 270 L 665 275 L 660 290 L 655 275 L 640 270 L 655 265 Z" class="line" />
    <!-- Little Heart -->
    <path d="M 690 350 C 690 340 675 330 665 342 C 655 330 640 340 640 350 C 640 365 665 380 665 380 C 665 380 690 365 690 350 Z" class="line" />
    <path d="M 120 380 C 120 372 108 364 100 373 C 92 364 80 372 80 380 C 80 392 100 404 100 404 C 100 404 120 392 120 380 Z" class="line" />
  </g>

  <!-- KOALA CHARACTER (Behind Counter) -->
  <g id="koala">

    <!-- Chef Hat - Back/Top Puff -->
    <path d="M 320 180 
             C 260 170, 240 80, 320 60 
             C 360 20, 440 20, 480 60 
             C 560 80, 540 170, 480 180 Z" class="line-thick" />
    <!-- Chef Hat Crease Lines -->
    <path d="M 350 170 C 340 110, 370 70, 380 60" class="open-line" />
    <path d="M 420 170 C 420 100, 430 60, 430 55" class="open-line" />
    <path d="M 460 170 C 470 120, 470 70, 460 65" class="open-line" />

    <!-- Chef Hat Band -->
    <path d="M 315 175 L 485 175 L 475 225 L 325 225 Z" class="line-thick" />

    <!-- Left Ear -->
    <g id="left-ear">
      <circle cx="250" cy="280" r="70" class="line-thick" />
      <circle cx="250" cy="280" r="42" class="line" />
      <!-- Fluff lines in ear -->
      <path d="M 210 270 Q 225 280 210 290" class="open-line" />
    </g>

    <!-- Right Ear -->
    <g id="right-ear">
      <circle cx="550" cy="280" r="70" class="line-thick" />
      <circle cx="550" cy="280" r="42" class="line" />
      <!-- Fluff lines in ear -->
      <path d="M 590 270 Q 575 280 590 290" class="open-line" />
    </g>

    <!-- Koala Head -->
    <circle cx="400" cy="340" r="105" class="line-thick" />

    <!-- Fluffy Cheek Tufts -->
    <path d="M 295 340 C 280 345, 280 365, 298 370" class="line" />
    <path d="M 505 340 C 520 345, 520 365, 502 370" class="line" />

    <!-- Eyes (Happy Closed Arcs for Toddler Cuteness) -->
    <path d="M 335 325 Q 355 300 375 325" class="open-line-thick" />
    <path d="M 425 325 Q 445 300 465 325" class="open-line-thick" />
    <!-- Eyelashes -->
    <path d="M 335 320 L 325 310" class="open-line" />
    <path d="M 375 320 L 385 310" class="open-line" />
    <path d="M 425 320 L 415 310" class="open-line" />
    <path d="M 465 320 L 475 310" class="open-line" />

    <!-- Rosy Cheek Circles -->
    <ellipse cx="330" cy="355" rx="14" ry="8" class="open-line" />
    <ellipse cx="470" cy="355" rx="14" ry="8" class="open-line" />

    <!-- Big Koala Nose -->
    <ellipse cx="400" cy="350" rx="28" ry="38" class="line-thick" />
    <!-- Nose Shine Highlight -->
    <ellipse cx="390" cy="338" rx="8" ry="12" class="line" />

    <!-- Happy Mouth -->
    <path d="M 365 395 Q 400 425 435 395" class="open-line-thick" />
    <!-- Tongue arc -->
    <path d="M 380 410 Q 400 430 420 410" class="line" />

    <!-- Koala Body / Chef Jacket -->
    <path d="M 310 440 L 490 440 L 520 630 L 280 630 Z" class="line" />

    <!-- Apron Bib -->
    <path d="M 340 440 L 460 440 L 475 630 L 325 630 Z" class="line-thick" />
    <!-- Apron Neck Straps -->
    <path d="M 350 440 L 335 410" class="open-line-thick" />
    <path d="M 450 440 L 465 410" class="open-line-thick" />
    <!-- Apron Pocket -->
    <path d="M 365 520 L 435 520 L 425 575 C 425 590, 375 590, 375 575 Z" class="line" />

    <!-- Chef Bowtie / Scarf -->
    <path d="M 370 435 C 350 415, 350 455, 370 445 Z" class="line" />
    <path d="M 430 435 C 450 415, 450 455, 430 445 Z" class="line" />
    <circle cx="400" cy="438" r="10" class="line" />

    <!-- LEFT ARM & CREPE PAN -->
    <g id="left-arm-and-pan">
      <!-- Left Arm -->
      <path d="M 315 460 C 230 470, 200 520, 230 560 C 250 580, 280 550, 325 510" class="line-thick" />
      <!-- Left Paw -->
      <circle cx="225" cy="545" r="22" class="line-thick" />

      <!-- Crepe Pan Handle (Held in hand) -->
      <rect x="110" y="525" width="100" height="20" rx="10" transform="rotate(12 110 525)" class="line-thick" />

      <!-- Pan Base -->
      <ellipse cx="105" cy="510" rx="75" ry="32" class="line-thick" />
      <ellipse cx="105" cy="505" rx="65" ry="24" class="line" />

      <!-- Flipping Crepe in the Air! -->
      <path d="M 70 410 C 60 350, 150 340, 160 400 C 120 430, 80 430, 70 410 Z" class="line-thick" />
      <!-- Fold/Detail line on flipping crepe -->
      <path d="M 70 410 Q 115 380 160 400" class="open-line" />
      <path d="M 90 375 Q 120 360 140 380" class="open-line" />

      <!-- Motion Lines for Flip -->
      <path d="M 60 460 Q 50 430 70 430" class="open-line" />
      <path d="M 160 460 Q 175 430 155 425" class="open-line" />
    </g>

    <!-- RIGHT ARM & SPATULA -->
    <g id="right-arm-and-spatula">
      <!-- Right Arm -->
      <path d="M 485 460 C 570 470, 600 520, 570 560 C 550 580, 520 550, 475 510" class="line-thick" />
      <!-- Right Paw -->
      <circle cx="575" cy="545" r="22" class="line-thick" />

      <!-- Spatula Handle -->
      <rect x="580" y="440" width="18" height="110" rx="9" transform="rotate(-25 580 440)" class="line-thick" />
      <!-- Spatula Head -->
      <path d="M 610 400 L 665 375 L 690 425 L 635 450 Z" class="line-thick" />
      <!-- Spatula Slots -->
      <line x1="630" y1="412" x2="655" y2="400" class="open-line" />
      <line x1="640" y1="427" x2="665" y2="415" class="open-line" />
      <line x1="650" y1="442" x2="675" y2="430" class="open-line" />
    </g>

  </g> <!-- End Koala -->

  <!-- KITCHEN COUNTER (Foreground) -->
  <g id="counter">
    <!-- Counter Top Surface Lid -->
    <rect x="50" y="620" width="700" height="40" rx="15" class="line-thick" />

    <!-- Counter Main Base -->
    <rect x="70" y="660" width="660" height="270" rx="20" class="line-thick" />

    <!-- Counter Panels / Doors (Simple shapes for coloring) -->
    <rect x="100" y="690" width="270" height="210" rx="15" class="line" />
    <rect x="430" y="690" width="270" height="210" rx="15" class="line" />

    <!-- Door Handles -->
    <circle cx="340" cy="795" r="16" class="line-thick" />
    <circle cx="460" cy="795" r="16" class="line-thick" />
  </g>

  <!-- ITEMS ON THE COUNTER -->
  <g id="counter-items">

    <!-- BOWL OF WHIPPED CREAM (Left) -->
    <g id="whipped-cream-bowl">
      <!-- Bowl Base -->
      <path d="M 120 620 C 120 665, 220 665, 220 620 Z" class="line-thick" />
      <ellipse cx="170" cy="620" rx="50" ry="10" class="line" />

      <!-- Whipped Cream Fluffy Top -->
      <path d="M 125 615 
               C 110 590, 130 560, 150 570 
               C 155 540, 185 540, 190 565 
               C 210 555, 230 580, 215 615 Z" class="line-thick" />
      <!-- Cream Swirl Detail -->
      <path d="M 170 540 C 180 520, 160 500, 175 490 C 185 510, 195 530, 175 540 Z" class="line" />
      <path d="M 150 570 Q 170 575 190 565" class="open-line" />

      <!-- Spoon in Bowl -->
      <path d="M 200 580 L 235 510 C 242 495, 255 500, 248 515 L 215 585 Z" class="line" />
    </g>

    <!-- DELICIOUS CREPE ON PLATE (Center) -->
    <g id="crepe-plate">
      <!-- Plate -->
      <ellipse cx="400" cy="625" rx="125" ry="30" class="line-thick" />
      <ellipse cx="400" cy="625" rx="100" ry="22" class="line" />

      <!-- Folded Crepe Triangle -->
      <path d="M 310 615 
               C 330 560, 470 560, 490 615 
               C 430 640, 370 640, 310 615 Z" class="line-thick" />

      <!-- Crepe Fold Lines & Texture -->
      <path d="M 340 600 Q 400 575 460 600" class="open-line" />
      <path d="M 325 610 Q 400 585 475 610" class="open-line" />

      <!-- Whipped Cream Dollop on Crepe -->
      <path d="M 380 585 C 370 570, 385 555, 400 560 C 410 550, 425 565, 420 580 C 425 590, 405 600, 380 585 Z" class="line" />

      <!-- Strawberries on Crepe -->
      <!-- Strawberry 1 -->
      <path d="M 355 595 C 345 580, 365 570, 370 580 C 375 570, 390 580, 380 595 C 375 605, 360 605, 355 595 Z" class="line" />
      <!-- Strawberry Leaves -->
      <path d="M 362 578 L 368 572 L 372 578 Z" class="line" />

      <!-- Syrup Drizzle (Wavy line) -->
      <path d="M 330 612 Q 350 600 370 615 T 410 612 T 450 615 T 470 610" class="open-line-thick" />
    </g>

    <!-- FRUIT CUTTING BOARD & INGREDIENTS (Right) -->
    <g id="fruit-board">
      <!-- Cutting Board -->
      <rect x="540" y="605" width="170" height="30" rx="8" class="line-thick" />
      <rect x="680" y="613" width="18" height="14" rx="4" class="line" />

      <!-- Whole Strawberry -->
      <g id="strawberry">
        <path d="M 560 590 
                 C 550 565, 580 550, 590 565 
                 C 600 550, 630 565, 620 590 
                 C 610 610, 570 610, 560 590 Z" class="line-thick" />
        <!-- Strawberry Leaf Cap -->
        <path d="M 575 565 L 590 550 L 605 565 L 595 568 L 590 575 L 585 568 Z" class="line" />
        <!-- Seeds -->
        <circle cx="575" cy="580" r="2" fill="#000000" />
        <circle cx="590" cy="585" r="2" fill="#000000" />
        <circle cx="605" cy="580" r="2" fill="#000000" />
        <circle cx="583" cy="595" r="2" fill="#000000" />
        <circle cx="597" cy="595" r="2" fill="#000000" />
      </g>

      <!-- Banana Slices -->
      <!-- Slice 1 -->
      <g id="banana-1">
        <ellipse cx="640" cy="595" rx="16" ry="12" class="line-thick" />
        <ellipse cx="640" cy="595" rx="7" ry="5" class="line" />
        <line x1="640" y1="588" x2="640" y2="590" class="open-line" />
        <line x1="640" y1="600" x2="640" y2="602" class="open-line" />
      </g>
      <!-- Slice 2 -->
      <g id="banana-2">
        <ellipse cx="665" cy="585" rx="16" ry="12" class="line-thick" />
        <ellipse cx="665" cy="585" rx="7" ry="5" class="line" />
      </g>
      <!-- Slice 3 -->
      <g id="banana-3">
        <ellipse cx="685" cy="598" rx="16" ry="12" class="line-thick" />
        <ellipse cx="685" cy="598" rx="7" ry="5" class="line" />
      </g>

    </g> <!-- End Fruit Board -->

  </g> <!-- End Counter Items -->

</svg>