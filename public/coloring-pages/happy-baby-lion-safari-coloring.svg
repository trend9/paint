<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="scene-background-elements" stroke="black" stroke-width="4">
    <!-- Distant Mountains -->
    <path d="M0 650 Q150 550 300 650 Q450 700 600 600 Q700 550 800 600 L800 850 L0 850 Z" fill="white"/>
    
    <!-- Ground line and lower part of scene -->
    <path d="M0 800 Q400 750 800 800 L800 1000 L0 1000 Z" fill="white"/>

    <!-- Acacia Tree -->
    <g id="acacia-tree" transform="translate(580, -10)">
        <rect x="50" y="550" width="40" height="150" rx="15" ry="15" fill="white"/> <!-- Trunk -->
        <path d="M0 450 Q100 350 200 450 L200 480 Q100 380 0 480 Z" fill="white"/> <!-- Canopy -->
    </g>

    <!-- Safari Bushes -->
    <g id="bushes">
      <path d="M100 780 C50 730 150 680 200 730 S250 780 200 830 S150 880 100 830 Z" fill="white"/>
      <path d="M700 830 C650 780 750 730 800 780 S850 830 800 880 S750 930 700 880 Z" fill="white"/>
    </g>
  </g>

  <!-- Baby Lion -->
  <g id="lion-cub" transform="translate(225, 275)" stroke="black" stroke-width="4">
    <!-- Body (rolling playfully) -->
    <path d="M150 350 C50 300 0 200 50 100 C100 0 250 0 300 100 C350 200 300 300 200 350 Z" fill="white"/>
    <!-- Head -->
    <ellipse cx="200" cy="150" rx="90" ry="80" fill="white"/>
    <!-- Mane (simple bumps around head) -->
    <path d="M120 100 A80 80 0 0 1 200 70 A80 80 0 0 1 280 100 A80 80 0 0 1 280 200 A80 80 0 0 1 200 230 A80 80 0 0 1 120 200 A80 80 0 0 1 120 100 Z" fill="white"/>
    <!-- Ears -->
    <ellipse cx="150" cy="90" rx="30" ry="35" transform="rotate(-20 150 90)" fill="white"/>
    <ellipse cx="250" cy="90" rx="30" ry="35" transform="rotate(20 250 90)" fill="white"/>
    <!-- Inner ears -->
    <ellipse cx="150" cy="90" rx="15" ry="20" stroke-width="3" transform="rotate(-20 150 90)" fill="white"/>
    <ellipse cx="250" cy="90" rx="15" ry="20" stroke-width="3" transform="rotate(20 250 90)" fill="white"/>
    <!-- Eyes -->
    <circle cx="170" cy="140" r="25" fill="white"/>
    <circle cx="230" cy="140" r="25" fill="white"/>
    <!-- Nose -->
    <path d="M200 170 L190 185 Q200 190 210 185 Z" fill="white"/>
    <!-- Mouth (smiling) -->
    <path d="M190 195 Q200 210 210 195" fill="none"/>

    <!-- Paws/Legs -->
    <ellipse cx="80" cy="200" rx="35" ry="60" transform="rotate(-30 80 200)" fill="white"/> <!-- front left -->
    <ellipse cx="100" cy="300" rx="40" ry="50" transform="rotate(20 100 300)" fill="white"/> <!-- back left -->
    <ellipse cx="300" cy="200" rx="35" ry="60" transform="rotate(30 300 200)" fill="white"/> <!-- front right -->
    <ellipse cx="280" cy="300" rx="40" ry="50" transform="rotate(-20 280 300)" fill="white"/> <!-- back right -->

    <!-- Tail -->
    <path d="M100 300 Q80 350 150 400 Q200 450 250 400" fill="none"/>
    <!-- Tail tuft -->
    <path d="M240 390 C250 370 270 380 260 400 S240 420 230 400 Z" fill="white"/>
  </g>

  <!-- Small Butterfly -->
  <g id="butterfly" transform="translate(420, 250) scale(0.7)" stroke="black" stroke-width="3">
    <ellipse cx="0" cy="0" rx="10" ry="20" fill="white"/> <!-- Body -->
    <path d="M0 -20 Q-30 -40 -50 -10 Q-30 20 0 0 Z" fill="white"/> <!-- Left wing top -->
    <path d="M0 0 Q-40 30 -50 50 Q-20 50 0 20 Z" fill="white"/> <!-- Left wing bottom -->
    <path d="M0 -20 Q30 -40 50 -10 Q30 20 0 0 Z" fill="white"/> <!-- Right wing top -->
    <path d="M0 0 Q40 30 50 50 Q20 50 0 20 Z" fill="white"/> <!-- Right wing bottom -->
    <path d="M-5 -15 Q-15 -25 -20 -40" fill="none"/> <!-- Antenna left -->
    <path d="M5 -15 Q15 -25 20 -40" fill="none"/> <!-- Antenna right -->
  </g>
</svg>