<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Explicit white background for the entire canvas -->
  <rect x="0" y="0" width="800" height="1000" fill="white" />

  <g id="background_elements" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ground / Base for the scene -->
    <path d="M0 800 Q400 750 800 800 L800 1000 L0 1000 Z" fill="white"/>

    <!-- Simplified Acacia Tree -->
    <g id="acacia_tree">
      <!-- Tree Trunk -->
      <path d="M180 780 C190 600 195 500 200 480 L220 480 C225 500 230 600 240 780 Z" fill="white" />
      <!-- Tree Crown (umbrella shape) -->
      <path d="M200 480 C100 350 150 250 300 250 C450 250 500 350 400 480 Z" fill="white" />
    </g>

    <!-- Single Puffy Cloud -->
    <g id="cloud">
      <path d="M600 150 C550 100 500 100 450 150 C400 200 450 250 500 250 C550 250 600 200 650 200 C700 200 750 150 700 100 C650 50 600 100 600 150 Z" fill="white" />
    </g>
  </g>

  <!-- Cute Happy Baby Lion Cub -->
  <g id="baby_lion_cub" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main Fluffy Mane Shape -->
    <path d="M400 260 C250 200 150 300 150 450 C150 600 250 700 400 640 C550 700 650 600 650 450 C650 300 550 200 400 260 Z" fill="white" />
    <!-- Inner Head Shape -->
    <circle cx="400" cy="450" r="140" fill="white" />

    <!-- Ears -->
    <g id="lion_ears">
      <ellipse cx="300" cy="300" rx="60" ry="80" fill="white" />
      <ellipse cx="500" cy="300" rx="60" ry="80" fill="white" />
      <!-- Inner Ears -->
      <ellipse cx="300" cy="310" rx="30" ry="40" fill="white" />
      <ellipse cx="500" cy="310" rx="30" ry="40" fill="white" />
    </g>

    <!-- Face Details -->
    <g id="lion_face">
      <!-- Eyes -->
      <circle cx="340" cy="400" r="30" fill="white" />
      <circle cx="460" cy="400" r="30" fill="white" />
      <!-- Nose -->
      <path d="M400 480 L380 510 L420 510 Z" fill="white" />
      <!-- Smiling Mouth -->
      <path d="M350 540 Q400 580 450 540" fill="white" />
      <!-- Cheeks -->
      <circle cx="330" cy="520" r="20" fill="white" />
      <circle cx="470" cy="520" r="20" fill="white" />
    </g>

    <!-- Body -->
    <path d="M400 610 C300 580 280 750 400 780 C520 750 500 580 400 610 Z" fill="white" />

    <!-- Front Paws (slightly lifted for playful pose) -->
    <path d="M330 650 C300 600 350 550 390 580 C390 580 370 630 330 650 Z" fill="white" />
    <path d="M470 650 C500 600 450 550 410 580 C410 580 430 630 470 650 Z" fill="white" />

    <!-- Hind Legs / Lower Body -->
    <path d="M300 750 C280 800 320 850 400 850 C480 850 520 800 500 750 Z" fill="white" />

    <!-- Tail -->
    <path d="M400 780 Q450 880 500 830" fill="none" /> <!-- Tail curve -->
    <!-- Fluffy Tail Tip -->
    <path d="M490 830 Q510 810 520 830 Q510 850 490 830 Z" fill="white" />
  </g>
</svg>