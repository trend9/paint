<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Color -->
  <rect width="800" height="1000" fill="white" />

  <!-- Stars in the Sky -->
  <!-- Star 1 (Top Left) -->
  <path d="M 120 150 Q 120 175 145 175 Q 120 175 120 200 Q 120 175 95 175 Q 120 175 120 150 Z" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
  <!-- Star 2 (Top Middle) -->
  <path d="M 420 80 Q 420 105 445 105 Q 420 105 420 130 Q 420 105 395 105 Q 420 105 420 80 Z" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
  <!-- Star 3 (Top Right) -->
  <path d="M 680 130 Q 680 155 705 155 Q 680 155 680 180 Q 680 155 655 155 Q 680 155 680 130 Z" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
  <!-- Star 4 (Middle Left) -->
  <path d="M 150 400 Q 150 420 170 420 Q 150 420 150 440 Q 150 420 130 420 Q 150 420 150 400 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />
  <!-- Star 5 (Middle Right) -->
  <path d="M 670 380 Q 670 400 690 400 Q 670 400 670 420 Q 670 400 650 400 Q 670 400 670 380 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />
  <!-- Star 6 (Center) -->
  <path d="M 380 320 Q 380 335 395 335 Q 380 335 380 350 Q 380 335 365 335 Q 380 335 380 320 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" />

  <!-- Sky Clouds -->
  <!-- Cloud Left -->
  <g transform="translate(60, 200)">
    <path d="M 50 110 C 20 110 0 90 0 60 C 0 30 30 10 60 20 C 80 -10 130 -10 150 20 C 180 10 210 30 200 60 C 210 90 190 110 160 110 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
  </g>
  <!-- Cloud Right -->
  <g transform="translate(520, 220) scale(0.9)">
    <path d="M 50 110 C 20 110 0 90 0 60 C 0 30 30 10 60 20 C 80 -10 130 -10 150 20 C 180 10 210 30 200 60 C 210 90 190 110 160 110 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Friendly Magic Wind Swirls / Flight Trails -->
  <path d="M 70 540 Q 250 460 450 550 T 730 490" fill="none" stroke="black" stroke-width="7" stroke-linecap="round" />
  <path d="M 120 580 Q 280 510 420 590 T 660 540" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
  <path d="M 50 470 C 110 430 170 470 150 510 C 130 540 80 510 120 480 C 180 430 320 530 450 500" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" />

  <!-- BACKGROUND LANDSCAPE (Far Beneath) -->
  <!-- Back Left Hill -->
  <path d="M 25 850 Q 220 770 420 860 L 420 975 L 25 975 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
  <!-- Back Right Hill -->
  <path d="M 350 860 Q 580 760 775 840 L 775 975 L 350 975 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
  <!-- Front Rolling Hill -->
  <path d="M 25 910 Q 350 800 775 900 L 775 975 L 25 975 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />

  <!-- Tiny Hill Details (Trees & House for Scale) -->
  <!-- Little Pine Tree 1 -->
  <g transform="translate(120, 805)">
    <polygon points="20,0 2,35 38,35" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
    <polygon points="20,-15 7,15 33,15" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
    <rect x="17" y="35" width="6" height="12" fill="white" stroke="black" stroke-width="6" />
  </g>
  <!-- Little Pine Tree 2 -->
  <g transform="translate(200, 835) scale(0.8)">
    <polygon points="20,0 2,35 38,35" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
    <polygon points="20,-15 7,15 33,15" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
    <rect x="17" y="35" width="6" height="12" fill="white" stroke="black" stroke-width="6" />
  </g>
  <!-- Little Round Tree -->
  <g transform="translate(660, 815)">
    <rect x="12" y="25" width="6" height="15" fill="white" stroke="black" stroke-width="5" />
    <circle cx="15" cy="15" r="18" fill="white" stroke="black" stroke-width="6" />
  </g>
  <!-- Tiny Cute House -->
  <g transform="translate(560, 805)">
    <rect x="8" y="18" width="34" height="25" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
    <polygon points="3,18 25,2 47,18" fill="white" stroke="black" stroke-width="6" stroke-linejoin="round" />
    <rect x="20" y="28" width="10" height="15" fill="white" stroke="black" stroke-width="5" />
  </g>
  <!-- Winding Path/River -->
  <path d="M 330 875 Q 370 910 340 940 T 390 975" fill="none" stroke="black" stroke-width="7" stroke-linecap="round" />


  <!-- THE MAJESTIC FLYING STEAM LOCOMOTIVE -->
  <!-- Main Train Group tilted upwards for flight -->
  <g transform="translate(390, 440) rotate(-12) translate(-300, -240)">
    
    <!-- Smoke Puffs from Smokestack -->
    <circle cx="370" cy="70" r="28" fill="white" stroke="black" stroke-width="8" />
    <circle cx="310" cy="45" r="38" fill="white" stroke="black" stroke-width="8" />
    <circle cx="230" cy="25" r="48" fill="white" stroke="black" stroke-width="8" />
    <circle cx="140" cy="10" r="58" fill="white" stroke="black" stroke-width="8" />

    <!-- Back Wing (for 3D depth, behind body) -->
    <path d="M 260 150 C 220 100 150 130 180 180 C 200 200 230 180 260 170" fill="white" stroke="black" stroke-width="7" stroke-linejoin="round" />

    <!-- Train Cabin (Driver's Cab) -->
    <rect x="110" y="140" width="120" height="180" rx="15" fill="white" stroke="black" stroke-width="8" />
    <!-- Cab Window -->
    <rect x="135" y="165" width="70" height="70" rx="12" fill="white" stroke="black" stroke-width="7" />
    <!-- Cab Roof (Curved Overhang) -->
    <path d="M 95 145 C 95 130 245 130 245 145 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
    <!-- Cabin Step -->
    <path d="M 125 320 L 125 355" fill="none" stroke="black" stroke-width="7" stroke-linecap="round" />
    <rect x="115" y="335" width="20" height="8" rx="3" fill="white" stroke="black" stroke-width="6" />

    <!-- Train Boiler (Main Body) -->
    <rect x="230" y="180" width="200" height="135" rx="8" fill="white" stroke="black" stroke-width="8" />
    <!-- Boiler Bands (Vertical Stripes) -->
    <line x1="295" y1="180" x2="295" y2="315" stroke="black" stroke-width="7" />
    <line x1="365" y1="180" x2="365" y2="315" stroke="black" stroke-width="7" />

    <!-- Steam Dome (Top Toy-like Cylinder) -->
    <path d="M 310 180 C 310 145 340 145 340 180 Z" fill="white" stroke="black" stroke-width="8" />

    <!-- Smokestack (Funnel) -->
    <path d="M 385 180 L 375 115 L 415 115 L 405 180 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
    <ellipse cx="395" cy="115" rx="20" ry="7" fill="white" stroke="black" stroke-width="8" />

    <!-- Cute Front Wing (In Foreground) -->
    <path d="M 285 200 C 235 140 145 175 185 235 C 215 255 255 225 285 215" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
    <!-- Wing Feather Lines -->
    <path d="M 205 210 Q 235 205 260 210" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" />
    <path d="M 210 225 Q 235 220 250 220" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" />

    <!-- Anthropomorphic Happy Face (Front of Engine) -->
    <path d="M 430 180 C 485 180 505 210 505 247 C 505 285 485 315 430 315 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Big Friendly Squinting Eyes (Toddler Safe & Cute) -->
    <path d="M 445 228 Q 457 210 469 228" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
    <path d="M 478 225 Q 488 210 498 225" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
    
    <!-- Happy Smile -->
    <path d="M 452 262 Q 470 282 485 258" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" />
    <!-- Rosy Cheek Curves -->
    <path d="M 438 243 Q 443 251 449 245" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />
    <path d="M 488 239 Q 493 247 499 241" fill="none" stroke="black" stroke-width="5" stroke-linecap="round" />

    <!-- Cute Front Lantern (Headlight) -->
    <rect x="485" y="260" width="20" height="28" rx="5" fill="white" stroke="black" stroke-width="7" />
    <path d="M 495 260 L 495 248" fill="none" stroke="black" stroke-width="6" />

    <!-- Cowcatcher / Grill (Front Bottom) -->
    <path d="M 430 315 L 475 355 L 415 355 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
    <line x1="440" y1="325" x2="435" y2="355" stroke="black" stroke-width="6" />
    <line x1="450" y1="330" x2="450" y2="355" stroke="black" stroke-width="6" />

    <!-- Under-Carriage Base Plate -->
    <rect x="130" y="315" width="295" height="20" rx="5" fill="white" stroke="black" stroke-width="8" />

    <!-- Train Wheels (Large, Medium, Small for Whimsical Look) -->
    <!-- Big Back Wheel -->
    <circle cx="180" cy="345" r="48" fill="white" stroke="black" stroke-width="8" />
    <circle cx="180" cy="345" r="18" fill="white" stroke="black" stroke-width="7" />
    <!-- Medium Wheel -->
    <circle cx="285" cy="345" r="42" fill="white" stroke="black" stroke-width="8" />
    <circle cx="285" cy="345" r="15" fill="white" stroke="black" stroke-width="7" />
    <!-- Small Front Wheel -->
    <circle cx="380" cy="345" r="36" fill="white" stroke="black" stroke-width="8" />
    <circle cx="380" cy="345" r="12" fill="white" stroke="black" stroke-width="7" />

    <!-- Wheel Connecting Rod -->
    <rect x="165" y="338" width="230" height="14" rx="7" fill="white" stroke="black" stroke-width="7" />
    <circle cx="180" cy="345" r="6" fill="black" />
    <circle cx="285" cy="345" r="6" fill="black" />
    <circle cx="380" cy="345" r="6" fill="black" />

  </g> <!-- End Train Group -->

  <!-- Cloud In Front of Train (Gives Depth of Flying Through Sky) -->
  <g transform="translate(40, 680) scale(1.1)">
    <path d="M 50 110 C 20 110 0 90 0 60 C 0 30 30 10 60 20 C 80 -10 130 -10 150 20 C 180 10 210 30 200 60 C 210 90 190 110 160 110 Z" fill="white" stroke="black" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Thick Outer Border for Coloring Book Page Framing -->
  <rect x="25" y="25" width="750" height="950" rx="30" fill="none" stroke="black" stroke-width="16" />
</svg>