<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fill-none {
        fill: none;
      }
    </style>
  </defs>

  <!-- Shop Floor / Ground Line -->
  <line x1="0" y1="900" x2="800" y2="900" class="outline fill-none" stroke-width="5"/>

  <!-- Back Wall Shelves -->
  <g id="shelves">
    <rect x="50" y="200" width="700" height="30" class="outline"/>
    <rect x="50" y="450" width="700" height="30" class="outline"/>
    <rect x="50" y="700" width="700" height="30" class="outline"/>
  </g>

  <!-- Clocks on shelves and background -->
  <g id="clocks">
    <!-- Grandfather Clock 1 -->
    <rect x="100" y="500" width="80" height="190" rx="10" ry="10" class="outline"/>
    <rect x="110" y="510" width="60" height="80" rx="5" ry="5" class="outline"/>
    <circle cx="140" cy="550" r="20" class="outline fill-none"/>
    <line x1="140" y1="550" x2="140" y2="535" class="outline fill-none" stroke-width="3"/>
    <line x1="140" y1="550" x2="155" y2="550" class="outline fill-none" stroke-width="3"/>

    <!-- Grandfather Clock 2 -->
    <rect x="620" y="500" width="80" height="190" rx="10" ry="10" class="outline"/>
    <rect x="630" y="510" width="60" height="80" rx="5" ry="5" class="outline"/>
    <circle cx="660" cy="550" r="20" class="outline fill-none"/>
    <line x1="660" y1="550" x2="660" y2="535" class="outline fill-none" stroke-width="3"/>
    <line x1="660" y1="550" x2="675" y2="550" class="outline fill-none" stroke-width="3"/>

    <!-- Cuckoo Clock 1 -->
    <g transform="translate(250, 260)">
      <rect x="0" y="0" width="80" height="100" rx="5" ry="5" class="outline"/>
      <path d="M0 0 L40 -40 L80 0 Z" class="outline"/>
      <circle cx="40" cy="50" r="25" class="outline fill-none"/>
      <line x1="40" y1="50" x2="40" y2="40" class="outline fill-none" stroke-width="3"/>
      <line x1="40" y1="50" x2="50" y2="50" class="outline fill-none" stroke-width="3"/>
      <rect x="30" y="85" width="20" height="15" rx="5" ry="5" class="outline"/>
    </g>

    <!-- Cuckoo Clock 2 -->
    <g transform="translate(500, 260)">
      <rect x="0" y="0" width="80" height="100" rx="5" ry="5" class="outline"/>
      <path d="M0 0 L40 -40 L80 0 Z" class="outline"/>
      <circle cx="40" cy="50" r="25" class="outline fill-none"/>
      <line x1="40" y1="50" x2="40" y2="40" class="outline fill-none" stroke-width="3"/>
      <line x1="40" y1="50" x2="50" y2="50" class="outline fill-none" stroke-width="3"/>
      <rect x="30" y="85" width="20" height="15" rx="5" ry="5" class="outline"/>
    </g>

    <!-- Pocket Watches on top shelf -->
    <circle cx="100" cy="230" r="25" class="outline"/>
    <circle cx="100" cy="230" r="15" class="outline fill-none"/>
    <line x1="100" y1="230" x2="100" y2="220" class="outline fill-none" stroke-width="2"/>
    <line x1="100" y1="230" x2="110" y2="230" class="outline fill-none" stroke-width="2"/>

    <circle cx="180" cy="230" r="25" class="outline"/>
    <circle cx="180" cy="230" r="15" class="outline fill-none"/>
    <line x1="180" y1="230" x2="180" y2="220" class="outline fill-none" stroke-width="2"/>
    <line x1="180" y1="230" x2="190" y2="230" class="outline fill-none" stroke-width="2"/>

    <circle cx="620" cy="230" r="25" class="outline"/>
    <circle cx="620" cy="230" r="15" class="outline fill-none"/>
    <line x1="620" y1="230" x2="620" y2="220" class="outline fill-none" stroke-width="2"/>
    <line x1="620" y1="230" x2="630" y2="230" class="outline fill-none" stroke-width="2"/>

    <circle cx="700" cy="230" r="25" class="outline"/>
    <circle cx="700" cy="230" r="15" class="outline fill-none"/>
    <line x1="700" y1="230" x2="700" y2="220" class="outline fill-none" stroke-width="2"/>
    <line x1="700" y1="230" x2="710" y2="230" class="outline fill-none" stroke-width="2"/>
  </g>

  <!-- Gears, Tools, and Springs on shelves -->
  <g id="gadgets">
    <!-- Gears -->
    <g transform="translate(350,230)">
      <circle cx="0" cy="0" r="20" class="outline"/>
      <rect x="-25" y="-5" width="10" height="10" rx="2" ry="2" class="outline"/>
      <rect x="15" y="-25" width="10" height="10" rx="2" ry="2" class="outline"/>
      <rect x="15" y="15" width="10" height="10" rx="2" ry="2" class="outline"/>
      <rect x="-5" y="15" width="10" height="10" rx="2" ry="2" class="outline" transform="rotate(45 0 0)"/>
      <rect x="-5" y="-25" width="10" height="10" rx="2" ry="2" class="outline" transform="rotate(45 0 0)"/>
    </g>
    <g transform="translate(450,490)">
      <circle cx="0" cy="0" r="25" class="outline"/>
      <rect x="-30" y="-5" width="10" height="10" rx="2" ry="2" class="outline"/>
      <rect x="20" y="-30" width="10" height="10" rx="2" ry="2" class="outline"/>
      <rect x="20" y="20" width="10" height="10" rx="2" ry="2" class="outline"/>
      <rect x="-5" y="20" width="10" height="10" rx="2" ry="2" class="outline" transform="rotate(45 0 0)"/>
      <rect x="-5" y="-30" width="10" height="10" rx="2" ry="2" class="outline" transform="rotate(45 0 0)"/>
    </g>

    <!-- Springs -->
    <path d="M200 480 Q210 470, 220 480 Q230 490, 240 480 Q250 470, 260 480" class="outline fill-none" stroke-width="3"/>
    <path d="M550 480 Q560 470, 570 480 Q580 490, 590 480 Q600 470, 610 480" class="outline fill-none" stroke-width="3"/>

    <!-- Magnifying Glass (on bottom shelf) -->
    <circle cx="300" cy="740" r="25" class="outline"/>
    <rect x="315" y="745" width="40" height="10" rx="5" ry="5" class="outline"/>

    <!-- Screwdriver (on bottom shelf) -->
    <rect x="400" y="730" width="50" height="10" rx="3" ry="3" class="outline"/>
    <line x1="450" y1="735" x2="465" y2="735" class="outline fill-none" stroke-width="3"/>
  </g>

  <!-- Alice in Wonderland White Rabbit Clockmaker Character -->
  <g id="rabbit-character">
    <!-- Legs -->
    <ellipse cx="380" cy="880" rx="40" ry="25" class="outline"/>
    <ellipse cx="480" cy="880" rx="40" ry="25" class="outline"/>
    <rect x="360" y="800" width="40" height="80" rx="15" ry="15" class="outline"/>
    <rect x="460" y="800" width="40" height="80" rx="15" ry="15" class="outline"/>

    <!-- Body (behind apron) -->
    <ellipse cx="440" cy="740" rx="90" ry="100" class="outline"/>

    <!-- Waistcoat -->
    <path d="M440 640 L370 700 V800 H510 V700 L440 640 Z" class="outline"/>
    <circle cx="440" cy="720" r="5" class="outline"/>
    <circle cx="440" cy="750" r="5" class="outline"/>

    <!-- Apron -->
    <path d="M370 700 Q360 720, 360 760 L360 810 H520 L520 760 Q520 720, 510 700 Z" class="outline"/>
    <rect x="360" y="700" width="160" height="10" class="outline" fill="white"/>

    <!-- Arms -->
    <rect x="330" y="700" width="30" height="90" rx="15" ry="15" class="outline"/>
    <rect x="500" y="700" width="30" height="90" rx="15" ry="15" class="outline"/>
    
    <!-- Hands -->
    <circle cx="340" cy="780" r="20" class="outline"/>
    <circle cx="510" cy="780" r="20" class="outline"/>

    <!-- Head -->
    <ellipse cx="440" cy="580" rx="70" ry="80" class="outline"/>

    <!-- Ears -->
    <ellipse cx="400" cy="480" rx="30" ry="80" transform="rotate(-15 400 480)" class="outline"/>
    <ellipse cx="480" cy="480" rx="30" ry="80" transform="rotate(15 480 480)" class="outline"/>

    <!-- Face features -->
    <circle cx="410" cy="560" r="8" class="outline"/>
    <circle cx="470" cy="560" r="8" class="outline"/>
    <path d="M430 590 Q440 600, 450 590" class="outline fill-none" stroke-width="3"/>
    <ellipse cx="440" cy="580" rx="10" ry="5" class="outline"/>
    
    <!-- Spectacles -->
    <circle cx="410" cy="560" r="15" class="outline fill-none" stroke-width="3"/>
    <circle cx="470" cy="560" r="15" class="outline fill-none" stroke-width="3"/>
    <line x1="425" y1="560" x2="455" y2="560" class="outline fill-none" stroke-width="3"/>

    <!-- Tail -->
    <circle cx="380" cy="800" r="20" class="outline"/>

    <!-- Object in hand (Magnifying glass he's working on) -->
    <circle cx="340" cy="780" r="15" class="outline"/>
    <line x1="350" y1="785" x2="365" y2="785" class="outline fill-none" stroke-width="3"/>

  </g>

</svg>