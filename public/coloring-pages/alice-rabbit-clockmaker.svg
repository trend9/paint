<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style type="text/css"><![CDATA[
      .thick-border {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin-outline {
        stroke: black;
        stroke-width: 3;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .no-fill {
        fill: none;
      }
    ]]></style>
  </defs>

  <!-- Pure white background as required for a coloring book -->
  <rect x="0" y="0" width="800" height="1000" fill="white"/>

  <!-- Main Content Group -->
  <g>
    <!-- Shop background elements (shelves, large gears) -->
    <g id="shop-background">
      <!-- Simple shelves -->
      <rect x="100" y="300" width="600" height="30" rx="15" ry="15" class="outline"/>
      <rect x="100" y="550" width="600" height="30" rx="15" ry="15" class="outline"/>

      <!-- Large gears on the wall/background -->
      <!-- Gear 1 (top-left) -->
      <g transform="translate(150,200)">
        <circle cx="0" cy="0" r="60" class="outline"/>
        <circle cx="0" cy="0" r="20" class="thin-outline"/>
        <rect x="-10" y="-70" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-70" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="50" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-10" y="50" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-40" y="-40" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
        <rect x="20" y="-40" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
        <rect x="20" y="20" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
        <rect x="-40" y="20" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
      </g>
      <!-- Gear 2 (mid-right) -->
      <g transform="translate(650,400)">
        <circle cx="0" cy="0" r="80" class="outline"/>
        <circle cx="0" cy="0" r="30" class="thin-outline"/>
        <rect x="-10" y="-90" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-90" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="70" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-10" y="70" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-50" y="-50" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
        <rect x="30" y="-50" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
        <rect x="30" y="30" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
        <rect x="-50" y="30" width="20" height="20" rx="5" ry="5" transform="rotate(45)" class="outline"/>
      </g>
    </g>

    <!-- Rabbit clockmaker character -->
    <g id="rabbit-clockmaker" transform="translate(450, 800) scale(0.9)">
      <!-- Body (rounded bottom, slightly narrower top) -->
      <path d="M-80 0 C -100 80 -80 140 0 160 C 80 140 100 80 80 0 Z" class="thick-border"/>
      <!-- Head -->
      <ellipse cx="0" cy="-100" rx="60" ry="70" class="thick-border"/>
      <!-- Ears -->
      <!-- Left Ear -->
      <path d="M-40 -160 C -60 -250 -40 -290 0 -280 Q -20 -250 -40 -160 Z" class="thick-border"/>
      <path d="M-25 -170 C -40 -230 -25 -260 0 -250 Q -10 -220 -25 -170 Z" class="thin-outline"/>
      <!-- Right Ear -->
      <path d="M40 -160 C 60 -250 40 -290 0 -280 Q 20 -250 40 -160 Z" class="thick-border"/>
      <path d="M25 -170 C 40 -230 25 -260 0 -250 Q 10 -220 25 -170 Z" class="thin-outline"/>

      <!-- Face details: eyes, nose, mouth -->
      <circle cx="-20" cy="-120" r="8" class="outline"/> <!-- Left eye -->
      <circle cx="20" cy="-120" r="8" class="outline"/> <!-- Right eye -->
      <ellipse cx="0" cy="-95" rx="12" ry="8" class="outline"/> <!-- Nose -->
      <path d="M0 -85 V -75 Q 10 -65 0 -60 Q -10 -65 0 -75" class="thin-outline"/> <!-- Mouth -->

      <!-- Spectacles -->
      <circle cx="-20" cy="-120" r="18" class="thin-outline no-fill"/>
      <circle cx="20" cy="-120" r="18" class="thin-outline no-fill"/>
      <line x1="-5" y1="-120" x2="5" y2="-120" class="thin-outline"/> <!-- Bridge -->

      <!-- Waistcoat -->
      <path d="M-70 -40 Q -80 50 0 80 Q 80 50 70 -40 C 50 -60 -50 -60 -70 -40 Z" class="outline"/>
      <path d="M-50 -40 Q -60 30 0 60 Q 60 30 50 -40 C 30 -50 -30 -50 -50 -40 Z" class="outline"/> <!-- Inner part -->
      <line x1="0" y1="-40" x2="0" y2="60" class="thin-outline"/> <!-- Center split -->
      <circle cx="-25" cy="-20" r="4" class="thin-outline"/>
      <circle cx="-25" cy="10" r="4" class="thin-outline"/>
      <circle cx="-25" cy="40" r="4" class="thin-outline"/>

      <!-- Left Arm holding the clock -->
      <path d="M-60 0 Q -140 -50 -120 -150 L -100 -170 C -80 -140 -20 -100 -20 -40 Z" class="outline"/>
      <!-- Left Paw for holding clock -->
      <ellipse cx="-110" cy="-160" rx="30" ry="20" class="outline"/>

      <!-- Right Arm holding tool -->
      <path d="M60 0 Q 140 -50 120 -150 L 100 -170 C 80 -140 20 -100 20 -40 Z" class="outline"/>
      <!-- Right Paw for holding tool -->
      <ellipse cx="110" cy="-160" rx="30" ry="20" class="outline"/>

      <!-- Legs -->
      <ellipse cx="-30" cy="100" rx="35" ry="50" class="outline"/>
      <ellipse cx="30" cy="100" rx="35" ry="50" class="outline"/>
      <!-- Feet -->
      <ellipse cx="-30" cy="140" rx="40" ry="20" class="outline"/>
      <ellipse cx="30" cy="140" rx="40" ry="20" class="outline"/>
    </g>

    <!-- Clock being inspected (held by rabbit's left paw) -->
    <g id="inspected-clock" transform="translate(300, 560)">
      <circle cx="0" cy="0" r="60" class="thick-border"/> <!-- Main clock face -->
      <circle cx="0" cy="0" r="50" class="outline"/> <!-- Inner circle -->
      <circle cx="0" cy="0" r="4" class="thin-outline"/> <!-- Center dot -->
      <line x1="0" y1="0" x2="0" y2="-40" class="thin-outline"/> <!-- Hour hand -->
      <line x1="0" y1="0" x2="35" y2="0" class="thin-outline"/> <!-- Minute hand -->
      <!-- Simplified numbers as ticks -->
      <circle cx="0" cy="-45" r="2" class="thin-outline"/>
      <circle cx="40" cy="-25" r="2" class="thin-outline"/>
      <circle cx="40" cy="25" r="2" class="thin-outline"/>
      <circle cx="0" cy="45" r="2" class="thin-outline"/>
      <circle cx="-40" cy="25" r="2" class="thin-outline"/>
      <circle cx="-40" cy="-25" r="2" class="thin-outline"/>
      <rect x="-15" y="-70" width="30" height="15" rx="5" ry="5" class="outline"/> <!-- Winding crown -->
    </g>

    <!-- Small tool in rabbit's right paw -->
    <g id="rabbit-tool" transform="translate(600, 560) rotate(-30)">
      <rect x="-10" y="-30" width="20" height="50" rx="5" ry="5" class="outline"/> <!-- Handle -->
      <path d="M-5 20 L-5 30 Q 0 40 5 30 L5 20 Z" class="outline"/> <!-- Simple screwdriver tip -->
    </g>

    <!-- Whimsical oversized pocket watches and intricate gears around -->
    <g id="whimsical-elements">
      <!-- Large pocket watch (left, on floor) -->
      <g transform="translate(180, 780)">
        <circle cx="0" cy="0" r="90" class="thick-border"/>
        <circle cx="0" cy="0" r="80" class="outline"/>
        <line x1="0" y1="0" x2="0" y2="-60" class="thin-outline"/>
        <line x1="0" y1="0" x2="50" y2="0" class="thin-outline"/>
        <circle cx="0" cy="0" r="5" class="thin-outline"/>
        <rect x="-20" y="-100" width="40" height="20" rx="5" ry="5" class="outline"/> <!-- Winder -->
        <circle cx="0" cy="-120" r="15" class="outline"/> <!-- Ring -->
      </g>

      <!-- Large pocket watch (right, on floor) -->
      <g transform="translate(620, 780)">
        <circle cx="0" cy="0" r="90" class="thick-border"/>
        <circle cx="0" cy="0" r="80" class="outline"/>
        <line x1="0" y1="0" x2="0" y2="-60" class="thin-outline"/>
        <line x1="0" y1="0" x2="50" y2="0" class="thin-outline"/>
        <circle cx="0" cy="0" r="5" class="thin-outline"/>
        <rect x="-20" y="-100" width="40" height="20" rx="5" ry="5" class="outline"/>
        <circle cx="0" cy="-120" r="15" class="outline"/>
      </g>

      <!-- Gears on the floor -->
      <g transform="translate(300, 880)">
        <circle cx="0" cy="0" r="70" class="thick-border"/>
        <circle cx="0" cy="0" r="30" class="thin-outline"/>
        <rect x="-10" y="-80" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-80" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="60" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-10" y="60" width="20" height="20" rx="5" ry="5" class="outline"/>
      </g>
      <g transform="translate(500, 880)">
        <circle cx="0" cy="0" r="60" class="thick-border"/>
        <circle cx="0" cy="0" r="25" class="thin-outline"/>
        <rect x="-8" y="-70" width="16" height="16" rx="4" ry="4" class="outline"/>
        <rect x="-70" y="-8" width="16" height="16" rx="4" ry="4" class="outline"/>
        <rect x="54" y="-8" width="16" height="16" rx="4" ry="4" class="outline"/>
        <rect x="-8" y="54" width="16" height="16" rx="4" ry="4" class="outline"/>
      </g>
    </g>

    <!-- Shelves with various unique clocks -->
    <g id="shelf-clocks">
      <!-- Top shelf (on rect at y=300) -->
      <!-- Clock 1: Cuckoo style -->
      <rect x="120" y="200" width="80" height="100" rx="10" ry="10" class="outline"/>
      <path d="M120 200 L160 170 L200 200" class="outline no-fill"/> <!-- Roof -->
      <circle cx="160" cy="240" r="25" class="outline"/> <!-- Clock face -->
      <circle cx="160" cy="240" r="3" class="thin-outline"/>
      <line x1="160" y1="240" x2="160" y2="220" class="thin-outline"/>
      <line x1="160" y1="240" x2="175" y2="240" class="thin-outline"/>

      <!-- Clock 2: Square face with round base -->
      <rect x="250" y="220" width="70" height="70" rx="10" ry="10" class="outline"/>
      <path d="M250 290 Q 285 320 320 290 Z" class="outline"/> <!-- Base -->
      <circle cx="285" cy="255" r="20" class="outline"/>
      <circle cx="285" cy="255" r="3" class="thin-outline"/>
      <line x1="285" y1="255" x2="285" y2="240" class="thin-outline"/>
      <line x1="285" y1="255" x2="295" y2="255" class="thin-outline"/>

      <!-- Clock 3: Abstract face -->
      <path d="M380 290 L420 200 L460 290 C 440 320 400 320 380 290 Z" class="outline"/>
      <ellipse cx="420" cy="245" rx="30" ry="40" class="outline"/>
      <circle cx="420" cy="245" r="3" class="thin-outline"/>
      <line x1="420" y1="245" x2="420" y2="225" class="thin-outline"/>
      <line x1="420" y1="245" x2="440" y2="245" class="thin-outline"/>

      <!-- Clock 4: Star shaped face -->
      <path d="M500 280 L520 240 L540 280 L560 240 L580 280 L540 210 Z" class="outline"/>
      <circle cx="540" cy="240" r="20" class="outline"/>
      <circle cx="540" cy="240" r="3" class="thin-outline"/>
      <line x1="540" y1="240" x2="540" y2="225" class="thin-outline"/>
      <line x1="540" y1="240" x2="555" y2="240" class="thin-outline"/>

      <!-- Clock 5: Tall Grandfather clock style -->
      <rect x="620" y="190" width="60" height="110" rx="10" ry="10" class="outline"/>
      <circle cx="650" cy="230" r="20" class="outline"/>
      <circle cx="650" cy="230" r="3" class="thin-outline"/>
      <line x1="650" y1="230" x2="650" y2="215" class="thin-outline"/>
      <line x1="650" y1="230" x2="665" y2="230" class="thin-outline"/>
      <rect x="635" y="260" width="30" height="30" rx="5" ry="5" class="outline"/> <!-- Pendulum box -->


      <!-- Bottom shelf (on rect at y=550) -->
      <!-- Clock 6: Round with ears -->
      <circle cx="180" cy="500" r="40" class="outline"/>
      <circle cx="180" cy="500" r="3" class="thin-outline"/>
      <line x1="180" y1="500" x2="180" y2="480" class="thin-outline"/>
      <line x1="180" y1="500" x2="200" y2="500" class="thin-outline"/>
      <circle cx="160" cy="465" r="15" class="outline"/> <!-- Ear 1 -->
      <circle cx="200" cy="465" r="15" class="outline"/> <!-- Ear 2 -->

      <!-- Clock 7: Teapot clock -->
      <path d="M280 520 Q 270 480 300 450 Q 330 480 320 520 Z" class="outline"/> <!-- Teapot body -->
      <ellipse cx="300" cy="520" rx="40" ry="20" class="outline"/> <!-- Teapot bottom -->
      <circle cx="300" cy="485" r="20" class="outline"/> <!-- Clock face -->
      <circle cx="300" cy="485" r="3" class="thin-outline"/>
      <line x1="300" y1="485" x2="300" y2="470" class="thin-outline"/>
      <line x1="300" y1="485" x2="315" y2="485" class="thin-outline"/>
      <path d="M260 480 C 240 470 240 490 260 500" class="outline no-fill"/> <!-- Spout -->
      <path d="M340 480 C 360 470 360 490 340 500" class="outline no-fill"/> <!-- Handle -->

      <!-- Clock 8: Cat clock with wagging tail -->
      <path d="M400 520 C 380 470 420 470 400 520 Z" class="outline"/> <!-- Cat body -->
      <circle cx="400" cy="470" r="30" class="outline"/> <!-- Cat head -->
      <path d="M380 445 L390 430 L400 445 Z" class="outline no-fill"/> <!-- Left ear -->
      <path d="M420 445 L410 430 L400 445 Z" class="outline no-fill"/> <!-- Right ear -->
      <circle cx="400" cy="480" r="20" class="outline"/> <!-- Clock face on belly -->
      <circle cx="400" cy="480" r="3" class="thin-outline"/>
      <line x1="400" y1="480" x2="400" y2="465" class="thin-outline"/>
      <line x1="400" y1="480" x2="415" y2="480" class="thin-outline"/>
      <path d="M385 520 Q 370 550 350 540" class="outline no-fill"/> <!-- Tail -->

      <!-- Clock 9: Mushroom clock -->
      <path d="M500 520 Q 480 480 500 460 Q 520 480 500 520 Z" class="outline"/> <!-- Mushroom stem -->
      <ellipse cx="500" cy="450" rx="50" ry="30" class="outline"/> <!-- Mushroom cap -->
      <circle cx="500" cy="460" r="20" class="outline"/> <!-- Clock face on mushroom cap -->
      <circle cx="500" cy="460" r="3" class="thin-outline"/>
      <line x1="500" y1="460" x2="500" y2="445" class="thin-outline"/>
      <line x1="500" y1="460" x2="515" y2="460" class="thin-outline"/>

      <!-- Clock 10: Cogwheel clock -->
      <g transform="translate(620, 480)">
        <circle cx="0" cy="0" r="40" class="outline"/>
        <circle cx="0" cy="0" r="15" class="thin-outline"/>
        <rect x="-10" y="-50" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-50" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="30" y="-10" width="20" height="20" rx="5" ry="5" class="outline"/>
        <rect x="-10" y="30" width="20" height="20" rx="5" ry="5" class="outline"/>
        <circle cx="0" cy="0" r="10" class="thin-outline"/> <!-- Center for clock hands -->
        <line x1="0" y1="0" x2="0" y2="-20" class="thin-outline"/>
        <line x1="0" y1="0" x2="15" y2="0" class="thin-outline"/>
      </g>
    </g>
  </g>
</svg>