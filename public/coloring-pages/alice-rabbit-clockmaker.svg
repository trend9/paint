<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .outline-fill-none {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .outline-thin {
        stroke: black;
        stroke-width: 3;
        fill: white;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Rabbit Clockmaker -->
  <g id="rabbit-clockmaker">
    <!-- Body -->
    <rect x="300" y="450" width="200" height="250" rx="100" ry="125" class="outline"/>
    <!-- Waistcoat -->
    <path d="M300 500 Q350 450 400 500 T500 500 L500 700 Q400 650 300 700 Z" class="outline"/>
    <path d="M400 500 L400 700" class="outline-fill-none"/> <!-- Waistcoat split -->

    <!-- Legs -->
    <rect x="320" y="680" width="60" height="100" rx="30" ry="50" class="outline"/>
    <rect x="420" y="680" width="60" height="100" rx="30" ry="50" class="outline"/>

    <!-- Arms -->
    <rect x="250" y="480" width="80" height="150" rx="40" ry="75" class="outline" transform="rotate(-20 250 480)"/>
    <rect x="470" y="480" width="80" height="150" rx="40" ry="75" class="outline" transform="rotate(20 550 480)"/>

    <!-- Head -->
    <circle cx="400" cy="350" r="120" class="outline"/>
    <!-- Ears -->
    <rect x="340" y="150" width="50" height="150" rx="25" ry="75" class="outline" transform="rotate(-15 365 225)"/>
    <rect x="410" y="150" width="50" height="150" rx="25" ry="75" class="outline" transform="rotate(15 435 225)"/>

    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="360" cy="320" r="20" class="outline"/>
    <circle cx="440" cy="320" r="20" class="outline"/>
    <!-- Pupils -->
    <circle cx="360" cy="320" r="8" class="outline-thin"/>
    <circle cx="440" cy="320" r="8" class="outline-thin"/>
    <!-- Nose -->
    <ellipse cx="400" cy="370" rx="20" ry="15" class="outline"/>
    <!-- Mouth -->
    <path d="M370 390 Q400 420 430 390" class="outline-fill-none"/>

    <!-- Spectacles -->
    <circle cx="360" cy="320" r="30" class="outline-fill-none"/>
    <circle cx="440" cy="320" r="30" class="outline-fill-none"/>
    <line x1="390" y1="320" x2="410" y2="320" class="outline-fill-none"/>

    <!-- Pocket watch in hand -->
    <g id="pocket-watch">
      <circle cx="280" cy="580" r="35" class="outline"/>
      <path d="M280 545 L280 535 M260 560 L300 560 M270 570 L290 570" class="outline-fill-none"/> <!-- Simple hands -->
      <path d="M280 545 Q285 530 290 545" class="outline-fill-none"/> <!-- Small loop for chain -->
    </g>
  </g>

  <!-- Surrounding Clocks -->
  <g id="clocks">
    <!-- Grandfather Clock -->
    <g id="grandfather-clock" transform="translate(550 150)">
      <rect x="0" y="0" width="120" height="450" rx="20" ry="20" class="outline"/>
      <rect x="10" y="10" width="100" height="100" rx="10" ry="10" class="outline"/> <!-- Clock face frame -->
      <circle cx="60" cy="60" r="40" class="outline"/> <!-- Clock face -->
      <line x1="60" y1="60" x2="60" y2="30" class="outline-fill-none"/> <!-- Hour hand -->
      <line x1="60" y1="60" x2="85" y2="60" class="outline-fill-none"/> <!-- Minute hand -->
      <!-- Pendulum -->
      <line x1="60" y1="180" x2="60" y2="300" class="outline-fill-none"/>
      <ellipse cx="60" cy="320" rx="20" ry="30" class="outline"/>
      <!-- Smiling face on clock -->
      <circle cx="45" cy="140" r="5" class="outline"/>
      <circle cx="75" cy="140" r="5" class="outline"/>
      <path d="M40 155 Q60 170 80 155" class="outline-fill-none"/>
    </g>

    <!-- Cuckoo Clock -->
    <g id="cuckoo-clock" transform="translate(100 200)">
      <rect x="0" y="0" width="100" height="120" rx="10" ry="10" class="outline"/> <!-- House body -->
      <path d="M-10 0 L50 -50 L110 0 Z" class="outline"/> <!-- Roof -->
      <rect x="25" y="25" width="50" height="50" rx="5" ry="5" class="outline"/> <!-- Clock face frame -->
      <circle cx="50" cy="50" r="20" class="outline"/> <!-- Clock face -->
      <line x1="50" y1="50" x2="50" y2="40" class="outline-fill-none"/>
      <line x1="50" y1="50" x2="60" y2="50" class="outline-fill-none"/>
      <rect x="40" y="80" width="20" height="20" rx="5" ry="5" class="outline"/> <!-- Cuckoo door -->
      <!-- Cuckoo bird -->
      <g id="cuckoo-bird" transform="translate(50 70)">
        <ellipse cx="0" cy="-20" rx="15" ry="10" class="outline"/>
        <path d="M-10 -25 L0 -35 L10 -25 Z" class="outline-fill-none"/> <!-- Beak -->
        <circle cx="0" cy="-20" r="3" class="outline-thin"/>
      </g>
    </g>
  </g>

  <!-- Workshop elements (gears, springs, clock parts) -->
  <g id="workshop-elements">
    <!-- Table/Workbench -->
    <rect x="0" y="750" width="800" height="250" class="outline"/>

    <!-- Large gear on table -->
    <g id="gear-large" transform="translate(150 850)">
      <circle cx="0" cy="0" r="50" class="outline"/>
      <circle cx="0" cy="0" r="20" class="outline"/>
      <rect x="-15" y="-60" width="30" height="20" rx="5" ry="5" class="outline" transform="rotate(0 0 0)"/>
      <rect x="-15" y="-60" width="30" height="20" rx="5" ry="5" class="outline" transform="rotate(60 0 0)"/>
      <rect x="-15" y="-60" width="30" height="20" rx="5" ry="5" class="outline" transform="rotate(120 0 0)"/>
      <rect x="-15" y="-60" width="30" height="20" rx="5" ry="5" class="outline" transform="rotate(180 0 0)"/>
      <rect x="-15" y="-60" width="30" height="20" rx="5" ry="5" class="outline" transform="rotate(240 0 0)"/>
      <rect x="-15" y="-60" width="30" height="20" rx="5" ry="5" class="outline" transform="rotate(300 0 0)"/>
    </g>

    <!-- Small gear on table -->
    <g id="gear-small" transform="translate(650 900)">
      <circle cx="0" cy="0" r="30" class="outline"/>
      <circle cx="0" cy="0" r="10" class="outline"/>
      <rect x="-10" y="-38" width="20" height="15" rx="3" ry="3" class="outline" transform="rotate(0 0 0)"/>
      <rect x="-10" y="-38" width="20" height="15" rx="3" ry="3" class="outline" transform="rotate(72 0 0)"/>
      <rect x="-10" y="-38" width="20" height="15" rx="3" ry="3" class="outline" transform="rotate(144 0 0)"/>
      <rect x="-10" y="-38" width="20" height="15" rx="3" ry="3" class="outline" transform="rotate(216 0 0)"/>
      <rect x="-10" y="-38" width="20" height="15" rx="3" ry="3" class="outline" transform="rotate(288 0 0)"/>
    </g>

    <!-- Springs -->
    <path d="M50 800 Q70 820 90 800 Q110 780 130 800 Q150 820 170 800" class="outline-fill-none"/>
    <path d="M700 850 Q720 870 740 850 Q760 830 780 850" class="outline-fill-none"/>

    <!-- Other scattered parts -->
    <ellipse cx="200" cy="780" rx="25" ry="15" class="outline"/> <!-- Oval part -->
    <rect x="500" y="800" width="40" height="20" rx="10" ry="10" class="outline"/> <!-- Small block -->
    <circle cx="60" cy="880" r="15" class="outline"/> <!-- Small circle -->
    <circle cx="750" cy="780" r="10" class="outline"/> <!-- Tiny circle -->
    <path d="M50 750 L80 750 M65 740 L65 760" class="outline-fill-none"/> <!-- Plus sign -->
    <path d="M720 750 L750 750" class="outline-fill-none"/> <!-- Dash sign -->
  </g>

</svg>