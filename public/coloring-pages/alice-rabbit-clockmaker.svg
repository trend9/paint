<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Group for the main scene elements -->
  <g id="clock_shop_scene">

    <!-- Work table for the rabbit -->
    <rect x="150" y="700" width="500" height="100" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <rect x="250" y="800" width="70" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/> <!-- Table leg 1 -->
    <rect x="480" y="800" width="70" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/> <!-- Table leg 2 -->

    <!-- Rabbit character -->
    <g id="rabbit" transform="translate(300 450)">
      <!-- Body -->
      <path d="M100,200 Q50,150 100,100 T200,100 T250,150 Q200,200 100,200 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Head -->
      <ellipse cx="150" cy="80" rx="80" ry="70" fill="white" stroke="black" stroke-width="5"/>
      <!-- Ears -->
      <ellipse cx="110" cy="-20" rx="30" ry="70" fill="white" stroke="black" stroke-width="5" transform="rotate(-15 110 -20)"/>
      <ellipse cx="190" cy="-20" rx="30" ry="70" fill="white" stroke="black" stroke-width="5" transform="rotate(15 190 -20)"/>
      <!-- Inner ears -->
      <ellipse cx="110" cy="-20" rx="15" ry="40" fill="white" stroke="black" stroke-width="3" transform="rotate(-15 110 -20)"/>
      <ellipse cx="190" cy="-20" rx="15" ry="40" fill="white" stroke="black" stroke-width="3" transform="rotate(15 190 -20)"/>
      <!-- Muzzle -->
      <ellipse cx="150" cy="100" rx="35" ry="25" fill="white" stroke="black" stroke-width="3"/>
      <!-- Nose -->
      <path d="M150,90 L140,105 L160,105 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Mouth (happy) -->
      <path d="M135,115 Q150,130 165,115" fill="none" stroke="black" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="120" cy="70" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="180" cy="70" r="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Spectacles -->
      <circle cx="120" cy="70" r="20" fill="none" stroke="black" stroke-width="3"/>
      <circle cx="180" cy="70" r="20" fill="none" stroke="black" stroke-width="3"/>
      <path d="M138,70 L162,70" fill="none" stroke="black" stroke-width="3"/>
      <!-- Vest -->
      <path d="M100,120 Q120,100 150,100 Q180,100 200,120 L200,180 Q150,200 100,180 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M150,100 L150,180" fill="none" stroke="black" stroke-width="3"/>
      <!-- Arms -->
      <!-- Left arm (free) -->
      <path d="M90,140 Q70,120 60,160 Q70,180 90,160 Z" fill="white" stroke="black" stroke-width="5" transform="rotate(-10 90 140)"/>
      <!-- Right arm (holding magnifying glass) -->
      <path d="M210,140 Q230,120 240,160 Q230,180 210,160 Z" fill="white" stroke="black" stroke-width="5" transform="rotate(10 210 140)"/>

      <!-- Legs (sitting at table) -->
      <rect x="110" y="200" width="40" height="50" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
      <rect x="180" y="200" width="40" height="50" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>

      <!-- Magnifying Glass in right hand -->
      <g transform="translate(230 160) rotate(30)">
        <circle cx="0" cy="0" r="30" fill="white" stroke="black" stroke-width="4"/>
        <line x1="0" y1="30" x2="0" y2="70" stroke="black" stroke-width="4"/>
        <circle cx="0" cy="75" r="5" fill="white" stroke="black" stroke-width="3"/>
      </g>
    </g>

    <!-- Fantastical Clocks and Gears -->
    <g id="clocks_and_gears">
      <!-- Large whimsical clock (left) -->
      <g transform="translate(100 200)">
        <path d="M0,0 C-50,50 -50,150 0,200 C50,250 150,250 200,200 C250,150 250,50 200,0 C150,-50 50,-50 0,0 Z" fill="white" stroke="black" stroke-width="5"/>
        <circle cx="100" cy="100" r="70" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="100" cy="100" r="5" fill="white" stroke="black" stroke-width="3"/>
        <line x1="100" y1="100" x2="100" y2="50" stroke="black" stroke-width="3"/> <!-- Hour hand -->
        <line x1="100" y1="100" x2="140" y2="100" stroke="black" stroke-width="3"/> <!-- Minute hand -->
        <rect x="95" y="0" width="10" height="30" fill="white" stroke="black" stroke-width="3"/>
        <rect x="170" y="95" width="30" height="10" fill="white" stroke="black" stroke-width="3"/>
      </g>

      <!-- Tall grandfather clock (right) -->
      <g transform="translate(550 100)">
        <rect x="0" y="0" width="150" height="400" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
        <rect x="25" y="25" width="100" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="75" cy="100" r="40" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="75" cy="100" r="5" fill="white" stroke="black" stroke-width="3"/>
        <line x1="75" y1="100" x2="75" y2="60" stroke="black" stroke-width="3"/>
        <line x1="75" y1="100" x2="105" y2="100" stroke="black" stroke-width="3"/>
        <rect x="50" y="250" width="50" height="80" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Pendulum body -->
        <line x1="75" y1="190" x2="75" y2="250" stroke="black" stroke-width="3"/> <!-- Pendulum rod -->
      </g>

      <!-- Small gear on table (left) -->
      <g transform="translate(200 680)">
        <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="4"/>
        <g id="gear_teeth_small">
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(0)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(45)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(90)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(135)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(180)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(225)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(270)"/>
          <rect x="-10" y="-50" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(315)"/>
        </g>
      </g>

      <!-- Medium gear on table (right) -->
      <g transform="translate(580 680)">
        <circle cx="0" cy="0" r="50" fill="white" stroke="black" stroke-width="4"/>
        <g id="gear_teeth_medium">
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(0)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(30)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(60)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(90)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(120)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(150)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(180)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(210)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(240)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(270)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(300)"/>
          <rect x="-10" y="-60" width="20" height="10" fill="white" stroke="black" stroke-width="3" transform="rotate(330)"/>
        </g>
      </g>

      <!-- Whimsical mushroom clock (top left) -->
      <g transform="translate(50 50)">
        <path d="M50,100 C50,50 150,50 150,100 C150,150 50,150 50,100 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Clock base (stem) -->
        <path d="M0,100 C-30,50 20,0 100,0 C180,0 230,50 200,100 C180,130 20,130 0,100 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Mushroom cap -->
        <circle cx="100" cy="60" r="30" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="100" cy="60" r="5" fill="white" stroke="black" stroke-width="3"/>
        <line x1="100" y1="60" x2="100" y2="40" stroke="black" stroke-width="3"/>
        <line x1="100" y1="60" x2="120" y2="70" stroke="black" stroke-width="3"/>
      </g>

      <!-- Melting clock (top right) -->
      <g transform="translate(600 50)">
        <!-- Outer melting shape -->
        <path d="M50,0 C-10,30 20,80 50,100 C80,80 110,30 50,0 Z M50,100 C40,120 60,120 50,100 Z" fill="white" stroke="black" stroke-width="5"/>
        <!-- Clock face (slightly distorted/slumped) -->
        <circle cx="50" cy="55" r="30" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="50" cy="55" r="5" fill="white" stroke="black" stroke-width="3"/>
        <line x1="50" y1="55" x2="50" y2="35" stroke="black" stroke-width="3"/>
        <line x1="50" y1="55" x2="70" y2="65" stroke="black" stroke-width="3"/>
      </g>

    </g>
  </g>
</svg>