<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the entire scene -->
  <g>
    <!-- Background elements - shop floor -->
    <rect x="0" y="850" width="800" height="150" fill="white" stroke="black" stroke-width="4"/>

    <!-- Shop elements: shelves -->
    <g id="shelves">
      <rect x="50" y="200" width="200" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <rect x="550" y="250" width="200" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Shop elements: clocks -->
    <g id="clocks">
      <!-- Grandfather Clock -->
      <g id="grandfather_clock">
        <rect x="100" y="350" width="150" height="500" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
        <!-- Top decorative section -->
        <rect x="110" y="320" width="130" height="40" rx="15" ry="15" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="175" cy="310" r="15" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="175" cy="450" r="50" fill="white" stroke="black" stroke-width="4"/> <!-- Clock face -->
        <line x1="175" y1="450" x2="175" y2="415" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Hour hand -->
        <line x1="175" y1="450" x2="200" y2="460" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Minute hand -->
        <circle cx="175" cy="450" r="5" fill="black" stroke="none"/> <!-- Center dot -->
        <rect x="150" y="550" width="50" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Pendulum case -->
        <circle cx="175" cy="650" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Pendulum bob -->
      </g>

      <!-- Large Round Wall Clock -->
      <g id="wall_clock">
        <circle cx="650" cy="150" r="80" fill="white" stroke="black" stroke-width="5"/>
        <circle cx="650" cy="150" r="60" fill="white" stroke="black" stroke-width="4"/> <!-- Clock face -->
        <line x1="650" y1="150" x2="650" y2="110" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Hour hand -->
        <line x1="650" y1="150" x2="685" y2="160" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Minute hand -->
        <circle cx="650" cy="150" r="5" fill="black" stroke="none"/> <!-- Center dot -->
      </g>
      
      <!-- Small Pocket Watches on shelves -->
      <g id="pocket_watches">
        <!-- Watch 1 -->
        <circle cx="100" cy="250" r="30" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="100" cy="250" r="20" fill="white" stroke="black" stroke-width="3"/>
        <line x1="100" y1="250" x2="100" y2="235" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <line x1="100" y1="250" x2="110" y2="255" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <circle cx="100" cy="250" r="3" fill="black" stroke="none"/>
        <circle cx="100" cy="215" r="5" fill="none" stroke="black" stroke-width="3"/> <!-- Simple loop -->

        <!-- Watch 2 -->
        <circle cx="200" cy="250" r="30" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="200" cy="250" r="20" fill="white" stroke="black" stroke-width="3"/>
        <line x1="200" y1="250" x2="200" y2="230" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <line x1="200" y1="250" x2="215" y2="250" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <circle cx="200" cy="250" r="3" fill="black" stroke="none"/>
        <circle cx="200" cy="215" r="5" fill="none" stroke="black" stroke-width="3"/> <!-- Simple loop -->

        <!-- Watch 3 -->
        <circle cx="600" cy="300" r="30" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="600" cy="300" r="20" fill="white" stroke="black" stroke-width="3"/>
        <line x1="600" y1="300" x2="600" y2="280" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <line x1="600" y1="300" x2="615" y2="305" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <circle cx="600" cy="300" r="3" fill="black" stroke="none"/>
        <circle cx="600" cy="265" r="5" fill="none" stroke="black" stroke-width="3"/> <!-- Simple loop -->

        <!-- Watch 4 -->
        <circle cx="700" cy="300" r="30" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="700" cy="300" r="20" fill="white" stroke="black" stroke-width="3"/>
        <line x1="700" y1="300" x2="700" y2="285" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <line x1="700" y1="300" x2="710" y2="290" stroke="black" stroke-width="2" stroke-linecap="round"/>
        <circle cx="700" cy="300" r="3" fill="black" stroke="none"/>
        <circle cx="700" cy="265" r="5" fill="none" stroke="black" stroke-width="3"/> <!-- Simple loop -->
      </g>
    </g>

    <!-- The White Rabbit character (body parts below cogwheel) -->
    <g id="white_rabbit_body_elements">
      <!-- Body -->
      <ellipse cx="440" cy="750" rx="90" ry="100" fill="white" stroke="black" stroke-width="5"/>
      <!-- Head -->
      <circle cx="440" cy="530" r="80" fill="white" stroke="black" stroke-width="5"/>
      <!-- Ears -->
      <ellipse cx="400" cy="390" rx="30" ry="80" transform="rotate(-15 400 390)" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="480" cy="390" rx="30" ry="80" transform="rotate(15 480 390)" fill="white" stroke="black" stroke-width="4"/>
      <!-- Vest (simple polygon) -->
      <path d="M370 660 L440 690 L510 660 L500 750 L440 780 L380 750 Z" fill="white" stroke="black" stroke-width="4"/>
      
      <!-- Feet -->
      <ellipse cx="390" cy="840" rx="50" ry="25" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="490" cy="840" rx="50" ry="25" fill="white" stroke="black" stroke-width="4"/>
      <!-- Tail -->
      <circle cx="540" cy="780" r="25" fill="white" stroke="black" stroke-width="4"/>

      <!-- Face details -->
      <!-- Glasses -->
      <circle cx="410" cy="520" r="25" fill="none" stroke="black" stroke-width="3"/>
      <circle cx="470" cy="520" r="25" fill="none" stroke="black" stroke-width="3"/>
      <line x1="435" y1="520" x2="445" y2="520" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Bridge -->
      <!-- Eyes (inside glasses) -->
      <circle cx="410" cy="520" r="8" fill="black" stroke="none"/>
      <circle cx="470" cy="520" r="8" fill="black" stroke="none"/>
      <!-- Nose -->
      <ellipse cx="440" cy="550" rx="15" ry="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Mouth -->
      <path d="M410 570 Q440 590 470 570" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="380" y1="550" x2="350" y2="540" stroke="black" stroke-width="2" stroke-linecap="round"/>
      <line x1="380" y1="555" x2="350" y2="560" stroke="black" stroke-width="2" stroke-linecap="round"/>
      <line x1="500" y1="550" x2="530" y2="540" stroke="black" stroke-width="2" stroke-linecap="round"/>
      <line x1="500" y1="555" x2="530" y2="560" stroke="black" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Big simplified Cogwheel held by the rabbit -->
    <g id="cogwheel" transform="translate(0, -10)"> <!-- Adjust position slightly -->
      <circle cx="440" cy="740" r="100" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="440" cy="740" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Inner hole -->
      <!-- Teeth of the cogwheel (8 teeth) -->
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(0 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(45 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(90 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(135 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(180 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(225 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(270 440 740)"/>
      <rect x="425" y="620" width="30" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" transform="rotate(315 440 740)"/>
    </g>
    
    <!-- Rabbit's arms and hands (drawn AFTER the cogwheel to appear in front of it) -->
    <g id="rabbit_arms_hands">
      <!-- Arms -->
      <rect x="290" y="680" width="80" height="40" rx="20" ry="20" transform="rotate(-30 290 680)" fill="white" stroke="black" stroke-width="4"/>
      <rect x="520" y="680" width="80" height="40" rx="20" ry="20" transform="rotate(30 520 680)" fill="white" stroke="black" stroke-width="4"/>
      <!-- Hands holding cogwheel (these should overlap the cogwheel slightly) -->
      <circle cx="320" cy="740" r="30" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="560" cy="740" r="30" fill="white" stroke="black" stroke-width="4"/>
    </g>
  </g>
</svg>