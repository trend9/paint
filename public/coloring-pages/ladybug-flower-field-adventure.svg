<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define simple rounded petal shapes for reuse with rotation -->
    <ellipse id="petal_small" rx="25" ry="40" stroke="black" stroke-width="4" fill="white"/>
    <ellipse id="petal_medium" rx="30" ry="50" stroke="black" stroke-width="4" fill="white"/>
    <!-- Define simple rounded leaf shapes for reuse with rotation -->
    <ellipse id="leaf_small" rx="20" ry="50" stroke="black" stroke-width="4" fill="white"/>
    <ellipse id="leaf_medium" rx="25" ry="60" stroke="black" stroke-width="4" fill="white"/>
  </defs>

  <!-- Ladybug Group -->
  <g id="ladybug">
    <!-- Body -->
    <ellipse cx="400" cy="400" rx="100" ry="120" stroke="black" stroke-width="4" fill="white"/>
    <!-- Head -->
    <circle cx="400" cy="270" r="80" stroke="black" stroke-width="4" fill="white"/>
    <!-- Eyes -->
    <circle cx="360" cy="260" r="30" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="440" cy="260" r="30" stroke="black" stroke-width="4" fill="white"/>
    <!-- Joyful Smile -->
    <path d="M 370 300 Q 400 340 430 300" stroke="black" stroke-width="4" fill="none"/>
    <!-- Wings (flapping gently) -->
    <path d="M 320 300 C 250 180 350 150 390 250 L 390 400 C 350 400 320 300 320 300 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 480 300 C 550 180 450 150 410 250 L 410 400 C 450 400 480 300 480 300 Z" stroke="black" stroke-width="4" fill="white"/>
    <!-- Spots -->
    <circle cx="350" cy="400" r="35" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="450" cy="430" r="35" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="400" cy="500" r="35" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Flowers Group -->
  <g id="flowers">
    <!-- Flower 1 (left) -->
    <path d="M 150 950 L 150 780" stroke="black" stroke-width="4" fill="none"/> <!-- Stem -->
    <circle cx="150" cy="750" r="30" stroke="black" stroke-width="4" fill="white"/> <!-- Center -->
    <use href="#petal_small" x="150" y="710"/>
    <use href="#petal_small" x="150" y="710" transform="rotate(72 150 750)"/>
    <use href="#petal_small" x="150" y="710" transform="rotate(144 150 750)"/>
    <use href="#petal_small" x="150" y="710" transform="rotate(216 150 750)"/>
    <use href="#petal_small" x="150" y="710" transform="rotate(288 150 750)"/>

    <!-- Flower 2 (middle) -->
    <path d="M 400 950 L 400 700" stroke="black" stroke-width="4" fill="none"/> <!-- Stem -->
    <circle cx="400" cy="670" r="40" stroke="black" stroke-width="4" fill="white"/> <!-- Center -->
    <use href="#petal_medium" x="400" y="620"/>
    <use href="#petal_medium" x="400" y="620" transform="rotate(60 400 670)"/>
    <use href="#petal_medium" x="400" y="620" transform="rotate(120 400 670)"/>
    <use href="#petal_medium" x="400" y="620" transform="rotate(180 400 670)"/>
    <use href="#petal_medium" x="400" y="620" transform="rotate(240 400 670)"/>
    <use href="#petal_medium" x="400" y="620" transform="rotate(300 400 670)"/>

    <!-- Flower 3 (right) -->
    <path d="M 650 950 L 650 780" stroke="black" stroke-width="4" fill="none"/> <!-- Stem -->
    <circle cx="650" cy="750" r="30" stroke="black" stroke-width="4" fill="white"/> <!-- Center -->
    <use href="#petal_small" x="650" y="710"/>
    <use href="#petal_small" x="650" y="710" transform="rotate(72 650 750)"/>
    <use href="#petal_small" x="650" y="710" transform="rotate(144 650 750)"/>
    <use href="#petal_small" x="650" y="710" transform="rotate(216 650 750)"/>
    <use href="#petal_small" x="650" y="710" transform="rotate(288 650 750)"/>
  </g>

  <!-- Leaves Group -->
  <g id="leaves">
    <use href="#leaf_small" x="110" y="850" transform="rotate(-30 110 850)"/>
    <use href="#leaf_medium" x="450" y="800" transform="rotate(40 450 800)"/>
    <use href="#leaf_small" x="600" y="850" transform="rotate(30 600 850)"/>
  </g>

  <!-- Cloud Group -->
  <g id="cloud">
    <path d="M 700 120 C 680 70 600 70 580 120 C 560 170 600 220 650 220 C 700 220 740 170 720 120 C 710 90 700 120 700 120 Z" stroke="black" stroke-width="4" fill="white"/>
  </g>
</svg>