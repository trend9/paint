<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="water-surface" stroke="black" stroke-width="5" fill="none">
    <path d="M0 150 Q200 120 400 150 T800 150" fill="none"/>
    <!-- Bubbles -->
    <circle cx="100" cy="100" r="15" stroke-width="4" fill="white"/>
    <circle cx="130" cy="70" r="10" stroke-width="4" fill="white"/>
    <circle cx="600" cy="90" r="18" stroke-width="4" fill="white"/>
    <circle cx="630" cy="60" r="12" stroke-width="4" fill="white"/>
  </g>

  <g id="coral-reef" stroke="black" stroke-width="5" fill="white">
    <!-- Main coral structure 1 (base) -->
    <path d="M0 1000 L0 750 Q100 700 200 750 T400 700 T600 750 T800 700 L800 1000 Z" />
    <!-- Additional rounded coral formations on the base -->
    <ellipse cx="150" cy="780" rx="60" ry="40"/>
    <ellipse cx="350" cy="760" rx="70" ry="50"/>
    <ellipse cx="650" cy="790" rx="55" ry="45"/>
    <!-- Coral formation 2 -->
    <path d="M400 850 Q430 800 460 850 Q490 900 460 950 Q430 1000 400 950 Q370 900 400 850 Z"/>
    <!-- Coral formation 3 -->
    <path d="M100 880 Q120 830 140 880 Q160 930 140 980 Q120 1030 100 980 Q80 930 100 880 Z"/>
  </g>

  <g id="seaweed" stroke="black" stroke-width="4" fill="white">
    <path d="M50 850 C60 750 20 650 50 550 C80 650 40 750 50 850 Z"/>
    <path d="M750 800 C760 700 720 600 750 500 C780 600 740 700 750 800 Z"/>
    <path d="M250 890 C260 790 220 690 250 590 C280 690 240 790 250 890 Z"/>
  </g>

  <g id="fish" stroke="black" stroke-width="4" fill="white">
    <!-- Fish 1 (main) -->
    <path d="M200 300 C280 250 350 280 350 350 C350 420 280 450 200 400 C190 390 190 310 200 300 Z"/> <!-- Body -->
    <path d="M190 350 C170 365 150 340 190 310 C200 325 200 370 190 350 Z"/> <!-- Tail fin -->
    <ellipse cx="270" cy="330" rx="15" ry="10" stroke-width="3"/> <!-- Eye -->
    <path d="M295 365 Q310 355 325 365" fill="none" stroke-width="3"/> <!-- Smile -->
    <path d="M290 320 C315 310 315 330 290 340 C280 330 280 310 290 320 Z"/> <!-- Top fin -->
    <path d="M290 380 C315 390 315 370 290 360 C280 370 280 390 290 380 Z"/> <!-- Bottom fin -->

    <!-- Fish 2 (smaller) -->
    <path d="M500 450 C560 420 600 440 600 490 C600 540 560 560 500 530 C490 520 490 460 500 450 Z" stroke-width="3"/>
    <path d="M490 490 C470 500 450 480 490 460 C500 470 500 510 490 490 Z" stroke-width="3"/> <!-- Tail fin -->
    <ellipse cx="540" cy="480" rx="10" ry="7" stroke-width="2"/> <!-- Eye -->
    <path d="M560 500 Q570 495 580 500" fill="none" stroke-width="2"/> <!-- Smile -->
    <path d="M550 465 C565 460 565 475 550 480 C540 475 540 460 550 465 Z" stroke-width="3"/> <!-- Top fin -->
    <path d="M550 515 C565 520 565 505 550 500 C540 505 540 520 550 515 Z" stroke-width="3"/> <!-- Bottom fin -->

    <!-- Fish 3 (another small one) -->
    <path d="M150 500 C200 480 230 490 230 520 C230 550 200 560 150 540 C140 530 140 510 150 500 Z" stroke-width="3"/>
    <path d="M140 520 C120 530 100 510 140 490 C150 500 150 540 140 520 Z" stroke-width="3"/> <!-- Tail fin -->
    <ellipse cx="190" cy="510" rx="10" ry="7" stroke-width="2"/> <!-- Eye -->
    <path d="M210 525 Q220 520 230 525" fill="none" stroke-width="2"/> <!-- Smile -->
    <path d="M200 495 C215 490 215 505 200 510 C190 505 190 490 200 495 Z" stroke-width="3"/> <!-- Top fin -->
    <path d="M200 545 C215 550 215 535 200 530 C190 535 190 550 200 545 Z" stroke-width="3"/> <!-- Bottom fin -->
  </g>

  <g id="starfish" stroke="black" stroke-width="5" fill="white">
    <path d="M700 650 Q710 610 730 620 Q750 630 740 660 Q750 690 730 700 Q710 710 680 700 Q660 690 670 660 Q650 630 670 620 Q690 610 700 650 Z"/>
    <!-- Small dots for texture -->
    <circle cx="700" cy="650" r="5" stroke-width="2"/>
    <circle cx="685" cy="670" r="4" stroke-width="2"/>
    <circle cx="715" cy="670" r="4" stroke-width="2"/>
  </g>

  <g id="crab" stroke="black" stroke-width="5" fill="white">
    <!-- Body -->
    <ellipse cx="400" cy="900" rx="60" ry="40"/>
    <!-- Eyes -->
    <circle cx="380" cy="860" r="8" stroke-width="3"/>
    <circle cx="420" cy="860" r="8" stroke-width="3"/>
    <!-- Legs (simplified curves) -->
    <path d="M340 910 Q320 930 300 910" fill="none" stroke-width="4"/>
    <path d="M350 930 Q330 950 310 930" fill="none" stroke-width="4"/>
    <path d="M460 910 Q480 930 500 910" fill="none" stroke-width="4"/>
    <path d="M450 930 Q470 950 490 930" fill="none" stroke-width="4"/>
    <!-- Claws (simplified shapes) -->
    <path d="M340 900 C320 880 300 890 310 870 C300 860 300 880 310 870 C320 890 340 900 340 900 Z" stroke-width="4"/>
    <path d="M460 900 C480 880 500 890 490 870 C500 860 500 880 490 870 C480 890 460 900 460 900 Z" stroke-width="4"/>
  </g>
</svg>