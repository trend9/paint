<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="whale">
    <!-- Main whale body -->
    <ellipse cx="400" cy="450" rx="280" ry="150" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Side fin -->
    <ellipse cx="300" cy="550" rx="80" ry="40" transform="rotate(-30 300 550)" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Tail fin -->
    <path d="M680 450 Q750 400, 720 300 Q780 350, 750 450 Q780 550, 720 600 Q750 500, 680 450Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Large, friendly eye -->
    <circle cx="280" cy="400" r="40" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Gentle smile -->
    <path d="M250 480 Q 300 520, 350 480" fill="none" stroke="black" stroke-width="4"/>
    
    <!-- Blowhole -->
    <ellipse cx="450" cy="270" rx="20" ry="10" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="balloons">
    <!-- Balloon 1 (circle) -->
    <circle cx="350" cy="150" r="30" fill="white" stroke="black" stroke-width="4"/>
    <line x1="350" y1="180" x2="370" y2="270" stroke="black" stroke-width="3"/>
    
    <!-- Balloon 2 (ellipse) -->
    <ellipse cx="470" cy="100" rx="35" ry="45" fill="white" stroke="black" stroke-width="4"/>
    <line x1="470" y1="145" x2="450" y2="270" stroke="black" stroke-width="3"/>
    
    <!-- Balloon 3 (rounded rectangle) -->
    <rect x="580" y="120" width="70" height="90" rx="15" ry="15" fill="white" stroke="black" stroke-width="4"/>
    <line x1="615" y1="210" x2="550" y2="270" stroke="black" stroke-width="3"/>
    
    <!-- Balloon 4 (heart shape) -->
    <path d="M300 250 C280 210, 240 210, 240 250 C240 280, 270 300, 300 330 C330 300, 360 280, 360 250 C360 210, 320 210, 300 250Z" fill="white" stroke="black" stroke-width="4"/>
    <line x1="300" y1="330" x2="320" y2="350" stroke="black" stroke-width="3"/>
    
    <!-- Balloon 5 (small ellipse) -->
    <ellipse cx="680" cy="80" rx="25" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <line x1="680" y1="115" x2="600" y2="300" stroke="black" stroke-width="3"/>
    
    <!-- Balloon 6 (large circle, near tail) -->
    <circle cx="700" cy="200" r="45" fill="white" stroke="black" stroke-width="4"/>
    <line x1="700" y1="245" x2="650" y2="400" stroke="black" stroke-width="3"/>
  </g>

  <g id="clouds">
    <!-- Cloud 1 -->
    <path d="M100 800 C50 780, 50 820, 100 840 C150 860, 200 840, 250 850 C300 860, 350 840, 350 800 C300 750, 150 750, 100 800Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Cloud 2 -->
    <path d="M380 820 C330 800, 330 840, 380 860 C430 880, 480 860, 530 870 C580 880, 630 860, 630 820 C580 770, 430 770, 380 820Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Cloud 3 -->
    <path d="M600 790 C570 770, 570 810, 600 830 C630 850, 660 830, 690 840 C720 850, 750 830, 750 790 C720 740, 630 740, 600 790Z" fill="white" stroke="black" stroke-width="4"/>
  </g>
</svg>