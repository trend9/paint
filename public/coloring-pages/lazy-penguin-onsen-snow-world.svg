<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">

  <!-- Snowy Mountain Landscape -->
  <g id="landscape">
    <!-- Background Mountains -->
    <path d="M-10 400 Q 150 150 300 400 Q 400 250 500 350 Q 650 100 810 300 L 810 500 L -10 500 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 400 450 Q 550 200 700 450 Q 750 300 810 400 L 810 500 L 400 500 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Snowy Ground -->
    <path d="M0 650 Q 150 600 300 650 T 500 700 T 700 650 T 800 600 L 800 1000 L 0 1000 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Hot Spring Pool -->
  <g id="hot-spring">
    <ellipse cx="400" cy="750" rx="250" ry="100" fill="white" stroke="black" stroke-width="4"/>
    <!-- Steam outlines -->
    <path d="M300 680 Q 320 660 340 680 Q 360 660 380 680" fill="none" stroke="black" stroke-width="3"/>
    <path d="M420 685 Q 440 665 460 685 Q 480 665 500 685" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="370" cy="650" r="15" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="430" cy="640" r="12" fill="none" stroke="black" stroke-width="3"/>
  </g>

  <!-- Penguins -->
  <g id="penguins">
    <!-- Penguin 1 (left) -->
    <g transform="translate(300, 700)">
      <ellipse cx="0" cy="0" rx="40" ry="60" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <circle cx="0" cy="-60" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Head -->
      <circle cx="-15" cy="-65" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="15" cy="-65" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M-10 -50 L 0 -40 L 10 -50 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Beak -->
      <path d="M-40 -30 Q -60 -10 -40 10" fill="white" stroke="black" stroke-width="4"/> <!-- Left Wing -->
      <path d="M40 -30 Q 60 -10 40 10" fill="white" stroke="black" stroke-width="4"/> <!-- Right Wing -->
    </g>

    <!-- Penguin 2 (right) -->
    <g transform="translate(500, 720)">
      <ellipse cx="0" cy="0" rx="45" ry="65" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <circle cx="0" cy="-65" r="32" fill="white" stroke="black" stroke-width="4"/> <!-- Head -->
      <circle cx="-16" cy="-70" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="16" cy="-70" r="6" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M-12 -55 L 0 -45 L 12 -55 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Beak -->
      <path d="M-45 -35 Q -65 -15 -45 15" fill="white" stroke="black" stroke-width="4"/> <!-- Left Wing -->
      <path d="M45 -35 Q 65 -15 45 15" fill="white" stroke="black" stroke-width="4"/> <!-- Right Wing -->
    </g>
  </g>

  <!-- Simple Rocks -->
  <g id="rocks">
    <path d="M150 780 Q 180 750 200 780 Q 220 810 180 820 Q 140 810 150 780 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M600 700 Q 630 670 650 700 Q 670 730 630 740 Q 590 730 600 700 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Small Snowperson -->
  <g id="snowperson" transform="translate(100, 600)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="black" stroke-width="4"/> <!-- Bottom body -->
    <circle cx="0" cy="-60" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Middle body -->
    <circle cx="0" cy="-100" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Head -->
    <circle cx="-10" cy="-105" r="4" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
    <circle cx="10" cy="-105" r="4" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
    <path d="M-5 -95 L 0 -90 L 5 -95 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Nose -->
    <path d="M-30 -70 L -60 -80" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Left Arm -->
    <path d="M30 -70 L 60 -80" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- Right Arm -->
    <path d="M-20 -115 Q 0 -135 20 -115 L 20 -105 Q 0 -125 -20 -105 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Simple Hat (cone-like) -->
  </g>

</svg>