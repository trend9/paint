<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Dog in Astronaut Suit -->
  <g id="astronaut-dog">

    <!-- Helmet and Visor -->
    <g id="helmet-visor">
      <ellipse cx="400" cy="320" rx="130" ry="110" fill="white" stroke="black" stroke-width="5"/> <!-- Outer helmet -->
      <ellipse cx="400" cy="330" rx="100" ry="80" fill="white" stroke="black" stroke-width="4"/> <!-- Visor -->
    </g>

    <!-- Dog's Head inside Visor -->
    <g id="dog-head">
      <!-- Ears -->
      <path d="M340 280 C320 250 320 290 350 300 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left Ear -->
      <path d="M460 280 C480 250 480 290 450 300 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right Ear -->

      <circle cx="400" cy="330" r="60" fill="white" stroke="black" stroke-width="3"/> <!-- Face inside visor -->
      <circle cx="375" cy="315" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="425" cy="315" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <circle cx="400" cy="345" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Nose -->
      <path d="M380 365 Q400 380 420 365" fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->
    </g>

    <!-- Suit Body -->
    <ellipse cx="400" cy="580" rx="150" ry="200" fill="white" stroke="black" stroke-width="5"/>

    <!-- Arms -->
    <g id="arms">
      <!-- Left Arm -->
      <ellipse cx="270" cy="510" rx="35" ry="100" transform="rotate(-30 270 510)" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="210" cy="580" r="35" fill="white" stroke="black" stroke-width="5"/> <!-- Left Hand -->
      <!-- Right Arm -->
      <ellipse cx="530" cy="510" rx="35" ry="100" transform="rotate(30 530 510)" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="590" cy="580" r="35" fill="white" stroke="black" stroke-width="5"/> <!-- Right Hand -->
    </g>

    <!-- Legs -->
    <g id="legs">
      <!-- Left Leg -->
      <ellipse cx="330" cy="780" rx="40" ry="100" transform="rotate(-10 330 780)" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="290" cy="860" rx="50" ry="40" fill="white" stroke="black" stroke-width="5"/> <!-- Left Foot -->
      <!-- Right Leg -->
      <ellipse cx="470" cy="780" rx="40" ry="100" transform="rotate(10 470 780)" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="510" cy="860" rx="50" ry="40" fill="white" stroke="black" stroke-width="5"/> <!-- Right Foot -->
    </g>

    <!-- Backpack -->
    <rect x="350" y="460" width="100" height="150" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Space Elements -->
  <g id="space-elements">
    <!-- Planet (Saturn-like) 1 -->
    <g id="planet-saturn-1">
      <circle cx="150" cy="850" r="80" fill="white" stroke="black" stroke-width="4"/> <!-- Planet body -->
      <ellipse cx="150" cy="850" rx="110" ry="25" transform="rotate(-15 150 850)" fill="none" stroke="black" stroke-width="4"/> <!-- Ring -->
    </g>

    <!-- Planet (Saturn-like) 2 -->
    <g id="planet-saturn-2">
      <circle cx="700" cy="150" r="60" fill="white" stroke="black" stroke-width="4"/> <!-- Planet body -->
      <ellipse cx="700" cy="150" rx="90" ry="20" transform="rotate(10 700 150)" fill="none" stroke="black" stroke-width="4"/> <!-- Ring -->
    </g>

    <!-- Stars - Simple 5-point shapes for toddler coloring -->
    <g id="stars">
      <path d="M100 100 L110 120 L130 125 L110 130 L100 150 L90 130 L70 125 L90 120 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M650 300 L660 320 L680 325 L660 330 L650 350 L640 330 L620 325 L640 320 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M200 600 L210 620 L230 625 L210 630 L200 650 L190 630 L170 625 L190 620 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M750 700 L760 720 L780 725 L760 730 L750 750 L740 730 L720 725 L740 720 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M50 400 L60 420 L80 425 L60 430 L50 450 L40 430 L20 425 L40 420 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M500 80 L510 100 L530 105 L510 110 L500 130 L490 110 L470 105 L490 100 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M300 150 L310 170 L330 175 L310 180 L300 200 L290 180 L270 175 L290 170 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M100 700 L110 720 L130 725 L110 730 L100 750 L90 730 L70 725 L90 720 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M700 450 L710 470 L730 475 L710 480 L700 500 L690 480 L670 475 L690 470 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M400 900 L410 920 L430 925 L410 930 L400 950 L390 930 L370 925 L390 920 Z" fill="white" stroke="black" stroke-width="3"/>
    </g>
  </g>
</svg>