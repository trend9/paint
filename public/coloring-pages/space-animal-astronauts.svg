<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <g id="background_elements">
    <!-- Friendly Planet -->
    <g id="planet">
      <circle cx="650" cy="850" r="120" fill="white" stroke="black" stroke-width="4"/>
      <!-- Planet Ring -->
      <ellipse cx="650" cy="850" rx="180" ry="40" transform="rotate(-15 650 850)" fill="none" stroke="black" stroke-width="4"/>
      <ellipse cx="650" cy="850" rx="190" ry="50" transform="rotate(-15 650 850)" fill="none" stroke="black" stroke-width="4"/>
    </g>
    <!-- Simple Stars -->
    <g id="stars">
      <circle cx="100" cy="150" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="200" cy="50" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="50" cy="400" r="12" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="700" cy="100" r="18" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="750" cy="450" r="14" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="350" cy="80" r="11" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="180" cy="700" r="16" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="600" cy="700" r="9" fill="white" stroke="black" stroke-width="3"/>
    </g>
  </g>

  <!-- Animal Astronaut -->
  <g id="animal_astronaut">
    <!-- Spacesuit Body -->
    <rect x="300" y="450" width="200" height="250" rx="80" ry="80" fill="white" stroke="black" stroke-width="5"/>
    
    <!-- Spacesuit Arms -->
    <rect x="190" y="470" width="120" height="70" rx="35" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <rect x="490" y="470" width="120" height="70" rx="35" ry="35" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Spacesuit Hands/Gloves -->
    <circle cx="200" cy="540" r="40" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="600" cy="540" r="40" fill="white" stroke="black" stroke-width="4"/>

    <!-- Spacesuit Legs -->
    <rect x="320" y="680" width="70" height="120" rx="35" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <rect x="410" y="680" width="70" height="120" rx="35" ry="35" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Spacesuit Feet/Boots -->
    <ellipse cx="355" cy="800" rx="50" ry="30" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="445" cy="800" rx="50" ry="30" fill="white" stroke="black" stroke-width="4"/>

    <!-- Helmet -->
    <circle cx="400" cy="350" r="130" fill="white" stroke="black" stroke-width="5"/>
    <!-- Visor -->
    <ellipse cx="400" cy="350" rx="100" ry="80" fill="white" stroke="black" stroke-width="4"/>

    <!-- Animal Face inside helmet -->
    <g id="animal_face">
      <!-- Head shape (simplified) -->
      <circle cx="400" cy="360" r="60" fill="white" stroke="black" stroke-width="3"/>
      <!-- Ears -->
      <circle cx="340" cy="295" r="25" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="460" cy="295" r="25" fill="white" stroke="black" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="370" cy="345" r="10" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="430" cy="345" r="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Nose -->
      <ellipse cx="400" cy="375" rx="15" ry="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Mouth (smile) -->
      <path d="M375 395 Q400 410 425 395" fill="none" stroke="black" stroke-width="3"/>
    </g>
  </g>
</svg>