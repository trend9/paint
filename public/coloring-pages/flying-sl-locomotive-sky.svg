<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
    <!-- Overall border for the coloring page -->
    <rect x="0" y="0" width="800" height="1000" fill="none" stroke="black" stroke-width="5"/>

    <!-- Background clouds -->
    <g id="background_clouds" stroke="black" stroke-width="5" fill="white">
        <!-- Cloud 1 -->
        <path d="M100 200 Q150 150, 200 200 Q250 250, 200 300 Q150 350, 100 300 Q50 250, 100 200 Z"/>
        <!-- Cloud 2 -->
        <path d="M600 150 Q650 100, 700 150 Q750 200, 700 250 Q650 300, 600 250 Q550 200, 600 150 Z"/>
        <!-- Cloud 3 -->
        <path d="M250 800 Q300 750, 350 800 Q400 850, 350 900 Q300 950, 250 900 Q200 850, 250 800 Z"/>
        <!-- Cloud 4 -->
        <path d="M600 750 Q650 700, 700 750 Q750 800, 700 850 Q650 900, 600 850 Q550 800, 600 750 Z"/>
    </g>

    <!-- Locomotive and smoke group, slightly rotated for flying effect -->
    <g id="locomotive_and_smoke" transform="translate(400,500) rotate(-5) translate(-400,-500)">
        <!-- Locomotive body parts -->
        <g id="locomotive_body" stroke="black" stroke-width="5" fill="white">
            <!-- Main body (boiler and base) -->
            <rect x="250" y="480" width="300" height="120" rx="30" ry="30"/>

            <!-- Front of Boiler (round part) -->
            <circle cx="250" cy="540" r="60"/>

            <!-- Cabin -->
            <rect x="450" y="400" width="100" height="80" rx="20" ry="20"/>

            <!-- Chimney -->
            <rect x="300" y="380" width="50" height="70" rx="10" ry="10"/>
            <ellipse cx="325" cy="380" rx="35" ry="15"/> <!-- chimney top -->

            <!-- Wheels -->
            <circle cx="320" cy="650" r="50"/>
            <circle cx="480" cy="650" r="50"/>
            <!-- Wheel hubs (thinner stroke for inner detail) -->
            <circle cx="320" cy="650" r="15" stroke-width="3"/>
            <circle cx="480" cy="650" r="15" stroke-width="3"/>

            <!-- Cowcatcher (front plow) -->
            <path d="M250 600 L300 650 L300 600 Z"/>

            <!-- Face on the front boiler -->
            <g id="face">
                <!-- Eyes -->
                <circle cx="225" cy="520" r="25"/>
                <circle cx="275" cy="520" r="25"/>
                <!-- Pupils (thinner stroke for inner detail) -->
                <circle cx="225" cy="520" r="8" stroke-width="3"/>
                <circle cx="275" cy="520" r="8" stroke-width="3"/>

                <!-- Smile -->
                <path d="M225 550 Q250 580, 275 550" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
            </g>

            <!-- Wings -->
            <g id="wings">
                <!-- Left Wing -->
                <path d="M250 540 C200 460, 100 460, 100 540 C100 620, 200 620, 250 540 Z"/>
                <!-- Right Wing -->
                <path d="M550 540 C600 460, 700 460, 700 540 C700 620, 600 620, 550 540 Z"/>
            </g>
        </g>

        <!-- Smoke puffs from the chimney -->
        <g id="smoke" stroke="black" stroke-width="5" fill="white">
            <!-- Puff 1 -->
            <path d="M325 350 C305 310, 345 310, 365 350 C385 390, 345 400, 325 350 Z"/>
            <!-- Puff 2 -->
            <path d="M330 300 C310 260, 360 240, 390 280 C420 320, 360 330, 330 300 Z"/>
            <!-- Puff 3 -->
            <path d="M380 230 C360 190, 420 170, 450 210 C480 250, 420 260, 380 230 Z"/>
            <!-- Puff 4 -->
            <path d="M420 170 C400 130, 470 110, 500 150 C530 190, 480 200, 420 170 Z"/>
        </g>
    </g>
</svg>