<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1000" fill="white" />

  <!-- Main coloring book style group with thick black outlines and white fills -->
  <g stroke="black" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="white">
    
    <!-- Background Elements -->
    <!-- Top Left Cloud -->
    <g transform="translate(140, 180)">
      <path d="M -50 20 C -70 20, -70 -10, -50 -20 C -60 -50, 0 -50, 20 -30 C 40 -50, 80 -35, 70 -10 C 90 -10, 90 20, 70 20 Z" />
    </g>
    
    <!-- Top Right Cloud -->
    <g transform="translate(660, 220) scale(0.8)">
      <path d="M -50 20 C -70 20, -70 -10, -50 -20 C -60 -50, 0 -50, 20 -30 C 40 -50, 80 -35, 70 -10 C 90 -10, 90 20, 70 20 Z" />
    </g>

    <!-- Floating Sparkles & Stars in Sky -->
    <path d="M 280 140 Q 280 150 290 150 Q 280 150 280 160 Q 280 150 270 150 Q 280 150 280 140" />
    <path d="M 520 130 Q 520 140 530 140 Q 520 140 520 150 Q 520 140 510 140 Q 520 140 520 130" />
    <path d="M 680 380 Q 680 390 690 390 Q 680 390 680 400 Q 680 390 670 390 Q 680 390 680 380" />
    <path d="M 110 420 Q 110 430 120 430 Q 110 430 110 440 Q 110 430 100 430 Q 110 430 110 420" />

    <!-- Cute Floating Bubbles -->
    <circle cx="230" cy="240" r="14" />
    <circle cx="200" cy="270" r="8" />
    <circle cx="580" cy="180" r="12" />
    <circle cx="610" cy="150" r="7" />
    <circle cx="480" cy="110" r="16" />

    <!-- Huge Fluffy Cloud at the Bottom -->
    <path d="M 150 720 C 100 720, 80 640, 130 600 C 100 500, 220 460, 270 510 C 320 520, 480 520, 530 510 C 580 460, 700 500, 670 600 C 720 640, 700 720, 650 720 C 600 760, 500 770, 400 770 C 300 770, 200 760, 150 720 Z" />
    
    <!-- Cloud Fluff Details -->
    <path d="M 170 630 Q 195 645 220 630" stroke-width="5" fill="none" />
    <path d="M 580 630 Q 605 645 630 630" stroke-width="5" fill="none" />
    <path d="M 285 545 Q 305 560 330 550" stroke-width="5" fill="none" />
    <path d="M 470 550 Q 495 560 515 545" stroke-width="5" fill="none" />

    <!-- Unicorn Tail (Puffy Layers) -->
    <ellipse cx="530" cy="620" rx="45" ry="30" transform="rotate(20 530 620)" />
    <ellipse cx="560" cy="660" rx="50" ry="35" transform="rotate(10 560 660)" />
    <ellipse cx="520" cy="690" rx="40" ry="28" transform="rotate(-10 520 690)" />

    <!-- Unicorn Body -->
    <path d="M 350 460 C 300 520, 280 660, 400 670 C 520 660, 500 520, 450 460 Z" />

    <!-- Unicorn Hind Legs & Hooves (Sitting Position) -->
    <!-- Left Leg Group -->
    <g transform="translate(290, 645) rotate(-10)">
      <ellipse cx="0" cy="0" rx="48" ry="35" />
      <path d="M -35 -10 Q 0 15 35 -10" stroke-width="6" fill="none" />
    </g>
    <!-- Right Leg Group -->
    <g transform="translate(510, 645) rotate(10)">
      <ellipse cx="0" cy="0" rx="48" ry="35" />
      <path d="M -35 -10 Q 0 15 35 -10" stroke-width="6" fill="none" />
    </g>

    <!-- Starry Cookie on the Cloud -->
    <g transform="translate(190, 675) rotate(-15)">
      <path d="M 0 -45 L 12 -12 L 45 -12 L 18 8 L 28 41 L 0 20 L -28 41 L -18 8 L -45 -12 L -12 -12 Z" stroke-linejoin="round" />
      <!-- Sprinkles -->
      <circle cx="-10" cy="-5" r="3" fill="black" stroke="none" />
      <circle cx="12" cy="5" r="3" fill="black" stroke="none" />
      <circle cx="-5" cy="18" r="3" fill="black" stroke="none" />
      <circle cx="5" cy="-20" r="3" fill="black" stroke="none" />
    </g>

    <!-- Donut on the Cloud -->
    <g transform="translate(610, 675) rotate(15)">
      <ellipse cx="0" cy="0" rx="48" ry="38" />
      <ellipse cx="0" cy="0" rx="16" ry="12" />
      <!-- Glaze outline -->
      <path d="M -38 -10 C -30 -5, -20 -15, 0 -10 C 20 -5, 30 -15, 38 -10 C 42 15, 25 30, 0 30 C -25 30, -42 15, -38 -10 Z" stroke-width="5" fill="none" />
      <!-- Sprinkles -->
      <rect x="-20" y="10" width="10" height="4" rx="2" transform="rotate(30 -20 10)" fill="black" stroke="none" />
      <rect x="15" y="12" width="10" height="4" rx="2" transform="rotate(-15 15 12)" fill="black" stroke="none" />
      <rect x="20" y="-12" width="10" height="4" rx="2" transform="rotate(45 20 -12)" fill="black" stroke="none" />
      <rect x="-25" y="-10" width="10" height="4" rx="2" transform="rotate(-40 -25 -10)" fill="black" stroke="none" />
    </g>

    <!-- Giant Cupcake held by Unicorn -->
    <!-- Cupcake Liner -->
    <path d="M 375 590 Q 400 593 425 590 Q 435 590 438 545 Q 400 540 362 545 Q 365 590 375 590 Z" />
    <!-- Liner Folds -->
    <path d="M 385 590 L 380 543" stroke-width="5" fill="none" />
    <path d="M 400 591 L 400 542" stroke-width="5" fill="none" />
    <path d="M 415 590 L 420 543" stroke-width="5" fill="none" />

    <!-- Cupcake Frosting (Puffy layers) -->
    <ellipse cx="375" cy="525" rx="25" ry="20" />
    <ellipse cx="425" cy="525" rx="25" ry="20" />
    <ellipse cx="400" cy="505" rx="35" ry="28" />
    
    <!-- Star Sprinkle on Frosting -->
    <path d="M 400 495 Q 400 500 405 500 Q 400 500 400 505 Q 400 500 395 500 Q 400 500 400 495" stroke-width="3" />

    <!-- Cherry on Top -->
    <circle cx="400" cy="470" r="12" />
    <path d="M 400 458 Q 410 440 425 445" stroke-width="5" fill="none" />

    <!-- Unicorn Arms & Hooves (Holding Cupcake) -->
    <!-- Left Arm Group -->
    <g transform="translate(335, 545) rotate(25)">
      <ellipse cx="0" cy="0" rx="35" ry="22" />
      <path d="M 15 -18 Q 0 0 15 18" stroke-width="6" fill="none" />
    </g>
    <!-- Right Arm Group -->
    <g transform="translate(465, 545) rotate(-25)">
      <ellipse cx="0" cy="0" rx="35" ry="22" />
      <path d="M -15 -18 Q 0 0 -15 18" stroke-width="6" fill="none" />
    </g>

    <!-- Unicorn Head -->
    <ellipse cx="400" cy="370" rx="100" ry="90" />

    <!-- Unicorn Mane (Puffy Side Locks) -->
    <ellipse cx="300" cy="450" rx="35" ry="25" transform="rotate(-30 300 450)" />
    <ellipse cx="280" cy="510" rx="40" ry="28" transform="rotate(-20 280 510)" />
    <ellipse cx="285" cy="570" rx="35" ry="25" transform="rotate(-10 285 570)" />

    <!-- Unicorn Ears -->
    <!-- Left Ear -->
    <path d="M 330 290 C 290 240, 290 180, 335 180 C 350 180, 355 230, 350 280 Z" />
    <path d="M 332 270 C 310 230, 310 200, 335 200 C 342 200, 345 230, 345 270" stroke-width="5" fill="none" />
    <!-- Right Ear -->
    <path d="M 470 290 C 510 240, 510 180, 465 180 C 450 180, 445 230, 450 280 Z" />
    <path d="M 468 270 C 490 230, 490 200, 465 200 C 458 200, 455 230, 455 270" stroke-width="5" fill="none" />

    <!-- Unicorn Horn (Magical Spiral) -->
    <path d="M 385 285 L 400 140 L 415 285 Z" />
    <!-- Horn Ridges -->
    <path d="M 388 250 Q 400 258 412 250" stroke-width="5" fill="none" />
    <path d="M 391 220 Q 400 228 409 220" stroke-width="5" fill="none" />
    <path d="M 394 190 Q 400 198 406 190" stroke-width="5" fill="none" />
    <path d="M 397 160 Q 400 166 403 160" stroke-width="5" fill="none" />

    <!-- Unicorn Mane (Puffy Bangs in front of Horn) -->
    <ellipse cx="370" cy="275" rx="20" ry="15" transform="rotate(-10 370 275)" />
    <ellipse cx="430" cy="275" rx="20" ry="15" transform="rotate(10 430 275)" />
    <ellipse cx="400" cy="270" rx="25" ry="18" />

    <!-- Unicorn Muzzle & Happy Mouth -->
    <ellipse cx="400" cy="425" rx="65" ry="35" />
    <path d="M 385 425 Q 400 440 415 425" stroke-width="8" fill="none" />
    <!-- Nostrils -->
    <path d="M 375 415 Q 380 410 385 415" stroke-width="5" fill="none" />
    <path d="M 415 415 Q 420 410 425 415" stroke-width="5" fill="none" />

    <!-- Unicorn Eyes (Big, Cute & Expressive) -->
    <!-- Left Eye -->
    <circle cx="340" cy="350" r="22" stroke-width="8" />
    <circle cx="340" cy="350" r="11" fill="black" stroke="none" />
    <circle cx="335" cy="344" r="5" fill="white" stroke="none" />
    <circle cx="345" cy="354" r="2.5" fill="white" stroke="none" />
    
    <!-- Right Eye -->
    <circle cx="460" cy="350" r="22" stroke-width="8" />
    <circle cx="460" cy="350" r="11" fill="black" stroke="none" />
    <circle cx="455" cy="344" r="5" fill="white" stroke="none" />
    <circle cx="465" cy="354" r="2.5" fill="white" stroke="none" />

    <!-- Cute Eyelashes -->
    <path d="M 318 348 Q 310 345 305 350" stroke-width="6" fill="none" />
    <path d="M 320 356 Q 312 358 308 365" stroke-width="6" fill="none" />
    <path d="M 482 348 Q 490 345 495 350" stroke-width="6" fill="none" />
    <path d="M 480 356 Q 488 358 492 365" stroke-width="6" fill="none" />

    <!-- Rosy Cheek Blush Circles -->
    <ellipse cx="305" cy="395" rx="15" ry="10" stroke-width="4" />
    <ellipse cx="495" cy="395" rx="15" ry="10" stroke-width="4" />

  </g>
</svg>