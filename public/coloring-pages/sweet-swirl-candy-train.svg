<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-no-fill {
        stroke: black;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Ground / Base -->
  <path class="outline" d="M0 800 Q200 750 400 800 T800 780 V1000 H0 Z"/>

  <!-- Landscape Elements -->
  <!-- Gingerbread House 1 (left) -->
  <g id="gingerbread-house-1" transform="translate(100, 600)">
    <rect x="0" y="0" width="150" height="120" rx="15" ry="15" class="outline"/>
    <path d="M-15 100 L75 -30 L165 100 Z" class="outline"/> <!-- Roof -->
    <rect x="55" y="60" width="40" height="60" rx="5" ry="5" class="outline"/> <!-- Door -->
    <circle cx="75" cy="80" r="5" class="outline"/> <!-- Doorknob -->
    <rect x="20" y="20" width="40" height="40" rx="5" ry="5" class="outline"/> <!-- Window -->
    <rect x="90" y="20" width="40" height="40" rx="5" ry="5" class="outline"/> <!-- Window -->
  </g>

  <!-- Giant Cupcake 1 (middle-left) -->
  <g id="cupcake-1" transform="translate(300, 650)">
    <ellipse cx="0" cy="0" rx="90" ry="60" class="outline"/> <!-- Top cake -->
    <path d="M-90 0 C-100 50 -80 80 -60 80 L60 80 C80 80 100 50 90 0 Z" class="outline"/> <!-- Liner -->
    <circle cx="0" cy="-45" r="20" class="outline"/> <!-- Cherry -->
    <path d="M-90 0 C-70 10 -30 15 0 10 C30 5 70 10 90 0" class="outline-no-fill"/> <!-- Wrinkles on liner -->
    <path d="M-70 20 C-50 30 -20 35 0 30 C20 25 50 30 70 20" class="outline-no-fill"/>
  </g>

  <!-- Gingerbread House 2 (background right) -->
  <g id="gingerbread-house-2" transform="translate(550, 580) scale(0.8)">
    <rect x="0" y="0" width="150" height="120" rx="15" ry="15" class="outline"/>
    <path d="M-15 100 L75 -30 L165 100 Z" class="outline"/> <!-- Roof -->
    <rect x="55" y="60" width="40" height="60" rx="5" ry="5" class="outline"/> <!-- Door -->
    <rect x="20" y="20" width="40" height="40" rx="5" ry="5" class="outline"/> <!-- Window -->
  </g>

  <!-- Candy Train -->
  <g id="candy-train" transform="translate(150, 400)">
    <!-- Main Body - Chocolate Bar Section -->
    <rect x="100" y="0" width="350" height="150" rx="20" ry="20" class="outline"/>
    <!-- Chocolate bar segments -->
    <line x1="170" y1="10" x2="170" y2="140" class="outline-no-fill"/>
    <line x1="240" y1="10" x2="240" y2="140" class="outline-no-fill"/>
    <line x1="310" y1="10" x2="310" y2="140" class="outline-no-fill"/>
    <line x1="380" y1="10" x2="380" y2="140" class="outline-no-fill"/>

    <!-- Swirl candy decorations on body -->
    <g transform="translate(135, 75)">
      <circle cx="0" cy="0" r="25" class="outline"/>
      <path d="M-20 0 Q-10 -10 0 0 Q10 10 20 0" class="outline-no-fill"/>
      <path d="M0 -20 Q10 -10 0 0 Q-10 10 0 20" class="outline-no-fill"/>
    </g>
    <g transform="translate(415, 75)">
      <circle cx="0" cy="0" r="25" class="outline"/>
      <path d="M-20 0 Q-10 -10 0 0 Q10 10 20 0" class="outline-no-fill"/>
      <path d="M0 -20 Q10 -10 0 0 Q-10 10 0 20" class="outline-no-fill"/>
    </g>

    <!-- Locomotive Front - Lollipop / Swirl -->
    <g transform="translate(80, 75)">
      <circle cx="0" cy="0" r="70" class="outline"/> <!-- Main lollipop body -->
      <path d="M0 -70 Q30 -40 0 0 Q-30 40 0 70" class="outline-no-fill"/>
      <path d="M0 -70 Q-30 -40 0 0 Q30 40 0 70" class="outline-no-fill"/>
      <path d="M-60 -30 Q-20 -10 0 0 Q20 10 60 30" class="outline-no-fill"/>
      <path d="M-60 30 Q-20 10 0 0 Q20 -10 60 -30" class="outline-no-fill"/>

      <!-- Happy face on lollipop -->
      <ellipse cx="-25" cy="-20" rx="10" ry="15" transform="rotate(15 -25 -20)" class="outline"/> <!-- Left eye -->
      <ellipse cx="25" cy="-20" rx="10" ry="15" transform="rotate(-15 25 -20)" class="outline"/> <!-- Right eye -->
      <path d="M-30 20 Q0 50 30 20" class="outline-no-fill"/> <!-- Mouth -->
    </g>

    <!-- Cabin -->
    <rect x="350" y="-80" width="100" height="150" rx="15" ry="15" class="outline"/>
    <rect x="360" y="-60" width="80" height="80" rx="10" ry="10" class="outline"/> <!-- Window -->

    <!-- Smokestack -->
    <rect x="190" y="-100" width="40" height="120" rx="10" ry="10" class="outline"/>
    <!-- Smokestack cap -->
    <rect x="170" y="-120" width="80" height="30" rx="10" ry="10" class="outline"/>

    <!-- Cotton Candy Smoke -->
    <g id="smoke" transform="translate(210, -110)">
      <circle cx="0" cy="-30" r="40" class="outline"/>
      <circle cx="40" cy="-50" r="30" class="outline"/>
      <circle cx="-30" cy="-60" r="35" class="outline"/>
      <circle cx="20" cy="-70" r="45" class="outline"/>
      <circle cx="60" cy="-80" r="30" class="outline"/>
    </g>

    <!-- Wheels - Lollipop Wheels -->
    <g id="wheels">
      <!-- Front wheel -->
      <circle cx="160" cy="180" r="60" class="outline"/>
      <circle cx="160" cy="180" r="20" class="outline"/>
      <path d="M160 120 V240 M100 180 H220" class="outline-no-fill"/>

      <!-- Middle wheel -->
      <circle cx="300" cy="180" r="60" class="outline"/>
      <circle cx="300" cy="180" r="20" class="outline"/>
      <path d="M300 120 V240 M240 180 H360" class="outline-no-fill"/>

      <!-- Back wheel -->
      <circle cx="440" cy="180" r="60" class="outline"/>
      <circle cx="440" cy="180" r="20" class="outline"/>
      <path d="M440 120 V240 M380 180 H500" class="outline-no-fill"/>
    </g>

  </g>

  <!-- Giant Cupcake 2 (right) -->
  <g id="cupcake-2" transform="translate(680, 680)">
    <ellipse cx="0" cy="0" rx="70" ry="50" class="outline"/> <!-- Top cake -->
    <path d="M-70 0 C-80 40 -60 70 -40 70 L40 70 C60 70 80 40 70 0 Z" class="outline"/> <!-- Liner -->
    <circle cx="0" cy="-35" r="15" class="outline"/> <!-- Cherry -->
    <path d="M-70 0 C-55 8 -25 12 0 8 C25 4 55 8 70 0" class="outline-no-fill"/> <!-- Wrinkles on liner -->
  </g>

</svg>