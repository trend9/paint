<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Define a reusable snowflake shape -->
    <path id="snowflake" fill="white" stroke="black" stroke-width="5" d="M 0 -18 L 6 -6 L 18 0 L 6 6 L 0 18 L -6 6 L -18 0 L -6 -6 Z"/>
  </defs>

  <!-- Snowy ground area -->
  <g id="ground" fill="white" stroke="black" stroke-width="5">
    <path d="M 0 600 Q 100 620 200 600 Q 300 580 400 600 Q 500 620 600 600 Q 700 580 800 600 L 800 1000 L 0 1000 Z"/>
  </g>

  <!-- Snow-covered mountains in the background -->
  <g id="mountains" fill="white" stroke="black" stroke-width="5">
    <path d="M 0 500 L 0 400 Q 100 250 200 350 L 300 200 Q 400 100 500 200 L 600 350 Q 700 250 800 400 L 800 500 Z"/>
  </g>

  <!-- Hot Spring -->
  <g id="hot-spring" fill="white" stroke="black" stroke-width="5">
    <!-- Outer edge of the hot spring (snow/rocky border) -->
    <path d="M 100 750 Q 150 650 400 620 Q 650 650 700 750 Q 650 850 400 880 Q 150 850 100 750 Z"/>
    <!-- Water surface -->
    <ellipse cx="400" cy="750" rx="270" ry="110"/>
  </g>

  <!-- Cute happy penguins relaxing in the hot spring -->
  <g id="penguins" fill="white" stroke="black" stroke-width="5">
    <!-- Penguin 1 (left) -->
    <g transform="translate(320, 750)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="60" ry="80"/>
      <!-- Head -->
      <circle cx="0" cy="-85" r="45"/>
      <!-- Belly (inner white part) -->
      <ellipse cx="0" cy="10" rx="40" ry="70"/>
      <!-- Eyes -->
      <circle cx="-15" cy="-95" r="5"/>
      <circle cx="15" cy="-95" r="5"/>
      <!-- Beak -->
      <path d="M -10 -80 L 0 -65 L 10 -80 Z"/>
      <!-- Wings -->
      <path d="M -60 -20 Q -80 -50 -40 -70 S 20 -50 -40 -20 Z"/>
      <path d="M 60 -20 Q 80 -50 40 -70 S -20 -50 40 -20 Z"/>
    </g>

    <!-- Penguin 2 (right) -->
    <g transform="translate(480, 750)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="60" ry="80"/>
      <!-- Head -->
      <circle cx="0" cy="-85" r="45"/>
      <!-- Belly -->
      <ellipse cx="0" cy="10" rx="40" ry="70"/>
      <!-- Eyes -->
      <circle cx="-15" cy="-95" r="5"/>
      <circle cx="15" cy="-95" r="5"/>
      <!-- Beak -->
      <path d="M -10 -80 L 0 -65 L 10 -80 Z"/>
      <!-- Wings -->
      <path d="M -60 -20 Q -80 -50 -40 -70 S 20 -50 -40 -20 Z"/>
      <path d="M 60 -20 Q 80 -50 40 -70 S -20 -50 40 -20 Z"/>
    </g>
  </g>

  <!-- Steam rising from the water -->
  <g id="steam" fill="none" stroke="black" stroke-width="5">
    <path d="M 200 620 Q 230 550 260 620 Q 290 550 320 620"/>
    <path d="M 350 600 Q 380 530 410 600 Q 440 530 470 600"/>
    <path d="M 500 620 Q 530 550 560 620 Q 590 550 620 620"/>
  </g>

  <!-- Stylized snowflakes falling -->
  <g id="snowflakes">
    <use href="#snowflake" transform="translate(100, 100) scale(0.8)"/>
    <use href="#snowflake" transform="translate(250, 50) scale(0.7)"/>
    <use href="#snowflake" transform="translate(400, 120) scale(0.9)"/>
    <use href="#snowflake" transform="translate(550, 70) scale(0.6)"/>
    <use href="#snowflake" transform="translate(700, 150) scale(0.8)"/>
    <use href="#snowflake" transform="translate(150, 400) scale(0.7)"/>
    <use href="#snowflake" transform="translate(300, 450) scale(0.9)"/>
    <use href="#snowflake" transform="translate(600, 420) scale(0.6)"/>
  </g>
</svg>