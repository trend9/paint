<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Main group for the entire scene, setting default stroke properties -->
  <g stroke="black" stroke-linecap="round" stroke-linejoin="round">

    <!-- Coral Reef Base - highly simplified organic shapes -->
    <g id="coral-reef">
      <path d="M100 950 Q 50 850 150 750 T 250 650 Q 300 600 350 700 Q 400 800 450 750 Q 500 700 550 750 Q 600 800 650 700 Q 700 600 750 750 Q 780 850 700 950 Z" fill="white" stroke-width="5"/>

      <!-- Smaller coral branches / polyps -->
      <path d="M180 700 Q 150 650 180 600 Q 210 550 180 500 Q 150 450 180 400" fill="none" stroke-width="4"/>
      <path d="M220 720 Q 200 680 220 640 Q 240 600 220 560" fill="none" stroke-width="4"/>
      <path d="M380 680 Q 350 630 380 580 Q 410 530 380 480 Q 350 430 380 380" fill="none" stroke-width="4"/>
      <path d="M420 700 Q 400 650 420 600 Q 440 550 420 500" fill="none" stroke-width="4"/>
      <path d="M580 720 Q 550 670 580 620 Q 610 570 580 520 Q 550 470 580 420" fill="none" stroke-width="4"/>
      <path d="M620 740 Q 600 690 620 640 Q 640 590 620 540" fill="none" stroke-width="4"/>

      <!-- Seaweed or soft coral elements -->
      <path d="M100 950 C 120 850 100 750 150 700 C 180 650 160 600 200 550" fill="none" stroke-width="4"/>
      <path d="M700 950 C 680 850 700 750 650 700 C 620 650 640 600 600 550" fill="none" stroke-width="4"/>
    </g>

    <!-- Gentle Sea Turtle -->
    <g id="sea-turtle" transform="translate(100 100)">
      <!-- Shell -->
      <ellipse cx="400" cy="400" rx="150" ry="120" fill="white" stroke-width="5"/>
      <!-- Head -->
      <path d="M400 400 L400 300 C 400 250 450 200 500 250 C 550 300 550 350 500 400 Z" fill="white" stroke-width="5"/>
      <!-- Eyes - white fill with black outline for coloring -->
      <circle cx="480" cy="280" r="15" fill="white" stroke-width="5"/> <!-- Eyeball outline -->
      <circle cx="480" cy="280" r="8" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
      <!-- Smile -->
      <path d="M470 330 Q 490 350 510 330" fill="none" stroke-width="3"/>
      <!-- Fins -->
      <path d="M300 400 C 250 350 200 400 250 450 C 300 500 350 450 300 400 Z" fill="white" stroke-width="5"/> <!-- Left Front Fin -->
      <path d="M500 400 C 550 350 600 400 550 450 C 500 500 450 450 500 400 Z" fill="white" stroke-width="5"/> <!-- Right Front Fin -->
      <path d="M320 480 C 280 500 250 550 280 580 C 310 610 340 580 320 480 Z" fill="white" stroke-width="5"/> <!-- Left Back Fin -->
      <path d="M480 480 C 520 500 550 550 520 580 C 490 610 460 580 480 480 Z" fill="white" stroke-width="5"/> <!-- Right Back Fin -->
    </g>

    <!-- Friendly Small Crab -->
    <g id="small-crab" transform="translate(450 800)">
      <!-- Body -->
      <ellipse cx="100" cy="50" rx="60" ry="40" fill="white" stroke-width="5"/>
      <!-- Eyes - white fill with black outline for coloring -->
      <circle cx="80" cy="20" r="15" fill="white" stroke-width="3"/> <!-- Eyeball outline -->
      <circle cx="80" cy="20" r="8" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
      <circle cx="120" cy="20" r="15" fill="white" stroke-width="3"/> <!-- Eyeball outline -->
      <circle cx="120" cy="20" r="8" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
      <!-- Smile -->
      <path d="M90 60 Q 100 70 110 60" fill="none" stroke-width="3"/>
      <!-- Claws -->
      <path d="M40 50 C 20 30 10 40 10 60 C 10 80 20 90 40 70 L 50 60 Z" fill="white" stroke-width="5"/>
      <path d="M160 50 C 180 30 190 40 190 60 C 190 80 180 90 160 70 L 150 60 Z" fill="white" stroke-width="5"/>
      <!-- Legs -->
      <path d="M50 80 L 30 100" fill="none" stroke-width="4"/>
      <path d="M60 85 L 40 105" fill="none" stroke-width="4"/>
      <path d="M140 85 L 160 105" fill="none" stroke-width="4"/>
      <path d="M150 80 L 170 100" fill="none" stroke-width="4"/>
    </g>

    <!-- Cute Happy Tropical Fish - various sizes -->
    <g id="tropical-fish">
      <!-- Fish 1 (Large) -->
      <g transform="translate(100 300)">
        <ellipse cx="150" cy="100" rx="80" ry="50" fill="white" stroke-width="5"/> <!-- Body -->
        <path d="M230 100 Q 260 80 250 100 Q 260 120 230 100 Z" fill="white" stroke-width="5"/> <!-- Tail -->
        <path d="M150 50 C 160 30 170 40 160 50 Z" fill="white" stroke-width="4"/> <!-- Top Fin -->
        <path d="M150 150 C 160 170 170 160 160 150 Z" fill="white" stroke-width="4"/> <!-- Bottom Fin -->
        <circle cx="120" cy="90" r="12" fill="white" stroke-width="4"/> <!-- Eyeball outline -->
        <circle cx="120" cy="90" r="6" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
        <path d="M100 110 Q 110 120 120 110" fill="none" stroke-width="3"/> <!-- Smile -->
      </g>

      <!-- Fish 2 (Medium) -->
      <g transform="translate(500 200)">
        <ellipse cx="100" cy="100" rx="60" ry="40" fill="white" stroke-width="4"/> <!-- Body -->
        <path d="M160 100 Q 180 85 175 100 Q 180 115 160 100 Z" fill="white" stroke-width="4"/> <!-- Tail -->
        <path d="M100 60 C 105 50 110 55 105 60 Z" fill="white" stroke-width="3"/> <!-- Top Fin -->
        <path d="M100 140 C 105 150 110 145 105 140 Z" fill="white" stroke-width="3"/> <!-- Bottom Fin -->
        <circle cx="80" cy="90" r="10" fill="white" stroke-width="3"/> <!-- Eyeball outline -->
        <circle cx="80" cy="90" r="5" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
        <path d="M70 105 Q 80 112 90 105" fill="none" stroke-width="3"/> <!-- Smile -->
      </g>

      <!-- Fish 3 (Small) -->
      <g transform="translate(200 500)">
        <ellipse cx="70" cy="70" rx="40" ry="30" fill="white" stroke-width="4"/> <!-- Body -->
        <path d="M110 70 Q 120 60 118 70 Q 120 80 110 70 Z" fill="white" stroke-width="4"/> <!-- Tail -->
        <path d="M70 40 C 73 35 76 38 73 40 Z" fill="white" stroke-width="3"/> <!-- Top Fin -->
        <path d="M70 100 C 73 105 76 102 73 100 Z" fill="white" stroke-width="3"/> <!-- Bottom Fin -->
        <circle cx="60" cy="65" r="8" fill="white" stroke-width="3"/> <!-- Eyeball outline -->
        <circle cx="60" cy="65" r="4" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
        <path d="M55 75 Q 60 80 65 75" fill="none" stroke-width="2"/> <!-- Smile -->
      </g>

      <!-- Fish 4 (Another Medium, different shape) -->
      <g transform="translate(600 400)">
        <path d="M70 70 Q 100 40 130 70 Q 100 100 70 70 Z" fill="white" stroke-width="4"/> <!-- Body (Rounded triangle-like) -->
        <path d="M130 70 Q 145 60 140 70 Q 145 80 130 70 Z" fill="white" stroke-width="4"/> <!-- Tail -->
        <path d="M100 40 C 105 30 110 35 105 40 Z" fill="white" stroke-width="3"/> <!-- Top Fin -->
        <circle cx="90" cy="60" r="9" fill="white" stroke-width="3"/> <!-- Eyeball outline -->
        <circle cx="90" cy="60" r="4.5" fill="white" stroke="black" stroke-width="2"/> <!-- Pupil outline -->
        <path d="M85 70 Q 90 75 95 70" fill="none" stroke-width="3"/> <!-- Smile -->
      </g>

    </g>

    <!-- Bubbles for added detail and movement -->
    <g id="bubbles">
      <circle cx="150" cy="200" r="20" fill="white" stroke-width="3"/>
      <circle cx="170" cy="180" r="10" fill="white" stroke-width="3"/>
      <circle cx="50" cy="300" r="15" fill="white" stroke-width="3"/>
      <circle cx="60" cy="280" r="8" fill="white" stroke-width="3"/>
      <circle cx="700" cy="150" r="25" fill="white" stroke-width="4"/>
      <circle cx="720" cy="130" r="12" fill="white" stroke-width="4"/>
      <circle cx="680" cy="110" r="8" fill="white" stroke-width="4"/>
      <circle cx="400" cy="100" r="18" fill="white" stroke-width="3"/>
      <circle cx="420" cy="80" r="9" fill="white" stroke-width="3"/>
    </g>

  </g>
</svg>