<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .outline-none {
        stroke: black;
        stroke-width: 4;
        fill: none;
      }
    </style>
  </defs>

  <!-- Ground -->
  <rect x="0" y="700" width="800" height="300" class="outline" />
  <path d="M0 720 Q100 680 200 700 T400 690 T600 710 T800 680 L800 700 L0 700 Z" class="outline" />

  <!-- Sun -->
  <g id="sun">
    <circle cx="700" cy="100" r="60" class="outline"/>
    <line x1="700" y1="30" x2="700" y2="170" class="outline-none"/>
    <line x1="630" y1="100" x2="770" y2="100" class="outline-none"/>
    <line x1="650" y1="50" x2="750" y2="150" class="outline-none"/>
    <line x1="650" y1="150" x2="750" y2="50" class="outline-none"/>
  </g>

  <!-- Picnic blanket -->
  <rect x="250" y="600" width="350" height="200" rx="30" ry="30" class="outline"/>

  <!-- Snacks on blanket -->
  <g id="snacks">
    <!-- Apple 1 -->
    <circle cx="300" cy="650" r="25" class="outline"/>
    <path d="M295 630 L305 630 A5 5 0 0 1 300 625 Z" class="outline-none"/> <!-- Stem -->
    <!-- Apple 2 -->
    <circle cx="360" cy="660" r="25" class="outline"/>
    <path d="M355 640 L365 640 A5 5 0 0 1 360 635 Z" class="outline-none"/> <!-- Stem -->
    <!-- Sandwich -->
    <rect x="420" y="640" width="60" height="40" rx="10" ry="10" class="outline"/>
    <line x1="420" y1="660" x2="480" y2="660" class="outline-none"/> <!-- Crust line -->
    <!-- Juice box -->
    <rect x="520" y="630" width="40" height="60" rx="8" ry="8" class="outline"/>
    <rect x="535" y="610" width="10" height="20" class="outline"/> <!-- Straw -->
  </g>

  <!-- Tree -->
  <g id="tree">
    <rect x="50" y="350" width="60" height="400" rx="20" ry="20" class="outline"/>
    <!-- Leaves (simple blobs) -->
    <ellipse cx="100" cy="270" rx="70" ry="50" class="outline"/>
    <ellipse cx="70" cy="320" rx="50" ry="40" class="outline"/>
    <ellipse cx="130" cy="320" rx="50" ry="40" class="outline"/>
  </g>

  <!-- Dinosaurs -->
  <g id="dinosaurs">

    <!-- Long-necked dinosaur (eating leaves) -->
    <g id="long_neck_dino">
      <path d="M120 600 C150 550 250 550 280 600 C270 650 170 650 120 600 Z" class="outline"/> <!-- Body -->
      <path d="M140 600 Q150 500 180 400 Q200 300 200 250 Q210 200 180 210 Q150 220 160 270 Q150 350 130 450 Q120 550 140 600 Z" class="outline"/> <!-- Neck and Head -->
      <path d="M160 210 Q170 200 180 210 Q190 220 180 230 Q170 240 160 230 Z" class="outline"/> <!-- Top of head/snout -->
      <ellipse cx="170" cy="225" rx="5" ry="5" class="outline-none"/> <!-- Eye -->
      <path d="M165 235 Q175 240 185 235" class="outline-none"/> <!-- Mouth smile -->
      <!-- Legs -->
      <rect x="140" y="600" width="30" height="80" rx="15" ry="15" class="outline"/>
      <rect x="220" y="600" width="30" height="80" rx="15" ry="15" class="outline"/>
      <!-- Tail -->
      <path d="M120 600 Q90 650 50 620 Q20 590 30 570 Q50 550 80 570 Z" class="outline"/>
    </g>

    <!-- Triceratops -->
    <g id="triceratops">
      <path d="M500 800 C530 750 630 750 660 800 C650 850 550 850 500 800 Z" class="outline"/> <!-- Body -->
      <!-- Legs -->
      <rect x="520" y="800" width="30" height="80" rx="15" ry="15" class="outline"/>
      <rect x="590" y="800" width="30" height="80" rx="15" ry="15" class="outline"/>
      <!-- Head and Frill -->
      <path d="M660 780 C690 700 750 700 780 780 C750 850 690 850 660 780 Z" class="outline"/> <!-- Frill -->
      <path d="M600 780 Q620 720 660 720 Q690 730 700 780 Z" class="outline"/> <!-- Head -->
      <path d="M680 730 Q685 710 690 730" class="outline-none"/> <!-- Nose horn -->
      <path d="M650 710 Q660 690 670 710" class="outline-none"/> <!-- Eye horn left -->
      <path d="M700 710 Q710 690 720 710" class="outline-none"/> <!-- Eye horn right -->
      <ellipse cx="670" cy="740" rx="5" ry="5" class="outline-none"/> <!-- Eye -->
      <path d="M660 760 Q675 770 690 760" class="outline-none"/> <!-- Mouth smile -->
      <!-- Sandwich -->
      <rect x="670" y="765" width="30" height="20" rx="5" ry="5" class="outline"/>
      <line x1="670" y1="775" x2="700" y2="775" class="outline-none"/>
      <path d="M685 765 L685 770 L690 770 L690 765 Z" class="outline-none"/> <!-- sandwich bite mark -->
      <!-- Tail -->
      <path d="M500 800 Q470 850 450 820 Q430 790 440 770 Q460 750 480 770 Z" class="outline"/>
    </g>

    <!-- Stegosaurus -->
    <g id="stegosaurus">
      <path d="M350 700 C380 650 480 650 510 700 C500 750 400 750 350 700 Z" class="outline"/> <!-- Body -->
      <!-- Legs -->
      <rect x="370" y="700" width="30" height="80" rx="15" ry="15" class="outline"/>
      <rect x="440" y="700" width="30" height="80" rx="15" ry="15" class="outline"/>
      <!-- Head -->
      <ellipse cx="330" cy="670" rx="30" ry="20" class="outline"/>
      <ellipse cx="325" cy="665" rx="5" ry="5" class="outline-none"/> <!-- Eye -->
      <path d="M320 675 Q330 680 340 675" class="outline-none"/> <!-- Mouth smile -->
      <!-- Plates -->
      <path d="M380 650 Q390 610 400 650" class="outline"/>
      <path d="M410 650 Q420 610 430 650" class="outline"/>
      <path d="M440 650 Q450 610 460 650" class="outline"/>
      <path d="M470 650 Q480 610 490 650" class="outline"/>
      <!-- Tail spikes -->
      <path d="M350 700 Q320 750 280 720 Q250 690 260 670 Q280 650 310 670 Z" class="outline"/> <!-- Tail -->
      <path d="M270 670 L260 660 L280 660 Z" class="outline-none"/>
      <path d="M290 670 L280 660 L300 660 Z" class="outline-none"/>
    </g>

    <!-- Baby Pterodactyl (flying) -->
    <g id="pterodactyl">
      <path d="M600 200 C620 180 660 180 680 200 C670 220 630 220 600 200 Z" class="outline"/> <!-- Body -->
      <path d="M640 180 Q650 150 680 160 Q700 170 680 190 Q660 200 640 180 Z" class="outline"/> <!-- Head and Beak -->
      <ellipse cx="650" cy="185" rx="3" ry="3" class="outline-none"/> <!-- Eye -->
      <path d="M645 190 Q655 195 665 190" class="outline-none"/> <!-- Mouth smile -->
      <!-- Wings -->
      <path d="M600 200 Q550 150 500 180 Q520 230 600 200 Z" class="outline"/> <!-- Left wing -->
      <path d="M680 200 Q730 150 780 180 Q760 230 680 200 Z" class="outline"/> <!-- Right wing -->
      <!-- Fruit basket -->
      <path d="M630 250 Q640 230 650 250 L650 270 Q640 290 630 270 Z" class="outline"/> <!-- Basket body -->
      <path d="M630 250 Q640 240 650 250" class="outline-none"/> <!-- Basket handle -->
      <!-- Fruits -->
      <circle cx="635" cy="260" r="5" class="outline-none"/>
      <circle cx="645" cy="260" r="5" class="outline-none"/>
    </g>

  </g>
</svg>