<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
  <!-- All elements share common stroke and fill attributes, overridden by specific elements or groups if needed -->
  <g stroke="black" fill="white">

    <!-- Cloud Group - The base for the unicorn -->
    <g id="cloud">
      <path d="M150 700 Q100 600 200 550 C250 500 350 500 400 550 C450 500 550 500 600 550 Q700 600 650 700 Q750 750 650 800 Q550 850 400 850 Q250 850 150 800 Q50 750 150 700 Z"
            stroke-width="5" fill="white"/>
      <!-- Internal cloud fluff lines for detail -->
      <path d="M250 600 C200 620 200 680 250 700" stroke-width="4" fill="none"/>
      <path d="M550 600 C600 620 600 680 550 700" stroke-width="4" fill="none"/>
    </g>

    <!-- Unicorn Group - The main character -->
    <g id="unicorn">
      <!-- Body (sitting position) -->
      <path d="M330 650 C300 600 320 550 370 560 L450 560 C500 550 520 600 490 650 Q520 750 400 780 Q280 750 330 650 Z" stroke-width="5" fill="white"/>

      <!-- Head -->
      <ellipse cx="400" cy="480" rx="70" ry="60" stroke-width="5" fill="white"/>
      <!-- Muzzle -->
      <ellipse cx="430" cy="490" rx="30" ry="20" stroke-width="4" fill="white"/>
      <!-- Left Eye -->
      <circle cx="390" cy="460" r="15" stroke-width="4" fill="white"/>
      <!-- Right Eye -->
      <circle cx="350" cy="460" r="15" stroke-width="4" fill="white"/>
      <!-- Smile -->
      <path d="M420 495 Q430 505 440 495" stroke-width="4" fill="none"/>
      <!-- Left Ear -->
      <path d="M370 420 Q360 400 380 400 Q390 420 370 420 Z" stroke-width="4" fill="white"/>
      <!-- Right Ear -->
      <path d="M330 420 Q320 400 340 400 Q350 420 330 420 Z" stroke-width="4" fill="white"/>
      <!-- Horn -->
      <path d="M380 380 L390 350 C395 340 385 330 380 340 L370 350 Z" stroke-width="4" fill="white"/>
      <!-- Horn stripe 1 -->
      <path d="M375 355 L385 365" stroke-width="3" fill="none"/>
      <!-- Horn stripe 2 -->
      <path d="M370 370 L380 380" stroke-width="3" fill="none"/>

      <!-- Mane (flowing hair) -->
      <path d="M310 440 C280 390 260 440 280 490 C300 540 320 490 310 440 Z" stroke-width="4" fill="white"/>
      <path d="M280 490 C260 510 280 540 300 540" stroke-width="3" fill="none"/>

      <!-- Tail (flowing hair) -->
      <path d="M480 620 C510 600 540 650 510 700 C480 750 450 700 480 620 Z" stroke-width="4" fill="white"/>
      <path d="M480 620 C500 640 520 690 500 740" stroke-width="3" fill="none"/>

      <!-- Front Legs/Arms holding cupcake -->
      <path d="M450 620 Q440 580 470 580 Q500 580 500 620 Z" stroke-width="5" fill="white"/> <!-- Right arm/hoof -->
      <path d="M370 620 Q380 580 350 580 Q320 580 320 620 Z" stroke-width="5" fill="white"/> <!-- Left arm/hoof -->
    </g>

    <!-- Cupcake Group - Held by the unicorn -->
    <g id="cupcake">
      <!-- Wrapper -->
      <path d="M380 590 C370 610 370 640 380 660 H460 C470 640 470 610 460 590 Z" stroke-width="4" fill="white"/>
      <!-- Ribs on wrapper -->
      <path d="M390 590 V660 M405 590 V660 M420 590 V660 M435 590 V660 M450 590 V660" stroke-width="3" fill="none"/>
      <!-- Cake base -->
      <ellipse cx="420" cy="590" rx="40" ry="15" stroke-width="4" fill="white"/>
      <!-- Icing -->
      <path d="M380 590 Q400 550 420 570 Q440 550 460 590 Z" stroke-width="4" fill="white"/>
      <!-- Cherry on top -->
      <circle cx="420" cy="555" r="10" stroke-width="3" fill="white"/>
    </g>

    <!-- Floating Elements Group - Candies and Stars -->
    <g id="floating-elements">
      <!-- Stars -->
      <path d="M100 150 L115 185 L150 185 L125 210 L140 245 L100 220 L60 245 L75 210 L50 185 L85 185 Z" stroke-width="3" fill="white"/>
      <path d="M680 200 L695 235 L730 235 L705 260 L720 295 L680 270 L640 295 L655 260 L630 235 L665 235 Z" stroke-width="3" fill="white"/>
      <path d="M50 850 L60 870 L80 870 L65 885 L70 905 L50 895 L30 905 L35 885 L20 870 L40 870 Z" stroke-width="3" fill="white"/>
      <path d="M700 850 L710 870 L730 870 L715 885 L720 905 L700 895 L680 905 L685 885 L670 870 L690 870 Z" stroke-width="3" fill="white"/>
      <path d="M200 100 L210 120 L230 120 L215 135 L220 155 L200 145 L180 155 L185 135 L170 120 L190 120 Z" stroke-width="3" fill="white"/>

      <!-- Candies (circles) -->
      <circle cx="50" cy="300" r="15" stroke-width="3" fill="white"/>
      <circle cx="750" cy="100" r="15" stroke-width="3" fill="white"/>
      <circle cx="120" cy="400" r="15" stroke-width="3" fill="white"/>
      <circle cx="680" cy="450" r="15" stroke-width="3" fill="white"/>
      <circle cx="200" cy="800" r="15" stroke-width="3" fill="white"/>
      <circle cx="600" cy="90" r="15" stroke-width="3" fill="white"/>
      <circle cx="300" cy="200" r="15" stroke-width="3" fill="white"/>
      <circle cx="500" cy="250" r="15" stroke-width="3" fill="white"/>
    </g>

  </g>
</svg>