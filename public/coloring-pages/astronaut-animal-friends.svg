<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="rabbit-astronaut" stroke="black" stroke-width="5" fill="white">
    <!-- Body -->
    <rect x="270" y="450" width="260" height="200" rx="100" ry="100"/>

    <!-- Left Arm -->
    <rect x="180" y="480" width="80" height="120" rx="40" ry="40" transform="rotate(-30 220 540)"/>
    <!-- Left Glove -->
    <circle cx="160" cy="460" r="40"/>

    <!-- Right Arm -->
    <rect x="540" y="480" width="80" height="120" rx="40" ry="40" transform="rotate(30 580 540)"/>
    <!-- Right Glove (will hold the flag) -->
    <circle cx="640" cy="460" r="40"/>

    <!-- Left Leg -->
    <rect x="320" y="620" width="70" height="100" rx="35" ry="35" transform="rotate(10 355 670)"/>
    <!-- Left Boot -->
    <rect x="300" y="700" width="100" height="60" rx="30" ry="30"/>

    <!-- Right Leg -->
    <rect x="410" y="620" width="70" height="100" rx="35" ry="35" transform="rotate(-10 445 670)"/>
    <!-- Right Boot -->
    <rect x="400" y="700" width="100" height="60" rx="30" ry="30"/>

    <!-- Helmet (base round shape) -->
    <circle cx="400" cy="300" r="150"/>
    
    <!-- Helmet Visor (clear glass part - slightly rounded rectangle path) -->
    <path d="M300 240 C300 200 500 200 500 240 L500 360 C500 400 300 400 300 360 Z" />
    
    <!-- Head (inside helmet) -->
    <circle cx="400" cy="300" r="100"/>
    
    <!-- Face features inside visor -->
    <!-- Eyes -->
    <circle cx="360" cy="280" r="15"/>
    <circle cx="440" cy="280" r="15"/>
    <!-- Nose -->
    <path d="M400 305 L390 320 L410 320 Z" />
    <!-- Mouth -->
    <path d="M370 330 Q400 350 430 330" fill="none" stroke="black" stroke-width="5"/>
    
    <!-- Ears (on top of helmet) -->
    <ellipse cx="330" cy="180" rx="35" ry="90" transform="rotate(-15 330 180)"/>
    <ellipse cx="470" cy="180" rx="35" ry="90" transform="rotate(15 470 180)"/>

    <!-- Suit Collar -->
    <ellipse cx="400" cy="420" rx="100" ry="40"/>
  </g>

  <!-- Flag held by rabbit -->
  <g id="flag" stroke="black" stroke-width="5" fill="white">
    <!-- Pole, connected to the right glove -->
    <rect x="630" y="380" width="15" height="100" rx="7" ry="7"/>
    <!-- Flag cloth (wavy path) -->
    <path d="M645 380 Q720 390 720 430 Q720 470 645 480 Z"/>
  </g>

  <!-- Crescent Moon -->
  <g id="moon" stroke="black" stroke-width="5" fill="white">
    <!-- A single path defining a crescent shape -->
    <path d="M 680 150 A 100 100 0 1 0 680 350 A 80 80 0 1 1 680 150 Z"/>
  </g>

  <!-- Stars -->
  <g id="stars" stroke="black" stroke-width="5" fill="white">
    <!-- Star 1 -->
    <path d="M100 100 L120 150 L180 160 L130 190 L140 250 L100 220 L60 250 L70 190 L20 160 L80 150 Z"/>
    <!-- Star 2 (smaller, different position) -->
    <path d="M700 800 L710 825 L740 830 L720 850 L725 875 L700 860 L675 875 L680 850 L660 830 L690 825 Z"/>
    <!-- Star 3 (smaller, different position) -->
    <path d="M150 700 L160 725 L190 730 L170 750 L175 775 L150 760 L125 775 L130 750 L110 730 L140 725 Z"/>
    <!-- Star 4 (smaller, different position) -->
    <path d="M500 80 L510 105 L540 110 L520 130 L525 155 L500 140 L475 155 L480 130 L460 110 L490 105 Z"/>
  </g>
</svg>