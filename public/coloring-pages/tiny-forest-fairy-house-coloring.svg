<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Main group for all elements, setting common styles -->
  <g stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Charming house made of flowers and leaves -->
    <g id="flower-house">
      <!-- Base leaves/stem-like foundation -->
      <path d="M400 900 Q300 850 250 700 Q200 550 400 500 Q600 550 550 700 Q500 850 400 900Z"/>
      <path d="M400 900 Q450 880 470 780 Q490 680 400 600 Q310 680 330 780 Q350 880 400 900Z"/>

      <!-- Main flower petals forming the walls -->
      <ellipse cx="400" cy="550" rx="200" ry="150"/>
      <ellipse cx="400" cy="550" rx="150" ry="200"/>
      <ellipse cx="400" cy="550" rx="180" ry="180" transform="rotate(45 400 550)"/>
      <ellipse cx="400" cy="550" rx="180" ry="180" transform="rotate(-45 400 550)"/>

      <!-- Roof, depicted as a large flower head -->
      <circle cx="400" cy="400" r="150"/>
      <circle cx="400" cy="400" r="100" stroke-width="3"/> <!-- Inner part of flower head -->

      <!-- Simple rounded door -->
      <rect x="350" y="700" width="100" height="150" rx="30" ry="30"/>
      <!-- Round window -->
      <circle cx="400" cy="600" r="40"/>
    </g>

    <!-- Cute happy tiny fairy -->
    <g id="fairy" transform="translate(150 200)"> <!-- Position her flying to the left -->
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="30" ry="50"/>
      <!-- Head -->
      <circle cx="0" cy="-65" r="35"/>
      <!-- Simple hair bun -->
      <circle cx="15" cy="-85" r="20" stroke-width="3"/>
      <!-- Arms -->
      <path d="M-25 -20 Q-50 -30 -60 -5 M25 -20 Q50 -30 60 -5" fill="none"/>
      <!-- Legs -->
      <path d="M-15 30 L-25 70 M15 30 L25 70" fill="none"/>
      <!-- Delicate wings -->
      <g id="fairy-wings" stroke-width="3">
        <ellipse cx="-45" cy="-40" rx="30" ry="60" transform="rotate(20 -45 -40)"/>
        <ellipse cx="-45" cy="0" rx="25" ry="45" transform="rotate(10 -45 0)"/>
        <ellipse cx="45" cy="-40" rx="30" ry="60" transform="rotate(-20 45 -40)"/>
        <ellipse cx="45" cy="0" rx="25" ry="45" transform="rotate(-10 45 0)"/>
      </g>
      <!-- Face: eyes and smile -->
      <circle cx="-15" cy="-75" r="5" stroke-width="2"/>
      <circle cx="15" cy="-75" r="5" stroke-width="2"/>
      <path d="M-15 -55 Q0 -45 15 -55" fill="none" stroke-width="3"/> <!-- Smile -->
    </g>

    <!-- Cute mushrooms -->
    <g id="mushrooms">
      <!-- Mushroom 1 (left) -->
      <rect x="100" y="800" width="50" height="80" rx="20" ry="20"/>
      <path d="M75 800 A50 50 0 0 1 175 800 L175 750 A50 50 0 0 0 75 750 Z"/>

      <!-- Mushroom 2 (right) -->
      <rect x="650" y="750" width="60" height="90" rx="25" ry="25"/>
      <path d="M620 750 A60 60 0 0 1 740 750 L740 700 A60 60 0 0 0 620 700 Z"/>

      <!-- Mushroom 3 (front right) -->
      <rect x="500" y="900" width="40" height="60" rx="15" ry="15"/>
      <path d="M480 900 A40 40 0 0 1 560 900 L560 870 A40 40 0 0 0 480 870 Z"/>
    </g>

    <!-- Playful butterflies -->
    <g id="butterflies">
      <!-- Butterfly 1 (top left) -->
      <g transform="translate(100 150)">
        <ellipse cx="0" cy="0" rx="15" ry="30"/>
        <ellipse cx="-25" cy="-20" rx="30" ry="20" transform="rotate(30)"/>
        <ellipse cx="25" cy="-20" rx="30" ry="20" transform="rotate(-30)"/>
        <ellipse cx="-20" cy="20" rx="25" ry="15" transform="rotate(10)"/>
        <ellipse cx="20" cy="20" rx="25" ry="15" transform="rotate(-10)"/>
      </g>
      <!-- Butterfly 2 (top right) -->
      <g transform="translate(700 100)">
        <ellipse cx="0" cy="0" rx="15" ry="30"/>
        <ellipse cx="-25" cy="-20" rx="30" ry="20" transform="rotate(30)"/>
        <ellipse cx="25" cy="-20" rx="30" ry="20" transform="rotate(-30)"/>
        <ellipse cx="-20" cy="20" rx="25" ry="15" transform="rotate(10)"/>
        <ellipse cx="20" cy="20" rx="25" ry="15" transform="rotate(-10)"/>
      </g>
      <!-- Butterfly 3 (mid right) -->
      <g transform="translate(600 450)">
        <ellipse cx="0" cy="0" rx="12" ry="25"/>
        <ellipse cx="-20" cy="-15" rx="25" ry="18" transform="rotate(30)"/>
        <ellipse cx="20" cy="-15" rx="25" ry="18" transform="rotate(-30)"/>
        <ellipse cx="-18" cy="15" rx="20" ry="12" transform="rotate(10)"/>
        <ellipse cx="18" cy="15" rx="20" ry="12" transform="rotate(-10)"/>
      </g>
    </g>

    <!-- Simple forest elements: grass and small flowers -->
    <g id="forest-elements">
      <!-- Grass Tufts at the bottom -->
      <path d="M0 950 Q100 900 200 950 Q300 1000 400 950 L400 1000 L0 1000 Z"/>
      <path d="M400 950 Q500 900 600 950 Q700 1000 800 950 L800 1000 L400 1000 Z"/>
      <path d="M200 880 Q250 860 300 880 L300 900 L200 900 Z"/>

      <!-- Small Flowers -->
      <!-- Flower 1 (bottom left) -->
      <circle cx="150" cy="930" r="10" stroke-width="3"/>
      <ellipse cx="150" cy="915" rx="8" ry="15" transform="rotate(0 150 915)" stroke-width="3"/>
      <ellipse cx="150" cy="915" rx="8" ry="15" transform="rotate(45 150 915)" stroke-width="3"/>
      <ellipse cx="150" cy="915" rx="8" ry="15" transform="rotate(90 150 915)" stroke-width="3"/>
      <ellipse cx="150" cy="915" rx="8" ry="15" transform="rotate(135 150 915)" stroke-width="3"/>

      <!-- Flower 2 (bottom right) -->
      <circle cx="700" cy="880" r="10" stroke-width="3"/>
      <ellipse cx="700" cy="865" rx="8" ry="15" transform="rotate(0 700 865)" stroke-width="3"/>
      <ellipse cx="700" cy="865" rx="8" ry="15" transform="rotate(45 700 865)" stroke-width="3"/>
      <ellipse cx="700" cy="865" rx="8" ry="15" transform="rotate(90 700 865)" stroke-width="3"/>
      <ellipse cx="700" cy="865" rx="8" ry="15" transform="rotate(135 700 865)" stroke-width="3"/>

      <!-- Flower 3 (mid left) -->
      <circle cx="250" cy="780" r="8" stroke-width="3"/>
      <ellipse cx="250" cy="770" rx="6" ry="12" transform="rotate(0 250 770)" stroke-width="3"/>
      <ellipse cx="250" cy="770" rx="6" ry="12" transform="rotate(45 250 770)" stroke-width="3"/>
      <ellipse cx="250" cy="770" rx="6" ry="12" transform="rotate(90 250 770)" stroke-width="3"/>
      <ellipse cx="250" cy="770" rx="6" ry="12" transform="rotate(135 250 770)" stroke-width="3"/>
    </g>

  </g>
</svg>