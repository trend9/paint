<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" stroke="black" stroke-width="4" fill="white">
  <!-- Pure white background -->
  <rect x="0" y="0" width="800" height="1000" fill="white" stroke="none"/>

  <!-- Stars Group -->
  <g id="stars">
    <circle cx="100" cy="50" r="8"/>
    <circle cx="250" cy="120" r="6"/>
    <circle cx="50" cy="200" r="10"/>
    <circle cx="380" cy="70" r="7"/>
    <circle cx="600" cy="30" r="9"/>
    <circle cx="750" cy="100" r="5"/>
    <circle cx="700" cy="250" r="8"/>
    <circle cx="150" cy="300" r="6"/>
    <circle cx="500" cy="180" r="10"/>
    <circle cx="70" cy="400" r="7"/>
    <circle cx="280" cy="450" r="9"/>
    <circle cx="650" cy="500" r="5"/>
    <circle cx="50" cy="600" r="8"/>
    <circle cx="400" cy="650" r="6"/>
    <circle cx="750" cy="700" r="10"/>
    <circle cx="180" cy="750" r="7"/>
    <circle cx="600" cy="800" r="9"/>
    <circle cx="30" cy="850" r="5"/>
    <circle cx="700" cy="900" r="8"/>
    <circle cx="200" cy="950" r="6"/>
    <circle cx="550" cy="920" r="10"/>
    <circle cx="300" cy="880" r="7"/>
    <circle cx="120" cy="550" r="9"/>
    <circle cx="780" cy="400" r="5"/>
    <circle cx="550" cy="60" r="8"/>
    <circle cx="450" cy="300" r="6"/>
    <circle cx="20" cy="10" r="5"/>
    <circle cx="780" cy="980" r="5"/>
  </g>

  <!-- Planets Group -->
  <g id="planets">
    <!-- Planet 1 (top left) -->
    <circle cx="180" cy="100" r="60"/>
    <path d="M 120 100 A 60 60 0 0 1 240 100" fill="none"/> <!-- Simple "crater" line -->

    <!-- Planet 2 (middle right with ring) -->
    <circle cx="650" cy="300" r="70"/>
    <ellipse cx="650" cy="300" rx="100" ry="20" transform="rotate(-15 650 300)" fill="none"/>

    <!-- Planet 3 (bottom left) -->
    <circle cx="150" cy="850" r="80"/>
    <path d="M 100 830 C 120 810, 180 810, 200 830" fill="none"/> <!-- another simple crater -->

    <!-- Planet 4 (top right, small) -->
    <circle cx="700" cy="80" r="40"/>
  </g>

  <!-- Friendly Rocket in Background -->
  <g id="rocket" transform="translate(600, 700) scale(0.8)">
    <path d="M 100 0 L 140 80 L 160 200 L 40 200 L 60 80 Z"/> <!-- Main body -->
    <path d="M 100 0 L 115 30 L 85 30 Z"/> <!-- Nose cone -->
    <rect x="50" y="200" width="100" height="30"/> <!-- Bottom base -->
    <path d="M 40 200 L 20 230 L 40 230 Z"/> <!-- Left fin -->
    <path d="M 160 200 L 180 230 L 160 230 Z"/> <!-- Right fin -->
    <circle cx="100" cy="100" r="25"/> <!-- Window -->
    <path d="M 80 230 Q 100 250, 120 230" fill="none"/> <!-- Smoke puff indicator -->
  </g>

  <!-- Animal Astronauts Group -->
  <g id="animal-astronauts">

    <!-- Bear Astronaut -->
    <g id="bear-astronaut" transform="translate(100, 350)">
      <!-- Suit body -->
      <path d="M 100 100 Q 150 50, 200 100 Q 220 180, 200 260 Q 150 300, 100 260 Q 80 180, 100 100 Z"/>
      <!-- Arms -->
      <path d="M 100 150 Q 80 130, 70 180 Q 80 210, 100 190"/>
      <path d="M 200 150 Q 220 130, 230 180 Q 220 210, 200 190"/>
      <!-- Legs -->
      <path d="M 120 260 Q 100 280, 110 310 Q 130 320, 150 300"/>
      <path d="M 180 260 Q 200 280, 190 310 Q 170 320, 150 300"/>
      <!-- Helmet -->
      <ellipse cx="150" cy="100" rx="70" ry="60"/>
      <!-- Visor -->
      <ellipse cx="150" cy="100" rx="40" ry="30"/>
      <!-- Bear Head inside helmet -->
      <circle cx="150" cy="100" r="30"/>
      <!-- Ears -->
      <circle cx="125" cy="75" r="15"/>
      <circle cx="175" cy="75" r="15"/>
      <!-- Face -->
      <circle cx="140" cy="95" r="3" stroke-width="3"/> <!-- Left eye -->
      <circle cx="160" cy="95" r="3" stroke-width="3"/> <!-- Right eye -->
      <ellipse cx="150" cy="110" rx="5" ry="3" stroke-width="3"/> <!-- Nose -->
      <path d="M 140 115 Q 150 120, 160 115" fill="none" stroke-width="3"/> <!-- Mouth -->
    </g>

    <!-- Rabbit Astronaut -->
    <g id="rabbit-astronaut" transform="translate(450, 400)">
      <!-- Suit body -->
      <path d="M 100 100 Q 150 50, 200 100 Q 220 180, 200 260 Q 150 300, 100 260 Q 80 180, 100 100 Z"/>
      <!-- Arms -->
      <path d="M 100 150 Q 80 130, 70 180 Q 80 210, 100 190"/>
      <path d="M 200 150 Q 220 130, 230 180 Q 220 210, 200 190"/>
      <!-- Legs -->
      <path d="M 120 260 Q 100 280, 110 310 Q 130 320, 150 300"/>
      <path d="M 180 260 Q 200 280, 190 310 Q 170 320, 150 300"/>
      <!-- Helmet -->
      <ellipse cx="150" cy="100" rx="70" ry="60"/>
      <!-- Visor -->
      <ellipse cx="150" cy="100" rx="40" ry="30"/>
      <!-- Rabbit Head inside helmet -->
      <circle cx="150" cy="100" r="30"/>
      <!-- Ears -->
      <ellipse cx="130" cy="55" rx="10" ry="30" transform="rotate(-15 130 55)"/>
      <ellipse cx="170" cy="55" rx="10" ry="30" transform="rotate(15 170 55)"/>
      <!-- Face -->
      <circle cx="140" cy="95" r="3" stroke-width="3"/>
      <circle cx="160" cy="95" r="3" stroke-width="3"/>
      <ellipse cx="150" cy="110" rx="5" ry="3" stroke-width="3"/>
      <path d="M 140 115 Q 150 120, 160 115" fill="none" stroke-width="3"/>
    </g>

    <!-- Dog Astronaut -->
    <g id="dog-astronaut" transform="translate(250, 650)">
      <!-- Suit body -->
      <path d="M 100 100 Q 150 50, 200 100 Q 220 180, 200 260 Q 150 300, 100 260 Q 80 180, 100 100 Z"/>
      <!-- Arms -->
      <path d="M 100 150 Q 80 130, 70 180 Q 80 210, 100 190"/>
      <path d="M 200 150 Q 220 130, 230 180 Q 220 210, 200 190"/>
      <!-- Legs -->
      <path d="M 120 260 Q 100 280, 110 310 Q 130 320, 150 300"/>
      <path d="M 180 260 Q 200 280, 190 310 Q 170 320, 150 300"/>
      <!-- Helmet -->
      <ellipse cx="150" cy="100" rx="70" ry="60"/>
      <!-- Visor -->
      <ellipse cx="150" cy="100" rx="40" ry="30"/>
      <!-- Dog Head inside helmet -->
      <circle cx="150" cy="100" r="30"/>
      <!-- Ears (floppy) -->
      <path d="M 120 70 C 100 85, 110 115, 130 105 Z"/>
      <path d="M 180 70 C 200 85, 190 115, 170 105 Z"/>
      <!-- Face -->
      <circle cx="140" cy="95" r="3" stroke-width="3"/>
      <circle cx="160" cy="95" r="3" stroke-width="3"/>
      <ellipse cx="150" cy="110" rx="5" ry="3" stroke-width="3"/>
      <path d="M 140 115 Q 150 120, 160 115" fill="none" stroke-width="3"/>
    </g>

  </g>
</svg>