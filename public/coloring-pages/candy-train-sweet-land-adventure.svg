<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for background landscape elements -->
  <g id="landscape">
    <!-- Chocolate Mountains -->
    <path d="M0 450 Q200 250 400 400 Q600 250 800 400 L800 1000 L0 1000 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Gingerbread House -->
    <g id="gingerbread-house">
      <rect x="500" y="250" width="180" height="150" rx="15" ry="15" fill="white" stroke="black" stroke-width="5"/> <!-- House body -->
      <path d="M500 250 L590 130 L680 250 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Roof -->
      <circle cx="540" cy="320" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Window 1 -->
      <circle cx="640" cy="320" r="25" fill="white" stroke="black" stroke-width="4"/> <!-- Window 2 -->
      <rect x="575" y="320" width="50" height="80" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Door -->
      <rect x="620" y="160" width="30" height="50" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/> <!-- Chimney -->
    </g>

    <!-- Candy Trees -->
    <g id="candy-trees">
      <!-- Tree 1 -->
      <rect x="100" y="380" width="40" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="120" cy="340" r="50" fill="white" stroke="black" stroke-width="4"/>
      <!-- Tree 2 -->
      <rect x="300" y="350" width="50" height="120" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="325" cy="300" r="60" fill="white" stroke="black" stroke-width="4"/>
      <!-- Tree 3 -->
      <rect x="700" y="450" width="60" height="140" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="730" cy="390" r="70" fill="white" stroke="black" stroke-width="4"/>
    </g>
  </g>

  <!-- Group for the licorice track -->
  <g id="track">
    <path d="M0 650 Q200 630 400 640 Q600 650 800 630 L800 680 Q600 670 400 660 Q200 650 0 700 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Group for the candy train -->
  <g id="candy-train">
    <!-- Engine Body -->
    <rect x="100" y="500" width="300" height="150" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <!-- Engine Cabin -->
    <rect x="320" y="420" width="120" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <!-- Chimney Base -->
    <rect x="140" y="410" width="60" height="70" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/>
    <!-- Chimney Top -->
    <circle cx="170" cy="400" r="40" fill="white" stroke="black" stroke-width="5"/>

    <!-- Train Face -->
    <g id="train-face">
      <circle cx="130" cy="550" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Left Eye -->
      <circle cx="180" cy="550" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Right Eye -->
      <path d="M130 580 Q155 600 180 580" fill="none" stroke="black" stroke-width="4"/> <!-- Smile -->
      <circle cx="130" cy="550" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Pupil -->
      <circle cx="180" cy="550" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Pupil -->
    </g>

    <!-- Engine Wheels (lollipops) -->
    <g id="engine-wheels">
      <circle cx="200" cy="650" r="60" fill="white" stroke="black" stroke-width="5"/>
      <rect x="195" y="680" width="10" height="50" rx="2" ry="2" fill="white" stroke="black" stroke-width="4"/> <!-- Lollipop stick -->
      <circle cx="350" cy="650" r="60" fill="white" stroke="black" stroke-width="5"/>
      <rect x="345" y="680" width="10" height="50" rx="2" ry="2" fill="white" stroke="black" stroke-width="4"/> <!-- Lollipop stick -->
    </g>

    <!-- Steam Puffs -->
    <g id="steam">
      <path d="M170 360 Q150 320 180 300 T230 280 T260 300 Q240 340 190 350 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M220 330 Q200 290 230 270 T280 250 T310 270 Q290 310 240 320 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Connector to carriage -->
    <rect x="390" y="580" width="30" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/>

    <!-- Carriage 1 -->
    <g id="carriage-1">
      <rect x="420" y="520" width="250" height="130" rx="25" ry="25" fill="white" stroke="black" stroke-width="5"/>
      <!-- Carriage Wheels (lollipops) -->
      <circle cx="490" cy="650" r="50" fill="white" stroke="black" stroke-width="5"/>
      <rect x="485" y="670" width="10" height="40" rx="2" ry="2" fill="white" stroke="black" stroke-width="4"/> <!-- Lollipop stick -->
      <circle cx="610" cy="650" r="50" fill="white" stroke="black" stroke-width="5"/>
      <rect x="605" y="670" width="10" height="40" rx="2" ry="2" fill="white" stroke="black" stroke-width="4"/> <!-- Lollipop stick -->
    </g>
  </g>
</svg>