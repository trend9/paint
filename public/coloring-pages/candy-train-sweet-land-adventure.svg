<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Candy Cane Rails -->
  <g id="rails" stroke="black" stroke-width="4" fill="white">
    <path d="M 0 850 Q 200 750 400 800 T 800 700" fill="none"/>
    <path d="M 0 865 Q 200 765 400 815 T 800 715" fill="none"/>
    <path d="M 0 650 Q 150 550 300 600 T 800 500" fill="none"/>
    <path d="M 0 665 Q 150 565 300 615 T 800 515" fill="none"/>
  </g>

  <!-- Background Landscape Elements -->
  <g id="landscape-elements">
    <!-- Gingerbread House 1 (left) -->
    <g id="gingerbread-house-1" stroke="black" stroke-width="4" fill="white">
      <rect x="50" y="600" width="150" height="150" rx="20" ry="20"/>
      <path d="M 30 600 L 125 500 L 220 600 Z"/>
      <circle cx="125" cy="670" r="30"/>
      <line x1="125" y1="640" x2="125" y2="700" stroke-width="3"/>
      <line x1="95" y1="670" x2="155" y2="670" stroke-width="3"/>
    </g>

    <!-- Gingerbread House 2 (right) -->
    <g id="gingerbread-house-2" stroke="black" stroke-width="4" fill="white">
      <rect x="600" y="450" width="160" height="160" rx="25" ry="25"/>
      <path d="M 580 450 L 680 350 L 780 450 Z"/>
      <circle cx="680" cy="530" r="35"/>
      <line x1="680" y1="495" x2="680" y2="565" stroke-width="3"/>
      <line x1="645" y1="530" x2="715" y2="530" stroke-width="3"/>
    </g>

    <!-- Gummy Bear Tree 1 (far left) -->
    <g id="gummy-bear-tree-1" stroke="black" stroke-width="4" fill="white">
      <rect x="100" y="450" width="40" height="100" rx="10" ry="10"/>
      <circle cx="120" cy="400" r="40"/>
      <circle cx="85" cy="420" r="30"/>
      <circle cx="155" cy="420" r="30"/>
    </g>

    <!-- Gummy Bear Tree 2 (middle right) -->
    <g id="gummy-bear-tree-2" stroke="black" stroke-width="4" fill="white">
      <rect x="450" y="380" width="50" height="120" rx="15" ry="15"/>
      <circle cx="475" cy="320" r="50"/>
      <circle cx="430" cy="340" r="40"/>
      <circle cx="520" cy="340" r="40"/>
    </g>

    <!-- Cotton Candy Cloud 1 (top left) -->
    <g id="cloud-1" stroke="black" stroke-width="4" fill="white">
      <path d="M 100 200 C 50 200 50 150 100 150 C 150 100 200 100 250 150 C 300 150 300 200 250 200 C 200 250 150 250 100 200 Z"/>
    </g>

    <!-- Cotton Candy Cloud 2 (top right) -->
    <g id="cloud-2" stroke="black" stroke-width="4" fill="white">
      <path d="M 500 180 C 450 180 450 130 500 130 C 550 80 600 80 650 130 C 700 130 700 180 650 180 C 600 230 550 230 500 180 Z"/>
    </g>
  </g>

  <!-- Candy Train -->
  <g id="candy-train" stroke="black" stroke-width="5" fill="white">
    <!-- Locomotive -->
    <g id="locomotive">
      <!-- Main body -->
      <rect x="50" y="650" width="200" height="100" rx="30" ry="30"/>
      <!-- Cabin -->
      <rect x="180" y="580" width="70" height="70" rx="15" ry="15"/>
      <rect x="195" y="595" width="40" height="40" rx="10" ry="10" stroke-width="3"/>
      <!-- Smoke stack -->
      <rect x="70" y="590" width="40" height="60" rx="15" ry="15"/>
      <ellipse cx="90" cy="590" rx="30" ry="20" fill="none" stroke-width="4"/>

      <!-- Face -->
      <g id="face" stroke-width="3">
        <circle cx="120" cy="690" r="10"/>
        <circle cx="160" cy="690" r="10"/>
        <path d="M 110 720 Q 140 735 170 720" fill="none"/>
      </g>

      <!-- Lollipop Wheels -->
      <g id="loco-wheels">
        <circle cx="100" cy="790" r="45"/>
        <circle cx="100" cy="790" r="30" stroke-width="3"/>
        <line x1="100" y1="790" x2="100" y2="835" stroke-width="3"/>
        <path d="M 75 790 Q 100 765 125 790 Q 100 815 75 790 Z" fill="none" stroke-width="2"/>

        <circle cx="200" cy="790" r="45"/>
        <circle cx="200" cy="790" r="30" stroke-width="3"/>
        <line x1="200" y1="790" x2="200" y2="835" stroke-width="3"/>
        <path d="M 175 790 Q 200 765 225 790 Q 200 815 175 790 Z" fill="none" stroke-width="2"/>
      </g>
    </g>

    <!-- Carriage 1 (behind locomotive) -->
    <g id="carriage-1">
      <rect x="270" y="670" width="180" height="80" rx="25" ry="25"/>
      <path d="M 250 710 L 270 710" stroke-width="3" fill="none"/> <!-- Connector -->
      <!-- Giant Candy inside carriage -->
      <ellipse cx="360" cy="710" rx="60" ry="30"/>
      <line x1="300" y1="710" x2="420" y2="710" stroke-width="3"/>
      <line x1="360" y1="680" x2="360" y2="740" stroke-width="3"/>

      <!-- Lollipop Wheels -->
      <g id="carriage1-wheels">
        <circle cx="320" cy="790" r="40"/>
        <circle cx="320" cy="790" r="25" stroke-width="3"/>
        <line x1="320" y1="790" x2="320" y2="830" stroke-width="3"/>
        <path d="M 298 790 Q 320 768 342 790 Q 320 812 298 790 Z" fill="none" stroke-width="2"/>

        <circle cx="400" cy="790" r="40"/>
        <circle cx="400" cy="790" r="25" stroke-width="3"/>
        <line x1="400" y1="790" x2="400" y2="830" stroke-width="3"/>
        <path d="M 378 790 Q 400 768 422 790 Q 400 812 378 790 Z" fill="none" stroke-width="2"/>
      </g>
    </g>

    <!-- Carriage 2 (further back) -->
    <g id="carriage-2">
      <rect x="470" y="670" width="180" height="80" rx="25" ry="25"/>
      <path d="M 450 710 L 470 710" stroke-width="3" fill="none"/> <!-- Connector -->
      <!-- Large Lollypop inside carriage -->
      <circle cx="560" cy="710" r="45"/>
      <line x1="560" y1="710" x2="560" y2="755" stroke-width="3"/>
      <path d="M 515 710 Q 560 665 605 710 Q 560 755 515 710 Z" fill="none" stroke-width="2"/>

      <!-- Lollipop Wheels -->
      <g id="carriage2-wheels">
        <circle cx="520" cy="790" r="40"/>
        <circle cx="520" cy="790" r="25" stroke-width="3"/>
        <line x1="520" y1="790" x2="520" y2="830" stroke-width="3"/>
        <path d="M 498 790 Q 520 768 542 790 Q 520 812 498 790 Z" fill="none" stroke-width="2"/>

        <circle cx="600" cy="790" r="40"/>
        <circle cx="600" cy="790" r="25" stroke-width="3"/>
        <line x1="600" y1="790" x2="600" y2="830" stroke-width="3"/>
        <path d="M 578 790 Q 600 768 622 790 Q 600 812 578 790 Z" fill="none" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>