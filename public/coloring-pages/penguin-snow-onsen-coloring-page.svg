<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for overall scene elements -->
  <g id="scene-elements">

    <!-- Group for winter background elements (snow mounds and distant trees) -->
    <g id="winter-background">
      <!-- Snow ground / mounds -->
      <path d="M0 850 Q100 800 200 850 T400 800 T600 850 T800 800 V1000 H0 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M0 900 C150 870 250 930 400 900 S650 870 800 900 V1000 H0 Z" fill="white" stroke="black" stroke-width="5"/>
      
      <!-- Distant snow-covered bushes/trees (simplified blobs) -->
      <path d="M100 400 C120 350 180 350 200 400 C220 450 180 450 160 400 C140 350 100 350 100 400 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M600 380 C620 330 680 330 700 380 C720 430 680 430 660 380 C640 330 600 330 600 380 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M400 350 C420 300 480 300 500 350 C520 400 480 400 460 350 C440 300 400 300 400 350 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Group for the hot spring onsen -->
    <g id="hot-spring">
      <!-- Outer rim of the hot spring -->
      <ellipse cx="400" cy="800" rx="300" ry="150" fill="white" stroke="black" stroke-width="5"/>
      <!-- Inner water area -->
      <ellipse cx="400" cy="800" rx="280" ry="130" fill="white" stroke="black" stroke-width="4"/>
      <!-- Simple water ripples -->
      <path d="M150 780 Q250 770 350 780 S550 770 650 780" fill="none" stroke="black" stroke-width="3"/>
      <path d="M160 810 Q260 800 360 810 S560 800 660 810" fill="none" stroke="black" stroke-width="3"/>
    </g>

    <!-- Group for the cute friendly penguin -->
    <g id="penguin">
      <!-- Body (partially submerged in the hot spring) -->
      <ellipse cx="400" cy="700" rx="150" ry="200" fill="white" stroke="black" stroke-width="5"/>
      <!-- Belly -->
      <ellipse cx="400" cy="720" rx="100" ry="140" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head -->
      <circle cx="400" cy="500" r="100" fill="white" stroke="black" stroke-width="5"/>
      <!-- Eyes -->
      <circle cx="360" cy="480" r="25" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="440" cy="480" r="25" fill="white" stroke="black" stroke-width="3"/>
      <!-- Beak -->
      <path d="M400 510 L380 540 Q400 560 420 540 L400 510 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Happy smile line -->
      <path d="M370 545 Q400 565 430 545" fill="none" stroke="black" stroke-width="3"/>
      <!-- Left Flipper -->
      <ellipse cx="270" cy="650" rx="40" ry="100" transform="rotate(-30 270 650)" fill="white" stroke="black" stroke-width="4"/>
      <!-- Right Flipper -->
      <ellipse cx="530" cy="650" rx="40" ry="100" transform="rotate(30 530 650)" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Group for steam bubbles rising from the hot spring -->
    <g id="steam-bubbles">
      <circle cx="200" cy="600" r="30" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="180" cy="550" r="20" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="250" cy="530" r="25" fill="white" stroke="black" stroke-width="3"/>
      
      <circle cx="350" cy="400" r="35" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="320" cy="350" r="25" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="400" cy="330" r="30" fill="white" stroke="black" stroke-width="3"/>
      
      <circle cx="600" cy="580" r="30" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="620" cy="530" r="20" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="550" cy="510" r="25" fill="white" stroke="black" stroke-width="3"/>
      
      <ellipse cx="400" cy="300" rx="50" ry="30" fill="white" stroke="black" stroke-width="3"/>
      <ellipse cx="280" cy="450" rx="40" ry="25" fill="white" stroke="black" stroke-width="3"/>
      <ellipse cx="520" cy="450" rx="40" ry="25" fill="white" stroke="black" stroke-width="3"/>
    </g>

  </g>
</svg>