<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <style>
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-nofill {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thick-outline {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thick-outline-nofill {
        stroke: black;
        stroke-width: 5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Mushroom House -->
  <g id="mushroom-house">
    <!-- Tree stump base -->
    <rect x="250" y="550" width="300" height="250" rx="40" ry="40" class="thick-outline"/>
    <!-- Mushroom cap -->
    <path d="M190 550 C100 350 700 350 610 550 L590 550 Q600 500 650 480 Q680 470 700 500 L700 550 L610 550 C600 500 500 300 100 500 C150 500 200 300 210 550 Z M590 550 L610 550" class="thick-outline"/>
    <path d="M590 550 C600 450 650 350 610 550" class="outline"/>
    <path d="M590 550 C600 450 650 350 610 550" class="outline"/>
    <path d="M210 550 C200 450 150 350 190 550" class="outline"/>
    <path d="M250 800 C270 850 530 850 550 800" class="outline"/>
    <!-- Door -->
    <ellipse cx="400" cy="700" rx="60" ry="80" class="thick-outline"/>
    <!-- Door knob -->
    <circle cx="450" cy="700" r="10" class="outline"/>
    <!-- Window on mushroom cap -->
    <circle cx="400" cy="450" r="30" class="thick-outline"/>
  </g>

  <!-- Fairy -->
  <g id="fairy">
    <!-- Body -->
    <ellipse cx="190" cy="670" rx="35" ry="60" transform="rotate(-15 190 670)" class="thick-outline"/>
    <!-- Head -->
    <circle cx="160" cy="600" r="40" class="thick-outline"/>
    <!-- Smile -->
    <path d="M140 610 Q160 625 180 610" class="outline-nofill"/>
    <!-- Eyes -->
    <circle cx="150" cy="590" r="5" class="outline"/>
    <circle cx="170" cy="590" r="5" class="outline"/>
    <!-- Arm (holding flower) -->
    <path d="M170 635 Q190 640 210 655" class="outline-nofill"/>
    <!-- Other arm -->
    <path d="M200 640 Q210 660 215 690" class="outline-nofill"/>
    <!-- Legs -->
    <path d="M170 720 Q160 750 150 770" class="outline-nofill"/>
    <path d="M200 720 Q210 750 220 770" class="outline-nofill"/>
    <!-- Delicate Wings -->
    <path d="M120 570 C80 500 160 480 190 560 C180 530 140 500 120 570 Z" class="thick-outline"/>
    <path d="M200 570 C240 500 160 480 130 560 C140 530 180 500 200 570 Z" class="thick-outline"/>
    <!-- Tiny Flower in hand -->
    <circle cx="220" cy="665" r="8" class="outline"/>
    <path d="M220 655 L225 660 L230 665 L225 670 L220 675 L215 670 L210 665 L215 660 Z" class="outline"/>
  </g>

  <!-- Simple Forest Elements -->
  <g id="forest-elements">
    <!-- Large friendly leaf 1 -->
    <path d="M500 850 Q550 820 580 800 Q650 780 680 850 Q600 900 500 850 Z" class="thick-outline"/>
    <!-- Large friendly leaf 2 -->
    <path d="M100 850 Q150 820 180 800 Q250 780 280 850 Q200 900 100 850 Z" class="thick-outline"/>
    <!-- Easy-to-draw flower 1 -->
    <circle cx="650" cy="900" r="20" class="thick-outline"/>
    <circle cx="650" cy="860" r="20" class="thick-outline"/>
    <circle cx="650" cy="940" r="20" class="thick-outline"/>
    <circle cx="610" cy="900" r="20" class="thick-outline"/>
    <circle cx="690" cy="900" r="20" class="thick-outline"/>
    <path d="M650 940 L650 980" class="outline-nofill"/>
    <path d="M640 980 Q650 990 660 980" class="outline-nofill"/>

    <!-- Easy-to-draw flower 2 -->
    <circle cx="80" cy="900" r="15" class="thick-outline"/>
    <circle cx="80" cy="870" r="15" class="thick-outline"/>
    <circle cx="80" cy="930" r="15" class="thick-outline"/>
    <circle cx="50" cy="900" r="15" class="thick-outline"/>
    <circle cx="110" cy="900" r="15" class="thick-outline"/>
    <path d="M80 930 L80 970" class="outline-nofill"/>
    <path d="M70 970 Q80 980 90 970" class="outline-nofill"/>

    <!-- Happy Ladybug -->
    <g transform="translate(700 650)">
      <circle cx="0" cy="0" r="30" class="thick-outline"/> <!-- Body -->
      <circle cx="-25" cy="-5" r="15" class="thick-outline"/> <!-- Head -->
      <path d="M0 -30 L0 30" class="outline-nofill"/> <!-- Center line -->
      <circle cx="15" cy="15" r="7" class="outline"/>
      <circle cx="-15" cy="15" r="7" class="outline"/>
      <circle cx="15" cy="-15" r="7" class="outline"/>
      <circle cx="-15" cy="-15" r="7" class="outline"/>
      <path d="M-25 -5 Q-30 -20 -40 -25" class="outline-nofill"/> <!-- Antenna 1 -->
      <path d="M-25 -5 Q-20 -20 -10 -25" class="outline-nofill"/> <!-- Antenna 2 -->
      <circle cx="-35" cy="-25" r="3" class="outline"/>
      <circle cx="-5" cy="-25" r="3" class="outline"/>
    </g>
  </g>
</svg>