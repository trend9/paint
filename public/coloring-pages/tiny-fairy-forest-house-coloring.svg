<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .outline-stroke-3 {
        stroke: black;
        stroke-width: 3;
        fill: none;
      }
      .outline-fill-white-stroke-3 {
        stroke: black;
        stroke-width: 3;
        fill: white;
      }
    </style>
  </defs>

  <!-- Ground element -->
  <path d="M0 850 Q400 800 800 850 L800 1000 L0 1000 Z" class="outline"/>

  <!-- Forest Elements Group -->
  <g id="forest-elements">
    <!-- Large leaves on ground -->
    <path d="M100 750 Q150 700 250 720 Q200 780 100 750 Z" class="outline"/>
    <line x1="160" y1="730" x2="190" y2="750" class="outline-stroke-3"/>

    <path d="M650 760 Q600 700 500 720 Q550 790 650 760 Z" class="outline"/>
    <line x1="570" y1="735" x2="540" y2="765" class="outline-stroke-3"/>

    <!-- Friendly Mushrooms -->
    <!-- Mushroom 1 -->
    <rect x="50" y="800" width="70" height="80" rx="30" ry="30" class="outline"/> <!-- Stem -->
    <ellipse cx="85" cy="790" rx="55" ry="35" class="outline"/> <!-- Cap -->
    <circle cx="70" cy="780" r="10" class="outline-fill-white-stroke-3"/> <!-- Spot -->
    <circle cx="100" cy="775" r="8" class="outline-fill-white-stroke-3"/> <!-- Spot -->
    <circle cx="85" cy="800" r="7" class="outline-fill-white-stroke-3"/> <!-- Spot -->

    <!-- Mushroom 2 (larger) -->
    <rect x="680" y="800" width="90" height="100" rx="40" ry="40" class="outline"/> <!-- Stem -->
    <ellipse cx="725" cy="780" rx="65" ry="45" class="outline"/> <!-- Cap -->
    <circle cx="700" cy="770" r="12" class="outline-fill-white-stroke-3"/> <!-- Spot -->
    <circle cx="745" cy="765" r="10" class="outline-fill-white-stroke-3"/> <!-- Spot -->
    <circle cx="720" cy="790" r="8" class="outline-fill-white-stroke-3"/> <!-- Spot -->

    <!-- Leaves on tree -->
    <path d="M280 600 Q260 550 300 520 Q320 570 280 600 Z" class="outline"/>
    <line x1="290" y1="560" x2="300" y2="540" class="outline-stroke-3"/>

    <path d="M500 650 Q520 600 560 620 Q540 670 500 650 Z" class="outline"/>
    <line x1="530" y1="635" x2="540" y2="655" class="outline-stroke-3"/>
  </g>

  <!-- Treehouse Group -->
  <g id="treehouse">
    <!-- Tree Trunk -->
    <path d="M300 900 C280 600 350 300 450 300 C550 300 600 600 580 900 Z" class="outline"/>
    <!-- Branch for the house to rest on -->
    <path d="M350 450 C330 400 380 380 430 380 C480 380 500 400 480 450 Z" class="outline"/>

    <!-- House structure -->
    <rect x="350" y="400" width="200" height="150" rx="20" ry="20" class="outline"/>
    <!-- Roof -->
    <path d="M330 420 L450 300 L570 420 Z" class="outline"/>
    <!-- Door -->
    <rect x="420" y="480" width="60" height="70" rx="10" ry="10" class="outline"/>
    <!-- Window -->
    <circle cx="450" cy="450" r="25" class="outline"/>
    <line x1="450" y1="425" x2="450" y2="475" class="outline-stroke-3"/>
    <line x1="425" y1="450" x2="475" y2="450" class="outline-stroke-3"/>
    <!-- Ladder -->
    <line x1="390" y1="550" x2="370" y2="650" class="outline-stroke-3"/>
    <line x1="420" y1="550" x2="400" y2="650" class="outline-stroke-3"/>
    <line x1="390" y1="570" x2="370" y2="580" class="outline-stroke-3"/>
    <line x1="405" y1="600" x2="385" y2="610" class="outline-stroke-3"/>
    <line x1="420" y1="630" x2="400" y2="640" class="outline-stroke-3"/>
  </g>

  <!-- Fairy Group -->
  <g id="fairy">
    <!-- Body -->
    <ellipse cx="335" cy="460" rx="25" ry="35" class="outline"/>
    <!-- Head -->
    <circle cx="335" cy="420" r="20" class="outline"/>
    <!-- Hair bun -->
    <circle cx="355" cy="410" r="10" class="outline"/>
    <!-- Eyes -->
    <circle cx="325" cy="415" r="2" class="outline-fill-white-stroke-3"/>
    <circle cx="345" cy="415" r="2" class="outline-fill-white-stroke-3"/>
    <!-- Smile -->
    <path d="M330 430 Q335 435 340 430" class="outline-stroke-3"/>
    <!-- Arms -->
    <path d="M315 445 Q305 455 310 465" class="outline-stroke-3"/>
    <path d="M355 445 Q365 455 360 465" class="outline-stroke-3"/>
    <!-- Legs (sitting on branch) -->
    <path d="M320 485 C315 490 310 495 305 500" class="outline-stroke-3"/> <!-- Thigh -->
    <path d="M305 500 C300 505 300 515 310 515" class="outline-stroke-3"/> <!-- Shin/foot -->

    <path d="M350 485 C355 490 360 495 365 500" class="outline-stroke-3"/> <!-- Thigh -->
    <path d="M365 500 C370 505 370 515 360 515" class="outline-stroke-3"/> <!-- Shin/foot -->

    <!-- Wings -->
    <path d="M315 420 Q295 390 315 370 Q335 390 315 420 Z" class="outline"/>
    <path d="M355 420 Q375 390 355 370 Q335 390 355 420 Z" class="outline"/>
    <!-- Antennae -->
    <path d="M335 400 L325 380" class="outline-stroke-3"/>
    <circle cx="325" cy="377" r="3" class="outline-fill-white-stroke-3"/>
    <path d="M335 400 L345 380" class="outline-stroke-3"/>
    <circle cx="345" cy="377" r="3" class="outline-fill-white-stroke-3"/>
  </g>

</svg>