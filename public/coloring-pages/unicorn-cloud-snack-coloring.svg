    <!-- Main Fluffy Cloud Body -->
    <path d="M 180,780 
             C 110,770 90,690 145,640 
             C 130,570 210,530 270,565 
             C 320,505 440,500 495,555 
             C 545,510 645,530 670,595 
             C 735,620 745,715 690,770 
             C 735,825 680,900 605,890 
             C 555,930 465,925 420,890 
             C 365,935 265,920 230,875 
             C 170,880 135,825 180,780 Z"/>
    
    <!-- Inner Cloud Outline Details for Coloring -->
    <path d="M 240,650 C 270,620 330,630 350,665" fill="none" stroke-width="4"/>
    <path d="M 470,640 C 510,610 570,625 585,670" fill="none" stroke-width="4"/>
    <path d="M 310,870 C 350,845 420,850 450,875" fill="none" stroke-width="4"/>
    <path d="M 170,720 C 205,710 235,735 240,760" fill="none" stroke-width="4"/>
    <path d="M 645,710 C 625,735 630,765 660,780" fill="none" stroke-width="4"/>
  </g>

  <!-- Unicorn Tail -->
  <g stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <path d="M 520,680 C 580,670 640,700 660,750 C 675,790 645,830 600,830 C 565,830 550,805 570,785 C 590,765 585,745 550,740 C 530,738 505,745 490,730"/>
    <path d="M 590,765 C 625,760 640,730 625,705" fill="none" stroke-width="4"/>
  </g>

  <!-- Unicorn Body & Hind Legs -->
  <g stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Chubby Body -->
    <path d="M 320,530 C 290,580 295,680 340,740 C 380,760 440,760 480,735 C 520,690 525,580 485,530 Z"/>

    <!-- Left Hind Leg & Foot (Sitter) -->
    <ellipse cx="295" cy="735" rx="55" ry="40" transform="rotate(-15 295 735)"/>
    <!-- Left Hoof Line -->
    <path d="M 265,710 C 285,725 285,745 270,765" fill="none" stroke-width="4"/>
    <!-- Cute Sole Heart Detail -->
    <path d="M 320,735 C 320,727 310,720 302,727 C 295,720 285,727 285,735 C 285,747 302,757 302,757 C 302,757 320,747 320,735 Z" stroke-width="3"/>

    <!-- Right Hind Leg & Foot (Sitter) -->
    <ellipse cx="505" cy="735" rx="55" ry="40" transform="rotate(15 505 735)"/>
    <!-- Right Hoof Line -->
    <path d="M 535,710 C 515,725 515,745 530,765" fill="none" stroke-width="4"/>
    <!-- Cute Sole Heart Detail -->
    <path d="M 515,735 C 515,727 505,720 498,727 C 490,720 480,727 480,735 C 480,747 498,757 498,757 C 498,757 515,747 515,735 Z" stroke-width="3"/>
  </g>

  <!-- Unicorn Mane (Back Layer) -->
