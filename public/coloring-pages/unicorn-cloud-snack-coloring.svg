    <!-- Top Right Star -->
    <path d="M 640,180 L 652,210 L 685,215 L 660,238 L 665,270 L 640,252 L 615,270 L 620,238 L 595,215 L 628,210 Z"/>

    <!-- Mid Right Star -->
    <path d="M 680,420 L 690,442 L 715,445 L 695,462 L 700,485 L 680,472 L 660,485 L 665,462 L 645,445 L 670,442 Z"/>

    <!-- Mid Left Star -->
    <path d="M 120,450 L 130,472 L 155,475 L 135,492 L 140,515 L 120,502 L 100,515 L 105,492 L 85,475 L 110,472 Z"/>

    <!-- Cute Floating Hearts -->
    <path d="M 230,340 C 230,325 210,315 195,330 C 180,315 160,325 160,340 C 160,365 195,385 195,385 C 195,385 230,365 230,340 Z"/>
    <path d="M 630,320 C 630,308 615,300 602,312 C 590,300 575,308 575,320 C 575,340 602,356 602,356 C 602,356 630,340 630,320 Z"/>

