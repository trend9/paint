    <!-- Left flowing hair tufts -->
    <path d="M 310,320 C 250,320 220,380 235,435 C 245,470 280,480 300,470 C 255,505 270,560 320,565"/>
    <path d="M 240,430 C 275,435 300,410 305,385" fill="none" stroke-width="4"/>
  </g>

