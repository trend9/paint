<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the entire scene, setting default stroke properties -->
  <g stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Rainbow - simple, bold arcs for coloring -->
    <g id="rainbow">
      <!-- Outermost rainbow band -->
      <path d="M 100 450 C 200 150, 600 150, 700 450 L 690 460 C 590 160, 210 160, 110 460 Z" fill="white"/>
      <!-- Middle rainbow band -->
      <path d="M 110 460 C 210 160, 590 160, 690 460 L 680 470 C 580 170, 220 170, 120 470 Z" fill="white"/>
      <!-- Innermost rainbow band -->
      <path d="M 120 470 C 220 170, 580 170, 680 470 L 670 480 C 570 180, 230 180, 130 480 Z" fill="white"/>
    </g>

    <!-- Fluffy Clouds - surrounding the locomotive -->
    <g id="clouds">
      <path d="M 100 650 C 50 600, 100 550, 180 550 C 260 550, 310 600, 300 650 C 350 700, 250 750, 150 700 Z" fill="white"/>
      <path d="M 500 700 C 450 650, 500 600, 580 600 C 660 600, 710 650, 700 700 C 750 750, 650 800, 550 750 Z" fill="white"/>
      <path d="M 350 500 C 320 470, 350 440, 400 440 C 450 440, 480 470, 470 500 C 500 530, 430 560, 380 530 Z" fill="white"/>
      <path d="M 600 400 C 570 370, 600 340, 650 340 C 700 340, 730 370, 720 400 C 750 430, 680 460, 630 430 Z" fill="white"/>
    </g>

    <!-- Cute Happy Steam Locomotive -->
    <g id="locomotive">
      <!-- Main boiler body -->
      <rect x="150" y="600" width="450" height="150" rx="75" ry="75" fill="white"/>
      <!-- Cab -->
      <rect x="480" y="520" width="150" height="100" rx="20" ry="20" fill="white"/>
      <!-- Cab window -->
      <rect x="500" y="535" width="80" height="70" rx="10" ry="10" fill="white"/>
      <!-- Chimney base -->
      <rect x="200" y="500" width="60" height="60" rx="15" ry="15" fill="white"/>
      <!-- Chimney top -->
      <ellipse cx="230" cy="500" rx="40" ry="20" fill="white"/>
      <!-- Headlight base -->
      <circle cx="150" cy="675" r="30" fill="white"/>
      <!-- Headlight lens -->
      <circle cx="150" cy="675" r="20" fill="white"/>
      <!-- Cowcatcher/Pilot -->
      <path d="M 150 750 L 250 750 L 280 800 L 120 800 Z" fill="white"/>
      <!-- Large drive wheels -->
      <circle cx="300" cy="800" r="70" fill="white"/>
      <circle cx="500" cy="800" r="70" fill="white"/>
      <!-- Inner detail for drive wheels -->
      <circle cx="300" cy="800" r="30" fill="white"/>
      <circle cx="500" cy="800" r="30" fill="white"/>
      <!-- Connecting rod -->
      <rect x="280" y="790" width="240" height="20" rx="10" ry="10" fill="white"/>
      <!-- Small front wheel -->
      <circle cx="180" cy="800" r="40" fill="white"/>
      <!-- Small back wheel -->
      <circle cx="600" cy="800" r="40" fill="white"/>
      <!-- Inner detail for small wheels -->
      <circle cx="180" cy="800" r="20" fill="white"/>
      <circle cx="600" cy="800" r="20" fill="white"/>
      <!-- Steam puff from chimney -->
      <path d="M 230 450 C 200 400, 200 350, 230 350 C 260 300, 290 300, 290 350 C 320 400, 320 450, 290 450 C 260 500, 200 500, 230 450 Z" fill="white"/>
      <!-- Friendly Eyes -->
      <ellipse cx="230" cy="650" rx="30" ry="25" fill="white"/>
      <ellipse cx="330" cy="650" rx="30" ry="25" fill="white"/>
      <!-- Pupils -->
      <circle cx="240" cy="655" r="8" fill="black" stroke-width="0"/>
      <circle cx="340" cy="655" r="8" fill="black" stroke-width="0"/>
      <!-- Happy Smile -->
      <path d="M 250 700 C 270 730, 290 730, 310 700 L 300 695 C 280 715, 260 715, 240 695 Z" fill="white"/>
    </g>

    <!-- Simple Stars - scattered in the sky -->
    <g id="stars">
      <path d="M 60 150 L 80 190 L 120 190 L 90 220 L 100 260 L 60 240 L 20 260 L 30 220 L 0 190 L 40 190 Z" fill="white"/>
      <path d="M 700 200 L 720 240 L 760 240 L 730 260 L 740 300 L 700 280 L 660 300 L 670 260 L 640 240 L 680 240 Z" fill="white"/>
      <path d="M 150 350 L 170 390 L 210 390 L 180 420 L 190 460 L 150 440 L 110 460 L 120 420 L 90 390 L 130 390 Z" fill="white"/>
      <path d="M 500 100 L 520 140 L 560 140 L 530 160 L 540 200 L 500 180 L 460 200 L 470 160 L 440 140 L 480 140 Z" fill="white"/>
      <path d="M 300 250 L 320 290 L 360 290 L 330 320 L 340 360 L 300 340 L 260 360 L 270 320 L 240 290 L 280 290 Z" fill="white"/>
    </g>

  </g>
</svg>