<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground/Picnic Blanket -->
  <ellipse cx="400" cy="900" rx="350" ry="120" fill="white" stroke="black" stroke-width="5"/>

  <!-- Background Trees -->
  <g id="trees">
    <!-- Tree 1 (left) -->
    <g id="tree1">
      <rect x="50" y="550" width="100" height="200" rx="40" ry="40" fill="white" stroke="black" stroke-width="5"/> <!-- Trunk -->
      <path d="M100,500 C50,400 50,300 100,250 C150,200 200,200 250,250 C300,300 300,400 250,500 C200,550 150,550 100,500 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Canopy -->
      <!-- Smiling Face for Tree 1 -->
      <circle cx="150" cy="350" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="190" cy="350" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M155,380 Q170,395 185,380" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
    </g>

    <!-- Tree 2 (right) -->
    <g id="tree2">
      <rect x="650" y="550" width="100" height="200" rx="40" ry="40" fill="white" stroke="black" stroke-width="5"/> <!-- Trunk -->
      <path d="M700,500 C650,400 650,300 700,250 C750,200 800,200 850,250 C800,300 800,400 750,500 C700,550 650,550 700,500 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Canopy -->
      <!-- Smiling Face for Tree 2 -->
      <circle cx="750" cy="350" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="790" cy="350" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M755,380 Q770,395 785,380" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
    </g>
  </g>

  <!-- Big Friendly Sun -->
  <g id="sun">
    <circle cx="400" cy="150" r="100" fill="white" stroke="black" stroke-width="5"/> <!-- Sun Body -->
    <!-- Rays -->
    <line x1="400" y1="50" x2="400" y2="25" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="500" y1="150" x2="525" y2="150" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="400" y1="250" x2="400" y2="275" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="150" x2="275" y2="150" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="470.7" y1="79.3" x2="491.4" y2="58.6" stroke="black" stroke-width="5" stroke-linecap="round"/> <!-- Top-right -->
    <line x1="329.3" y1="79.3" x2="308.6" y2="58.6" stroke="black" stroke-width="5" stroke-linecap="round"/> <!-- Top-left -->
    <line x1="470.7" y1="220.7" x2="491.4" y2="241.4" stroke="black" stroke-width="5" stroke-linecap="round"/> <!-- Bottom-right -->
    <line x1="329.3" y1="220.7" x2="308.6" y2="241.4" stroke="black" stroke-width="5" stroke-linecap="round"/> <!-- Bottom-left -->

    <!-- Sun Face -->
    <circle cx="370" cy="130" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
    <circle cx="430" cy="130" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
    <path d="M380,170 Q400,190 420,170" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
  </g>

  <!-- Dinosaurs -->
  <g id="dinosaurs">
    <!-- Dinosaur 1: Eating Sandwich (left) -->
    <g id="dinosaur1_eating">
      <path d="M250,750 Q200,650 250,600 Q350,550 400,600 Q450,650 400,750 Q300,800 250,750 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M280,630 Q270,580 300,580 Q330,580 320,630 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
      <path d="M300,680 L290,720 L310,720 L300,680 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Arm 1 (front) -->
      <path d="M240,770 L230,820 L270,820 L260,770 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Leg 1 -->
      <path d="M350,770 L340,820 L380,820 L370,770 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Leg 2 -->
      
      <!-- Face -->
      <circle cx="290" cy="595" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="310" cy="595" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M295,615 Q300,625 305,615" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->

      <!-- Sandwich -->
      <rect x="290" y="650" width="30" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/> <!-- Bread top -->
      <line x1="290" y1="660" x2="320" y2="660" stroke="black" stroke-width="2"/> <!-- Filling line -->
      <rect x="290" y="660" width="30" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/> <!-- Bread bottom -->
    </g>

    <!-- Dinosaur 2: Drinking Juice (right) -->
    <g id="dinosaur2_drinking">
      <path d="M550,750 Q500,650 550,600 Q650,550 700,600 Q750,650 700,750 Q600,800 550,750 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <path d="M580,630 Q570,580 600,580 Q630,580 620,630 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
      <path d="M600,680 L590,720 L610,720 L600,680 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Arm 1 (front) -->
      <path d="M540,770 L530,820 L570,820 L560,770 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Leg 1 -->
      <path d="M650,770 L640,820 L680,820 L670,770 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Leg 2 -->

      <!-- Face -->
      <circle cx="590" cy="595" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="610" cy="595" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M595,615 Q600,625 605,615" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->

      <!-- Juice Cup with Straw -->
      <rect x="600" y="650" width="25" height="40" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/> <!-- Cup Body -->
      <line x1="612.5" y1="650" x2="612.5" y2="620" stroke="black" stroke-width="3"/> <!-- Straw -->
    </g>
  </g>

  <!-- Picnic Basket -->
  <g id="picnic_basket">
    <path d="M470,850 C490,820 520,820 540,850 L540,870 C520,900 490,900 470,870 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Handle -->
    <rect x="440" y="800" width="120" height="70" rx="15" ry="15" fill="white" stroke="black" stroke-width="5"/> <!-- Basket body -->
    <ellipse cx="500" cy="800" rx="60" ry="15" fill="white" stroke="black" stroke-width="5"/> <!-- Basket opening rim -->

    <!-- Overflowing items -->
    <!-- Fruits -->
    <circle cx="460" cy="790" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Apple 1 -->
    <circle cx="520" cy="790" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Orange 1 -->
    <circle cx="480" cy="780" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Apple 2 -->
    
    <!-- Sandwiches -->
    <g transform="rotate(-15 510 782.5)">
      <rect x="490" y="770" width="40" height="25" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/> <!-- Sandwich 1 -->
      <line x1="490" y1="782.5" x2="530" y2="782.5" stroke="black" stroke-width="2"/>
    </g>
    <g transform="rotate(10 480 787.5)">
      <rect x="460" y="775" width="40" height="25" rx="5" ry="5" fill="white" stroke="black" stroke-width="3"/> <!-- Sandwich 2 -->
      <line x1="460" y1="787.5" x2="500" y2="787.5" stroke="black" stroke-width="2"/>
    </g>
  </g>

</svg>