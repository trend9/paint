<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">

  <!-- Meadow/Ground elements -->
  <g id="meadow">
    <path d="M0 700 Q150 650 400 700 T800 700 L800 1000 L0 1000 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sun -->
    <circle cx="700" cy="150" r="80" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="700" y1="230" x2="700" y2="280" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="700" y1="70" x2="700" y2="20" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="620" y1="150" x2="570" y2="150" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="780" y1="150" x2="830" y2="150" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="645" y1="205" x2="610" y2="240" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="755" y1="205" x2="790" y2="240" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="645" y1="95" x2="610" y2="60" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="755" y1="95" x2="790" y2="60" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Simple flowers/grass clumps -->
    <g transform="translate(100, 750)">
      <circle r="15" cx="0" cy="0" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="20" cy="0" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="-20" cy="0" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="0" cy="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="0" cy="-20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 0 L0 30" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(500, 800)">
      <circle r="15" cx="0" cy="0" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="20" cy="0" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="-20" cy="0" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="0" cy="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="10" cx="0" cy="-20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 0 L0 30" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Dinosaurs -->
  <g id="dinosaurs">
    <!-- Dino 1 (larger, sitting) -->
    <g transform="translate(200, 550)">
      <ellipse cx="0" cy="0" rx="100" ry="70" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Body -->
      <ellipse cx="120" cy="-60" rx="50" ry="40" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Head -->
      <path d="M70 -40 Q100 -50 120 -20 Q120 0 70 0 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Neck -->
      <path d="M-90 0 Q-150 20 -180 50 Q-150 40 -80 10 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Tail -->
      <ellipse cx="-50" cy="50" rx="30" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Leg 1 -->
      <ellipse cx="50" cy="50" rx="30" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Leg 2 -->
      <path d="M70 -10 Q100 0 100 40 Q80 30 60 20 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Arm -->
      <circle cx="140" cy="-65" r="8" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Eye 1 -->
      <circle cx="150" cy="-65" r="8" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Eye 2 -->
      <path d="M125 -40 Q140 -30 155 -40" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Mouth -->
    </g>

    <!-- Dino 2 (smaller, sitting) -->
    <g transform="translate(550, 600)">
      <ellipse cx="0" cy="0" rx="80" ry="60" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Body -->
      <ellipse cx="90" cy="-50" rx="40" ry="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Head -->
      <path d="M60 -30 Q80 -40 90 -15 Q90 0 60 0 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Neck -->
      <path d="M-70 0 Q-120 15 -140 40 Q-110 30 -60 8 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Tail -->
      <ellipse cx="-40" cy="40" rx="25" ry="15" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Leg 1 -->
      <ellipse cx="40" cy="40" rx="25" ry="15" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Leg 2 -->
      <path d="M50 -10 Q70 0 70 30 Q60 25 45 15 Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Arm -->
      <circle cx="100" cy="-55" r="7" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Eye 1 -->
      <circle cx="110" cy="-55" r="7" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Eye 2 -->
      <path d="M95 -35 Q105 -25 115 -35" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- Mouth -->
    </g>
  </g>

  <!-- Picnic Items -->
  <g id="picnic_items">
    <!-- Picnic Basket -->
    <g transform="translate(400, 650)">
      <rect x="-80" y="-50" width="160" height="80" rx="20" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-70" y="-60" width="140" height="20" rx="10" ry="10" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Lid top -->
      <path d="M-50 -70 A70 20 0 0 1 50 -70" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/> <!-- Handle -->
      <line x1="-70" y1="-50" x2="-70" y2="-60" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="70" y1="-50" x2="70" y2="-60" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sandwiches -->
    <g transform="translate(300, 680)">
      <rect x="-30" y="-20" width="60" height="40" rx="5" ry="5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-30 0 L30 0" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Slice line -->
    </g>
    <g transform="translate(480, 690)">
      <rect x="-30" y="-20" width="60" height="40" rx="5" ry="5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-30 0 L30 0" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Slice line -->
    </g>
    
    <!-- Juice cups with straws -->
    <g transform="translate(350, 640)">
      <rect x="-20" y="-40" width="40" height="60" rx="8" ry="8" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-40" rx="20" ry="8" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-15 -60 V-50 A10 10 0 0 1 15 -50 V-60" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/> <!-- Straw -->
    </g>
    <g transform="translate(450, 630)">
      <rect x="-20" y="-40" width="40" height="60" rx="8" ry="8" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="0" cy="-40" rx="20" ry="8" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-15 -60 V-50 A10 10 0 0 1 15 -50 V-60" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/> <!-- Straw -->
    </g>
  </g>
</svg>