<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="4" fill="white" stroke-linejoin="round" stroke-linecap="round">
  <!-- Sky Elements -->
  <g id="sky_elements">
    <!-- Sun -->
    <circle cx="700" cy="100" r="60" />
    <!-- Sun rays (fill="none" for lines) -->
    <path d="M700 170 L700 210 M650 145 L610 170 M750 145 L790 170 M620 100 L580 100 M780 100 L820 100 M650 55 L610 30 M750 55 L790 30 M700 30 L700 -10" fill="none"/>

    <!-- Clouds -->
    <path d="M100 100 Q80 70 120 50 T180 60 T220 90 T180 120 T120 130 Z" />
    <path d="M500 150 Q480 120 520 100 T580 110 T620 140 T580 170 T520 180 Z" />
  </g>

  <!-- Background Foliage -->
  <g id="background_foliage">
    <!-- Tree 1 -->
    <rect x="50" y="550" width="80" height="200" rx="20" ry="20" />
    <path d="M70 550 Q50 500 100 450 Q150 400 170 450 Q190 500 150 550 Z" /> <!-- Canopy -->
    
    <!-- Tree 2 -->
    <rect x="650" y="600" width="70" height="150" rx="20" ry="20" />
    <path d="M670 600 Q650 550 700 500 Q750 450 770 500 Q790 550 750 600 Z" /> <!-- Canopy -->

    <!-- Flower 1 -->
    <circle cx="300" cy="700" r="15" />
    <ellipse cx="285" cy="690" rx="10" ry="15" transform="rotate(-30 285 690)" />
    <ellipse cx="315" cy="690" rx="10" ry="15" transform="rotate(30 315 690)" />
    <ellipse cx="290" cy="710" rx="10" ry="15" transform="rotate(-90 290 710)" />
    <ellipse cx="310" cy="710" rx="10" ry="15" transform="rotate(90 310 710)" />
    <path d="M300 715 L300 780" fill="none" /> <!-- Stem -->

    <!-- Flower 2 -->
    <circle cx="180" cy="800" r="12" />
    <ellipse cx="168" cy="790" rx="8" ry="12" transform="rotate(-30 168 790)" />
    <ellipse cx="192" cy="790" rx="8" ry="12" transform="rotate(30 192 790)" />
    <ellipse cx="170" cy="810" rx="8" ry="12" transform="rotate(-90 170 810)" />
    <ellipse cx="190" cy="810" rx="8" ry="12" transform="rotate(90 190 810)" />
    <path d="M180 812 L180 860" fill="none" /> <!-- Stem -->
  </g>

  <!-- Picnic Scene -->
  <g id="picnic_scene">
    <!-- Picnic Blanket -->
    <path d="M150 800 Q100 750 200 700 L600 700 Q700 750 650 800 Z" />

    <!-- Food on blanket -->
    <!-- Apple -->
    <path d="M300 730 C300 720 310 710 320 720 C330 710 340 720 340 730 C340 740 330 750 320 750 C310 750 300 740 300 730 Z" />
    <path d="M320 715 L320 710" fill="none" /> <!-- Stem -->

    <!-- Banana -->
    <path d="M360 740 Q370 720 390 730 Q400 740 390 750 Q370 760 360 740 Z" />

    <!-- Cupcake -->
    <path d="M420 760 L450 760 L440 740 Q435 730 430 740 Z" /> <!-- Wrapper -->
    <path d="M420 740 C410 720 440 710 450 720 C460 710 490 720 480 740 Z" /> <!-- Frosting -->
  </g>

  <!-- Dinosaurs -->
  <g id="dinosaurs">
    <!-- Friendly T-Rex -->
    <g id="t_rex">
      <!-- Body -->
      <path d="M500 800 Q480 700 550 650 Q620 600 680 650 Q750 700 700 850 Q650 900 550 900 Z" />
      <!-- Head -->
      <path d="M580 680 Q550 650 580 600 Q630 550 680 580 Q710 610 680 650 Z" />
      <!-- Mouth -->
      <path d="M590 640 C600 645 620 645 630 640" fill="none" />
      <!-- Eye -->
      <circle cx="600" cy="610" r="10" />
      <!-- Arm 1 (holding sandwich) -->
      <path d="M600 700 Q580 720 600 740 Q620 720 600 700 Z" />
      <!-- Sandwich -->
      <rect x="585" y="730" width="50" height="30" rx="5" ry="5" />
      <rect x="588" y="735" width="44" height="20" rx="3" ry="3" fill="white" /> <!-- sandwich filling -->

      <!-- Arm 2 -->
      <path d="M630 700 Q610 720 630 740 Q650 720 630 700 Z" />
      <!-- Leg 1 -->
      <path d="M550 850 Q500 880 500 950 Q550 980 600 950 Q650 880 550 850 Z" />
      <!-- Leg 2 (behind) -->
      <path d="M620 860 Q570 890 570 960 Q620 990 670 960 Q720 890 620 860 Z" />
    </g>

    <!-- Gentle Triceratops -->
    <g id="triceratops">
      <!-- Body -->
      <path d="M150 800 Q100 700 200 650 Q300 600 350 700 Q400 800 250 850 Z" />
      <!-- Head and Frill -->
      <path d="M250 680 Q200 600 250 550 Q350 500 400 600 Q450 650 350 700 Z" />
      <!-- Eye -->
      <circle cx="280" cy="620" r="8" />
      <!-- Horns (fill="none" for lines) -->
      <path d="M290 560 L300 540 L310 560" fill="none" />
      <path d="M340 570 L350 550 L360 570" fill="none" />
      <path d="M250 650 L260 630 L270 650" fill="none" />
      <!-- Mouth (nibbling berry) -->
      <path d="M300 670 C310 675 320 675 330 670" fill="none" />
      <!-- Berry -->
      <circle cx="330" cy="680" r="7" />
    </g>

    <!-- Small Pterodactyl -->
    <g id="pterodactyl">
      <!-- Body -->
      <path d="M100 400 Q90 380 120 370 Q150 360 160 380 Q170 400 130 420 Z" />
      <!-- Head -->
      <path d="M120 370 Q110 360 120 350 Q140 340 150 360 Q160 370 140 380 Z" />
      <!-- Eye -->
      <circle cx="130" cy="360" r="5" />
      <!-- Beak -->
      <path d="M140 370 L160 370 L150 360 Z" />
      <!-- Wings -->
      <path d="M120 390 Q80 350 50 380 Q80 410 120 390 Z" />
      <path d="M160 390 Q200 350 230 380 Q200 410 160 390 Z" />
      <!-- Basket -->
      <path d="M120 430 Q110 440 130 440 Q150 440 140 430 Z" />
      <path d="M115 425 C120 420 130 420 135 425" fill="none" /> <!-- Basket handle -->
    </g>
  </g>
</svg>