<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="background_elements">
    <!-- Ground Line -->
    <path d="M0 850 Q400 820 800 850 L800 1000 L0 1000 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Simple Cloud 1 -->
    <path d="M100 150 Q150 100 200 150 Q250 100 300 150 Q250 200 200 150 Q150 200 100 150 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Simple Cloud 2 -->
    <path d="M500 100 Q550 50 600 100 Q650 50 700 100 Q650 150 600 100 Q550 150 500 100 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Simplified Bush 1 -->
    <ellipse cx="150" cy="800" rx="60" ry="30" fill="white" stroke="black" stroke-width="4"/>
    <!-- Simplified Bush 2 -->
    <ellipse cx="650" cy="810" rx="70" ry="35" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="lion_cub">
    <!-- Body - Crouched for pouncing -->
    <ellipse cx="400" cy="750" rx="180" ry="120" fill="white" stroke="black" stroke-width="5"/>

    <!-- Hind Legs -->
    <ellipse cx="280" cy="800" rx="60" ry="80" fill="white" stroke="black" stroke-width="5"/>
    <ellipse cx="520" cy="800" rx="60" ry="80" fill="white" stroke="black" stroke-width="5"/>
    <!-- Hind Paws -->
    <ellipse cx="280" cy="880" rx="45" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="520" cy="880" rx="45" ry="25" fill="white" stroke="black" stroke-width="4"/>

    <!-- Head - Forward, focused -->
    <circle cx="400" cy="580" r="100" fill="white" stroke="black" stroke-width="5"/>

    <!-- Ears -->
    <circle cx="330" cy="500" r="40" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="470" cy="500" r="40" fill="white" stroke="black" stroke-width="4"/>
    <!-- Inner Ears -->
    <circle cx="330" cy="500" r="20" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="470" cy="500" r="20" fill="white" stroke="black" stroke-width="3"/>

    <!-- Face Details -->
    <!-- Eyes -->
    <circle cx="360" cy="560" r="20" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="440" cy="560" r="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Nose -->
    <ellipse cx="400" cy="600" rx="25" ry="15" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth - Happy smile -->
    <path d="M360 630 Q400 650 440 630" fill="none" stroke="black" stroke-width="4"/>

    <!-- Front Limbs - Raised for pouncing -->
    <!-- Left Arm -->
    <ellipse cx="340" cy="670" rx="40" ry="80" transform="rotate(-20 340 670)" fill="white" stroke="black" stroke-width="5"/>
    <!-- Left Paw -->
    <ellipse cx="300" cy="600" rx="40" ry="25" transform="rotate(-20 300 600)" fill="white" stroke="black" stroke-width="4"/>
    <!-- Right Arm -->
    <ellipse cx="460" cy="670" rx="40" ry="80" transform="rotate(20 460 670)" fill="white" stroke="black" stroke-width="5"/>
    <!-- Right Paw -->
    <ellipse cx="500" cy="600" rx="40" ry="25" transform="rotate(20 500 600)" fill="white" stroke="black" stroke-width="4"/>

    <!-- Tail -->
    <path d="M550 780 Q650 720 700 800" fill="none" stroke="black" stroke-width="4"/>
    <circle cx="700" cy="800" r="30" fill="white" stroke="black" stroke-width="4"/> <!-- Tail tuft -->
  </g>

  <g id="butterfly">
    <!-- Body -->
    <ellipse cx="400" cy="450" rx="15" ry="30" fill="white" stroke="black" stroke-width="3"/>
    <!-- Wings -->
    <path d="M410 420 C460 390 480 430 450 460 C480 490 460 530 410 500 Z" fill="white" stroke="black" stroke-width="3"/>
    <path d="M390 420 C340 390 320 430 350 460 C320 490 340 530 390 500 Z" fill="white" stroke="black" stroke-width="3"/>
    <!-- Inner Wing Details (simple circles) -->
    <circle cx="445" cy="430" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="445" cy="490" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="355" cy="430" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="355" cy="490" r="10" fill="white" stroke="black" stroke-width="3"/>
    <!-- Antennae -->
    <path d="M400 420 Q410 390 420 400" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="420" cy="400" r="3" fill="white" stroke="black" stroke-width="3"/>
    <path d="M400 420 Q390 390 380 400" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="380" cy="400" r="3" fill="white" stroke="black" stroke-width="3"/>
  </g>
</svg>