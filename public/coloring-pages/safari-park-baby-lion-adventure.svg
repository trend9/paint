<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Sky elements: Sun -->
  <g id="sky-elements">
    <!-- Sun disk -->
    <circle cx="650" cy="150" r="80" fill="white" stroke="black" stroke-width="4"/>
    <!-- Sun rays (simplified as thick, rounded lines) -->
    <line x1="650" y1="70" x2="650" y2="230" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <line x1="570" y1="150" x2="730" y2="150" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <!-- Diagonal rays -->
    <line x1="590" y1="90" x2="710" y2="210" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <line x1="590" y1="210" x2="710" y2="90" stroke="black" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Distant landscape: Acacia tree and rock -->
  <g id="distant-landscape">
    <!-- Acacia Tree -->
    <g id="acacia-tree" transform="translate(100, 250)">
      <!-- Trunk -->
      <path d="M 0 300 C 10 200 70 200 80 300 L 70 350 C 60 380 20 380 10 350 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Canopy -->
      <path d="M -50 200 C -100 100 200 100 150 200 C 180 250 150 280 100 280 C 50 280 0 280 -50 200 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Rock -->
    <path d="M 500 700 C 480 650 550 630 600 650 C 650 670 680 720 650 750 C 620 780 520 780 500 700 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Foreground elements: Savanna grass and Lion Cub -->
  <g id="savanna-grass">
    <!-- Grass blades forming the ground line -->
    <path d="M 0 1000 C 100 900 200 950 300 900 C 400 850 500 900 600 850 C 700 800 800 850 800 1000 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 100 1000 C 150 920 250 970 350 920 C 450 870 550 920 650 870 C 750 820 800 870 800 1000 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 0 950 C 50 880 150 930 250 880 C 350 830 450 880 550 830 C 650 780 750 830 800 950 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Some individual blades sticking out -->
    <path d="M 300 850 C 310 820 320 800 330 850 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 450 800 C 460 770 470 750 480 800 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 550 770 C 560 740 570 720 580 770 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 200 900 C 210 870 220 850 230 900 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 680 820 C 690 790 700 770 710 820 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Cute happy baby lion cub playfully pouncing -->
  <g id="lion-cub" transform="translate(250, 450)"> 
    <!-- Mane (Simplified, large cloud-like shape behind head and upper body for fluffy look) -->
    <path d="M 50 150 C 0 100 0 0 100 -50 C 200 -100 300 -100 400 -50 C 500 0 500 100 450 150 C 400 200 300 250 200 250 C 100 250 50 200 50 150 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Body for pouncing pose -->
    <path d="M 100 280 C 70 230 80 180 130 150 L 180 130 C 230 110 300 120 350 160 C 400 200 420 250 400 300 C 380 350 250 380 150 350 C 120 330 100 300 100 280 Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Head -->
    <circle cx="200" cy="180" r="70" fill="white" stroke="black" stroke-width="4"/>

    <!-- Ears -->
    <ellipse cx="160" cy="120" rx="30" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="240" cy="120" rx="30" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <!-- Inner ears -->
    <ellipse cx="160" cy="120" rx="15" ry="20" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="240" cy="120" rx="15" ry="20" fill="white" stroke="black" stroke-width="3"/>

    <!-- Eyes -->
    <circle cx="175" cy="170" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="225" cy="170" r="15" fill="white" stroke="black" stroke-width="4"/>
    <!-- Eye pupils (small white circles) -->
    <circle cx="173" cy="172" r="5" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="223" cy="172" r="5" fill="white" stroke="black" stroke-width="3"/>

    <!-- Nose -->
    <ellipse cx="200" cy="195" rx="15" ry="8" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Mouth -->
    <path d="M 180 210 C 190 225 210 225 220 210" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 200 203 L 200 210" fill="none" stroke="black" stroke-width="4"/>

    <!-- Front Paws -->
    <!-- Raised pouncing paw -->
    <path d="M 330 220 C 310 200 300 190 320 180 C 340 170 360 180 360 200 C 360 220 340 240 330 240 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 320 210 L 330 200 L 340 210 L 350 200" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

    <!-- Other front paw (grounded, slightly hidden by grass) -->
    <path d="M 150 330 C 130 310 130 290 150 290 C 170 290 190 310 190 330 C 190 350 170 370 150 370 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 160 340 L 170 330 L 180 340 L 190 330" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

    <!-- Back Paws -->
    <path d="M 380 360 C 360 340 360 320 380 320 C 400 320 420 340 420 360 C 420 380 400 400 380 400 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 390 370 L 400 360 L 410 370 L 420 360" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

    <path d="M 50 380 C 30 360 30 340 50 340 C 70 340 90 360 90 380 C 90 400 70 420 50 420 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 60 390 L 70 380 L 80 390 L 90 380" fill="none" stroke="black" stroke-width="3"/> <!-- Toes -->

    <!-- Tail -->
    <path d="M 410 260 C 440 230 470 230 490 280 C 510 330 490 360 440 360" fill="none" stroke="black" stroke-width="4"/>
    <!-- Tail tuft -->
    <path d="M 440 360 C 430 370 420 360 410 350 C 400 340 410 330 420 340 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>
</svg>