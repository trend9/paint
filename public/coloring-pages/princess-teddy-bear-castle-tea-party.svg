<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <!-- Castle Room -->
  <g id="castle-room" stroke="black" stroke-width="5" fill="white">
    <!-- Main room wall/background area -->
    <rect x="50" y="50" width="700" height="900" fill="white" stroke="black" stroke-width="5"/>
    <!-- Window -->
    <g id="window" transform="translate(450, 100)">
      <rect x="0" y="0" width="250" height="350" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Window panes -->
      <line x1="125" y1="0" x2="125" y2="350" stroke="black" stroke-width="3"/>
      <line x1="0" y1="175" x2="250" y2="175" stroke="black" stroke-width="3"/>
    </g>
  </g>

  <!-- Princess -->
  <g id="princess" stroke="black" stroke-width="4" fill="white">
    <!-- Neck -->
    <rect x="270" y="400" width="20" height="20" rx="10" ry="10" fill="white" stroke-width="3"/>
    <!-- Head -->
    <circle cx="280" cy="350" r="60" fill="white"/>
    <!-- Hair fringe - simple arcs -->
    <path d="M225 350 Q250 310 280 300 Q310 310 335 350" fill="white" stroke="black" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="260" cy="360" r="8" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="300" cy="360" r="8" fill="white" stroke="black" stroke-width="2"/>
    <!-- Smile -->
    <path d="M265 385 Q280 395 295 385" fill="none" stroke="black" stroke-width="3"/>
    <!-- Crown -->
    <path d="M250 295 Q265 275 280 285 Q295 275 310 295 H250 Z" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="280" cy="280" r="5" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="255" cy="290" r="3" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="305" cy="290" r="3" fill="white" stroke="black" stroke-width="2"/>
    <!-- Dress Body -->
    <path d="M280 420 Q240 420 230 460 L200 650 C200 700 360 700 360 650 L330 460 Q320 420 280 420 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Arms -->
    <path d="M270 450 Q210 490 200 530 Q210 550 240 540 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left arm -->
    <path d="M290 450 Q350 490 360 530 Q350 550 320 540 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right arm -->
    <!-- Hands -->
    <circle cx="205" cy="535" r="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="355" cy="535" r="15" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Teddy Bear -->
  <g id="teddy-bear" stroke="black" stroke-width="4" fill="white">
    <!-- Head -->
    <circle cx="580" cy="390" r="60" fill="white"/>
    <!-- Ears -->
    <circle cx="540" cy="360" r="25" fill="white"/>
    <circle cx="620" cy="360" r="25" fill="white"/>
    <!-- Muzzle -->
    <ellipse cx="580" cy="405" rx="25" ry="18" fill="white" stroke="black" stroke-width="3"/>
    <!-- Nose -->
    <circle cx="580" cy="400" r="5" fill="white" stroke="black" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="560" cy="380" r="8" fill="white" stroke="black" stroke-width="2"/>
    <circle cx="600" cy="380" r="8" fill="white" stroke="black" stroke-width="2"/>
    <!-- Smile -->
    <path d="M570 415 Q580 425 590 415" fill="none" stroke="black" stroke-width="3"/>
    <!-- Body -->
    <rect x="520" y="440" width="120" height="150" rx="50" ry="50" fill="white"/>
    <!-- Arms -->
    <path d="M540 470 Q500 480 500 520 Q510 540 530 540 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Left arm -->
    <path d="M620 470 Q660 480 660 520 Q650 540 630 540 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Right arm -->
    <!-- Hands/Paws -->
    <circle cx="505" cy="530" r="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="655" cy="530" r="15" fill="white" stroke="black" stroke-width="3"/>
    <!-- Legs - mostly hidden by table, just simple shapes -->
    <rect x="530" y="560" width="40" height="60" rx="20" ry="20" fill="white"/>
    <rect x="590" y="560" width="40" height="60" rx="20" ry="20" fill="white"/>
  </g>

  <!-- Table -->
  <g id="table" stroke="black" stroke-width="4" fill="white">
    <ellipse cx="400" cy="550" rx="250" ry="80" fill="white"/> <!-- Tabletop -->
    <rect x="180" y="530" width="440" height="150" fill="white" rx="30" ry="30"/> <!-- Table body for depth -->
    <!-- Table legs - simplified -->
    <rect x="250" y="650" width="50" height="100" rx="10" ry="10" fill="white"/>
    <rect x="500" y="650" width="50" height="100" rx="10" ry="10" fill="white"/>
  </g>

  <!-- Tea Set -->
  <g id="tea-set" stroke="black" stroke-width="3" fill="white">
    <!-- Princess's Teacup -->
    <g id="princess-teacup">
      <ellipse cx="220" cy="560" rx="30" ry="15" fill="white" stroke-width="4"/> <!-- Top rim -->
      <path d="M190 560 V600 Q220 620 250 600 V560 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Cup body -->
      <path d="M250 580 Q265 580 265 590 Q265 600 250 600" fill="none" stroke="black" stroke-width="3"/> <!-- Handle -->
    </g>

    <!-- Teddy Bear's Teacup -->
    <g id="teddy-bear-teacup">
      <ellipse cx="370" cy="560" rx="30" ry="15" fill="white" stroke-width="4"/> <!-- Top rim -->
      <path d="M340 560 V600 Q370 620 400 600 V560 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Cup body -->
      <path d="M400 580 Q415 580 415 590 Q415 600 400 600" fill="none" stroke="black" stroke-width="3"/> <!-- Handle -->
    </g>

    <!-- Teapot -->
    <g id="teapot">
      <ellipse cx="490" cy="560" rx="40" ry="20" fill="white" stroke-width="4"/> <!-- Top rim -->
      <path d="M450 560 C430 600 430 640 490 640 C550 640 550 600 530 560 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Pot body -->
      <circle cx="490" cy="530" r="7" fill="white" stroke="black" stroke-width="3"/> <!-- Lid handle -->
      <ellipse cx="490" cy="540" rx="20" ry="10" fill="white" stroke="black" stroke-width="3"/> <!-- Lid -->
      <path d="M450 590 Q440 570 420 570 Q410 580 420 590 Q440 600 450 580" fill="none" stroke="black" stroke-width="3"/> <!-- Spout -->
      <path d="M530 580 Q550 570 550 590 Q550 610 530 600" fill="none" stroke="black" stroke-width="3"/> <!-- Handle -->
    </g>

    <!-- Cookies -->
    <g id="cookies-plate">
      <ellipse cx="600" cy="560" rx="45" ry="20" fill="white" stroke-width="4"/> <!-- Plate base -->
      <ellipse cx="600" cy="550" rx="40" ry="15" fill="white" stroke-width="4"/> <!-- Plate top -->
      <!-- Simple cookies -->
      <circle cx="585" cy="540" r="10" fill="white" stroke="black" stroke-width="2"/>
      <circle cx="615" cy="540" r="10" fill="white" stroke="black" stroke-width="2"/>
      <circle cx="600" cy="560" r="10" fill="white" stroke="black" stroke-width="2"/>
    </g>
  </g>
</svg>