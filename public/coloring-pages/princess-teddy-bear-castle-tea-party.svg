<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Castle Window in the background -->
  <g id="castle-window">
    <rect x="150" y="50" width="500" height="350" rx="40" ry="40" stroke="black" stroke-width="4" fill="white"/>
    <rect x="190" y="90" width="420" height="270" rx="20" ry="20" stroke="black" stroke-width="4" fill="white"/>
    <!-- Window panes -->
    <line x1="400" y1="90" x2="400" y2="360" stroke="black" stroke-width="4"/>
    <line x1="190" y1="225" x2="610" y2="225" stroke="black" stroke-width="4"/>
  </g>

  <!-- Tea Party Table -->
  <g id="tea-table">
    <circle cx="400" cy="650" r="150" stroke="black" stroke-width="4" fill="white"/>
    <rect x="370" y="650" width="60" height="150" rx="30" ry="30" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Princess Character -->
  <g id="princess">
    <!-- Dress body -->
    <path d="M 300 600 C 250 550, 250 400, 300 350 L 320 350 C 370 400, 370 550, 320 600 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 280 600 C 200 680, 200 800, 400 800 C 600 800, 600 680, 520 600 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 310 350 C 310 300, 320 280, 350 280 L 370 280 C 400 280, 410 300, 410 350 Z" stroke="black" stroke-width="4" fill="white"/>
    <!-- Head -->
    <circle cx="340" cy="240" r="50" stroke="black" stroke-width="4" fill="white"/>
    <!-- Hair -->
    <path d="M 300 210 Q 290 180, 330 170 Q 370 180, 360 210 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 300 220 Q 280 230, 290 260 Q 310 270, 300 220 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 380 220 Q 400 230, 390 260 Q 370 270, 380 220 Z" stroke="black" stroke-width="4" fill="white"/>
    <!-- Tiara -->
    <path d="M 320 190 L 330 170 L 340 190 L 350 170 L 360 190" stroke="black" stroke-width="4" fill="none"/>
    <circle cx="330" cy="190" r="3" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="350" cy="190" r="3" stroke="black" stroke-width="3" fill="white"/>
    <!-- Face features -->
    <circle cx="325" cy="235" r="5" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="355" cy="235" r="5" stroke="black" stroke-width="3" fill="white"/>
    <path d="M 335 255 Q 340 265, 345 255" stroke="black" stroke-width="3" fill="none"/>
    <!-- Arms -->
    <path d="M 320 380 Q 280 450, 290 550 C 290 550, 300 560, 320 500 C 320 500, 330 400, 320 380 Z" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="290" cy="550" r="15" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Teddy Bear Character -->
  <g id="teddy-bear">
    <!-- Body -->
    <path d="M 460 600 C 510 550, 510 400, 460 350 L 440 350 C 390 400, 390 550, 440 600 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 470 600 C 550 680, 550 800, 400 800 C 250 800, 250 680, 330 600 Z" stroke="black" stroke-width="4" fill="white"/>
    <!-- Head -->
    <circle cx="460" cy="240" r="50" stroke="black" stroke-width="4" fill="white"/>
    <!-- Ears -->
    <circle cx="430" cy="200" r="20" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="490" cy="200" r="20" stroke="black" stroke-width="4" fill="white"/>
    <!-- Snout -->
    <ellipse cx="460" cy="260" rx="25" ry="15" stroke="black" stroke-width="3" fill="white"/>
    <!-- Face features -->
    <circle cx="445" cy="235" r="5" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="475" cy="235" r="5" stroke="black" stroke-width="3" fill="white"/>
    <circle cx="460" cy="255" r="3" stroke="black" stroke-width="3" fill="white"/>
    <path d="M 450 265 Q 460 270, 470 265" stroke="black" stroke-width="3" fill="none"/>
    <!-- Arms -->
    <path d="M 480 380 Q 520 450, 510 550 C 510 550, 500 560, 480 500 C 480 500, 470 400, 480 380 Z" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="510" cy="550" r="15" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Tea Set on the table -->
  <g id="tea-set">
    <!-- Teacup -->
    <path d="M 330 580 C 310 570, 300 550, 300 530 L 310 510 C 330 500, 350 500, 370 510 L 380 530 C 380 550, 370 570, 350 580 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 370 530 C 385 535, 385 545, 370 550 C 370 550, 360 545, 370 530 Z" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="340" cy="510" rx="30" ry="10" stroke="black" stroke-width="4" fill="white"/>

    <!-- Teapot -->
    <path d="M 470 580 C 450 570, 440 550, 440 530 L 450 490 C 470 470, 490 470, 510 490 L 520 530 C 520 550, 510 570, 490 580 Z" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 520 500 Q 530 520, 520 540 Q 510 520, 520 500 Z" stroke="black" stroke-width="4" fill="white"/> <!-- Handle -->
    <path d="M 440 500 Q 430 480, 430 460 L 440 450 L 450 460 Q 450 480, 440 500 Z" stroke="black" stroke-width="4" fill="white"/> <!-- Spout -->
    <path d="M 470 470 C 460 465, 460 460, 470 455 C 480 450, 490 450, 500 455 C 510 460, 510 465, 500 470 Z" stroke="black" stroke-width="4" fill="white"/> <!-- Lid -->
    <circle cx="485" cy="450" r="5" stroke="black" stroke-width="3" fill="white"/> <!-- Lid knob -->

    <!-- Cupcake -->
    <path d="M 400 600 C 380 590, 370 580, 370 570 L 380 560 C 390 550, 410 550, 420 560 L 430 570 C 430 580, 420 590, 400 600 Z" stroke="black" stroke-width="4" fill="white"/>
    <ellipse cx="400" cy="560" rx="30" ry="10" stroke="black" stroke-width="4" fill="white"/>
    <path d="M 370 560 C 360 540, 370 530, 400 530 C 430 530, 440 540, 430 560 Z" stroke="black" stroke-width="4" fill="white"/>
    <circle cx="400" cy="525" r="8" stroke="black" stroke-width="4" fill="white"/> <!-- Cherry -->
  </g>
</svg>