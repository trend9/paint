<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <clipPath id="blanket-clip">
      <path d="M 120 740 L 680 740 L 740 920 L 60 920 Z"/>
    </clipPath>
  </defs>

  <!-- Background: Pure White -->
  <rect width="800" height="1000" fill="white"/>

  <!-- ================= SKY & BACKGROUND ================= -->
  <g id="sky-elements" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Friendly Sun -->
    <g id="sun">
      <!-- Sun Rays -->
      <line x1="700" y1="120" x2="700" y2="60" stroke-width="5"/>
      <line x1="755" y1="140" x2="800" y2="110" stroke-width="5"/>
      <line x1="780" y1="195" x2="835" y2="210" stroke-width="5"/>
      <line x1="755" y1="250" x2="800" y2="280" stroke-width="5"/>
      <line x1="700" y1="270" x2="700" y2="330" stroke-width="5"/>
      <line x1="645" y1="250" x2="600" y2="280" stroke-width="5"/>
      <line x1="620" y1="195" x2="565" y2="210" stroke-width="5"/>
      <line x1="645" y1="140" x2="600" y2="110" stroke-width="5"/>
      <!-- Sun Body -->
      <circle cx="700" cy="195" r="55" stroke-width="5"/>
      <!-- Sun Face -->
      <circle cx="680" cy="185" r="5" fill="black"/>
      <circle cx="720" cy="185" r="5" fill="black"/>
      <path d="M 685 205 Q 700 225 715 205" fill="none" stroke-width="4"/>
      <!-- Rosy Cheeks -->
      <circle cx="672" cy="202" r="6" fill="none" stroke-width="2"/>
      <circle cx="728" cy="202" r="6" fill="none" stroke-width="2"/>
    </g>

    <!-- Fluffy Clouds -->
    <g id="clouds">
      <!-- Left Cloud -->
      <path d="M 100 180 
               A 30 30 0 0 1 140 140 
               A 40 40 0 0 1 210 130 
               A 35 35 0 0 1 260 160 
               A 30 30 0 0 1 250 210 
               L 110 210 
               A 25 25 0 0 1 100 180 Z" stroke-width="4"/>
      <!-- Center Cloud -->
      <path d="M 380 130 
               A 25 25 0 0 1 410 100 
               A 35 35 0 0 1 470 95 
               A 30 30 0 0 1 510 125 
               A 25 25 0 0 1 495 160 
               L 390 160 
               A 20 20 0 0 1 380 130 Z" stroke-width="4"/>
    </g>

    <!-- Gentle Rolling Hills -->
    <g id="hills">
      <path d="M -20 540 Q 200 480 450 520 T 820 480" fill="none" stroke-width="4"/>
      <path d="M -20 590 Q 220 570 420 610 T 820 580" fill="none" stroke-width="5"/>
    </g>
  </g>

  <!-- ================= PICNIC BLANKET ================= -->
  <g id="picnic-blanket">
    <!-- Blanket Base -->
    <path d="M 120 740 L 680 740 L 740 920 L 60 920 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Checkered Pattern Lines (Clipped to Blanket) -->
    <g clip-path="url(#blanket-clip)" stroke="black" stroke-width="3" fill="none">
      <!-- Horizontal lines -->
      <line x1="0" y1="775" x2="800" y2="775"/>
      <line x1="0" y1="810" x2="800" y2="810"/>
      <line x1="0" y1="845" x2="800" y2="845"/>
      <line x1="0" y1="880" x2="800" y2="880"/>
      
      <!-- Perspective Vertical Lines -->
      <line x1="190" y1="740" x2="145" y2="920"/>
      <line x1="260" y1="740" x2="230" y2="920"/>
      <line x1="330" y1="740" x2="315" y2="920"/>
      <line x1="400" y1="740" x2="400" y2="920"/>
      <line x1="470" y1="740" x2="485" y2="920"/>
      <line x1="540" y1="740" x2="570" y2="920"/>
      <line x1="610" y1="740" x2="655" y2="920"/>
    </g>

    <!-- Blanket Fringe / Corners -->
    <path d="M 50 920 L 70 920 M 730 920 L 750 920" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ================= BRONTOSAURUS (LEFT) ================= -->
  <g id="brontosaurus" stroke="black" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Tail -->
    <path d="M 140 730 C 90 730 40 710 20 670 C 15 660 20 650 30 655 C 55 670 90 690 150 695" stroke-width="5"/>
    
    <!-- Back Leg Left -->
    <rect x="110" y="700" width="40" height="70" rx="20" stroke-width="5"/>
    
    <!-- Body -->
    <path d="M 130 710 C 120 640 160 580 230 580 C 270 580 300 600 310 640 C 320 680 300 730 250 740 C 190 750 140 740 130 710 Z" stroke-width="5"/>

    <!-- Front Leg Left -->
    <rect x="220" y="700" width="38" height="70" rx="19" stroke-width="5"/>
    <!-- Feet Toes -->
    <circle cx="230" cy="765" r="4" fill="none" stroke-width="3"/>
    <circle cx="245" cy="765" r="4" fill="none" stroke-width="3"/>
    <circle cx="120" cy="765" r="4" fill="none" stroke-width="3"/>
    <circle cx="135" cy="765" r="4" fill="none" stroke-width="3"/>

    <!-- Neck and Head -->
    <!-- Neck curving up from body -->
    <path d="M 255 600 
             C 270 530 270 420 250 360 
             C 240 330 250 300 280 295 
             C 315 290 340 310 340 335 
             C 340 360 315 375 295 375
             C 290 440 295 530 290 615" stroke-width="5"/>

    <!-- Head Details -->
    <!-- Cute Dinosaur Eye -->
    <circle cx="295" cy="325" r="10" stroke-width="3"/>
    <circle cx="298" cy="323" r="4" fill="black"/>
    <circle cx="293" cy="321" r="2" fill="white"/>

    <!-- Smiling Mouth -->
    <path d="M 315 345 Q 330 355 335 340" fill="none" stroke-width="4"/>
    <!-- Cute Muzzle Line -->
    <circle cx="328" cy="330" r="2" fill="black"/> <!-- Nostril -->

    <!-- Decorative Spots on Back -->
    <ellipse cx="180" cy="630" rx="12" ry="8" stroke-width="3"/>
    <ellipse cx="210" cy="620" rx="15" ry="10" stroke-width="3"/>
    <ellipse cx="195" cy="660" rx="10" ry="7" stroke-width="3"/>
    <ellipse cx="260" cy="460" rx="7" ry="14" stroke-width="3"/>
    <ellipse cx="265" cy="510" rx="8" ry="16" stroke-width="3"/>

    <!-- Little Cheerful Blush -->
    <circle cx="310" cy="355" r="6" stroke-width="2"/>
  </g>

  <!-- ================= STEGOSAURUS (RIGHT) ================= -->
  <g id="stegosaurus" stroke="black" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Back Plates (Dorsal Fins) -->
    <!-- Plate 1 (Front/Neck) -->
    <path d="M 505 575 Q 495 535 515 530 Q 530 545 525 580 Z" stroke-width="4"/>
    <!-- Plate 2 -->
    <path d="M 535 555 Q 535 505 560 500 Q 580 520 565 560 Z" stroke-width="4"/>
    <!-- Plate 3 (Top) -->
    <path d="M 580 545 Q 590 485 620 485 Q 640 510 620 550 Z" stroke-width="4"/>
    <!-- Plate 4 -->
    <path d="M 635 550 Q 655 500 680 505 Q 695 535 670 565 Z" stroke-width="4"/>
    <!-- Plate 5 (Near Tail) -->
    <path d="M 685 570 Q 715 535 735 550 Q 735 575 705 595 Z" stroke-width="4"/>

    <!-- Tail -->
    <path d="M 690 655 C 730 650 760 630 780 610 C 765 635 745 670 670 690" stroke-width="5"/>
    
    <!-- Tail Spikes (Thagomizer - Cute & Rounded) -->
    <path d="M 755 615 C 770 600 785 600 780 610 Z" stroke-width="4"/>
    <path d="M 770 625 C 790 620 795 630 780 635 Z" stroke-width="4"/>

    <!-- Stegosaurus Body -->
    <path d="M 480 670 
             C 490 565 570 535 650 555 
             C 695 570 710 630 690 685 
             C 670 735 630 740 570 740 
             C 510 740 480 720 480 670 Z" stroke-width="5"/>

    <!-- Stegosaurus Head -->
    <path d="M 495 640 
             C 480 630 435 635 415 655 
             C 405 665 410 685 430 690 
             C 455 695 480 685 495 675 Z" stroke-width="5"/>

    <!-- Back Leg -->
    <rect x="620" y="675" width="45" height="70" rx="22" stroke-width="5"/>
    <!-- Front Leg -->
    <rect x="515" y="675" width="42" height="70" rx="21" stroke-width="5"/>

    <!-- Toenails -->
    <circle cx="528" cy="740" r="4" fill="none" stroke-width="3"/>
    <circle cx="542" cy="740" r="4" fill="none" stroke-width="3"/>
    <circle cx="633" cy="740" r="4" fill="none" stroke-width="3"/>
    <circle cx="648" cy="740" r="4" fill="none" stroke-width="3"/>

    <!-- Stego Eye -->
    <circle cx="440" cy="658" r="9" stroke-width="3"/>
    <circle cx="438" cy="656" r="4" fill="black"/>
    <circle cx="441" cy="654" r="2" fill="white"/>

    <!-- Stego Smile -->
    <path d="M 420 672 Q 430 682 445 675" fill="none" stroke-width="4"/>
    <circle cx="422" cy="660" r="2" fill="black"/> <!-- Nostril -->

    <!-- Cheek Blush -->
    <circle cx="455" cy="672" r="5" stroke-width="2"/>

    <!-- Body Spots -->
    <circle cx="540" cy="620" r="10" stroke-width="3"/>
    <circle cx="580" cy="600" r="14" stroke-width="3"/>
    <circle cx="630" cy="625" r="11" stroke-width="3"/>
    <circle cx="590" cy="645" r="8" stroke-width="3"/>
  </g>

  <!-- ================= PICNIC BASKET & FOOD ================= -->
  <g id="picnic-goodies" stroke="black" stroke-linecap="round" stroke-linejoin="round" fill="white">
    
    <!-- Picnic Basket (Center Back) -->
    <g id="basket">
      <!-- Handle -->
      <path d="M 360 670 C 360 620 440 620 440 670" fill="none" stroke-width="6"/>
      <!-- Basket Lid Rim -->
      <path d="M 335 670 L 465 670 L 460 685 L 340 685 Z" stroke-width="4"/>
      <!-- Basket Base -->
      <path d="M 342 685 L 458 685 L 448 745 L 352 745 Z" stroke-width="4"/>
      <!-- Woven Details -->
      <line x1="375" y1="685" x2="370" y2="745" stroke-width="3"/>
      <line x1="400" y1="685" x2="400" y2="745" stroke-width="3"/>
      <line x1="425" y1="685" x2="430" y2="745" stroke-width="3"/>
      <line x1="347" y1="715" x2="453" y2="715" stroke-width="3"/>
      <!-- Cute Bow on Basket -->
      <circle cx="400" cy="670" r="6" stroke-width="3"/>
      <path d="M 400 670 C 385 660 380 680 395 673 Z" stroke-width="3"/>
      <path d="M 400 670 C 415 660 420 680 405 673 Z" stroke-width="4"/>
    </g>

    <!-- Plate Left: Sandwiches -->
    <g id="sandwiches">
      <!-- Plate -->
      <ellipse cx="280" cy="800" rx="55" ry="22" stroke-width="4"/>
      <ellipse cx="280" cy="800" rx="42" ry="16" stroke-width="2"/>
      
      <!-- Sandwich 1 (Triangle cut) -->
      <path d="M 250 790 L 290 775 L 295 800 Z" stroke-width="4"/>
      <path d="M 250 790 L 255 798 L 295 808 L 295 800" stroke-width="3"/>
      <!-- Filling details peek -->
      <path d="M 254 795 Q 275 790 295 804" stroke-width="3"/>

      <!-- Sandwich 2 -->
      <path d="M 275 785 L 315 770 L 320 795 Z" stroke-width="4"/>
      <path d="M 275 785 L 280 793 L 320 803 L 320 795" stroke-width="3"/>
    </g>

    <!-- Plate Right: Fruit -->
    <g id="fruit-plate">
      <!-- Plate -->
      <ellipse cx="500" cy="805" rx="55" ry="22" stroke-width="4"/>
      <ellipse cx="500" cy="805" rx="42" ry="16" stroke-width="2"/>

      <!-- Big Cute Apple -->
      <g id="apple">
        <path d="M 470 785 
                 C 455 765 470 745 485 755 
                 C 500 745 515 765 500 785 
                 C 485 800 475 795 470 785 Z" stroke-width="4"/>
        <!-- Apple Stem & Leaf -->
        <path d="M 485 755 Q 490 740 485 735" fill="none" stroke-width="3"/>
        <path d="M 488 745 Q 505 740 500 750 Q 490 750 488 745 Z" stroke-width="3"/>
      </g>

      <!-- Banana -->
      <path d="M 505 790 
               C 525 780 545 760 540 745 
               C 545 755 535 785 515 800 
               C 510 800 505 795 505 790 Z" stroke-width="4"/>
      <!-- Banana Tips -->
      <line x1="540" y1="745" x2="543" y2="742" stroke-width="4"/>

      <!-- Strawberries / Grapes -->
      <circle cx="465" cy="795" r="8" stroke-width="3"/>
      <circle cx="525" cy="795" r="8" stroke-width="3"/>
    </g>

    <!-- Drinks / Juice Cups with Straws -->
    <g id="drink-cups">
      <!-- Cup Left -->
      <path d="M 355 775 L 385 775 L 380 820 L 360 820 Z" stroke-width="4"/>
      <ellipse cx="370" cy="775" rx="15" ry="4" stroke-width="3"/>
      <!-- Striped Straw -->
      <path d="M 370 775 L 370 745 L 385 735" fill="none" stroke-width="4"/>

      <!-- Cup Right -->
      <path d="M 415 780 L 445 780 L 440 825 L 420 825 Z" stroke-width="4"/>
      <ellipse cx="430" cy="780" rx="15" ry="4" stroke-width="3"/>
      <!-- Straw -->
      <path d="M 430 780 L 430 750 L 415 740" fill="none" stroke-width="4"/>
    </g>

    <!-- Slices of Watermelon in Front -->
    <g id="watermelon">
      <path d="M 365 850 
               C 390 885 425 885 450 850 
               Z" stroke-width="4"/>
      <!-- Rind Line -->
      <path d="M 370 857 C 395 878 420 878 445 857" fill="none" stroke-width="3"/>
      <!-- Seeds -->
      <circle cx="395" cy="860" r="2" fill="black"/>
      <circle cx="410" cy="866" r="2" fill="black"/>
      <circle cx="422" cy="860" r="2" fill="black"/>
    </g>
  </g>

  <!-- ================= NATURE DETAILS & FLOWERS ================= -->
  <g id="flowers-and-grass" stroke="black" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Grass Tuft Bottom-Left -->
    <path d="M 30 960 Q 35 930 20 920 Q 40 935 45 960" stroke-width="4"/>
    <path d="M 45 960 Q 55 925 65 915 Q 65 940 55 960" stroke-width="4"/>

    <!-- Daisy Flower Left -->
    <g id="flower-1">
      <circle cx="95" cy="945" r="7" stroke-width="3"/>
      <!-- Petals -->
      <circle cx="95" cy="932" r="6" stroke-width="3"/>
      <circle cx="108" cy="940" r="6" stroke-width="3"/>
      <circle cx="104" cy="955" r="6" stroke-width="3"/>
      <circle cx="86" cy="955" r="6" stroke-width="3"/>
      <circle cx="82" cy="940" r="6" stroke-width="3"/>
      <!-- Stem -->
      <path d="M 95 958 L 95 980" stroke-width="4"/>
      <path d="M 95 970 Q 105 965 110 970" stroke-width="3"/>
    </g>

    <!-- Daisy Flower Right -->
    <g id="flower-2">
      <circle cx="715" cy="950" r="7" stroke-width="3"/>
      <!-- Petals -->
      <circle cx="715" cy="937" r="6" stroke-width="3"/>
      <circle cx="728" cy="945" r="6" stroke-width="3"/>
      <circle cx="724" cy="960" r="6" stroke-width="3"/>
      <circle cx="706" cy="960" r="6" stroke-width="3"/>
      <circle cx="702" cy="945" r="6" stroke-width="3"/>
      <!-- Stem -->
      <path d="M 715 963 L 715 985" stroke-width="4"/>
      <!-- Leaf -->
      <path d="M 715 975 Q 700 970 700 980" stroke-width="3"/>
    </g>

    <!-- Small Flower Middle Bottom -->
    <g id="flower-3">
      <circle cx="270" cy="955" r="5" stroke-width="3"/>
      <circle cx="270" cy="945" r="5" stroke-width="3"/>
      <circle cx="280" cy="952" r="5" stroke-width="3"/>
      <circle cx="276" cy="963" r="5" stroke-width="3"/>
      <circle cx="264" cy="963" r="5" stroke-width="3"/>
      <circle cx="260" cy="952" r="5" stroke-width="3"/>
      <path d="M 270 968 L 270 985" stroke-width="3"/>
    </g>

    <!-- Grass Tuft Bottom-Right -->
    <path d="M 750 960 Q 765 930 780 925 Q 770 945 765 965" stroke-width="4"/>

    <!-- Cute Friendly Butterflies / Flying Bugs -->
    <!-- Butterfly Top Left -->
    <g id="butterfly">
      <path d="M 170 380 Q 150 360 160 345 Q 175 350 172 375" stroke-width="3"/>
      <path d="M 175 380 Q 195 360 185 345 Q 170 350 173 375" stroke-width="3"/>
      <path d="M 171 380 Q 155 395 165 405 Q 175 395 173 385" stroke-width="3"/>
      <path d="M 174 380 Q 190 395 180 405 Q 170 395 172 385" stroke-width="3"/>
      <line x1="172.5" y1="370" x2="172.5" y2="395" stroke-width="3"/>
      <!-- Antennae -->
      <path d="M 172 370 Q 165 360 160 362" stroke-width="2"/>
      <path d="M 173 370 Q 180 360 185 362" stroke-width="2"/>
    </g>
  </g>

  <!-- Ground Edge Thick Border Line -->
  <line x1="0" y1="995" x2="800" y2="995" stroke="black" stroke-width="10"/>
</svg>