<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g stroke="black" stroke-width="4" fill="white">

    <!-- Mushroom House -->
    <g id="mushroom-house">
      <!-- Mushroom Stem -->
      <path d="M 300 850 Q 250 700 350 550 C 450 550 550 700 500 850 Z" />
      <!-- Mushroom Cap -->
      <path d="M 250 580 C 150 450 650 450 550 580 Q 500 500 400 500 Q 300 500 250 580 Z" />
      <!-- Door -->
      <rect x="360" y="700" width="80" height="120" rx="20" ry="20" />
      <!-- Doorknob -->
      <circle cx="420" cy="760" r="8" fill="white" stroke="black" stroke-width="3"/>
      <!-- Windows -->
      <circle cx="300" cy="650" r="30" />
      <circle cx="500" cy="650" r="30" />
    </g>

    <!-- Fairy -->
    <g id="fairy">
      <!-- Fairy Body (sitting) -->
      <path d="M 400 680 C 380 650 380 600 400 580 C 420 560 440 560 460 580 C 480 600 480 650 460 680 Z" />
      <!-- Fairy Head -->
      <circle cx="430" cy="540" r="40" />
      <!-- Fairy Face features -->
      <!-- Eyes -->
      <circle cx="415" cy="530" r="5" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="445" cy="530" r="5" fill="white" stroke="black" stroke-width="3"/>
      <!-- Smile -->
      <path d="M 415 550 Q 430 560 445 550" fill="none" stroke="black" stroke-width="3"/>
      <!-- Arms -->
      <path d="M 410 600 Q 390 610 390 630" fill="none" stroke="black" stroke-width="4"/>
      <path d="M 450 600 Q 470 610 470 630" fill="none" stroke="black" stroke-width="4"/>
      <!-- Hands -->
      <circle cx="390" cy="630" r="8" />
      <circle cx="470" cy="630" r="8" />
      <!-- Wings -->
      <g fill="none" stroke="black" stroke-width="3">
        <path d="M 400 540 C 350 480 300 480 350 540 C 300 600 350 600 400 540 Z" />
        <path d="M 460 540 C 510 480 560 480 510 540 C 560 600 510 600 460 540 Z" />
      </g>
    </g>

    <!-- Flowers and Leaves -->
    <g id="foliage">
      <!-- Large flower 1 -->
      <circle cx="200" cy="880" r="20" /> <!-- Center -->
      <ellipse cx="200" cy="850" rx="15" ry="25" />
      <ellipse cx="200" cy="910" rx="15" ry="25" />
      <ellipse cx="170" cy="880" rx="25" ry="15" />
      <ellipse cx="230" cy="880" rx="25" ry="15" />
      <!-- Large flower 2 -->
      <circle cx="600" cy="880" r="20" /> <!-- Center -->
      <ellipse cx="600" cy="850" rx="15" ry="25" />
      <ellipse cx="600" cy="910" rx="15" ry="25" />
      <ellipse cx="570" cy="880" rx="25" ry="15" />
      <ellipse cx="630" cy="880" rx="25" ry="15" />
      <!-- Leaf 1 -->
      <path d="M 280 850 Q 250 820 280 790 Q 310 820 280 850 Z" />
      <!-- Leaf 2 -->
      <path d="M 520 850 Q 550 820 520 790 Q 490 820 520 850 Z" />
      <!-- Leaf 3 (left of house) -->
      <path d="M 250 750 Q 220 720 250 690 Q 280 720 250 750 Z" />
      <!-- Leaf 4 (right of house) -->
      <path d="M 550 750 Q 580 720 550 690 Q 520 720 550 750 Z" />
    </g>

  </g>
</svg>