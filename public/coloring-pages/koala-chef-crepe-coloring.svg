<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Counter -->
  <g id="counter">
    <rect x="50" y="700" width="700" height="200" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <rect x="60" y="690" width="680" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Countertop edge -->
  </g>

  <!-- Items on Counter -->
  <g id="counter-items">
    <!-- Bowl of fruits -->
    <g id="fruit-bowl">
      <ellipse cx="200" cy="670" rx="80" ry="40" fill="white" stroke="black" stroke-width="4"/> <!-- Bowl top edge -->
      <path d="M120 670 Q120 720 200 720 T280 670" fill="white" stroke="black" stroke-width="4"/> <!-- Bowl body -->
      <!-- Fruits - simplified circles/ovals -->
      <circle cx="180" cy="650" r="20" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="220" cy="640" r="25" fill="white" stroke="black" stroke-width="3"/>
      <ellipse cx="150" cy="655" rx="18" ry="25" fill="white" stroke="black" stroke-width="3" transform="rotate(-15 150 655)"/>
      <ellipse cx="250" cy="660" rx="15" ry="20" fill="white" stroke="black" stroke-width="3" transform="rotate(10 250 660)"/>
    </g>

    <!-- Whipped cream dispenser -->
    <g id="cream-dispenser">
      <rect x="580" y="580" width="70" height="150" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <rect x="590" y="560" width="50" height="30" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Top cap -->
      <rect x="600" y="520" width="30" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="3"/> <!-- Nozzle base -->
      <path d="M605 520 L610 510 L620 510 L625 520 Z" fill="white" stroke="black" stroke-width="3"/> <!-- Nozzle tip -->
    </g>

    <!-- Crepes on a plate -->
    <g id="crepes-plate">
      <ellipse cx="450" cy="670" rx="100" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Plate bottom -->
      <ellipse cx="450" cy="650" rx="90" ry="15" fill="white" stroke="black" stroke-width="4"/> <!-- Plate rim -->
      <!-- Stack of crepes -->
      <ellipse cx="450" cy="630" rx="80" ry="10" fill="white" stroke="black" stroke-width="3"/>
      <ellipse cx="450" cy="620" rx="75" ry="9" fill="white" stroke="black" stroke-width="3"/>
      <ellipse cx="450" cy="610" rx="70" ry="8" fill="white" stroke="black" stroke-width="3"/>
      <ellipse cx="450" cy="600" rx="65" ry="7" fill="white" stroke="black" stroke-width="3"/>
    </g>
  </g>

  <!-- Koala Chef -->
  <g id="koala-chef">
    <!-- Body -->
    <path d="M330 500 C300 650 350 700 450 700 C550 700 600 650 570 500 C570 450 530 420 450 420 C370 420 330 450 330 500 Z" fill="white" stroke="black" stroke-width="5"/>
    
    <!-- Apron -->
    <g id="apron">
      <rect x="410" y="520" width="80" height="60" rx="15" ry="15" fill="white" stroke="black" stroke-width="3"/> <!-- Apron bib -->
      <path d="M370 550 C350 600 380 650 450 650 C520 650 550 600 530 550 L500 540 Q450 520 400 540 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Head -->
    <ellipse cx="450" cy="400" rx="100" ry="80" fill="white" stroke="black" stroke-width="5"/>
    <!-- Ears -->
    <ellipse cx="350" cy="300" rx="60" ry="70" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="550" cy="300" rx="60" ry="70" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="350" cy="300" rx="40" ry="50" fill="white" stroke="black" stroke-width="3"/> <!-- Inner ear -->
    <ellipse cx="550" cy="300" rx="40" ry="50" fill="white" stroke="black" stroke-width="3"/> <!-- Inner ear -->

    <!-- Face details -->
    <g id="koala-face">
      <!-- Eyes -->
      <circle cx="410" cy="380" r="25" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="490" cy="380" r="25" fill="white" stroke="black" stroke-width="3"/>
      <!-- Nose -->
      <ellipse cx="450" cy="420" rx="30" ry="25" fill="white" stroke="black" stroke-width="4"/>
      <!-- Mouth -->
      <path d="M410 450 Q450 480 490 450" fill="none" stroke="black" stroke-width="3"/>
      <!-- Cheeks - subtle suggestion -->
      <path d="M380 430 Q400 450 410 440" fill="none" stroke="black" stroke-width="2"/>
      <path d="M490 440 Q500 450 520 430" fill="none" stroke="black" stroke-width="2"/>
    </g>

    <!-- Chef Hat -->
    <g id="chef-hat">
      <ellipse cx="450" cy="320" rx="100" ry="40" fill="white" stroke="black" stroke-width="5"/> <!-- Hat base -->
      <path d="M350 320 Q320 200 450 150 Q580 200 550 320 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Hat tall part -->
      <path d="M360 300 Q380 230 450 200 Q520 230 540 300" fill="white" stroke="black" stroke-width="3"/> <!-- Inner folds/texture for hat -->
      <path d="M370 280 Q390 220 450 190 Q510 220 530 280" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Arms -->
    <g id="koala-arms">
      <!-- Left Arm (holding spatula) -->
      <path d="M370 500 Q320 480 280 520 Q280 570 320 580 Q370 560 380 520 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Spatula -->
      <rect x="250" y="540" width="80" height="15" rx="7" ry="7" fill="white" stroke="black" stroke-width="3" transform="rotate(-20 250 540)"/> <!-- Handle -->
      <rect x="220" y="525" width="45" height="40" rx="5" ry="5" fill="white" stroke="black" stroke-width="3" transform="rotate(-20 220 525)"/> <!-- Head -->
      
      <!-- Right Arm (holding crepe pan) -->
      <path d="M530 500 Q580 480 620 520 Q620 570 580 580 Q530 560 520 520 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Crepe Pan -->
      <ellipse cx="620" cy="520" rx="55" ry="12" fill="white" stroke="black" stroke-width="4" transform="rotate(15 620 520)"/> <!-- Pan base -->
      <path d="M565 520 A55 12 0 0 1 675 520 L675 490 A55 12 0 0 0 565 490 Z" fill="white" stroke="black" stroke-width="4" transform="rotate(15 620 520)"/> <!-- Pan wall -->
      <rect x="670" y="500" width="60" height="15" rx="7" ry="7" fill="white" stroke="black" stroke-width="3" transform="rotate(15 670 500)"/> <!-- Pan handle -->
      <!-- Crepe inside pan (simple circle) -->
      <circle cx="620" cy="505" r="35" fill="white" stroke="black" stroke-width="3" transform="rotate(15 620 505)"/>
    </g>
  </g>
</svg>