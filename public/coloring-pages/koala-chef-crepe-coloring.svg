<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
      }
      .outline-thin {
        stroke: black;
        stroke-width: 3;
        fill: white;
      }
      .fill-none {
        stroke: black;
        stroke-width: 4;
        fill: none;
      }
    </style>
  </defs>

  <!-- Counter -->
  <g id="counter">
    <rect x="100" y="650" width="600" height="150" rx="30" ry="30" class="outline"/>
    <rect x="120" y="780" width="100" height="150" rx="20" ry="20" class="outline"/>
    <rect x="580" y="780" width="100" height="150" rx="20" ry="20" class="outline"/>
    <path d="M 100 680 Q 200 640 400 640 Q 600 640 700 680" class="fill-none stroke-width-4" stroke-width="4"/>
  </g>

  <!-- Koala -->
  <g id="koala">
    <!-- Body -->
    <ellipse cx="400" cy="550" rx="150" ry="200" class="outline"/>

    <!-- Head -->
    <ellipse cx="400" cy="350" rx="130" ry="120" class="outline"/>

    <!-- Ears -->
    <ellipse cx="280" cy="220" rx="60" ry="80" class="outline"/>
    <ellipse cx="520" cy="220" rx="60" ry="80" class="outline"/>
    <ellipse cx="280" cy="220" rx="30" ry="40" class="outline"/>
    <ellipse cx="520" cy="220" rx="30" ry="40" class="outline"/>

    <!-- Face features -->
    <circle cx="350" cy="320" r="25" class="outline"/>
    <circle cx="450" cy="320" r="25" class="outline"/>
    <ellipse cx="400" cy="380" rx="40" ry="30" class="outline"/>
    <path d="M 350 420 Q 400 450 450 420" class="fill-none stroke-width-4" stroke-width="4"/>

    <!-- Arms -->
    <path d="M 280 480 C 220 500 200 550 200 620 C 200 650 220 660 250 640 L 280 500 Z" class="outline"/>
    <path d="M 520 480 C 580 500 600 550 600 620 C 600 650 580 660 550 640 L 520 500 Z" class="outline"/>
    <!-- Paws holding pan -->
    <path d="M 220 580 C 210 600 230 620 260 620 L 250 590 L 220 580 Z" class="outline"/>
    <path d="M 580 580 C 590 600 570 620 540 620 L 550 590 L 580 580 Z" class="outline"/>
  </g>

  <!-- Chef Hat -->
  <g id="chef-hat">
    <rect x="300" y="240" width="200" height="50" rx="20" ry="20" class="outline"/>
    <path d="M 300 250 C 280 200 300 150 350 140 C 400 130 450 130 500 140 C 520 150 520 200 500 250 Z" class="outline"/>
    <path d="M 350 140 C 370 100 400 80 450 90 C 470 100 480 120 490 140" class="fill-none stroke-width-4" stroke-width="4"/>
    <path d="M 320 220 C 300 190 320 160 350 150" class="fill-none stroke-width-4" stroke-width="4"/>
    <path d="M 480 220 C 500 190 480 160 450 150" class="fill-none stroke-width-4" stroke-width="4"/>
    <path d="M 400 130 C 400 110 420 100 430 110" class="fill-none stroke-width-4" stroke-width="4"/>
  </g>

  <!-- Apron -->
  <g id="apron">
    <path d="M 300 420 Q 400 400 500 420 L 500 650 Q 400 670 300 650 Z" class="outline"/>
    <path d="M 320 430 L 290 400 C 280 380 290 360 320 360 L 350 370" class="fill-none stroke-width-4" stroke-width="4"/>
    <path d="M 480 430 L 510 400 C 520 380 510 360 480 360 L 450 370" class="fill-none stroke-width-4" stroke-width="4"/>
  </g>

  <!-- Pan with Crepe -->
  <g id="pan-crepe">
    <!-- Crepe -->
    <circle cx="400" cy="570" r="120" class="outline"/>
    <!-- Pan -->
    <ellipse cx="400" cy="570" rx="130" ry="125" class="outline"/>
    <path d="M 270 570 C 250 550 250 520 270 500 L 280 490 L 270 570 Z" class="outline"/>
    <path d="M 270 570 L 200 590 L 180 580 C 160 570 160 540 180 530 L 200 520 L 270 540 Z" class="outline"/>
    <path d="M 200 555 L 170 550" class="fill-none stroke-width-4" stroke-width="4"/>
    <circle cx="170" cy="550" r="10" class="outline"/>
  </g>

  <!-- Toppings on Counter -->
  <g id="toppings">
    <!-- Cream swirl 1 -->
    <path d="M 200 670 Q 230 650 260 670 Q 250 700 200 700 Z" class="outline"/>
    <path d="M 220 670 Q 230 660 240 670" class="fill-none stroke-width-3" stroke-width="3"/>

    <!-- Cream swirl 2 -->
    <path d="M 600 670 Q 570 650 540 670 Q 550 700 600 700 Z" class="outline"/>
    <path d="M 580 670 Q 570 660 560 670" class="fill-none stroke-width-3" stroke-width="3"/>
    
    <!-- Berries -->
    <circle cx="280" cy="690" r="20" class="outline"/>
    <circle cx="310" cy="670" r="20" class="outline"/>
    <circle cx="260" cy="660" r="20" class="outline"/>

    <circle cx="520" cy="690" r="20" class="outline"/>
    <circle cx="490" cy="670" r="20" class="outline"/>
    <circle cx="540" cy="660" r="20" class="outline"/>
    
    <!-- Fruit slices / larger pieces -->
    <path d="M 150 720 A 40 40 0 0 1 190 760 L 150 760 Z" class="outline"/>
    <path d="M 150 740 L 170 740" class="fill-none stroke-width-3" stroke-width="3"/>
    
    <path d="M 650 720 A 40 40 0 0 0 610 760 L 650 760 Z" class="outline"/>
    <path d="M 650 740 L 630 740" class="fill-none stroke-width-3" stroke-width="3"/>
  </g>

</svg>