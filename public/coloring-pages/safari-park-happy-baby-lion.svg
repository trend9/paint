<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the entire scene -->
  <g stroke="black" stroke-linejoin="round" stroke-linecap="round">

    <!-- Safari Park Scene - Simplified Background Elements -->
    <g id="background_scene">
      <!-- Acacia Tree -->
      <g id="acacia_tree">
        <!-- Tree Trunk -->
        <rect x="600" y="550" width="60" height="200" rx="20" ry="20" fill="white" stroke-width="5"/>
        <!-- Tree Canopy -->
        <path d="M500,550 Q550,400 650,400 T750,550 Q700,500 650,500 Q600,500 550,500 Z" fill="white" stroke-width="5"/>
      </g>
      <!-- Grass Tufts -->
      <g id="grass_tufts">
        <path d="M100,850 Q120,800 140,850 T180,850 Z" fill="white" stroke-width="4"/>
        <path d="M400,880 Q420,830 440,880 T480,880 Z" fill="white" stroke-width="4"/>
        <path d="M680,830 Q700,780 720,830 T760,830 Z" fill="white" stroke-width="4"/>
      </g>
    </g>

    <!-- Cute Happy Baby Lion Cub -->
    <g id="lion_cub">
      <!-- Body -->
      <path d="M300,700 C300,600 200,550 150,580 C100,610 80,700 150,780 C220,860 350,850 400,780 C450,710 400,700 300,700 Z" fill="white" stroke-width="5"/>

      <!-- Hind Leg 1 (left) -->
      <path d="M160,760 Q130,720 160,680 T200,690 T240,750 Z" fill="white" stroke-width="5"/>
      <!-- Hind Leg 2 (right, partly hidden) -->
      <path d="M330,760 Q300,720 330,680 T370,690 T410,750 Z" fill="white" stroke-width="5"/>

      <!-- Head -->
      <circle cx="280" cy="480" r="100" fill="white" stroke-width="5"/>
      <!-- Ears -->
      <circle cx="210" cy="400" r="35" fill="white" stroke-width="4"/>
      <circle cx="350" cy="400" r="35" fill="white" stroke-width="4"/>

      <!-- Muzzle -->
      <ellipse cx="280" cy="520" rx="50" ry="30" fill="white" stroke-width="4"/>
      <!-- Nose -->
      <path d="M280,500 Q270,490 260,500 L280,520 L300,500 Q290,490 280,500 Z" fill="white" stroke-width="3"/>
      <!-- Mouth -->
      <path d="M250,535 Q280,555 310,535" fill="none" stroke-width="3"/>

      <!-- Eyes -->
      <circle cx="240" cy="460" r="20" fill="white" stroke-width="3"/>
      <circle cx="320" cy="460" r="20" fill="white" stroke-width="3"/>

      <!-- Front Leg 1 (left, pouncing) -->
      <path d="M280,600 Q250,550 200,520 Q150,490 150,540 Q150,590 200,620 Q250,650 280,600 Z" fill="white" stroke-width="5"/>
      <!-- Front Leg 2 (right, pouncing) -->
      <path d="M350,600 Q320,550 270,520 Q220,490 220,540 Q220,590 270,620 Q320,650 350,600 Z" fill="white" stroke-width="5"/>

      <!-- Tail -->
      <path d="M120,700 Q80,650 50,600 Q20,550 80,520 Q140,490 150,500" fill="none" stroke-width="5"/>
      <!-- Tail Tuft -->
      <circle cx="150" cy="500" r="25" fill="white" stroke-width="4"/>
    </g>

    <!-- Small Ball -->
    <g id="ball">
      <circle cx="180" cy="700" r="80" fill="white" stroke-width="5"/>
    </g>

  </g>
</svg>