<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="environment">
    <!-- Simplified ground/hill at bottom -->
    <path d="M0 850 Q200 800 400 850 T800 800 L800 1000 L0 1000 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Simple grass tufts -->
    <path d="M100 900 Q110 880 120 900 Q130 880 140 900" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <path d="M600 870 Q610 850 620 870 Q630 850 640 870" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Simple sun (top right corner) -->
    <circle cx="700" cy="120" r="60" fill="white" stroke="black" stroke-width="5"/>
    <line x1="700" y1="60" x2="700" y2="20" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="650" y1="70" x2="620" y2="40" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="750" y1="70" x2="780" y2="40" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="640" y1="120" x2="600" y2="120" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="760" y1="120" x2="800" y2="120" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="650" y1="170" x2="620" y2="200" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="750" y1="170" x2="780" y2="200" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <line x1="700" y1="180" x2="700" y2="220" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Simple cloud -->
    <path d="M100 170 C80 130 120 120 180 130 C200 150 180 180 140 190 C120 200 100 170 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M500 220 C480 180 520 170 580 180 C600 200 580 230 540 240 C520 250 500 220 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <g id="lion-cub">
    <!-- Body - sitting, playful pose -->
    <path d="M400 600 C250 550 200 750 280 830 C360 910 540 910 620 830 C700 750 650 550 500 600 L400 600 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Head -->
    <ellipse cx="400" cy="350" rx="150" ry="130" fill="white" stroke="black" stroke-width="5"/>

    <!-- Mane (fluffy small mane) - surrounding the head -->
    <path d="M260 330 A150 130 0 0 1 540 330 Q560 270 520 250 Q480 230 400 230 Q320 230 280 250 Q240 270 260 330 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Ears -->
    <ellipse cx="300" cy="250" rx="40" ry="50" fill="white" stroke="black" stroke-width="5"/>
    <ellipse cx="500" cy="250" rx="40" ry="50" fill="white" stroke="black" stroke-width="5"/>
    <!-- Inner ears -->
    <ellipse cx="300" cy="250" rx="20" ry="25" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="500" cy="250" rx="20" ry="25" fill="white" stroke="black" stroke-width="3"/>

    <!-- Eyes (big innocent eyes) -->
    <circle cx="350" cy="330" r="40" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="450" cy="330" r="40" fill="white" stroke="black" stroke-width="5"/>
    <!-- Pupils - inner circle white fill, stroke black -->
    <circle cx="350" cy="335" r="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="450" cy="335" r="15" fill="white" stroke="black" stroke-width="3"/>

    <!-- Nose -->
    <ellipse cx="400" cy="400" rx="25" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <!-- Nostrils -->
    <ellipse cx="390" cy="400" rx="4" ry="3" fill="white" stroke="black" stroke-width="3"/>
    <ellipse cx="410" cy="400" rx="4" ry="3" fill="white" stroke="black" stroke-width="3"/>

    <!-- Mouth (cheerful expression) -->
    <path d="M370 440 Q400 470 430 440" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Cheeks (optional for cuteness, simple lines) -->
    <path d="M350 430 Q340 440 350 450" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <path d="M450 430 Q460 440 450 450" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

    <!-- Front Paws (playing playfully) -->
    <!-- Left paw raised and curved, suggesting play -->
    <path d="M300 530 Q250 470 350 450 Q450 470 400 530 C380 550 320 550 300 530 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Right paw on ground -->
    <path d="M450 630 C420 610 480 610 500 630 C520 650 480 670 450 650 C420 630 450 630 450 630 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Back Legs/Paws (simplified, sitting) -->
    <path d="M280 730 C230 750 230 830 280 850 C330 870 380 850 380 800 C380 750 330 710 280 730 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M480 730 C430 750 430 830 480 850 C530 870 580 850 580 800 C580 750 530 710 480 730 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Tail -->
    <path d="M250 730 Q180 750 150 800 Q120 850 180 870" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <path d="M170 860 C150 880 170 900 190 880 C210 860 190 840 170 860 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>
</svg>