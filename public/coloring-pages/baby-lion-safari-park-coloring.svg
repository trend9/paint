<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Baobab Tree - Far background -->
  <g id="baobab-tree" stroke="black" stroke-width="4" fill="white">
    <path d="M100 900 Q120 500 175 500 Q230 500 250 900 Z" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M175 500 Q150 400 120 450" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M175 500 Q175 350 175 400" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M175 500 Q200 400 230 450" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M120 450 Q100 350 110 320" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M175 400 Q160 300 170 280" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M230 450 Q250 350 240 320" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Savanna Grass - Bottom foreground -->
  <g id="savanna-grass" stroke="black" stroke-width="4" fill="white">
    <path d="M0 900 C100 850 200 900 300 880 C400 860 500 900 600 890 C700 880 800 900 800 900 L800 1000 L0 1000 Z"/>
