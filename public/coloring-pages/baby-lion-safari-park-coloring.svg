    <path d="M580 895 Q590 875 600 895" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Big Smiling Sun - Upper right corner -->
  <g id="sun" stroke="black" stroke-width="4" fill="white">
    <circle cx="680" cy="120" r="80"/>
    <circle cx="650" cy="100" r="10"/>
    <circle cx="710" cy="100" r="10"/>
    <path d="M650 140 Q680 160 710 140" fill="none"/>
    <rect x="680" y="30" width="10" height="25" rx="5" ry="5"/>
    <rect x="740" y="80" width="25" height="10" rx="5" ry="5"/>
    <rect x="700" y="180" width="10" height="25" rx="5" ry="5"/>
    <rect x="620" y="80" width="25" height="10" rx="5" ry="5"/>
    <rect x="720" y="55" width="10" height="20" rx="5" ry="5" transform="rotate(45 725 65)"/>
    <rect x="720" y="145" width="10" height="20" rx="5" ry="5" transform="rotate(-45 725 155)"/>
    <rect x="640" y="145" width="10" height="20" rx="5" ry="5" transform="rotate(45 645 155)"/>
    <rect x="640" y="55" width="10" height="20" rx="5" ry="5" transform="rotate(-45 645 65)"/>
  </g>

  <!-- Small Butterfly - Playfully pounced on -->
  <g id="butterfly" stroke="black" stroke-width="4" fill="white">
    <ellipse cx="500" cy="520" rx="15" ry="30" transform="rotate(10 500 520)"/>
    <ellipse cx="465" cy="490" rx="40" ry="30" transform="rotate(10 465 490)"/>
    <ellipse cx="535" cy="490" rx="40" ry="30" transform="rotate(-10 535 490)"/>
    <ellipse cx="465" cy="550" rx="40" ry="30" transform="rotate(-10 465 550)"/>
    <ellipse cx="535" cy="550" rx="40" ry="30" transform="rotate(10 535 550)"/>
    <path d="M490 490 Q480 460 470 460" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M510 490 Q520 460 530 460" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Cute Happy Baby Lion Cub - Playfully pouncing -->
  <g id="lion-cub" stroke="black" stroke-width="5" fill="white">
    <path d="M300 750 Q350 600 500 600 Q650 650 600 800 Q500 850 350 820 Z" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="320" cy="600" r="80"/>
    <path d="M280 550 C290 510 310 510 320 550 Z" stroke-linejoin="round"/>
    <path d="M340 550 C350 510 370 510 380 550 Z" stroke-linejoin="round"/>
    <ellipse cx="330" cy="630" rx="40" ry="25"/>
    <circle cx="330" cy="620" r="9"/>
    <circle cx="305" cy="590" r="7"/>
    <circle cx="355" cy="590" r="7"/>
    <path d="M310 645 Q330 660 350 645" fill="none"/>
    <path d="M400 650 Q430 550 480 580 Q500 610 500 650 Z" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M420 670 Q450 570 500 600 Q520 630 520 670 Z" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="320" y="780" width="70" height="90" rx="35" ry="35" transform="rotate(15 355 825)"/>
    <rect x="500" y="790" width="70" height="90" rx="35" ry="35" transform="rotate(5 535 835)"/>
    <path d="M570 700 C620 650 670 700 620 750" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="620" cy="750" r="18"/>
