<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Counter -->
  <rect x="50" y="700" width="700" height="150" rx="30" ry="30" fill="white" stroke="black" stroke-width="4"/>

  <!-- Koala Chef -->
  <g id="koala-chef">
    <!-- Body -->
    <ellipse cx="400" cy="550" rx="150" ry="200" fill="white" stroke="black" stroke-width="4"/>

    <!-- Head -->
    <ellipse cx="400" cy="300" rx="120" ry="100" fill="white" stroke="black" stroke-width="4"/>

    <!-- Ears -->
    <ellipse cx="290" cy="220" rx="50" ry="60" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="510" cy="220" rx="50" ry="60" fill="white" stroke="black" stroke-width="4"/>

    <!-- Inner ears -->
    <ellipse cx="290" cy="220" rx="30" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="510" cy="220" rx="30" ry="40" fill="white" stroke="black" stroke-width="4"/>

    <!-- Nose -->
    <ellipse cx="400" cy="330" rx="40" ry="30" fill="white" stroke="black" stroke-width="4"/>

    <!-- Eyes -->
    <circle cx="350" cy="280" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="450" cy="280" r="15" fill="white" stroke="black" stroke-width="4"/>

    <!-- Mouth -->
    <path d="M370 380 Q400 410 430 380" fill="none" stroke="black" stroke-width="4"/>

    <!-- Chef Hat -->
    <path d="M300 220 Q350 100 400 100 Q450 100 500 220 L480 220 Q400 150 320 220 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M320 220 L480 220" fill="none" stroke="black" stroke-width="4"/> <!-- Hat base line -->
    
    <!-- Apron -->
    <path d="M300 400 L500 400 L500 650 Q400 700 300 650 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M290 420 L270 450 M510 420 L530 450" fill="none" stroke="black" stroke-width="4"/> <!-- Apron ties -->

    <!-- Arms -->
    <path d="M490 480 Q550 500 580 580 Q550 620 490 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Right arm holding pan -->
    <path d="M310 480 Q250 500 220 580 Q250 620 310 600 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Left arm -->

    <!-- Feet/Legs -->
    <ellipse cx="330" cy="700" rx="70" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <ellipse cx="470" cy="700" rx="70" ry="40" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Frying Pan and Crepe -->
  <g id="frying-pan-crepe">
    <!-- Pan body -->
    <ellipse cx="600" cy="620" rx="70" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <path d="M530 620 L530 600 L670 600 L670 620 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Handle -->
    <rect x="670" y="605" width="80" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Crepe -->
    <circle cx="600" cy="550" r="50" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Fruits and Whipped Cream on Counter -->
  <g id="counter-items">
    <!-- Bowl for whipped cream -->
    <path d="M120 780 C150 750 250 750 280 780 L270 800 C250 830 150 830 130 800 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Whipped cream -->
    <path d="M150 770 Q160 740 180 750 Q200 730 220 750 Q240 740 250 770 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Strawberries -->
    <g transform="translate(450 770)">
      <path d="M-20 0 L0 -40 L20 0 A20 20 0 0 1 -20 0 Z" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="-10" cy="-10" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="10" cy="-10" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="0" cy="0" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="-5" cy="-25" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="5" cy="-25" r="3" fill="white" stroke="black" stroke-width="4"/>
      <path d="M-5 -40 L-10 -30 M5 -40 L10 -30 M0 -40 L0 -30" fill="none" stroke="black" stroke-width="4"/> <!-- Stem/leaves -->
    </g>
    <g transform="translate(520 800)">
      <path d="M-20 0 L0 -40 L20 0 A20 20 0 0 1 -20 0 Z" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="-10" cy="-10" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="10" cy="-10" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="0" cy="0" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="-5" cy="-25" r="3" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="5" cy="-25" r="3" fill="white" stroke="black" stroke-width="4"/>
      <path d="M-5 -40 L-10 -30 M5 -40 L10 -30 M0 -40 L0 -30" fill="none" stroke="black" stroke-width="4"/> <!-- Stem/leaves -->
    </g>
    
    <!-- Bananas -->
    <g transform="translate(680 780)">
      <path d="M-50 0 Q-40 -40 0 -40 Q40 -40 50 0 Q40 20 0 20 Q-40 20 -50 0 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M-40 -10 Q-20 -30 0 -30 Q20 -30 40 -10" fill="none" stroke="black" stroke-width="4"/> <!-- Inner line for peel segment -->
      <circle cx="-45" cy="-25" r="5" fill="white" stroke="black" stroke-width="4"/> <!-- Stem end -->
      <circle cx="45" cy="-25" r="5" fill="white" stroke="black" stroke-width="4"/> <!-- Tip end -->
    </g>
    <g transform="translate(620 790)">
      <path d="M-50 0 Q-40 -40 0 -40 Q40 -40 50 0 Q40 20 0 20 Q-40 20 -50 0 Z" fill="white" stroke="black" stroke-width="4"/>
      <path d="M-40 -10 Q-20 -30 0 -30 Q20 -30 40 -10" fill="none" stroke="black" stroke-width="4"/> <!-- Inner line for peel segment -->
      <circle cx="-45" cy="-25" r="5" fill="white" stroke="black" stroke-width="4"/> <!-- Stem end -->
      <circle cx="45" cy="-25" r="5" fill="white" stroke="black" stroke-width="4"/> <!-- Tip end -->
    </g>
  </g>
</svg>