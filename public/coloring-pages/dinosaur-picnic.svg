<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the cute happy dinosaur -->
  <g id="dinosaur" stroke="black" stroke-width="4" fill="white">
    <!-- Main body -->
    <rect x="150" y="550" width="450" height="200" rx="100" ry="100" />

    <!-- Neck -->
    <path d="M300 550 C250 450, 300 350, 400 300 C480 280, 520 280, 550 350 C580 420, 500 550, 400 550 Z" />
    
    <!-- Head -->
    <ellipse cx="550" cy="300" rx="70" ry="50" />

    <!-- Snout -->
    <ellipse cx="600" cy="300" rx="30" ry="20" />

    <!-- Eye -->
    <circle cx="560" cy="285" r="10" />

    <!-- Mouth (happy curve) -->
    <path d="M575 310 Q590 325, 605 310" fill="none" stroke="black" stroke-width="4" />

    <!-- Front Leg (left, slightly lifted for play) -->
    <path d="M250 700 C270 650, 300 650, 320 700 L320 780 C300 810, 270 810, 250 780 Z" />

    <!-- Front Leg (right, on ground) -->
    <rect x="350" y="700" width="80" height="100" rx="30" ry="30" />

    <!-- Back Leg (on ground, simpler) -->
    <rect x="500" y="700" width="80" height="100" rx="30" ry="30" />

    <!-- Tail -->
    <path d="M580 650 C650 600, 750 500, 700 400 L680 420 C730 480, 680 580, 600 640 Z" />

    <!-- Spots on body for coloring areas -->
    <circle cx="280" cy="620" r="25" />
    <circle cx="450" cy="600" r="30" />
    <circle cx="500" cy="680" r="20" />

    <!-- Ball for playing, with simple segments for coloring -->
    <circle cx="200" cy="850" r="60" />
    <path d="M200 790 A60 60 0 0 1 200 910" fill="none" stroke="black" stroke-width="4" />
    <path d="M140 850 A60 60 0 0 1 260 850" fill="none" stroke="black" stroke-width="4" />
  </g>

  <!-- Group for the sun -->
  <g id="sun" stroke="black" stroke-width="4" fill="white">
    <!-- Sun body -->
    <circle cx="700" cy="150" r="80" />

    <!-- Sun rays (rounded rectangles) -->
    <rect x="680" y="50" width="40" height="20" rx="8" ry="8" transform="rotate(0 700 150)" />
    <rect x="730" y="70" width="20" height="40" rx="8" ry="8" transform="rotate(45 700 150)" />
    <rect x="730" y="140" width="40" height="20" rx="8" ry="8" transform="rotate(90 700 150)" />
    <rect x="730" y="210" width="20" height="40" rx="8" ry="8" transform="rotate(135 700 150)" />
    <rect x="680" y="230" width="40" height="20" rx="8" ry="8" transform="rotate(180 700 150)" />
    <rect x="630" y="210" width="20" height="40" rx="8" ry="8" transform="rotate(225 700 150)" />
    <rect x="630" y="140" width="40" height="20" rx="8" ry="8" transform="rotate(270 700 150)" />
    <rect x="630" y="70" width="20" height="40" rx="8" ry="8" transform="rotate(315 700 150)" />
  </g>
</svg>