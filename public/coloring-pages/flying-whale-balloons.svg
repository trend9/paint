<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Pure white background -->
  <rect x="0" y="0" width="800" height="1000" fill="white"/>

  <!-- Main Whale Drawing -->
  <g id="whale" transform="translate(0, -50)"> <!-- Shift whale up slightly to give space for balloons below -->
    <!-- Whale body (large, simplified, rounded shape using quadratic curves) -->
    <path d="M150 500 Q180 250 500 250 Q750 300 700 450 Q750 600 500 650 Q180 700 150 500Z"
          fill="white" stroke="black" stroke-width="5"/>

    <!-- Tail flukes (two rounded shapes at the left of the body) -->
    <path d="M150 500 Q80 470 100 420 Q120 450 150 500Z"
          fill="white" stroke="black" stroke-width="4"/>
    <path d="M150 500 Q80 530 100 580 Q120 550 150 500Z"
          fill="white" stroke="black" stroke-width="4"/>

    <!-- Dorsal fin (top of the whale) -->
    <path d="M400 250 Q430 180 460 250 Z"
          fill="white" stroke="black" stroke-width="4"/>

    <!-- Pectoral fin (bottom right side of the whale) -->
    <path d="M350 600 Q280 680 250 600 Q280 550 350 600 Z"
          fill="white" stroke="black" stroke-width="4"/>

    <!-- Whale's eye (simple circle) -->
    <circle cx="580" cy="370" r="15" fill="white" stroke="black" stroke-width="3"/>
    <!-- Happy Whale's Mouth (simple arc) -->
    <path d="M540 420 Q580 470 620 420" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Group for Balloons -->
  <g id="balloons">
    <!-- Anchor point for balloon strings on the whale's tail (adjusted for the whale's transform) -->
    <!-- This point is roughly x=150, y=450 on the canvas, appearing at the base of the whale's tail -->
    <g>
      <!-- Balloon 1 -->
      <circle cx="180" cy="700" r="60" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="180" y2="640" stroke="black" stroke-width="3"/>
      <line x1="180" y1="640" x2="180" y2="700" stroke="black" stroke-width="3"/>

      <!-- Balloon 2 -->
      <circle cx="330" cy="750" r="70" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="330" y2="680" stroke="black" stroke-width="3"/>
      <line x1="330" y1="680" x2="330" y2="750" stroke="black" stroke-width="3"/>

      <!-- Balloon 3 -->
      <circle cx="510" cy="780" r="65" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="510" y2="715" stroke="black" stroke-width="3"/>
      <line x1="510" y1="715" x2="510" y2="780" stroke="black" stroke-width="3"/>

      <!-- Balloon 4 -->
      <circle cx="280" cy="850" r="55" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="280" y2="795" stroke="black" stroke-width="3"/>
      <line x1="280" y1="795" x2="280" y2="850" stroke="black" stroke-width="3"/>

      <!-- Balloon 5 -->
      <circle cx="630" cy="700" r="75" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="630" y2="625" stroke="black" stroke-width="3"/>
      <line x1="630" y1="625" x2="630" y2="700" stroke="black" stroke-width="3"/>

      <!-- Balloon 6 -->
      <circle cx="430" cy="900" r="60" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="430" y2="840" stroke="black" stroke-width="3"/>
      <line x1="430" y1="840" x2="430" y2="900" stroke="black" stroke-width="3"/>

      <!-- Balloon 7 -->
      <circle cx="710" cy="850" r="60" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="710" y2="790" stroke="black" stroke-width="3"/>
      <line x1="710" y1="790" x2="710" y2="850" stroke="black" stroke-width="3"/>

      <!-- Balloon 8 -->
      <circle cx="530" cy="620" r="50" fill="white" stroke="black" stroke-width="4"/>
      <line x1="150" y1="450" x2="530" y2="570" stroke="black" stroke-width="3"/>
      <line x1="530" y1="570" x2="530" y2="620" stroke="black" stroke-width="3"/>
    </g>
  </g>
</svg>