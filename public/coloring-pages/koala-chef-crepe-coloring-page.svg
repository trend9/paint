<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <rect x="0" y="0" width="800" height="1000" fill="white" stroke="none"/>

  <!-- Counter -->
  <g id="counter">
    <rect x="50" y="700" width="700" height="150" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Koala Chef -->
  <g id="koala-chef">
    <!-- Torso (mostly covered by apron and counter) -->
    <rect x="300" y="500" width="200" height="200" rx="50" ry="50" fill="white" stroke="black" stroke-width="5"/>

    <!-- Apron -->
    <g id="apron">
      <rect x="300" y="550" width="200" height="150" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Neck strap -->
      <path d="M300 550 C300 520 350 510 400 510 C450 510 500 520 500 550" fill="none" stroke="black" stroke-width="3"/>
      <!-- Left waist tie -->
      <path d="M300 650 L250 640" fill="none" stroke="black" stroke-width="3"/>
      <!-- Right waist tie -->
      <path d="M500 650 L550 640" fill="none" stroke="black" stroke-width="3"/>
    </g>

    <!-- Head -->
    <circle cx="400" cy="450" r="120" fill="white" stroke="black" stroke-width="5"/>
    <!-- Ears -->
    <circle cx="300" cy="370" r="60" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="500" cy="370" r="60" fill="white" stroke="black" stroke-width="4"/>
    <!-- Inner ears -->
    <circle cx="300" cy="370" r="30" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="500" cy="370" r="30" fill="white" stroke="black" stroke-width="3"/>

    <!-- Face details -->
    <!-- Eyes -->
    <circle cx="360" cy="430" r="20" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="440" cy="430" r="20" fill="white" stroke="black" stroke-width="3"/>
    <!-- Nose -->
    <ellipse cx="400" cy="480" rx="30" ry="20" fill="white" stroke="black" stroke-width="3"/>
    <!-- Smile -->
    <path d="M350 520 Q400 550 450 520" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

    <!-- Chef Hat -->
    <g id="chef-hat">
      <!-- Main tall part -->
      <path d="M300 350 Q320 250 400 200 Q480 250 500 350 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Brim -->
      <path d="M300 350 H500 Q480 370 400 380 Q320 370 300 350 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Wrinkles/folds on hat (simplified) -->
      <path d="M340 250 C330 220 380 210 400 220 C420 210 470 220 460 250" fill="white" stroke="black" stroke-width="3"/>
      <path d="M370 220 C360 200 390 190 400 200" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Arms and Paws -->
    <!-- Left arm: emerges from behind apron, connects to left side of pan -->
    <path d="M330 600 C300 620 280 650 280 670 C280 690 300 700 320 690 C340 680 340 640 330 600 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Right arm: emerges from behind apron, connects to pan handle -->
    <path d="M470 600 C500 620 520 650 520 670 C520 690 500 700 480 690 C460 680 460 640 470 600 Z" fill="white" stroke="black" stroke-width="4"/>

    <!-- Paws/hands for holding pan (simplified) -->
    <!-- Left paw on pan rim -->
    <circle cx="280" cy="670" r="20" fill="white" stroke="black" stroke-width="3"/>
    <!-- Right paw on pan handle -->
    <rect x="500" y="665" width="40" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- Pan and Crepe -->
  <g id="pan-crepe">
    <!-- Pan bottom -->
    <ellipse cx="380" cy="690" rx="120" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <!-- Pan sides -->
    <path d="M260 690 Q250 630 270 620 H490 Q510 630 500 690 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Pan handle -->
    <rect x="490" y="660" width="80" height="30" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="570" cy="675" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Handle end detail -->

    <!-- Crepe (above pan, mid-flip) -->
    <ellipse cx="380" cy="570" rx="100" ry="20" transform="rotate(-15 380 570)" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Items on Counter -->
  <g id="counter-items">
    <!-- Bowl 1: Strawberries -->
    <g id="bowl-strawberries">
      <!-- Bowl top rim -->
      <ellipse cx="200" cy="740" rx="60" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Bowl body -->
      <path d="M140 740 Q130 790 200 800 Q270 790 260 740 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Strawberries (simplified) -->
      <path d="M170 730 L185 710 L200 730 L185 720 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M210 735 L225 715 L240 735 L225 725 Z" fill="white" stroke="black" stroke-width="3"/>
      <path d="M180 750 L195 730 L210 750 L195 740 Z" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Bowl 2: Banana Slices -->
    <g id="bowl-bananas">
      <!-- Bowl top rim -->
      <ellipse cx="600" cy="740" rx="60" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Bowl body -->
      <path d="M540 740 Q530 790 600 800 Q670 790 660 740 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Banana Slices (simplified) -->
      <circle cx="570" cy="725" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="620" cy="720" r="15" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="590" cy="735" r="15" fill="white" stroke="black" stroke-width="3"/>
    </g>

    <!-- Whipped Cream Dollop -->
    <g id="whipped-cream">
      <!-- Base for whipped cream -->
      <ellipse cx="700" cy="740" rx="50" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Dollop shape -->
      <path d="M700 740 C680 700 720 680 730 700 C740 670 700 650 680 670 C660 630 650 680 670 700 C660 720 680 740 700 740 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Simplified swirl lines -->
      <path d="M680 710 Q690 690 700 710 Q710 690 720 710" fill="none" stroke="black" stroke-width="3"/>
    </g>
  </g>
</svg>