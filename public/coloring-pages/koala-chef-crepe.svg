<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Kitchen Environment -->
  <g id="kitchen">
    <!-- Floor line -->
    <line x1="0" y1="850" x2="800" y2="850" stroke="black" stroke-width="4" fill="none" />
    <!-- Back wall/counter line -->
    <line x1="0" y1="400" x2="800" y2="400" stroke="black" stroke-width="4" fill="none" />
    <!-- Simple window outline -->
    <rect x="550" y="100" width="180" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" />
    <line x1="640" y1="100" x2="640" y2="250" stroke="black" stroke-width="4" fill="none" />
    <line x1="550" y1="175" x2="730" y2="175" stroke="black" stroke-width="4" fill="none" />
  </g>

  <!-- Table -->
  <g id="table">
    <rect x="400" y="600" width="350" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" /> <!-- Tabletop -->
    <rect x="430" y="620" width="15" height="200" rx="5" ry="5" fill="white" stroke="black" stroke-width="4" /> <!-- Left leg -->
    <rect x="705" y="620" width="15" height="200" rx="5" ry="5" fill="white" stroke="black" stroke-width="4" /> <!-- Right leg -->
  </g>

  <!-- Koala Chef -->
  <g id="koala-chef">
    <!-- Body -->
    <ellipse cx="250" cy="700" rx="120" ry="150" fill="white" stroke="black" stroke-width="4" />
    <!-- Head -->
    <ellipse cx="250" cy="480" rx="90" ry="100" fill="white" stroke="black" stroke-width="4" />
    <!-- Left Ear -->
    <ellipse cx="180" cy="380" rx="40" ry="50" fill="white" stroke="black" stroke-width="4" />
    <!-- Right Ear -->
    <ellipse cx="320" cy="380" rx="40" ry="50" fill="white" stroke="black" stroke-width="4" />
    <!-- Eyes -->
    <circle cx="220" cy="460" r="18" fill="white" stroke="black" stroke-width="4" />
    <circle cx="280" cy="460" r="18" fill="white" stroke="black" stroke-width="4" />
    <!-- Nose -->
    <ellipse cx="250" cy="500" rx="25" ry="15" fill="white" stroke="black" stroke-width="4" />
    <!-- Mouth/Smile -->
    <path d="M 220 530 Q 250 560 280 530" fill="none" stroke="black" stroke-width="4" />

    <!-- Chef's Hat -->
    <path d="M 180 390 C 190 320 220 280 250 270 C 280 280 310 320 320 390 Z" fill="white" stroke="black" stroke-width="4" />
    <path d="M 190 390 C 200 380 300 380 310 390" fill="none" stroke="black" stroke-width="4" /> <!-- Hat base rim -->

    <!-- Apron -->
    <path d="M 190 650 C 180 620 320 620 310 650 L 310 800 C 300 820 200 820 190 800 Z" fill="white" stroke="black" stroke-width="4" />
    <line x1="250" y1="650" x2="250" y2="800" stroke="black" stroke-width="4" fill="none" /> <!-- Apron detail -->

    <!-- Left Arm (holding pan) -->
    <!-- Arm from body to pan handle -->
    <path d="M 200 600 Q 150 650 160 710 L 190 710 Q 190 650 200 600 Z" fill="white" stroke="black" stroke-width="4" />
    <!-- Right Arm (flipping motion, raised) -->
    <path d="M 300 600 Q 350 500 350 580 L 320 580 Q 320 550 300 600 Z" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Frying Pan and Crepe -->
  <g id="pan-and-crepe">
    <!-- Frying Pan -->
    <ellipse cx="170" cy="725" rx="50" ry="15" fill="white" stroke="black" stroke-width="4" /> <!-- Bottom of pan -->
    <path d="M 120 725 A 50 15 0 0 1 220 725 L 210 665 A 50 15 0 0 0 130 665 Z" fill="white" stroke="black" stroke-width="4" /> <!-- Pan body -->
    <!-- Pan handle, positioned to connect to the arm -->
    <rect x="190" y="700" width="80" height="20" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" />
    <!-- Crepe in the air -->
    <ellipse cx="170" cy="600" rx="40" ry="10" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Crepes Stack on Table -->
  <g id="crepes-stack">
    <ellipse cx="575" cy="580" rx="90" ry="20" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="575" cy="560" rx="90" ry="20" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="575" cy="540" rx="90" ry="20" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="575" cy="520" rx="90" ry="20" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Fruit Toppings -->
  <g id="fruit-toppings">
    <!-- Strawberries (simplified) -->
    <path d="M 690 530 C 680 510 660 510 650 530 C 650 550 670 560 690 530 Z" fill="white" stroke="black" stroke-width="4" /> <!-- Strawberry 1 -->
    <path d="M 690 530 L 685 520" fill="none" stroke="black" stroke-width="4" /> <!-- Stem 1 -->
    <path d="M 630 570 C 620 550 600 550 590 570 C 590 590 610 600 630 570 Z" fill="white" stroke="black" stroke-width="4" /> <!-- Strawberry 2 -->
    <path d="M 630 570 L 625 560" fill="none" stroke="black" stroke-width="4" /> <!-- Stem 2 -->

    <!-- Bananas (simplified) -->
    <path d="M 450 550 C 470 520 490 520 510 550 C 500 560 460 560 450 550 Z" fill="white" stroke="black" stroke-width="4" /> <!-- Banana 1 -->
    <path d="M 460 580 C 480 550 500 550 520 580 C 510 590 470 590 460 580 Z" fill="white" stroke="black" stroke-width="4" /> <!-- Banana 2 -->
  </g>

</svg>