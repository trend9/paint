<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">

  <!-- Gentle Rainbow in the Background -->
  <g id="rainbow">
    <!-- Three thick arcs for distinct bands for coloring, with rounded ends -->
    <path d="M50 850 Q400 100 750 850" fill="none" stroke="black" stroke-width="15" stroke-linecap="round"/>
    <path d="M80 850 Q400 150 720 850" fill="none" stroke="black" stroke-width="15" stroke-linecap="round"/>
    <path d="M110 850 Q400 200 690 850" fill="none" stroke="black" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Floating Stars in the Background -->
  <g id="stars">
    <!-- Star 1 (top left) -->
    <path d="M150 150 L170 180 L200 170 L180 200 L200 230 L170 220 L150 250 L130 220 L100 230 L120 200 L100 170 L130 180 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Star 2 (top right) -->
    <path d="M600 100 L620 130 L650 120 L630 150 L650 180 L620 170 L600 200 L580 170 L550 180 L570 150 L550 120 L580 130 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Star 3 (mid left) -->
    <path d="M80 400 L100 430 L130 420 L110 450 L130 480 L100 470 L80 500 L60 470 L30 480 L50 450 L30 420 L60 430 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Star 4 (mid right) -->
    <path d="M700 350 L720 380 L750 370 L730 400 L750 430 L720 420 L700 450 L680 420 L650 430 L670 400 L650 370 L680 380 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Fluffy Soft Clouds -->
  <g id="clouds">
    <!-- Main large cloud for the unicorn to sit on, with rounded fluffy edges -->
    <path d="M100 800 Q50 700 150 600 Q250 500 350 600 Q450 500 550 600 Q650 500 700 600 Q750 700 700 800 Q600 900 500 800 Q400 900 300 800 Q200 900 100 800 Z"
          fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Cute Happy Baby Unicorn -->
  <g id="unicorn">
    <!-- Body - large and rounded, clearly sitting on the cloud -->
    <ellipse cx="400" cy="740" rx="150" ry="100" fill="white" stroke="black" stroke-width="5"/>

    <!-- Head - positioned slightly above and to the left of the body -->
    <ellipse cx="300" cy="580" rx="80" ry="70" fill="white" stroke="black" stroke-width="5"/>
    <!-- Neck connection - smoothed curve -->
    <path d="M250 630 Q270 590 300 580 Q330 590 350 630 C370 650 380 700 350 710 C300 700 250 650 250 630 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Muzzle - rounded shape -->
    <ellipse cx="280" cy="600" rx="40" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <!-- Eyes - simple circles -->
    <circle cx="280" cy="560" r="12" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="320" cy="560" r="12" fill="white" stroke="black" stroke-width="4"/>
    <!-- Smile - simple arc -->
    <path d="M280 615 Q300 630 320 615" fill="none" stroke="black" stroke-width="4"/>

    <!-- Ears - simple rounded triangles -->
    <path d="M290 510 L310 470 L330 510 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M330 500 L350 460 L370 500 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Horn - simple rounded cone -->
    <path d="M320 450 L340 400 L360 450 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Mane - fluffy rounded shapes -->
    <path d="M370 520 Q400 480 430 520 Q400 550 370 520 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M400 540 Q430 500 460 540 Q430 570 400 540 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Front Leg (holding cupcake) - simplified arm-like shape -->
    <path d="M350 680 Q380 650 420 680 Q400 710 350 680 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Other front leg (partially visible, rounded ellipse) -->
    <ellipse cx="450" cy="750" rx="40" ry="60" fill="white" stroke="black" stroke-width="5"/>
    <!-- Back legs (partially visible, rounded ellipses to show sitting) -->
    <ellipse cx="320" cy="800" rx="40" ry="60" fill="white" stroke="black" stroke-width="5"/>
    <ellipse cx="480" cy="800" rx="40" ry="60" fill="white" stroke="black" stroke-width="5"/>

    <!-- Tail - fluffy rounded shapes -->
    <path d="M540 700 Q580 650 600 700 Q580 750 540 700 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M560 720 Q600 670 620 720 Q600 770 560 720 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Delicious Cupcake (held by the unicorn) -->
  <g id="cupcake">
    <!-- Cupcake liner - simplified path -->
    <path d="M385 680 Q395 700 415 700 Q425 680 415 680 Q405 700 395 700 Q385 680 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Cake part - rounded dome -->
    <ellipse cx="400" cy="670" rx="28" ry="18" fill="white" stroke="black" stroke-width="4"/>
    <!-- Frosting - wavy, distinct shape -->
    <path d="M375 660 Q385 640 400 635 Q415 640 425 660 L415 670 Q400 680 375 670 Z" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Cherry on top - simple circle -->
    <circle cx="400" cy="630" r="8" fill="white" stroke="black" stroke-width="3"/>
  </g>
</svg>