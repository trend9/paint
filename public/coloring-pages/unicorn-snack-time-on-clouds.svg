    <path d="M 160 160 Q 160 190 190 190 Q 160 190 160 220 Q 160 190 130 190 Q 160 190 160 160 Z" fill="white" stroke-width="4"/>
    <polygon points="250,230 256,248 275,248 260,259 265,277 250,266 235,277 240,259 225,248 244,248" fill="white" stroke-width="4"/>
    <path d="M 120 360 Q 120 380 140 380 Q 120 380 120 400 Q 120 380 100 380 Q 120 380 120 360 Z" fill="white" stroke-width="4"/>
    <circle cx="210" cy="330" r="10" fill="white" stroke-width="4"/>
    <circle cx="110" cy="260" r="14" fill="white" stroke-width="4"/>
    <circle cx="160" cy="460" r="8" fill="white" stroke-width="4"/>

    <!-- Top Center Stars -->
    <path d="M 400 75 Q 400 95 420 95 Q 400 95 400 115 Q 400 95 380 95 Q 400 95 400 75 Z" fill="white" stroke-width="4"/>
    <circle cx="310" cy="120" r="9" fill="white" stroke-width="4"/>
    <circle cx="490" cy="115" r="9" fill="white" stroke-width="4"/>

    <!-- Top Right Stars -->
    <path d="M 640 160 Q 640 190 670 190 Q 640 190 640 220 Q 640 190 610 190 Q 640 190 640 160 Z" fill="white" stroke-width="4"/>
    <polygon points="550,230 556,248 575,248 560,259 565,277 550,266 535,277 540,259 525,248 544,248" fill="white" stroke-width="4"/>
    <path d="M 680 360 Q 680 380 700 380 Q 680 380 680 400 Q 680 380 660 380 Q 680 380 680 360 Z" fill="white" stroke-width="4"/>
    <circle cx="590" cy="330" r="10" fill="white" stroke-width="4"/>
    <circle cx="690" cy="260" r="14" fill="white" stroke-width="4"/>
    <circle cx="640" cy="460" r="8" fill="white" stroke-width="4"/>

    <!-- Side Sparkles -->
    <path d="M 115 540 Q 115 555 130 555 Q 115 555 115 570 Q 115 555 100 555 Q 115 555 115 540 Z" fill="white" stroke-width="4"/>
    <path d="M 685 540 Q 685 555 700 555 Q 685 555 685 570 Q 685 555 670 555 Q 685 555 685 540 Z" fill="white" stroke-width="4"/>
  </g>

  <!-- Big Fluffy Cloud Under Unicorn -->
  <g id="cloud" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <path d="M 210 740 
             C 140 730 90 780 110 840 
             C 90 900 160 950 230 940 
             C 280 970 360 970 400 940 
             C 440 970 520 970 570 940 
             C 640 950 710 900 690 840 
             C 710 780 660 730 590 740 
             C 570 680 500 670 460 700 
             C 430 670 370 670 340 700 
             C 300 670 230 680 210 740 Z"/>
    <!-- Cloud Texture Arcs -->
    <path d="M 190 815 C 220 790 265 795 285 825" fill="none" stroke-width="4"/>
    <path d="M 515 825 C 535 795 580 790 610 815" fill="none" stroke-width="4"/>
    <path d="M 345 885 C 375 860 425 860 455 885" fill="none" stroke-width="4"/>
  </g>

  <!-- Unicorn Tail -->
  <g id="tail" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <path d="M 255 660 C 180 635 140 710 165 770 C 190 820 250 800 270 750 C 250 740 240 710 255 660 Z"/>
    <path d="M 185 690 C 180 730 210 765 245 760" fill="none" stroke-width="4"/>
    <path d="M 170 745 C 185 775 220 785 240 770" fill="none" stroke-width="4"/>
  </g>

  <!-- Unicorn Body -->
  <g id="body" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Chubby Torso -->
    <path d="M 330 460 C 310 520 300 610 325 680 C 360 705 440 705 475 680 C 500 610 490 520 470 460 Z"/>
    <!-- Soft Tummy Patch -->
    <path d="M 350 535 C 340 585 345 645 400 655 C 455 645 460 585 450 535 C 430 520 370 520 350 535 Z" stroke-width="4"/>
  </g>

  <!-- Hind Legs (Cute Sitting Pose) -->
  <g id="hind-legs" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Left Hind Leg -->
    <path d="M 320 610 C 255 610 220 660 225 715 C 230 760 280 770 325 760 C 355 750 365 715 360 675 C 345 645 335 625 320 610 Z"/>
    <!-- Left Foot Oval Pad -->
    <ellipse cx="285" cy="710" rx="32" ry="38" transform="rotate(-10 285 710)" stroke-width="4"/>
    <path d="M 285 715 C 285 725 273 732 268 726 C 263 720 268 710 285 696 C 302 710 307 720 302 726 C 297 732 285 725 285 715 Z" stroke-width="4"/>

    <!-- Right Hind Leg -->
    <path d="M 480 610 C 545 610 580 660 575 715 C 570 760 520 770 475 760 C 445 750 435 715 440 675 C 455 645 465 625 480 610 Z"/>
    <!-- Right Foot Oval Pad -->
    <ellipse cx="515" cy="710" rx="32" ry="38" transform="rotate(10 515 710)" stroke-width="4"/>
    <path d="M 515 715 C 515 725 503 732 498 726 C 493 720 498 710 515 696 C 532 710 537 720 532 726 C 527 732 515 725 515 715 Z" stroke-width="4"/>
  </g>

  <!-- Mane (Back Layers) -->
  <g id="mane-back" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <path d="M 315 260 C 260 260 240 330 265 375 C 240 405 250 460 295 475 C 280 440 290 400 310 385 Z"/>
    <path d="M 485 260 C 540 260 560 330 535 375 C 560 405 550 460 505 475 C 520 440 510 400 490 385 Z"/>
  </g>

  <!-- Unicorn Head & Ears -->
  <g id="head" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Left Ear -->
    <path d="M 320 265 C 290 220 290 170 315 160 C 335 150 355 190 360 235 Z"/>
    <path d="M 322 240 C 308 210 308 185 318 178 C 328 172 340 195 345 225 Z" stroke-width="4"/>

    <!-- Right Ear -->
    <path d="M 480 265 C 510 220 510 170 485 160 C 465 150 445 190 440 235 Z"/>
    <path d="M 478 240 C 492 210 492 185 482 178 C 472 172 460 195 455 225 Z" stroke-width="4"/>

    <!-- Chubby Head Outline -->
    <path d="M 320 280 
             C 300 330 290 380 305 420 
             C 325 470 365 485 400 485 
             C 435 485 475 470 495 420 
             C 510 380 500 330 480 280 
             C 460 240 340 240 320 280 Z"/>

    <!-- Cute Mane Tuft (Forelock) -->
    <path d="M 370 235 C 335 240 335 285 365 295 C 385 300 405 280 395 260 C 415 270 435 260 430 240 C 410 230 385 230 370 235 Z"/>
  </g>

  <!-- Unicorn Horn -->
  <g id="horn" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <path d="M 382 238 L 400 115 L 418 238 Z"/>
    <path d="M 386 205 Q 400 213 414 205" stroke-width="4"/>
    <path d="M 391 175 Q 400 182 409 175" stroke-width="4"/>
    <path d="M 395 145 Q 400 151 405 145" stroke-width="4"/>
  </g>

  <!-- Happy Smiling Face Details -->
  <g id="face" stroke="black" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Smiling Eye -->
    <path d="M 335 360 Q 355 335 375 360" stroke-width="5"/>
    <path d="M 340 348 L 330 338" stroke-width="4"/>
    <path d="M 355 342 L 355 330" stroke-width="4"/>
    <path d="M 370 348 L 380 338" stroke-width="4"/>

    <!-- Right Smiling Eye -->
    <path d="M 425 360 Q 445 335 465 360" stroke-width="5"/>
    <path d="M 430 348 L 420 338" stroke-width="4"/>
    <path d="M 445 342 L 445 330" stroke-width="4"/>
    <path d="M 460 348 L 470 338" stroke-width="4"/>

    <!-- Cute Cheeks -->
    <ellipse cx="330" cy="390" rx="14" ry="9" stroke-width="4" stroke-dasharray="3 3"/>
    <ellipse cx="470" cy="390" rx="14" ry="9" stroke-width="4" stroke-dasharray="3 3"/>

    <!-- Nostrils -->
    <ellipse cx="388" cy="395" rx="3" ry="5" fill="black"/>
    <ellipse cx="412" cy="395" rx="3" ry="5" fill="black"/>

    <!-- Happy Open Smile with Tongue -->
    <path d="M 376 412 Q 400 415 424 412 Q 400 455 376 412 Z" stroke-width="5" fill="white"/>
    <path d="M 386 428 Q 400 420 414 428" stroke-width="4"/>
  </g>

  <!-- Sweet Cupcake Being Eaten -->
  <g id="cupcake" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Wrapper -->
    <path d="M 365 540 L 373 595 C 375 605 425 605 427 595 L 435 540 Z"/>
    <!-- Wrapper Vertical Folds -->
    <path d="M 382 542 L 387 599" stroke-width="4"/>
    <path d="M 400 543 L 400 601" stroke-width="4"/>
    <path d="M 418 542 L 413 599" stroke-width="4"/>

    <!-- Frosting Layers -->
    <path d="M 355 540 
             C 345 525 365 510 380 518 
             C 390 500 410 500 420 518 
             C 435 510 455 525 445 540 
             C 455 555 435 560 400 555 
             C 365 560 345 555 355 540 Z"/>
    <path d="M 370 515 C 365 485 390 475 400 478 C 410 475 435 485 430 515 Z"/>

    <!-- Cherry on Top -->
    <circle cx="400" cy="465" r="14" stroke-width="5"/>
    <path d="M 404 452 C 410 435 425 430 430 432" stroke-width="4" fill="none"/>

    <!-- Sprinkles -->
    <rect x="375" y="525" width="10" height="5" rx="2.5" transform="rotate(-20 380 527)" stroke-width="3"/>
    <rect x="415" y="525" width="10" height="5" rx="2.5" transform="rotate(25 420 527)" stroke-width="3"/>
    <rect x="395" y="515" width="10" height="5" rx="2.5" transform="rotate(10 400 517)" stroke-width="3"/>
    <rect x="382" y="495" width="9" height="5" rx="2.5" transform="rotate(40 386 497)" stroke-width="3"/>
    <rect x="410" y="495" width="9" height="5" rx="2.5" transform="rotate(-30 414 497)" stroke-width="3"/>
    <circle cx="400" cy="535" r="3" stroke-width="3"/>
  </g>

  <!-- Front Hooves Holding Cupcake -->
  <g id="front-hooves" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="white">
    <!-- Left Arm & Hoof -->
    <path d="M 325 475 C 310 515 325 560 365 565 C 375 565 375 545 365 545 C 345 545 335 515 345 475 Z"/>
    <!-- Left Hoof Line -->
    <path d="M 345 535 C 352 545 360 550 366 552" stroke-width="4"/>

    <!-- Right Arm & Hoof -->
    <path d="M 475 475 C 490 515 475 560 435 565 C 425 565 425 545 435 545 C 455 545 465 515 455 475 Z"/>
    <!-- Right Hoof Line -->
    <path d="M 455 535 C 448 545 440 550 434 552" stroke-width="4"/>
  </g>
</svg>