<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <rect width="800" height="1000" fill="white"/>

  <!-- Page Border -->
  <rect x="35" y="35" width="730" height="930" rx="30" ry="30" fill="none" stroke="black" stroke-width="5"/>

  <!-- Background Stars and Sparkles -->
