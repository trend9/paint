<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Main group for the entire drawing with default stroke and fill properties -->
  <g fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Cloud for the unicorn to sit on -->
    <g id="cloud">
      <ellipse cx="400" cy="700" rx="300" ry="100"/>
      <ellipse cx="280" cy="670" rx="100" ry="80"/>
      <ellipse cx="520" cy="670" rx="100" ry="80"/>
      <ellipse cx="350" cy="630" rx="80" ry="60"/>
      <ellipse cx="450" cy="630" rx="80" ry="60"/>
    </g>

    <!-- Unicorn -->
    <g id="unicorn">
      <!-- Body - a rounded path to represent a sitting posture -->
      <path d="M 350 600 Q 300 550 320 450 Q 340 350 420 330 Q 500 350 520 450 Q 540 550 490 600 Z"/>

      <!-- Head -->
      <ellipse cx="480" cy="370" rx="70" ry="60"/>

      <!-- Snout -->
      <ellipse cx="515" cy="390" rx="35" ry="25"/>
      <!-- Nostrils -->
      <circle cx="505" cy="390" r="3" fill="black" stroke-width="1"/>
      <circle cx="525" cy="390" r="3" fill="black" stroke-width="1"/>

      <!-- Eye -->
      <circle cx="460" cy="360" r="8" fill="black" stroke-width="1"/>
      <!-- Eyelash / Simple curve above eye for friendly expression -->
      <path d="M 450 365 Q 460 375 470 365" fill="none" stroke="black" stroke-width="3"/>

      <!-- Smile -->
      <path d="M 495 400 Q 515 415 535 400" fill="none" stroke="black" stroke-width="3"/>

      <!-- Ear -->
      <path d="M 430 330 L 460 300 L 490 330 Z"/>

      <!-- Horn -->
      <path d="M 490 310 L 500 260 L 510 310 Z"/>

      <!-- Mane - simplified wavy lines -->
      <path d="M 420 340 C 400 310, 420 270, 450 280" fill="none"/>
      <path d="M 425 350 C 405 320, 425 280, 455 290" fill="none"/>
      <path d="M 430 360 C 410 330, 430 290, 460 300" fill="none"/>

      <!-- Front Leg 1 (holding cupcake) - simplified rounded path -->
      <path d="M 400 560 C 390 520, 410 460, 440 460 C 450 470, 430 530, 400 560 Z"/>

      <!-- Front Leg 2 (holding cookie) - simplified rounded path -->
      <path d="M 450 560 C 440 520, 460 460, 490 460 C 500 470, 480 530, 450 560 Z"/>

      <!-- Tail - simplified wavy lines -->
      <path d="M 330 500 C 300 450, 260 500, 280 550" fill="none"/>
      <path d="M 335 510 C 305 460, 265 510, 285 560" fill="none"/>
      <path d="M 340 520 C 310 470, 270 520, 290 570" fill="none"/>
    </g>

    <!-- Small Cupcake held by unicorn -->
    <g id="cupcake">
      <!-- Wrapper base -->
      <rect x="430" y="440" width="30" height="15" rx="5" ry="5"/>
      <!-- Cake top -->
      <ellipse cx="445" cy="420" rx="20" ry="12"/>
      <!-- Cherry on top -->
      <circle cx="445" cy="405" r="7"/>
    </g>

    <!-- Star-shaped Cookie held by unicorn -->
    <g id="cookie">
      <!-- Simple 5-point star path -->
      <path d="M 475 410 L 480 425 L 495 425 L 485 435 L 490 450 L 475 440 L 460 450 L 465 435 L 455 425 L 470 425 Z"/>
    </g>

  </g>
</svg>