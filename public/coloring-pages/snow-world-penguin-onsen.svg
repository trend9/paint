<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="background_mountains">
    <!-- Mountain 1 (left) -->
    <path d="M100 600 L350 250 L600 600 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snow cap for Mountain 1 -->
    <path d="M270 350 Q350 220 430 350 L350 250 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mountain 2 (right, slightly smaller and offset) -->
    <path d="M450 600 L650 300 L750 600 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Snow cap for Mountain 2 -->
    <path d="M570 400 Q650 280 700 400 L650 300 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="foreground_snow">
    <!-- Irregular snow shape, wrapping around the hot spring area -->
    <path d="M0 600 Q150 500 400 550 Q650 500 800 600 L800 1000 L0 1000 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <g id="hot_spring_pool">
    <!-- Main pool shape -->
    <path d="M200 700 Q100 780 200 880 L600 880 Q700 780 600 700 L200 700 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Bubbles -->
    <circle cx="250" cy="730" r="8" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="280" cy="720" r="10" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="300" cy="740" r="7" fill="white" stroke="black" stroke-width="3"/>

    <circle cx="550" cy="735" r="9" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="580" cy="725" r="11" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="530" cy="715" r="6" fill="white" stroke="black" stroke-width="3"/>

    <circle cx="400" cy="710" r="12" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="380" cy="700" r="7" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <g id="penguins">
    <!-- Penguin 1 (Left) -->
    <g id="penguin_1">
      <!-- Body -->
      <path d="M250 820 Q200 750 250 700 L350 700 Q400 750 350 820 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Belly -->
      <path d="M275 725 Q250 760 275 790 L325 790 Q350 760 325 725 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head -->
      <ellipse cx="300" cy="680" rx="40" ry="35" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head towel -->
      <rect x="270" y="640" width="60" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <!-- Towel knot/fold -->
      <circle cx="300" cy="635" r="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="285" cy="670" r="5" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="315" cy="670" r="5" fill="white" stroke="black" stroke-width="3"/>
      <!-- Beak -->
      <path d="M295 685 Q300 695 305 685 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Flipper (left, partially submerged) -->
      <path d="M240 730 Q220 750 240 770 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Flipper (right, partially submerged) -->
      <path d="M360 730 Q380 750 360 770 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Penguin 2 (Middle) -->
    <g id="penguin_2">
      <!-- Body -->
      <path d="M380 840 Q330 770 380 720 L480 720 Q530 770 480 840 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Belly -->
      <path d="M405 745 Q380 780 405 810 L455 810 Q480 780 455 745 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head -->
      <ellipse cx="430" cy="700" rx="40" ry="35" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head towel -->
      <rect x="400" y="660" width="60" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <!-- Towel knot/fold -->
      <circle cx="430" cy="655" r="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="415" cy="690" r="5" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="445" cy="690" r="5" fill="white" stroke="black" stroke-width="3"/>
      <!-- Beak -->
      <path d="M425 705 Q430 715 435 705 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Flipper (left, partially submerged) -->
      <path d="M370 750 Q350 770 370 790 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Flipper (right, partially submerged) -->
      <path d="M490 750 Q510 770 490 790 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Penguin 3 (Right) -->
    <g id="penguin_3">
      <!-- Body -->
      <path d="M500 820 Q450 750 500 700 L600 700 Q650 750 600 820 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Belly -->
      <path d="M525 725 Q500 760 525 790 L575 790 Q600 760 575 725 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head -->
      <ellipse cx="550" cy="680" rx="40" ry="35" fill="white" stroke="black" stroke-width="4"/>
      <!-- Head towel -->
      <rect x="520" y="640" width="60" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
      <!-- Towel knot/fold -->
      <circle cx="550" cy="635" r="10" fill="white" stroke="black" stroke-width="3"/>
      <!-- Eyes -->
      <circle cx="535" cy="670" r="5" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="565" cy="670" r="5" fill="white" stroke="black" stroke-width="3"/>
      <!-- Beak -->
      <path d="M545 685 Q550 695 555 685 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Flipper (left, partially submerged) -->
      <path d="M490 730 Q470 750 490 770 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Flipper (right, partially submerged) -->
      <path d="M610 730 Q630 750 610 770 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>
  </g>
</svg>