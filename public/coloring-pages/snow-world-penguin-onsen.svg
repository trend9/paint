<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1000" fill="#FFFFFF"/>

  <!-- Background Mountains -->
  <g id="mountains">
    <!-- Mountain Left -->
    <path d="M -50 600 L 220 250 L 500 600 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <!-- Mountain Left Snowcap -->
    <path d="M 125 380 C 160 400, 190 380, 220 400 C 250 380, 280 400, 315 380 L 220 250 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />

    <!-- Mountain Right -->
    <path d="M 300 600 L 580 200 L 850 600 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <!-- Mountain Right Snowcap -->
    <path d="M 485 335 C 520 355, 550 335, 580 355 C 610 335, 640 355, 675 335 L 580 200 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Pine Trees -->
  <g id="trees">
    <!-- Left Tree -->
    <rect x="75" y="540" width="20" height="50" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <path d="M 30 540 L 140 540 L 85 480 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <path d="M 45 490 L 125 490 L 85 435 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <path d="M 55 445 L 115 445 L 85 395 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />

    <!-- Right Tree -->
    <rect x="705" y="540" width="20" height="50" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <path d="M 660 540 L 770 540 L 715 480 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <path d="M 675 490 L 755 490 L 715 435 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    <path d="M 685 445 L 745 445 L 715 395 Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Back Rocks of the Onsen -->
  <g id="back-rocks">
    <ellipse cx="160" cy="660" rx="90" ry="50" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="290" cy="620" rx="100" ry="60" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="510" cy="620" rx="100" ry="60" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="640" cy="660" rx="90" ry="50" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
  </g>

  <!-- Water Surface of the Hot Spring -->
  <ellipse cx="400" cy="760" rx="340" ry="120" fill="#FFFFFF" stroke="#000000" stroke-width="6" />

  <!-- Steam Rising -->
  <g id="steam">
    <path d="M 230 560 Q 210 510 240 460 T 220 360" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <path d="M 400 530 Q 420 480 390 430 T 410 330" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <path d="M 570 560 Q 550 510 580 460 T 560 360" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Penguins -->
  <g id="penguins">
    <!-- Left Penguin (with towel on head) -->
    <g id="penguin-left">
      <!-- Body -->
      <path d="M 220 770 C 220 650, 340 650, 340 770" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linecap="round" />
      <!-- Face Mask (White Area) -->
      <path d="M 240 770 C 240 700, 280 700, 280 718 C 280 700, 320 700, 320 770" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
      <!-- Happy Closed Eyes -->
      <path d="M 255 730 Q 262 723 270 730" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
      <path d="M 290 730 Q 297 723 305 730" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
      <!-- Cute Beak -->
      <polygon points="275,738 285,738 280,748" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <!-- Blush Circles -->
      <circle cx="248" cy="742" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
      <circle cx="312" cy="742" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
      <!-- Left Flipper resting on water -->
      <path d="M 225 745 Q 200 755 220 770" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Flipper resting on water -->
      <path d="M 335 745 Q 360 755 340 770" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Towel on Head -->
      <rect x="250" y="645" width="60" height="22" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
      <path d="M 270 645 L 270 667" fill="none" stroke="#000000" stroke-width="5" />
      <path d="M 290 645 L 290 667" fill="none" stroke="#000000" stroke-width="5" />
    </g>

    <!-- Right Penguin (Joyful/Splashing) -->
    <g id="penguin-right">
      <!-- Body -->
      <path d="M 450 780 C 450 670, 570 670, 570 780" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linecap="round" />
      <!-- Face Mask -->
      <path d="M 470 780 C 470 710, 510 710, 510 728 C 510 710, 550 710, 550 780" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
      <!-- Happy Closed Eyes -->
      <path d="M 485 740 Q 492 733 500 740" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
      <path d="M 520 740 Q 527 733 535 740" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
      <!-- Cute Beak -->
      <polygon points="505,748 515,748 510,758" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <!-- Blush Circles -->
      <circle cx="478" cy="752" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
      <circle cx="542" cy="752" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
      <!-- Left Flipper Raised -->
      <path d="M 455 735 Q 430 715 440 700 Q 455 705 455 725" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <!-- Right Flipper Splashing -->
      <path d="M 565 735 Q 590 715 580 700 Q 565 705 565 725" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
    </g>

    <!-- Floating Wooden Bucket -->
    <g id="bucket">
      <ellipse cx="615" cy="775" rx="35" ry="15" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
      <path d="M 580 775 L 587 810 C 587 818, 643 818, 643 810 L 650 775" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <path d="M 580 775 C 580 755, 650 755, 650 775" fill="none" stroke="#000000" stroke-width="5" />
    </g>
  </g>

  <!-- Water Ripples (In front of Penguins) -->
  <g id="ripples">
    <path d="M 200 810 Q 250 825 300 810" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <path d="M 500 810 Q 550 825 600 810" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <path d="M 320 840 Q 400 860 480 840" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Foreground Rocks (Overlapping the pool edge) -->
  <g id="foreground-rocks">
    <ellipse cx="90" cy="860" rx="95" ry="65" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="230" cy="900" rx="115" ry="75" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="450" cy="910" rx="135" ry="85" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="680" cy="860" rx="115" ry="75" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="340" cy="930" rx="75" ry="45" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <ellipse cx="570" cy="925" rx="85" ry="50" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
  </g>

  <!-- Gently Falling Snow (Big, simple circles for coloring) -->
  <g id="snowflakes">
    <circle cx="120" cy="150" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="270" cy="110" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="420" cy="130" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="600" cy="100" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="710" cy="180" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="200" cy="240" r="13" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="350" cy="220" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="510" cy="260" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="100" cy="340" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="650" cy="310" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="280" cy="350" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="460" cy="380" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="740" cy="400" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="160" cy="460" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="610" cy="450" r="13" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  </g>

  <!-- Thick Outer Border Frame -->
  <rect x="15" y="15" width="770" height="970" fill="none" stroke="#000000" stroke-width="12" rx="20" />
</svg>