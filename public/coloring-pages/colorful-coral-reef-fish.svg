<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thick-outline {
        stroke-width: 5;
        fill: white;
      }
      .medium-outline {
        stroke-width: 4;
        fill: white;
      }
      .thin-outline {
        stroke-width: 3;
        fill: white;
      }
      .fill-none {
        fill: none;
      }
    </style>
  </defs>

  <g id="coral_reef_elements">
    <!-- Brain Coral 1 -->
    <g id="brain_coral_1">
      <path d="M 100 700 Q 150 650 250 650 T 350 700 Q 300 750 200 750 T 100 700 Z" class="outline thick-outline"/>
      <path d="M 150 690 Q 180 670 230 670 M 200 710 Q 230 730 280 730 M 130 720 Q 160 700 210 700" class="outline thin-outline fill-none"/>
    </g>

    <!-- Fan Coral 1 -->
    <g id="fan_coral_1">
      <path d="M 380 700 Q 390 650 420 620 L 450 620 Q 480 650 490 700 Q 470 720 440 720 Q 410 720 380 700 Z" class="outline thick-outline"/>
      <path d="M 435 630 L 435 690 M 415 640 L 415 680 M 455 640 L 455 680" class="outline thin-outline fill-none"/>
    </g>

    <!-- Seaweed 1 -->
    <g id="seaweed_1">
      <path d="M 50 850 C 70 800 100 810 120 780 C 140 750 150 760 170 730 L 170 740 C 150 770 140 760 120 790 C 100 820 70 810 50 860 Z" class="outline medium-outline"/>
    </g>
    
    <!-- Seaweed 2 -->
    <g id="seaweed_2">
      <path d="M 600 850 C 620 800 650 810 670 780 C 690 750 700 760 720 730 L 720 740 C 700 770 690 760 670 790 C 650 820 620 810 600 860 Z" class="outline medium-outline"/>
    </g>

    <!-- Brain Coral 2 -->
    <g id="brain_coral_2">
      <path d="M 600 600 Q 650 550 750 550 T 850 600 Q 800 650 700 650 T 600 600 Z" transform="scale(0.8) translate(100 100)" class="outline thick-outline"/>
      <path d="M 650 590 Q 680 570 730 570 M 700 610 Q 730 630 780 630 M 630 620 Q 660 600 710 600" transform="scale(0.8) translate(100 100)" class="outline thin-outline fill-none"/>
    </g>

    <!-- Fan Coral 2 -->
    <g id="fan_coral_2">
      <path d="M 180 300 Q 190 250 220 220 L 250 220 Q 280 250 290 300 Q 270 320 240 320 Q 210 320 180 300 Z" transform="scale(0.7) translate(100 100)" class="outline thick-outline"/>
      <path d="M 235 230 L 235 290 M 215 240 L 215 280 M 255 240 L 255 280" transform="scale(0.7) translate(100 100)" class="outline thin-outline fill-none"/>
    </g>

  </g>

  <g id="fish_characters">
    <!-- Clownfish -->
    <g id="clownfish">
      <ellipse cx="200" cy="400" rx="90" ry="50" class="outline medium-outline"/>
      <path d="M 290 400 L 330 380 L 330 420 Z" class="outline medium-outline"/> <!-- Tail -->
      <path d="M 220 360 L 240 330 L 260 360 Z" class="outline medium-outline"/> <!-- Top Fin -->
      <path d="M 220 440 L 240 470 L 260 440 Z" class="outline medium-outline"/> <!-- Bottom Fin -->
      <path d="M 130 395 C 135 405 145 405 150 395" class="outline thin-outline fill-none"/> <!-- Mouth -->
      <circle cx="150" cy="380" r="8" class="outline thin-outline"/> <!-- Eye -->
      <path d="M 180 355 C 185 370 185 430 180 445" class="outline thin-outline fill-none"/> <!-- Stripe 1 -->
      <path d="M 230 355 C 235 370 235 430 230 445" class="outline thin-outline fill-none"/> <!-- Stripe 2 -->
    </g>

    <!-- Angelfish -->
    <g id="angelfish">
      <path d="M 550 250 Q 570 200 600 250 Q 630 300 600 350 Q 570 400 550 350 Q 520 300 550 250 Z" class="outline medium-outline"/> <!-- Body -->
      <path d="M 600 300 L 640 280 L 640 320 Z" class="outline medium-outline"/> <!-- Tail -->
      <path d="M 550 300 C 535 305 535 315 550 320" class="outline thin-outline fill-none"/> <!-- Mouth -->
      <circle cx="535" cy="285" r="8" class="outline thin-outline"/> <!-- Eye -->
    </g>

    <!-- Seahorse -->
    <g id="seahorse">
      <path d="M 450 450 C 470 400 480 350 450 300 C 420 250 400 200 450 200 C 500 200 520 250 490 300 C 460 350 450 400 470 450 C 490 500 470 550 450 550 C 430 550 410 500 430 450 Z" class="outline medium-outline"/> <!-- Body -->
      <path d="M 460 200 C 465 190 475 190 480 200" class="outline thin-outline fill-none"/> <!-- Mouth -->
      <circle cx="475" cy="220" r="8" class="outline thin-outline"/> <!-- Eye -->
      <path d="M 450 300 C 455 310 465 310 470 300" class="outline thin-outline fill-none"/> <!-- Fin on back -->
      <path d="M 450 550 Q 430 570 420 560 Q 410 550 420 540 Q 430 530 450 550 Z" class="outline thin-outline"/> <!-- Curled tail tip -->
    </g>

  </g>
</svg>