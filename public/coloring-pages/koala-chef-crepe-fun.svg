<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Outer border of the coloring sheet -->
  <rect width="800" height="1000" fill="white"/>
  <rect x="15" y="15" width="770" height="970" fill="none" stroke="black" stroke-width="10" rx="20"/>

  <!-- BACKGROUND WINDOW -->
  <g id="background_window">
    <rect x="180" y="160" width="440" height="340" rx="20" fill="white" stroke="black" stroke-width="4"/>
    <line x1="180" y1="280" x2="620" y2="280" stroke="black" stroke-width="4"/>
    <line x1="400" y1="160" x2="400" y2="500" stroke="black" stroke-width="4"/>
  </g>

  <!-- PARTY BUNTING -->
  <g id="bunting">
    <path d="M 130,110 Q 400,180 670,110" fill="none" stroke="black" stroke-width="4"/>
    <polygon points="200,123 240,131 215,175" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="280,138 320,143 300,185" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="360,145 400,146 380,190" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="440,145 480,143 460,188" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="520,139 560,132 540,177" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="600,126 640,117 620,161" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- CABINET & DRAWERS (Below Counter) -->
  <g id="cabinet">
    <rect x="60" y="675" width="680" height="260" rx="10" fill="white" stroke="black" stroke-width="5"/>
    <!-- Left Drawer -->
    <rect x="90" y="705" width="280" height="180" rx="15" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="230" cy="795" r="22" fill="white" stroke="black" stroke-width="5"/>
    <!-- Right Drawer -->
    <rect x="430" y="705" width="280" height="180" rx="15" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="570" cy="795" r="22" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- COUNTER TOP LINE -->
  <g id="counter_top">
    <line x1="40" y1="660" x2="760" y2="660" stroke="black" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="675" x2="760" y2="675" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- KOALA OUTER EARS (Drawn behind head) -->
  <g id="koala_ears_outer">
    <circle cx="270" cy="370" r="75" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="530" cy="370" r="75" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- KOALA HEAD -->
  <g id="koala_head">
    <ellipse cx="400" cy="410" rx="120" ry="95" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- KOALA INNER EARS (Drawn on top of head) -->
  <g id="koala_ears_inner">
    <circle cx="265" cy="370" r="45" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="535" cy="370" r="45" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- CHEF HAT -->
  <g id="chef_hat">
    <!-- Puffy Top -->
    <path d="M 345,290 C 295,270 305,190 355,200 C 355,160 445,160 445,200 C 495,190 505,270 455,290" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <!-- Creases in Hat -->
    <path d="M 375,290 Q 375,230 385,215" fill="none" stroke="black" stroke-width="4"/>
    <path d="M 425,290 Q 425,230 415,215" fill="none" stroke="black" stroke-width="4"/>
    <!-- Hat Band -->
    <path d="M 345,290 L 350,320 Q 400,310 450,320 L 455,290 Q 400,280 345,290 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- KOALA FACE -->
  <g id="koala_face">
    <!-- Left Eye -->
    <circle cx="345" cy="405" r="22" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="345" cy="405" r="11" fill="black"/>
    <circle cx="341" cy="401" r="4" fill="white"/>
    
    <!-- Right Eye -->
    <circle cx="455" cy="405" r="22" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="455" cy="405" r="11" fill="black"/>
    <circle cx="451" cy="401" r="4" fill="white"/>

    <!-- Nose -->
    <ellipse cx="400" cy="425" rx="24" ry="36" fill="white" stroke="black" stroke-width="5"/>

    <!-- Happy Mouth -->
    <path d="M 380,465 Q 400,490 420,465" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Cheek Dimples -->
    <path d="M 375,468 Q 378,463 381,465" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 425,468 Q 422,463 419,465" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- KOALA BODY & APRON -->
  <g id="koala_body_apron">
    <!-- Body -->
    <path d="M 315,500 C 295,560 295,650 295,660 L 505,660 C 505,650 505,560 485,500" fill="white" stroke="black" stroke-width="5"/>
    <!-- Apron Strap -->
    <path d="M 355,510 C 355,485 445,485 445,510" fill="none" stroke="black" stroke-width="5"/>
    <!-- Apron Main Body -->
    <path d="M 355,510 L 445,510 C 455,570 465,620 465,660 L 335,660 C 335,620 345,570 355,510 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Apron Pocket -->
    <path d="M 370,575 L 430,575 C 430,615 370,615 370,575 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Heart on Pocket -->
    <path d="M 400,599 C 394,592 387,592 387,585 C 387,578 394,578 400,585 C 406,578 413,578 413,585 C 413,592 406,592 400,599 Z" fill="white" stroke="black" stroke-width="3"/>
    <!-- Apron Ties -->
    <path d="M 335,610 C 315,610 305,620 315,630 C 325,635 335,625 335,610" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 465,610 C 485,610 495,620 485,630 C 475,635 465,625 465,610" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- COOKING TOOLS & FLYING CREPE -->
  <g id="left_hand_and_spatula">
    <!-- Left Arm -->
    <path d="M 315,520 C 270,530 250,550 250,565" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Left Paw -->
    <circle cx="250" cy="565" r="22" fill="white" stroke="black" stroke-width="5"/>
    <!-- Spatula Handle -->
    <line x1="255" y1="565" x2="310" y2="515" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <!-- Spatula Blade -->
    <path d="M 305,520 L 335,490 L 355,510 L 325,540 Z" fill="white" stroke="black" stroke-width="5"/>
    <line x1="320" y1="515" x2="332" y2="503" stroke="black" stroke-width="3"/>
    <line x1="327" y1="522" x2="339" y2="510" stroke="black" stroke-width="3"/>
    
    <!-- Flying Crepe with cute face -->
    <g transform="translate(360, 430) rotate(-15)">
      <ellipse cx="0" cy="0" rx="45" ry="18" fill="white" stroke="black" stroke-width="5"/>
      <path d="M -15,-3 Q -12,-6 -9,-3" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <path d="M 9,-3 Q 12,-6 15,-3" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <path d="M -3,3 Q 0,8 3,3" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g id="right_hand_and_pitcher">
    <!-- Right Arm -->
    <path d="M 485,520 C 530,530 550,545 560,560" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Paw -->
    <circle cx="560" cy="560" r="22" fill="white" stroke="black" stroke-width="5"/>
    <!-- Pitcher/Jug pouring batter -->
    <path d="M 550,565 Q 535,555 540,542 L 580,502 Q 610,482 625,512 L 600,562 Q 575,577 550,565 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Pitcher Handle -->
    <path d="M 610,507 C 635,512 635,542 595,557" fill="none" stroke="black" stroke-width="5"/>
    <!-- Measurement lines -->
    <line x1="575" y1="545" x2="583" y2="539" stroke="black" stroke-width="3"/>
    <line x1="581" y1="537" x2="589" y2="531" stroke="black" stroke-width="3"/>
    <line x1="587" y1="529" x2="595" y2="523" stroke="black" stroke-width="3"/>
    
    <!-- Batter Stream flowing down -->
    <path d="M 540,551 Q 460,578 430,645 L 413,647 Q 450,572 538,541 Z" fill="white" stroke="black" stroke-width="5"/>
    <circle cx="475" cy="615" r="6" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="445" cy="635" r="4" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- PAN AND COOKING CREPE -->
  <g id="pan_and_stove">
    <!-- Pan Handle -->
    <path d="M 315,655 L 240,650 C 235,650 235,660 240,660 L 315,660 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Outer Pan -->
    <ellipse cx="410" cy="655" rx="100" ry="25" fill="white" stroke="black" stroke-width="5"/>
    <!-- Inner Pan Rim -->
    <ellipse cx="410" cy="653" rx="92" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Crepe Batter in Pan -->
    <ellipse cx="410" cy="653" rx="70" ry="14" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Steam lines -->
    <path d="M 350,620 Q 345,600 355,590" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
    <path d="M 450,620 Q 455,600 445,590" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- TOPPING BOWLS ON THE COUNTER -->
  <g id="whipped_cream_bowl">
    <!-- Bowl Left -->
    <path d="M 100,660 C 100,720 200,720 200,660 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Puffy Whipped Cream -->
    <path d="M 100,660 C 85,630 115,605 130,615 C 135,580 165,575 175,605 C 190,590 215,630 200,660 Z" fill="white" stroke="black" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 125,640 Q 150,610 175,640" fill="none" stroke="black" stroke-width="4"/>
    <!-- Cherry on Top -->
    <circle cx="155" cy="575" r="14" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 155,561 Q 165,535 185,540" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="fruit_bowl">
    <!-- Bowl Right -->
    <path d="M 600,660 C 600,720 700,720 700,660 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Strawberries inside -->
    <path d="M 620,645 C 610,635 615,615 630,620 C 645,615 650,635 640,645 C 635,650 625,650 620,645 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 623,622 Q 630,610 637,622 Z" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="625" cy="633" r="1.5" fill="black"/>
    <circle cx="635" cy="630" r="1.5" fill="black"/>
    <circle cx="630" cy="640" r="1.5" fill="black"/>
    
    <!-- Banana Slices inside -->
    <circle cx="672" cy="635" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="672" cy="635" r="7" fill="white" stroke="black" stroke-width="3"/>
    
    <circle cx="685" cy="652" r="15" fill="white" stroke="black" stroke-width="4"/>
    <circle cx="685" cy="652" r="7" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <!-- CHEERFUL DETAILS (Hearts and Sparkles) -->
  <g id="decorations">
    <!-- Star Sparkle Left -->
    <path d="M 140,465 Q 140,480 155,480 Q 140,480 140,495 Q 140,480 125,480 Q 140,480 140,465 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Star Sparkle Right -->
    <path d="M 670,435 Q 670,450 685,450 Q 670,450 670,465 Q 670,450 655,450 Q 670,450 670,435 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Star Sparkle Mid-High -->
    <path d="M 280,205 Q 280,220 295,220 Q 280,220 280,235 Q 280,220 265,220 Q 280,220 280,205 Z" fill="white" stroke="black" stroke-width="4"/>
    
    <!-- Cute Floating Hearts -->
    <path d="M 120,332 C 114,325 107,325 107,318 C 107,311 114,311 120,318 C 126,311 133,311 133,318 C 133,325 126,325 120,332 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 680,282 C 674,275 667,275 667,268 C 667,261 674,261 680,268 C 686,261 693,261 693,268 C 693,275 686,275 680,282 Z" fill="white" stroke="black" stroke-width="4"/>
  </g>
</svg>