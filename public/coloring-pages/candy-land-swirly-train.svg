<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="4" fill="white">
  <!-- Chocolate Track -->
  <path d="M-50 850 C 200 800, 600 900, 850 850 L 850 1050 L -50 1050 Z" />

  <!-- Landscape: Cupcakes and Gingerbread Houses -->
  <g id="landscape">
    <!-- Gingerbread House 1 -->
    <g transform="translate(100, 500)">
      <rect x="0" y="50" width="100" height="80" rx="10" ry="10" />
      <path d="M-10 50 L 50 0 L 110 50 Z" />
      <circle cx="25" cy="85" r="10" />
      <rect x="65" y="75" width="20" height="30" rx="5" ry="5" />
    </g>

    <!-- Cupcake 1 -->
    <g transform="translate(300, 550)">
      <rect x="0" y="70" width="100" height="40" rx="10" ry="10" />
      <path d="M10 70 C 20 60, 30 65, 40 60 C 50 55, 60 60, 70 55 C 80 50, 90 55, 100 50 C 90 30, 70 10, 50 0 C 30 10, 10 30, 0 50 L 0 70 Z" />
      <path fill="none" d="M10 65 C 20 55, 30 60, 40 55 M 50 50 C 60 45, 70 50, 80 45" stroke-width="3"/>
    </g>

    <!-- Gingerbread House 2 -->
    <g transform="translate(550, 480)">
      <rect x="0" y="50" width="120" height="90" rx="15" ry="15" />
      <path d="M-15 50 L 60 0 L 135 50 Z" />
      <rect x="20" y="70" width="30" height="40" rx="8" ry="8" />
      <circle cx="90" cy="85" r="12" />
    </g>

    <!-- Cupcake 2 -->
    <g transform="translate(680, 580)">
      <rect x="0" y="60" width="80" height="35" rx="8" ry="8" />
      <path d="M8 60 C 18 50, 28 55, 38 50 C 48 45, 58 50, 68 45 C 78 40, 80 45, 80 40 C 70 25, 50 5, 40 0 C 30 5, 10 25, 0 40 L 0 60 Z" />
      <path fill="none" d="M8 55 C 18 45, 28 50, 38 45 M 48 40 C 58 35, 68 40, 78 35" stroke-width="3"/>
    </g>
  </g>

  <!-- Fantastical Candy Train -->
  <g id="candy-train" transform="translate(50, 600)">

    <!-- Train Engine -->
    <g id="engine">
      <rect x="0" y="50" width="150" height="80" rx="20" ry="20" /> <!-- Main body -->
      <rect x="120" y="20" width="60" height="60" rx="10" ry="10" /> <!-- Cabin -->
      <rect x="20" y="10" width="40" height="50" rx="10" ry="10" /> <!-- Funnel base -->
      <ellipse cx="40" cy="10" rx="30" ry="15" /> <!-- Funnel top -->
      <circle cx="160" cy="90" r="15" /> <!-- Headlight -->

      <!-- Engine Wheels (Lollipop Swirl Style) -->
      <g transform="translate(40, 130)">
        <circle cx="0" cy="0" r="30" /> <!-- Outer wheel -->
        <path fill="none" d="M 0 0 Q 10 -5, 20 0 Q 15 10, 0 15 Q -15 10, -20 0 Q -15 -10, 0 -15 Q 10 -20, 25 -10 Q 30 5, 20 20" stroke-width="3"/>
      </g>
      <g transform="translate(120, 130)">
        <circle cx="0" cy="0" r="30" /> <!-- Outer wheel -->
        <path fill="none" d="M 0 0 Q 10 -5, 20 0 Q 15 10, 0 15 Q -15 10, -20 0 Q -15 -10, 0 -15 Q 10 -20, 25 -10 Q 30 5, 20 20" stroke-width="3"/>
      </g>
    </g>

    <!-- Train Car 1 -->
    <g id="car-1" transform="translate(180, 0)">
      <rect x="0" y="50" width="100" height="70" rx="15" ry="15" /> <!-- Car body -->
      <rect x="-10" y="80" width="20" height="10" rx="5" ry="5" /> <!-- Connector to engine -->
      <!-- Candies / Decorations -->
      <circle cx="30" cy="85" r="15" />
      <circle cx="70" cy="85" r="15" />
      <path fill="none" d="M10 60 C 20 50, 30 55, 40 50 C 50 45, 60 50, 70 45 C 80 40, 90 45, 90 40" stroke-width="3"/>

      <!-- Car 1 Wheels (Lollipop Swirl Style) -->
      <g transform="translate(30, 120)">
        <circle cx="0" cy="0" r="25" />
        <path fill="none" d="M 0 0 Q 8 -4, 16 0 Q 12 8, 0 12 Q -12 8, -16 0 Q -12 -8, 0 -12 Q 8 -16, 20 -8 Q 24 4, 16 16" stroke-width="3"/>
      </g>
      <g transform="translate(70, 120)">
        <circle cx="0" cy="0" r="25" />
        <path fill="none" d="M 0 0 Q 8 -4, 16 0 Q 12 8, 0 12 Q -12 8, -16 0 Q -12 -8, 0 -12 Q 8 -16, 20 -8 Q 24 4, 16 16" stroke-width="3"/>
      </g>
      <!-- Candy Character 1 -->
      <g transform="translate(50, 60)">
        <path d="M-20 -10 C -25 -20, -10 -30, 0 -30 C 10 -30, 25 -20, 20 -10 L 15 20 C 10 30, -10 30, -15 20 Z" />
        <circle cx="-5" cy="-15" r="3" />
        <circle cx="5" cy="-15" r="3" />
        <path fill="none" d="M-5 0 A 5 5 0 0 0 5 0" stroke-width="2"/>
        <path fill="none" d="M-25 5 L -10 15" stroke-width="3"/> <!-- Waving arm 1 -->
        <path fill="none" d="M25 5 L 10 15" stroke-width="3"/> <!-- Waving arm 2 -->
      </g>
    </g>

    <!-- Train Car 2 -->
    <g id="car-2" transform="translate(290, 0)">
      <rect x="0" y="50" width="100" height="70" rx="15" ry="15" /> <!-- Car body -->
      <rect x="-10" y="80" width="20" height="10" rx="5" ry="5" /> <!-- Connector to car 1 -->
      <!-- Candies / Decorations (stripes) -->
      <path fill="none" d="M10 60 L 90 60 M10 70 L 90 70 M10 80 L 90 80 M10 90 L 90 90 M10 100 L 90 100" stroke-width="3"/>
      
      <!-- Car 2 Wheels (Lollipop Swirl Style) -->
      <g transform="translate(30, 120)">
        <circle cx="0" cy="0" r="25" />
        <path fill="none" d="M 0 0 Q 8 -4, 16 0 Q 12 8, 0 12 Q -12 8, -16 0 Q -12 -8, 0 -12 Q 8 -16, 20 -8 Q 24 4, 16 16" stroke-width="3"/>
      </g>
      <g transform="translate(70, 120)">
        <circle cx="0" cy="0" r="25" />
        <path fill="none" d="M 0 0 Q 8 -4, 16 0 Q 12 8, 0 12 Q -12 8, -16 0 Q -12 -8, 0 -12 Q 8 -16, 20 -8 Q 24 4, 16 16" stroke-width="3"/>
      </g>
      <!-- Candy Character 2 -->
      <g transform="translate(50, 60)">
        <path d="M-20 -10 C -25 -20, -10 -30, 0 -30 C 10 -30, 25 -20, 20 -10 L 15 20 C 10 30, -10 30, -15 20 Z" />
        <circle cx="-5" cy="-15" r="3" />
        <circle cx="5" cy="-15" r="3" />
        <path fill="none" d="M-5 0 A 5 5 0 0 0 5 0" stroke-width="2"/>
        <path fill="none" d="M-25 5 L -10 15" stroke-width="3"/>
        <path fill="none" d="M25 5 L 10 15" stroke-width="3"/>
      </g>
    </g>

    <!-- Train Car 3 (last car) -->
    <g id="car-3" transform="translate(400, 0)">
      <rect x="0" y="50" width="100" height="70" rx="15" ry="15" /> <!-- Car body -->
      <rect x="-10" y="80" width="20" height="10" rx="5" ry="5" /> <!-- Connector to car 2 -->
      <!-- Candies / Decorations (dots and a bar) -->
      <circle cx="20" cy="70" r="10" />
      <circle cx="50" cy="85" r="10" />
      <circle cx="80" cy="70" r="10" />
      <path fill="none" d="M0 105 L 100 105" stroke-width="3"/>
      
      <!-- Car 3 Wheels (Lollipop Swirl Style) -->
      <g transform="translate(30, 120)">
        <circle cx="0" cy="0" r="25" />
        <path fill="none" d="M 0 0 Q 8 -4, 16 0 Q 12 8, 0 12 Q -12 8, -16 0 Q -12 -8, 0 -12 Q 8 -16, 20 -8 Q 24 4, 16 16" stroke-width="3"/>
      </g>
      <g transform="translate(70, 120)">
        <circle cx="0" cy="0" r="25" />
        <path fill="none" d="M 0 0 Q 8 -4, 16 0 Q 12 8, 0 12 Q -12 8, -16 0 Q -12 -8, 0 -12 Q 8 -16, 20 -8 Q 24 4, 16 16" stroke-width="3"/>
      </g>
      <!-- Candy Character 3 -->
      <g transform="translate(50, 60)">
        <path d="M-20 -10 C -25 -20, -10 -30, 0 -30 C 10 -30, 25 -20, 20 -10 L 15 20 C 10 30, -10 30, -15 20 Z" />
        <circle cx="-5" cy="-15" r="3" />
        <circle cx="5" cy="-15" r="3" />
        <path fill="none" d="M-5 0 A 5 5 0 0 0 5 0" stroke-width="2"/>
        <path fill="none" d="M-25 5 L -10 15" stroke-width="3"/>
        <path fill="none" d="M25 5 L 10 15" stroke-width="3"/>
      </g>
    </g>

  </g>
</svg>