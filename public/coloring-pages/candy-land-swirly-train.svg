<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Licorice Track -->
  <g id="licorice-track">
    <path d="M50 850 Q400 800 750 850 L750 870 Q400 820 50 870 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Environment Elements -->
  <g id="environment">
    <!-- Marshmallow Tree 1 -->
    <g id="marshmallow-tree-1">
      <path d="M100 700 Q150 500 200 700 Q150 600 100 700 Z" fill="white" stroke="black" stroke-width="5" />
      <circle cx="150" cy="550" r="100" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="100" cy="590" r="70" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="200" cy="590" r="70" fill="white" stroke="black" stroke-width="5"/>
    </g>
    <!-- Marshmallow Tree 2 -->
    <g id="marshmallow-tree-2">
      <path d="M600 680 Q650 480 700 680 Q650 580 600 680 Z" fill="white" stroke="black" stroke-width="5" />
      <circle cx="650" cy="530" r="100" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="600" cy="570" r="70" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="700" cy="570" r="70" fill="white" stroke="black" stroke-width="5"/>
    </g>

    <!-- Gummy Bear Flower 1 -->
    <g id="gummy-flower-1">
      <path d="M300 850 L300 750" stroke="black" stroke-width="5" fill="none"/>
      <circle cx="300" cy="740" r="25" fill="white" stroke="black" stroke-width="5"/> <!-- Center petal area -->
      <path d="M280 740 Q260 720 280 700 Q300 720 320 700 Q340 720 320 740 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Petals (simplified) -->
      <path d="M320 740 Q340 720 340 740 Q320 760 300 760 Q280 760 280 740 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M300 720 Q280 700 260 720 Q280 740 300 740 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Simplified gummy bear shape for center -->
      <path d="M290 735 C285 730 285 725 290 720 C295 715 305 715 310 720 C315 725 315 730 310 735 C305 740 295 740 290 735 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Gummy bear eyes -->
      <circle cx="295" cy="725" r="1" fill="white" stroke="black" stroke-width="1"/>
      <circle cx="305" cy="725" r="1" fill="white" stroke="black" stroke-width="1"/>
      <!-- Gummy bear mouth -->
      <path d="M297 730 Q300 733 303 730" fill="none" stroke="black" stroke-width="1.5"/>
    </g>
    <!-- Gummy Bear Flower 2 (scaled down and translated) -->
    <g id="gummy-flower-2" transform="translate(150 50) scale(0.8)">
      <path d="M300 850 L300 750" stroke="black" stroke-width="5" fill="none"/>
      <circle cx="300" cy="740" r="25" fill="white" stroke="black" stroke-width="5"/> <!-- Center petal area -->
      <path d="M280 740 Q260 720 280 700 Q300 720 320 700 Q340 720 320 740 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Petals (simplified) -->
      <path d="M320 740 Q340 720 340 740 Q320 760 300 760 Q280 760 280 740 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M300 720 Q280 700 260 720 Q280 740 300 740 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Simplified gummy bear shape for center -->
      <path d="M290 735 C285 730 285 725 290 720 C295 715 305 715 310 720 C315 725 315 730 310 735 C305 740 295 740 290 735 Z" fill="white" stroke="black" stroke-width="3"/>
      <!-- Gummy bear eyes -->
      <circle cx="295" cy="725" r="1" fill="white" stroke="black" stroke-width="1"/>
      <circle cx="305" cy="725" r="1" fill="white" stroke="black" stroke-width="1"/>
      <!-- Gummy bear mouth -->
      <path d="M297 730 Q300 733 303 730" fill="none" stroke="black" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Candy Train -->
  <g id="candy-train">
    <!-- Engine -->
    <g id="engine">
      <rect x="50" y="550" width="200" height="150" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/> <!-- Body -->
      <rect x="200" y="500" width="80" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/> <!-- Cab -->
      <circle cx="240" cy="500" r="30" fill="white" stroke="black" stroke-width="5"/> <!-- Funnel base -->
      <rect x="220" y="460" width="40" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/> <!-- Funnel stack -->
      <circle cx="80" cy="625" r="20" fill="white" stroke="black" stroke-width="5"/> <!-- Headlight -->
      <circle cx="80" cy="625" r="10" fill="white" stroke="black" stroke-width="3"/> <!-- Headlight inner -->

      <!-- Engine Face -->
      <g id="engine-face">
        <circle cx="150" cy="620" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
        <circle cx="200" cy="620" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
        <circle cx="150" cy="620" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Pupil -->
        <circle cx="200" cy="620" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Pupil -->
        <path d="M160 650 Q175 660 190 650" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->
      </g>

      <!-- Engine Swirly Candy Wheels -->
      <g id="engine-wheels">
        <circle cx="120" cy="700" r="60" fill="white" stroke="black" stroke-width="5"/>
        <path d="M120 640 A60 60 0 0 1 180 700 A60 60 0 0 1 120 760 A60 60 0 0 1 60 700 A60 60 0 0 1 120 640 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="120" cy="700" r="20" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="250" cy="700" r="60" fill="white" stroke="black" stroke-width="5"/>
        <path d="M250 640 A60 60 0 0 1 310 700 A60 60 0 0 1 250 760 A60 60 0 0 1 190 700 A60 60 0 0 1 250 640 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="250" cy="700" r="20" fill="white" stroke="black" stroke-width="3"/>
      </g>
    </g>

    <!-- Connector 1 -->
    <path d="M280 650 L330 650" stroke="black" stroke-width="5" fill="none"/>

    <!-- Cupcake Wagon -->
    <g id="cupcake-wagon">
      <path d="M330 650 C340 600 380 580 430 580 C480 580 520 600 530 650 L530 680 C510 700 490 710 460 710 L400 710 C370 710 350 700 330 680 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Cupcake bottom -->
      <path d="M360 650 L370 680 L380 650 L390 680 L400 650 L410 680 L420 650 L430 680 L440 650 L450 680 L460 650" fill="none" stroke="black" stroke-width="3"/> <!-- Pleats -->
      <path d="M350 580 C370 550 400 540 430 540 C460 540 490 550 510 580 C500 530 460 500 430 500 C400 500 360 530 350 580 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Frosting top -->
      <circle cx="430" cy="490" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Cherry -->

      <!-- Lollipop in Cupcake Wagon -->
      <g id="lollipop-in-cupcake">
        <path d="M430 630 L430 570" stroke="black" stroke-width="4" fill="none"/>
        <circle cx="430" cy="550" r="30" fill="white" stroke="black" stroke-width="5"/>
        <path d="M430 520 A30 30 0 0 1 460 550 A30 30 0 0 1 430 580 A30 30 0 0 1 400 550 A30 30 0 0 1 430 520 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="430" cy="550" r="10" fill="white" stroke="black" stroke-width="3"/>
        <!-- Lollipop eyes -->
        <circle cx="425" cy="545" r="2" fill="white" stroke="black" stroke-width="1.5"/>
        <circle cx="435" cy="545" r="2" fill="white" stroke="black" stroke-width="1.5"/>
        <!-- Lollipop mouth -->
        <path d="M427 558 Q430 562 433 558" fill="none" stroke="black" stroke-width="1.5"/>
      </g>

      <!-- Cupcake Swirly Candy Wheels -->
      <g id="cupcake-wheels">
        <circle cx="370" cy="730" r="40" fill="white" stroke="black" stroke-width="5"/>
        <path d="M370 690 A40 40 0 0 1 410 730 A40 40 0 0 1 370 770 A40 40 0 0 1 330 730 A40 40 0 0 1 370 690 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="370" cy="730" r="15" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="490" cy="730" r="40" fill="white" stroke="black" stroke-width="5"/>
        <path d="M490 690 A40 40 0 0 1 530 730 A40 40 0 0 1 490 770 A40 40 0 0 1 450 730 A40 40 0 0 1 490 690 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="490" cy="730" r="15" fill="white" stroke="black" stroke-width="3"/>
      </g>
    </g>

    <!-- Connector 2 -->
    <path d="M530 650 L580 650" stroke="black" stroke-width="5" fill="none"/>

    <!-- Chocolate Bar Wagon -->
    <g id="chocolate-bar-wagon">
      <rect x="580" y="580" width="180" height="100" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
      <line x1="640" y1="580" x2="640" y2="680" stroke="black" stroke-width="3"/>
      <line x1="700" y1="580" x2="700" y2="680" stroke="black" stroke-width="3"/>
      <line x1="580" y1="630" x2="760" y2="630" stroke="black" stroke-width="3"/>

      <!-- Gingerbread Man in Chocolate Bar Wagon -->
      <g id="gingerbread-man">
        <path d="M670 660 L670 620 C670 610 665 600 660 600 L640 600 C635 600 630 610 630 620 L630 660" fill="white" stroke="black" stroke-width="5"/>
        <path d="M635 625 L625 615 M665 625 L675 615 M640 650 L630 660 M660 650 L670 660" fill="none" stroke="black" stroke-width="3"/> <!-- Arms & Legs simplified -->
        <circle cx="650" cy="590" r="20" fill="white" stroke="black" stroke-width="5"/> <!-- Head -->
        <!-- Gingerbread eyes -->
        <circle cx="643" cy="585" r="2" fill="white" stroke="black" stroke-width="1.5"/>
        <circle cx="657" cy="585" r="2" fill="white" stroke="black" stroke-width="1.5"/>
        <!-- Gingerbread mouth -->
        <path d="M647 595 Q650 598 653 595" fill="none" stroke="black" stroke-width="1.5"/>
        <!-- Buttons -->
        <circle cx="650" cy="630" r="2" fill="white" stroke="black" stroke-width="1.5"/>
        <circle cx="650" cy="640" r="2" fill="white" stroke="black" stroke-width="1.5"/>
        <circle cx="650" cy="650" r="2" fill="white" stroke="black" stroke-width="1.5"/>
      </g>

      <!-- Chocolate Bar Swirly Candy Wheels -->
      <g id="chocolate-bar-wheels">
        <circle cx="620" cy="730" r="40" fill="white" stroke="black" stroke-width="5"/>
        <path d="M620 690 A40 40 0 0 1 660 730 A40 40 0 0 1 620 770 A40 40 0 0 1 580 730 A40 40 0 0 1 620 690 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="620" cy="730" r="15" fill="white" stroke="black" stroke-width="3"/>
        <circle cx="720" cy="730" r="40" fill="white" stroke="black" stroke-width="5"/>
        <path d="M720 690 A40 40 0 0 1 760 730 A40 40 0 0 1 720 770 A40 40 0 0 1 680 730 A40 40 0 0 1 720 690 Z" fill="none" stroke="black" stroke-width="3"/>
        <circle cx="720" cy="730" r="15" fill="white" stroke="black" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>