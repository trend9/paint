<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Mushroom House -->
  <g id="mushroom-house" stroke="black" stroke-width="5" fill="white">
    <!-- Stalk -->
    <rect x="350" y="550" width="100" height="250" rx="50" ry="50" />
    <!-- Cap -->
    <path d="M250 550 C150 400, 650 400, 550 550 Z" />
    <!-- Door -->
    <rect x="375" y="700" width="50" height="100" rx="20" ry="20" />
    <!-- Door handle -->
    <circle cx="410" cy="750" r="5" fill="black" stroke-width="0"/>
    <!-- Windows -->
    <circle cx="300" cy="600" r="30" />
    <circle cx="500" cy="600" r="30" />
    <!-- Spots on cap -->
    <circle cx="300" cy="480" r="40" />
    <circle cx="450" cy="450" r="50" />
    <circle cx="550" cy="510" r="35" />
  </g>

  <!-- Fairy -->
  <g id="fairy" stroke="black" stroke-width="3" fill="white">
    <!-- Body -->
    <ellipse cx="600" cy="300" rx="30" ry="50" />
    <!-- Head -->
    <circle cx="600" cy="230" r="25" />
    <!-- Face: eyes and smile -->
    <circle cx="590" cy="225" r="3" fill="black" stroke-width="0"/>
    <circle cx="610" cy="225" r="3" fill="black" stroke-width="0"/>
    <path d="M590 235 Q600 245, 610 235" fill="none" stroke="black" stroke-width="3"/>
    <!-- Hair -->
    <path d="M580 205 Q560 215, 570 240 L585 240 L580 205 Z" />
    <path d="M620 205 Q640 215, 630 240 L615 240 L620 205 Z" />
    <!-- Simple Dress -->
    <path d="M570 320 L630 320 C640 350, 610 380, 600 390 C590 380, 560 350, 570 320 Z" />
    <!-- Arms -->
    <path d="M575 300 Q550 310, 560 330" fill="none" stroke="black" stroke-width="3"/>
    <path d="M625 300 Q650 310, 640 330" fill="none" stroke="black" stroke-width="3"/>
    <!-- Tiny translucent wings (represented by outlines and white fill) -->
    <!-- Left pair -->
    <path d="M570 270 Q550 240, 560 210 Q580 240, 570 270 Z" />
    <path d="M560 280 Q540 250, 550 220 Q570 250, 560 280 Z" />
    <!-- Right pair -->
    <path d="M630 270 Q650 240, 640 210 Q620 240, 630 270 Z" />
    <path d="M640 280 Q660 250, 650 220 Q630 250, 640 280 Z" />
  </g>

  <!-- Squirrel -->
  <g id="squirrel" stroke="black" stroke-width="5" fill="white">
    <!-- Body -->
    <ellipse cx="200" cy="800" rx="60" ry="40" />
    <!-- Head -->
    <circle cx="170" cy="750" r="35" />
    <!-- Ears -->
    <path d="M150 720 Q160 700, 170 720 Z" />
    <path d="M180 720 Q190 700, 200 720 Z" />
    <!-- Face -->
    <circle cx="160" cy="745" r="3" fill="black" stroke-width="0"/> <!-- Eye -->
    <circle cx="180" cy="745" r="3" fill="black" stroke-width="0"/> <!-- Eye -->
    <path d="M170 760 Q175 770, 180 760" fill="none" stroke="black" stroke-width="5"/> <!-- Smile -->
    <!-- Tail -->
    <path d="M250 810 C280 750, 270 650, 200 680 C230 730, 240 780, 250 810 Z" />
    <!-- Front Paws -->
    <ellipse cx="180" cy="790" rx="15" ry="10" />
    <ellipse cx="220" cy="790" rx="15" ry="10" />
    <!-- Back Paws (simple) -->
    <ellipse cx="170" cy="830" rx="20" ry="10" />
    <ellipse cx="230" cy="830" rx="20" ry="10" />
  </g>

  <!-- Bird and small branch -->
  <g id="bird-and-branch">
    <!-- Small branch for the bird -->
    <rect x="400" y="770" width="150" height="20" rx="10" ry="10" stroke="black" stroke-width="5" fill="white"/>
    <!-- Bird -->
    <g id="bird" transform="translate(475 740)" stroke="black" stroke-width="5" fill="white">
        <!-- Body -->
        <ellipse cx="0" cy="0" rx="40" ry="30" />
        <!-- Head -->
        <circle cx="-30" cy="-15" r="20" />
        <!-- Eye -->
        <circle cx="-35" cy="-20" r="3" fill="black" stroke-width="0"/>
        <!-- Beak -->
        <path d="M-45 -15 L-60 -10 L-45 -5 Z" />
        <!-- Wing -->
        <path d="M0 -20 Q20 -10, 0 10 Z" />
        <!-- Tail Feathers -->
        <path d="M40 0 L50 10 L40 20 Z" />
        <!-- Legs (thin lines, fill none) -->
        <line x1="-10" y1="25" x2="-10" y2="45" stroke="black" stroke-width="3" fill="none"/>
        <line x1="10" y1="25" x2="10" y2="45" stroke="black" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- Flowers and Leaves -->
  <g id="flowers-leaves" stroke="black" stroke-width="5" fill="white">
    <!-- Large Flower 1 (bottom left) -->
    <g transform="translate(100 900)">
        <circle cx="0" cy="0" r="20" /> <!-- Center -->
        <ellipse cx="-30" cy="0" rx="25" ry="15" />
        <ellipse cx="30" cy="0" rx="25" ry="15" />
        <ellipse cx="0" cy="-30" rx="15" ry="25" />
        <ellipse cx="0" cy="30" rx="15" ry="25" />
        <ellipse cx="-20" cy="-20" rx="20" ry="10" transform="rotate(-45 0 0)"/>
        <ellipse cx="20" cy="-20" rx="20" ry="10" transform="rotate(45 0 0)"/>
        <ellipse cx="-20" cy="20" rx="20" ry="10" transform="rotate(-135 0 0)"/>
        <ellipse cx="20" cy="20" rx="20" ry="10" transform="rotate(135 0 0)"/>
    </g>
    <!-- Large Leaf 1 (near mushroom, left) -->
    <path d="M280 850 Q230 800, 250 750 Q300 780, 280 850 Z" />
    <!-- Large Leaf 2 (near mushroom, right) -->
    <path d="M520 850 Q570 800, 550 750 Q500 780, 520 850 Z" />

    <!-- Simple Tall Flower 2 (right side) -->
    <g transform="translate(700 850)">
        <path d="M0 0 L0 -50" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/> <!-- Stem -->
        <circle cx="0" cy="-50" r="20" /> <!-- Center -->
        <path d="M-10 -70 Q-20 -80, 0 -90 Q20 -80, 10 -70 Z" /> <!-- Top petal -->
        <path d="M-10 -30 Q-20 -40, 0 -20 Q20 -40, 10 -30 Z" /> <!-- Bottom petal -->
        <path d="M-30 -60 Q-40 -70, -50 -50 Q-40 -40, -30 -60 Z" /> <!-- Left petal -->
        <path d="M30 -60 Q40 -70, 50 -50 Q40 -40, 30 -60 Z" /> <!-- Right petal -->
    </g>

    <!-- Simple Tall Flower 3 (left side) -->
    <g transform="translate(50 650)">
        <path d="M0 0 L0 -50" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/> <!-- Stem -->
        <circle cx="0" cy="-50" r="20" /> <!-- Center -->
        <path d="M-10 -70 Q-20 -80, 0 -90 Q20 -80, 10 -70 Z" /> <!-- Top petal -->
        <path d="M-10 -30 Q-20 -40, 0 -20 Q20 -40, 10 -30 Z" /> <!-- Bottom petal -->
        <path d="M-30 -60 Q-40 -70, -50 -50 Q-40 -40, -30 -60 Z" /> <!-- Left petal -->
        <path d="M30 -60 Q40 -70, 50 -50 Q40 -40, 30 -60 Z" /> <!-- Right petal -->
    </g>
    
    <!-- Large Leaf 3 (top right) -->
    <path d="M700 500 Q750 450, 730 400 Q680 430, 700 500 Z" />
    <!-- Large Leaf 4 (top left) -->
    <path d="M100 500 Q50 450, 70 400 Q120 430, 100 500 Z" />

  </g>

</svg>