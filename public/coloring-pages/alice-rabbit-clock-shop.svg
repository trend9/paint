<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke="black" stroke-width="5" fill="white" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pure white background -->
  <rect x="0" y="0" width="800" height="1000" fill="white" stroke="none" />

  <!-- Floor line -->
  <line x1="0" y1="800" x2="800" y2="800" fill="none" stroke-width="5" />

  <!-- Clock Shop Elements (background and foreground clocks) -->
  <g id="clock-shop">
    <!-- Large Gears on the wall -->
    <circle cx="100" cy="150" r="60" fill="white" stroke-width="4" />
    <path d="M100 90 L100 110 M126 108 L112 122 M140 150 L120 150 M126 192 L112 178 M100 210 L100 190 M74 192 L88 178 M60 150 L80 150 M74 108 L88 122" fill="none" stroke-width="4" />
    <circle cx="700" cy="100" r="80" fill="white" stroke-width="4" />
    <path d="M700 20 L700 40 M738 52 L724 66 M760 100 L740 100 M738 148 L724 134 M700 180 L700 160 M662 148 L676 134 M640 100 L660 100 M662 52 L676 66" fill="none" stroke-width="4" />
    <circle cx="750" cy="850" r="40" fill="white" stroke-width="3" />
    <path d="M750 810 L750 820 M767 826 L760 833 M770 850 L760 850 M767 874 L760 867 M750 890 L750 880 M733 874 L740 867 M730 850 L740 850 M733 826 L740 833" fill="none" stroke-width="3" />


    <!-- Grandfather Clock 1 (left) -->
    <g transform="translate(50, 250)">
      <rect x="0" y="0" width="100" height="550" rx="10" ry="10" fill="white" stroke-width="5" />
      <rect x="10" y="10" width="80" height="120" rx="5" ry="5" fill="white" stroke-width="4" /> <!-- Clock face frame -->
      <circle cx="50" cy="70" r="30" fill="white" stroke-width="3" /> <!-- Clock face -->
      <line x1="50" y1="70" x2="50" y2="50" stroke-width="3" /> <!-- Hour hand -->
      <line x1="50" y1="70" x2="65" y2="70" stroke-width="3" /> <!-- Minute hand -->
      <line x1="50" y1="150" x2="50" y2="250" fill="none" stroke-width="3" /> <!-- Pendulum rod -->
      <circle cx="50" cy="270" r="20" fill="white" stroke-width="3" /> <!-- Pendulum bob -->
    </g>

    <!-- Cuckoo Clock 1 (top center) -->
    <g transform="translate(350, 50)">
      <path d="M0 50 L50 0 L100 50 L100 150 L0 150 Z" fill="white" stroke-width="5" /> <!-- House shape -->
      <rect x="30" y="60" width="40" height="30" rx="5" ry="5" fill="white" stroke-width="4" /> <!-- Cuckoo door -->
      <circle cx="50" cy="75" r="10" fill="white" stroke-width="3" /> <!-- Clock face -->
      <line x1="50" y1="75" x2="50" y2="70" stroke-width="3" /> <!-- Hour hand -->
      <line x1="50" y1="75" x2="58" y2="75" stroke-width="3" /> <!-- Minute hand -->
      <line x1="50" y1="150" x2="50" y2="200" fill="none" stroke-width="3" /> <!-- Pendulum string -->
      <circle cx="50" cy="210" r="15" fill="white" stroke-width="3" /> <!-- Weight -->
      <line x1="20" y1="150" x2="20" y2="180" fill="none" stroke-width="3" />
      <circle cx="20" cy="190" r="10" fill="white" stroke-width="3" />
      <line x1="80" y1="150" x2="80" y2="180" fill="none" stroke-width="3" />
      <circle cx="80" cy="190" r="10" fill="white" stroke-width="3" />
    </g>

    <!-- Ornate Wall Clock (right) -->
    <g transform="translate(550, 200)">
      <circle cx="0" cy="0" r="70" fill="white" stroke-width="5" />
      <circle cx="0" cy="0" r="50" fill="white" stroke-width="4" /> <!-- Inner clock face -->
      <line x1="0" y1="0" x2="0" y2="-30" stroke-width="3" />
      <line x1="0" y1="0" x2="20" y2="0" stroke-width="3" />
      <!-- Ornate top details -->
      <path d="M-30 -70 Q0 -100 30 -70" fill="white" stroke-width="4" />
      <circle cx="-35" cy="-65" r="10" fill="white" stroke-width="3" />
      <circle cx="35" cy="-65" r="10" fill="white" stroke-width="3" />
    </g>

    <!-- Smaller clock on shelf (bottom right) -->
    <g transform="translate(600, 700)">
        <rect x="0" y="0" width="120" height="80" rx="10" ry="10" fill="white" stroke-width="5" />
        <rect x="10" y="10" width="100" height="60" rx="5" ry="5" fill="white" stroke-width="4" />
        <circle cx="60" cy="40" r="25" fill="white" stroke-width="3" />
        <line x1="60" y1="40" x2="60" y2="25" stroke-width="3" />
        <line x1="60" y1="40" x2="70" y2="45" stroke-width="3" />
    </g>

  </g>

  <!-- Cute Happy Anthropomorphic White Rabbit -->
  <g id="rabbit" transform="translate(350, 500)">
    <!-- Body -->
    <path d="M-70 0 Q-100 150 0 200 Q100 150 70 0 Z" fill="white" stroke-width="5" />

    <!-- Head -->
    <circle cx="0" cy="-60" r="80" fill="white" stroke-width="5" />

    <!-- Ears -->
    <path d="M-50 -140 Q-70 -200 -30 -220 Q10 -200 -10 -140 Z" fill="white" stroke-width="5" />
    <path d="M50 -140 Q70 -200 30 -220 Q-10 -200 10 -140 Z" fill="white" stroke-width="5" />

    <!-- Face details -->
    <circle cx="-30" cy="-70" r="10" fill="white" stroke-width="3" /> <!-- Left Eye -->
    <circle cx="30" cy="-70" r="10" fill="white" stroke-width="3" /> <!-- Right Eye -->
    <ellipse cx="0" cy="-30" rx="10" ry="8" fill="white" stroke-width="3" /> <!-- Nose -->
    <path d="M-20 -10 Q0 0 20 -10" fill="none" stroke-width="3" /> <!-- Mouth -->

    <!-- Waistcoat -->
    <path d="M-50 0 L-30 60 Q0 70 30 60 L50 0 L-50 0 Z" fill="white" stroke-width="4" />
    <circle cx="-15" cy="30" r="7" fill="white" stroke-width="3" />
    <circle cx="15" cy="30" r="7" fill="white" stroke-width="3" />

    <!-- Arms -->
    <path d="M-70 20 Q-120 40 -100 100 Q-80 120 -50 80 Z" fill="white" stroke-width="5" /> <!-- Left Arm -->
    <path d="M70 20 Q120 40 100 100 Q80 120 50 80 Z" fill="white" stroke-width="5" /> <!-- Right Arm -->

    <!-- Pocket Watch (held by left hand) -->
    <g transform="translate(-110, 80)">
      <circle cx="0" cy="0" r="40" fill="white" stroke-width="5" />
      <circle cx="0" cy="0" r="30" fill="white" stroke-width="3" /> <!-- Watch face -->
      <line x1="0" y1="0" x2="0" y2="-20" stroke-width="3" /> <!-- Hour hand -->
      <line x1="0" y1="0" x2="15" y2="0" stroke-width="3" /> <!-- Minute hand -->
      <path d="M0 -40 Q5 -50 0 -55 Q-5 -50 0 -40 Z" fill="white" stroke-width="3" /> <!-- Watch loop -->
    </g>

    <!-- Legs -->
    <rect x="-60" y="180" width="50" height="40" rx="15" ry="15" fill="white" stroke-width="5" />
    <rect x="10" y="180" width="50" height="40" rx="15" ry="15" fill="white" stroke-width="5" />
  </g>

  <!-- Small details to fill space and make it more whimsical -->
  <g id="whimsical-details">
    <circle cx="200" cy="700" r="30" fill="white" stroke-width="4" />
    <path d="M200 670 L200 680 M213 686 L207 692 M220 700 L210 700 M213 714 L207 708 M200 730 L200 720 M187 714 L193 708 M180 700 L190 700 M187 686 L193 692" fill="none" stroke-width="3" />

    <circle cx="450" cy="880" r="25" fill="white" stroke-width="4" />
    <path d="M450 855 L450 865 M461 870 L456 875 M475 880 L465 880 M461 890 L456 885 M450 905 L450 895 M439 890 L444 885 M425 880 L435 880 M439 870 L444 875" fill="none" stroke-width="3" />
  </g>

</svg>