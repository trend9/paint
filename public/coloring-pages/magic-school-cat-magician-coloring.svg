<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <g id="background_elements">
    <!-- Simple Table -->
    <rect x="100" y="780" width="600" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/>
    <rect x="120" y="820" width="30" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/>
    <rect x="650" y="820" width="30" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/>

    <!-- Potion Bottle on Table -->
    <g id="potion_bottle">
      <path d="M520 700 L500 750 C490 770 510 770 500 790 L520 790 C510 770 530 770 520 750 L500 700 Z" fill="white" stroke="black" stroke-width="5"/>
      <rect x="500" y="750" width="40" height="40" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/>
      <ellipse cx="520" cy="740" rx="20" ry="10" fill="white" stroke="black" stroke-width="5"/>
    </g>

    <!-- Floating Stars -->
    <g id="floating_stars">
      <!-- Star 1 -->
      <path d="M150 150 L170 180 L210 185 L180 210 L190 250 L150 220 L110 250 L120 210 L90 185 L130 180 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Star 2 -->
      <path d="M600 100 L620 130 L660 135 L630 160 L640 200 L600 170 L560 200 L570 160 L540 135 L580 130 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Star 3 -->
      <path d="M250 50 L270 80 L310 85 L280 110 L290 150 L250 120 L210 150 L220 110 L190 85 L230 80 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Star 4 -->
      <path d="M700 300 L715 320 L740 325 L720 340 L725 360 L700 345 L675 360 L680 340 L660 325 L685 320 Z" fill="white" stroke="black" stroke-width="4"/>
      <!-- Star 5 -->
      <path d="M100 450 L115 470 L140 475 L120 490 L125 510 L100 495 L75 510 L80 490 L60 475 L85 470 Z" fill="white" stroke="black" stroke-width="4"/>
    </g>
  </g>

  <!-- Cat Magician -->
  <g id="cat_magician">
    <!-- Cat Body -->
    <ellipse cx="400" cy="700" rx="180" ry="150" fill="white" stroke="black" stroke-width="5"/>
    <!-- Cat Head -->
    <circle cx="400" cy="500" r="140" fill="white" stroke="black" stroke-width="5"/>
    <!-- Cat Ears -->
    <path d="M300 380 C320 300 380 300 400 380 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M500 380 C480 300 420 300 400 380 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Cat Face -->
    <g id="cat_face">
      <!-- Eyes -->
      <circle cx="340" cy="470" r="30" fill="white" stroke="black" stroke-width="5"/>
      <circle cx="460" cy="470" r="30" fill="white" stroke="black" stroke-width="5"/>
      <!-- Nose -->
      <path d="M400 520 L380 540 L420 540 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Mouth (happy smile) -->
      <path d="M350 560 Q400 600 450 560" fill="none" stroke="black" stroke-width="5"/>
      <!-- Whiskers -->
      <path d="M300 540 L250 530" fill="none" stroke="black" stroke-width="3"/>
      <path d="M300 560 L250 570" fill="none" stroke="black" stroke-width="3"/>
      <path d="M300 580 L250 590" fill="none" stroke="black" stroke-width="3"/>
      <path d="M500 540 L550 530" fill="none" stroke="black" stroke-width="3"/>
      <path d="M500 560 L550 570" fill="none" stroke="black" stroke-width="3"/>
      <path d="M500 580 L550 590" fill="none" stroke="black" stroke-width="3"/>
    </g>

    <!-- Wizard Hat -->
    <g id="wizard_hat">
      <ellipse cx="400" cy="400" rx="140" ry="40" fill="white" stroke="black" stroke-width="5"/>
      <path d="M300 380 L400 150 L500 380 Z" fill="white" stroke="black" stroke-width="5"/>
      <!-- Hat details -->
      <circle cx="400" cy="270" r="30" fill="white" stroke="black" stroke-width="5"/>
    </g>

    <!-- Small Cape -->
    <g id="small_cape">
      <path d="M300 580 C200 600 200 700 300 720 L300 600 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M500 580 C600 600 600 700 500 720 L500 600 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M300 580 Q400 600 500 580 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M300 600 C300 650 500 650 500 600 Z" fill="white" stroke="black" stroke-width="5"/>
    </g>

    <!-- Cat Paws -->
    <g id="cat_paws">
      <!-- Left Paw -->
      <ellipse cx="300" cy="800" rx="60" ry="40" fill="white" stroke="black" stroke-width="5"/>
      <!-- Right Paw (holding wand) -->
      <ellipse cx="500" cy="800" rx="60" ry="40" fill="white" stroke="black" stroke-width="5"/>
    </g>

    <!-- Cat Tail -->
    <path d="M220 750 Q180 850 250 900 Q300 880 300 800 Z" fill="white" stroke="black" stroke-width="5"/>

    <!-- Magic Wand -->
    <g id="magic_wand">
      <rect x="520" y="650" width="20" height="180" rx="10" ry="10" transform="rotate(-30 520 650)" fill="white" stroke="black" stroke-width="5"/>
      <!-- Sparkling effect -->
      <path d="M600 550 L620 580 L660 585 L630 610 L640 650 L600 620 L560 650 L570 610 L540 585 L580 580 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M600 550 L600 650 M550 600 L650 600" fill="none" stroke="black" stroke-width="3"/>
    </g>
  </g>
</svg>