<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="backdrop" stroke="black" stroke-width="4" fill="white">
    <!-- Magical School Building -->
    <!-- Main Wall -->
    <rect x="100" y="350" width="600" height="550" rx="30" ry="30" />
    <!-- Roof -->
    <path d="M 100 350 L 400 150 L 700 350 Z" />
    <!-- Archway Entrance -->
    <path d="M 300 900 L 300 650 A 100 100 0 0 1 500 650 L 500 900 Z" fill="none"/>
    <!-- Small Windows -->
    <circle cx="200" cy="450" r="40" />
    <circle cx="600" cy="450" r="40" />

    <!-- Stars (simplified to circles for toddlers) -->
    <circle cx="100" cy="150" r="20" />
    <circle cx="700" cy="100" r="20" />
    <circle cx="500" cy="150" r="15" />
    <circle cx="250" cy="50" r="15" />

    <!-- Potions -->
    <path d="M 100 800 L 100 700 Q 100 650 150 650 Q 200 650 200 700 L 200 800 Q 200 850 150 850 Q 100 850 100 800 Z" />
    <path d="M 600 850 L 600 750 Q 600 700 650 700 Q 700 700 700 750 L 700 850 Q 700 900 650 900 Q 600 900 600 850 Z" />
    <!-- Bubbles in potions -->
    <circle cx="150" cy="770" r="10" />
    <circle cx="170" cy="790" r="8" />
    <circle cx="130" cy="795" r="7" />
    <circle cx="650" cy="820" r="10" />
    <circle cx="630" cy="840" r="8" />
    <circle cx="670" cy="845" r="7" />

    <!-- Floating Book -->
    <rect x="300" y="200" width="200" height="120" rx="10" ry="10" />
    <!-- Book pages lines -->
    <path d="M 300 220 L 500 220 M 300 240 L 500 240 M 300 260 L 500 260" fill="none"/>
  </g>

  <g id="cat-magician" stroke="black" stroke-width="4" fill="white">
    <!-- Cat Body -->
    <ellipse cx="400" cy="720" rx="130" ry="100" />
    <!-- Cat Head -->
    <circle cx="400" cy="550" r="90" />
    <!-- Cat Ears -->
    <path d="M 330 500 Q 350 450 380 470 Q 370 510 330 500 Z" />
    <path d="M 470 500 Q 450 450 420 470 Q 430 510 470 500 Z" />
    <!-- Inner Ears -->
    <path d="M 345 505 Q 360 470 380 480 Q 370 500 345 505 Z" />
    <path d="M 455 505 Q 440 470 420 480 Q 430 500 455 505 Z" />

    <!-- Pointed Hat -->
    <path d="M 350 480 L 400 380 L 450 480 Z" />
    <ellipse cx="400" cy="480" rx="60" ry="15" />
    <!-- Star on hat -->
    <path d="M390,400 L395,415 L410,415 L400,425 L405,440 L390,430 L375,440 L380,425 L370,415 L385,415 Z" />

    <!-- Small Cape -->
    <path d="M 300 600 Q 250 650 280 750 L 520 750 Q 550 650 500 600 Z" />
    <path d="M 300 600 Q 350 610 400 600 Q 450 610 500 600" fill="none" stroke-width="3"/> <!-- collar detail -->

    <!-- Magic Wand -->
    <rect x="480" y="650" width="10" height="100" rx="5" ry="5" />
    <!-- Star on wand tip -->
    <path d="M490,640 L495,655 L510,655 L500,665 L505,680 L490,670 L475,680 L480,665 L470,655 L485,655 Z" />

    <!-- Cat Face (eyes, nose, mouth) -->
    <!-- Eyes -->
    <circle cx="365" cy="530" r="15" />
    <circle cx="435" cy="530" r="15" />
    <!-- Pupils (fill white for coloring) -->
    <circle cx="365" cy="535" r="5" fill="white" />
    <circle cx="435" cy="535" r="5" fill="white" />
    <!-- Nose -->
    <path d="M 400 560 L 390 570 Q 400 580 410 570 Z" />
    <!-- Mouth -->
    <path d="M 370 585 Q 400 600 430 585" fill="none"/>
    <!-- Whiskers -->
    <path d="M 320 560 L 360 560 M 325 570 L 365 570 M 330 580 L 370 580" fill="none"/>
    <path d="M 480 560 L 440 560 M 475 570 L 435 570 M 470 580 L 430 580" fill="none"/>

    <!-- Front Paws -->
    <rect x="300" y="680" width="60" height="80" rx="30" ry="30" />
    <rect x="440" y="680" width="60" height="80" rx="30" ry="30" />
  </g>
</svg>