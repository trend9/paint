<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .outline {
        stroke: black;
        stroke-width: 4;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-thin {
        stroke: black;
        stroke-width: 3;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-nofill {
        stroke: black;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-thin-nofill {
        stroke: black;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Group for the main blackboard (background element) -->
  <g id="blackboard">
    <rect x="100" y="150" width="600" height="700" rx="30" ry="30" class="outline"/>
    <!-- Blackboard frame detail, simplified -->
    <rect x="115" y="165" width="570" height="670" rx="20" ry="20" class="outline-nofill"/>
  </g>

  <!-- Group for the Cat Magician -->
  <g id="cat-magician">
    <!-- Cat Body -->
    <ellipse cx="400" cy="650" rx="180" ry="200" class="outline"/>
    <!-- Cat Tail -->
    <path d="M 230 750 Q 150 700 180 600 Q 200 550 250 500" class="outline-nofill"/>
    <!-- Cat Paws (Front) -->
    <ellipse cx="320" cy="780" rx="60" ry="40" class="outline" transform="rotate(-15 320 780)"/>
    <ellipse cx="480" cy="780" rx="60" ry="40" class="outline" transform="rotate(15 480 780)"/>

    <!-- Cat Head and Face -->
    <g id="cat-head">
      <circle cx="400" cy="420" r="120" class="outline"/>
      <!-- Cat Ears -->
      <path d="M 330 300 Q 350 250 370 300 Q 360 330 330 300 Z" class="outline"/>
      <path d="M 470 300 Q 450 250 430 300 Q 440 330 470 300 Z" class="outline"/>
      <!-- Eyes -->
      <circle cx="360" cy="400" r="20" class="outline-thin"/>
      <circle cx="440" cy="400" r="20" class="outline-thin"/>
      <!-- Nose -->
      <ellipse cx="400" cy="440" rx="15" ry="10" class="outline-thin"/>
      <!-- Mouth - friendly smile -->
      <path d="M 370 470 Q 400 490 430 470" class="outline-thin-nofill"/>
    </g>

    <!-- Wizard Hat -->
    <g id="wizard-hat">
      <!-- Hat brim -->
      <ellipse cx="400" cy="330" rx="100" ry="30" class="outline"/>
      <!-- Hat cone -->
      <path d="M 320 320 Q 400 150 480 320 Z" class="outline"/>
      <!-- Stars on hat -->
      <path d="M 370 200 L 375 210 L 385 215 L 375 220 L 370 230 L 365 220 L 355 215 L 365 210 Z" class="outline-thin"/>
      <path d="M 430 250 L 435 260 L 445 265 L 435 270 L 430 280 L 425 270 L 415 265 L 425 260 Z" class="outline-thin"/>
      <path d="M 400 170 L 405 180 L 415 185 L 405 190 L 400 200 L 395 190 L 385 185 L 395 180 Z" class="outline-thin"/>
    </g>

    <!-- Cat's arm holding the wand -->
    <g id="cat-wand-arm">
      <path d="M 450 600 Q 490 550 520 580 Q 550 610 520 650 Q 490 680 450 650 Z" class="outline"/>
      <!-- Wand -->
      <rect x="500" y="550" width="20" height="150" rx="10" ry="10" class="outline" transform="rotate(45 500 600)"/>
      <!-- Star at wand tip -->
      <path d="M 600 500 L 610 520 L 630 525 L 610 530 L 600 550 L 590 530 L 570 525 L 590 520 Z" class="outline"/>
    </g>
  </g>

  <!-- Floating Playing Cards and Stars (foreground elements) -->
  <g id="floating-elements">
    <!-- Card 1 (Circle inside) -->
    <rect x="150" y="250" width="80" height="120" rx="10" ry="10" class="outline" transform="rotate(-15 190 310)"/>
    <circle cx="190" cy="310" r="20" class="outline-thin"/>
    <!-- Card 2 (Square inside) -->
    <rect x="600" y="200" width="80" height="120" rx="10" ry="10" class="outline" transform="rotate(10 640 260)"/>
    <rect x="625" y="245" width="30" height="30" rx="5" ry="5" class="outline-thin"/>
    <!-- Card 3 (Diamond inside) -->
    <rect x="100" y="600" width="80" height="120" rx="10" ry="10" class="outline" transform="rotate(20 140 660)"/>
    <path d="M 140 650 L 150 670 L 140 690 L 130 670 Z" class="outline-thin"/>
    <!-- Card 4 (Club-like inside) -->
    <rect x="650" y="650" width="80" height="120" rx="10" ry="10" class="outline" transform="rotate(-5 690 710)"/>
    <circle cx="680" cy="690" r="10" class="outline-thin"/>
    <circle cx="700" cy="690" r="10" class="outline-thin"/>
    <circle cx="690" cy="680" r="10" class="outline-thin"/>
    <!-- Simple stem for the club -->
    <path d="M 685 695 L 695 695 L 695 715 L 685 715 Z" class="outline-thin"/>


    <!-- Small Stars -->
    <path d="M 250 180 L 255 190 L 265 195 L 255 200 L 250 210 L 245 200 L 235 195 L 245 190 Z" class="outline-thin"/>
    <path d="M 550 160 L 555 170 L 565 175 L 555 180 L 550 190 L 545 180 L 535 175 L 545 170 Z" class="outline-thin"/>
    <path d="M 700 500 L 705 510 L 715 515 L 705 520 L 700 530 L 695 520 L 685 515 L 695 510 Z" class="outline-thin"/>
    <path d="M 120 450 L 125 460 L 135 465 L 125 470 L 120 480 L 115 470 L 105 465 L 115 460 Z" class="outline-thin"/>
    <path d="M 300 850 L 305 860 L 315 865 L 305 870 L 300 880 L 295 870 L 285 865 L 295 860 Z" class="outline-thin"/>
  </g>
</svg>