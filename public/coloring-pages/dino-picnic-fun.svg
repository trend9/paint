<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <g id="sky_elements">
    <!-- Sun -->
    <g id="sun" transform="translate(680, 100)">
      <circle cx="0" cy="0" r="60" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Rays -->
      <line x1="0" y1="-70" x2="0" y2="-90" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="70" x2="0" y2="90" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70" y1="0" x2="-90" y2="0" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="0" x2="90" y2="0" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="49.5" y1="-49.5" x2="63.6" y2="-63.6" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="-49.5" y1="-49.5" x2="-63.6" y2="-63.6" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="49.5" y1="49.5" x2="63.6" y2="63.6" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <line x1="-49.5" y1="49.5" x2="-63.6" y2="63.6" stroke="black" stroke-width="4" stroke-linecap="round"/>
      <!-- Smiling face -->
      <circle cx="-20" cy="-10" r="8" fill="white" stroke="black" stroke-width="3"/>
      <circle cx="20" cy="-10" r="8" fill="white" stroke="black" stroke-width="3"/>
      <path d="M -30 20 Q 0 45 30 20" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Clouds -->
    <g id="clouds">
      <path d="M 100 80 Q 80 40 120 20 Q 180 0 240 20 Q 280 40 260 80 Q 240 120 180 120 Q 120 120 100 80 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 400 60 Q 380 20 420 0 Q 480 -20 540 0 Q 580 20 560 60 Q 540 100 480 100 Q 420 100 400 60 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="ground_elements">
    <!-- Picnic Blanket (checkered pattern) -->
    <g id="picnic_blanket">
      <rect x="100" y="600" width="600" height="200" rx="30" ry="30" fill="white" stroke="black" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Checkered pattern lines -->
      <line x1="100" y1="650" x2="700" y2="650" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="100" y1="700" x2="700" y2="700" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="100" y1="750" x2="700" y2="750" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="200" y1="600" x2="200" y2="800" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="300" y1="600" x2="300" y2="800" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="400" y1="600" x2="400" y2="800" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="500" y1="600" x2="500" y2="800" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <line x1="600" y1="600" x2="600" y2="800" stroke="black" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Dinosaurs -->
    <g id="dinosaurs">
      <!-- Brontosaurus (left, gentle) -->
      <g id="brontosaurus" transform="translate(180, 500)">
        <!-- Body -->
        <ellipse cx="0" cy="120" rx="120" ry="70" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Neck -->
        <path d="M 60 70 Q 70 -10 120 -50 Q 160 -80 170 -60 Q 180 -40 170 0 Q 160 30 140 50 L 60 70 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Head -->
        <path d="M 160 -60 Q 140 -80 180 -90 Q 220 -80 220 -50 Q 220 -20 190 -30 Q 170 -40 160 -60 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Eye -->
        <circle cx="195" cy="-60" r="5" fill="white" stroke="black" stroke-width="3"/>
        <!-- Smile -->
        <path d="M 190 -45 Q 205 -35 210 -45" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
        <!-- Legs (simplified, partial, sitting) -->
        <rect x="-70" y="170" width="60" height="30" rx="15" ry="15" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="50" y="170" width="60" height="30" rx="15" ry="15" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Stegosaurus (middle, friendly) -->
      <g id="stegosaurus" transform="translate(400, 600)">
        <!-- Body -->
        <ellipse cx="0" cy="50" rx="100" ry="50" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Head -->
        <path d="M -80 0 Q -120 -30 -130 0 Q -140 30 -110 40 Q -90 40 -80 0 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Eye -->
        <circle cx="-120" cy="5" r="5" fill="white" stroke="black" stroke-width="3"/>
        <!-- Smile -->
        <path d="M -130 15 Q -120 25 -110 20" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
        <!-- Plates (simplified semicircles or rounded triangles) -->
        <path d="M -60 0 Q -55 -30 -45 0 Z" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M -10 0 Q -5 -30 5 0 Z" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 40 0 Q 45 -30 55 0 Z" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Legs (simplified, partial, sitting) -->
        <rect x="-70" y="80" width="50" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="80" width="50" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Triceratops (right, playful) -->
      <g id="triceratops" transform="translate(620, 580)">
        <!-- Body -->
        <ellipse cx="0" cy="80" rx="100" ry="50" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Head and Frill (simplified) -->
        <path d="M -60 30 Q -100 -20 -150 0 Q -170 30 -150 60 Q -100 80 -60 50 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Horns (simplified) -->
        <line x1="-120" y1="-5" x2="-110" y2="-20" stroke="black" stroke-width="3" stroke-linecap="round"/>
        <line x1="-140" y1="5" x2="-130" y2="-10" stroke="black" stroke-width="3" stroke-linecap="round"/>
        <!-- Nose horn -->
        <line x1="-150" y1="20" x2="-160" y2="10" stroke="black" stroke-width="3" stroke-linecap="round"/>
        <!-- Eye -->
        <circle cx="-135" cy="30" r="5" fill="white" stroke="black" stroke-width="3"/>
        <!-- Smile -->
        <path d="M -145 40 Q -130 50 -120 45" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
        <!-- Legs (simplified, partial, sitting) -->
        <rect x="-70" y="110" width="50" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="110" width="50" height="25" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Picnic Items -->
    <g id="picnic_items">
      <!-- Picnic Basket -->
      <path d="M 350 580 C 330 550 400 550 420 580 L 450 650 Q 385 680 320 650 Z" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 350 580 Q 385 570 420 580" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- lid line -->
      <path d="M 385 550 Q 380 530 390 530 Q 400 530 395 550" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- handle -->

      <!-- Apples -->
      <circle cx="280" cy="720" r="30" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 280 690 L 285 680" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- stem -->
      <ellipse cx="290" cy="695" rx="8" ry="4" transform="rotate(20 290 695)" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- leaf -->

      <circle cx="500" cy="730" r="30" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 500 700 L 505 690" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- stem -->
      <ellipse cx="510" cy="705" rx="8" ry="4" transform="rotate(20 510 705)" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <!-- leaf -->

      <!-- Sandwiches -->
      <rect x="300" y="760" width="80" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="420" y="770" width="80" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Simple Flowers in foreground -->
    <g id="flowers">
      <!-- Flower 1 -->
      <circle cx="100" cy="900" r="15" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="890" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="890" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="910" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="910" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="100" y1="915" x2="100" y2="950" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <path d="M 100 930 Q 90 925 80 930" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- leaf -->

      <!-- Flower 2 -->
      <circle cx="700" cy="920" r="15" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="680" cy="910" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="720" cy="910" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="680" cy="930" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="720" cy="930" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="700" y1="935" x2="700" y2="970" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <path d="M 700 950 Q 690 945 680 950" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- leaf -->

      <!-- Flower 3 -->
      <circle cx="300" cy="950" r="15" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="280" cy="940" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="320" cy="940" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="280" cy="960" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="320" cy="960" r="10" fill="white" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="300" y1="965" x2="300" y2="990" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <path d="M 300 980 Q 290 975 280 980" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/> <!-- leaf -->
    </g>
  </g>
</svg>