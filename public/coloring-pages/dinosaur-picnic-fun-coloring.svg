<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements: Sun, Tree, Ground line -->
  <g id="background_elements">
    <!-- Sun -->
    <circle cx="700" cy="100" r="60" fill="white" stroke="black" stroke-width="4"/>
    <!-- Ground line -->
    <path d="M0 780 Q200 750 400 780 T800 780" fill="none" stroke="black" stroke-width="4"/>
    <!-- Tree Trunk -->
    <rect x="550" y="450" width="80" height="330" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Tree Canopy -->
    <path d="M400 350 C300 180 500 100 680 250 C750 400 650 500 550 480 C450 520 350 450 400 350 Z"
          fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Picnic Blanket -->
  <g id="picnic_blanket">
    <rect x="200" y="650" width="450" height="200" rx="40" ry="40" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Picnic Basket -->
  <g id="picnic_basket">
    <rect x="520" y="580" width="100" height="80" rx="15" ry="15" fill="white" stroke="black" stroke-width="4"/>
    <path d="M520 580 L520 565 L620 565 L620 580 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Lid base -->
    <path d="M540 560 A40 20 0 0 1 600 560" fill="none" stroke="black" stroke-width="4"/> <!-- Handle -->
  </g>

  <!-- Food items on the blanket -->
  <g id="food_items">
    <!-- Sandwiches -->
    <rect x="240" y="680" width="70" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <rect x="280" y="730" width="70" height="50" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <!-- Apples -->
    <circle cx="360" cy="700" r="25" fill="white" stroke="black" stroke-width="4"/>
    <path d="M360 675 L365 670" fill="none" stroke="black" stroke-width="4"/> <!-- Apple stem -->
    <circle cx="400" cy="750" r="25" fill="white" stroke="black" stroke-width="4"/>
    <path d="M400 725 L405 720" fill="none" stroke="black" stroke-width="4"/> <!-- Apple stem -->
    <!-- Drinks (cup and bottle) -->
    <rect x="440" y="690" width="40" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Cup -->
    <line x1="460" y1="690" x2="460" y2="650" stroke="black" stroke-width="4"/> <!-- Straw -->
    <rect x="490" y="690" width="40" height="60" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Bottle body -->
    <rect x="500" y="670" width="20" height="20" rx="5" ry="5" fill="white" stroke="black" stroke-width="4"/> <!-- Bottle neck -->
  </g>

  <!-- Dinosaur 1 (Long-neck, Apatosaurus/Brontosaurus type) -->
  <g id="dinosaur_1">
    <!-- Body -->
    <ellipse cx="250" cy="750" rx="130" ry="90" fill="white" stroke="black" stroke-width="4"/>
    <!-- Neck -->
    <path d="M300 680 C330 500 360 400 340 350 L310 350 C300 400 280 500 250 680 Z"
          fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <ellipse cx="330" cy="320" rx="45" ry="35" fill="white" stroke="black" stroke-width="4"/>
    <!-- Legs -->
    <rect x="220" y="800" width="50" height="100" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <rect x="320" y="800" width="50" height="100" rx="25" ry="25" fill="white" stroke="black" stroke-width="4"/>
    <!-- Tail -->
    <path d="M120 750 C70 800 50 750 30 680 C50 630 100 680 120 750 Z"
          fill="white" stroke="black" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="320" cy="305" r="7" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth (smile) -->
    <path d="M330 335 Q340 345 350 335" fill="none" stroke="black" stroke-width="4"/>
  </g>

  <!-- Dinosaur 2 (T-Rex like, sitting) -->
  <g id="dinosaur_2">
    <!-- Body -->
    <ellipse cx="600" cy="780" rx="100" ry="80" fill="white" stroke="black" stroke-width="4"/>
    <!-- Head -->
    <ellipse cx="690" cy="720" rx="60" ry="50" fill="white" stroke="black" stroke-width="4"/>
    <!-- Neck -->
    <path d="M640 720 Q650 680 690 720" fill="none" stroke="black" stroke-width="4"/>
    <!-- Legs (sitting position) -->
    <rect x="630" y="830" width="40" height="50" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <rect x="560" y="830" width="40" height="50" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Arms -->
    <rect x="640" y="730" width="15" height="40" rx="7" ry="7" fill="white" stroke="black" stroke-width="4"/>
    <rect x="610" y="730" width="15" height="40" rx="7" ry="7" fill="white" stroke="black" stroke-width="4"/>
    <!-- Tail -->
    <path d="M500 780 C470 810 450 780 440 730 C450 680 480 730 500 780 Z"
          fill="white" stroke="black" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="680" cy="700" r="7" fill="white" stroke="black" stroke-width="4"/>
    <!-- Mouth (smile) -->
    <path d="M690 735 Q700 745 710 735" fill="none" stroke="black" stroke-width="4"/>
  </g>
</svg>