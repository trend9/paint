<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
  <!-- Castle Room Background - Simplified -->
  <g id="castle-room">
    <!-- Floor line -->
    <line x1="0" y1="800" x2="800" y2="800" stroke="black" stroke-width="5" />
    <!-- Large rounded window on the back wall -->
    <rect x="100" y="100" width="600" height="400" rx="50" ry="50" fill="white" stroke="black" stroke-width="4" />
    <!-- Window mullions -->
    <line x1="400" y1="100" x2="400" y2="500" stroke="black" stroke-width="3" />
    <line x1="100" y1="300" x2="700" y2="300" stroke="black" stroke-width="3" />
  </g>

  <!-- Tea Party Table -->
  <g id="tea-party-table">
    <!-- Table top -->
    <rect x="150" y="650" width="500" height="100" rx="30" ry="30" fill="white" stroke="black" stroke-width="5" />
    <!-- Table legs -->
    <rect x="200" y="750" width="50" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" />
    <rect x="550" y="750" width="50" height="100" rx="10" ry="10" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Happy Princess -->
  <g id="princess">
    <!-- Body/Dress -->
    <path d="M 250 620 C 200 650, 180 750, 300 780 C 420 750, 400 650, 350 620 Z" fill="white" stroke="black" stroke-width="5" />
    <!-- Neck -->
    <rect x="290" y="520" width="20" height="30" rx="5" ry="5" fill="white" stroke="black" stroke-width="4" />
    <!-- Head -->
    <circle cx="300" cy="490" r="60" fill="white" stroke="black" stroke-width="5" />
    <!-- Hair fringe -->
    <path d="M 250 470 Q 270 450, 300 440 Q 330 450, 350 470" fill="white" stroke="black" stroke-width="4" />
    <!-- Crown -->
    <path d="M 275 450 L 285 430 L 300 450 L 315 430 L 325 450 L 325 460 Q 300 470, 275 460 Z" fill="white" stroke="black" stroke-width="4" />
    <!-- Face: eyes, mouth -->
    <circle cx="285" cy="480" r="7" fill="white" stroke="black" stroke-width="3" />
    <circle cx="315" cy="480" r="7" fill="white" stroke="black" stroke-width="3" />
    <path d="M 290 500 Q 300 510, 310 500" fill="none" stroke="black" stroke-width="3" />
    <!-- Arms resting on table -->
    <path d="M 320 550 C 340 600, 360 620, 380 650" fill="white" stroke="black" stroke-width="4" />
    <path d="M 280 550 C 260 600, 240 620, 220 650" fill="white" stroke="black" stroke-width="4" />
    <!-- Hands -->
    <circle cx="380" cy="650" r="20" fill="white" stroke="black" stroke-width="4" />
    <circle cx="220" cy="650" r="20" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Friendly Teddy Bear -->
  <g id="teddy-bear">
    <!-- Body -->
    <ellipse cx="500" cy="680" rx="100" ry="100" fill="white" stroke="black" stroke-width="5" />
    <!-- Head -->
    <circle cx="500" cy="470" r="60" fill="white" stroke="black" stroke-width="5" />
    <!-- Ears -->
    <circle cx="460" cy="430" r="25" fill="white" stroke="black" stroke-width="4" />
    <circle cx="540" cy="430" r="25" fill="white" stroke="black" stroke-width="4" />
    <!-- Snout area -->
    <ellipse cx="500" cy="485" rx="30" ry="20" fill="white" stroke="black" stroke-width="4" />
    <!-- Face: eyes, nose, mouth -->
    <circle cx="485" cy="460" r="7" fill="white" stroke="black" stroke-width="3" />
    <circle cx="515" cy="460" r="7" fill="white" stroke="black" stroke-width="3" />
    <circle cx="500" cy="480" r="5" fill="white" stroke="black" stroke-width="3" />
    <path d="M 500 485 V 495 M 490 495 Q 500 505, 510 495" fill="none" stroke="black" stroke-width="3" />
    <!-- Arms -->
    <path d="M 530 530 C 550 580, 570 600, 590 630" fill="white" stroke="black" stroke-width="4" />
    <path d="M 470 530 C 450 580, 430 600, 410 630" fill="white" stroke="black" stroke-width="4" />
    <!-- Hands -->
    <circle cx="590" cy="630" r="20" fill="white" stroke="black" stroke-width="4" />
    <circle cx="410" cy="630" r="20" fill="white" stroke="black" stroke-width="4" />
  </g>

  <!-- Elegant Tea Set -->
  <g id="tea-set">
    <!-- Teapot Body -->
    <ellipse cx="400" cy="680" rx="60" ry="40" fill="white" stroke="black" stroke-width="5" />
    <!-- Teapot Lid base -->
    <path d="M 370 640 Q 400 600, 430 640" fill="white" stroke="black" stroke-width="4" />
    <!-- Teapot Lid knob -->
    <circle cx="400" cy="620" r="20" fill="white" stroke="black" stroke-width="4" />
    <!-- Teapot Handle -->
    <path d="M 460 670 C 490 650, 490 730, 460 740 C 470 750, 470 670, 460 670 Z" fill="white" stroke="black" stroke-width="4" />
    <circle cx="475" cy="700" r="15" fill="white" stroke="black" stroke-width="3" />
    <!-- Teapot Spout -->
    <path d="M 340 670 C 310 650, 310 730, 340 740 C 330 750, 330 670, 340 670 Z" fill="white" stroke="black" stroke-width="4" />
    <circle cx="325" cy="700" r="15" fill="white" stroke="black" stroke-width="3" />

    <!-- Princess's Teacup and Saucer -->
    <ellipse cx="280" cy="730" rx="50" ry="15" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="280" cy="700" rx="30" ry="20" fill="white" stroke="black" stroke-width="4" />
    <path d="M 305 690 A 15 15 0 1 1 305 710 A 15 15 0 1 1 305 690 Z" fill="white" stroke="black" stroke-width="3" />

    <!-- Bear's Teacup and Saucer -->
    <ellipse cx="520" cy="730" rx="50" ry="15" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="520" cy="700" rx="30" ry="20" fill="white" stroke="black" stroke-width="4" />
    <path d="M 495 690 A 15 15 0 1 0 495 710 A 15 15 0 1 0 495 690 Z" fill="white" stroke="black" stroke-width="3" />
  </g>

  <!-- Cupcakes -->
  <g id="cupcakes">
    <!-- Cupcake 1 (left) -->
    <path d="M 325 750 Q 320 765, 350 765 Q 380 765, 375 750" fill="white" stroke="black" stroke-width="4" />
    <path d="M 325 750 L 325 720 A 25 25 0 0 1 375 720 L 375 750 Z" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="350" cy="720" rx="25" ry="10" fill="white" stroke="black" stroke-width="4" />
    <path d="M 330 710 Q 335 690, 350 690 Q 365 690, 370 710 L 350 715 Z" fill="white" stroke="black" stroke-width="4" />
    <path d="M 340 705 C 345 700, 355 700, 360 705" fill="none" stroke="black" stroke-width="3" />

    <!-- Cupcake 2 (right) -->
    <path d="M 425 750 Q 420 765, 450 765 Q 480 765, 475 750" fill="white" stroke="black" stroke-width="4" />
    <path d="M 425 750 L 425 720 A 25 25 0 0 1 475 720 L 475 750 Z" fill="white" stroke="black" stroke-width="4" />
    <ellipse cx="450" cy="720" rx="25" ry="10" fill="white" stroke="black" stroke-width="4" />
    <path d="M 430 710 Q 435 690, 450 690 Q 465 690, 470 710 L 450 715 Z" fill="white" stroke="black" stroke-width="4" />
    <path d="M 440 705 C 445 700, 455 700, 460 705" fill="none" stroke="black" stroke-width="3" />
  </g>
</svg>