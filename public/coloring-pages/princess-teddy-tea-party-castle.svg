<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Ensure a pure white background for the coloring page -->
  <rect x="0" y="0" width="800" height="1000" fill="white" stroke="none"/>

  <!-- Castle Room Background Elements -->
  <g id="castle_room" stroke="black" stroke-width="4" fill="white">
    <!-- Floor line -->
    <path d="M 0 780 H 800" fill="none" stroke="black" stroke-width="5"/>

    <!-- Simplified Window in background -->
    <rect x="250" y="150" width="300" height="350" rx="30" ry="30" fill="white" stroke="black" stroke-width="4"/>
    <path d="M 400 150 V 500" fill="none" stroke="black" stroke-width="3"/> <!-- Vertical mullion -->
    <path d="M 250 325 H 550" fill="none" stroke="black" stroke-width="3"/> <!-- Horizontal mullion -->
  </g>

  <!-- Tea Table -->
  <g id="tea_table" stroke="black" stroke-width="5" fill="white">
    <ellipse cx="400" cy="700" rx="180" ry="60" fill="white" stroke="black"/> <!-- Table top -->
    <path d="M 220 700 Q 250 820 400 820 Q 550 820 580 700 Z" fill="white" stroke="black"/> <!-- Table base/cloth -->
  </g>

  <!-- Tea Set -->
  <g id="tea_set" stroke="black" stroke-width="4" fill="white">
    <!-- Teapot -->
    <path d="M 380 650 A 40 40 0 0 0 380 570 C 420 500 480 500 520 570 A 40 40 0 0 0 520 650 Q 450 670 380 650 Z" fill="white" stroke="black"/> <!-- Pot body -->
    <ellipse cx="450" cy="565" rx="50" ry="15" fill="white" stroke="black"/> <!-- Pot lid -->
    <path d="M 520 580 Q 550 540 570 570 Q 550 600 520 610" fill="none" stroke="black"/> <!-- Spout -->
    <path d="M 380 590 Q 360 550 340 570 Q 360 610 380 630" fill="none" stroke="black"/> <!-- Handle -->

    <!-- Princess's Teacup -->
    <ellipse cx="300" cy="650" rx="35" ry="15" fill="white" stroke="black"/> <!-- Cup top -->
    <path d="M 265 650 C 260 700 340 700 335 650 Z" fill="white" stroke="black"/> <!-- Cup body -->
    <path d="M 335 660 Q 350 650 345 680" fill="none" stroke="black" stroke-width="3"/> <!-- Cup handle -->

    <!-- Teddy Bear's Teacup -->
    <ellipse cx="500" cy="650" rx="35" ry="15" fill="white" stroke="black"/> <!-- Cup top -->
    <path d="M 465 650 C 460 700 540 700 535 650 Z" fill="white" stroke="black"/> <!-- Cup body -->
    <path d="M 535 660 Q 550 650 545 680" fill="none" stroke="black" stroke-width="3"/> <!-- Cup handle -->
  </g>

  <!-- Princess -->
  <g id="princess" stroke="black" stroke-width="4" fill="white">
    <!-- Head -->
    <circle cx="280" cy="300" r="70" fill="white" stroke="black"/>
    <!-- Hair bun/simple style -->
    <ellipse cx="320" cy="270" rx="25" ry="35" fill="white" stroke="black"/>
    <!-- Crown -->
    <path d="M 250 240 L 260 210 L 280 230 L 300 210 L 310 240 L 250 240 Z" fill="white" stroke="black"/>

    <!-- Face -->
    <circle cx="260" cy="290" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Left eye -->
    <circle cx="300" cy="290" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Right eye -->
    <path d="M 270 320 Q 280 335 290 320" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->

    <!-- Body / Dress -->
    <path d="M 280 370 Q 200 450 150 750 H 410 Q 360 450 280 370 Z" fill="white" stroke="black"/> <!-- Dress body -->
    <path d="M 280 370 C 270 420 290 420 280 370" fill="none" stroke="black"/> <!-- Neck -->

    <!-- Arms -->
    <path d="M 200 450 Q 150 550 200 620" fill="white" stroke="black"/> <!-- Left arm -->
    <circle cx="200" cy="620" r="20" fill="white" stroke="black"/> <!-- Left hand -->
    <path d="M 360 450 Q 410 550 360 620" fill="white" stroke="black"/> <!-- Right arm -->
    <circle cx="360" cy="620" r="20" fill="white" stroke="black"/> <!-- Right hand -->
  </g>

  <!-- Teddy Bear -->
  <g id="teddy_bear" stroke="black" stroke-width="4" fill="white">
    <!-- Head -->
    <circle cx="520" cy="320" r="70" fill="white" stroke="black"/>
    <!-- Ears -->
    <ellipse cx="480" cy="270" rx="25" ry="30" fill="white" stroke="black"/>
    <ellipse cx="560" cy="270" rx="25" ry="30" fill="white" stroke="black"/>
    <!-- Snout -->
    <ellipse cx="520" cy="330" rx="35" ry="25" fill="white" stroke="black"/>

    <!-- Face -->
    <circle cx="495" cy="305" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Left eye -->
    <circle cx="545" cy="305" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Right eye -->
    <circle cx="520" cy="320" r="8" fill="white" stroke="black" stroke-width="3"/> <!-- Nose -->
    <path d="M 520 328 V 345" fill="none" stroke="black" stroke-width="3"/> <!-- Nose to mouth line -->
    <path d="M 505 345 Q 520 355 535 345" fill="none" stroke="black" stroke-width="3"/> <!-- Mouth -->

    <!-- Body -->
    <path d="M 520 390 C 450 480 400 750 400 750 L 600 750 C 600 750 550 480 520 390 Z" fill="white" stroke="black"/>

    <!-- Arms -->
    <path d="M 450 450 Q 400 550 450 620" fill="white" stroke="black"/> <!-- Left arm -->
    <circle cx="450" cy="620" r="20" fill="white" stroke="black"/> <!-- Left paw -->
    <path d="M 590 450 Q 640 550 590 620" fill="white" stroke="black"/> <!-- Right arm -->
    <circle cx="590" cy="620" r="20" fill="white" stroke="black"/> <!-- Right paw -->
  </g>
</svg>