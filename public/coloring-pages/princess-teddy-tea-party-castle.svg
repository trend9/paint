<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Explicit white background for the entire coloring page -->
  <rect x="0" y="0" width="800" height="1000" fill="white"/>

  <!-- Castle Room Background -->
  <g id="castle-room" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Decorative Wall Frieze -->
    <!-- These paths create a series of dome-like shapes along the top border -->
    <path d="M 0 50 L 0 0 Q 50 20, 100 0 L 100 50 Z" fill="white"/>
    <path d="M 100 50 L 100 0 Q 150 20, 200 0 L 200 50 Z" fill="white"/>
    <path d="M 200 50 L 200 0 Q 250 20, 300 0 L 300 50 Z" fill="white"/>
    <path d="M 300 50 L 300 0 Q 350 20, 400 0 L 400 50 Z" fill="white"/>
    <path d="M 400 50 L 400 0 Q 450 20, 500 0 L 500 50 Z" fill="white"/>
    <path d="M 500 50 L 500 0 Q 550 20, 600 0 L 600 50 Z" fill="white"/>
    <path d="M 600 50 L 600 0 Q 650 20, 700 0 L 700 50 Z" fill="white"/>
    <path d="M 700 50 L 700 0 Q 750 20, 800 0 L 800 50 Z" fill="white"/>
    
    <!-- Large Window -->
    <rect x="150" y="100" width="500" height="300" rx="20" ry="20" fill="white"/>
    <!-- Window pane dividers -->
    <line x1="400" y1="100" x2="400" y2="400" stroke="black" stroke-width="4"/>
    <line x1="150" y1="250" x2="650" y2="250" stroke="black" stroke-width="4"/>
    
    <!-- Simple Distant View (hills and clouds) -->
    <g id="distant-view" fill="white" stroke="black" stroke-width="4">
      <path d="M 150 400 L 250 350 C 300 320, 350 320, 400 350 L 500 300 C 550 280, 600 280, 650 300 V 400 Z" fill="white"/> <!-- Hills -->
      <circle cx="200" cy="180" r="40" fill="white"/>
      <circle cx="250" cy="160" r="50" fill="white"/>
      <circle cx="300" cy="180" r="40" fill="white"/>
      <circle cx="500" cy="200" r="45" fill="white"/>
      <circle cx="550" cy="180" r="55" fill="white"/>
      <circle cx="600" cy="200" r="45" fill="white"/>
    </g>
  </g>

  <!-- Tea Table -->
  <g id="tea-table" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="700" rx="250" ry="80" fill="white"/> <!-- Table top -->
    <!-- Table leg (simple, central, sturdy) -->
    <rect x="380" y="700" width="40" height="150" rx="10" ry="10" fill="white"/>
    <path d="M 360 850 L 320 880 L 480 880 L 440 850 Z" fill="white"/> <!-- Table base, simplified -->
  </g>

  <!-- Princess -->
  <g id="princess" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="300" cy="490" r="60" fill="white"/>
    <!-- Hair -->
    <path d="M 240 490 C 220 440, 260 420, 300 430 S 380 420, 360 490 L 300 490 Z" fill="white"/> <!-- Hair on top -->
    <path d="M 360 490 C 390 540, 390 590, 300 590 C 210 590, 210 540, 240 490 Z" fill="white"/> <!-- Hair sides, like a bun -->
    
    <!-- Face -->
    <circle cx="285" cy="480" r="7" fill="white"/> <!-- Left eye -->
    <circle cx="315" cy="480" r="7" fill="white"/> <!-- Right eye -->
    <path d="M 290 510 Q 300 520, 310 510" fill="none"/> <!-- Mouth (smile) -->

    <!-- Neck -->
    <path d="M 290 550 Q 300 560, 310 550" fill="white"/>
    
    <!-- Flowing Dress -->
    <path d="M 300 550 C 200 580, 150 680, 150 850 C 150 950, 250 950, 400 950 C 550 950, 650 950, 650 850 C 650 680, 600 580, 500 550 Z" fill="white"/>
    
    <!-- Arms -->
    <path d="M 260 600 Q 220 580, 180 620" fill="white"/> <!-- Left arm -->
    <path d="M 340 600 Q 380 580, 420 620" fill="white"/> <!-- Right arm -->

    <!-- Hands -->
    <circle cx="180" cy="620" r="15" fill="white"/> <!-- Left hand -->
    <circle cx="420" cy="620" r="15" fill="white"/> <!-- Right hand -->

    <!-- Teacup in Princess's hand -->
    <path d="M 160 605 L 200 605 L 200 585 C 200 575, 190 575, 190 585 L 160 585 Z" fill="white"/> <!-- Cup body -->
    <path d="M 200 595 A 10 10 0 1 0 210 595" fill="none"/> <!-- Handle -->
  </g>

  <!-- Teddy Bear -->
  <g id="teddy-bear" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="580" cy="680" rx="80" ry="100" fill="white"/>
    <!-- Head -->
    <circle cx="580" cy="560" r="60" fill="white"/>
    <!-- Ears -->
    <circle cx="530" cy="520" r="25" fill="white"/>
    <circle cx="630" cy="520" r="25" fill="white"/>
    <!-- Snout -->
    <ellipse cx="580" cy="580" rx="30" ry="20" fill="white"/>
    <!-- Eyes -->
    <circle cx="560" cy="550" r="8" fill="white"/>
    <circle cx="600" cy="550" r="8" fill="white"/>
    <!-- Nose (part of snout) -->
    <circle cx="580" cy="570" r="5" fill="white"/>
    <!-- Mouth -->
    <path d="M 570 590 Q 580 600, 590 590" fill="none"/>

    <!-- Small Hat -->
    <path d="M 560 500 C 560 480, 600 480, 600 500 L 590 510 L 570 510 Z" fill="white"/> <!-- Hat base -->
    <ellipse cx="580" cy="500" rx="25" ry="10" fill="white"/>
    <path d="M 580 490 L 570 470 C 560 460, 600 460, 590 470 Z" fill="white"/> <!-- Hat top part, simplified cone -->

    <!-- Arms -->
    <path d="M 520 650 Q 500 630, 480 670" fill="white"/> <!-- Left arm -->
    <path d="M 640 650 Q 660 630, 680 670" fill="white"/> <!-- Right arm -->
    <!-- Paws -->
    <circle cx="480" cy="670" r="15" fill="white"/>
    <circle cx="680" cy="670" r="15" fill="white"/>
  </g>

  <!-- Table Items (Teapot, Teacups, Cakes) -->
  <g id="table-items" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Teapot -->
    <ellipse cx="400" cy="670" rx="40" ry="30" fill="white"/> <!-- Top part of body -->
    <path d="M 360 670 C 350 710, 450 710, 440 670 Z" fill="white"/> <!-- Bottom part of body, joining the ellipse -->
    <path d="M 440 680 C 460 680, 460 660, 440 660" fill="none"/> <!-- Handle -->
    <path d="M 360 670 C 340 660, 340 680, 360 680" fill="none"/> <!-- Spout -->
    <line x1="400" y1="640" x2="400" y2="670" stroke="black" stroke-width="4"/> <!-- Lid knob/handle -->
    <circle cx="400" cy="640" r="10" fill="white"/> <!-- Lid -->

    <!-- Small Teacup (right of teapot) -->
    <path d="M 480 680 L 520 680 L 520 660 C 520 650, 510 650, 510 660 L 480 660 Z" fill="white"/>
    <path d="M 520 670 A 10 10 0 1 0 530 670" fill="none"/> <!-- Handle -->

    <!-- Another Teacup (left of teapot) -->
    <path d="M 300 680 L 340 680 L 340 660 C 340 650, 330 650, 330 660 L 300 660 Z" fill="white"/>
    <path d="M 340 670 A 10 10 0 1 0 350 670" fill="none"/> <!-- Handle -->

    <!-- Small Cakes -->
    <circle cx="340" cy="720" r="20" fill="white"/>
    <circle cx="460" cy="720" r="20" fill="white"/>
    <!-- Simple cake icing (circular, not too complex) -->
    <path d="M 340 705 Q 330 715, 340 725 Q 350 715, 340 705" fill="none"/>
    <path d="M 460 705 Q 450 715, 460 725 Q 470 715, 460 705" fill="none"/>
  </g>
</svg>