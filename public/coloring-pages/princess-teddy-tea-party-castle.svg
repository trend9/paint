<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Castle Background -->
  <g id="castle" stroke="black" stroke-width="4" fill="white">
    <rect x="100" y="550" width="600" height="250" rx="30" ry="30"/>
    <rect x="150" y="400" width="150" height="200" rx="20" ry="20"/>
    <rect x="500" y="400" width="150" height="200" rx="20" ry="20"/>
    <path d="M150 400 L225 350 L300 400 L300 400 L150 400 Z"/>
    <path d="M500 400 L575 350 L650 400 L650 400 L500 400 Z"/>
    <path d="M100 550 H150 V500 H200 V550 H250 V500 H300 V550 H350 V500 H400 V550 H450 V500 H500 V550 H550 V500 H600 V550 H650 V500 H700 V550 Z" fill="none"/>
  </g>

  <!-- Ground -->
  <g id="ground">
    <path d="M0 780 C200 850 600 850 800 780 V1000 H0 Z" stroke="black" stroke-width="4" fill="white"/>
  </g>

  <!-- Tea Table -->
  <g id="tea-table" stroke="black" stroke-width="4" fill="white">
    <ellipse cx="400" cy="740" rx="200" ry="60"/>
    <rect x="370" y="740" width="60" height="150" rx="10" ry="10"/>
  </g>

  <!-- Princess -->
  <g id="princess" stroke="black" stroke-width="4" fill="white">
    <!-- Head -->
    <circle cx="280" cy="560" r="70"/>
    <!-- Hair -->
    <path d="M280 490 C220 450 180 520 200 580 C180 620 220 680 280 660 L280 490 Z"/>
    <path d="M280 490 C340 450 380 520 360 580 C380 620 340 680 280 660 L280 490 Z"/>
    <!-- Eyes -->
    <circle cx="250" cy="545" r="8"/>
    <circle cx="310" cy="545" r="8"/>
    <!-- Smile -->
    <path d="M250 580 Q280 600 310 580" fill="none"/>
    <!-- Crown -->
    <path d="M230 490 L245 470 L280 480 L315 470 L330 490" fill="white"/>
    <!-- Body/Gown -->
    <path d="M280 630 C200 680 150 800 150 850 H410 C410 800 360 680 280 630 Z"/>
    <!-- Arm -->
    <path d="M230 650 Q200 680 210 740 Q250 760 270 700 Z"/>
    <!-- Hand -->
    <circle cx="240" cy="740" r="20"/>
  </g>

  <!-- Teddy Bear -->
  <g id="teddy-bear" stroke="black" stroke-width="4" fill="white">
    <!-- Body -->
    <ellipse cx="580" cy="750" rx="80" ry="100"/>
    <!-- Head -->
    <circle cx="580" cy="630" r="70"/>
    <!-- Ears -->
    <ellipse cx="530" cy="590" rx="25" ry="30"/>
    <ellipse cx="630" cy="590" rx="25" ry="30"/>
    <!-- Snout -->
    <ellipse cx="580" cy="650" rx="30" ry="20"/>
    <circle cx="580" cy="640" r="5"/>
    <!-- Eyes -->
    <circle cx="550" cy="615" r="8"/>
    <circle cx="610" cy="615" r="8"/>
    <!-- Smile -->
    <path d="M555 660 Q580 675 605 660" fill="none"/>
    <!-- Arm -->
    <path d="M520 680 Q500 720 520 780 Q550 800 580 750 Z"/>
    <!-- Bow Tie -->
    <path d="M580 720 C560 710 550 700 560 690 C570 680 580 690 580 700 C580 690 590 680 600 690 C610 700 600 710 580 720 Z" fill="white"/>
    <circle cx="580" cy="700" r="10"/>
  </g>

  <!-- Tea Set -->
  <g id="tea-set" stroke="black" stroke-width="4" fill="white">
    <!-- Princess's cup -->
    <path d="M220 720 Q240 700 260 720 L260 750 Q240 770 220 750 Z"/>
    <ellipse cx="240" cy="720" rx="25" ry="10"/>
    <path d="M265 730 Q280 720 280 740 Q280 760 265 750" fill="none"/>

    <!-- Teddy's cup -->
    <path d="M540 730 Q560 710 580 730 L580 760 Q560 780 540 760 Z"/>
    <ellipse cx="560" cy="730" rx="25" ry="10"/>
    <path d="M585 740 Q600 730 600 750 Q600 770 585 760" fill="none"/>

    <!-- Teapot -->
    <path d="M380 670 C350 670 340 700 340 720 C340 740 350 770 380 770 L420 770 C450 770 460 740 460 720 C460 700 450 670 420 670 Z"/>
    <ellipse cx="400" cy="670" rx="40" ry="15"/>
    <path d="M460 700 Q480 690 490 700 Q480 710 460 710 Z" fill="none"/>
    <path d="M340 700 Q320 690 320 720 Q320 750 340 740" fill="none"/>

    <!-- Pastries -->
    <circle cx="340" cy="730" r="20"/>
    <circle cx="460" cy="730" r="20"/>
  </g>

</svg>