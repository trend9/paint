<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="castle_background">
    <!-- Main Wall -->
    <rect x="100" y="250" width="600" height="700" rx="30" ry="30" fill="white" stroke="black" stroke-width="5"/>
    <!-- Left Tower Top -->
    <rect x="150" y="100" width="100" height="150" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <path d="M 150 250 V 200 H 165 V 220 H 180 V 200 H 195 V 220 H 210 V 200 H 225 V 220 H 240 V 200 H 250 V 250 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Right Tower Top -->
    <rect x="550" y="100" width="100" height="150" rx="20" ry="20" fill="white" stroke="black" stroke-width="5"/>
    <path d="M 550 250 V 200 H 565 V 220 H 580 V 200 H 595 V 220 H 610 V 200 H 625 V 220 H 640 V 200 H 650 V 250 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Archway / Opening -->
    <path d="M 300 950 V 450 C 300 380, 500 380, 500 450 V 950 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M 300 450 C 300 400, 500 400, 500 450" fill="none" stroke="black" stroke-width="5"/>
  </g>

  <g id="tea_party_scene">
    <g id="table">
      <ellipse cx="400" cy="600" rx="250" ry="80" fill="white" stroke="black" stroke-width="5"/> <!-- Tabletop -->
      <path d="M 150 600 C 130 750, 670 750, 650 600 V 600" fill="white" stroke="black" stroke-width="5"/> <!-- Tablecloth visible side -->
      <path d="M 200 600 Q 250 700, 400 700 Q 550 700, 600 600" fill="none" stroke="black" stroke-width="4"/> <!-- Tablecloth fold line -->
      <rect x="380" y="700" width="40" height="150" rx="10" ry="10" fill="white" stroke="black" stroke-width="5"/> <!-- Table leg -->
      <ellipse cx="400" cy="850" rx="30" ry="15" fill="white" stroke="black" stroke-width="4"/> <!-- Table foot -->
    </g>

    <g id="tea_items">
      <!-- Teapot -->
      <ellipse cx="400" cy="550" rx="60" ry="40" fill="white" stroke="black" stroke-width="5"/> <!-- Body base -->
      <path d="M 340 550 C 300 500, 300 450, 340 400 H 460 C 500 450, 500 500, 460 550 Z" fill="white" stroke="black" stroke-width="5"/> <!-- Body top -->
      <path d="M 460 470 C 490 450, 500 430, 520 450 C 520 470, 510 490, 480 500" fill="none" stroke="black" stroke-width="4"/> <!-- Handle -->
      <path d="M 340 470 C 310 450, 300 430, 280 450 C 280 470, 290 490, 320 500" fill="none" stroke="black" stroke-width="4"/> <!-- Spout -->
      <ellipse cx="400" cy="400" rx="30" ry="15" fill="white" stroke="black" stroke-width="4"/> <!-- Lid knob -->
      <path d="M 370 400 Q 400 370, 430 400" fill="none" stroke="black" stroke-width="4"/> <!-- Lid line -->

      <!-- Teacup 1 -->
      <ellipse cx="250" cy="580" rx="40" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Top rim -->
      <path d="M 210 580 V 520 C 210 500, 290 500, 290 520 V 580 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <path d="M 290 540 C 310 540, 310 560, 290 560" fill="none" stroke="black" stroke-width="3"/> <!-- Handle -->
      <ellipse cx="250" cy="590" rx="30" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Saucer -->

      <!-- Teacup 2 -->
      <ellipse cx="550" cy="580" rx="40" ry="20" fill="white" stroke="black" stroke-width="4"/> <!-- Top rim -->
      <path d="M 510 580 V 520 C 510 500, 590 500, 590 520 V 580 Z" fill="white" stroke="black" stroke-width="4"/> <!-- Body -->
      <path d="M 590 540 C 610 540, 610 560, 590 560" fill="none" stroke="black" stroke-width="3"/> <!-- Handle -->
      <ellipse cx="550" cy="590" rx="30" ry="10" fill="white" stroke="black" stroke-width="4"/> <!-- Saucer -->

      <!-- Pastries (cupcakes/cookies) -->
      <g id="pastries">
          <circle cx="320" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Cookie 1 -->
          <circle cx="480" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Cookie 2 -->
          <path d="M 360 570 C 370 550, 390 550, 400 570 L 360 570" fill="white" stroke="black" stroke-width="4"/> <!-- small cake/cupcake base -->
          <path d="M 360 570 C 365 540, 395 540, 400 570" fill="white" stroke="black" stroke-width="4"/> <!-- icing outline -->
          <circle cx="380" cy="545" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- cherry -->
      </g>
    </g>

    <g id="princess">
      <!-- Dress/Body -->
      <path d="M 250 700 C 150 680, 100 530, 150 430 L 350 430 C 400 530, 350 680, 250 700 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M 250 700 Q 200 760, 150 730" fill="none" stroke="black" stroke-width="4"/> <!-- Dress fold 1 -->
      <path d="M 250 700 Q 300 760, 350 730" fill="none" stroke="black" stroke-width="4"/> <!-- Dress fold 2 -->

      <!-- Head -->
      <circle cx="250" cy="360" r="60" fill="white" stroke="black" stroke-width="5"/>
      <!-- Hair (bangs and side hair) -->
      <path d="M 190 360 Q 210 300, 250 300 Q 290 300, 310 360" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="300" cy="350" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Hair bun -->

      <!-- Crown -->
      <path d="M 220 300 L 230 270 L 250 250 L 270 270 L 280 300 Z" fill="white" stroke="black" stroke-width="4"/>
      <ellipse cx="250" cy="300" rx="30" ry="8" fill="white" stroke="black" stroke-width="4"/>

      <!-- Face features -->
      <circle cx="230" cy="365" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="270" cy="365" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->
      <path d="M 235 385 Q 250 400, 265 385" fill="none" stroke="black" stroke-width="3"/> <!-- Smile -->
      <path d="M 225 345 Q 230 335, 235 345" fill="none" stroke="black" stroke-width="3"/> <!-- Eyebrow L -->
      <path d="M 265 345 Q 270 335, 275 345" fill="none" stroke="black" stroke-width="3"/> <!-- Eyebrow R -->

      <!-- Arms -->
      <path d="M 190 430 C 170 480, 170 540, 200 580" fill="white" stroke="black" stroke-width="5"/> <!-- Left arm -->
      <circle cx="200" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Left hand -->

      <path d="M 310 430 C 330 480, 330 540, 300 580" fill="white" stroke="black" stroke-width="5"/> <!-- Right arm -->
      <circle cx="300" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Right hand -->
    </g>

    <g id="teddy_bear">
      <!-- Body -->
      <path d="M 550 700 C 450 680, 400 530, 450 430 L 650 430 C 700 530, 650 680, 550 700 Z" fill="white" stroke="black" stroke-width="5"/>
      <path d="M 550 700 Q 500 760, 450 730" fill="none" stroke="black" stroke-width="4"/> <!-- Body fold 1 -->
      <path d="M 550 700 Q 600 760, 650 730" fill="none" stroke="black" stroke-width="4"/> <!-- Body fold 2 -->

      <!-- Head -->
      <circle cx="550" cy="360" r="60" fill="white" stroke="black" stroke-width="5"/>
      <!-- Snout -->
      <ellipse cx="550" cy="380" rx="30" ry="20" fill="white" stroke="black" stroke-width="4"/>
      <!-- Nose -->
      <ellipse cx="550" cy="370" rx="10" ry="8" fill="white" stroke="black" stroke-width="3"/>
      <!-- Mouth -->
      <path d="M 550 380 V 395 C 540 405, 560 405, 550 395" fill="none" stroke="black" stroke-width="3"/>

      <!-- Ears -->
      <circle cx="510" cy="320" r="25" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="590" cy="320" r="25" fill="white" stroke="black" stroke-width="4"/>
      <circle cx="510" cy="320" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Inner ear L -->
      <circle cx="590" cy="320" r="15" fill="white" stroke="black" stroke-width="3"/> <!-- Inner ear R -->

      <!-- Eyes -->
      <circle cx="530" cy="350" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Left Eye -->
      <circle cx="570" cy="350" r="5" fill="white" stroke="black" stroke-width="3"/> <!-- Right Eye -->

      <!-- Arms -->
      <path d="M 490 430 C 470 480, 470 540, 500 580" fill="white" stroke="black" stroke-width="5"/> <!-- Left arm -->
      <circle cx="500" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Left paw -->

      <path d="M 610 430 C 630 480, 630 540, 600 580" fill="white" stroke="black" stroke-width="5"/> <!-- Right arm -->
      <circle cx="600" cy="580" r="20" fill="white" stroke="black" stroke-width="4"/> <!-- Right paw -->
    </g>
  </g>
</svg>