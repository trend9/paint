<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="whale" stroke="black" stroke-width="4" fill="white">
    <!-- Main Whale Body -->
    <path d="M 150 450 C 150 280, 300 180, 600 250 C 680 350, 680 550, 600 650 C 300 720, 150 620, 150 450 Z" />

    <!-- Whale Tail Fluke - Top -->
    <path d="M 150 450 C 150 420, 100 400, 80 400 C 60 420, 100 440, 150 450 Z" />
    <!-- Whale Tail Fluke - Bottom -->
    <path d="M 150 450 C 150 480, 100 500, 80 500 C 60 480, 100 460, 150 450 Z" />

    <!-- Dorsal Fin -->
    <path d="M 350 350 C 360 300, 440 300, 450 350 L 350 350 Z" />

    <!-- Pectoral Fin (for holding balloons) -->
    <path d="M 450 600 C 470 550, 580 550, 600 600 C 580 650, 470 650, 450 600 Z" />

    <!-- Whale Eye -->
    <circle cx="600" cy="380" r="20" />

    <!-- Whale Smile -->
    <path d="M 570 430 Q 600 470, 630 430" fill="none" />

    <!-- Water Spout -->
    <ellipse cx="560" cy="220" rx="20" ry="30" />
    <ellipse cx="590" cy="220" rx="20" ry="30" />
    <ellipse cx="575" cy="190" rx="25" ry="20" />
  </g>

  <g id="balloons" stroke="black" stroke-width="4" fill="white">
    <!-- Balloon 1 (large oval) -->
    <ellipse cx="580" cy="780" rx="60" ry="80" />
    <!-- Balloon 2 (medium circle) -->
    <circle cx="500" cy="830" r="50" />
    <!-- Balloon 3 (small oval) -->
    <ellipse cx="650" cy="860" rx="40" ry="60" />
    <!-- Balloon 4 (another medium circle) -->
    <circle cx="560" cy="930" r="45" />

    <!-- Balloon strings connected to the pectoral fin at approx. (550, 600) -->
    <!-- String to Balloon 1 (top at 580, 700) -->
    <path d="M 550 600 C 560 650, 570 680, 580 700" fill="none" />
    <!-- String to Balloon 2 (top at 500, 780) -->
    <path d="M 550 600 C 530 680, 510 750, 500 780" fill="none" />
    <!-- String to Balloon 3 (top at 650, 800) -->
    <path d="M 550 600 C 600 680, 630 750, 650 800" fill="none" />
    <!-- String to Balloon 4 (top at 560, 885) -->
    <path d="M 550 600 C 555 750, 558 820, 560 885" fill="none" />
  </g>
</svg>