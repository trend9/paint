<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the cute happy flying whale -->
  <g id="flying-whale" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Whale Body -->
    <path d="M150 500 Q200 300 400 300 C650 300 750 450 700 600 C650 750 300 700 150 500 Z" stroke-width="5"/>
    <!-- Whale Tail Fin 1 -->
    <path d="M150 500 Q100 550 150 600 Q180 570 150 500 Z" stroke-width="5"/>
    <!-- Whale Tail Fin 2 -->
    <path d="M150 500 Q100 450 150 400 Q180 430 150 500 Z" stroke-width="5"/>
    <!-- Whale Side Fin -->
    <path d="M350 550 Q300 600 350 650 Q400 600 350 550 Z" />
    <!-- Whale Eye -->
    <circle cx="550" cy="400" r="30" />
    <!-- Whale Smile -->
    <path d="M500 470 Q550 520 600 470" fill="none" />
    <!-- Water Spout (cloud shape for coloring) -->
    <path d="M400 300 C430 270 440 220 400 200 C360 220 370 270 400 300 Z" />
  </g>

  <!-- Group for the mysterious balloons -->
  <g id="balloons" stroke="black" stroke-width="3" fill="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star Balloon 1 (Top Left) -->
    <path d="M100 150 L120 200 L170 200 L130 230 L150 280 L100 250 L50 280 L70 230 L30 200 L80 200 Z" />
    <!-- Heart Balloon 1 (Top Right) -->
    <path d="M600 150 C650 100 750 100 750 200 C750 280 670 350 600 400 C530 350 450 280 450 200 C450 100 550 100 600 150 Z" />
    <!-- Flower Balloon 1 (Bottom Left) -->
    <g transform="translate(100 800)">
        <circle cx="0" cy="0" r="40" /> <!-- Center -->
        <ellipse cx="0" cy="-60" rx="30" ry="40" />
        <ellipse cx="0" cy="60" rx="30" ry="40" />
        <ellipse cx="60" cy="0" rx="30" ry="40" transform="rotate(90)" />
        <ellipse cx="-60" cy="0" rx="30" ry="40" transform="rotate(90)" />
        <ellipse cx="40" cy="-40" rx="30" ry="40" transform="rotate(45)" />
        <ellipse cx="-40" cy="40" rx="30" ry="40" transform="rotate(45)" />
        <ellipse cx="40" cy="40" rx="30" ry="40" transform="rotate(-45)" />
        <ellipse cx="-40" cy="-40" rx="30" ry="40" transform="rotate(-45)" />
    </g>
    <!-- Bubble Balloon 1 (Mid-Left) -->
    <circle cx="250" cy="700" r="60" />
    <!-- Star Balloon 2 (Mid-Right, smaller) -->
    <path d="M700 650 L715 680 L745 680 L720 700 L730 730 L700 710 L670 730 L680 700 L655 680 L685 680 Z" />
    <!-- Heart Balloon 2 (Above whale, smaller) -->
    <path d="M180 350 C200 330 230 330 230 360 C230 380 210 400 180 410 C150 400 130 380 130 360 C130 330 160 330 180 350 Z" />
    <!-- Bubble Balloon 2 (Bottom Right) -->
    <circle cx="650" cy="800" r="40" />
    <!-- Flower Balloon 2 (Top Right, smaller) -->
    <g transform="translate(700 50)">
        <circle cx="0" cy="0" r="20" /> <!-- Center -->
        <ellipse cx="0" cy="-30" rx="15" ry="20" />
        <ellipse cx="0" cy="30" rx="15" ry="20" />
        <ellipse cx="30" cy="0" rx="15" ry="20" transform="rotate(90)" />
        <ellipse cx="-30" cy="0" rx="15" ry="20" transform="rotate(90)" />
    </g>
    <!-- Simple Bubble 3 (Far Left) -->
    <circle cx="50" cy="450" r="30" />
    <!-- Simple Bubble 4 (Far Right) -->
    <circle cx="750" cy="900" r="50" />
    <!-- Simple Star 3 (Glittering type, Top-Mid) -->
    <path d="M300 100 L310 120 L330 120 L315 130 L325 150 L300 140 L275 150 L285 130 L270 120 L290 120 Z" />
    <!-- Simple Diamond (Glittering type, Mid-Bottom) -->
    <path d="M400 750 L450 800 L400 850 L350 800 Z" />
    <!-- Simple Diamond (Glittering type, Mid-Top) -->
    <path d="M500 250 L525 275 L500 300 L475 275 Z" />
  </g>
</svg>