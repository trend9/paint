<svg viewBox="0 0 800 1000">
  <g id="sky_elements" stroke="black" stroke-width="5" fill="white">
    <!-- Clouds -->
    <g id="clouds">
      <path d="M 100 200 Q 120 160 150 170 Q 180 150 210 180 Q 240 190 260 180 Q 290 190 310 220 Q 290 250 260 240 Q 230 260 210 230 Q 180 250 150 230 Q 120 240 100 200 Z"/>
      <path d="M 500 150 Q 520 110 550 120 Q 580 100 610 130 Q 640 140 660 130 Q 690 140 710 170 Q 690 200 660 190 Q 630 210 610 180 Q 580 200 550 180 Q 520 190 500 150 Z"/>
      <path d="M 150 800 Q 170 760 200 770 Q 230 750 260 780 Q 290 790 310 780 Q 340 790 360 820 Q 340 850 310 840 Q 280 860 260 830 Q 230 850 200 830 Q 170 840 150 800 Z"/>
      <path d="M 600 700 Q 620 660 650 670 Q 680 650 710 680 Q 740 690 760 680 Q 790 690 810 720 Q 790 750 760 740 Q 730 760 710 730 Q 680 750 650 730 Q 620 740 600 700 Z"/>
    </g>
    <!-- Stars -->
    <g id="stars">
      <circle cx="150" cy="80" r="18"/>
      <circle cx="700" cy="100" r="15"/>
      <circle cx="250" cy="50" r="20"/>
      <circle cx="600" cy="30" r="15"/>
      <circle cx="50" cy="350" r="18"/>
      <circle cx="750" cy="450" r="15"/>
      <circle cx="100" cy="650" r="20"/>
      <circle cx="700" cy="750" r="15"/>
      <circle cx="350" cy="900" r="18"/>
      <circle cx="650" cy="950" r="20"/>
    </g>
  </g>

  <g id="whale_and_balloons" stroke="black" fill="white">
    <!-- Whale -->
    <g id="whale" stroke-width="5">
      <!-- Body -->
      <path d="M 200 550 C 100 450 150 350 400 350 C 650 350 700 450 600 550 C 700 700 400 750 200 550 Z"/>
      <!-- Tail fin - left fluke -->
      <path d="M 400 750 Q 300 800 200 770 Q 150 730 200 690 Q 300 720 400 750 Z"/>
      <!-- Tail fin - right fluke -->
      <path d="M 400 750 Q 500 800 600 770 Q 650 730 600 690 Q 500 720 400 750 Z"/>
      <!-- Left Flipper -->
      <path d="M 280 580 C 250 560 240 590 260 610 C 280 620 310 600 280 580 Z"/>
      <!-- Right Flipper -->
      <path d="M 520 580 C 550 560 560 590 540 610 C 520 620 490 600 520 580 Z"/>
      <!-- Eye -->
      <circle cx="480" cy="450" r="15"/>
      <!-- Smile -->
      <path d="M 450 480 Q 480 500 510 480" fill="none"/>
      <!-- Blowhole water -->
      <path d="M 400 350 Q 420 300 440 350" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Balloons -->
    <g id="balloons">
      <ellipse cx="300" cy="200" rx="60" ry="80" stroke-width="5"/>
      <ellipse cx="500" cy="200" rx="60" ry="80" stroke-width="5"/>
      <ellipse cx="400" cy="120" rx="60" ry="80" stroke-width="5"/>
      <!-- Strings -->
      <line x1="300" y1="280" x2="380" y2="400" stroke-width="3"/>
      <line x1="500" y1="280" x2="420" y2="400" stroke-width="3"/>
      <line x1="400" y1="200" x2="400" y2="400" stroke-width="3"/>
    </g>
  </g>
</svg>