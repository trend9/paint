<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Group for the majestic flying whale -->
  <g id="whale" fill="white" stroke="black" stroke-width="5">
    <!-- Whale Body -->
    <path d="M150 450 C 50 300, 50 150, 250 100 C 650 50, 750 200, 650 400 C 550 550, 250 550, 150 450 Z" />

    <!-- Left Fin (holding balloons) -->
    <path d="M190 400 Q 120 450, 150 520 Q 250 480, 230 430 Q 190 400, 190 400 Z" />
    <!-- Right Fin (holding balloons) -->
    <path d="M600 370 Q 670 420, 650 490 Q 550 450, 570 400 Q 600 370, 600 370 Z" />

    <!-- Tail Fin -->
    <path d="M660 380 Q 700 320, 720 300 L 720 460 Q 700 520, 660 480 Q 640 440, 660 380 Z" />

    <!-- Eye -->
    <circle cx="280" cy="220" r="25" />
    <!-- Happy Smile -->
    <path d="M300 270 Q 350 310, 400 270" fill="none" />
  </g>

  <!-- Group for balloons and their tethers -->
  <g id="balloons" stroke="black" stroke-width="3">
    <!-- Balloon 1: Star (held by left fin) -->
    <g transform="translate(140, 580)">
      <path d="M0 -30 L 9 -10 L 30 -10 L 15 5 L 20 25 L 0 15 L -20 25 L -15 5 L -30 -10 L -9 -10 L 0 -30 Z" fill="white" />
      <line x1="0" y1="25" x2="60" y2="-170" stroke-width="3" />
    </g>

    <!-- Balloon 2: Heart (held by left fin) -->
    <g transform="translate(250, 600)">
      <path d="M0,30 C50,-20 30,-50 0,-25 C-30,-50 -50,-20 0,30 Z" fill="white" />
      <line x1="0" y1="30" x2="-20" y2="-200" stroke-width="3" />
    </g>

    <!-- Balloon 3: Cloud (held by left fin) -->
    <g transform="translate(360, 620)">
      <path d="M-40,0 A20,20 0 0 1 -20,-20 A30,30 0 0 1 20,-20 A20,20 0 0 1 40,0 A20,20 0 0 1 20,20 A30,30 0 0 1 -20,20 A20,20 0 0 1 -40,0 Z" fill="white" />
      <line x1="0" y1="25" x2="10" y2="-240" stroke-width="3" />
    </g>

    <!-- Balloon 4: Traditional Circle (held by right fin) -->
    <g transform="translate(500, 650)">
      <circle cx="0" cy="0" r="40" fill="white" />
      <line x1="0" y1="40" x2="100" y2="-200" stroke-width="3" />
    </g>

    <!-- Balloon 5: Another Circle (held by right fin) -->
    <g transform="translate(600, 680)">
      <circle cx="0" cy="0" r="35" fill="white" />
      <line x1="0" y1="35" x2="-30" y2="-260" stroke-width="3" />
    </g>

    <!-- Balloon 6: A different kind of star (held by right fin) -->
    <g transform="translate(700, 630)">
      <path d="M0 -35 L 10 -15 L 35 -15 L 15 0 L 25 25 L 0 10 L -25 25 L -15 0 L -35 -15 L -10 -15 L 0 -35 Z" fill="white" />
      <line x1="0" y1="25" x2="-100" y2="-190" stroke-width="3" />
    </g>
  </g>
</svg>