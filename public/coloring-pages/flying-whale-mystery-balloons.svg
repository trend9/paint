<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      .main-outline {
        stroke: black;
        stroke-width: 5;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail-outline {
        stroke: black;
        stroke-width: 3;
        fill: white;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .string-line {
        stroke: black;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Group for Clouds - scattered gently -->
  <g id="clouds">
    <!-- Cloud 1 -->
    <path class="main-outline" d="M100 150 C130 100, 200 100, 230 150 C260 200, 200 220, 170 200 C140 180, 70 200, 100 150 Z" />
    <!-- Cloud 2 -->
    <path class="main-outline" d="M600 100 C630 50, 700 50, 730 100 C760 150, 700 170, 670 150 C640 130, 570 150, 600 100 Z" />
    <!-- Cloud 3 -->
    <path class="main-outline" d="M50 780 C80 730, 150 730, 180 780 C210 830, 150 850, 120 830 C90 810, 20 830, 50 780 Z" />
    <!-- Cloud 4 -->
    <path class="main-outline" d="M680 820 C710 770, 780 770, 810 820 C840 870, 780 890, 750 870 C720 850, 650 870, 680 820 Z" />
  </g>

  <!-- Group for the central whale and balloons -->
  <g id="whale-and-balloons">
    <!-- Whale Body -->
    <ellipse class="main-outline" cx="400" cy="620" rx="180" ry="100" />
    
    <!-- Whale Tail Fin -->
    <path class="main-outline" d="M220 620 Q190 590, 150 610 L120 620 L150 630 Q190 650, 220 620 Z" />
    
    <!-- Whale Side Fin -->
    <path class="main-outline" d="M300 690 Q320 720, 350 710 Q380 680, 350 670 Q320 680, 300 690 Z" />
    
    <!-- Whale Blowhole - Simple arcs for "puffs" -->
    <path class="string-line" d="M490 500 Q500 480, 510 500" />
    <path class="string-line" d="M485 470 Q495 450, 505 470" />
    
    <!-- Whale Eye -->
    <circle class="detail-outline" cx="500" cy="570" r="10" />
    
    <!-- Whale Smile -->
    <path class="string-line" d="M490 600 Q500 620, 510 600" />

    <!-- Attachment point for balloon strings on whale -->
    <circle class="main-outline" cx="400" cy="710" r="15" />

    <!-- Balloon 1: Circle -->
    <circle class="main-outline" cx="300" cy="300" r="70" />
    <line class="string-line" x1="300" y1="370" x2="360" y2="700" />

    <!-- Balloon 2: Heart -->
    <path class="main-outline" d="M500 250 C460 190, 400 190, 400 250 C400 300, 460 350, 500 380 C540 350, 600 300, 600 250 C600 190, 540 190, 500 250 Z" />
    <line class="string-line" x1="500" y1="380" x2="400" y2="710" />

    <!-- Balloon 3: Star (simplified and rounded) -->
    <path class="main-outline" d="M680 300 L690 270 L720 260 L700 240 L710 200 L680 210 L650 200 L660 240 L630 260 L660 270 Z" />
    <line class="string-line" x1="680" y1="300" x2="440" y2="700" />

    <!-- Balloon 4: Oval/Ellipse -->
    <ellipse class="main-outline" cx="200" cy="450" rx="60" ry="90" />
    <line class="string-line" x1="200" y1="540" x2="340" y2="700" />
  </g>
</svg>