<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <g id="stars">
    <circle cx="100" cy="80" r="15" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="700" cy="120" r="12" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="250" cy="50" r="18" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="550" cy="70" r="14" fill="white" stroke="black" stroke-width="3"/>
    <circle cx="80" cy="200" r="10" fill="white" stroke="black" stroke-width="3"/>
  </g>

  <g id="whale">
    <!-- Whale body -->
    <path d="M150,450 C100,300 150,200 400,200 C650,200 700,300 650,450 C700,600 500,650 400,600 C300,650 100,600 150,450 Z" fill="white" stroke="black" stroke-width="5"/>
    <!-- Whale tail fin -->
    <path d="M100,450 C80,420 50,400 50,450 C50,500 80,480 100,450 Z" fill="white" stroke="black" stroke-width="4"/>
    <path d="M100,450 C80,480 50,500 50,450 C50,400 80,420 100,450 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Whale front fin -->
    <path d="M220,530 C180,500 180,450 220,430 C260,450 260,500 220,530 Z" fill="white" stroke="black" stroke-width="4"/>
    <!-- Whale eye -->
    <circle cx="450" cy="350" r="15" fill="white" stroke="black" stroke-width="3"/>
    <!-- Whale smile -->
    <path d="M420,390 Q450,410 480,390" fill="none" stroke="black" stroke-width="3"/>
    <!-- Whale blowhole water lines -->
    <path d="M370,220 C360,180 380,160 390,130" fill="none" stroke="black" stroke-width="3"/>
    <path d="M400,210 C390,170 410,150 420,120" fill="none" stroke="black" stroke-width="3"/>
  </g>

  <g id="basket">
    <rect x="350" y="580" width="100" height="60" rx="20" ry="20" fill="white" stroke="black" stroke-width="4"/>
    <!-- Basket ropes -->
    <line x1="375" y1="580" x2="350" y2="480" stroke="black" stroke-width="3"/>
    <line x1="425" y1="580" x2="450" y2="480" stroke="black" stroke-width="3"/>
  </g>

  <g id="balloons">
    <!-- Balloon 1 (oval) -->
    <ellipse cx="300" cy="480" rx="30" ry="40" fill="white" stroke="black" stroke-width="4"/>
    <line x1="300" y1="520" x2="350" y2="590" stroke="black" stroke-width="3"/>
    <!-- Balloon 2 (star) -->
    <path d="M450,450 L470,420 L490,450 L520,450 L500,470 L520,490 L490,490 L470,520 L450,490 L420,490 L440,470 L420,450 Z" fill="white" stroke="black" stroke-width="4"/>
    <line x1="470" y1="520" x2="425" y2="590" stroke="black" stroke-width="3"/>
    <!-- Balloon 3 (heart) -->
    <path d="M550,460 C550,440 565,420 585,420 C605,420 620,440 620,460 C620,490 585,520 585,520 C585,520 550,490 550,460 Z" fill="white" stroke="black" stroke-width="4"/>
    <line x1="585" y1="520" x2="450" y2="590" stroke="black" stroke-width="3"/>
    <!-- Balloon 4 (teardrop/whimsical) -->
    <path d="M220,420 C200,380 250,350 280,360 C310,370 290,400 280,420 C270,440 240,450 220,420 Z" fill="white" stroke="black" stroke-width="4"/>
    <line x1="250" y1="440" x2="350" y2="590" stroke="black" stroke-width="3"/>
  </g>

  <g id="clouds">
    <path d="M100,850 C50,800 100,750 200,750 C300,750 350,800 300,850 C250,900 150,900 100,850 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M350,880 C300,830 350,780 450,780 C550,780 600,830 550,880 C500,930 400,930 350,880 Z" fill="white" stroke="black" stroke-width="5"/>
    <path d="M600,860 C550,810 600,760 700,760 C800,760 850,810 800,860 C750,910 650,910 600,860 Z" fill="white" stroke="black" stroke-width="5"/>
  </g>
</svg>