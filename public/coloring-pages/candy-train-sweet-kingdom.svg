<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground / Path for train -->
  <path d="M0 800 Q200 750 400 800 T800 800" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Landscape Elements -->
  <g id="landscape">
    <!-- Giant Lollipops -->
    <g id="lollipop1">
      <rect x="50" y="550" width="15" height="200" rx="7.5" ry="7.5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="57.5" cy="550" r="70" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M57.5 480 A30 30 0 1 0 57.5 520 A30 30 0 1 1 57.5 480" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Lollipop swirl -->
    </g>
    <g id="lollipop2">
      <rect x="700" y="600" width="15" height="150" rx="7.5" ry="7.5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="707.5" cy="600" r="60" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M707.5 540 A25 25 0 1 0 707.5 570 A25 25 0 1 1 707.5 540" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Candy Canes -->
    <g id="candyCane1">
      <path d="M225 750 V550 C225 450 275 450 275 500 C275 550 225 550 225 550Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="230" y1="730" x2="270" y2="700" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="230" y1="680" x2="270" y2="650" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="230" y1="630" x2="270" y2="600" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="candyCane2">
      <path d="M625 700 V500 C625 400 675 400 675 450 C675 500 625 500 625 500Z" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="630" y1="680" x2="670" y2="650" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="630" y1="630" x2="670" y2="600" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="630" y1="580" x2="670" y2="550" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Gummy Bear Trees -->
    <g id="gummyBearTree1">
      <rect x="100" y="700" width="40" height="150" rx="20" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Trunk -->
      <ellipse cx="120" cy="550" rx="60" ry="80" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Gummy bear body -->
      <circle cx="80" cy="500" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Ear 1 -->
      <circle cx="160" cy="500" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Ear 2 -->
    </g>
    <g id="gummyBearTree2">
      <rect x="450" y="700" width="40" height="150" rx="20" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Trunk -->
      <ellipse cx="470" cy="550" rx="60" ry="80" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="430" cy="500" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Ear 1 -->
      <circle cx="510" cy="500" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Ear 2 -->
    </g>
  </g>

  <!-- Candy Train -->
  <g id="candyTrain">
    <!-- Locomotive -->
    <g id="locomotive">
      <!-- Main body -->
      <rect x="100" y="600" width="200" height="100" rx="20" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Cab -->
      <rect x="250" y="550" width="80" height="80" rx="15" ry="15" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front boiler -->
      <ellipse cx="100" cy="650" rx="40" ry="50" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Front light -->
      <circle cx="60" cy="650" r="15" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Lollipop Smokestack -->
      <rect x="182.5" y="500" width="15" height="50" rx="7.5" ry="7.5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="190" cy="480" r="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M190 450 A15 15 0 1 0 190 480 A15 15 0 1 1 190 450" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Candy Wheels -->
      <g id="locoWheels">
        <circle cx="150" cy="710" r="35" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="150" cy="710" r="20" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Inner swirl part -->
        <circle cx="270" cy="710" r="35" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="270" cy="710" r="20" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Coupling 1 -->
    <rect x="330" y="660" width="20" height="10" rx="5" ry="5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Train Car 1 -->
    <g id="trainCar1">
      <rect x="350" y="600" width="150" height="100" rx="20" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Wheels -->
      <g id="car1Wheels">
        <circle cx="390" cy="710" r="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="390" cy="710" r="15" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="460" cy="710" r="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="460" cy="710" r="15" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Passengers -->
      <g id="car1Passengers">
        <g id="gingerbread1">
          <rect x="370" y="630" width="40" height="50" rx="10" ry="10" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Body -->
          <circle cx="390" cy="630" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Head -->
          <circle cx="380" cy="625" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Eye 1 -->
          <circle cx="400" cy="625" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Eye 2 -->
          <path d="M380 635 Q390 645 400 635" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/> <!-- Mouth -->
          <circle cx="390" cy="650" r="4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Button 1 -->
          <circle cx="390" cy="665" r="4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/> <!-- Button 2 -->
        </g>
        <g id="candyChar1">
          <circle cx="450" cy="660" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="440" cy="655" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="460" cy="655" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M445 665 Q450 670 455 665" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- Coupling 2 -->
    <rect x="500" y="660" width="20" height="10" rx="5" ry="5" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Train Car 2 -->
    <g id="trainCar2">
      <rect x="520" y="600" width="150" height="100" rx="20" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Wheels -->
      <g id="car2Wheels">
        <circle cx="560" cy="710" r="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="560" cy="710" r="15" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="630" cy="710" r="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="630" cy="710" r="15" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Passengers -->
      <g id="car2Passengers">
        <g id="gingerbread2">
          <rect x="540" y="630" width="40" height="50" rx="10" ry="10" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="560" cy="630" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="550" cy="625" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="570" cy="625" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M550 635 Q560 645 570 635" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="560" cy="650" r="4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="560" cy="665" r="4" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g id="candyChar2">
          <circle cx="620" cy="660" r="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="610" cy="655" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="630" cy="655" r="3" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M615 665 Q620 670 625 665" stroke="black" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Marshmallow Clouds puffing from smokestack -->
  <g id="marshmallowClouds">
    <ellipse cx="250" cy="450" rx="50" ry="30" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="280" cy="420" rx="40" ry="25" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="230" cy="410" rx="45" ry="28" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="290" cy="390" rx="35" ry="20" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="210" cy="380" rx="40" ry="25" stroke="black" stroke-width="4" fill="white" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>