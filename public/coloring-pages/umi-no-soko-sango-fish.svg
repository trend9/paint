<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Clownfish -->
  <g id="clownfish" transform="translate(250 400)">
    <!-- Body -->
    <path d="M30 50 Q80 10 240 30 Q280 50 240 70 Q80 90 30 50Z"
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Tail fin -->
    <path d="M240 50 C260 20 290 30 280 50 C290 70 260 80 240 50Z"
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Dorsal fin -->
    <path d="M110 25 Q130 5 150 25 Q140 35 110 25Z"
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Pectoral fin -->
    <path d="M90 60 Q110 50 120 60 Q110 70 90 60Z"
          fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Stripes -->
    <rect x="65" y="15" width="20" height="70" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <rect x="165" y="15" width="20" height="70" rx="10" ry="10" fill="white" stroke="black" stroke-width="4"/>
    <!-- Eye -->
    <circle cx="55" cy="40" r="12" fill="white" stroke="black" stroke-width="4"/>
  </g>

  <!-- Coral Formations -->
  <g id="coral">
    <!-- Large coral base -->
    <path d="M0 900 Q100 800 200 850 Q300 900 400 880 Q500 920 600 870 Q700 950 800 900 L800 1000 L0 1000 Z"
          fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Smaller coral formations -->
    <path d="M50 850 Q70 750 150 780 Q200 820 180 880 L50 850 Z"
          fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M600 800 Q650 700 750 750 Q780 850 700 880 L600 800 Z"
          fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Top coral (like brain coral) -->
    <path d="M300 700 C 350 600 450 600 500 700 C 550 800 450 850 300 700 Z"
          fill="white" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Small coral bulb -->
    <circle cx="200" cy="700" r="40" fill="white" stroke="black" stroke-width="5"/>
  </g>

  <!-- Seaweed -->
  <g id="seaweed">
    <!-- Seaweed 1 -->
    <path d="M100 950 Q110 850 100 750 Q90 650 120 550"
          fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M100 950 Q120 860 110 760 Q100 660 130 560"
          fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Seaweed 2 -->
    <path d="M700 980 Q680 880 710 780 Q740 680 700 580"
          fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M700 980 Q690 890 720 790 Q750 690 710 590"
          fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Seaweed 3 -->
    <path d="M400 990 Q390 890 410 790 Q430 690 400 590"
          fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M400 990 Q410 900 420 800 Q440 700 410 600"
          fill="none" stroke="black" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Other Friendly Tropical Fish -->
  <g id="other-fish">
    <!-- Fish 1 (smaller) -->
    <g transform="translate(100 200) scale(0.7)">
      <path d="M30 50 Q80 10 240 30 Q280 50 240 70 Q80 90 30 50Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M240 50 C260 20 290 30 280 50 C290 70 260 80 240 50Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M110 25 Q130 5 150 25 Q140 35 110 25Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M90 60 Q110 50 120 60 Q110 70 90 60Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="55" cy="40" r="12" fill="white" stroke="black" stroke-width="4"/>
    </g>

    <!-- Fish 2 (larger, different shape, rotated) -->
    <g transform="translate(500 150) scale(0.9) rotate(-15)">
      <ellipse cx="150" cy="50" rx="120" ry="40" fill="white" stroke="black" stroke-width="4"/>
      <path d="M270 50 C290 30 310 40 300 50 C310 60 290 70 270 50Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M120 10 Q140 -5 160 10 Q150 20 120 10Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M100 70 Q120 60 130 70 Q120 80 100 70Z"
            fill="white" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="50" cy="40" r="12" fill="white" stroke="black" stroke-width="4"/>
    </g>
  </g>

  <!-- Bubbles -->
  <g id="bubbles">
    <circle cx="200" cy="150" r="15" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="230" cy="100" r="10" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="500" cy="250" r="20" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="530" cy="200" r="12" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="400" cy="300" r="18" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="650" cy="100" r="15" fill="none" stroke="black" stroke-width="3"/>
    <circle cx="150" cy="50" r="10" fill="none" stroke="black" stroke-width="3"/>
  </g>
</svg>